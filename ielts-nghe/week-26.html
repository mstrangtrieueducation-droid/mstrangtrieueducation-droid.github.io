</style></head><body><section id="entryGate" class="entry-screen"><div class="entry-card"><header class="entry-head"><small>IELTS - NGHE · TUẦN 26</small><h1>Listening Test 16</h1><p>Điền thông tin học sinh trước khi vào bài.</p></header><div class="entry-body"><p class="entry-note">Họ tên và lớp sẽ được giữ lại để gửi điểm sau khi hoàn thành bài.</p><label for="entryName">Họ và tên học sinh</label><input id="entryName" type="text" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"><label for="entryClass">Lớp IELTS</label><select id="entryClass"><option value="">Chọn lớp IELTS</option><option>IELTS 40</option><option>IELTS 41</option><option>IELTS 42</option><option>IELTS 43</option><option>IELTS 44</option><option>IELTS 45</option><option>IELTS 46</option><option>IELTS 47</option><option>IELTS 48</option><option>IELTS 49</option><option>IELTS 50</option><option>IELTS 51</option><option>IELTS 52</option><option>IELTS 53</option></select><button id="enterTest" type="button" disabled>Nhập họ tên và chọn lớp để vào bài</button></div></div></section><div id="testApp" hidden><header class="hero"><small>IELTS - NGHE · TUẦN 26</small><h1>Listening Test 16</h1><p>Full Test · Sections 1–4 · 40 questions</p></header><main class="shell"><nav id="sectionTabs" class="section-tabs"></nav><nav class="stage-tabs"><button type="button" data-stage="vocab">A · Từ vựng cần lưu ý</button><button type="button" data-stage="dictation">B · Điền chính tả</button><button type="button" data-stage="ielts">C · Câu hỏi IELTS</button><button type="button" data-stage="score">D · Nộp bài</button></nav><section id="content" class="lesson"></section></main></div><script>const DATA={"week":26,"test":16,"answers":{"1":["temporary"],"2":["doctor"],"3":["Africa"],"4":["youth"],"5":["May"],"6":["cheese"],"7":["Arbuthnot"],"8":["DG7 4PH","DG74PH"],"9":["Tuesday"],"10":["talk","presentation"],"11":["A"],"12":["C"],"13":["B"],"14":["B"],"15":["H"],"16":["C"],"17":["F"],"18":["G"],"19":["I"],"20":["B"],"21":["classification"],"22":["worst"],"23":["slides"],"24":["issues"],"25":["F"],"26":["A"],"27":["E"],"28":["C"],"29":["G"],"30":["B"],"31":["garden","gardens"],"32":["political"],"33":["work","study"],"34":["fountain"],"35":["social"],"36":["lively"],"37":["training"],"38":["culture"],"39":["nature"],"40":["silent"]},"sections":[{"number":1,"transcript":["BOB:                     Hello, Pembroke Cycling Holidays, Bob speaking.","MARGARET:        Oh hello. I’ve seen your advert for people to lead cycle trips. Are you the right person to speak to?","BOB:                     Yes, I am. Could I have your name, please?","MARGARET:        It’s Margaret Smith.","BOB:                     Are you looking for a permanent job, Margaret?","MARGARET:        No, temporary. I’ve got a permanent job starting in a few months’ time, and I want to do something else until then.","BOB:                     What work do you do?","MARGARET:        This will probably sound crazy – I used to be a lawyer, and then I made a complete career change and I’m going to be a doctor. I’ve just finished my training.","BOB:                     Right. And have you had any experience of leading cycle trips?","MARGARET:        Yes, I’ve led several bike tours in Africa. The trip to India that I had arranged to lead next month has now been cancelled, so when I saw you were advertising for tour leaders, I decided to apply.","BOB:                     OK. Now we normally have two or three leaders on a trip, depending on the size of the group. Some tours are for very experienced cyclists, but we’ve got a tour coming up soon in Spain, which is proving so popular we need an additional leader. It’s a cycling holiday for families. Would that suit you?","MARGARET:        It certainly would. I enjoy working with children, and I probable need some more experience before I go on a really challenging trip.","BOB:                     That tour includes several teenagers: have you worked with that age group before?","MARGARET:        Yes, I’m a volunteer worker in a youth club, where I help people to improve their cycling skills. Before that I helped out in a cycling club where I taught beginners.","BOB:                     Well that’s great. Now the trip I mentioned is just for a fortnight, but there might be the possibility of leading other tours after that. Would that fit in with your plans?","MARGARET:        That’s be fine. I’ll be free for five months. My job is due to start on October the 2nd, and I’m available from May the 1st until late September.","BOB:                     Good. Now is there anything I need to know about the food you eat? We usually have one or two people in the group who don’t eat meat, or have some sort of food allergy, so we’re always very careful about that.","MARGARET:        Yes, I’m allergic to cheese. Would that be a problem?","BOB:                     No, as long as we have enough notice, we can deal with that.","MARGARET:        That’s great.","——————","MARGARET:        It sounds really interesting – would you like me to fill in an application form?","BOB:                     Yes, please. Where should I post it to?","MARGARET:        Could you send it to 27 Arbuthnot Place – A-R-B-U-T-H-N-O-T – Place, Dumfries.","BOB:                     And what’s the postcode, please?","MARGARET:        DG7 4PH.","BOB:                     Was that P Papa or B Bravo?","MARGARET:        P Papa.","BOB:                     Got that. If you could return the application form by Friday this week, we can interview you on Tuesday next week. Say half past two. Would that be possible for you?","MARGARET:        Yes, it’s fine. You’re quite a long way from where I live, so I’ll drive over on Monday. Should I bring anything to the interview?","BOB:                     We’ll have your application form, of course, but we’ll need to see any certificates you’ve got that are relevant, in cycling, first aid, or whatever.","MARGARET:        OK.","BOB:                     And at t os":"Cụm danh từ (n phr.)","meaning":"sự chuyển hướng nghề nghiệp","example":"A career change requires careful planning and training.","exampleVi":"Chuyển hướng nghề nghiệp đòi hỏi kế hoạch và đào tạo cẩn thận."},{"word":"additional","ipa":"/əˈdɪʃənəl/","pos":"Tính từ (adj)","meaning":"thêm, bổ sung","example":"The popular tour needs an additional group leader.","exampleVi":"Chuyến đi nổi tiếng cần thêm một trưởng đoàn."},{"word":"volunteer","ipa":"/ˌvɒlənˈtɪə/","pos":"Danh từ (n)","meaning":"tình nguyện viên","example":"The volunteer helps teenagers improve their cycling skills.","exampleVi":"Tình nguyện viên giúp thanh thiếu niên cải thiện kỹ năng đạp xe."},{"word":"allergy","ipa":"/ˈælədʒi/","pos":"Danh từ (n)","meaning":"dị ứng","example":"Please mention any food allergy on the form.","exampleVi":"Hãy ghi mọi dị ứng thực phẩm vào biểu mẫu."},{"word":"relevant","ipa":"/ˈreləvənt/","pos":"Tính từ (adj)","meaning":"có liên quan","example":"Bring any certificates relevant to the cycling job.","exampleVi":"Hãy mang các chứng chỉ liên quan đến công việc đạp xe."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 1-10</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Complete the note below.</p>\n<p>Write&nbsp;<strong>ONE WORD AND/OR A NUMBER</strong>&nbsp;for each answer.</p>\n<table>\n<tbody>\n<tr>\n<td width=\"623\">\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Cycle tour leader: Applicant enquiry</strong></strong></p>\n</td>\n</tr>\n<tr>\n<td width=\"623\"><em>Example</em><p></p>\n<p>Name: Margaret ……….<em>Smith</em>………..</p></td>\n</tr>\n<tr>\n<td width=\"623\"><strong>About the applicant:</strong><p></p>\n<ul>\n<li>wants a <span class=\"question-item\"><strong class=\"q-number\">1< l>\n<p><strong>Interview:</strong></p>\n<ul>\n<li>interview at 2.30 pm on <span class=\"question-item\"><strong class=\"q-number\">9</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"9\" oninput=\"setQ(9,this.value)\"></span></li>\n<li>will plan a short <span class=\"question-item\"><strong class=\"q-number\">10</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"10\" oninput=\"setQ(10,this.value)\"></span>&nbsp;about being a tour guide</li>\n</ul>\n</td>\n</tr>\n</tbody>\n</table>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-16/section-1.mp3"},{"number":2,"transcript":["Welcome to this podcast about the Sheepmarket, which is one of the oldest parts of the city. As its name suggests, there was originally a market here where farmers brought their sheep, but now it’s been redeveloped into a buzzing, vibrant area of the city, which is also home to one of the city’s fastest-growing communities. The nearby university has always meant the area’s popular with students, who come in to enjoy the lively nightlife, but now graduates embarking on careers in the worlds of fashion and design are buying up the new apartments recently built here to replace the small houses where the market workers used to live.","The narrow old side streets are great places for finding original pictures, jewellery and ceramics which won’t break the bank, as well as local produce like fruit and vegetables. There’s also lots of pavement cafes where you can have a coffee and watch tourists from all over the world go by. The oldest buildings in the area are on the main streets, including the city’s first department store, built in the 1880s, which is still open today.","The Sheepmarket is a centre for fashion, and there’s a policy of encouraging new young designers. The Young Fashion competition is open to local young people who are passionate about fashion. This year they’ve been asked to design an outfit based on ideas from the music and technology that’s part of their everyday life, using both natural and man-made fibres. The garments will be judged by a panel of experts and fashion designers, and the winning entries will be modelled at a special gala evening.","Parking at the Sheepmarket is easy. There are plenty of pay and display car parking spaces on the roadsides which are fine if you just want to stay for an hour or two, but if you want to spend the day there it’s better to park in one of the four underground car parks. It’s not expensive and if you can present a receipt from one of the local stores, you’ll not be charged at all. After six pm many of the car parks have a flat rate which varies but it is usually very reasonable.","————————","The Sheepmarket is one of the main centres for art and history in the whole of the country. If you look at our map, you’ll see some of the main attractions there. Most visitors start from Crawley Road, at the bottom of the map. The Reynolds House is one of the oldest houses in the city, and is open to the public. It’s on the north side of Crawley Road, next to the footpath that leads to the public gardens.","The area’s particularly interesting for its unusual sculptures. The Thumb’s is just what its name suggests, but it’s about 10 metres high. You’ll see it on Hill Road, across the road from the Bank.","The Museum’s got a particularly fine collection of New Zealand landscapes. It’s on the east side of the Sheepmarket, on City Road. It’s on the other side of the road from the public gardens, immediately facing the junction with Hill Road.","The Contemporary Art Gallery is on a little road that leads off Station Square, not far from the public gardens. The road ends at the gallery – it doesn’t go anywhere else. That’s open every day except Mondays.","The Warner Gallery specialises in 19th-century art. It’s on City Road, near the junction with Crawley Road, on the same side of the road as the public gardens. It’s open on weekdays from 9 to 5, and entry is free.","Finally, if you’re interested in purchasing high quality artwork, the place to go is Nucleus. You need to go from Crawley Road up through Station Square and east along Hill Road until you get to a small winding road turning off. Go up there and it’s on your right – if you get to City Road you’ve gone too far."],"cloze":"<p>Welcome to this podcast about the Sheepmarket, which is <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>. As its name suggests, there was originally a market here where farmers brought their sheep, but now it’s been <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> of the city, which is also home to one of the city’s <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>. The nearby university has always meant the area’s <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>, who come in to enjoy the lively nightlife, but now <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> in the worlds of fashion and design are <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span> recently built here to replace the small houses where the market workers used to live.</p><p>The narrow old side streets are great places for finding <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span> which <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>, as well as local produce like fruit and vegetables. There’s also lots of pavement cafes where you can have a coffee and watch tourists from all over the world go by. The oldest buildings in the area are on the main streets, including the city’s first department store, built in the 1880s, which is still open today.</p><p>The Sheepmarket is a centre for fashion, and there’s a policy of <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span>. The Young Fashion competition is open to local young people who are <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>. This year they’ve been asked to design an outfit based on <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span> that’s part of their everyday life, using both <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span>. The garments will be <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span> and fashion designers, and the winning entries will be modelled at a special gala evening.</p><p>Parking at the Sheepmarket is easy. There are plenty of pay and display car parking spaces on the roadsides which are fine if you just want to stay for an hour or two, but if you want to spend the day there it’s better to park in one of the four underground car parks. It’s not expensive and if you can <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span> from one of the local stores, you’ll not be charged at all. After six pm many of the car parks have <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span> which varies but it is usually very reasonable.</p><p>————————</p><p>The Sheepmarket is one of the main centres for art and history in the whole of the country. If you look at our map, you’ll see some of the main attractions there. Most visitors start from Crawley Road, at the bottom of the map. The Reynolds House is one of the oldest houses in the city, and is open to the public. It’s on the north side of Crawley Road, <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span> that leads to the public gardens.</p><p>The area’s particularly interesting for its <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span>. The Thumb’s is just what its name suggests, but it’s about 10 metres high. You’ll see it on Hill Road, across the road from the Bank.</p><p>The Museum’s got a particularly fine collection of New Zealand landscapes. It’s on the east side of the Sheepmarket, on City Road. It’s on the other side of the road from the public gardens, <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>.</p><p>The Contemporary Art Gallery is on a little road that leads off Station Square, not far from the public gardens. The road ends at the gallery – it doesn’t go anywhere else. That’s open every day except Mondays.</p><p>The Warner Gallery <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span>. It’s on City Road, near the junction with Crawley Road, on the same side of the road as the public gardens. It’s open on weekdays from 9 to 5, and entry is free.</p><p>Finally, if you’re interested in purchasing high quality artwork, the place to go is Nucleus. You need to go from Crawley Road up through Station Square and east along Hill Road until you get to <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>. Go up there and it’s on your right – if you get to City Road you’ve gone too far.</p>","clozeAnswers":["one of the oldest parts of the city","redeveloped into a buzzing, vibrant area","fastest-growing communities","popular with students","graduates embarking on careers","buying up the new apartments","original pictures, jewellery and ceramics","won’t break the bank","encouraging new young designers","passionate about fashion","ideas from the music and technology","natural and man-made fibres","judged by a panel of experts","present a receipt","a flat rate","next to the footpath","unusual sculptures","immediately facing the junction with Hill Road","specialises in 19th-century art","a small winding road turning off"],"vocab":[{"word":"vibrant","ipa":"/ˈvaɪbrənt/","pos":"Tính từ (adj)","meaning":"sôi động, đầy sức sống","example":"The old market is now a vibrant neighbourhood.","exampleVi":"Khu chợ cũ nay là một khu phố sôi động."},{"word":"embark on","ipa":"/ɪmˈbɑːk ɒn/","pos":"Cụm động từ (phr.v)","meaning":"bắt đầu, bước vào","example":"Many graduates embark on careers in design.","exampleVi":"Nhiều sinh viên tốt nghiệp bắt đầu sự nghiệp trong ngành thiết kế adio\" name=\"q20\" value=\"G\" data-q=\"20\" onchange=\"setQ(20,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q20\" value=\"H\" data-q=\"20\" onchange=\"setQ(20,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q20\" value=\"I\" data-q=\"20\" onchange=\"setQ(20,this.value)\"></td></tr></tbody></table>                                                                                                                                                                                        </div>\n                                        </div>","audio":"./audio/test-16/section-2.mp3"},{"number":3,"transcript":["KATIE:   Joe, you know I’m giving a presentation in our film studies class next week?","JOE:       Yes.","KATIE:   Well, could we discuss it? I could do with getting someone else’s opinion.","JOE:       Of course, Katie. What are you going to talk about?","KATIE:   It’s about film adaptations of Shakespeare’s plays. I’ve got very interested in all the different approaches that film directors take.","JOE:       Uhuh.","KATIE:   So I thought I’d start with Giannetti, who’s professor of film and literature, and in one of his books he came up with a straightforward classification of film adaptations based on how faithful they are to the original plays and novels.","JOE:       Right.","KATIE:   I’ve already made some notes on that, so I just need to sort those out before the presentation. I thought that next I’d ask the class to come up with the worst examples of Shakespeare adaptations that they’ve seen, and to say why. That should be more fun than having their favourite versions.","JOE:       Yes, I can certainly think of a couple!","KATIE:   Right. Next I want to talk about Rachel Malchow. I came across something on the internet about her work on film adaptations, and I was thinking of showing some film clips to illustrate her ideas.","JOE:       Will you have enough time, though? Both to prepare and during the presentation? After all, I doubt if you’ll be able to find all the clips you want.","KATIE:   Hmm. Perhaps you’re right. OK, well, I’d better do some slides instead, saying how various films relate to what she says. That should encourage discussion.","JOE:       Mmm.","KATIE:   Next I want to say something about how plays may be chosen for adaptation because they’re concerned with issues of the time when the film is made.","JOE:       You mean things like patriotism, or the role of governments?","KATIE:   Exactly. It’s quite tricky, but I’ve got a few ideas I’d like to discuss.","———————","KATIE:   And finally I want to talk about a few adaptations that I think illustrate a range of approaches, and make some comments on them. Do you know the Japanese film Ran?","JOE:       I haven’t seen it. It was based on Shakespeare’s King Lear, wasn’t it?","KATIE:   That’s right. It was a very loose adaptation, using the same situation and story, but moving it to 16th century Japan instead of 16th century Britain. So for example the king’s daughters become sons, because in Japanese culture at that time, women couldn’t succeed to the throne.","JOE:       OK. I hope you’re going to talk about the 1993 film of Much Ado About Nothing. I think that’s one of the best Shakespeare films. It really brings the play to life, doesn’t it?","KATIE:   Yes, I agree. And I think filming it in Italy, where the play is set, makes you see what life was like at the time of the play.","JOE:       Absolutely. Right, what’s next?","KATIE:   Er, next, I thought Romeo & Juliet, the 1996 film, which moves the action into the present day.","JOE:       Yes, it worked really well, I thought – changing the two feuding families in the original to two competing business empires, even though they’re speaking in the English of the original play.","KATIE:   You’d expect it would sound really bizarre, but I found I soon got used to it.","JOE:       Me too.","KATIE:   Then I thought I’d include a real Hollywood film, one that’s intended to appeal to a mass commercial audience.","JOE:       There must be quite a number of those.","KATIE:   Yes, but I’ve picked the 1996 film of Hamlet. It included every line of the text, but it’s more like a typical action hero movie – there are loads of special effects, but no unifying interpretation of the play.","JOE:       All show and no substance.","KATIE:   Exactly. Then there’s Prospero’s Books, based on The Tempest. That was really innovative, from a stylistic point of view.","JOE:       Didn’t it include dance and singing and animation, as well as live actors?","KATIE:   Yes, it did. I also want to mention Looking for Richard. Did you ever see it?","JOE:       No, but I’ve read about it. It was a blend of a documentary with a few scenes from Richard III, wasn’t it?","KATIE:   That’s right. It’s more a way of looking into how people nowadays connect with the playwright – the play is really just the starting point. And that’ll be where I finish.","JOE:       Well, it sounds as though it’ll be very interesting."],"cloze":"<p>KATIE:   Joe, you know I’m giving a presentation in our film studies class next week?</p><p>JOE:       Yes.</p><p>KATIE:   Well, could we discuss it? I could do with getting someone else’s opinion.</p><p>JOE:       Of course, Katie. What are you going to talk about?</p><p>KATIE:   It’s about <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>. I’ve got very interested in <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> that film directors take.</p><p>JOE:       Uhuh.</p><p>KATIE:   So I though t worked really well, I thought – changing the two feuding families in the original to <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>, even though they’re speaking in the English of the original play.</p><p>KATIE:   You’d expect it would sound really bizarre, but I found I soon got used to it.</p><p>JOE:       Me too.</p><p>KATIE:   Then I thought I’d include a real Hollywood film, one that’s intended to appeal to <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span>.</p><p>JOE:       There must be quite a number of those.</p><p>KATIE:   Yes, but I’ve picked the 1996 film of Hamlet. It included every line of the text, but it’s more like a typical action hero movie – there are <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>, but no unifying interpretation of the play.</p><p>JOE:       All show and no substance.</p><p>KATIE:   Exactly. Then there’s Prospero’s Books, based on The Tempest. That was really innovative, from a stylistic point of view.</p><p>JOE:       Didn’t it include <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span>, as well as live actors?</p><p>KATIE:   Yes, it did. I also want to mention Looking for Richard. Did you ever see it?</p><p>JOE:       No, but I’ve read about it. It was <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span> with a few scenes from Richard III, wasn’t it?</p><p>KATIE:   That’s right. It’s more a way of looking into how people nowadays connect with the playwright – the play is really just the starting point. And that’ll be where I finish.</p><p>JOE:       Well, it sounds as though it’ll be very interesting.</p>","clozeAnswers":["film adaptations of Shakespeare’s plays","all the different approaches","a straightforward classification","how faithful they are to the original plays and novels","sort those out before the presentation","the worst examples of Shakespeare adaptations","showing some film clips","find all the clips you want","do some slides instead","concerned with issues of the time","a range of approaches","a very loose adaptation","moving it to 16th century Japan","women couldn’t succeed to the throne","filming it in Italy","two competing business empires","a mass commercial audience","loads of special effects","dance and singing and animation","a blend of a documentary"],"vocab":[{"word":"adaptation","ipa":"/ˌædæpˈteɪʃən/","pos":"Danh từ (n)","meaning":"bản chuyển thể","example":"The students compare each film adaptation carefully.","exampleVi":"Các sinh viên so sánh cẩn thận từng bản chuyển thể phim."},{"word":"classification","ipa":"/ˌklæsɪfɪˈkeɪʃən/","pos":"Danh từ (n)","meaning":"sự phân loại","example":"A clear classification makes the presentation easier to follow.","exampleVi":"Cách phân loại rõ ràng giúp bài thuyết trình dễ theo dõi hơn."},{"word":"faithful","ipa":"/ˈfeɪθfəl/","pos":"Tính từ (adj)","meaning":"trung thành, sát với bản gốc","example":"Some films remain faithful to the original play.","exampleVi":"Một số bộ phim vẫn trung thành với vở kịch gốc."},{"word":"illustrate","ipa":"/ˈɪləstreɪt/","pos":"Động từ (v)","meaning":"minh họa, làm rõ","example":"Short clips illustrate the students' main points.","exampleVi":"Các đoạn phim ngắn minh họa những ý chính của sinh viên."},{"word":"bizarre","ipa":"/bɪˈzɑː/","pos":"Tính từ (adj)","meaning":"kỳ lạ, khác thường","example":"The film uses a bizarre historical setting.","exampleVi":"Bộ phim sử dụng một bối cảnh lịch sử kỳ lạ."},{"word":"innovative","ipa":"/ˈɪnəvətɪv/","pos":"Tính từ (adj)","meaning":"đổi mới, sáng tạo","example":"The director chose an innovative approach to Hamlet.","exampleVi":"Đạo diễn chọn một cách tiếp cận sáng tạo cho Hamlet."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 21-24</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Complete the table below.</p>\n<p><em>Write&nbsp;<strong>ONE WORD ONLY</strong>&nbsp;for each answer.</em></p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Presentation of film adaptations of Shakespeare’s plays</strong></strong></p>\n<table>\n<tbody>\n<tr>\n<td width=\"264\"><strong>Stages of presentation</strong></td>\n<td width=\"258\"><strong>Work still to be done</strong></td>\n</tr>\n<tr>\n<td width=\"264\">Introduce Giannetti’s book containing a <span class=\"question-item\"><strong class=\"q-number\">21</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"21\" oninput=\"setQ(21,this.value)\"></span>&nbsp;of adaptations</td>\n<td width=\"258\">Organise notes</td>\n</tr>\n<tr>\n<td width=\"264\">Ask class to suggest the <span class=\"question-item\"><strong class=\"q-number\">22</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"22\" oninput=\"setQ(22,this.value)\"></span>&nbsp;adaptations</td>\n<td width=\"258\">No further work needed</td>\n</tr>\n<tr>\n<td width=\"264\">Present Rachel Malchow’s ideas</td>\n<td width=\"258\">Prepare some <span class=\"question-item\"><strong class=\"q-number\">23</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"23\" oninput=\"setQ(23,this.value)\"></span></td>\n</tr>\n<tr>\n<td width=\"264\">Discuss relationship between adaptations and <span class=\"question-item\"><strong class=\"q-number\">24</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"24\" oninput=\"setQ(24,this.value)\"></span>&nbsp;at the time of making the film</td>\n<td width=\"258\">No further work needed</td>\n</tr>\n</tbody>\n</table>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 25-30</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>What do the speakers say about each of the following films?</p>\n<p><em>Choose&nbsp;<strong>SIX</strong>&nbsp;answers from the box and write the correct letter,&nbsp;<strong>A-G</strong>, next to questions.</em></p>\n<p><strong>Comments</strong></p>\n<p><strong>Films</strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                                <div class=\"matching-dnd-questions\"><div class=\"question-item\"> • <span><em>Ran</em></span><span class=\"inline-choice\"><strong class=\"q-number\">25</strong><select data-q=\"25\" onchange=\"setQ(25,this.value)\" aria-label=\"Question 25\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span><em>Much Ado About Nothing</em></span><span class=\"inline-choice\"><strong class=\"q-number\">26</strong><select data-q=\"26\" onchange=\"setQ(26,this.value)\" aria-label=\"Question 26\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span><em>Romeo &amp; Juliet</em></span><span class=\"inline-choice\"><strong class=\"q-number\">27</strong><select data-q=\"27\" onchange=\"setQ(27,this.value)\" aria-label=\"Question 27\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span><em>Hamlet</em></span><span class=\"inline-choice\"><strong class=\"q-number\">28</strong><select data-q=\"28\" onchange=\"setQ(28,this.value)\" aria-label=\"Question 28\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span><em>Prospero’s Books</em></span><span class=\"inline-choice\"><strong class=\"q-number\">29</strong><select data-q=\"29\" onchange=\"setQ(29,this.value)\" aria-label=\"Question 29\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span><em>Looking for Richard</em></span><span class=\"inline-choice\"><strong class=\"q-number\">30</strong><select data-q=\"30\" onchange=\"setQ(30,this.value)\" aria-label=\"Question 30\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div></div>                                                                        <div class=\"option-bank\"><div><b>A</b> clearly shows the historical period</div><div><b>B</b> contains only parts of the play</div><div><b>C</b> is too similar to another kind of film</div><div><b>D</b> turned out to be unpopular with audiences</div><div><b>E</b> presents the play in a different period from the original</div><div><b>F</b> sets the original in a different country</div><div><b>G</b> incorporates a variety of art forms</div></div>\n                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>\n                                        </div>","audio":"./audio/test-16/section-3.mp3"},{"number":4,"transcript":["This lecture will be about the science of acoustics, the study of sound, in relation to urban environments such as cities. As an acoustic engineer myself, I think this is an area where we’re likely to see great changes. In the past, researching urban soundscapes was simple. We measured levels of sound in decibels, so I used to take my sound meter and I measured the noise somewhere, and then I might ask a sample of people to say at what level the sound became annoying.","With data like this, acoustic engineers have been able to build up what we call noise maps, maps of the sound environment. But actually these aren’t a lot of use. What they do show is that the highest noise levels are generally on roads – well, that’s not really very surprising. But there’s quite a lot going on that these maps don’t show, because they can’t capture the complex way that sound varies over time. So they ignore important issues such as the noise someone might hear from the open windows or gardens of their neighbours, and this sort of noise can be quite significant in summer. We don’t have any databases on this sort of information. As well as that, these records of sound levels take no account of the fact that people vary in their perceptions of noise – so someone like me with years of working in acoustics might be very different from you in that regard.","But anyway, even though these noise maps are fairly crude, they’ve been useful in providing information and raising awareness that noise matters, we need to deal with it and so it’s a political matter. And that’s important – we need rules and regulation because noise can cause all sorts of problems.","Those of you who are city-dwellers know that things go on 24 hours a day, so city-dwellers often suffer from interrupted sleep. It’s also known that noise can lead to a rise in levels of stress, due to physical changes in the body affecting the composition of the blood. And there are other problems as well, for instance if schoolchildren don’t have a quiet place to study, their work will suffer.","Now, one problem with decibel measurement is that it doesn’t differentiate between different types of noise. Some types of sounds that most people would probably think of as nice and relaxing might well score quite highly in decibel levels – think of the sound made by a fountain in a town square, for example. That’s not necessarily something that we’d want to control or reduce. So maybe researchers should consider these sorts of sounds in urban design. This is going to be tricky because just measuring decibel levels isn’t going to help us here. Instead, many researchers are using social science techniques, studying people’s emotional response to sound by using questionnaires and so on.","So what exactly do people want to hear in an urban environment? Some recent interdisciplinary research has come out with results that at first sight seem contradictory – a city needs to have a sense of activity, so it needs to be lively, with sounds like the clack of high heels on a pavement or the hiss of a coffee machine, but these mustn’t be too intrusive, because at the same time we need to be able to relax.","One of the major problems in achieving this will be getting architects and town planners to use the research. Apart from studying the basics of acoustics, these people receive very little training in this area. But in fact they should be regarding sound as an opportunity to add to the experience of urban living, whereas at present they tend to see it as something to be avoided or reduced as far as possible, or something that’s just a job for engineers like the street drainage system.","What’s needed is for noise in cities to be regarded as an aesthetic quality, as something that has the qualities of an art form. If we acknowledge this, then we urgently need to know what governs it and how designers can work with it. We need to develop a complex understanding of many factors. What is the relationship between sound and culture? What can we learn from disciplines such as psychology about the way that sound interacts with human development and social relationships, and the way that sound affects our thought and feelings? Can we learn anything from physics about the nature of sound itself?","Today’s powerful technologies can also help us. To show us their ideas and help us to imagine the effect their buildings will have, architects and town planners already use virtual reality – but these programs are silent. In the future such programs could use realistic sounds, meaning that soundscapes could be explored before being built. So hopefully, using the best technology we can lay our hands on, the city of the future will be a pleasure to the ears as well as the eyes."],"cloze":"<p>This lecture will be about <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>, the study of sound, in relation to <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>. As an acoustic engineer myself, I think this is an area where we’re likely to see great changes. In the past, researching urban soundscapes was simple. We <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>, so I used to take my sound meter and I measured the noise somewhere, and then I might ask <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> to say at what level the sound became annoying.</p><p>With data like this, acoustic engineers
