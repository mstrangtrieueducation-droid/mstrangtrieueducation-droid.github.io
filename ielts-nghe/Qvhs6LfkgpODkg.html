</style></head><body><section id="entryGate" class="entry-screen"><div class="entry-card"><header class="entry-head"><small>IELTS - NGHE · TUẦN 40</small><h1>Listening Test 30</h1><p>Điền thông tin học sinh trước khi vào bài.</p></header><div class="entry-body"><p class="entry-note">Họ tên và lớp sẽ được giữ lại để gửi điểm sau khi hoàn thành bài.</p><label for="entryName">Họ và tên học sinh</label><input id="entryName" type="text" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"><label for="entryClass">Lớp IELTS</label><select id="entryClass"><option value="">Chọn lớp IELTS</option><option>IELTS 40</option><option>IELTS 41</option><option>IELTS 42</option><option>IELTS 43</option><option>IELTS 44</option><option>IELTS 45</option><option>IELTS 46</option><option>IELTS 47</option><option>IELTS 48</option><option>IELTS 49</option><option>IELTS 50</option><option>IELTS 51</option><option>IELTS 52</option><option>IELTS 53</option></select><button id="enterTest" type="button" disabled>Nhập họ tên và chọn lớp để vào bài</button></div></div></section><div id="testApp" hidden><header class="hero"><small>IELTS - NGHE · TUẦN 40</small><h1>Listening Test 30</h1><p>Full Test · Sections 1–4 · 40 questions</p></header><main class="shell"><nav id="sectionTabs" class="section-tabs"></nav><nav class="stage-tabs"><button type="button" data-stage="vocab">A · Từ vựng cần lưu ý</button><button type="button" data-stage="dictation">B · Điền chính tả</button><button type="button" data-stage="ielts">C · Câu hỏi IELTS</button><button type="button" data-stage="score">D · Nộp bài</button></nav><section id="content" class="lesson"></section></main></div><script>const DATA={"week":40,"test":30,"sourceRef":"Cambridge IELTS 16 Academic Listening Test 2","answers":{"1":["frame"],"2":["195"],"3":["payment"],"4":["Grandparents"],"5":["colour","color"],"6":["hand"],"7":["background"],"8":["focus"],"9":["ten","10 days"],"10":["plastic"],"11":["C"],"12":["B"],"13":["A"],"14":["A"],"15":["C"],"16":["D"],"17":["A"],"18":["B"],"19":["B","C"],"20":["B","C"],"21":["B"],"22":["A"],"23":["C"],"24":["C"],"25":["history"],"26":["paper"],"27":["humans","people"],"28":["stress"],"29":["graph"],"30":["evaluate"],"31":["creativity"],"32":["therapy"],"33":["fitness"],"34":["balance"],"35":["brain"],"36":["motivation"],"37":["isolation"],"38":["calories"],"39":["obesity"],"40":["habit"]},"sections":[{"number":1,"transcript":["EMPLOYEE: Hello, Picturerep. Can I help you?","WOMAN: Oh, hi. I saw your advertisement about copying pictures to disk and I’d like a bit more information about what you do.","EMPLOYEE: Sure. What would you like to know?","WOMAN: Well, I’ve got a box full of old family photos that’s been up in the attic for years, some of them must be 50 or 60 years old, and I’d like to get them converted to digital format.","EMPLOYEE: Sure, we can do that for you.","WOMAN: Right. And what about size? The photos are all sorts of sizes – are there any restrictions?","EMPLOYEE: Well the maximum size of photo we can do with our normal services is 30 centimetres. And each picture must be at least 4 centimetres, that’s the minimum we can cope with.","WOMAN: That should be fine. And some of them are in a frame – should I take them out before I send them?","EMPLOYEE: Yes please, we can’t copy them otherwise. And also the photos must all be separate, they mustn’t be stuck into an album.","WOMAN: OK, that’s not a problem. So can you give me an idea of how much this will cost? I’ve got about 360 photos I think.","EMPLOYEE: We charge £195 for 300 to 400 photos for the basic service.","WOMAN: OK. And does that include the disk?","EMPLOYEE: Yes, one disk – but you can get extra ones for £5 each.","WOMAN: That’s good. So do I need to pay when I send you the photos?","EMPLOYEE: No, we won’t need anything until we’ve actually copied the pictures. Then we’ll let you know how much it is, and once we’ve received the payment, we’ll send the parcel off to you.","WOMAN: Right.","—————————","EMPLOYEE: Is there anything else you’d like to ask about our services?","WOMAN: Yes. I’ve roughly sorted out the photos into groups, according to what they’re about – so can you keep them in those groups when you copy them?","EMPLOYEE: Sure. We’ll save each group in a different folder on the disk and if you like, you can suggest a name for each folder.","WOMAN: So I could have one called ‘Grandparents’ for instance?","EMPLOYEE: Exactly.","WOMAN: And do you do anything besides scan the photos? Like, can you make any improvements?","EMPLOYEE: Yes, in the standard service each photo is checked, and we can sometimes touch up the colour a bit, or improve the contrast – that can make a big difference.","WOMAN: OK. And some of the photos are actually quite fragile – they won’t get damaged in the process, will they?","EMPLOYEE: No, if any look particularly fragile, we’d do them by hand. We do realise how precious these old photos can be.","WOMAN: Sure.","EMPLOYEE: And another thing is we can make changes to a photo if you want – so if you want to remove an object from a photo, or maybe alter the background, we can do that.","WOMAN: Really? I might be interested in that. I’ll have a look through the photos and see. Oh, and talking of fixing photos – I’ve got a few that aren’t properly in focus. Can you do anything to make that better?","EMPLOYEE: No, I’m afraid that’s one thing we can’t do.","WOMAN: OK.","EMPLOYEE: Any other information I can give you?","WOMAN: Er … oh, how long will it all take?","EMPLOYEE: We aim to get the copying done in ten days.","WOMAN: Fine. Right, well I’ll get the photos packed up in a box and post them off to you.","EMPLOYEE: Right. If you’ve got a strong cardboard box, that’s best. We’ve found that plastic ones sometimes break in the post.","WOMAN: OK. Right, thanks for your help. Bye.","EMPLOYEE: Bye."],"cloze":"<p>EMPLOYEE: Hello, Picturerep. Can I help you?</p><p>WOMAN: Oh, hi. I saw your <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" en I send you the photos?</p><p>EMPLOYEE: No, we <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span> until we’ve <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span>. Then we’ll let you know how much it is, and once we’ve received the payment, we’ll send the parcel off to you.</p><p>WOMAN: Right.</p><p>—————————</p><p>EMPLOYEE: Is there anything else you’d like to ask about our services?</p><p>WOMAN: Yes. I’ve <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>, according to what they’re about – so can you keep them in those groups when you copy them?</p><p>EMPLOYEE: Sure. We’ll save each <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span> on the disk and if you like, you can suggest a name for each folder.</p><p>WOMAN: So I could have one <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span>?</p><p>EMPLOYEE: Exactly.</p><p>WOMAN: And do you do anything besides scan the photos? Like, can you make any improvements?</p><p>EMPLOYEE: Yes, in the <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span> is checked, and we can sometimes touch up the colour a bit, or improve the contrast – that can make a big difference.</p><p>WOMAN: OK. And some of the <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span> – they won’t get damaged in the process, will they?</p><p>EMPLOYEE: No, if any <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span>, we’d do them by hand. We do realise how precious these old photos can be.</p><p>WOMAN: Sure.</p><p>EMPLOYEE: And another thing is we can make changes to a photo if you want – so if you want to remove an object from a photo, or <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>, we can do that.</p><p>WOMAN: Really? I might be interested in that. I’ll have a look through the photos and see. Oh, and <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> – I’ve got a few that aren’t properly in focus. Can you do anything to make that better?</p><p>EMPLOYEE: No, I’m afraid that’s one thing we can’t do.</p><p>WOMAN: OK.</p><p>EMPLOYEE: Any other <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span> you?</p><p>WOMAN: Er … oh, how long will it all take?</p><p>EMPLOYEE: We aim to get the copying done in ten days.</p><p>WOMAN: Fine. Right, well I’ll get the photos packed up in a box and post them off to you.</p><p>EMPLOYEE: Right. If you’ve <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span>, that’s best. We’ve found that <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span> in the post.</p><p>WOMAN: OK. Right, thanks for your help. Bye.</p><p>EMPLOYEE: Bye.</p>","clozeAnswers":["advertisement about copying pictures","full of old family photos","converted to digital format","normal services is 30 centimetres","we can’t copy them otherwise","photos must all be separate","photos for the basic service","won’t need anything","actually copied the pictures","roughly sorted out the photos into groups","group in a different folder","called ‘Grandparents’ for instance","standard service each photo","photos are actually quite fragile","look particularly fragile","maybe alter the background","talking of fixing photos","information I can give","got a strong cardboard box","plastic ones sometimes break"],"vocab":[{"word":"improvements","ipa":"/ɪmˈpɹuːvmənts/","pos":"Danh từ (n)","meaning":"cải tiến","example":"Like, can you make any improvements?","exampleVi":"Trong câu trên, “improvements” mang nghĩa “cải tiến”."},{"word":"restrictions","ipa":"/ɹɪˈstɹɪkʃənz/","pos":"Danh từ (n)","meaning":"hạn chế","example":"The photos are all sorts of sizes – are there any restrictions?","exampleVi":"Trong câu trên, “restrictions” mang nghĩa “hạn chế”."},{"word":"converted","ipa":"/kənˈvɜːtɪd/","pos":"Động từ (v)","meaning":"được chuyển đổi","example":"Well, I’ve got a box full of old family photos that’s been up in the attic for years, some of them must be 50 or 60 years old, and I’d like to get them converted to digital format.","exampleVi":"Trong câu trên, “converted” mang nghĩa “được chuyển đổi”."},{"word":"contrast","ipa":"/ˈkɒntɹɑːst/","pos":"Danh từ (n)","meaning":"tương phản","example":"Yes, in the standard service each photo is checked, and we can sometimes touch up the colour a bit, or improve the contrast – that can make a big difference.","exampleVi":"Trong câu trên, “contrast” mang nghĩa “tương phản”."},{"word":"properly","ipa":"/ˈprɒpəli/","pos":"Trạng từ (adv)","meaning":"đúng cách/rõ nét","example":"Oh, and talking of fixing photos – I’ve got a few that aren’t properly in focus.","exampleVi":"Trong câu trên, “properly” mang nghĩa “đúng cách/rõ nét”."},{"word":"another","ipa":"/æˈnʌð.ə(ɹ)/","pos":"Từ hạn định (det.)","meaning":"một điều nữa/thêm một","example":"And another thing is we can make changes to a photo if you want – so if you want to remove an object from a photo, or maybe alter the background, we can do that.","exampleVi":"Trong câu trên, “another” mang nghĩa “một điều nữa/thêm một”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 1-10</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Complete the notes below.</p>\n<p>Write&nbsp;<strong>ONE WORD AND/OR A NUMBER</strong>&nbsp;for each answer.</p>\n<table>\n<tbody>\n<tr>\n<td width=\"623\">\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Copying photos to digital format</strong></strong></p>\n</td>\n</tr>\n<tr>\n<td width=\"623\"><strong>Name of company: Picturerep</strong></td>\n</tr>\n<tr>\n<td width=\"623\"><strong>Requirements</strong><p></p>\n<ul>\n<li>Maximum size of photos is 30 cm, minimum size 4 cm.</li>\n<li>Photos must not be in a <span class=\"question-item\"><strong class=\"q-number\">1</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"1\" oninput=\"setQ(1,this.value)\"></span>&nbsp;or an album.</li>\n</ul>\n<p><strong>Cost</strong></p>\n<ul>\n<li>The cost for 360 photos is £<span class=\"question-item\"><strong class=\"q-number\">2</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"2\" oninput=\"setQ(2,this.value)\"></span> (including one disk).</li>\n<li>Before the complete order is sent, <span class=\"question-item\"><strong class=\"q-number\">3</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"3\" oninput=\"setQ(3,this.value)\"></span>&nbsp;is required.</li>\n</ul>\n<p><strong>Services</strong>&nbsp;<strong>included</strong>&nbsp;<strong>in the price</strong></p>\n<ul>\n<li>Photos can be placed in a folder, e.g. with the name <span class=\"question-item\"><strong class=\"q-number\">4</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"4\" oninput=\"setQ(4,this.value)\"></span>.</li>\n<li>The <span class=\"question-item\"><strong class=\"q-number\">5</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"5\" oninput=\"setQ(5,this.value)\"></span>&nbsp;and contrast can be improved if necessary.</li>\n<li>Photos which are very fragile will be scanned by <span class=\"question-item\"><strong class=\"q-number\">6</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"6\" oninput=\"setQ(6,this.value)\"></span>.</li>\n</ul>\n<p><strong>Special restore service (costs extra)</strong></p>\n<ul>\n<li>It may be possible to remove an object from a photo, or change the <span class=\"question-item\"><strong class=\"q-number\">7</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"7\" oninput=\"setQ(7,this.value)\"></span>.</li>\n<li>A photo which is not correctly in <span class=\"question-item\"><strong class=\"q-number\">8</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"8\" oninput=\"setQ(8,this.value)\"></span>&nbsp;cannot be fixed.</li>\n</ul>\n<p><strong>Other</strong>&nbsp;<strong>information</strong></p>\n<ul>\n<li>Orders are completed within <span class=\"question-item\"><strong class=\"q-number\">9</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"9\" oninput=\"setQ(9,this.value)\"></span>.</li>\n<li>Send the photos in a box (not <span class=\"question-item\"><strong class=\"q-number\">10</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"10\" oninput=\"setQ(10,this.value)\"></span>).</li>\n</ul>\n</td>\n</tr>\n</tbody>\n</table>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-30/section-1.mp3"},{"number":2,"transcript":["Good morning and thank you for coming here today. I’d like to bring you up to date with changes in the school that will affect your children.","As you know, the school buildings date from various times: some from the 1970s, some from the last five years, and of course Dartfield House is over a century old. It was commissioned by a businessman. Neville Richards, and intended as his family home, but he died before it was completed. His heir chose to sell it to the local council, who turned it into offices. A later plan to convert it into a tourist information centre didn’t come about, through lack of money, and instead it formed the nucleus of this school when it opened 40 years ago.","The school has grown as the local population has increased, and I can now give you some news about the lower school site, which is separated from the main site by a road. Planning permission has been granted for development of both sites. The lower school will move to new buildings that will be constructed on the main site. Developers will construct houses on the existing lower school site. Work on the new school buildings should start within the next few months.","A more imminent change concerns the catering facilities and the canteen. The canteen is always very busy throughout the lunch period – in fact it’s often full to capacity, because a lot of our pupils like the food that’s on offer there. But there’s only one serving point, so most pupils have to wait a considerable time to be served. This is obviously unsatisfactory, as they may have hardly finished their lunch before afternoon lessons start.","So we’ve had a new Food Hall built, and this will come into use next week. It’ll have several serving areas, and I’ll give you more details about those in a minute, but one thing we ask you to do, to help in the smooth running of the Food Hall, is to discuss with your children each morning which type of food they want to eat that day, so they can go straight to the relevant serving point. There won’t be any junk food – everything on offer will be healthy – and there’s no change to the current system of paying for lunches by topping up your child’s electronic payment card online.","You may be wondering what will happen to the old canteen. We’ll still have tables and chairs in there, and pupils can eat food from the Food Hall or lunch they’ve brought from home. Eventually we may use part of the canteen for storage, but first we’ll see how many pupils go in there at lunchtime.","————————","OK, back to the serving points in the Food Hall, which will all have side dishes, desserts and drinks on sale, as well as main courses.","One serving point we call World Adventures. This will serve a different country’s cuisine each day, maybe Chinese one day and Lebanese the next. The menus will be planned for a week at a time, so pupils will know what’s going to be available the whole of the week.","Street Life is also international, with food from three particular cultures. We’ll ask pupils to make suggestions, so perhaps sometimes there’ll be food from Thailand, Ethiopia and Mexico, and then one of them will be replaced by Jamaican food for a week or two.","The Speedy Italian serving point will cater particularly for the many pupils who don’t eat meat or fish: they can be sure that all the food served there is suitable for them. There’ll be plenty of variety, so they shouldn’t get bored with the food.","OK, that’s all on the new Food Hall. Now after-school lessons. They are very popular with pupils, particularly swimming – in fact there’s a waiting list for lessons. Cycling is another favourite, and I’m delighted that dozens of pupils make use of the chance to learn to ride in off-road conditions. It means that more and more cycle to and from school every day. As you know, we have a well-equipped performance centre, and we’re going to start drama classes in there, too. Pupils will be able to join in just for fun or work up to taking part in a play – we hope to put on at least one a year. We already teach a number of pupils to use the sound and lighting systems in the centre. And a former pupil has given a magnificent grand piano to the school, so a few pupils will be able to learn at the school instead of going to the local college, as many of them do at the moment."],"cloze":"<p>Good morning and thank you for coming here today. I’d like to bring you up to date with changes in the school that will affect your children.</p><p>As you know, the <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> times: some from the 1970s, some from the last five years, and of course Dartfield House is over a century old. It was <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>. Neville Richards, and intended as his family home, but he died before it was completed. His heir chose to sell it to the local council, who turned it into offices. A later plan to convert it into a <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span> about, through lack of money, and instead it formed the nucleus of this school when it opened 40 years ago.</p><p>The school has grown as the <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>, and I can now give you some news about the lower school site, which is separated from the main site by a road. Planning permission has been granted for development of both sites. The lower school will move to new buildings that will be constructed on the main site. <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> on the existing lower school site. Work on the new school buildings should start within the next few months.</p><p>A more imminent <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span> and the canteen. The canteen is always very busy throughout the lunch period – in fact it’s often full to capacity, because a lot of our pupils like the food that’s on offer there. But there’s only one serving point, so most pupils have to wait a considerable time to be served. This <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span>, as they may have hardly finished their <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>.</p><p>So we’ve had a new Food Hall built, and this will come into use next week. It’ll have several serving areas, and I’ll give you more details about those in a minute, but one thing we ask you to do, to help in the smooth running of the Food Hall, is to discuss with your <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span> of food they want to eat that day, so they can go straight to the relevant serving point. There won’t be any junk food – everything on offer will be healthy – and there’s no change to the current system of paying for lunches by topping up <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span> online.</p><p>You may be <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span> to the old canteen. We’ll still have tables and chairs in there, and pupils can eat food from the Food Hall or lunch they’ve brought from home. Eventually we may use part of the canteen for storage, but first we’ll see how many pupils go in there at lunchtime.</p><p>————————</p><p>OK, back to the serving points in the Food Hall, which will all have <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span> on sale, as well as main courses.</p><p>One serving point we call World Adventures. This will <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span> each day, maybe Chinese one day and Lebanese the next. The menus will be planned for a week at a time, so pupils will know what’s going to be available the whole of the week.</p><p>Street Life is also international, with food from three particular cultures. We’ll ask <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span>, so perhaps sometimes there’ll be food from Thailand, Ethiopia and Mexico, and then one of them will be replaced by Jamaican food for a week or two.</p><p>The <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span> will cater particularly for the many pupils who don’t eat meat or fish: they can be sure that all the food served there is suitable for them. <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>, so they shouldn’t get bored with the food.</p><p>OK, that’s all on the new Food Hall. Now after-school lessons. They are very <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> – in fact there’s a waiting list for lessons. Cycling is another favourite, and I’m delighted that dozens of pupils make use of the chance to learn to ride in off-road conditions. It means that more and more cycle to and from school every day. As you know, we have a well-<span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>, and we’re going to start drama classes in there, too. Pupils will be able to join in just for fun or work up to taking part in a play – we hope to put on at least one a year. We already teach a number of pupils to use the <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> in the centre. And a former pupil has <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span> to the school, so a few pupils will be able to learn at the school instead of going to the local college, as many of them do at the moment.</p>","clozeAnswers":["school buildings date from various","commissioned by a businessman","tourist information centre didn’t come","local population has increased","Developers will construct houses","change concerns the catering facilities","is obviously unsatisfactory","lunch before afternoon lessons start","children each morning which type","your child’s electronic payment card","wondering what will happen","side dishes, desserts and drinks","serve a different country’s cuisine","pupils to make suggestions","Speedy Italian serving point","There’ll be plenty of variety","popular with pupils, particularly swimming","equipped performance centre","sound and lighting systems","given a magnificent grand piano"],"vocab":[{"word":"permission","ipa":"/pəˈmɪʃən/","pos":"Danh từ (n)","meaning":"sự cho phép/giấy phép quy hoạch, xây dựng","example":"Planning permission has been granted for development of both sites.","exampleVi":"Trong câu trên, “permission” mang nghĩa “sự cho phép/giấy phép quy hoạch, xây dựng”."},{"word":"commissioned","ipa":"/kəˈmɪʃənd/","pos":"Động từ (v)","meaning":"được đặt hàng/ủy nhiệm","example":"It was commissioned by a businessman.","exampleVi":"Trong câu trên, “commissioned” mang nghĩa “được đặt hàng/ủy nhiệm”."},{"word":"magnificent","ipa":"/mæɡˈnɪfəsənt/","pos":"Tính từ (adj)","meaning":"tuyệt vời","example":"And a former pupil has given a magnificent grand piano to the school, so a few pupils will be able to learn at the school instead of going to the local college, as many of them do at the moment.","exampleVi":"Trong câu trên, “magnificent” mang nghĩa “tuyệt vời”."},{"word":"suggestions","ipa":"/səˈd͡ʒɛstjənz/","pos":"Danh từ (n)","meaning":"đề xuất","example":"We’ll ask pupils to make suggestions, so perhaps sometimes there’ll be food from Thailand, Ethiopia and Mexico, and then one of them will be replaced by Jamaican food for a week or two.","exampleVi":"Trong câu trên, “suggestions” mang nghĩa “đề xuất”."},{"word":"adventures","ipa":"/ædˈvɛnt͡ʃɚz/","pos":"Danh từ (n)","meaning":"phiêu lưu","example":"One serving point we call World Adventures.","exampleVi":"Trong câu trên, “adventures” mang nghĩa “phiêu lưu”."},{"word":"developer","ipa":"/dɪˈvɛləpə(ɹ)/","pos":"Danh từ (n)","meaning":"nhà phát triển","example":"Developers will construct houses on the existing lower school site.","exampleVi":"Trong câu trên, “developer” mang nghĩa “nhà phát triển”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 11-15</h2>\n                                                                                 <span><strong class=\"q-number\">13</strong> <span>The catering has been changed because of</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q13\" value=\"A\" data-q=\"13\" onchange=\"setQ(13,this.value)\"><span>long queuing times.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q13\" value=\"B\" data-q=\"13\" onchange=\"setQ(13,this.value)\"><span>changes to the school timetable.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q13\" value=\"C\" data-q=\"13\" onchange=\"setQ(13,this.value)\"><span>dissatisfaction with the menus.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">14</strong> <span>Parents are asked to</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q14\" value=\"A\" data-q=\"14\" onchange=\"setQ(14,this.value)\"><span>help their children to decide in advance which serving point to use.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q14\" value=\"B\" data-q=\"14\" onchange=\"setQ(14,this.value)\"><span>make sure their children have enough money for food.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q14\" value=\"C\" data-q=\"14\" onchange=\"setQ(14,this.value)\"><span>advise their children on healthy food to eat.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">15</strong> <span>What does the speaker say about the existing canteen?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q15\" value=\"A\" data-q=\"15\" onchange=\"setQ(15,this.value)\"><span>Food will still be served there.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q15\" value=\"B\" data-q=\"15\" onchange=\"setQ(15,this.value)\"><span>Only staff will have access to it.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q15\" value=\"C\" data-q=\"15\" onchange=\"setQ(15,this.value)\"><span>Pupils can take their food into it.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 16-18</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>What comment does the speaker make about each of the following serving points in the Food Hall?</p>\n<p><em>Choose&nbsp;<strong>THREE</strong>&nbsp;answers from the box and write the correct letter,&nbsp;<strong>A-D</strong>, next to Questions.</em></p>\n<p><strong>Comments</strong></p>\n<p><strong>Food available at serving points in Food Hall</strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                                <div class=\"matching-dnd-questions\"><div class=\"question-item\"> • <span>World Adventures</span><span class=\"inline-choice\"><strong class=\"q-number\">16</strong><select data-q=\"16\" onchange=\"setQ(16,this.value)\" aria-label=\"Question 16\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class=\"question-item\"> • <span>Street Life</span><span class=\"inline-choice\"><strong class=\"q-number\">17</strong><select data-q=\"17\" onchange=\"setQ(17,this.value)\" aria-label=\"Question 17\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class=\"question-item\"> • <span>Speedy Italian</span><span class=\"inline-choice\"><strong class=\"q-number\">18</strong><select data-q=\"18\" onchange=\"setQ(18,this.value)\" aria-label=\"Question 18\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option></select></span></div></div>                                                                        <div class=\"option-bank\"><div><b>A</b> pupils help to plan menus</div><div><b>B</b> only vegetarian food</div><div><b>C</b> different food every week</div><div><b>D</b> daily change in menu</div></div>\n                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 19-20</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose&nbsp;<strong>TWO</strong>&nbsp;letters,&nbsp;<strong>A-E</strong>.</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">19</strong> <strong class=\"q-number\">20</strong> <span>Which&nbsp;<strong>TWO</strong>&nbsp;optional after-school lessons are new?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input data-limit=\"2\" type=\"checkbox\" value=\"A\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>swimming</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input data-limit=\"2\" type=\"checkbox\" value=\"B\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>piano</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input data-limit=\"2\" type=\"checkbox\" value=\"C\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>acting</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">D</label><input data-limit=\"2\" type=\"checkbox\" value=\"D\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>cycling</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">E</label><input data-limit=\"2\" type=\"checkbox\" value=\"E\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>theatre sound and lighting</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-30/section-2.mp3"},{"number":3,"transcript":["SUSIE: So Luke, for our next psychology assignment we have to do something on sleep and dreams.","LUKE: Right. I’ve just read an article suggesting why we tend to forget most of our dreams soon after we wake up. I mean, most of my dreams aren’t that interesting anyway, but what it said was that if we remembered everything, we might get mixed up about what actually happened and what we dreamed. So it’s a sort of protection. I hadn’t heard that idea before. I’d always assumed that it was just that we didn’t have room in our memories for all that stuff.","SUSIE: Me too. What do you think about the idea that our dreams may predict the future?","LUKE: It’s a belief that you get all over the world.","SUSIE: Yeah, lots of people have a story of it happening to them, but the explanation I’ve read is that for each dream that comes true, we have thousands that don’t, but we don’t notice those, we don’t even remember them. We just remember the ones where something in the real world, like a view or an action, happens to trigger a dream memory.","LUKE: Right. So it’s just a coincidence really. Something else I read about is what they call segmented sleeping. That’s a theory that hundreds of years ago, people used to get up in the middle of the night and have a chat or something to eat, then go back to bed. So I tried it myself.","SUSIE: Why?","LUKE: Well it’s meant to make you more creative. I don’t know why. But I gave it up after a week. It just didn’t fit in with my lifestyle.","SUSIE: But most pre-school children have a short sleep in the day don’t they? There was an experiment some students did here last term to see at what age kids should stop having naps. But they didn’t really find an answer. They spent a lot of time working out the most appropriate methodology, but the results didn’t seem to show any obvious patterns.","LUKE: Right. Anyway, let’s think about our assignment. Last time I had problems with the final stage, where we had to describe and justify how successful we thought we’d been. I struggled a bit with the action plan too.","SUSIE: I was OK with the planning, but I got marked down for the self-assessment as well. And I had big problems with the statistical stuff, that’s where I really lost marks.","LUKE: Right.","————————","SUSIE: So shall we plan what we have to do for this assignment?","LUKE: OK.","SUSIE: First, we have to decide on our research question. So how about ‘Is there a relationship between hours of sleep and number of dreams?’","LUKE: OK. Then we need to think about who we’ll do they study on. About 12 people?","SUSIE: Right. And shall we use other psychology students?","LUKE: Let’s use people from a different department. What about history?","SUSIE: Yes, they might have interesting dreams! Or literature students?","LUKE: I don’t really know any.","SUSIE: OK, forget that idea. Then we have to think about our methodology. So we could use observation, but that doesn’t seem appropriate.","LUKE: No. it needs to be self-reporting I think. And we could ask them to answer questions online.","SUSIE: But in this case, paper might be better as they’ll be doing it straight after they wake up … in fact while they’re still half-asleep.","LUKE: Right. And we’ll have to check the ethical guidelines for this sort of research.","SUSIE: Mm, because our experiment involves humans, so there are special regulations.","LUKE: Yes, I had a look at those for another assignment I did. There’s a whole section on risk assessment, and another section on making sure they aren’t put under any unnecessary stress.","SUSIE: Let’s hope they don’t have any bad dreams!","LUKE: Yeah.","SUSIE: Then when we’ve collected all our data we have to analyse it and calculate the correlation between our two variables, that’s time sleeping and number of dreams and then present our results visually in a graph.","LUKE: Right. And the final thing is to think about our research and evaluate it. So that seems quite straightforward.","SUSIE: Yeah. So now let’s …"],"cloze":"<p>SUSIE: So Luke, for our <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> we have to do something on sleep and dreams.</p><p>LUKE: Right. I’ve just read an article suggesting why we tend to forget most of our dreams soon after we wake up. I mean, most of my dreams aren’t that interesting anyway, but what it said was that if <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>, we might get mixed up about what actually happened and what we dreamed. So it’s a <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>. I hadn’t heard that idea before. I’d always assumed that it was just that we didn’t have room in our memories for all that stuff.</p><p>SUSIE: Me too. What do you think about the idea that our <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>?</p><p>LUKE: It’s a belief tha "paper-input\" data-q=\"25\" oninput=\"setQ(25,this.value)\"></span>&nbsp;department</p></td>\n</tr>\n</tbody>\n</table>\n<p>↓</p>\n<table class=\" aligncenter\">\n<tbody>\n<tr>\n<td width=\"528\">Decide on methodology:<p></p>\n<p>Self-reporting</p></td>\n</tr>\n</tbody>\n</table>\n<p>↓</p>\n<table class=\" aligncenter\">\n<tbody>\n<tr>\n<td width=\"528\">Decide on procedure:<p></p>\n<p>Answers on <span class=\"question-item\"><strong class=\"q-number\">26</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"26\" oninput=\"setQ(26,this.value)\"></span></p></td>\n</tr>\n</tbody>\n</table>\n<p>↓</p>\n<table class=\" aligncenter\">\n<tbody>\n<tr>\n<td width=\"528\">Check ethical guidelines for working with <span class=\"question-item\"><strong class=\"q-number\">27</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"27\" oninput=\"setQ(27,this.value)\"></span><p></p>\n<p>Ensure that risk is assessed and <span class=\"question-item\"><strong class=\"q-number\">28</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"28\" oninput=\"setQ(28,this.value)\"></span>&nbsp;is kept to a minimum</p></td>\n</tr>\n</tbody>\n</table>\n<p>↓</p>\n<table class=\" aligncenter\">\n<tbody>\n<tr>\n<td width=\"528\">Analyse the results<p></p>\n<p>Calculate the correlation and make a <span class=\"question-item\"><strong class=\"q-number\">29</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"29\" oninput=\"setQ(29,this.value)\"></span></p></td>\n</tr>\n</tbody>\n</table>\n<p>↓</p>\n<table>\n<tbody>\n<tr>\n<td width=\"528\">\n<p><span class=\"question-item\"><strong class=\"q-number\">30</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"30\" oninput=\"setQ(30,this.value)\"></span> the research</p>\n</td>\n</tr>\n</tbody>\n</table>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-30/section-3.mp3"},{"number":4,"transcript":["Dancing is something that humans do when they want to have a good time. It’s a universal response to music, found in all cultures. But what’s only been discovered recently is that dancing not only makes us feel good, it’s also extremely good for our health.","Dancing, like other forms of exercise, releases hormones, such as dopamine, which make us feel relaxed and happy. And it also reduces feelings of stress or anxiety.","Dancing is also a sociable activity, which is another reason it makes us feel good.","One study compared people’s enjoyment of dancing at home in front of a video with dancing in a group in a studio.","The people dancing in a group reported feeling happier, whereas those dancing alone did not.","In another experiment, university researchers at York and Sheffield took a group of students and sent each of them into a lab where music was played for five minutes. Each had to choose from three options: to sit and listen quietly to the music, to cycle on an exercise bike while they listened, or to get up and dance. All were given cognitive tasks to perform before and after. The result showed that those who chose to dance showed much more creativity when doing problem-solving tasks.","Doctor Lovatt at the University of Hertfordshire believes dance could be a very useful way to help people suffering from mental health problems. He thinks dance should be prescribed as therapy to help people overcome issues such as depression.","————————","It’s well established that dance is a good way of encouraging adolescent girls to take exercise but what about older people? Studies have shown that there are enormous benefits for people in their sixties and beyond. One of the great things about dance is that there are no barriers to participation. Anyone can have a go, even those whose standard of fitness is quite low.","Dance can be especially beneficial for older adults who can’t run or do more intense workouts, or for those who don’t want to. One 2015 study found that even a gentle dance workout helps to promote a healthy heart. And there’s plenty of evidence which suggests that dancing lowers the risk of falls, which could result in a broken hip, for example, by helping people to improve their balance.","There are some less obvious benefits of dance for older people too. One thing I hadn’t realised before researching this topic was that dance isn’t just a physical challenge. It also requires a lot of concentration because you need to remember different steps and routines. For older people, this kind of activity is especially important because it forces their brain to process things more quickly and to retain more information.","Current research also shows that dance promotes a general sense of well-being in older participants, which can last up to a week after a class. Participants report feeling less tired and having greater motivation to be more active and do daily activities such as gardening or walking to the shops or a park.","Ballroom or country dancing, both popular with older people, have to be done in groups. They require collaboration and often involve touching a dance partner, all of which encourages interaction on the dance floor. This helps to develop new relationships and can reduce older people’s sense of isolation, which is a huge problem in many countries.","I also looked at the benefits of Zumba. Fifteen million people in 180 countries now regularly take a Zumba class, an aerobic workout based on Latin American dance moves. John Porcari, a professor of exercise and sport science at the University of Wisconsin, analysed a group of women who were Zumba regulars and found that a class lasting 40 minutes burns about 370 calories. This is similar to moderately intense exercises like step aerobics or kickboxing.","A study in the American Journal of Health Behavior showed that when women with obesity did Zumba three times a week for 16 weeks, they lost an average of 1.2 kilos and lowered their percentage of body fat by 1%. More importantly, the women enjoyed the class so much that they made it a habit and continued to attend classes at least once a week – very unusual for an aerobic exercise programme.","Dance is never going to compete with high-intensity workouts when it comes to physical fitness gains, but its popularity is likely to keep on rising because it’s such a fun way to keep fit."],"cloze":"<p>Dancing is something that humans do when they want to have a good time. It’s <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>, found in all cultures. But what’s only been discovered recently is that dancing not only makes us feel good, it’s also extremely good for our health.</p><p>Dancing, like other <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>, such as dopamine, which make us feel relaxed and happy. And it also reduces feelings of stress or anxiety.</p><p>Dancing is also a sociable activity, which is another reason it makes us feel good.</p><p>One study compared people’s enjoyment of dancing at home in front of a video with dancing in a group in a studio.</p><p>The people dancing in a group <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>, whereas those dancing alone did not.</p><p>In <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> at York and Sheffield took a group of students and sent each of them into a lab where music was played for five minutes. Each had to choose from three options: to sit and listen quietly to the music, to cycle on an exercise bike while they listened, or to get up and dance. All were <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> before and after. The result showed that those who chose to dance showed much more creativity when doing problem-solving tasks.</p><p>Doctor Lovatt at the University of Hertfordshire <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span> to help people suffering from mental health problems. He thinks dance should be prescribed as therapy to help people overcome issues such as depression.</p><p>————————</p><p>It’s well established that dance is a good way of <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span> exercise but what about older people? Studies have shown that there are enormous benefits for people in their sixties and beyond. One of the great things about dance is that there are no <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>. Anyone can have a go, even those whose standard of fitness is quite low.</p><p>Dance can be <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span> who can’t run or do more intense workouts, or for those who don’t want to. One 2015 study found that even a <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span> to promote a healthy heart. And there’s plenty of evidence which suggests that dancing lowers the risk of falls, which could result in a broken hip, for example, by helping people to improve their balance.</p><p>There are some less obvious benefits of dance for older people too. One thing I hadn’t <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span> was that dance isn’t just a physical challenge. It also requires a lot of concentration because you need to <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span>. For older people, this kind of activity is especially important because it forces their brain to process things more quickly and to retain more information.</p><p>Current research also shows that dance promotes a general sense of well-being in older participants, which can last up to a week after a class. <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span> and having greater motivation to be more active and do <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span> or walking to the shops or a park.</p><p>Ballroom or country dancing, both popular with older people, have to be done in groups. They require <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span> a dance partner, all of which encourages interaction on the dance floor. This helps to develop new relationships and can reduce older people’s sense of isolation, which is a huge problem in many countries.</p><p>I also looked at the benefits of Zumba. Fifteen million people in 180 countries now regularly take a Zumba class, an aerobic <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span> dance moves. John Porcari, a professor of exercise and sport science at the University of Wisconsin, analysed a group of women who were Zumba regulars and found that a class lasting 40 minutes burns about 370 calories. This is <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> like step aerobics or kickboxing.</p><p>A study in the <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span> showed that when women with obesity did Zumba three times a week for 16 weeks, they lost an average of 1.2 kilos and lowered their percentage of body fat by 1%. More importantly, the women enjoyed the class so much that they made it a habit and continued to attend classes at least once a week – very unusual for an <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span>.</p><p>Dance is never going to <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span> when it comes to physical fitness gains, but its popularity is likely to keep on rising because it’s such a fun way to keep fit.</p>","clozeAnswers":["a universal response to music","forms of exercise, releases hormones","reported feeling happier","another experiment, university researchers","given cognitive tasks to perform","believes dance could be a very useful way","encouraging adolescent girls to take","barriers to participation","especially beneficial for older adults","gentle dance workout helps","realised before researching this topic","remember different steps and routines","Participants report feeling less tired","daily activities such as gardening","collaboration and often involve touching","workout based on Latin American","similar to moderately intense exercises","American Journal of Health Behavior","aerobic exercise programme","compete with high-intensity workouts"],"vocab":[{"word":"collaboration","ipa":"/kəˌlæbəˈɹeɪʃən/","pos":"Danh từ (n)","meaning":"cộng tác","example":"They require collaboration and often involve touching a dance partner, all of which encourages interaction on the dance floor.","exampleVi":"Trong câu trên, “collaboration” mang nghĩa “cộng tác”."},{"word":"concentration","ipa":"/ˌkɒnsənˈtɹeɪʃən/","pos":"Danh từ (n)","meaning":"tập trung","example":"It also requires a lot of concentration because you need to remember different steps and routines.","exampleVi":"Trong câu trên, “concentration” mang nghĩa “tậ
