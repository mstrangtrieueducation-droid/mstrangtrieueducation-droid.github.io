</style></head><body><section id="entryGate" class="entry-screen"><div class="entry-card"><header class="entry-head"><small>IELTS - NGHE · TUẦN 33</small><h1>Listening Test 23</h1><p>Điền thông tin học sinh trước khi vào bài.</p></header><div class="entry-body"><p class="entry-note">Họ tên và lớp sẽ được giữ lại để gửi điểm sau khi hoàn thành bài.</p><label for="entryName">Họ và tên học sinh</label><input id="entryName" type="text" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"><label for="entryClass">Lớp IELTS</label><select id="entryClass"><option value="">Chọn lớp IELTS</option><option>IELTS 40</option><option>IELTS 41</option><option>IELTS 42</option><option>IELTS 43</option><option>IELTS 44</option><option>IELTS 45</option><option>IELTS 46</option><option>IELTS 47</option><option>IELTS 48</option><option>IELTS 49</option><option>IELTS 50</option><option>IELTS 51</option><option>IELTS 52</option><option>IELTS 53</option></select><button id="enterTest" type="button" disabled>Nhập họ tên và chọn lớp để vào bài</button></div></div></section><div id="testApp" hidden><header class="hero"><small>IELTS - NGHE · TUẦN 33</small><h1>Listening Test 23</h1><p>Full Test · Sections 1–4 · 40 questions</p></header><main class="shell"><nav id="sectionTabs" class="section-tabs"></nav><nav class="stage-tabs"><button type="button" data-stage="vocab">A · Từ vựng cần lưu ý</button><button type="button" data-stage="dictation">B · Điền chính tả</button><button type="button" data-stage="ielts">C · Câu hỏi IELTS</button><button type="button" data-stage="score">D · Nộp bài</button></nav><section id="content" class="lesson"></section></main></div><script>const DATA={"week":33,"test":23,"sourceRef":"Cambridge IELTS 14 Academic Listening Test 3","answers":{"1":["Tesla"],"2":["microphone"],"3":["exhibition"],"4":["wifi"],"5":["45"],"6":["135"],"7":["pool"],"8":["airport"],"9":["sea"],"10":["clubs"],"11":["A","E"],"12":["A","E"],"13":["B","E"],"14":["B","E"],"15":["F"],"16":["A"],"17":["E"],"18":["G"],"19":["D"],"20":["C"],"21":["50"],"22":["regional"],"23":["carnival"],"24":["drummer"],"25":["film"],"26":["parade"],"27":["D"],"28":["B"],"29":["E"],"30":["F"],"31":["violin"],"32":["energy"],"33":["complex"],"34":["opera"],"35":["disturbing"],"36":["clarinet"],"37":["diversity"],"38":["physics"],"39":["dance"],"40":["Olympics"]},"sections":[{"number":1,"transcript":["ANGELA: Hello, Flanders conference hotel.","MAN: Oh, hi. I wanted to ask about conference facilities at the hotel. Have I come through to the right person?","ANGELA: You have. I’m the customer services manager. My name’s Angela. So how can I help you?","MAN: Well, I’m calling from Barrett and Stansons, we’re a medical company based in Perth.","ANGELA: Oh yes.","MAN: And we’re organising a conference for our clients to be held in Sydney. It’ll be held over two days and we’re expecting about fifty or sixty people.","ANGELA: When were you thinking of having it?","MAN: Some time early next year, like the end of January? It’d have to be a weekend.","ANGELA: Let me see … our conference facilities are already booked for the weekend beginning January 28th. We could do the first weekend in February?","MAN: How about January 21st?","ANGELA: I’m afraid that’s booked too.","MAN: Well, let’s go for the February date then.","ANGELA: So that’s the weekend beginning the 4th.","MAN: OK. Now can you tell me a bit about what conference facilities you have?","ANGELA: Sure. So for talks and presentations we have the Tesla room.","MAN: Sorry?","ANGELA: Tesla – that’s spelled T-E-S-L-A. it holds up to a hundred people, and it’s fully equipped with a projector and so on.","MAN: How about a microphone?","ANGELA: Yes, that’ll be all set up ready for you, and there’ll be one that members of the audience can use too, for questions, if necessary.","MAN: Fine. And we’ll also need some sort of open area where people can sit and have a cup of coffee, and we’d like to have an exhibition of our products and services there as well, so that’ll need to be quite a big space.","ANGELA: That’s fine, there’s a central atrium with all those facilities, and you can come before the conference starts if you want to set everything up.","MAN: Great. And I presume there’s wifi?","ANGELA: Oh yes, that’s free and available throughout the hotel.","MAN: OK.","ANGELA: Would you also like us to provide a buffet lunch? We can do a two-course meal with a number of different options.","MAN: What sort of price are we looking at for that?","ANGELA: Well, I can send you a copy of the standard menu. That’s $45 per person. Or you can have the special for $25 more.","MAN: I think the standard should be OK, but yes, send me the menu.","———————","MAN: Now we’re also going to need accommodation on the Saturday night for some of the participants … I’m not sure how many, but probably about 25. So what do you change for a room?","ANGELA: Well, for conference attendees we have a 25% reduction, so we can offer you rooms at $135. Normally a standard room’s $180.","MAN: And does that include breakfast?","ANGELA: Sure. And of course, guests can also make use of all the other facilities at the hotel. So we’ve got a spa where you can get massages and facials and so on, and there’s a pool up on the roof for the use of guests.","MAN: Great. Now what about transport links? The hotel’s downtown, isn’t it?","ANGELA: Yes, it’s about 12 kilometres from the airport, but there’s a complimentary shuttle bus for guests. And it’s only about ten minutes’ walk from the central railway station.","MAN: OK. Now, I don’t know Sydney very well, can you just give me an idea of the location of the hotel?","ANGELA: Well, it’s downtown on Wilby Street, that’s quite a small street, and it’s not very far from the sea. And of course if the conference attendees want to go out on the Saturday evening there’s a huge choice of places to eat. Then if they want to make a night of it, they can go on to one of the clubs in the area – there are a great n to one of the clubs in the area – there are a great many to choose from.</p><p>MAN: OK. So if we go ahead with this, can you give me some information about how much …</p>","clozeAnswers":["Hello, Flanders conference hotel","we’re organising a conference","expecting about fifty or sixty","conference facilities are already booked","first weekend in February","what conference facilities you have","fully equipped with a projector","questions, if necessary","exhibition of our products","come before the conference starts","available throughout the hotel","copy of the standard menu","accommodation on the Saturday night","a standard room’s $180","that include breakfast","get massages and facials","complimentary shuttle bus for guests","downtown on Wilby Street","conference attendees want to go out","a huge choice of places to eat"],"vocab":[{"word":"accommodation","ipa":"/ə.ˌkɒm.ə.ˈdeɪ.ʃən/","pos":"Danh từ (n)","meaning":"chỗ ở","example":"Now we’re also going to need accommodation on the Saturday night for some of the participants … I’m not sure how many, but probably about 25.","exampleVi":"Trong câu trên, “accommodation” mang nghĩa “chỗ ở”."},{"word":"exhibition","ipa":"/ɛksɪˈbɪʃən/","pos":"Danh từ (n)","meaning":"triển lãm","example":"And we’ll also need some sort of open area where people can sit and have a cup of coffee, and we’d like to have an exhibition of our products and services there as well, so that’ll need to be quite a big space.","exampleVi":"Trong câu trên, “exhibition” mang nghĩa “triển lãm”."},{"word":"necessary","ipa":"/ˈnɛsəsɹɪ/","pos":"Tính từ (adj)","meaning":"cần thiết","example":"Yes, that’ll be all set up ready for you, and there’ll be one that members of the audience can use too, for questions, if necessary.","exampleVi":"Trong câu trên, “necessary” mang nghĩa “cần thiết”."},{"word":"medical","ipa":"/ˈmɛdɪkl̩/","pos":"Tính từ (adj)","meaning":"y tế","example":"Well, I’m calling from Barrett and Stansons, we’re a medical company based in Perth.","exampleVi":"Trong câu trên, “medical” mang nghĩa “y tế”."},{"word":"kilometre","ipa":"/kɪˈlɒmɪtə/","pos":"Danh từ (n)","meaning":"kilômét","example":"Yes, it’s about 12 kilometres from the airport, but there’s a complimentary shuttle bus for guests.","exampleVi":"Trong câu trên, “kilometre” mang nghĩa “kilômét”."},{"word":"microphone","ipa":"/ˈmaɪ.kɹəˌfəʊn/","pos":"Danh từ (n)","meaning":"micrô","example":"How about a microphone?","exampleVi":"Trong câu trên, “microphone” mang nghĩa “micrô”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 1-10</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the notes below.</p>\n<p>Write&nbsp;<strong>ONE WORD AND/OR A NUMBER</strong>&nbsp;for each answer.</p>\n<p>&nbsp;</p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Flanders Conference Hotel</strong></strong></p>\n<p><em>Example</em></p>\n<p>Customer Services Manager: …………<em>Angela………..</em></p>\n<p><strong>Date available</strong></p>\n<ul>\n<li>weekend beginning February 4th</li>\n</ul>\n<p><strong>Conference facilities</strong></p>\n<ul>\n<li>the <span class=\"question-item\"><strong class=\"q-number\">1</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"1\" oninput=\"setQ(1,this.value)\"></span>&nbsp;room for talks</li>\n</ul>\n<p>(projector and <span class=\"question-item\"><strong class=\"q-number\">2</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"2\" oninput=\"setQ(2,this.value)\"></span>&nbsp;available)</p>\n<ul>\n<li>area for coffee and an <span class=\"question-item\"><strong class=\"q-number\">3</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"3\" oninput=\"setQ(3,this.value)\"></span></li>\n<li>free <span class=\"question-item\"><strong class=\"q-number\">4</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"4\" oninput=\"setQ(4,this.value)\"></span>&nbsp;throughout</li>\n<li>a standard buffet lunch costs $<span class=\"question-item\"><strong class=\"q-number\">5</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"5\" oninput=\"setQ(5,this.value)\"></span> per head</li>\n</ul>\n<p><strong>Accommodation</strong></p>\n<ul>\n<li>Rooms will cost $<span class=\"question-item\"><strong class=\"q-number\">6</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"6\" oninput=\"setQ(6,this.value)\"></span> including breakfast.</li>\n</ul>\n<p><strong>Other facilities</strong></p>\n<ul>\n<li>The hotel also has a spa and rooftop <span class=\"question-item\"><strong class=\"q-number\">7</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"7\" oninput=\"setQ(7,this.value)\"></span></li>\n<li>There’s a free shuttle service to the <span class=\"question-item\"><strong class=\"q-number\">8</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"8\" oninput=\"setQ(8,this.value)\"></span></li>\n</ul>\n<p><strong>Location</strong></p>\n<ul>\n<li>Wilby Street (quite near the <span class=\"question-item\"><strong class=\"q-number\">9</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"9\" oninput=\"setQ(9,this.value)\"></span>)</li>\n<li>near to restaurants and many <span class=\"question-item\"><strong class=\"q-number\">10</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"10\" oninput=\"setQ(10,this.value)\"></span></li>\n</ul>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-23/section-1.mp3"},{"number":2,"transcript":["Good morning. My name’s Lucy Crittenden, and I’m the Director of Operations for an organisation that arranges volunteering in this part of the country. I’m hoping I can persuade one or two of you to become volunteers yourselves. Let me start by briefly explaining what we mean by volunteering.","Volunteers are teenagers and adults who choose to spend some time, unpaid, helping other people in some way. Most volunteers devote two or three hours to this every week, while a few do much more. The people they help may have physical or behavioural difficulties, for example.","Volunteers can do all sorts of things, depending on their own abilities and interests. If they’re supporting a family that’s struggling, for example, they may be able to give them tips on cooking, or recommend how to plan their budget or how to shop sensibly on their income. They might even do some painting or wallpapering, perhaps alongside any members of the family who are able to do it. Or even do some babysitting so that parents can go out for a while.","The benefit from volunteering isn’t only for the people being helped. Volunteers also gain from it: they’re using their skills to cope with somebody’s mental or physical ill health, and volunteering may be a valuable element of their CV when they’re applying for jobs: employers usually look favourably on someone who’s given up time to help others. Significantly, most volunteers feel that what they’re doing gives them a purpose in their lives. And in my opinion, they’re lucky in that respect, as many people don’t have that feeling.","——————","Now I’d like to tell you what some of our volunteers have said about what they do, to give you an idea of the range of ways in which they can help people.","Habib supports an elderly lady who’s beginning to show signs of dementia. Once a week they, along with other elderly people, go to the local community centre, where a group of people come in and sing. The songs take the listeners back to their youth, and for a little while they can forget the difficulties that they face now.","Our volunteer Consuela is an amazing woman. She has difficulty walking herself, but she doesn’t let that stop her. She helps a couple of people with similar difficulties, who had almost stopped walking altogether. By using herself as an example, Consuela encourages them to walk more and more.","Minh visits a young man who lives alone and can’t leave his home on his own, so he hardly ever saw anyone. But together they go out to the cinema, or to see friends the young man hadn’t been able to visit for a long time.","Tanya visits an elderly woman once a week. When the woman found out that Tanya is a professional dressmaker, she got interested. Tanya showed her some soft toys she’d made, and the woman decided to try it herself. And now she really enjoys it, and spends hours making toys. They’re not perhaps up to Tanya’s standard yet, but she gains a lot of pleasure from doing it.","Alexei is a volunteer with a family that faces a number of difficulties. By calmly talking over possible solutions with family members, he’s helping them to realise that they aren’t helpless, and that they can do something themselves to improve their situation. This has been great for their self-esteem.","And the last volunteer I’ll mention, though there are plenty more, is Juba. She volunteers with a teenage girl with learning difficulties, who wasn’t very good at talking to other people. Juba’s worked very patiently with her, and now the girl is far better at expressing herself, and at understanding other people.","OK, I hope that’s given you an idea of what volunteering is all about. Now I’d like …"],"cloze":"<p>Good morning. My name’s Lucy Crittenden, and I’m the Director of Operations for an <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> in this part of the country. I’m hoping I can persuade one or two of you to become volunteers yourselves. Let me start by briefly explaining what we mean by volunteering.</p><p><span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> who choose to spend some time, unpaid, helping other people in some way. Most volunteers devote two or three hours to this every week, while a few do much more. The people they help may have <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>, for example.</p><p>Volunteers can do all sorts of things, depending on their own abilities and interests. If they’re <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>, for example, they may be able to give them tips on cooking, or recommend how to plan their budget or how to shop sensibly on their income. They might even do <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span>, perhaps alongside any members of the family who are able to do it. Or even do some babysitting so that parents can go out for a while.</p><p>The <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span> isn’t only for the people being helped. Volunteers also gain from it: they’re using their skills to <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span>, and volunteering may be a valuable element of their CV when they’re applying for jobs: <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span> who’s given up time to help others. Significantly, most volunteers feel that what they’re doing gives them a purpose in their lives. And in my opinion, they’re lucky in that respect, as <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span>.</p><p>——————</p><p>Now I’d like to tell you what some of our volunteers have said about what they do, to give you an idea of the range of ways in which they can help people.</p><p><span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span> who’s beginning to show signs of dementia. Once a week they, along with other elderly people, go to the <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span>, where a group of people come in and sing. The songs take the listeners back to their youth, and for a little while they can forget the difficulties that they face now.</p><p><span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span>. She has difficulty walking herself, but she doesn’t let that stop her. She helps a couple of people with similar difficulties, who had <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span>. By using herself as an example, Consuela encourages them to walk more and more.</p><p>Minh visits a young man who lives alone and can’t leave his home on his own, so he <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span>. But together they go out to the cinema, or to see friends the young man hadn’t been able to visit for a long time.</p><p>Tanya visits an elderly woman once a week. When the woman found out that <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span>, she got interested. Tanya showed her some soft toys she’d made, and the woman decided to try it herself. And now she really enjoys it, and spends hours making toys. They’re not <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span> yet, but she gains a lot of pleasure from doing it.</p><p>Alexei is a volunteer with a family that faces a number of difficulties. By <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> with family members, he’s helping them to realise that they aren’t helpless, and that they can do something themselves to improve their situation. This has been great for their self-esteem.</p><p>And <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>, though there are plenty more, is Juba. She volunteers with a <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span>, who wasn’t very good at talking to other people. Juba’s worked very patiently with her, and now the girl is far better at expressing herself, and at <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>.</p><p>OK, I hope that’s given you an idea of what volunteering is all about. Now I’d like …</p>","clozeAnswers":["organisation that arranges volunteering","Volunteers are teenagers and adults","physical or behavioural difficulties","supporting a family that’s struggling","some painting or wallpapering","benefit from volunteering","cope with somebody’s mental or physical ill health","employers usually look favourably on someone","many people don’t have that feeling","Habib supports an elderly lady","local community centre","our volunteer Consuela is an amazing woman","almost stopped walking altogether","hardly ever saw anyone","Tanya is a professional dressmaker","perhaps up to Tanya’s standard","calmly talking over possible solutions","the last volunteer I’ll mention","teenage girl with learning difficulties","understanding other people"],"vocab":[{"word":"situation","ipa":"/sɪtjuːˈeɪʃən/","pos":"Danh từ (n)","meaning":"tình huống","example":"By calmly talking over possible solutions with family members, he’s helping them to realise that they aren’t helpless, and that they can do something themselves to improve their situation.","exampleVi":"Trong câu trên, “situation” mang nghĩa “tình huống”."},{"word":"physical","ipa":"/ˈfɪzɪkəl/","pos":"Tính từ (adj)","meaning":"thể chất","example":"The people they help may have physical or behavioural difficulties, for example.","exampleVi":"Trong câu trên, “physical” mang nghĩa “thể chất”."},{"word":"valuable","ipa":"/ˈvæljuəbl̩/","pos":"Tính từ (adj)","meaning":"có giá trị","example":"Volunteers also gain from it: they’re using their skills to cope with somebody’s mental or physical ill health, and volunteering may be a valuable element of their CV when they’re applying for jobs: employers usually look favourably on someone who’s given up time to help others.","exampleVi":"Trong câu trên, “valuable” mang nghĩa “có giá trị”."},{"word":"difficulties","ipa":"/ˈdɪfɪkəltiz/","pos":"Danh từ (n)","meaning":"khó khăn","example":"The people they help may have physical or behavioural difficulties, for example.","exampleVi":"Trong câu trên, “difficulties” mang nghĩa “khó khăn”."},{"word":"altogether","ipa":"/ˌɔːltəˈɡeðə(r)/","pos":"Trạng từ (adv)","meaning":"hoàn toàn","example":"She helps a couple of people with similar difficulties, who had almost stopped walking altogether.","exampleVi":"Trong câu trên, “altogether” mang nghĩa “hoàn toàn”."},{"word":"difficulty","ipa":"/ˈdɪfɪkəlti/","pos":"Danh từ (n)","meaning":"khó khăn","example":"She has difficulty walking herself, but she doesn’t let that stop her.","exampleVi":"Trong câu trên, “difficulty” mang nghĩa “khó khăn”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 11-12</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose&nbsp;<strong>TWO</strong>&nbsp;letters,&nbsp;<strong>A-E</strong>.</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">11</strong> <strong class=\"q-number\">12</strong> <span>Which&nbsp;<strong>TWO</strong>&nbsp;activities that volunteers do are mentioned?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input data-limit=\"2\" type=\"checkbox\" value=\"A\" data-group=\"11-12\" onchange=\"setGroup('11-12',this.value,this,2)\"><span>decorating</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input data-limit=\"2\" type=\"checkbox\" value=\"B\" data-group=\"11-12\" onchange=\"setGroup('11-12',this.value,this,2)\"><span>cleaning</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input data-limit=\"2\" type=\"checkbox\" value=\"C\" data-group=\"11-12\" onchange=\"setGroup('11-12',this.value,this,2)\"><span>delivering meals</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">D</label><input data-limit=\"2\" type=\"checkbox\" value=\"D\" data-group=\"11-12\" onchange=\"setGroup('11-12',this.value,this,2)\"><span>shopping</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">E</label><input data-limit=\"2\" type=\"checkbox\" value=\"E\" data-group=\"11-12\" onchange=\"setGroup('11-12',this.value,this,2)\"><span>childcare</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 13-14</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose&nbsp;<strong>TWO</strong>&nbsp;letters,&nbsp;<strong>A-E</strong>.</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">13</strong> <strong class=\"q-number\">14</strong> <span>Which&nbsp;<strong>TWO</strong>&nbsp;ways that volunteers can benefit from volunteering are mentioned?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input data-limit=\"2\" type=\"checkbox\" value=\"A\" data-group=\"13-14\" onchange=\"setGroup('13-14',this.value,this,2)\"><span>learning how to be part of a team</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input data-limit=\"2\" type=\"checkbox\" value=\"B\" data-group=\"13-14\" onchange=\"setGroup('13-14',this.value,this,2)\"><span>having a sense of purpose</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input data-limit=\"2\" type=\"checkbox\" value=\"C\" data-group=\"13-14\" onchange=\"setGroup('13-14',this.value,this,2)\"><span>realising how lucky they are</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">D</label><input data-limit=\"2\" type=\"checkbox\" value=\"D\" data-group=\"13-14\" onchange=\"setGroup('13-14',this.value,this,2)\"><span>improved ability at time management</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">E</label><input data-limit=\"2\" type=\"checkbox\" value=\"E\" data-group=\"13-14\" onchange=\"setGroup('13-14',this.value,this,2)\"><span>boosting their employment prospects</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 15-20</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>What has each of the following volunteers helped someone to do?</p>\n<p>Choose&nbsp;<strong>SIX</strong>&nbsp;answers from the box and write the correct letter,&nbsp;<strong>A-G</strong>, next to Questions</p>\n<p><strong>What volunteers have helped people to do</strong></p>\n<p><strong>Volunteers</strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                                <div class=\"matching-dnd-questions\"><div class=\"question-item\"> • <span>Habib</span><span class=\"inline-choice\"><strong class=\"q-number\">15</strong><select data-q=\"15\" onchange=\"setQ(15,this.value)\" aria-label=\"Question 15\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>Consuela</span><span class=\"inline-choice\"><strong class=\"q-number\">16</strong><select data-q=\"16\" onchange=\"setQ(16,this.value)\" aria-label=\"Question 16\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>Minh</span><span class=\"inline-choice\"><strong class=\"q-number\">17</strong><select data-q=\"17\" onchange=\"setQ(17,this.value)\" aria-label=\"Question 17\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>Tanya</span><span class=\"inline-choice\"><strong class=\"q-number\">18</strong><select data-q=\"18\" onchange=\"setQ(18,this.value)\" aria-label=\"Question 18\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>Alexei</span><span class=\"inline-choice\"><strong class=\"q-number\">19</strong><select data-q=\"19\" onchange=\"setQ(19,this.value)\" aria-label=\"Question 19\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>Juba</span><span class=\"inline-choice\"><strong class=\"q-number\">20</strong><select data-q=\"20\" onchange=\"setQ(20,this.value)\" aria-label=\"Question 20\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div></div>                                                                        <div class=\"option-bank\"><div><b>A</b> overcome physical difficulties</div><div><b>B</b> rediscover skills not used for a long time</div><div><b>C</b> improve their communication skills</div><div><b>D</b> solve problems independently</div><div><b>E</b> escape isolation</div><div><b>F</b> remember past times</div><div><b>G</b> start a new hobby</div></div>\n                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>\n                                        </div>","audio":"./audio/test-23/section-2.m4a"},{"number":3,"transcript":["LIZZIE: So how are you getting on with your teaching practice at the High School, Joe?","JOE: Well I’ve been put in charge of the school marching band, and it’s quite a responsibility. I’d like to talk it over with you.","LIZZIE: Go ahead. You’d better start by giving me a bit of background.","JOE: OK. Well the band has students in it from all years, so they’re aged 11 to 18, and there are about 50 of them altogether. It’s quite a popular activity within the school. I’ve never worked with a band of more than 20 before, and this is very different.","LIZZIE: I can imagine.","JOE: They aren’t really good enough to enter national band competitions, but they’re in a regional one later in the term. Even if they don’t win, and I don’t expect them to, hopefully it’ll be an incentive for them to try and improve.","LIZZIE: Yes, hopefully.","JOE: Well, now the town council’s organising a carnival in the summer, and the band has been asked to perform. If you ask me, they aren’t really up to it yet, and I need to get them functioning better as a band, and in a very short time.","LIZZIE: Have you been doing anything with them? Apart from practising the music, I mean.","JOE: I played a recording I came across, of a drummer talking about how playing in a band had changed his life. I think it was an after-dinner speech. I thought it was pretty inspiring, because being in the band had stopped him from getting involved in crime. The students seemed to find it interesting, too.","LIZZIE: That’s good.","JOE: I’m planning to show them that old film from the 1940s ‘Strike Up the Band’, and talk about it with the students. What do you think?","LIZZIE: Good idea. As it’s about a school band, it might make the students realise how much they can achieve if they work together.","JOE: That’s what I’ve got in mind. I’m hoping I can take some of the band to a parade that’s going to take place next month. A couple of marching bands will be performing, and the atmosphere should be quite exciting. It depends on whether I can persuade the school to hire a coach or two to take us there.","LIZZIE: Mmm. They sound like good ideas to me.","JOE: Thanks.","—————————","JOE: Can I tell you about a few people in the band who I’m finding it quite difficult to cope with? I’m sure you’ll have some ideas about what I can do.","LIZZIE: Go ahead.","JOE: There’s a flautist who says she loves playing in the band. We rehearse twice a week after school, but she’s hardly ever there. Then she looks for me the next day and gives me a very plausible reason – she says she had to help her mother, or she’s been ill, but to be honest, I don’t believe her.","LIZZIE: Oh dear! Any more students with difficulties?","JOE: Plenty! There’s a trumpeter who thinks she’s the best musician in the band, though she certainly isn’t. She’s always saying what she thinks other people should do, which makes my job pretty difficult.","LIZZIE: She sounds a bit of a nightmare!","JOE: You can say that again. One of the trombonists has got an impressive sense of rhythm, and could be an excellent musician – except that he has breathing difficulties, and he doesn’t really have enough breath for the trombone. He’d be much better of playing percussion, for instance, but he refuses to give up. So he ends up only playing half the notes.","LIZZIE: I suppose you have to admire his determination.","JOE: Maybe. One of the percussionists isn’t too bad, but he never seems to interact with other people, and he always rushes off as soon as the rehearsal ends. I don’t know if there are family reasons, or what. But it isn’t good in a band, where people really need to feel they’re part of a group.","LIZZIE: Hmm.","JOE: There are others too, but at least that gives you an idea of what I’m up against. Do you have any thoughts about what I can do, Lizzie?"],"cloze":"<p>LIZZIE: So how are you getting on with your teaching practice at the High School, Joe?</p><p>JOE: Well I’ve been put in charge of the school marching band, and it’s <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>. I’d like to talk it over with you.</p><p>LIZZIE: Go ahead. You’d better <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>.</p><p>JOE: OK. Well the band has students in it from all years, so they’re aged 11 to 18, and there are about 50 of them altogether. It’s quite a <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>. I’ve never worked with a band of more than 20 before, and this is very different.</p><p>LIZZIE: I can imagine.</p><p>JOE: They aren’t really good enough to <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>, but they’re in a regional one later in the term. Even if they don’t win, and I don’t expect them to, hopefully it’ll be an incentive for them to try and improve.</p><p>LIZZIE: Yes, hopefully.</p><p>JOE: Well, now the <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> in the summer, and the band has been asked to perform. If you ask me, they aren’t really up to it yet, and I need to <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span> as a band, and in a very short time.</p><p>LIZZIE: Have you been doing anything with them? Apart from practising the music, I mean.</p><p>JOE: I played a recording I came across, of a drummer talking about how playing in a band had changed his life. I think it was an after-dinner speech. I <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span>, because being in the band had <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span> in crime. The students seemed to find it interesting, too.</p><p>LIZZIE: That’s good.</p><p>JOE: I’m planning to show them that old film from the 1940s ‘Strike Up the Band’, and talk about it with the students. What do you think?</p><p>LIZZIE: Good idea. As it’s about a school band, it might make the students realise <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span> if they work together.</p><p>JOE: That’s what I’ve got in mind. I’m hoping I can take some of the band to a parade that’s going to take place next month. A couple of <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>, and the <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span>. It depends on whether I can persuade the school to hire a coach or two to take us there.</p><p>LIZZIE: Mmm. They sound like good ideas to me.</p><p>JOE: Thanks.</p><p>—————————</p><p>JOE: Can I tell you about a few people in the band who I’m <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span> to cope with? I’m sure you’ll have some ideas about what I can do.</p><p>LIZZIE: Go ahead.</p><p>JOE: There’s a flautist who says she loves playing in the band. We <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span> after school, but she’s hardly ever there. Then she looks for me the next day and gives me a very plausible reason – she says she had to help her mother, or she’s been ill, but to be honest, I don’t believe her.</p><p>LIZZIE: Oh dear! Any more <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span>?</p><p>JOE: Plenty! There’s a trumpeter who <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span>, though she certainly isn’t. She’s always saying what she thinks other people should do, which makes my job pretty difficult.</p><p>LIZZIE: She sounds a bit of a nightmare!</p><p>JOE: You can say that again. One of the trombonists has got an impressive sense of rhythm, and could be an excellent musician – <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>, and he doesn’t really have enough breath for the trombone. He’d be much better of <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span>, but he refuses to give up. So he ends up only playing half the notes.</p><p>LIZZIE: I suppose you have to <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>.</p><p>JOE: Maybe. One of the percussionists isn’t too bad, but he never seems to interact with other people, and he always <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span>. I don’t know if there are family reasons, or what. But it isn’t good in a band, where people really need to feel they’re part of a group.</p><p>LIZZIE: Hmm.</p><p>JOE: There are others too, but at least that gives you an idea of what I’m up against. Do you have any <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>, Lizzie?</p>","clozeAnswers":["quite a responsibility","start by giving me a bit of background","popular activity within the school","enter national band competitions","town council’s organising a carnival","get them functioning better","thought it was pretty inspiring","stopped him from getting involved","how much they can achieve","marching bands will be performing","atmosphere should be quite exciting","finding it quite difficult","rehearse twice a week","students with difficulties","thinks she’s the best musician in the band","except that he has breathing difficulties","playing percussion, for instance","admire his determination","rushes off as soon as the rehearsal ends","thoughts about what I can do"],"vocab":[{"word":"responsibility","ipa":"/ɹɪˌspɑnsəˈbɪlɪɾi/","pos":"Danh từ (n)","meaning":"trách nhiệm","example":"Well I’ve been put in charge of the school marching band, and it’s quite a responsibility.","exampleVi":"Trong câu trên, “responsibility” mang nghĩa “trách nhiệm”."},{"word":"plausible","ipa":"/ˈplɔːz.ə.bəl/","pos":"Tính từ (adj)","meaning":"hợp lý","example":"Then she looks for me the next day and gives me a very plausible reason – she says she had to help her mother, or she’s been ill, but to be honest, I don’t believe her.","exampleVi":"Trong câu trên, “plausible” mang nghĩa “hợp lý”."},{"word":"activity","ipa":"/ækˈtɪ.və.ti/","pos":"Danh từ (n)","meaning":"hoạt động","example":"It’s quite a popular activity within the school.","exampleVi":"Trong câu trên, “activity” mang nghĩa “hoạt động”."},{"word":"functioning","ipa":"/ˈfʌŋkʃənɪŋ/","pos":"Động từ/phân từ (v./part.)","meaning":"hoạt động","example":"If you ask me, they aren’t really up to it yet, and I need to get them functioning better as a band, and in a very short time.","exampleVi":"Trong câu trên, “functioning” mang nghĩa “hoạt động”."},{"word":"background","ipa":"/ˈbæk.ɡɹaʊnd/","pos":"Danh từ (n)","meaning":"bối cảnh/thông tin nền","example":"You’d better start by giving me a bit of background.","exampleVi":"Trong câu trên, “background” mang nghĩa “bối cảnh/thông tin nền”."},{"word":"performing","ipa":"/pəˈfɔːmɪŋ/","pos":"Động từ (v)","meaning":"biểu diễn","example":"A couple of marching bands will be performing, and the atmosphere should be quite exciting.","exampleVi":"Trong câu trên, “performing” mang nghĩa “biểu diễn”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 21-26</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the notes below.</p>\n<p>Write&nbsp;<strong>ONE WORD AND/OR A NUMBER</strong>&nbsp;for each answer.</p>\n<p><strong>Background on school marching band</strong></p>\n<p>It consists of around <span class=\"question-item\"><strong class=\"q-number\">21</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"21\" oninput=\"setQ(21,this.value)\"></span>&nbsp;students.</p>\n<p>It is due to play in a <span class=\"question-item\"><strong class=\"q-number\">22</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"22\" oninput=\"setQ(22,this.value)\"></span>&nbsp;band competition.</p>\n<p>It has been invited to play in the town’s <span class=\"question-item\"><strong class=\"q-number\">23</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"23\" oninput=\"setQ(23,this.value)\"></span></p>\n<p>They have listened to a talk by a <span class=\"question-item\"><strong class=\"q-number\">24</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"24\" oninput=\"setQ(24,this.value)\"></span></p>\n<p>Joe will discuss a <span class=\"question-item\"><strong class=\"q-number\">25</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"25\" oninput=\"setQ(25,this.value)\"></span>&nbsp;with the band.</p>\n<p>Joe hopes the band will attend a <span class=\"question-item\"><strong class=\"q-number\">26</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"26\" oninput=\"setQ(26,this.value)\"></span>&nbsp;next month.</p>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 27-30</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>What problem does Joe mention in connection with each of the following band members?</p>\n<p>Choose&nbsp;<strong>FOUR</strong>&nbsp;answers from the box and write the correct letter,&nbsp;<strong>A-F</strong>, next to Questions.</p>\n<p><strong>Problems</strong></p>\n<p><strong>Band members</strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                                <div class=\"matching-dnd-questions\"><div class=\"question-item\"> • <span>flautist</span><span class=\"inline-choice\"><strong class=\"q-number\">27</strong><select data-q=\"27\" onchange=\"setQ(27,this.value)\" aria-label=\"Question 27\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class=\"question-item\"> • <span>trumpeter</span><span class=\"inline-choice\"><strong class=\"q-number\">28</strong><select data-q=\"28\" onchange=\"setQ(28,this.value)\" aria-label=\"Question 28\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class=\"question-item\"> • <span>trombonist</span><span class=\"inline-choice\"><strong class=\"q-number\">29</strong><select data-q=\"29\" onchange=\"setQ(29,this.value)\" aria-label=\"Question 29\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class=\"question-item\"> • <span>percussionist</span><span class=\"inline-choice\"><strong class=\"q-number\">30</strong><select data-q=\"30\" onchange=\"setQ(30,this.value)\" aria-label=\"Question 30\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option></select></span></div></div>                                                                        <div class=\"option-bank\"><div><b>A</b> makes a lot of mistakes in rehearsals</div><div><b>B</b> keeps making unhelpful suggestions</div><div><b>C</b> has difficulty with rhythm</div><div><b>D</b> misses too many rehearsals</div><div><b>E</b> has a health problem</div><div><b>F</b> doesn’t mix with other students</div></div>\n                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>\n                                        </div>","audio":"./audio/test-23/section-3.m4a"},{"number":4,"transcript":["As you all know, the university is planning an arts festival for later this year, and here in the music department we’ve planned three concerts. These will be public performances, and the programme has just been finalised. The theme of the festival is links between the UK and Australia, and this is reflected in the music: each concert will feature both British and Australian composers. I’ll tell you briefly about the Australian music, as you probably won’t be familiar with that.","The first concert will include music by Liza Lim, who was born in Perth, Western Australia, in 1966. As a child, Lim originally learned to play the piano – like so many children – and also the violin. But when she was 11 her teachers encouraged her to start composing. She found this was her real strength, and she studied and later taught composition, both in Australia and in other countries. As a composer, she has received commissions from numerous orchestras, other performers and festivals in several countries.","Liza Lim’s compositions are vibrant and full of energy, and she often explores Asian and Australian Aboriginal cultural sources, including the native instrument, the didgeridoo: this is featured in a work called The Compass. Her music is very expressive, so although it is complex, it has the power of connecting with audiences and performers alike.","In the festival we’re going to give a semi-staged performance of The Oresteia. This is an opera in seven parts, based on the trilogy of ancient Greek tragedies by Aeschylus. Lim composed this when she was in her mid-20s, and she also wrote the text, along with Barrie Kosky. It’s performed by six singers, a dancer, and an orchestra that, as well as standard orchestral instruments, includes electric guitar, and a traditional Turkish stringed instrument. Lim wrote that because the stories in the tragedies are not easy to tell, the sounds she creates are also disturbing, and they include breathing, sobbing, laughing and whistling. The work lasts around 75 minutes, and the rest of the concert will consist of orchestral works by the British composers Ralph Vaughan Williams and Frederick Delius.","——————————","Moving on now to our second concert, this will begin with instrumental music by British composers – Benjamin Britten and Judith Weir. After the interval we’ll go to Australia for a piece by Ross Edwards: The Tower of Remoteness. According to Edwards, the inspiration for this piece came from nature, when he was sitting alone in the dry bed of a creek, overshadowed by the leaves of palm trees, listening to the birds and insects. The Tower of Remoteness is scored for piano and clarinet. Edwards says he realised years after writing the piece that he had subconsciously modelled its opening phrase on a bird call.","Ross Edwards was born in 1943 in Sydney, Australia, and studied at the Sydney Conservatorium of Music and the universities of Adelaide and Sydney. He’s well known in Australia, and in fact he’s one of the country’s most performed composers. He’s written a wide range of music, from symphonies and concertos to some composed specifically for children. Edward’s music has been described as being ‘deeply connected to Australia’, and it can be regarded as a celebration of the diversity of cultures that Australia can be proud of.","The last of the three Australian composers to be represented in our festival is Carl Vine. Born in 1954, Vine, like Liza Lim, comes from Perth, Western Australia. He took up the cornet at the age of five, switching to the piano five years later. However, he went to university to study physics, before changing to composition. After graduating he moved to Sydney and worked as a freelance pianist and composer. Before long he had become prominent in Australia as a composer for dance, and in fact has written 25 scores of that type.","In our third concert, Vine will be represented by his music for the flag hand-over ceremony of the Olympics held in 1996. This seven-minute orchestral piece was of course heard by millions of people worldwide, and we’ll hear it alongside works written by British composers Edward Elgar and, more recently, Thomas Adès."],"cloze":"<p>As you all know, the university is planning an arts festival for later this year, and here in the music department we’ve planned three concerts. These will be public performances, and <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>. The theme of the festival is links between the UK and Australia, and this is reflected in the music: each concert will feature both <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>. I’ll tell you briefly about the Australian music, as you probably won’t be familiar with that.</p><p>The first concert will include music by Liza Lim, who was born in Perth, Western Australia, in 1966. As a child, <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span> – like so many children – and also the violin. But when she was 11 her teachers encouraged her to start composing. She found this was her real strength, and she <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>, both in Australia and in other countries. As a composer, she has <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span>, other performers and festivals in several countries.</p><p>Liza Lim’s compositions are vibrant and full of energy, and she often explores Asian and <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span>, including the native instrument, the didgeridoo: this is featured in a work called The Compass. Her music is very expressive, so although it is complex, it has the power of <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span> alike.</p><p>In the festival we’re going to give a semi-staged performance of The Oresteia. This is an opera in seven parts, based on the trilogy of <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>. Lim composed this when she was in her mid-20s, and she also wrote the text, along with Barrie Kosky. It’s performed by six singers, a dancer, and an orchestra that, as well as <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span>, includes electric guitar, and a traditional Turkish stringed instrument. Lim wrote that because the stories in the tragedies are not easy to tell, the sounds she creates are also disturbing, and they include <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>. The work lasts around 75 minutes, and the rest of the concert will consist of orchestral works by the <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span> and Frederick Delius.</p><p>——————————</p><p>Moving on now to our second concert, this will begin with instrumental music by British composers – Benjamin Britten and Judith Weir. After the interval we’ll go to Australia for a piece by Ross Edwards: The Tower of Remoteness. According to Edwards, the <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span>, when he was sitting alone in the dry bed of a creek, <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span>, listening to the birds and insects. The Tower of Remoteness is scored for piano and clarinet. Edwards says he realised years after writing the piece that he had <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span> on a bird call.</p><p>Ross Edwards was born in 1943 in Sydney, Australia, and studied at the Sydney Conservatorium of Music and the universities of Adelaide and Sydney. He’s well known in Australia, and in fact he’s one of the country’s most performed composers. He’s written a wide range of music, from symphonies and concertos to some <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span>. Edward’s music has been described as being ‘deeply connected to Australia’, and it can be regarded as a celebration of <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>.</p><p>The last of the three <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> is Carl Vine. Born in 1954, Vine, like Liza Lim, comes from Perth, Western Australia. He took up the cornet at the age of five, switching to the piano five years later. However, he went to university to study <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>. After graduating he moved to Sydney and worked as a freelance pianist and composer. Before long he had become prominent in Australia as a composer for dance, and in fact has written 25 scores of that type.</p><p>In our third concert, <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> for the flag hand-over ceremony of the Olympics held in 1996. This seven-minute orchestral piece was of course heard by millions of people worldwide, and we’ll hear it alongside works written by <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>.</p>","clozeAnswers":["the programme has just been finalised","British and Australian composers","Lim originally learned to play the piano","studied and later taught composition","received commissions from numerous orchestras","Australian Aboriginal cultural sources","connecting with audiences and performers","ancient Greek tragedies by Aeschylus","standard orchestral instruments","breathing, sobbing, laughing and whistling","British composers Ralph Vaughan Williams","inspiration for this piece came from nature","overshadowed by the leaves of palm trees","subconsciously modelled its opening phrase","composed specifically for children","the diversity of cultures that Australia can be proud of","Australian composers to be represented in our festival","physics, before changing to composition","Vine will be represented by his music","British composers Edward Elgar and, more recently, Thomas Adès"],"vocab":[{"word":"composition","ipa":"/ˌkɒmpəˈzɪʃən/","pos":"Danh từ (n)","meaning":"sáng tác âm nhạc/bản sáng tác","example":"She found this was her real strength, and she studied and later taught composition, both in Australia and in other countries.","exampleVi":"Trong câu trên, “composition” mang nghĩa “sáng tác âm nhạc/bản sáng tác”."},{"word":"instrument","ipa":"/ˈɪnstɹəmənt/","pos":"Danh từ (n)","meaning":"nhạc cụ","example":"Liza Lim’s compositions are vibrant and full of energy, and she often explores Asian and Australian Aboriginal cultural sources, including the native instrument, the didgeridoo: this is featured in a work called The Compass.","exampleVi":"Trong câu trên, “instrument” mang nghĩa “nhạc cụ”."},{"word":"university","ipa":"/juːnɪˈvɜːsətiː/","pos":"Danh từ (n)","meaning":"đại học","example":"As you all know, the university is planning an arts festival for later this year, and here in the music department we’ve planned three concerts.","exampleVi":"Trong câu trên, “university” mang nghĩa “đại học”."},{"word":"diversity","ipa":"/daɪˈvɜː(ɹ)sɪti/","pos":"Danh từ (n)","meaning":"đa dạng","example":"Edward’s music has been described as being ‘deeply connected to Australia’, and it can be regarded as a celebration of the diversity of cultures that Australia can be proud of.","exampleVi":"Trong câu trên, “diversity” mang nghĩa “đa dạng”."},{"word":"instrumental","ipa":"
