</style></head><body><section id="entryGate" class="entry-screen"><div class="entry-card"><header class="entry-head"><small>IELTS - NGHE · TUẦN 37</small><h1>Listening Test 27</h1><p>Điền thông tin học sinh trước khi vào bài.</p></header><div class="entry-body"><p class="entry-note">Họ tên và lớp sẽ được giữ lại để gửi điểm sau khi hoàn thành bài.</p><label for="entryName">Họ và tên học sinh</label><input id="entryName" type="text" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"><label for="entryClass">Lớp IELTS</label><select id="entryClass"><option value="">Chọn lớp IELTS</option><option>IELTS 40</option><option>IELTS 41</option><option>IELTS 42</option><option>IELTS 43</option><option>IELTS 44</option><option>IELTS 45</option><option>IELTS 46</option><option>IELTS 47</option><option>IELTS 48</option><option>IELTS 49</option><option>IELTS 50</option><option>IELTS 51</option><option>IELTS 52</option><option>IELTS 53</option></select><button id="enterTest" type="button" disabled>Nhập họ tên và chọn lớp để vào bài</button></div></div></section><div id="testApp" hidden><header class="hero"><small>IELTS - NGHE · TUẦN 37</small><h1>Listening Test 27</h1><p>Full Test · Sections 1–4 · 40 questions</p></header><main class="shell"><nav id="sectionTabs" class="section-tabs"></nav><nav class="stage-tabs"><button type="button" data-stage="vocab">A · Từ vựng cần lưu ý</button><button type="button" data-stage="dictation">B · Điền chính tả</button><button type="button" data-stage="ielts">C · Câu hỏi IELTS</button><button type="button" data-stage="score">D · Nộp bài</button></nav><section id="content" class="lesson"></section></main></div><script>const DATA={"week":37,"test":27,"sourceRef":"Cambridge IELTS 15 Academic Listening Test 3","answers":{"1":["furniture"],"2":["meetings"],"3":["diary"],"4":["detail","details"],"5":["1 year","one year"],"6":["deliveries"],"7":["tidy"],"8":["team"],"9":["heavy"],"10":["customer"],"11":["B"],"12":["A"],"13":["C"],"14":["B"],"15":["C"],"16":["B"],"17":["B","D"],"18":["B","D"],"19":["A","E"],"20":["A","E"],"21":["page"],"22":["size"],"23":["graphic","graphics"],"24":["structure"],"25":["purpose"],"26":["assumption","assumptions"],"27":["A"],"28":["C"],"29":["C"],"30":["B"],"31":["mud"],"32":["clay"],"33":["metal"],"34":["hair"],"35":["bath","baths"],"36":["disease","diseases"],"37":["perfume"],"38":["salt"],"39":["science"],"40":["tax"]},"sections":[{"number":1,"transcript":["SALLY: Good morning. Thanks for coming in to see us here at the agency, Joe. I’m one of the agency representatives, and my name’s Sally Baker.","JOE: Hi Sally. I think we spoke on the phone, didn’t we?","SALLY: That’s right, we did. So thank you for sending in your CV. We’ve had quite a careful look at it and I think we have two jobs that might be suitable for you.","JOE: OK.","SALLY: The first one is in a company based in North London. They’re looking for an administrative assistant.","JOE: OK. What sort of company is it?","SALLY: They’re called Home Solutions and they design and make furniture.","JOE: Oh, I don’t know much about that, but it sounds interesting.","SALLY: Yes, well as I said, they want someone in their office, and looking at your past experience it does look as if you fit quite a few of the requirements. So on your CV it appears you’ve done some data entry?","JOE: Yes.","SALLY: So that’s one skill they want. Then they expect the person they appoint to attend meetings and take notes there …","JOE: OK. I’ve done that before, yes.","SALLY: And you’d need to be able to cope with general admin.","JOE: Filing and keeping records and so on? That should be OK. And in my last job I also had to manage the diary.","SALLY: Excellent. That’s something they want here too. I’d suggest you add it to your CV – I don’t think you mentioned that, did you?","JOE: No.","SALLY: So as far as the requirements go, they want good computer skills, of course, and they particularly mention spreadsheets.","JOE: That should be fine.","SALLY: And interpersonal skills – which would be something they’d check with your references.","JOE: I think that should be OK, yes.","SALLY: Then they mention that they want someone who is careful and takes care with details – just looking at your CV, I’d say you’re probably alright there.","JOE: I think so, yes. Do they want any special experience?","SALLY: I think they wanted some experience of teleconferencing.","JOE: I’ve got three years’ experience of that.","SALLY: let’s see, yes, good. In fact they’re only asking for at least one year, so that’s great. So is that something that might interest you?","JOE: It is, yes. The only thing is, you said they were in North London so it would be quite a long commute for me.","SALLY: OK.","————————","SALLY: So the second position might suit you better as far as the location goes; that’s for a warehouse assistant and that’s in South London.","JOE: Yes, that would be a lot closer.","SALLY: And you’ve worked in a warehouse before, haven’t you?","JOE: Yes.","SALLY: So as far as the responsibilities for this position go, they want someone who can manage the stock, obviously, and also deliveries.","JOE: That should be OK. You’ve got to keep track of stuff, but I’ve always been quite good with numbers.","SALLY: Good, that’s their first requirement. And they want someone who’s computer literate, which we know you are.","JOE: Sure.","SALLY: Then they mention organisational skills. They want someone who’s well organised.","JOE: Yes, I think I am.","SALLY: And tidy?","JOE: Yes, they go together really, don’t they?","SALLY: Sure. Then the usual stuff; they want someone who can communicate well both orally and in writing.","JOE: OK. And for the last warehouse job I had, one of the things I enjoyed most was being part of a team. I found that was really essential for the job.","SALLY: Excellent. Yes, they do mention that they want someone who’s used to that, yes. Now when you were working in a warehouse last time, what sorts of items were hen you were working in a <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> of items were you dealing with?</p><p>JOE: It was <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>, sinks and stoves and fridges.</p><p>SALLY: So you’re OK moving heavy things?</p><p>JOE: Sure. I’m quite strong, and I’ve had the training.</p><p>SALLY: Good. Now as far as experience goes, they mention they want someone with a licence, and that you have experience of driving in London – so you can cope with the traffic and so on.</p><p>JOE: Yes, no problem.</p><p>SALLY: And you’ve <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> … and the final thing they <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>. I think looking at your CV you’ve OK there.</p><p>JOE: Right. So what about pay? Can you tell me a bit more about that, please …</p>","clozeAnswers":["agency representatives, and my name’s","company based in North London","looking for an administrative assistant","looking at your past experience","appoint to attend meetings","Filing and keeping records","and they particularly mention spreadsheets","And interpersonal skills","want any special experience","wanted some experience of teleconferencing","something that might interest","a warehouse assistant","responsibilities for this position","Then they mention organisational skills","want someone who’s well organised","want someone who can communicate","warehouse last time, what sorts","mostly bathroom and kitchen equipment","got experience of warehouse work","mention is customer service"],"vocab":[{"word":"requirement","ipa":"/ɹɪˈkwʌɪəm(ə)nt/","pos":"Danh từ (n)","meaning":"yêu cầu","example":"Good, that’s their first requirement.","exampleVi":"Trong câu trên, “requirement” mang nghĩa “yêu cầu”."},{"word":"equipment","ipa":"/ɪˈkwɪpmənt/","pos":"Danh từ (n)","meaning":"thiết bị","example":"It was mostly bathroom and kitchen equipment, sinks and stoves and fridges.","exampleVi":"Trong câu trên, “equipment” mang nghĩa “thiết bị”."},{"word":"licence","ipa":"/ˈlaɪsəns/","pos":"Danh từ (n)","meaning":"giấy phép","example":"Now as far as experience goes, they mention they want someone with a licence, and that you have experience of driving in London – so you can cope with the traffic and so on.","exampleVi":"Trong câu trên, “licence” mang nghĩa “giấy phép”."},{"word":"mentioned","ipa":"/ˈmɛnʃənd/","pos":"Động từ (v)","meaning":"đề cập","example":"I’d suggest you add it to your CV – I don’t think you mentioned that, did you?","exampleVi":"Trong câu trên, “mentioned” mang nghĩa “đề cập”."},{"word":"bathroom","ipa":"/ˈbæθ.ɹuːm/","pos":"Danh từ (n)","meaning":"phòng tắm","example":"It was mostly bathroom and kitchen equipment, sinks and stoves and fridges.","exampleVi":"Trong câu trên, “bathroom” mang nghĩa “phòng tắm”."},{"word":"meetings","ipa":"/ˈmiːtɪŋz/","pos":"Danh từ (n)","meaning":"cuộc họp","example":"Then they expect the person they appoint to attend meetings and take notes there …","exampleVi":"Trong câu trên, “meetings” mang nghĩa “cuộc họp”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 1-10</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the notes below.</p>\n<p>Write&nbsp;<strong>ONE WORD AND/OR A NUMBER</strong>&nbsp;for each answer.</p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Employment Agency: Possible Jobs</strong></strong></p>\n<p><strong>First Job</strong></p>\n<p>Administrative assistant in a company that produces <span class=\"question-item\"><strong class=\"q-number\">1</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"1\" oninput=\"setQ(1,this.value)\"></span>&nbsp;(North London)</p>\n<p>Responsibilities</p>\n<ul>\n<li>data entry</li>\n<li>go to <span class=\"question-item\"><strong class=\"q-number\">2</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"2\" oninput=\"setQ(2,this.value)\"></span>&nbsp;and take notes</li>\n<li>general admin</li>\n<li>management of <span class=\"question-item\"><strong class=\"q-number\">3</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"3\" oninput=\"setQ(3,this.value)\"></span></li>\n</ul>\n<p>Requirements</p>\n<ul>\n<li>good computer skills including spreadsheets</li>\n<li>good interpersonal skills</li>\n<li>attention to <span class=\"question-item\"><strong class=\"q-number\">4</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"4\" oninput=\"setQ(4,this.value)\"></span></li>\n</ul>\n<p>Experience</p>\n<ul>\n<li>need a minimum of <span class=\"question-item\"><strong class=\"q-number\">5</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"5\" oninput=\"setQ(5,this.value)\"></span>&nbsp;of experience of teleconferencing</li>\n</ul>\n<p><strong>Second Job</strong></p>\n<p>Warehouse assistant in South London</p>\n<p>Responsibilities</p>\n<ul>\n<li>stock management</li>\n<li>managing <span class=\"question-item\"><strong class=\"q-number\">6</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"6\" oninput=\"setQ(6,this.value)\"></span></li>\n</ul>\n<p>Requirements</p>\n<ul>\n<li>ability to work with numbers</li>\n<li>good computer skills</li>\n<li>very organised and <span class=\"question-item\"><strong class=\"q-number\">7</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"7\" oninput=\"setQ(7,this.value)\"></span></li>\n<li>good communication skills</li>\n<li>used to working in a <span class=\"question-item\"><strong class=\"q-number\">8</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"8\" oninput=\"setQ(8,this.value)\"></span></li>\n<li>able to cope with items that are <span class=\"question-item\"><strong class=\"q-number\">9</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"9\" oninput=\"setQ(9,this.value)\"></span></li>\n</ul>\n<p>Need experience of</p>\n<ul>\n<li>driving in London</li>\n<li>warehouse work</li>\n<li><span class=\"question-item\"><strong class=\"q-number\">10</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"10\" oninput=\"setQ(10,this.value)\"></span> service</li>\n</ul>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-27/section-1.mp3"},{"number":2,"transcript":["PRESENTER:","My guest on the show today is Alice Riches who started the Street Play Scheme where she lives in Beechwood Road. For those of you that don’t already know – Street Play involves local residents closing off their street for a few hours so that children have a chance to play in the street safely. She started it in her own street, Beechwood Road, and the idea caught on, and there are now Street Play Schemes all over the city. So when did you actually start the scheme, Alice?","ALICE:","Well, I first had the idea when my oldest child was still a toddler, so that’s about six years ago now – but it took at least two years of campaigning before we were actually able to make it happen. So the scheme’s been up and running for three years now. We’d love to be able to close our road for longer – for the whole weekend, from Saturday morning until Sunday evening, for example. At the moment it’s just once a week. But when we started it was only once a month. But we’re working on it.","PRESENTER:","So what actually happens when Beechwood Road is closed?","ALICE:","We have volunteer wardens, mostly parents but some elderly residents too, who block off our road at either end. The council have provided special signs but there’s always a volunteer there to explain what’s happening to any motorists. Generally, they’re fine about it – we’ve only had to get the police involved once or twice.","Now I should explain that the road isn’t completely closed to cars. But only residents’ cars are allowed. If people really need to get in or out of Beechwood Road, it’s not a problem – as long as they drive at under 20 kilometres per hour. But most people just decide not to use their cars during this time, or they park in another street. The wardens are only there to stop through traffic.","PRESENTER:","So can anyone apply to get involved in Street Play?","ALICE:","Absolutely – we want to include all kids in the city – especially those who live on busy roads. It’s here that demand is greatest. Obviously, there isn’t such demand in wealthier areas where the children have access to parks or large gardens – or in the suburbs where there are usually more places for children to play outside.","I’d recommend that anyone listening who likes the idea should just give it a go. We’ve been surprised by the positive reaction of residents all over the city. And that’s not just parents. There are always a few who complain but they’re a tiny minority. On the whole everyone is very supportive and say they’re very happy to see children out on the street – even if it does get quite noisy.","——————","ALICE:","There have been so many benefits of Street Play for the kids. Parents really like the fact that the kids are getting fresh air instead of sitting staring at a computer screen, even if they’re not doing anything particularly energetic. And of course it’s great that kids can play with their friends outside without being supervised by their parents – but for me the biggest advantage is that kids develop confidence in themselves to be outside without their parents. The other really fantastic thing is that children get to know the adults in the street – it’s like having a big extended family.","PRESENTER:","It certainly does have a lot of benefits. I want to move on now and ask you about a related project in King Street.","ALICE:","Right. Well this was an experiment I was involved in where local residents decided to try and reduce the traffic along King Street, which is the busiest main road in our area, by persuading people not to use their cars for one day. We thought about making people pay more for parking – but we decided that would be really unpopular – so instead we just stopped people from parking on King Street but left the other car parks open.","It was surprising how much of a difference all this made. As we’d predicted, air quality was significantly better but what I hadn’t expected was how much quieter it would be – even with the buses still running. Of course everyone said they felt safer but we were actually amazed that sales in the shops went up considerably that day – we thought there’d be fewer people out shopping – not more.","PRESENTER:","That’s really interesting so the fact that …"],"cloze":"<p>PRESENTER:</p><p>My guest on the show today is Alice Riches who started the Street Play Scheme where she lives in Beechwood Road. For those of you that don’t already know – Street <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> off their street for a few hours so that children have a chance to play in the street safely. She started it in her own <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>, and the idea caught on, and there are now Street Play Schemes all over the city. So when did you <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>?</p><p>ALICE:</p><p>Well, I first had the idea when my oldest child was still a toddler, so that’s about six years ago now – but it took at least two years of campaigning before we were actually able to make it happen. So the scheme’s been up and running for three years now. We’d love to be able to close our road for longer – for the whole weekend, from <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>, for example. At the moment it’s just once a week. But when we started it was only once a month. But we’re working on it.</p><p>PRESENTER:</p><p>So what <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> is closed?</p><p>ALICE:</p><p>We have <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span> but some elderly residents too, who block off our road at either end. The council have provided special signs but there’s always a volunteer there to explain what’s happening to any motorists. Generally, they’re fine about it – we’ve only had to get the police involved once or twice.</p><p>Now I should explain that the <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span> to cars. But only residents’ cars are allowed. If people really need to get in or out of Beechwood Road, it’s not a problem – as long as they drive at under 20 <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>. But most people just decide not to use their cars during this time, or they park in another street. The wardens are only there to stop through traffic.</p><p>PRESENTER:</p><p>So can anyone apply to get involved in Street Play?</p><p>ALICE:</p><p><span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span> all kids in the city – especially those who live on busy roads. It’s here that demand is greatest. Obviously, there isn’t such demand in <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span> have access to parks or large gardens – or in the suburbs where there are usually more places for children to play outside.</p><p>I’d recommend that anyone listening who likes the idea should just give it a go. We’ve been surprised by the <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span> all over the city. And that’s not just parents. There are always a few who complain but they’re a tiny minority. <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span> and say they’re very happy to see children out on the street – even if it does get quite noisy.</p><p>——————</p><p>ALICE:</p><p>There have been so many benefits of Street Play for the kids. Parents really like the fact that the kids are getting fresh <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span> at a computer screen, even if they’re not doing <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span>. And of course it’s great that kids can play with their friends outside without being supervised by their parents – but for me the biggest advantage is that <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span> in themselves to be outside without their parents. The other really fantastic thing is that children get to know the adults in the street – it’s like having a big extended family.</p><p>PRESENTER:</p><p>It certainly does have a lot of benefits. I want to move on now and ask you about a <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>.</p><p>ALICE:</p><p>Right. Well this was an experiment I was involved in where <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> to try and reduce the traffic along King Street, which is the busiest main road in our area, by persuading people not to use their cars for one day. We thought about making people pay more for parking – but we decided that would be really unpopular – so instead we just <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span> on King Street but left the other car parks open.</p><p>It was surprising how much of a difference all this made. As we’d <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> better but what I hadn’t expected was how much quieter it would be – even with the buses still running. Of course everyone said they felt safer but we were actually amazed that sales in the shops went up considerably that day – we <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span> out shopping – not more.</p><p>PRESENTER:</p><p>That’s really interesting so the fact that …</p>","clozeAnswers":["Play involves local residents closing","street, Beechwood Road","actually start the scheme, Alice","Saturday morning until Sunday evening","actually happens when Beechwood Road","volunteer wardens, mostly parents","road isn’t completely closed","kilometres per hour","Absolutely – we want to include","wealthier areas where the children","positive reaction of residents","On the whole everyone is very supportive","air instead of sitting staring","anything particularly energetic","kids develop confidence","related project in King Street","local residents decided","stopped people from parking","predicted, air quality was significantly","thought there’d be fewer people"],"vocab":[{"word":"supportive","ipa":"/səˈpɔːtɪv/","pos":"Tính từ (adj)","meaning":"hỗ trợ","example":"On the whole everyone is very supportive and say they’re very happy to see children out on the street – even if it does get quite noisy.","exampleVi":"Trong câu trên, “supportive” mang nghĩa “hỗ trợ”."},{"word":"reaction","ipa":"/ɹiˈækʃən/","pos":"Danh từ (n)","meaning":"phản ứng","example":"We’ve been surprised by the positive reaction of residents all over the city.","exampleVi":"Trong câu trên, “reaction” mang nghĩa “phản ứng”."},{"word":"quality","ipa":"/ˈkwɒlɪti/","pos":"Danh từ (n)","meaning":"chất lượng","example":"As we’d predicted, air quality was significantly better but what I hadn’t expected was how much quieter it would be – even with the buses still running.","exampleVi":"Trong câu trên, “quality” mang nghĩa “chất lượng”."},{"word":"considerably","ipa":"/kənˈsɪdəɹəbli/","pos":"Trạng từ (adv)","meaning":"đáng kể/rất nhiều","example":"Of course everyone said they felt safer but we were actually amazed that sales in the shops went up considerably that day – we thought there’d be fewer people out shopping – not more.","exampleVi":"Trong câu trên, “considerably” mang nghĩa “đáng kể/rất nhiều”."},{"word":"absolutely","ipa":"/æb.səˈl(j)uːt.lɪ/","pos":"Trạng từ (adv)","meaning":"tuyệt đối","example":"Absolutely – we want to include all kids in the city – especially those who live on busy roads.","exampleVi":"Trong câu trên, “absolutely” mang nghĩa “tuyệt đối”."},{"word":"completely","ipa":"/kəmˈpliːtli/","pos":"Trạng từ (adv)","meaning":"hoàn toàn","example":"Now I should explain that the road isn’t completely closed to cars.","exampleVi":"Trong câu trên, “completely” mang nghĩa “hoàn toàn”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 11-16</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose the correct letter,&nbsp;<strong>A</strong>,&nbsp;<strong>B</strong>&nbsp;or&nbsp;<strong>C</strong>.</p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Street Play Scheme</strong></strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">11</strong> <span>When did the Street Play Scheme first take place?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q11\" value=\"A\" data-q=\"11\" onchange=\"setQ(11,this.value)\"><span>two years ago</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q11\" value=\"B\" data-q=\"11\" onchange=\"setQ(11,this.value)\"><span>three years ago</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q11\" value=\"C\" data-q=\"11\" onchange=\"setQ(11,this.value)\"><span>six years ago</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">12</strong> <span>How often is Beechwood Road closed to traffic now?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q12\" value=\"A\" data-q=\"12\" onchange=\"setQ(12,this.value)\"><span>once a week</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q12\" value=\"B\" data-q=\"12\" onchange=\"setQ(12,this.value)\"><span>on Saturdays and Sundays</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q12\" value=\"C\" data-q=\"12\" onchange=\"setQ(12,this.value)\"><span>once a month</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">13</strong> <span>Who is responsible for closing the road?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q13\" value=\"A\" data-q=\"13\" onchange=\"setQ(13,this.value)\"><span>a council official</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q13\" value=\"B\" data-q=\"13\" onchange=\"setQ(13,this.value)\"><span>the police</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q13\" value=\"C\" data-q=\"13\" onchange=\"setQ(13,this.value)\"><span>local wardens</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">14</strong> <span>Residents who want to use their cars</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q14\" value=\"A\" data-q=\"14\" onchange=\"setQ(14,this.value)\"><span>have to park in another street.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q14\" value=\"B\" data-q=\"14\" onchange=\"setQ(14,this.value)\"><span>must drive very slowly</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q14\" value=\"C\" data-q=\"14\" onchange=\"setQ(14,this.value)\"><span>need permission from a warden.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">15</strong> <span>Alice says that Street Play Schemes are most needed in</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q15\" value=\"A\" data-q=\"15\" onchange=\"setQ(15,this.value)\"><span>wealthy areas</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q15\" value=\"B\" data-q=\"15\" onchange=\"setQ(15,this.value)\"><span>quiet suburban areas.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q15\" value=\"C\" data-q=\"15\" onchange=\"setQ(15,this.value)\"><span>areas with heavy traffic.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">16</strong> <span>What has been the reaction of residents who are not parents?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q16\" value=\"A\" data-q=\"16\" onchange=\"setQ(16,this.value)\"><span>Many of them were unhappy at first.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q16\" value=\"B\" data-q=\"16\" onchange=\"setQ(16,this.value)\"><span>They like seeing children play in the street.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q16\" value=\"C\" data-q=\"16\" onchange=\"setQ(16,this.value)\"><span>They are surprised by the lack of noise.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 17-18</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose&nbsp;<strong>TWO</strong>&nbsp;letters,&nbsp;<strong>A-E</strong>.</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">17</strong> <strong class=\"q-number\">18</strong> <span>Which&nbsp;<strong>TWO</strong>&nbsp;benefits for children does Alice think are the most important?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input data-limit=\"2\" type=\"checkbox\" value=\"A\" data-group=\"17-18\" onchange=\"setGroup('17-18',this.value,this,2)\"><span>increased physical activity</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input data-limit=\"2\" type=\"checkbox\" value=\"B\" data-group=\"17-18\" onchange=\"setGroup('17-18',this.value,this,2)\"><span>increased sense of independence</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input data-limit=\"2\" type=\"checkbox\" value=\"C\" data-group=\"17-18\" onchange=\"setGroup('17-18',this.value,this,2)\"><span>opportunity to learn new games</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">D</label><input data-limit=\"2\" type=\"checkbox\" value=\"D\" data-group=\"17-18\" onchange=\"setGroup('17-18',this.value,this,2)\"><span>opportunity to be part of a community</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">E</label><input data-limit=\"2\" type=\"checkbox\" value=\"E\" data-group=\"17-18\" onchange=\"setGroup('17-18',this.value,this,2)\"><span>opportunity to make new friends</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 19-20</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose&nbsp;<strong>TWO</strong>&nbsp;letters,&nbsp;<strong>A-E</strong>.</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">19</strong> <strong class=\"q-number\">20</strong> <span>Which&nbsp;<strong>TWO</strong>&nbsp;results of the King Street experiment surprised Alice?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input data-limit=\"2\" type=\"checkbox\" value=\"A\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>more shoppers</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input data-limit=\"2\" type=\"checkbox\" value=\"B\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>improved safety</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input data-limit=\"2\" type=\"checkbox\" value=\"C\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>less air pollution</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">D</label><input data-limit=\"2\" type=\"checkbox\" value=\"D\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>more relaxed atmosphere</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">E</label><input data-limit=\"2\" type=\"checkbox\" value=\"E\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>less noise pollution</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-27/section-2.mp3"},{"number":3,"transcript":["HAZEL: Tom, could I ask you for some advice, please?","TOM: Yes of course, if you think I can help. What’s it about?","HAZEL: It’s my first media studies assignment, and I’m not sure how to go about it. You must have done it last year.","TOM: Is that the one comparing the coverage of a particular story in a range of newspapers?","HAZEL: That’s right.","TOM: Oh yes, I really enjoyed writing it.","HAZEL: So what sort of things do I need to compare?","TOM: Well, there are several things. For example, there’s the question of which page of the newspaper the item appears on.","HAZEL: You mean, because there’s a big difference between having it on the front page and the bottom of page ten, for instance?","TOM: Exactly. And that shows how important the editor thinks the story is. Then there’s the size – how many column inches the story is given, how many columns it spreads over.","HAZEL: And I suppose that includes the headline.","TOM: It certainly does. It’s all part of attracting the reader’s attention.","HAZEL: What about graphics – whether there’s anything visual in addition to the text?","TOM: Yes, you need to consider those, too, because they can have a big effect on the reader’s understanding of the story – sometimes a bigger effect than the text itself. Then you’ll need to look at how the item is put together: what structure is it given? Bear in mind that not many people read beyond the first paragraph, so what has the journalist put at the beginning? And if, say, three are conflicting opinions about something, does one appear near the end, where people probably won’t read it?","HAZEL: And newspapers sometimes give wrong or misleading information, don’t they?","Either deliberately or by accident. Should I be looking at that, too?","TOM: Yes, if you can. Compare what’s in different versions, and as far as possible, try and work out what’s true and what isn’t. And that relates to a very important point: what’s the writer’s purpose, or at least the most important one, if they have several. It may seem to be to inform the public, but often it’s that they want to create fear, or controversy, or to make somebody look ridiculous.","HAZEL: Gosh, I see what you mean. And I suppose the writer may make assumptions about the reader.","TOM: That’s right – about their knowledge of the subject, their attitudes, and their level of education, which means writing so that the readers understand without feeling patronised. All of that will make a difference to how the story is presented.","———————","HAZEL: Does it matter what type of story I write about?","TOM: No – national or international politics, the arts … Anything, as long as it’s covered in two or three newspapers. Though of course it’ll be easier and more fun if it’s something you’re interested in and know something about.","HAZEL: And on that basis a national news item would be worth analysing – I’m quite keen on politics, so I’ll try and find a suitable topic. What did you choose for your analysis, Tom?","TOM: I was interested in how newspapers express their opinions explicitly, so I wanted to compare editorials in different papers, but when I started looking. I couldn’t find two on the same topic that I felt like analysing.","HAZEL: In that case, I won’t even bother to look.","TOM: So in the end I chose a human interest story – a terribly emotional story about a young girl who was very ill, and lots of other people – mostly strangers – raised money so she could go abroad for treatment. Actually, I was surprised – some papers just wrote about how wonderful everyone was, but others considered the broader picture, like why treatment wasn’t available here.","HAZEL: Hmm, I usually find stories like that raise quite strong feelings in me! I’ll avoid that. Perhaps I’ll choose an arts topic, like different reviews of a film, or something about funding for the arts – I’ll think about that.","TOM: Yes, that might be interesting.","HAZEL: OK, well thanks a lot for your help, Tom. It’s been really useful.","TOM: You’re welcome. Good luck with the assignment, Hazel."],"cloze":"<p>HAZEL: Tom, could I ask you for some advice, please?</p><p>TOM: Yes of course, if you think I can help. What’s it about?</p><p>HAZEL: It’s my <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>, and I’m not sure how to go about it. You must have done it last year.</p><p>TOM: Is that the one comparing the <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> in a range of newspapers?</p><p>HAZEL: That’s right.</p><p>TOM: Oh yes, I really enjoyed writing it.</p><p>HAZEL: So what sort of things do I need to compare?</p><p>TOM: Well, there are several things. For example, there’s the question of which page of the <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span> on.</p><p>HAZEL: You mean, because there’s a big difference between having it on the front page and the bottom of page ten, for instance?</p><p>TOM: Exactly. And that shows how <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> the story is. Then there’s the size – how many column inches the story is given, how many columns it spreads over.</p><p>HAZEL: And I suppose that includes the headline.</p><p>TOM: It certainly does. It’s all part of <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span>.</p><p>HAZEL: What about <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span> in addition to the text?</p><p>TOM: Yes, you need to consider those, too, because they can have a big effect on the reader’s understanding of the story – sometimes a bigger effect than the text itself. Then you’ll need to look at how the item is put together: what structure is it given? Bear in mind that not many people <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span>, so what has the journalist put at the beginning? And if, say, three are <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>, does one appear near the end, where people probably won’t read it?</p><p>HAZEL: And newspapers sometimes <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span>, don’t they?</p><p>Either deliberately or by accident. Should I be looking at that, too?</p><p>TOM: Yes, if you can. Compare what’s in different versions, and as far as possible, try and work out what’s true and what isn’t. And that relates to a very important point: what’s <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>, or at least the most important one, if they have several. It may seem to be to inform the public, but often it’s that they want to create fear, or controversy, or to <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span>.</p><p>HAZEL: Gosh, I see what you mean. And I suppose the writer may make assumptions about the reader.</p><p>TOM: That’s right – about their knowledge of the subject, their attitudes, and their level of education, which means writing so that the <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" a nalist put at the beginning?","exampleVi":"Trong câu trên, “beginning” mang nghĩa “bắt đầu”."},{"word":"emotional","ipa":"/ɪˈməʊʃnəl/","pos":"Tính từ (adj)","meaning":"cảm xúc","example":"So in the end I chose a human interest story – a terribly emotional story about a young girl who was very ill, and lots of other people – mostly strangers – raised money so she could go abroad for treatment.","exampleVi":"Trong câu trên, “emotional” mang nghĩa “cảm xúc”."},{"word":"paragraph","ipa":"/ˈpæɹəɡɹɑːf/","pos":"Danh từ (n)","meaning":"đoạn văn","example":"Bear in mind that not many people read beyond the first paragraph, so what has the journalist put at the beginning?","exampleVi":"Trong câu trên, “paragraph” mang nghĩa “đoạn văn”."},{"word":"present","ipa":"/pɹəˈzɛnt/","pos":"Động từ (v)","meaning":"trình bày/đưa tin","example":"All of that will make a difference to how the story is presented.","exampleVi":"Trong câu trên, “present” mang nghĩa “trình bày/đưa tin”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 21-26</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the notes below.</p>\n<p>Write&nbsp;<strong>ONE WORD ONLY</strong>&nbsp;for each answer.</p>\n<p>What Hazel should analyse about items in newspapers:</p>\n<ul>\n<li>what <span class=\"question-item\"><strong class=\"q-number\">21</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"21\" oninput=\"setQ(21,this.value)\"></span>&nbsp;the item is on</li>\n<li>the <span class=\"question-item\"><strong class=\"q-number\">22</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"22\" oninput                                                                                                                                   \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 27-30</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>What does Hazel decide to do about each of the following types of articles?</p>\n<p><em>Write the correct letter,&nbsp;<strong>A</strong>,&nbsp;<strong>B</strong>&nbsp;or&nbsp;<strong>C</strong>, next to Questions</em></p>\n<p><strong>Types of articles</strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                                <div class=\"matching-dnd-questions\"><div class=\"question-item\"> • <span>national news item</span><span class=\"inline-choice\"><strong class=\"q-number\">27</strong><select data-q=\"27\" onchange=\"setQ(27,this.value)\" ari A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>arts</span><span class=\"inline-choice\"><strong class=\"q-number\">30</strong><select data-q=\"30\" onchange=\"setQ(30,this.value)\" aria-label=\"Question 30\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div></div>                                                                        <div class=\"option-bank\"><div><b>A</b> She will definitely look for a suitable article.</div><div><b>B</b> She may look for a suitable article.</div><div><b>C</b> She definitely won’t look for an article.</div></div>\n                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>\n                                        </div>","audio":"./audio/test-27/section-3.mp3"},{"number":4,"transcript":["Nowadays, we use different products for personal cleanliness, laundry, dishwashing and household cleaning, but this is very much a 20th-century development.","The origins of cleanliness date back to prehistoric times. Since water is essential for life, the earliest people lived near water and knew something about its cleansing properties – at least that it rinsed mud off their hands.","During the excavation of ancient Babylon, evidence was found that soapmaking was known as early as 2800 BC. Archaeologists discovered cylinders made of clay, with inscriptions on them saying that fats were boiled with askes. This is a method of making soap, though there’s no reference to the purpose of this material.","The early Greeks bathed for aesthetic reasons and apparently didn’t use soap. Instead, they cleaned their bodies with blocks of sand, pumice and ashes, then anointed themselves with oil, and scraped off the oil and dirt with a metal instrument known as a strigil. They also used oil mixed with ashes. Clothes were washed without soap in streams.","The ancient Germans and Gauls are also credited with discovering how to make a substance called ‘soap’, made of melted animal fat and ashes. They used this mixture to tint their hair red.","Soap got its name, according to an ancient Roman legend, from Mount Sapo, where animals were sacrificed, leaving deposits of animal fat. Rain washed these deposits, along with wood ashes, down into the clay soil along the River Tiber. Women found that this mixture greatly reduced the effort required to wash their clothes.","As Roman civilisation advanced, so did bathing. The first of the famous Roman baths, supplied with water from their aqueducts, was built around 312 BC. The baths were luxurious, and bathing became very popular. And by the second century AD, the Greek physician Galen recommended soap for both medicinal and cleaning purposes.","————————","After the fall of Rome in 467 AD and the resulting decline in bathing habits, much of Europe felt the impact of filth on public health. This lack of personal cleanliness and related unsanitary living conditions were major factors in the outbreaks of disease in the Middle Ages, and especially the Black Death of the 14th century.","Nevertheless, soapmaking became an established craft in Europe, and associations of soapmakers guarded their trade secrets closely. Vegetable and animal oils were used with ashes of plants, along with perfume, apparently for the first time. Gradually more varieties of soap became available for shaving and shampooing, as well as bathing and laundering.","A major step toward large-scale commercial soapmaking occurred in 1791, when a French chemist, Nicholas Leblanc, patented a process for turning salt into soda ash, or sodium carbonate. Soda ash is the alkali obtained from ashes that combines with fat to form soap. The Leblanc process yielded quantities of good-quality, inexpensive soda ash.","Modern soapmaking was born some 20 years later, in the early 19th century, with the discovery by Michel Eugène Chevreul, another French chemist, of the chemical nature and relationship of fats, glycerine and fatty acids. His studies established the basis for both fat and soap chemistry, and soapmaking became a science. Further developments during the 19th century made it easier and cheaper to manufacture soap.","Until the 19th century, soap was regarded as a luxury item, and was heavily taxed in several countries. As it became more readily available, it became an everyday necessity, a development that was reinforced when the high tax was removed. Soap was then something ordinary people could afford, and cleanliness standards improved.","With this widespread use came the development of milder soaps for bathing and soaps for use in the washing machines that were available to consumers by the turn of the 20th century."],"cloze":"<p>Nowadays, we use different products for <span class=\"gap
