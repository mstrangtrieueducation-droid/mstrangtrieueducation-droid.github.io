<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>IELTS - NGHE</title>
  <style>
    :root { color-scheme: light; font-family: Arial, "Helvetica Neue", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f4ee; color: #071942; padding: 24px; }
    main { width: min(680px, 100%); border-radius: 22px; background: #fff; border: 1px solid #d7dfec; box-shadow: 0 18px 48px rgba(7, 25, 66, .12); overflow: hidden; }
    header { background: #071942; color: #fff; padding: 38px 42px 32px; border-bottom: 7px solid #ffc83d; }
    header small { color: #78e6cf; font-weight: 800; letter-spacing: .16em; }
    h1 { margin: 14px 0 0; font-size: clamp(34px, 7vw, 56px); line-height: 1; }
    section { padding: 34px 42px 40px; }
    p { margin: 0; font-size: 19px; line-height: 1.55; }
  </style>
</head>
<body>
  <main>
    <header><small>MS. TRANG TRIEU EDUCATION</small><h1>IELTS - NGHE</h1></header>
    <section><p>Vui lòng mở bài bằng liên kết được giao.</p></section>
  </main>
</body>
</html>
