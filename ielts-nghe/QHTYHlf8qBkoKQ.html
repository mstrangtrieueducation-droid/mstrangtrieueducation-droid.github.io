</style></head><body><section id="entryGate" class="entry-screen"><div class="entry-card"><header class="entry-head"><small>IELTS - NGHE · TUẦN 34</small><h1>Listening Test 24</h1><p>Điền thông tin học sinh trước khi vào bài.</p></header><div class="entry-body"><p class="entry-note">Họ tên và lớp sẽ được giữ lại để gửi điểm sau khi hoàn thành bài.</p><label for="entryName">Họ và tên học sinh</label><input id="entryName" type="text" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"><label for="entryClass">Lớp IELTS</label><select id="entryClass"><option value="">Chọn lớp IELTS</option><option>IELTS 40</option><option>IELTS 41</option><option>IELTS 42</option><option>IELTS 43</option><option>IELTS 44</option><option>IELTS 45</option><option>IELTS 46</option><option>IELTS 47</option><option>IELTS 48</option><option>IELTS 49</option><option>IELTS 50</option><option>IELTS 51</option><option>IELTS 52</option><option>IELTS 53</option></select><button id="enterTest" type="button" disabled>Nhập họ tên và chọn lớp để vào bài</button></div></div></section><div id="testApp" hidden><header class="hero"><small>IELTS - NGHE · TUẦN 34</small><h1>Listening Test 24</h1><p>Full Test · Sections 1–4 · 40 questions</p></header><main class="shell"><nav id="sectionTabs" class="section-tabs"></nav><nav class="stage-tabs"><button type="button" data-stage="vocab">A · Từ vựng cần lưu ý</button><button type="button" data-stage="dictation">B · Điền chính tả</button><button type="button" data-stage="ielts">C · Câu hỏi IELTS</button><button type="button" data-stage="score">D · Nộp bài</button></nav><section id="content" class="lesson"></section></main></div><script>const DATA={"week":34,"test":24,"sourceRef":"Cambridge IELTS 14 Academic Listening Test 4","answers":{"1":["85"],"2":["roses"],"3":["trees"],"4":["stage"],"5":["speech"],"6":["support"],"7":["cabins"],"8":["C"],"9":["A"],"10":["B"],"11":["G"],"12":["D"],"13":["A"],"14":["E"],"15":["F"],"16":["B"],"17":["B","D"],"18":["B","D"],"19":["A","D"],"20":["A","D"],"21":["A"],"22":["C"],"23":["A"],"24":["B"],"25":["B"],"26":["F"],"27":["E"],"28":["C"],"29":["B"],"30":["G"],"31":["spring"],"32":["tools"],"33":["maps"],"34":["heavy"],"35":["marble"],"36":["light"],"37":["camera","cameras"],"38":["medical"],"39":["eyes"],"40":["wine"]},"sections":[{"number":1,"transcript":["ANDREW: Good morning, Clare House Hotel. Andrew speaking. I’m the Events Manager.","SAM: Good morning, Andrew. My name’s Samantha. I’m arranging a party for my parents’ fiftieth wedding anniversary, and I’m ringing to ask about hiring a room some time next September. Also my parents and several of the guests will need accommodation.","ANDREW: OK, I’m sure we can help you with that. Will you be having a sit-down meal or a buffet?","SAM: Probably a sit-down.","ANDREW: And do you know how many people there’ll be?","SAM: Around eighty, I think.","ANDREW: Well we have two rooms that can hold that number. One is the Adelphi Room. That can seat eighty-five, or hold over a hundred if people are standing for a buffet.","SAM: Right.","ANDREW: If you have live music, there’s room for four or five musicians in the gallery overlooking the room. Our guests usually appreciate the fact that the music can be loud enough for dancing, but not too loud for conversation.","SAM: Yes, I really don’t like it when you can’t talk.","ANDREW: Exactly. Now the Adelphi Room is at the back of the hotel, and there are French windows leading out onto the terrace. This has a beautiful display of pots of roses at that time of the year.","SAM: Which direction does it face?","ANDREW: Southwest, so that side of the hotel gets the sun in the afternoon and early evening.","SAM: Very nice.","ANDREW: From the terrace you can see the area of trees within the grounds of the hotel, or you can stroll through there to the river – that’s on the far side, so it isn’t visible from the hotel.","SAM: OK.","ANDREW: Then another option is the Carlton Room. This is a bit bigger – it can hold up to a hundred and ten people – and it has the advantage of a stage, which is useful if you have any entertainment, or indeed a small band can fit onto it.","SAM: And can you go outside from the room?","ANDREW: No, the Carlton Room is on the first floor, but on one side the windows look out onto the lake.","SAM: Lovely. I think either of those rooms would be suitable.","ANDREW: Can I tell you about some of the options we offer in addition?","SAM: Please do.","ANDREW: As well as a meal, you can have an MC, a Master of Ceremonies, who’ll be with you throughout the party.","SAM: What exactly is the MC’s function? I suppose they make a speech during the meal if we need one, do they?","ANDREW: That’s right. All our MCs are trained as public speakers, so they can easily get people’s attention – many guests are glad to have someone who can make themselves heard above the chatter! And they’re also your support – if anything goes wrong, the MC will deal with it, so you can relax.","SAM: Great! I’ll need to ask you about food, but something else that’s important is accommodation. You obviously have rooms in the hotel, but do you also have any other accommodation, like cabins, for example?","ANDREW: Yes, there are five in the grounds, all self-contained. They each sleep two to four people and have their own living room, bathroom and small kitchen.","SAM: That sounds perfect for what we’ll need.","——————————","SAM: Now you have various facilities, don’t you? Are they all included in the price of hiring the room? The pool, for instance.","ANDREW: Normally you’d be able to use it, but it’ll be closed throughout September for refurbishment, I’m afraid. The gym will be available, though, at no extra charge. That’s open all day, from six in the morning until midnight.","SAM: Right.","ANDREW: And the tennis courts, but there is a small additional payment for those. We have four courts, and it’s worth booking in advance if you possibly can, as there can be quite a long waiting list for them!","SAM: Right. Now could we discuss the food? This would be dinner, around seven o’clock …"],"cloze":"<p>ANDREW: Good morning, Clare House Hotel. Andrew speaking. I’m the Events Manager.</p><p>SAM: Good morning, Andrew. My name’s Samantha. I’m arranging a party for my <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>, and I’m ringing to ask about hiring a room some time next September. Also my parents and several of the <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>.</p><p>ANDREW: OK, I’m sure we can help you with that. Will you be having a sit-down meal or a buffet?</p><p>SAM: Probably a sit-down.</p><p>ANDREW: And do you know <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>?</p><p>SAM: Around eighty, I think.</p><p>ANDREW: Well we have two rooms that can hold that number. One is the Adelphi Room. That can seat eighty-five, or hold over a <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> for a buffet.</p><p>SAM: Right.</p><p>ANDREW: If you have live music, there’s room for four or five <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> the room. Our guests usually appreciate the fact that the music can be loud enough for dancing, but not too loud for conversation.</p><p>SAM: Yes, I really don’t like it when you can’t talk.</p><p>ANDREW: Exactly. Now the Adelphi Room is at the back of the hotel, and there are <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span>. This has a beautiful display of pots of roses at that time of the year.</p><p>SAM: Which direction does it face?</p><p>ANDREW: Southwest, so that side of the hotel gets the sun in the <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span>.</p><p>SAM: Very nice.</p><p>ANDREW: From the terrace you can see the area of <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span> of the hotel, or you can stroll through there to the river – that’s on the far side, so it isn’t visible from the hotel.</p><p>SAM: OK.</p><p>ANDREW: Then <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span> Room. This is a bit bigger – it can hold up to a hundred and ten people – and it has the advantage of a stage, which is useful if you have any entertainment, or indeed <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>.</p><p>SAM: And can you go outside from the room?</p><p>ANDREW: No, the Carlton Room is on the first floor, but on one side the windows look out onto the lake.</p><p>SAM: Lovely. I think either of those rooms would be suitable.</p><p>ANDREW: Can I tell you about <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span>?</p><p>SAM: Please do.</p><p>ANDREW: As well as a meal, you can have an MC, <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span>, who’ll be with you throughout the party.</p><p>SAM: What exactly is the MC’s function? I suppose they make a speech during the meal if we need one, do they?</p><p>ANDREW: That’s right. All our MCs are trained as public speakers, so they can easily get people’s attention – <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span> who can make themselves heard above the chatter! And they’re also your <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span>, the MC will deal with it, so you can relax.</p><p>SAM: Great! I’ll need to ask you about food, but something <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span>. You obviously have rooms in the hotel, but do you also have any other accommodation, like cabins, for example?</p><p>ANDREW: Yes, there are five in the grounds, all self-contained. They each sleep two to four people and have their own living <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>.</p><p>SAM: That sounds perfect for what we’ll need.</p><p>——————————</p><p>SAM: Now <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span>, don’t you? Are they all included in the price of hiring the room? The pool, for instance.</p><p>ANDREW: Normally you’d be able to use it, but it’ll be <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>, I’m afraid. The gym will be available, though, at no extra charge. That’s open all day, from six in the morning until midnight.</p><p>SAM: Right.</p><p>ANDREW: And the tennis courts, but there is a <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> for those. We have four courts, and it’s worth booking in advance if you possibly can, as there can be quite a long waiting list for them!</p><p>SAM: Right. Now could we discuss the food? This would be <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span> …</p>","clozeAnswers":["parents’ fiftieth wedding anniversary","guests will need accommodation","how many people there’ll be","hundred if people are standing","musicians in the gallery overlooking","French windows leading out onto the terrace","afternoon and early evening","trees within the grounds","another option is the Carlton","a small band can fit onto it","some of the options we offer in addition","a Master of Ceremonies","many guests are glad to have someone","support – if anything goes wrong","else that’s important is accommodation","room, bathroom and small kitchen","you have various facilities","closed throughout September for refurbishment","small additional payment","dinner, around seven o’clock"],"vocab":[{"word":"visible","ipa":"/ˈvɪzəb(ə)l/","pos":"Tính từ (adj)","meaning":"có thể nhìn thấy","example":"From the terrace you can see the area of trees within the grounds of the hotel, or you can stroll through there to the river – that’s on the far side, so it isn’t visible from the hotel.","exampleVi":"Trong câu trên, “visible” mang nghĩa “có thể nhìn thấy”."},{"word":"additional","ipa":"/əˈdɪʃənəl/","pos":"Tính từ (adj)","meaning":"bổ sung","example":"And the tennis courts, but there is a small additional payment for those.","exampleVi":"Trong câu trên, “additional” mang nghĩa “bổ sung”."},{"word":"appreciate","ipa":"/əˈpɹiː.si.eɪt/","pos":"Động từ (v)","meaning":"đánh giá cao","example":"Our guests usually appreciate the fact that the music can be loud enough for dancing, but not too loud for conversation.","exampleVi":"Trong câu trên, “appreciate” mang nghĩa “đánh giá cao”."},{"word":"beautiful","ipa":"/ˈbjuːtɪfəl/","pos":"Tính từ (adj)","meaning":"đẹp","example":"This has a beautiful display of pots of roses at that time of the year.","exampleVi":"Trong câu trên, “beautiful” mang nghĩa “đẹp”."},{"word":"musician","ipa":"/mjuˈzɪʃən/","pos":"Danh từ (n)","meaning":"nhạc công","example":"If you have live music, there’s room for four or five musicians in the gallery overlooking the room.","exampleVi":"Trong câu trên, “musician” mang nghĩa “nhạc công”."},{"word":"obvious","ipa":"/ˈɒ.vɪəs/","pos":"Tính từ (adj)","meaning":"rõ ràng","example":"You obviously have rooms in the hotel, but do you also have any other accommodation, like cabins, for example?","exampleVi":"Trong câu trên, “obvious” mang nghĩa “rõ ràng”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 1-7</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the notes below.</p>\n<p>Write&nbsp;<strong>ONE WORD AND/OR A NUMBER</strong>&nbsp;for each answer.</p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Enquiry about booking hotel room for event</strong></strong></p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><em>Example</em></strong></p>\n<p>Andrew is the ……<em>Events</em>…… Manager</p>\n<p><strong>Rooms</strong></p>\n<p>Adelphi Room</p>\n<p>number of people who can sit down to eat: <span class=\"question-item\"><strong class=\"q-number\">1</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"1\" oninput=\"setQ(1,this.value)\"></span></p>\n<p>has a gallery suitable for musicians</p>\n<p>can go out and see the <span class=\"question-item\"><strong class=\"q-number\">2</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"2\" oninput=\"setQ(2,this.value)\"></span>&nbsp;in pots on the terrace</p>\n<p>terrace has a view of a group of <span class=\"question-item\"><strong class=\"q-number\">3</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"3\" oninput=\"setQ(3,this.value)\"></span></p>\n<p>Carlton Room</p>\n<p>number of people who can sit down to eat: 110</p>\n<p>has a <span class=\"question-item\"><strong class=\"q-number\">4</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"4\" oninput=\"setQ(4,this.value)\"></span></p>\n<p>View of the lake</p>\n<p><strong>Options</strong></p>\n<p>Master of Ceremonies:</p>\n<p>can give a <span class=\"question-item\"><strong class=\"q-number\">5</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"5\" oninput=\"setQ(5,this.value)\"></span>&nbsp;while people are eating</p>\n<p>will provide <span class=\"question-item\"><strong class=\"q-number\">6</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"6\" oninput=\"setQ(6,this.value)\"></span>&nbsp;if there are any problems</p>\n<p>Accommodation:</p>\n<p>in the hotel rooms or <span class=\"question-item\"><strong class=\"q-number\">7</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"7\" oninput=\"setQ(7,this.value)\"></span></p>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 8-10</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>What is said about using each of the following hotel facilities?</p>\n<p>Choose&nbsp;<strong>THREE</strong>&nbsp;answers from the box and write the correct letter,&nbsp;<strong>A</strong>,&nbsp;<strong>B</strong>&nbsp;or&nbsp;<strong>C</strong>, next to Questions.</p>\n<p><strong>Availability</strong></p>\n<p><strong>Hotel facilities</strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                                <div class=\"matching-dnd-questions\"><div class=\"question-item\"> • <span>outdoor swimming pool</span><span class=\"inline-choice\"><strong class=\"q-number\">8</strong><select data-q=\"8\" onchange=\"setQ(8,this.value)\" aria-label=\"Question 8\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>gym</span><span class=\"inline-choice\"><strong class=\"q-number\">9</strong><select data-q=\"9\" onchange=\"setQ(9,this.value)\" aria-label=\"Question 9\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>tennis courts</span><span class=\"inline-choice\"><strong class=\"q-number\">10</strong><select data-q=\"10\" onchange=\"setQ(10,this.value)\" aria-label=\"Question 10\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div></div>                                                                        <div class=\"option-bank\"><div><b>A</b> included in cost of hiring room</div><div><b>B</b> available at extra charge</div><div><b>C</b> not available</div></div>\n                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>\n                                        </div>","audio":"./audio/test-24/section-1.mp3"},{"number":2,"transcript":["Hello everyone. I’m Jake Stevens and I’m your rep here at the hotel. I’m sure you’ll all have a great time here. So let me tell you a bit about what’s on offer. I’ll start by telling you about some of the excursions that are available for guests.","One thing you have to do while you’re here is go dolphin watching. On our boat trips, we pretty well guarantee you’ll see dolphins – if you don’t you can repeat the trip free of charge. We organise daily trips for just 35 euros. Unfortunately there aren’t any places left for this afternoon’s trip, but come and see me to book for later in the week.","If you’re energetic, I’d recommend our forest walk. It’s a guided walk of about seven kilometres. There’ll be a stop half way, and you’ll be provided with a drink and sandwiches. There’s some fairly steep climbs up the hills, so you need to be reasonably fit for this one, with good shoes, and bring a waterproof in case it rains. It’s just 25 euros all inclusive, and it’s every Wednesday.","Then on Thursdays we organise a cycle trip, which will give you all the fun of biking without the effort. We’ll take you and your bike up to the top of Mount Larna, and leave you to bike back – it’s a 700-metre drop in just 20 kilometres so this isn’t really for inexperienced cyclists as you’ll be going pretty fast. And if it’s a clear day, you’ll have fantastic views.","On our local craft tour you can find out about the traditional activities in the island. And the best thing about this trip is that it’s completely free. You’ll be taken to a factory where jewellery is made, and also a ceramics centre. If you want, you can buy some of the products but that’s entirely up to you. The trip starts after lunch on Thursday, and you’ll return by 6 pm.","If you’re interested in astronomy you may already know that the island’s one of the best places in the world to observe the night sky. We can offer trips to the observatory on Friday for those who are interested. They cost 90 euros per person and you’ll be shown the huge telescopes and have a talk from an expert, who’ll explain all about how they work. Afterwards we’ll head down to Sunset Beach, where you can have a dip in the ocean if you want before we head off back to the hotel.","Finally, there’s horse riding. This is organised by the Equestrian Centre over near Playa Cortino and it’s a great experience if you’re a keen horseback rider, or even if you’ve never been on a horse before. They take you down to the beach, and you can canter along the sand and through the waves. It costs 35 euros and it’s available every day.","———————————","So there’s plenty to do in the daytime, but what about night life?","Well, the number one attraction’s called ‘Musical Favourites’. Guests enjoy a three-course meal and unlimited free drinks, and watch a fantastic show, starting with musicals set in Paris and then crossing the Atlantic to Las Vegas and finally Copacabana. At the end the cast members come down from the stage, still in their stunning costumes, and you’ll have a chance to chat with them. It’s hugely popular, so let me know now if you’re interested because it’s no good leaving it until the last minute. It’s on Friday night. Tickets are just 50 euros each, but for an extra 10 euros you can have a table right by the stage.","If you’d like to go back in time, there’s the Castle Feast on Saturday evening. It’s held in a twelfth-century castle, and you eat in the great courtyard, with ladies in long gowns serving your food. You’re given a whole chicken each, which you eat in the medieval way, using your hands instead of cutlery, and you’re entertained by competitions where the horseback riders attempt to knock one another off their horses. Then you can watch the dancers in the ballroom and join in as well if you want. OK, so now if anyone …"],"cloze":"<p>Hello everyone. I’m Jake Stevens and I’m your rep here at the hotel. I’m sure you’ll all have a great time here. So let me tell you a bit about what’s on offer. <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> that are <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>.</p><p>One thing you have to do while you’re here is go dolphin watching. On our boat trips, we pretty well guarantee you’ll see dolphins – if you don’t you can repeat the trip free of charge. We organise daily trips for just 35 euros. Unfortunately there aren’t any <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>, but come and see me to book for later in the week.</p><p>If you’re <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> walk. It’s a guided walk of about seven kilometres. There’ll be a stop half way, and you’ll be provided with a drink and sandwiches. There’s some fairly steep climbs up the hills, so you need to be reasonably fit for this one, with good <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> in case it rains. It’s just <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span>, and it’s every Wednesday.</p><p>Then on Thursdays we organise a cycle trip, which will give you all the fun of biking without the effort. We’ll take you and your bike up to the top of Mount Larna, and leave you to bike back – it’s a 700-metre drop in just 20 kilometres so this isn’t really <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span> as you’ll be going pretty fast. And if it’s a clear day, you’ll have fantastic views.</p><p>On our local craft tour you can find out about the <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>. And the best thing about this trip is that it’s completely free. You’ll be taken to a <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span>, and also a ceramics centre. If you want, you can buy some of the products but that’s entirely up to you. The trip starts after lunch on Thursday, and you’ll return by 6 pm.</p><p>If you’re <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span> you may already know that the island’s one of the best places in the world to observe the night sky. We can offer trips to the observatory on Friday for those who are interested. They cost 90 euros per person and you’ll be shown the huge telescopes and have a talk from <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span>. Afterwards we’ll head down to Sunset Beach, where you can have a dip in the ocean if you want before we head off back to the hotel.</p><p>Finally, there’s horse riding. This is <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span> over near Playa Cortino and it’s a great experience if you’re a keen horseback rider, or <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span> before. They take you down to the beach, and you can canter along the sand and through the waves. It costs 35 euros and it’s available every day.</p><p>———————————</p><p>So there’s plenty to do in the daytime, but what about night life?</p><p>Well, the <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span>. Guests enjoy a three-course meal and unlimited free drinks, and watch a <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span> set in Paris and then crossing the Atlantic to <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>. At the end the cast members come down from the stage, still in their stunning costumes, and you’ll have a chance to chat with them. It’s <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> if you’re interested because it’s no good leaving it until the last minute. It’s on Friday night. Tickets are just 50 euros each, but for an extra 10 euros you can have a table right by the stage.</p><p>If you’d like to go back in time, there’s the <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>. It’s held in a twelfth-century castle, and you eat in the great courtyard, with ladies in long gowns serving your food. You’re given a whole chicken each, which you eat in the medieval way, using your hands instead of cutlery, and you’re entertained by <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> to <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>. Then you can watch the dancers in the ballroom and join in as well if you want. OK, so now if anyone …</p>","clozeAnswers":["I’ll start by telling you about some of the excursions","available for guests","places left for this afternoon’s trip","energetic, I’d recommend our forest","shoes, and bring a waterproof","25 euros all inclusive","for inexperienced cyclists","traditional activities in the island","factory where jewellery is made","interested in astronomy","an expert, who’ll explain all about how they work","organised by the Equestrian Centre","even if you’ve never been on a horse","number one attraction’s called ‘Musical Favourites’","fantastic show, starting with musicals","Las Vegas and finally Copacabana","hugely popular, so let me know now","Castle Feast on Saturday evening","competitions where the horseback riders attempt","knock one another off their horses"],"vocab":[{"word":"observatory","ipa":"/əbˈzəːvət(ə)ɹi/","pos":"Danh từ (n)","meaning":"đài thiên văn","example":"We can offer trips to the observatory on Friday for those who are interested.","exampleVi":"Trong câu trên, “observatory” mang nghĩa “đài thiên văn”."},{"word":"inclusive","ipa":"/ɪnˈkluːsɪv/","pos":"Tính từ (adj)","meaning":"trọn gói/đã bao gồm tất cả","example":"It’s just 25 euros all inclusive, and it’s every Wednesday.","exampleVi":"Trong câu trên, “inclusive” mang nghĩa “trọn gói/đã bao gồm tất cả”."},{"word":"factory","ipa":"/ˈfæktəɹi/","pos":"Danh từ (n)","meaning":"nhà máy","example":"You’ll be taken to a factory where jewellery is made, and also a ceramics centre.","exampleVi":"Trong câu trên, “factory” mang nghĩa “nhà máy”."},{"word":"inexperienced","ipa":"/ɪnəkˈspɪəɹi.ənst/","pos":"Tính từ (adj)","meaning":"thiếu kinh nghiệm","example":"We’ll take you and your bike up to the top of Mount Larna, and leave you to bike back – it’s a 700-metre drop in just 20 kilometres so this isn’t really for inexperienced cyclists as you’ll be going pretty fast.","exampleVi":"Trong câu trên, “inexperienced” mang nghĩa “thiếu kinh nghiệm”."},{"word":"unfortunately","ipa":"/ʌnˈfɔːtjʊnətli/","pos":"Trạng từ (adv)","meaning":"không may","example":"Unfortunately there aren’t any places left for this afternoon’s trip, but come and see me to book for later in the week.","exampleVi":"Trong câu trên, “unfortunately” mang nghĩa “không may”."},{"word":"traditional","ipa":"/tɹəˈdɪʃnəl/","pos":"Tính từ (adj)","meaning":"truyền thống","example":"On our local craft tour you can find out about the traditional activities in the island.","exampleVi":"Trong câu trên, “traditional” mang nghĩa “truyền thống”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 11-16</h2>\n e)\" aria-label=\"Question 14\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option><option value=\"H\">H</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class=\"question-item\"> • <span>observatory trip</span><span class=\"inline-choice\"><strong class=\"q-number\">15</strong><select data-q=\"15\" onchange=\"setQ(15,this.value)\" aria-label=\"Question 15\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option><option value=\"H\">H</option></select></span></div>\n
