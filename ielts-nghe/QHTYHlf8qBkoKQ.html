<b>H</b> transport not included</div></div>\n                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 17-18</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose&nbsp;<strong>TWO</strong>&nbsp;letters,&nbsp;<strong>A-E</strong>.</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">17</strong> <strong class=\"q-number\">18</strong> <span>Which&nbsp;<strong>TWO</strong>&nbsp;things does the speaker say about the attraction called&nbsp;<em>Musical Favourites</em>?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input data-limit=\"2\" type=\"checkbox\" value=\"A\" data-group=\"17-18\" onchange=\"setGroup('17-18',this.value,this,2)\"><span>You pay extra for drinks.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input data-limit=\"2\" type=\"checkbox\" value=\"B\" data-group=\"17-18\" onchange=\"setGroup('17-18',this.value,this,2)\"><span>You must book it in advance.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input data-limit=\"2\" type=\"checkbox\" value=\"C\" data-group=\"17-18\" onchange=\"setGroup('17-18',this.value,this,2)\"><span>You get a reduction if you buy two tickets.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">D</label><input data-limit=\"2\" type=\"checkbox\" value=\"D\" data-group=\"17-18\" onchange=\"setGroup('17-18',this.value,this,2)\"><span>You can meet the performers.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">E</label><input data-limit=\"2\" type=\"checkbox\" value=\"E\" data-group=\"17-18\" onchange=\"setGroup('17-18',this.value,this,2)\"><span>You can take part in the show.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 19-20</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose&nbsp;<strong>TWO</strong>&nbsp;letters,&nbsp;<strong>A-E</strong>.</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">19</strong> <strong class=\"q-number\">20</strong> <span>Which&nbsp;<strong>TWO</strong>&nbsp;things does the speaker say about the&nbsp;<em>Castle Feast</em>?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input data-limit=\"2\" type=\"checkbox\" value=\"A\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>Visitors can dance after the meal.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input data-limit=\"2\" type=\"checkbox\" value=\"B\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>There is a choice of food.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input data-limit=\"2\" type=\"checkbox\" value=\"C\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>Visitors wear historical costume.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">D</label><input data-limit=\"2\" type=\"checkbox\" value=\"D\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>Knives and forks are not used.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">E</label><input data-limit=\"2\" type=\"checkbox\" value=\"E\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>The entertainment includes horse races.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-24/section-2.m4a"},{"number":3,"transcript":["STEPHANIE: Hello, Trevor.","TREVOR: Hello, Stephanie. You said you wanted to talk about the course I’m taking on literature for children.","STEPHANIE: That’s right. I’m thinking of doing it next year, but I’d like to find out more about it first.","TREVOR: OK, well, as you probably know, it’s a one-year course. It’s divided into six modules, and you have to take all of them. One of the most interesting ones, for me, at least, was about the purpose of children’s literature.","STEPHANIE: You mean, whether it should just entertain children or should be educational, as well.","TREVOR: Right, and whether the teaching should be factual – giving them information about the world – or ethical, teaching them values. What’s fascinating is that the writer isn’t necessarily conscious of the message they’re conveying. For instance, a story might show a child who has a problem as a result of not doing what an adult has told them to do, implying that children should always obey adults.","STEPHANIE: I see what you mean.","TREVOR: That module made me realise how important stories are – they can have a significant effect on children as they grow up. Actually, it inspired me to have a go at it myself, just for my own interest. I know can’t compete with the really popular stories, like the Harry Potter books – they’re very good, and even young kids like my seven-year-old niece love reading them.","STEPHANIE: Mm. I’m very interested in illustrations in stories. Is that covered in the course?","TREVOR: Yes, there’s a module on pictures, and how they’re sometimes central to the story.","STEPHANIE: That’s good. I remember some frightening ones I saw as a child and I can still see them vividly in my mind, years later! Pictures can be so powerful, just as powerful as words. I’ve always enjoyed drawing, so that’s the field I want to go into when I finish the course. I bet that module will be really helpful.","TREVOR: I’m sure it will. We also studied comics in that module, but I’m not convinced of their value, not compared with books. One of the great things about words is that you use your imagination, but with a comic you don’t have to.","STEPHANIE: But children are so used to visual input – on TV, video games, and so on. There are plenty of kids who wouldn’t even try to read a book, so I think comics can serve a really useful purpose.","TREVOR: You mean, it’s better to read a comic than not to read at all? Yes, I suppose you’re right. I just think its sad when children don’t read books.","STEPHANIE: What about books for girls and books for boys? Does the course go into that?","TREVOR: Yes, there’s a module on it. For years, lots of stories, in English, at least, assumed that boys went out and did adventurous things and girls stayed at home and played with dolls. I was amazed how many books were targeted at just one sex or the other. Of course this reflects society as it is when the books are written.","STEPHANIE: That’s true. So it sounds as though you think it’s a good course.","TREVOR: Definitely.","———————————","TREVOR: Have you been reading lots of children’s stories, to help you decide whether to take the course?","STEPHANIE: Yeah. I’ve gone as far back as the late seventeenth century, though I know there were earlier children’s stories.","TREVOR: So does that mean you’ve read Perrault’s fairy tales? Cinderella, The Sleeping Beauty, and so on.","STEPHANIE: Yes. They must be important, because no stories of that type had been written before, there were the first. Then there’s The Swiss Family Robinson.","TREVOR: I haven’t read that.","STEPHANIE: The English name makes it sound as though Robinson is the family’s surname, but a more accurate translation would be The Swiss Robinsons, because it’s about a Swiss family who are shipwrecked, like Robinson Crusoe in the novel of a century earlier.","TREVOR: Well I never knew that!","STEPHANIE: Have you read Hoffmann’s The Nutcracker and the Mouse King?","TREVOR: Wasn’t that the basis for Tchaikovsky’s ballet The Nutcracker?","STEPHANIE: That’s right. It has some quite bizarre elements.","TREVOR: I hope you’ve read Oscar Wilde’s The Happy Prince. It’s probably my favourite children’s story of all time.","STEPHANIE: Mine too! And it’s so surprising, because Wilde is best known for his plays, and most of them are very witty, but The Happy Prince is really moving. I struggled with Tolkien’s The Lord of the Rings – there long books, and I gave up after one.","TREVOR: It’s extremely popular, though.","STEPHANIE: Yeah, but whereas something like The Happy Prince just carried me along with it, The Lord of the Rings took more effort than I was prepared to give it.","TREVOR: I didn’t find that – I love it.","STEPHANIE: Another one I’ve read is War Horse.","TREVOR: Oh yes. It’s about the First Word War, isn’t it? Hardly what you’d expect for a children’s story.","STEPHANIE: Exactly, but it’s been very successful. Have you read any …"],"cloze":"<p>STEPHANIE: Hello, Trevor.</p><p>TREVOR: Hello, Stephanie. You said you wanted to talk about the course I’m <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>.</p><p>STEPHANIE: That’s right. I’m thinking of doing it next year, but I’d like to find out more about it first.</p><p>TREVOR: OK, well, as you probably know, it’s a one-year course. It’s divided into six modules, and you have to take all of them. One of the most interesting ones, for me, at least, was about the <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>.</p><p>STEPHANIE: You mean, whether it should just entertain children or should be educational, as well.</p><p>TREVOR: Right, and whether the teaching should be factual – giving them information about the world – or ethical, teaching them values. What’s fascinating is that the writer isn’t necessarily <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>. For instance, a story might show a child who has a problem as a result of not doing what an adult has told them to do, implying that <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>.</p><p>STEPHANIE: I see what you mean.</p><p>TREVOR: That module made me realise how important stories are – they can have a <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> as they grow up. Actually, it inspired me to have a go at it myself, just for my own interest. I know can’t compete with the really popular stories, like the Harry Potter books – they’re very good, and even young kids like my seven-year-old niece love reading them.</p><p>STEPHANIE: Mm. I’m very <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span>. Is that covered in the course?</p><p>TREVOR: Yes, there’s a module on pictures, and how they’re sometimes central to the story.</p><p>STEPHANIE: That’s good. I <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span> I saw as a child and I can still see them vividly in my mind, years later! Pictures can be so powerful, just as powerful as words. I’ve <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>, so that’s the field I want to go into when I finish the course. I bet that module will be really helpful.</p><p>TREVOR: I’m sure it will. We also studied comics in that module, but I’m <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span>, not compared with books. One of the great things about words is that you use your imagination, but with a comic you don’t have to.</p><p>STEPHANIE: But children are so used to visual input – on TV, video games, and so on. There are plenty of kids who wouldn’t even try to read a book, so I think comics can <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>.</p><p>TREVOR: You mean, it’s better to read a comic than not to read at all? Yes, I suppose you’re right. I just think its sad when children don’t read books.</p><p>STEPHANIE: What about books for girls and books for boys? Does the course go into that?</p><p>TREVOR: Yes, there’s a module on it. For years, lots of stories, in English, at least, assumed that <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span> and girls stayed at home and played with dolls. I was amazed how many books were targeted at just one sex or the other. <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span> as it is when the books are written.</p><p>STEPHANIE: That’s true. So it sounds as though you think it’s a good course.</p><p>TREVOR: Definitely.</p><p>———————————</p><p>TREVOR: Have you been reading lots of children’s stories, to help you decide whether to take the course?</p><p>STEPHANIE: Yeah. I’ve gone as far back as the late seventeenth century, <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span>.</p><p>TREVOR: So does that mean you’ve read <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span>? Cinderella, The Sleeping Beauty, and so on.</p><p>STEPHANIE: Yes. They must be important, because no stories of that type had been written before, there were the first. Then there’s The Swiss Family Robinson.</p><p>TREVOR: I haven’t read that.</p><p>STEPHANIE: The English name makes it sound as though <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span>, but a more accurate translation would be The Swiss Robinsons, because it’s about a Swiss family who are <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span> in the novel of a century earlier.</p><p>TREVOR: Well I never knew that!</p><p>STEPHANIE: Have you read Hoffmann’s The Nutcracker and the Mouse King?</p><p>TREVOR: Wasn’t that the basis for <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span>?</p><p>STEPHANIE: That’s right. It has some quite bizarre elements.</p><p>TREVOR: I hope you’ve read Oscar Wilde’s The Happy Prince. It’s probably my favourite children’s story of all time.</p><p>STEPHANIE: Mine too! And it’s so surprising, because Wilde is best known for his plays, and most of them are very witty, but The Happy Prince is really moving. I struggled with <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span> – there long books, and I gave up after one.</p><p>TREVOR: <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span>, though.</p><p>STEPHANIE: Yeah, but whereas something like The Happy Prince just carried me along with it, The Lord of the Rings took more effort than I was prepared to give it.</p><p>TREVOR: I didn’t find that – I love it.</p><p>STEPHANIE: Another one I’ve read is War Horse.</p><p>TREVOR: Oh yes. It’s about the First Word War, isn’t it? Hardly <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>.</p><p>STEPHANIE: Exactly, but it’s been very successful. Have you read any …</p>","clozeAnswers":["taking on literature for children","purpose of children’s literature","conscious of the message they’re conveying","children should always obey adults","significant effect on children","interested in illustrations in stories","remember some frightening ones","always enjoyed drawing","not convinced of their value","serve a really useful purpose","boys went out and did adventurous things","Of course this reflects society","though I know there were earlier children’s stories","Perrault’s fairy tales","Robinson is the family’s surname","shipwrecked, like Robinson Crusoe","Tchaikovsky’s ballet The Nutcracker","Tolkien’s The Lord of the Rings","it’s extremely popular","what you’d expect for a children’s story"],"vocab":[{"word":"imagination","ipa":"/ɪˌmædʒəˈneɪʃən/","pos":"Danh từ (n)","meaning":"trí tưởng tượng","example":"One of the great things about words is that you use your imagination, but with a comic you don’t have to.","exampleVi":"Trong câu trên, “imagination” mang nghĩa “trí tưởng tượng”."},{"word":"translation","ipa":"/trænzˈleɪʃən/","pos":"Danh từ (n)","meaning":"bản dịch","example":"The English name makes it sound as though Robinson is the family’s surname, but a more accurate translation would be The Swiss Robinsons, because it’s about a Swiss family who are shipwrecked, like Robinson Crusoe in the novel of a century earlier.","exampleVi":"Trong câu trên, “translation” mang nghĩa “bản dịch”."},{"word":"conscious","ipa":"/ˈkɒn.ʃəs/","pos":"Tính từ (adj)","meaning":"nhận thức được","example":"What’s fascinating is that the writer isn’t necessarily conscious of the message they’re conveying.","exampleVi":"Trong câu trên, “conscious” mang nghĩa “nhận thức được”."},{"word":"fascinating","ipa":"/ˈfæsɪˌneɪtɪŋ/","pos":"Tính từ (adj)","meaning":"hấp dẫn","example":"What’s fascinating is that the writer isn’t necessarily conscious of the message they’re conveying.","exampleVi":"Trong câu trên, “fascinating” mang nghĩa “hấp dẫn”."},{"word":"frightening","ipa":"/ˈfɹaɪtnɪŋ/","pos":"Tính từ (adj)","meaning":"đáng sợ","example":"I remember some frightening ones I saw as a child and I can still see them vividly in my mind, years later!","exampleVi":"Trong câu trên, “frightening” mang nghĩa “đáng sợ”."},{"word":"seventeenth","ipa":"/ˌsɛvənˈtiːnθ/","pos":"Số thứ tự/tính từ (ordinal/adj)","meaning":"thứ mười bảy","example":"I’ve gone as far back as the late seventeenth century, though I know there were earlier children’s stories.","exampleVi":"Trong câu trên, “seventeenth” mang nghĩa “thứ mười bảy”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 21-25</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose the correct letter,&nbsp;<strong>A</strong>,&nbsp;<strong>B</strong>&nbsp;or&nbsp;<strong>C</strong>.</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">21</strong> <span>What does Trevor find interesting about the purpose of children’s literature?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q21\" value=\"A\" data-q=\"21\" onchange=\"setQ(21,this.value)\"><span>the fact that authors may not realise what values they’re teaching</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q21\" value=\"B\" data-q=\"21\" onchange=\"setQ(21,this.value)\"><span>the fact that literature can be entertaining and educational at the same time</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q21\" value=\"C\" data-q=\"21\" onchange=\"setQ(21,this.value)\"><span>the fact that adults expect children to imitate characters in literature</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">22</strong> <span>Trevor says the module about the purpose of children’s literature made him</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q22\" value=\"A\" data-q=\"22\" onchange=\"setQ(22,this.value)\"><span>analyse some of the stories that his niece reads.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q22\" value=\"B\" data-q=\"22\" onchange=\"setQ(22,this.value)\"><span>wonder how far popularity reflects good qualify.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q22\" value=\"C\" data-q=\"22\" onchange=\"setQ(22,this.value)\"><span>decide to start writing some children’s stories.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">23</strong> <span>Stephanie is interested in the Pictures module because</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q23\" value=\"A\" data-q=\"23\" onchange=\"setQ(23,this.value)\"><span>she intends to become an illustrator.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q23\" value=\"B\" data-q=\"23\" onchange=\"setQ(23,this.value)\"><span>she can remember beautiful illustrations from her childhood.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q23\" value=\"C\" data-q=\"23\" onchange=\"setQ(23,this.value)\"><span>she believes illustrations are more important than words.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">24</strong> <span>Trevor and Stephanie agree that comics</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q24\" value=\"A\" data-q=\"24\" onchange=\"setQ(24,this.value)\"><span>are inferior to books.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q24\" value=\"B\" data-q=\"24\" onchange=\"setQ(24,this.value)\"><span>have the potential for being useful.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q24\" value=\"C\" data-q=\"24\" onchange=\"setQ(24,this.value)\"><span>discourage children from using their imagination.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">25</strong> <span>With regard to books aimed at only boys or only girls, Trevor was surprised</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q25\" value=\"A\" data-q=\"25\" onchange=\"setQ(25,this.value)\"><span>how long the distinction had gone unquestioned.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q25\" value=\"B\" data-q=\"25\" onchange=\"setQ(25,this.value)\"><span>how few books were aimed at both girls and boys.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q25\" value=\"C\" data-q=\"25\" onchange=\"setQ(25,this.value)\"><span>how many children enjoyed books intended for the opposite sex.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 26-30</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>What comment is made about each of these stories?</p>\n<p>Choose&nbsp;<strong>FIVE</strong>&nbsp;answers from the box and write the correct letter,&nbsp;<strong>A-G</strong>, next to Questions</p>\n<p><strong>Comments</strong></p>\n<p><strong>Stories</strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                                <div class=\"matching-dnd-questions\"><div class=\"question-item\"> • <span>Perrault’s fairy tales</span><span class=\"inline-choice\"><strong class=\"q-number\">26</strong><select data-q=\"26\" onchange=\"setQ(26,this.value)\" aria-label=\"Question 26\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span><em>The Swiss Family Robinson</em></span><span class=\"inline-choice\"><strong class=\"q-number\">27</strong><select data-q=\"27\" onchange=\"setQ(27,this.value)\" aria-label=\"Question 27\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span><em>The Nutcracker and the Mouse King</em></span><span class=\"inline-choice\"><strong class=\"q-number\">28</strong><select data-q=\"28\" onchange=\"setQ(28,this.value)\" aria-label=\"Question 28\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span><em>The Lord of the Rings</em></span><span class=\"inline-choice\"><strong class=\"q-number\">29</strong><select data-q=\"29\" onchange=\"setQ(29,this.value)\" aria-label=\"Question 29\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span><em>War Horse</em></span><span class=\"inline-choice\"><strong class=\"q-number\">30</strong><select data-q=\"30\" onchange=\"setQ(30,this.value)\" aria-label=\"Question 30\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div></div>                                                                        <div class=\"option-bank\"><div><b>A</b> translated into many other languages</div><div><b>B</b> hard to read</div><div><b>C</b> inspired a work in a different area of art</div><div><b>D</b> more popular than the author’s other works</div><div><b>E</b> original title refers to another book</div><div><b>F</b> started a new genre</div><div><b>G</b> unlikely topic</div></div>\n                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>\n                                        </div>","audio":"./audio/test-24/section-3.m4a"},{"number":4,"transcript":["In today’s class I’m going to talk about marine archaeology, the branch of archaeology focusing on human interaction with the sea, lakes and rivers. It’s the study of ships, cargoes, shipping facilities, and other physical remains. I’ll give you an example, then go on to show how this type of research is being transformed by the use of the latest technology.","Atlit-Yam was a village on the coast of the eastern Mediterranean, which seems to have been thriving until around 7,000 BC. The residents kept cattle, caught fish and stored grain. They had wells for fresh water, many of their houses were built around a courtyard and were constructed of stone. The village contained an impressive monument: seven half-tonne stones standing in a semicircle around a spring, that might have been used for ceremonial purposes.","Atlit-Yam may have been destroyed swiftly by a tsunami, or climate change may have caused glaciers to melt and sea levels to rise, flooding the village gradually. Whatever the cause, it now lies ten metres below the surface of the Mediterranean, buried under sand at the bottom of the sea. It’s been described as the largest and best preserved prehistoric settlement ever found on the seabed.","For marine archaeologists, Atlit-Yam is a treasure trove. Research on the buildings, tools and the human remains has revealed how the bustling village once functioned, and even what diseases some of its residents suffered from. But of course this is only one small village, one window into a lost world. For a fuller picture, researchers need more sunken settlements, but the hard part is finding them.","Underwater research used to require divers to find shipwrecks or artefacts, but in the second half of the twentieth century, various types of underwater vehicles were developed, some controlled from a ship on the surface, and some of them autonomous, which means they don’t need to be operated by a person.","Autonomous underwater vehicles, or AUVs, are used in the oil industry, for instance, to create maps of the seabed before rigs and pipelines are installed. To navigate they use sensors, such as compasses and sonar. Until relatively recently they were very expensive, and so heavy that they had to be launched from a large vessel with a winch.","————————","But the latest AUVs are much easier to manoeuvre – they can be launched from the shore or a small ship. And they’re much cheaper, which makes them more accessible to research teams. They’re also very sophisticated. They can communicate with each other and, for example, work out the most efficient way to survey a site, or to find particular objects on the seabed.","Field tests show the approach can work. For example, in a trial in 2015, three AUVs searched for wrecks at Marzamemi, off the coast of Sicily. The site is the final resting place of an ancient Roman ship, which sank in the sixth century AD while ferrying prefabricated marble elements for the construction of an early church. The AUVs mapped the area in detail, finding other ships carrying columns of the same material.","Creating an internet in the sea for AUVs to communicate is no easy matter. Wifi networks on land use electromagnetic waves, but in water these will only travel a few centimetres. Instead, a more complex mix of technologies is required. For short distances, AUVs can share date using light, while acoustic waves are used to communicate over long distances. But more creative solutions are also being developed, where an AUV working on the seabed offloads data to a second AUV, which then surfaces and beams the data home to the research team using a satellite.","There’s also a system that enables AUVs to share information from seabed scans, and other data. So if an AUV surveying the seabed finds an intriguing object, it can share the coordinates of the object – that is, its position – with a nearby AUV that carries superior cameras, and arrange for that AUV to make a closer inspection of the object.","Marine archaeologists are excited about the huge potential of these AUVs for their discipline. One site where they’re going to be deployed is the Gulf of Baratti, off the Italian coast. In 1974, a 2,000-year-old Roman vessel was discovered here, in 18 metres of water. When it sank, it was carrying medical goods, in wooden or tin receptacles. Its cargo gives us insight into the treatments available all those years ago, including tablets that are thought to have been dissolved to form a cleansing liquid for the eyes.","Other Roman ships went down nearby, taking their cargoes with them. Some held huge pots made of terracotta. Some were used for transporting cargoes of olive oil, and others held wine. In many cases it’s only these containers that remain, while the wooden ships have been buried under silt on the seabed.","Another project that’s about to …"],"cloze":"<p>In today’s class I’m going to talk about marine archaeology, the branch of <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> with the sea, lakes and rivers. It’s the study of ships, cargoes, shipping facilities, and other physical remains. I’ll give you an example, then go on to show how this type of research is being transformed by the use of the latest technology.</p><p>Atlit-Yam was a village on the coast of the eastern Mediterranean, which seems to have been <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>. The residents kept cattle, caught fish and stored grain. They had wells for fresh water, many of their houses were built around a courtyard and were constructed of stone. The <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>: seven half-tonne stones standing in a semicircle around a spring, that might have been used for ceremonial purposes.</p><p>Atlit-Yam may have been destroyed swiftly by a tsunami, or climate change may have caused glaciers to melt and sea levels to <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>. Whatever the cause, it now lies ten metres below the surface of the Mediterranean, buried under sand at the bottom of the sea. It’s been described as the <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> ever found on the seabed.</p><p>For marine archaeologists, <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"C =\"paper-input\" data-q=\"34\" oninput=\"setQ(34,this.value)\"></span>.</li>\n</ul>\n<p><strong>LATEST AUVs</strong></p>\n<ul>\n<li>much easier to use, relatively cheap, sophisticated</li>\n</ul>\n<p><strong>Tests</strong>:</p>\n<ul>\n<li>Marzamemi, Sicily: found ancient Roman ships carrying architectural elements made of <span class=\"question-item\"><strong class=\"q-number\">35</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"35\" oninput=\"setQ(35,this.value)\"></span></li>\n</ul>\n<p><strong>Underwater internet:</strong></p>\n<ul>\n<li><span class=\"question-item\"><strong class=\"q-number\">36</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"36\" oninput=\"setQ(36,this.value)\"></span> is used for short distance communication, acoustic waves for long distance</li>\n<li>plans for communication with researchers by satellite</li>\n<li>AUV can send data to another AUV that has better <span class=\"question-item\"><strong class=\"q-number\">37</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"37\" oninput=\"setQ(37,this.value)\"></span>, for example</li>\n</ul>\n<p><strong>Planned research in Gulf of Baratti:</strong></p>\n<ul>\n<li>to find out more about wrecks of ancient Roman ships, including</li>\n</ul>\n<p>–&nbsp; one carrying <span class=\"question-item\"><strong class=\"q-number\">38</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"38\" oninput=\"setQ(38,this.value)\"></span> supplies; tablets may have been used for cleaning the <span class=\"question-item\"><strong class=\"q-number\">39</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"39\" oninput=\"setQ(39,this.value)\"></span></p>\n<p>–&nbsp; others carrying containers of olive oil or <span class=\"question-item\"><strong class=\"q-number\">40</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"40\" oninput=\"setQ(40,this.value)\"></span></p>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n let si=0,stage="vocab",scoreSendPromise=null,scoreRetryTimer=null,scoreRetryAttempt=0;
const storageKey=`ielts-nghe-w${DATA.week}`;
const scoreParts=Object.freeze([
  {key:"1-2",label:()=>`Tuần ${DATA.week} · Sections 1–2`,a:1,b:2},
  {key:"3-4",label:()=>`Tuần ${DATA.week} · Sections 3–4`,a:3,b:4}
]);
function loadState(){try{const value=JSON.parse(localStorage.getItem(storageKey)||"{}");return value&&typeof value==="object"?value:{}}catch{return {}}}

  const complete=scoreParts.every(part=>parts[part.key]==="sent");
  return {status:complete?"sent":value?.status==="error"?"error":"idle",fingerprint:String(value?.fingerprint||""),sentAt:complete?String(value?.sentAt||""):"",parts};
}
function freshFinal(){return {phase:"draft",requestedAt:"",answersFingerprint:"",submittedAt:""}}
const state=loadState(),loadedSchemaVersion=state.schemaVersion;
state.q=state.q&&typeof state.q==="object"?state.q:{};
state.g=state.g&&typeof state.g==="object"?state.g:{};
state.studentName=String(state.studentName||"");state.studentClass=String(state.studentClass||"");
if(loadedSchemaVersion!==SCHEMA_VERSION){
  state.scores={};state.confirmations={};state.review={};state.submission=freshSubmission();state.final=freshFinal();
}else{
  state.scores=state.scores&&typeof state.scores==="object"?state.scores:{};
  state.confirmations=state.confirmations&&typeof state.confirmations==="object"?state.confirmations:{};
  state.review=state.review&&typeof state.review==="object"?state.review:{};
  state.submission=normalizeSubmission(state.submission);

  if(state.final.phase==="sending")state.final.phase="error";
}
state.schemaVersion=SCHEMA_VERSION;
const $=s=>document.querySelector(s);

const scoresReady=()=>finalRequested()&&scoreKeys().every(key=>Number.isInteger(state.scores[key]));

function section(index=si){return DATA.sections[index]}

  const groups=new Map();
  for(const match of section(index).questions.matchAll(/data-group="([\d-]+)"/g)){
    const key=match[1];if(!groups.has(key))groups.set(key,key.split("-").map(Number));
  }
  return groups;
}
function dictationComplete(index){return section(index).clozeAnswers.every((_,gap)=>norm(state.g[`${index+1}-${gap}`]))}
function ieltsComplete(index){

  return true;

function currentComplete(){return stage==="dictation"?dictationComplete(si):stage==="ielts"?ieltsComplete(si):true}

function draftProgressText(){return `Đã điền đủ ${completedPartCount()}/8 phần. Điểm và đáp án chỉ mở sau khi em bấm xác nhận nộp toàn bài.`}
function setQ(question,value){if(finalRequested())return;state.q[question]=value;save();refreshDraftUi()}

function setGroup(key,value,box,max){
  if(finalRequested()){box.checked=!box.checked;return}
  let values=state.q[key]||[];
  if(box.checked&&!values.includes(value)&&values.length>=max){box.checked=false;return}
  values=box.checked?[...new Set([...values,value])]:values.filter(item=>item!==value);state.q[key]=values;save();refreshDraftUi();
}
function speak(word){speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(word);utterance.lang="en-GB";speechSynthesis.speak(utterance)}

function formatAudioDuration(seconds){
  if(!Number.isFinite(seconds)||seconds<=0)return "";
  const total=Math.round(seconds),hours=Math.floor(total/3600),minutes=Math.floor(total%3600/60),secs=String(total%60).padStart(2,"0");
  return hours?`${hours}:${String(minutes).padStart(2,"0")}:${secs}`:`${minutes}:${secs}`;

function retryAudio(){const audio=$("#sectionAudio"),url=audio?.dataset.audioUrl;if(!audio||!url)return;setAudioStatus("Đang tải lại audio…");audio.pause();audio.src=url;audio.load()}

  const audio=$("#sectionAudio"),url=audio?.dataset.audioUrl;if(!audio||!url){setAudioStatus("Audio chưa được cấu hình đúng. Vui lòng báo giáo viên.",{error:true});return}

  const failed=()=>{console.error("[IELTS Listening] Không tải được audio",{week:DATA.week,section:si+1,url,errorCode:audio.error?.code||0});setAudioStatus("Không tải được audio. Kiểm tra kết nối rồi bấm “Thử lại”.",{error:true,retry:true})};
  audio.addEventListener("loadstart",()=>setAudioStatus("Đang tải audio…"));audio.addEventListener("loadedmetadata",ready);audio.addEventListener("canplay",ready);audio.addEventListener("stalled",()=>setAudioStatus("Audio đang tải chậm. Vui lòng chờ hoặc bấm “Thử lại”.",{retry:true}));audio.addEventListener("error",failed);$("#audioRetry").onclick=retryAudio;
  if(audio.error)failed();else if(audio.readyState>=1)ready();else setAudioStatus("Đang tải audio…");
}
function audioBox(){const url=sectionAudioUrl();return `<b>● AUDIO GỐC · SECTION ${si+1}</b><audio id="sectionAudio" controls preload="metadata" src="${esc(url)}" data-audio-url="${esc(url)}" aria-describedby="audioStatus"></audio><div id="audioStatus" class="audio-status" role="status" aria-live="polite">Đang tải audio…</div><button id="audioRetry" class="audio-retry" type="button" hidden>Thử lại audio</button>`}
function vocab(){return `<div class="vocab-grid">${section().vocab.map(item=>`<article class="vocab-card"><button class="sound" type="button" onclick='speak(${JSON.stringify(item.word)})'>◖))</button><h3>${item.word}</h3><div class="ipa">${item.ipa}</div><div class="pos">${item.pos}</div><div class="meaning">${item.meaning}</div><p class="example">${item.example}</p><div class="translation">${item.exampleVi}</div></article>`).join("")}</div>`}
function restoreInputs(){
  document.querySelectorAll("[data-q]").forEach(element=>{const question=element.dataset.q;if(element.type==="radio")element.checked=state.q[question]===element.value;else element.value=state.q[question]||""});
  document.querySelectorAll("[data-group]").forEach(element=>element.checked=(state.q[element.dataset.group]||[]).includes(element.value));
  document.querySelectorAll("[data-gap]").forEach(element=>element.value=state.g[`${si+1}-${element.dataset.gap}`]||"");
  if(finalRequested())document.querySelectorAll("#content input,#content select").forEach(control=>control.disabled=true);
}
function updateStageTabs(){
  document.querySelectorAll(".stage-tabs button").forEach(button=>{
    button.classList.toggle("on",button.dataset.stage===stage);
    if(button.dataset.stage==="score"){
      button.textContent=finalSubmitted()?"D · Kết quả":"D · Nộp bài";button.disabled=false;
      button.title=allResponsesComplete()||finalRequested()?"Xác nhận nộp bài hoặc xem trạng thái":"Xem tiến độ hoàn thành toàn bài";
    }
  });
}
function partProgressView(){
  const done=currentComplete();
  if(finalRequested())return `<div class="result">Bài đã khóa sau khi xác nhận nộp. Xem trạng thái và đáp án tại mục D.</div>`;
  return `<div id="partProgress" class="result ${done?"good":""}">${done?"✓ Phần này đã điền đủ. Hãy tiếp tục hoàn thành các phần còn lại.":stage==="dictation"?"Điền đủ 20/20 chỗ. Hệ thống chỉ lưu nháp, không tự nộp.":"Làm đủ 10/10 câu. Hệ thống chỉ lưu nháp, không tự nộp."}<br><small>${draftProgressText()}</small></div>`;
}
function answerKeyView(){
  return DATA.sections.map((item,index)=>{
    const dictation=section(index).clozeAnswers.map((answer,gap)=>`<div><b>${gap+1}.</b> ${esc(answer)}</div>`).join("");
    const [first,last]=range(index),ielts=[],grouped=new Set();
    for(const [,numbers] of questionGroupsFor(index)){
      const valid=[...new Set(numbers.flatMap(question=>DATA.answers[question]||[]))];
      ielts.push(`<div><b>${numbers.join("–")}.</b> ${valid.map(esc).join(", ")}</div>`);numbers.forEach(question=>grouped.add(question));
    }
    for(let question=first;question<=last;question++)if(!grouped.has(question))ielts.push(`<div><b>${question}.</b> ${(DATA.answers[question]||[]).map(esc).join(" / ")}</div>`);
    return `<details><summary>Section ${index+1} · Chính tả ${state.scores[`d${index+1}`]}/20 · IELTS ${state.scores[`i${index+1}`]}/10</summary><div class="answer-review"><strong>Đáp án chính tả</strong>${dictation}<strong>Đáp án IELTS</strong>${ielts.join("")}</div></details>`;
  }).join("");
}
function scoreGridView(){return `<div class="score-grid">${scoreKeys().map(key=>`<div class="score"><small>${key[0]==="d"?"Chính tả":"IELTS"} · Section ${key.slice(1)}</small><br><b>${state.scores[key]}/${key[0]==="d"?20:10}</b></div>`).join("")}</div>`}
function submissionMessage(){
  if(!finalRequested())return "Bài vẫn đang ở trạng thái nháp.";
  const fingerprint=scoreFingerprint(),current=state.submission.fingerprint===fingerprint,done=current?scoreParts.filter(part=>state.submission.parts?.[part.key]==="sent").length:0;
  if(finalSubmitted())return "✓ Điểm đã được tự động ghi vào sổ lớp. Đáp án đã mở bên dưới.";
  if(current&&state.submission.status==="sending")return `Đang tự động ghi điểm vào sổ lớp${done?` · đã ghi ${done}/2 nhóm`:""}…`;
  if(current&&state.submission.status==="error")return `Mạng đang gián đoạn${done?` · đã giữ an toàn ${done}/2 nhóm điểm`:""}. Hệ thống sẽ tự gửi lại phần còn thiếu.`;
  return "Đang chuẩn bị ghi điểm vào sổ lớp…";
}
function finalView(){
  const completed=completedPartCount(),ready=allResponsesComplete();
  if(!finalRequested())return `<div class="score-view"><h2>Xác nhận nộp toàn bài</h2><div class="student-summary"><span>${esc(state.studentName)}</span><span>${esc(state.studentClass)}</span></div><div class="result">${draftProgressText()}</div><button id="finalSubmit" class="submit" type="button" ${ready?"":"disabled"} onclick="finalizeSubmission(event)">${ready?"XÁC NHẬN ĐÃ LÀM XONG & GHI ĐIỂM":`HOÀN THÀNH ĐỦ 8/8 PHẦN (${completed}/8)`}</button><p>Chỉ nút này mới chấm bài và gửi điểm. Nhập câu cuối không tự nộp.</p></div>`;
  if(!finalSubmitted())return `<div class="score-view"><h2>Đang ghi điểm</h2><div class="student-summary"><span>${esc(state.studentName)}</span><span>${esc(state.studentClass)}</span></div><div id="scoreStatus" class="result">${submissionMessage()}</div>${state.submission.status==="error"?'<button class="submit" type="button" onclick="resumeFinalSubmission()">THỬ GỬI LẠI ĐIỂM</button>':""}<p>Bài đã khóa. Đáp án sẽ mở ngay sau khi hệ thống ghi điểm xong.</p></div>`;
  const total=scoreKeys().reduce((sum,key)=>sum+state.scores[key],0);
  return `<div class="score-view"><h2>Kết quả Tuần ${DATA.week}</h2><div class="student-summary"><span>${esc(state.studentName)}</span><span>${esc(state.studentClass)}</span></div><div id="scoreStatus" class="result">${submissionMessage()}<br><b>Tổng điểm: ${total}/120</b></div>${scoreGridView()}<h3>Đáp án toàn bài</h3>${answerKeyView()}</div>`;
}
function refreshDraftUi(){
  updateStageTabs();const progress=$("#partProgress");if(progress&&!finalRequested())progress.outerHTML=partProgressView();
  if(stage==="score"&&!finalRequested()){const content=$("#content");if(content)content.innerHTML=finalView()}
}
function render(){
  document.querySelectorAll(".section-tabs button").forEach((button,index)=>button.classList.toggle("on",index===si));updateStageTabs();
  if(stage==="vocab")$("#content").innerHTML=vocab();
  if(stage==="dictation")$("#content").innerHTML=`<div class="workspace"><aside class="audio-side">${audioBox()}</aside><div class="scroll-panel transcript">${section().cloze}</div></div>${partProgressView()}`;
  if(stage==="ielts")$("#content").innerHTML=`<div class="workspace"><aside class="audio-side">${audioBox()}</aside><div class="scroll-panel">${section().questions}</div></div>${partProgressView()}`;
  if(stage==="score")$("#content").innerHTML=finalView();
  restoreInputs();if(stage==="dictation"||stage==="ielts")initAudioPlayer();
}
function gradeAllResponses(){
  const scores={},review={};
  DATA.sections.forEach((item,index)=>{
    let dictationScore=0;item.clozeAnswers.forEach((answer,gap)=>{if(norm(state.g[`${index+1}-${gap}`])===norm(answer))dictationScore++});scores[`d${index+1}`]=dictationScore;
    const [first,last]=range(index),grouped=new Set();let ieltsScore=0;
    for(const [key,numbers] of questionGroupsFor(index)){
      const chosen=state.q[key]||[],valid=new Set(numbers.flatMap(question=>DATA.answers[question]||[]).map(norm));ieltsScore+=chosen.filter(value=>valid.has(norm(value))).length;numbers.forEach(question=>grouped.add(question));
    }
    for(let question=first;question<=last;question++){if(grouped.has(question))continue;if((DATA.answers[question]||[]).map(norm).includes(norm(state.q[question])))ieltsScore++}
    scores[`i${index+1}`]=ieltsScore;review[`s${index+1}`]={dictationScore,ieltsScore};
  });
  return {scores,review};
}
async function finalizeSubmission(event){
  event?.preventDefault();event?.stopPropagation();
  if(!event?.isTrusted||finalRequested()||!allResponsesComplete())return false;
  if(!window.confirm("Em xác nhận đã làm xong toàn bộ bài. Hệ thống sẽ khóa câu trả lời, ghi điểm vào sổ lớp rồi mới mở đáp án. Em có chắc chắn nộp bài?"))return false;
  const requestedAt=new Date().toISOString(),fingerprint=answersFingerprint(),graded=gradeAllResponses();
  state.scores=graded.scores;state.review=graded.review;state.confirmations=Object.fromEntries(scoreKeys().map(key=>[key,requestedAt]));state.final={phase:"sending",requestedAt,answersFingerprint:fingerprint,submittedAt:""};state.submission=freshSubmission();save();stage="score";render();
  await resumeFinalSubmission();return true;
}
function scorePayload(label,a,b){
  const payload=new URLSearchParams();payload.set(DATA.form.week,label);payload.set(DATA.form.name,state.studentName.trim());payload.set(DATA.form.studentClass,state.studentClass);
  payload.set(DATA.form.d1,String(state.scores[`d${a}`]));payload.set(DATA.form.i1,String(state.scores[`i${a}`]));payload.set(DATA.form.d2,String(state.scores[`d${b}`]));payload.set(DATA.form.i2,String(state.scores[`i${b}`]));payload.set(DATA.form.total,String(state.scores[`d${a}`]+state.scores[`i${a}`]+state.scores[`d${b}`]+state.scores[`i${b}`]));return payload;
}
function scheduleScoreRetry(){
  if(scoreRetryTimer||finalSubmitted()||!finalRequested())return;
  const delays=[5000,15000,30000,60000],delay=delays[Math.min(scoreRetryAttempt,delays.length-1)];scoreRetryAttempt++;
  scoreRetryTimer=setTimeout(()=>{scoreRetryTimer=null;if(finalRequested()&&!finalSubmitted())void resumeFinalSubmission()},delay);
}
async function ensureScoresSubmitted(){
  if(!finalRequested()||!scoresReady()||!state.studentName.trim()||!state.studentClass)return false;
  const fingerprint=scoreFingerprint();if(state.submission.fingerprint!==fingerprint)state.submission=freshSubmission(fingerprint);
  if(scoreParts.every(part=>state.submission.parts[part.key]==="sent")){state.submission.status="sent";state.final.phase="submitted";state.final.submittedAt=state.submission.sentAt||new Date().toISOString();save();return true}
  if(scoreSendPromise)return scoreSendPromise;
  clearScoreRetry();state.submission.status="sending";state.final.phase="sending";save();
  scoreSendPromise=(async()=>{
    try{
      for(const part of scoreParts){
        if(state.submission.parts[part.key]==="sent")continue;state.submission.parts[part.key]="sending";save();
        await fetch(DATA.form.url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:scorePayload(part.label(),part.a,part.b).toString()});
        state.submission.parts[part.key]="sent";save();
      }
      state.submission.status="sent";state.submission.sentAt=new Date().toISOString();state.final.phase="submitted";state.final.submittedAt=state.submission.sentAt;scoreRetryAttempt=0;save();return true;
    }catch{
      scoreParts.forEach(part=>{if(state.submission.parts[part.key]==="sending")state.submission.parts[part.key]="error"});state.submission.status="error";state.final.phase="error";save();scheduleScoreRetry();return false;
    }finally{scoreSendPromise=null}
  })();return scoreSendPromise;
}
async function resumeFinalSubmission(){
  if(!finalRequested()||finalSubmitted())return finalSubmitted();const sent=await ensureScoresSubmitted();if(stage==="score")render();return sent;
}
function selectSection(index){si=index;stage="vocab";render()}
$("#sectionTabs").innerHTML=DATA.sections.map((item,index)=>`<button type="button" onclick="selectSection(${index})">SECTION ${item.number}<br><small>Questions ${(item.number-1)*10+1}–${item.number*10}</small></button>`).join("");
document.querySelectorAll(".stage-tabs button").forEach(button=>{button.type="button";button.onclick=()=>{stage=button.dataset.stage;render()}});
const entryName=$("#entryName"),entryClass=$("#entryClass"),enterTest=$("#enterTest");entryName.value=state.studentName;entryClass.value=state.studentClass;enterTest.type="button";
function updateEntryGate(){const ready=entryName.value.trim()&&entryClass.value;enterTest.disabled=!ready;enterTest.textContent=ready?"Vào Listening Test":"Nhập họ tên và chọn lớp để vào bài"}
function resetForStudent(name,studentClass){state.q={};state.g={};state.scores={};state.confirmations={};state.review={};state.submission=freshSubmission();state.final=freshFinal();state.studentName=name;state.studentClass=studentClass;state.studentKey=identityKey(name,studentClass);state.schemaVersion=SCHEMA_VERSION}
function openTest(){
  const name=entryName.value.trim(),studentClass=entryClass.value;if(!name||!studentClass)return;
  const nextKey=identityKey(name,studentClass),previousKey=state.studentKey||identityKey(state.studentName,state.studentClass);if(previousKey&&previousKey!==nextKey)resetForStudent(name,studentClass);else{state.studentName=name;state.studentClass=studentClass;state.studentKey=nextKey}
  save();$("#entryGate").hidden=true;$("#testApp").hidden=false;render();if(finalRequested()&&!finalSubmitted())void resumeFinalSubmission();
}
entryName.oninput=updateEntryGate;entryClass.onchange=updateEntryGate;enterTest.onclick=openTest;entryName.onkeydown=event=>{if(event.key==="Enter"&&!enterTest.disabled)openTest()};
document.addEventListener("keydown",event=>{if(event.key==="Enter"&&event.target.matches("#content input"))event.preventDefault()});
window.addEventListener("online",()=>{clearScoreRetry();if(finalRequested()&&!finalSubmitted())void resumeFinalSubmission()});updateEntryGate();save();render();
</script></body></html>
