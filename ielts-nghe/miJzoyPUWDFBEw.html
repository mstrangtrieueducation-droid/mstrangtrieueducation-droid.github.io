</style></head><body><section id="entryGate" class="entry-screen"><div class="entry-card"><header class="entry-head"><small>IELTS - NGHE · TUẦN 38</small><h1>Listening Test 28</h1><p>Điền thông tin học sinh trước khi vào bài.</p></header><div class="entry-body"><p class="entry-note">Họ tên và lớp sẽ được giữ lại để gửi điểm sau khi hoàn thành bài.</p><label for="entryName">Họ và tên học sinh</label><input id="entryName" type="text" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"><label for="entryClass">Lớp IELTS</label><select id="entryClass"><option value="">Chọn lớp IELTS</option><option>IELTS 40</option><option>IELTS 41</option><option>IELTS 42</option><option>IELTS 43</option><option>IELTS 44</option><option>IELTS 45</option><option>IELTS 46</option><option>IELTS 47</option><option>IELTS 48</option><option>IELTS 49</option><option>IELTS 50</option><option>IELTS 51</option><option>IELTS 52</option><option>IELTS 53</option></select><button id="enterTest" type="button" disabled>Nhập họ tên và chọn lớp để vào bài</button></div></div></section><div id="testApp" hidden><header class="hero"><small>IELTS - NGHE · TUẦN 38</small><h1>Listening Test 28</h1><p>Full Test · Sections 1–4 · 40 questions</p></header><main class="shell"><nav id="sectionTabs" class="section-tabs"></nav><nav class="stage-tabs"><button type="button" data-stage="vocab">A · Từ vựng cần lưu ý</button><button type="button" data-stage="dictation">B · Điền chính tả</button><button type="button" data-stage="ielts">C · Câu hỏi IELTS</button><button type="button" data-stage="score">D · Nộp bài</button></nav><section id="content" class="lesson"></section></main></div><script>const DATA={"week":38,"test":28,"sourceRef":"Cambridge IELTS 15 Academic Listening Test 4","answers":{"1":["journalist"],"2":["shopping"],"3":["Staunfirth"],"4":["return"],"5":["23.70"],"6":["online"],"7":["delay"],"8":["information"],"9":["platform","platforms"],"10":["parking"],"11":["D"],"12":["C"],"13":["G"],"14":["H"],"15":["A"],"16":["E"],"17":["A","D"],"18":["A","D"],"19":["A","C"],"20":["A","C"],"21":["B"],"22":["A"],"23":["B"],"24":["A"],"25":["A"],"26":["A"],"27":["B"],"28":["B"],"29":["A"],"30":["C"],"31":["wealth"],"32":["technology"],"33":["power"],"34":["textile","textiles"],"35":["machines"],"36":["newspapers"],"37":["local"],"38":["lighting"],"39":["windows"],"40":["Advertising","advertizing"]},"sections":[{"number":1,"transcript":["MAN: Hello. Do you mind if I ask you some questions about your journey today? We’re doing a customer satisfaction survey.","SOPHIE: Yes. OK. I’ve got about ten minutes before my train home leaves. I’m on a day trip.","MAN: Great. Thank you. So first of all, could you tell me your name?","SOPHIE: It’s Sophie Bird.","MAN: Thank you. And would you mind telling me what you do?","SOPHIE: I’m a journalist.","MAN: Oh really? That must be interesting.","SOPHIE: Yes. It is.","MAN: So was the reason for your visit here today work?","SOPHIE: Actually, it’s my day off. I came here to do some shopping.","MAN: Oh right.","SOPHIE: But I do sometimes come here for work.","MAN: OK. Now I’d like to ask some questions about your journey today, if that’s OK.","SOPHIE: Yes. No problem.","MAN: Right, so can you tell me which station you’re travelling back to?","SOPHIE: Staunfirth, where I live.","MAN: Can I just check the spelling? S-T-A-U-N-F-I-R-T-H?","SOPHIE: That’s right.","MAN: And you travelled from there this morning?","SOPHIE: Yes.","MAN: OK, good. Next, can I ask what kind of ticket you bought? I assume it wasn’t a season ticket, as you don’t travel every day.","SOPHIE: That’s right. No, I just got a normal return ticket. I don’t have a rail card so I didn’t get any discount. I keep meaning to get one because it’s a lot cheaper.","MAN: Yes – you’d have saved 20% on your ticket today. So you paid the full price for your ticket?","SOPHIE: I paid £23.70.","MAN: OK. Do you think that’s good value for money?","SOPHIE: Not really. I think it’s too much for a journey that only takes 45 minutes.","MAN: Yes, that’s one of the main complaints we get. So, you didn’t buy your ticket in advance?","SOPHIE: No. I know it’s cheaper if you buy a week in advance but I didn’t know I was coming then.","MAN: I know. You can’t always plan ahead. So, did you buy it this morning?","SOPHIE: No, it was yesterday.","MAN: Right. And do you usually buy your tickets at the station?","SOPHIE: Well, I do usually but the ticket office closes early and I hate using ticket machines. I think ticket offices should be open for longer hours. There’s always a queue for the machines and they’re often out of order.","MAN: A lot of customers are saying the same thing.","SOPHIE: So to answer your question … I got an e-ticket online.","—————————","MAN: OK. Thank you. Now I’d like to ask you about your satisfaction with your journey. So what would you say you were most satisfied with today?","SOPHIE: Well, I like the wifi on the train. It’s improved a lot. It makes it easier for me to work if I want to.","MAN: That’s the first time today anyone’s mentioned that. It’s good to get some positive feedback on that.","SOPHIE: Mmm.","MAN: And, is there anything you weren’t satisfied with?","SOPHIE: Well, normally, the trains run on time and are pretty reliable but today there was a delay; the train was about 15 minutes behind schedule.","MAN: OK. I’ll put that down. Now I’d also like to ask about the facilities at this station. You’ve probably noticed that the whole station’s been upgraded. What are you most satisfied with?","SOPHIE: I think the best thing is that they’ve improved the amount of information about train times etc. that’s given to passengers – it’s much clearer – before there was only one board and I couldn’t always see it properly – which was frustrating.","MAN: That’s good. And is there anything you’re not satisfied with?","SOPHIE: Let’s see … I think things have generally improved a lot. The trains are much more modern and I like the new café. But one thing is that there aren’t enough places to sit down, especially on the platforms.","MAN: OK – so I’ll put ‘seating’ down, shall I, as the thing you’re least satisfied with?","SOPHIE: Yes, OK.","MAN: Can I ask your opinion about some of the other facilities? We’d like feedback on whether people are satisfied, dissatisfied or neither satisfied nor dissatisfied.","SOPHIE: OK.","MAN: What about the parking at the station?","SOPHIE: Well to be honest, I don’t really have an opinion as I never use it.","MAN: So, neither satisfied nor dissatisfied for that then.","SOPHIE: Yes, I suppose so …","MAN: OK, and what about …?"],"cloze":"<p>MAN: Hello. Do you mind if I ask you some questions about your journey today? We’re doing a <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>.</p><p>SOPHIE: Yes. OK. I’ve got about ten minutes before my train home leaves. I’m on a day trip.</p><p>MAN: Great. Thank you. So first of all, could you tell me your name?</p><p>SOPHIE: It’s Sophie Bird.</p><p>MAN: Thank you. And would you mind telling me what you do?</p><p>SOPHIE: I’m a journalist.</p><p>MAN: Oh really? <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>.</p><p>SOPHIE: Yes. It is.</p><p>MAN: So was the reason for your visit here today work?</p><p>SOPHIE: Actually, it’s my day off. I came here to do some shopping.</p><p>MAN: Oh right.</p><p>SOPHIE: But I do <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>.</p><p>MAN: OK. Now I’d like to ask some questions about your journey today, if that’s OK.</p><p>SOPHIE: Yes. No problem.</p><p>MAN: Right, so can you tell me which <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> to?</p><p>SOPHIE: Staunfirth, where I live.</p><p>MAN: Can I just check the spelling? S-T-A-U-N-F-I-R-T-H?</p><p>SOPHIE: That’s right.</p><p>MAN: And you <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span>?</p><p>SOPHIE: Yes.</p><p>MAN: OK, good. Next, can I ask what kind of ticket you bought? I assume it wasn’t a season ticket, as you don’t travel every day.</p><p>SOPHIE: That’s right. No, I just got a <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span>. I don’t have a rail card so I didn’t get any discount. I <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span> one because it’s a lot cheaper.</p><p>MAN: Yes – you’d have saved 20% on your ticket today. So you paid the full price for your ticket?</p><p>SOPHIE: I paid £23.70.</p><p>MAN: OK. Do you think that’s good value for money?</p><p>SOPHIE: Not really. I think it’s too much for a journey that only takes 45 minutes.</p><p>MAN: Yes, that’s one of the <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>. So, you didn’t buy your ticket in advance?</p><p>SOPHIE: No. I know it’s cheaper if you buy a week in advance but I didn’t know I was coming then.</p><p>MAN: I know. You can’t <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span>. So, did you buy it this morning?</p><p>SOPHIE: No, it was yesterday.</p><p>MAN: Right. And do you usually buy your tickets at the station?</p><p>SOPHIE: Well, I do usually but the ticket office closes early and I <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>. I think ticket offices should be open for longer hours. There’s always a queue for the machines and they’re often out of order.</p><p>MAN: A lot of <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span> the same thing.</p><p>SOPHIE: So to answer your question … I got an e-ticket online.</p><p>—————————</p><p>MAN: OK. Thank you. Now I’d like to ask you about your <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span>. So what would you say you were most satisfied with today?</p><p>SOPHIE: Well, I like the wifi on the train. It’s improved a lot. It makes it easier for me to work if I want to.</p><p>MAN: That’s the <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span> that. It’s good to get some positive feedback on that.</p><p>SOPHIE: Mmm.</p><p>MAN: And, is there anything you weren’t satisfied with?</p><p>SOPHIE: Well, normally, the trains run on time and are pretty reliable but today there was a delay; the train was about 15 <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span>.</p><p>MAN: OK. I’ll put that down. Now I’d also like to ask about the facilities at this station. You’ve probably noticed that the <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span>. What are you most satisfied with?</p><p>SOPHIE: I think the best thing is that they’ve <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span> about train times etc. that’s given to passengers – it’s much clearer – before there was only one board and I couldn’t always see it properly – which was frustrating.</p><p>MAN: That’s good. And is there anything you’re not satisfied with?</p><p>SOPHIE: Let’s see … I <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> a lot. The trains are much more modern and I like the new café. But one thing is that there aren’t enough places to sit down, <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>.</p><p>MAN: OK – so I’ll put ‘seating’ down, shall I, as the thing you’re least satisfied with?</p><p>SOPHIE: Yes, OK.</p><p>MAN: Can I ask your opinion about some of the other facilities? We’d like feedback on whether people are <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> nor dissatisfied.</p><p>SOPHIE: OK.</p><p>MAN: What about the parking at the station?</p><p>SOPHIE: Well to be honest, I don’t really have an opinion as I never use it.</p><p>MAN: So, <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span> for that then.</p><p>SOPHIE: Yes, I suppose so …</p><p>MAN: OK, and what about …?</p>","clozeAnswers":["customer satisfaction survey","That must be interesting","sometimes come here for work","station you’re travelling back","travelled from there this morning","normal return ticket","keep meaning to get","main complaints we get","always plan ahead","hate using ticket machines","customers are saying","satisfaction with your journey","first time today anyone’s mentioned","minutes behind schedule","whole station’s been upgraded","improved the amount of information","think things have generally improved","especially on the platforms","satisfied, dissatisfied or neither satisfied","neither satisfied nor dissatisfied"],"vocab":[{"word":"satisfaction","ipa":"/sætɪsˈfækʃən/","pos":"Danh từ (n)","meaning":"hài lòng","example":"We’re doing a customer satisfaction survey.","exampleVi":"Trong câu trên, “satisfaction” mang nghĩa “hài lòng”."},{"word":"dissatisfied","ipa":"/dɪsˈsætɪsˌfaɪd/","pos":"Tính từ (adj)","meaning":"không hài lòng","example":"We’d like feedback on whether people are satisfied, dissatisfied or neither satisfied nor dissatisfied.","exampleVi":"Trong câu trên, “dissatisfied” mang nghĩa “không hài lòng”."},{"word":"frustrating","ipa":"/fɹʌˈstɹeɪ̯tɪŋ/","pos":"Tính từ (adj)","meaning":"gây bực bội","example":"that’s given to passengers – it’s much clearer – before there was only one board and I couldn’t always see it properly – which was frustrating.","exampleVi":"Trong câu trên, “frustrating” mang nghĩa “gây bực bội”."},{"word":"complaint","ipa":"/kəmˈpleɪnt/","pos":"Danh từ (n)","meaning":"khiếu nại","example":"Yes, that’s one of the main complaints we get.","exampleVi":"Trong câu trên, “complaint” mang nghĩa “khiếu nại”."},{"word":"passengers","ipa":"/ˈpæsənd͡ʒəz/","pos":"Danh từ (n)","meaning":"hành khách","example":"that’s given to passengers – it’s much clearer – before there was only one board and I couldn’t always see it properly – which was frustrating.","exampleVi":"Trong câu trên, “passengers” mang nghĩa “hành khách”."},{"word":"sometimes","ipa":"/ˈsʌmtaɪmz/","pos":"Trạng từ (adv)","meaning":"đôi khi","example":"But I do sometimes come here for work.","exampleVi":"Trong câu trên, “sometimes” mang nghĩa “đôi khi”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 1-10</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the form below.</p>\n<p>Write&nbsp;<strong>ONE WORD AND/OR A NUMBER</strong>&nbsp;for each answer.</p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Customer Satisfaction Survey</strong></strong></p>\n<p><strong>Customer details</strong></p>\n<p>Name:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Sophie Bird</p>\n<p>Occupation:&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<span class=\"question-item\"><strong class=\"q-number\">1</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"1\" oninput=\"setQ(1,this.value)\"></span></p>\n<p>Reason for travel today:&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <span class=\"question-item\"><strong class=\"q-number\">2</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"2\" oninput=\"setQ(2,this.value)\"></span></p>\n<p>&nbsp;</p>\n<p><strong>Journey information</strong></p>\n<p>Name of station returning to:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span class=\"question-item\"><strong class=\"q-number\">3</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"3\" oninput=\"setQ(3,this.value)\"></span></p>\n<p>Type of ticket purchased:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Standard <span class=\"question-item\"><strong class=\"q-number\">4</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"4\" oninput=\"setQ(4,this.value)\"></span>&nbsp;ticket</p>\n<p>Cost of ticket:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; £<span class=\"question-item\"><strong class=\"q-number\">5</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"5\" oninput=\"setQ(5,this.value)\"></span></p>\n<p>When ticket was purchased:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Yesterday</p>\n<p>Where ticket was bought:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span class=\"question-item\"><strong class=\"q-number\">6</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"6\" oninput=\"setQ(6,this.value)\"></span></p>\n<p><strong>Satisfaction with journey</strong></p>\n<p>Most satisfied with:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; the wifi</p>\n<p>Least satisfied with:&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; the <span class=\"question-item\"><strong class=\"q-number\">7</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"7\" oninput=\"setQ(7,this.value)\"></span>&nbsp;this morning.</p>\n<p><strong>Satisfaction with station facilities</strong></p>\n<p>Most satisfied with:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; how much <span class=\"question-item\"><strong class=\"q-number\">8</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"8\" oninput=\"setQ(8,this.value)\"></span>&nbsp;was provided</p>\n<p>Least satisfied with:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; lack of seats, particularly on the <span class=\"question-item\"><strong class=\"q-number\">9</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"9\" oninput=\"setQ(9,this.value)\"></span></p>\n<p>Neither satisfied nor dissatisfied with:&nbsp;&nbsp;&nbsp;&nbsp; the <span class=\"question-item\"><strong class=\"q-number\">10</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"10\" oninput=\"setQ(10,this.value)\"></span>&nbsp;available</p>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-28/section-1.mp3"},{"number":2,"transcript":["As chair of the town council subcommittee on park facilities, I’d like to bring you up to date on some of the changes that have been made recently to the Croft Valley Park. So if you could just take a look at the map I handed out, let’s begin with a general overview. So the basic arrangement of the park hasn’t changed – it still has two gates, north and south, and a lake in the middle.","The café continues to serve an assortment of drinks and snacks and is still in the same place, looking out over the lake and next to the old museum.","We’re hoping to change the location of the toilets, and bring them nearer to the centre of the park as they’re a bit out of the way at present, near the adventure playground, in the corner of your map.","The formal gardens have been replanted and should be at their best in a month or two. They used to be behind the old museum, but we’re now used the space near the south gate – between the park boundary and the path that goes past the lake towards the old museum.","We have a new outdoor gym for adults and children, which is already proving very popular. It’s by the glass houses, just to the right of the path from the south gate. You have to look for it as it’s a bit hidden in the trees.","One very successful introduction has been our skateboard ramp. It’s in constant use during the evenings and holidays. It’s near the old museum, at the end of a little path that leads off from the main path between the lake and the museum.","We’ve also introduced a new area for wild flowers, to attract bees and butterflies. It’s on a bend in the path that goes round the east side of the lake, just south of the adventure playground.","———————","Now let me tell you a bit more about some of the changes to Croft Valley Park.","One of our most exciting developments has been the adventure playground. We were aware that we had nowhere for children to let off steam, and decided to use our available funds to set up a completely new facility in a large space to the north of the park. It’s open year-round, though it close early in the winter months, and entrance is completely free. Children can choose whatever activities they want to do, irrespective of their age, but we do ask adults not to leave them on their own there. There are plenty of seats where parents can relax and keep an eye on their children at the same time.","Lastly, the glass houses. A huge amount of work has been done on them to repair the damage following the disastrous fire that recently destroyed their western side. Over £80,000 was spent on replacing the glass walls and the metal supports, as well as the plants that had been destroyed, although unfortunately the collection of tropical palm trees has proved too expensive to replace up to now. At present the glass houses are open from 10am to 3pm Mondays to Thursdays, and it’s hoped to extend this to the weekend soon. We’re grateful to all those who helped us by contributing their time and money to this achievement.","The gardens have …"],"cloze":"<p>As chair of the town <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>, I’d like to bring you up to date on some of the changes that have been made recently to the Croft Valley Park. So if you could just take a look at the map I handed out, let’s begin with a general overview. So the <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> hasn’t changed – it still has two gates, north and south, and a lake in the middle.</p><p>The café <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span> of drinks and snacks and is still in the same place, looking out over the lake and next to the old museum.</p><p>We’re <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> of the toilets, and bring them nearer to the centre of the park as they’re a bit out of the way at <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span>, in the corner of your map.</p><p>The formal <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span> and should be at their best in a month or two. They used to be behind the old museum, but we’re now used the space near the south gate – between the park boundary and the path that goes past the lake towards the old museum.</p><p>We have a new outdoor gym for adults and <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span> very popular. It’s by <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>, just to the right of the path from the south gate. You have to look for it as it’s a bit hidden in the trees.</p><p>One <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span> has been our skateboard ramp. It’s in constant use during the evenings and holidays. It’s near the old museum, at the end of a little path that leads off from the main path between the lake and the museum.</p><p>We’ve also <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span> for wild flowers, to attract bees and butterflies. It’s on a bend in the path that goes round the east side of the lake, just <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span>.</p><p>———————</p><p>Now let me tell you a bit more about some of the changes to Croft Valley Park.</p><p>One of our <span class=\"gap-wrap  class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span> their time and money to this achievement.</p><p>The gardens have …</p>","clozeAnswers":["council subcommittee on park facilities","basic arrangement of the park","continues to serve an assortment","hoping to change the location","present, near the adventure playground","gardens have been replanted","children, which is already proving","the glass houses","very successful introduction","introduced a new area","south of the adventure playground","most exciting developments","completely new facility","months, and entrance is completely","Children can choose whatever activities","Lastly, the glass houses","disastrous fire that recently destroyed","the collection of tropical palm trees","proved too expensive to replace","helped us by contributing"],"vocab":[{"word":"assortment","ipa":"/əˈsɔːtmənt/","pos":"Danh từ (n)","meaning":"nhiều loại/sự đa dạng","example":"The café continues to serve an assortment of drinks and snacks and is still in the same place, looking out over the lake and next to the old museum.","exampleVi":"Trong câu trên, “assortment” mang nghĩa “nhiều loại/sự đa dạng”."},{"word":"contributing","ipa":"/kənˈtɹɪbjuːtɪŋ/","pos":"Động từ (v)","meaning":"đóng góp","example":"We’re grateful to all those who helped us by contributing their time and money to this achievement.","exampleVi":"Trong câu trên, “contributing” mang nghĩa “đóng góp”."},{"word":"butterfly","ipa":"/ˈbʌtə(ɹ)flaɪ/","pos":"Danh từ (n)","meaning":"bướm","example":"We’ve also introduced a new area for wild flowers, to attract bees and butterflies.","exampleVi":"Trong câu trên, “butterfly” mang nghĩa “bướm”."},{"word":"introduced","ipa":"/ˌɪntɹəˈdjuːst/","pos":"Động từ (v)","meaning":"đưa vào/thiết lập","example":"We’ve also introduced a new area for wild flowers, to attract bees and butterflies.","exampleVi":"Trong câu trên, “introduced” mang nghĩa “đưa vào/thiế .value)\"></td></tr>                                                                                                                                                                                                                                                                                                    <tr class=\"question-item\"><td class=\"ielts-listening-matching-question-cell\"><strong class=\"q-number\">16</strong> <span>wild flowers</span></td>\n                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q16\" value=\"A\" data-q=\"16\" onchange=\"setQ(16,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q16\" value=\"B\" data-q=\"16\" onchange=\"setQ(16,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q16\" value=\"C\" data-q=\"16\" onchange=\"setQ(16,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q16\" value=\"D\" data-q=\"16\" onchange=\"setQ(16,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q16\" value=\"E\" data-q=\"16\" onchange=\"setQ(16,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q16\" value=\"F\" data-q=\"16\" onchange=\"setQ(16,this.va s=\"q-number\">18</strong> <span>What does the speakers say about the adventure playground?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input data-limit=\"2\" type=\"checkbox\" value=\"A\" data-group=\"17-18\" onchange=\"setGroup('17-18',this.value,this,2)\"><span>Children must be supervised.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input data-limit=\"2\" type=\"checkbox\" value=\"B\" data-group=\"17-18\" onchange=\"setGroup('17-18',this.value,this,2)\"><span>It costs more in winter.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input data-limit=\"2\" type=\"checkbox\" value=\"C\" data-group=\"17-18\" onchange=\"setGroup('17-18',this.value,this,2)\"><span>Some activities are only for younger children.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">D</label><input data-limit=\"2\" type=\"checkbox\" value=\"D\" data-group=\"17-18\" onchange=\"setGroup('17-18',this.value,this,2)\"><span>No payment is required.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">E</label><input data-limit=\"2\" type=\"checkbox\" value=\"E\" data-group=\"17-18\" onchange=\"setGroup('17-18',this.value,this,2)\"><span>It was recently expanded.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 19-20</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose&nbsp;<strong>TWO</strong>&nbsp;letters,&nbsp;<strong>A-E</strong>.</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">19</strong> <strong class=\"q-number\">20</strong> <span>What does the speaker say about the glass houses?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input data-limit=\"2\" type=\"checkbox\" value=\"A\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>They are closed at weekends.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input data-limit=\"2\" type=\"checkbox\" value=\"B\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>Volunteers are needed to work there.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input data-limit=\"2\" type=\"checkbox\" value=\"C\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>They were badly damaged by fire.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">D</label><input data-limit=\"2\" type=\"checkbox\" value=\"D\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>More money is needed to repair some of the glass.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">E</label><input data-limit=\"2\" type=\"checkbox\" value=\"E\" data-group=\"19-20\" onchange=\"setGroup('19-20',this.value,this,2)\"><span>Visitors can see palm trees from tropical regions.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-28/section-2.mp3"},{"number":3,"transcript":["ANNIE: OK, Jack. Before we plan our presentation about refrigeration, let’s discuss what we’ve discovered so far.","JACK: Fine, Annie. Though I have to admit I haven’t done much research yet.","ANNIE: Nor me. But I found an interesting article about icehouses. I’d seen some 18th- and 19th-century ones here in the UK, so I knew they were often built in a shady area or underground, close to lakes that might freeze in the winter. Then blocks of ice could be cut and stored in the icehouse. But I didn’t realise that insulating the blocks with straw or sawdust meant they didn’t melt for months. The ancient Romans had refrigeration, too.","JACK: I didn’t know that.","ANNIE: Yes, pits were dug in the ground, and snow was imported from the mountains – even though they were at quite a distance. The snow was stored in the pits. Ice formed at the bottom of it. Both the ice and the snow were then sold. The ice cost more than the snow and my guess is that only the wealthy members of society could afford it.","JACK: I wouldn’t be surprised. I also came across an article about modern domestic fridges. Several different technologies are used, but they were too complex for me to understand.","ANNIE: You have to wonder what happens when people get rid of old ones.","JACK: You mean because the gases in them are harmful for the environment?","ANNIE: Exactly. At least these are now plenty of organisations that will recycle most of the components safety, but of course some people just dump old fridges in the countryside.","JACK: It’s hard to see how they can be stopped unfortunately. In the UK we get rid of three million a year altogether!","ANNIE: That sounds a lot, especially because fridges hardly ever break down.","JACK: That’s right. In this country we keep domestic fridges for 11 years on average, and a lot last for 20 or more. So if you divide the cost by the number of years you can use a fridge, they’re not expensive, compared with some household appliances.","ANNIE: True. I suppose manufacturers encourage people to spend more by making them different colours and designs. I’m sure when my parents bought their first fridge they had hardly any choice!","JACK: Yes, there’s been quite a change.","———————","JACK: Right, let’s make a list of topics to cover in our presentation, and decide who’s going to do more research on them. Then later, we can get together and plan the next step.","ANNIE: OK. How about starting with how useful refrigeration is, and the range of goods that are refrigerated nowadays? Because of course it’s not just food and drinks.","JACK: No, I suppose flowers and medicines are refrigerated, too.","ANNIE: And computers. I could do that, unless you particularly want to.","JACK: No, that’s fine by me. What about the effects of refrigeration on people’s health? After all, some of the chemicals used in the 19th century were pretty harmful, but there have been lots of benefits too, like always have access to fresh food. Do you fancy dealing with that?","ANNIE: I’m no terribly keen, to be honest.","JACK: Nor me. My mind just goes blank when I read anything about chemicals.","ANNIE: Oh, all right then, I’ll do you a favour. But you own me, Jack.","JACK: I don’t mind. It should be quite interesting.","ANNIE: I think we should also look at how refrigeration has helped whole cities – like Las Vegas, which couldn’t exist without refrigeration because it’s in the middle of a desert.","JACK: Right. I had a quick look at an economics book in the library that’s got a chapter about this sort of thing. I could give you the title, if you want to do this section.","ANNIE: Not particularly, to be honest. I find economics books pretty heavy going, as a rule.","JACK: OK, leave it to me, then.","ANNIE: Thanks. Then there’s transport, and the difference that refrigerated trucks have made. I wouldn’t mind having a go at that.","JACK: Don’t forget trains, too. I read something about milk and butter being transported in refrigerated railroad cars in the USA, right back in the 1840s.","ANNIE: I hadn’t thought of trains. Thanks.","JACK: Shall we have a separate section on domestic fridges? After all, they’re something everyone’s familiar with.","ANNIE: What about splitting it into two? You could investigate 19th- and 20th-century fridges, and I’ll concentrate on what’s available these days, and how manufacturers differentiate their products from those of their competitors.","JACK: OK, that’d suit me."],"cloze":"<p>ANNIE: OK, Jack. Before we plan our <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> what we’ve discovered so far.</p><p>JACK: Fine, Annie. Though I have to admit I haven’t done much research yet.</p><p>ANNIE: Nor me. But I found an interesting article about icehouses. I’d seen some 18th- and 19th-century ones here in the UK, so I knew they were often <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>, close to lakes that might freeze in the winter. Then blocks of ice could be cut and stored in the icehouse. But I didn’t realise that insulating the blocks with straw or sawdust meant they didn’t melt for months. The <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>, too.</p><p>JACK: I didn’t know that.</p><p>ANNIE: Yes, pits were dug in the ground, and snow was imported from the mountains – <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>. The snow was stored in the pits. Ice formed at the bottom of it. Both the ice and the snow were then sold. The ice cost more than the snow and my guess is that only the wealthy members of society could afford it.</p><p>JACK: I wouldn’t be surprised. I also came across an article about modern domestic fridges. <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span>, but they were too complex for me to understand.</p><p>ANNIE: You have to wonder what happens when people get rid of old ones.</p><p>JACK: You mean because the gases in them are <sp gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span> in the USA, right back in the 1840s.</p><p>ANNIE: I hadn’t thought of trains. Thanks.</p><p>JACK: Shall we have a separate section on domestic fridges? After all, they’re something <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span>.</p><p>ANNIE: What about splitting it into two? You could investigate 19th- and 20th-century fridges, and I’ll concentrate on what’s available these days, and how <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span> from those of their competitors.</p><p>JACK: OK, that’d suit me.</p>","clozeAnswers":["presentation about refrigeration, let’s discuss","built in a shady area or underground","ancient Romans had refrigeration","even though they were at quite a distance","Several different technologies are used","harmful for the environment","organisations that will recycle","especially because fridges hardly ever","suppose manufacturers encourage people","different colours and designs","starting with how useful refrigeration","flowers and medicines are refrigerated","refrigeration on people’s health","read anything about chemicals","refrigeration has helped whole cities","exist without refrigeration","difference that refrigerated trucks","transported in refrigerated railroad cars","everyone’s familiar with","manufacturers differentiate their products"],"vocab":[{"word":"transported","ipa":"/tɹænzˈpɔːtɪd/","pos":"Động từ (v)","meaning":"vận chuyển","example":"I read something about milk and butter being transported in refrigerated railroad cars in the USA, right back in the 1840s.","exampleVi":"Trong câu trên, “transported” mang nghĩa “vận chuyển”."},{"word":"underground","ipa":"/ˈʌndəɡɹaʊnd/","pos":"Trạng từ (adv)","meaning":"dưới lòng đất","example":"I’d seen some 18th- and 19th-century ones here in the UK, so I knew they were often built in a shady area or underground, close to lakes that might freeze in the winter.","exampleVi":"Trong câu trên, “underground” mang nghĩa “dưới lòng đất”."},{"word":"mountains","ipa":"/ˈmaʊntn̩z/","pos":"Danh từ (n)","meaning":"núi","example":"Yes, pits were dug in the ground, and snow was imported from the mountains – even though they were at quite a distance.","exampleVi":"Trong câu trên, “mountains” mang nghĩa “núi”."},{"word":"surprised","ipa":"/səˈpɹaɪzd/","pos":"Tính từ (adj)","meaning":"ngạc nhiên","example":"I wouldn’t be surprised.","exampleVi":"Trong câu trên, “surprised” mang nghĩa “ngạc nhiên”."},{"word":"compare","ipa":"/kəmˈpɛə/","pos":"Động từ (v)","meaning":"so sánh","example":"So if you divide the cost by the number of years you can use a fridge, they’re not expensive, compared with some household appliances.","exampleVi":"Trong câu trên, “compare” mang nghĩa “so sánh”."},{"word":"domestic","ipa":"/dəˈmɛstɪk/","pos":"Tính từ (adj)","meaning":"gia dụng","example":"I also came across an article about modern domestic fridges.","exampleVi":"Trong câu trên, “domestic” mang nghĩa “gia dụng”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 21-24</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose the correct letter,&nbsp;<strong>A</strong>,&nbsp;<strong>B</strong>&nbsp;or&nbsp;<strong>C</strong>.</p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Presentation about refrigeration</strong></strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                        <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q22\" value=\"A\" data-q=\"22\" onchange=\"setQ(22,this.value)\"><span>It became a commercial business.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q22\" value=\"B\" data-q=\"22\" onchange=\"setQ(22,this.value)\"><span>It used snow from nearby.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q22\" value=\"C\" data-q=\"22\" onchange=\"setQ(22,this.value)\"><span>It took a long time to become popular.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">23</strong> <span>In connection with modern refrigerator, both Annie and Jack are worried about</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q23\" value=\"A\" data-q=\"23\" onchange=\"setQ(23,this.value)\"><span>the complexity of the technology.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q23\" value=\"B\" data-q=\"23\" onchange=\"setQ(23,this.value)\"><span>the fact that some are disposed of irresponsibly.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q23\" value=\"C\" data-q=\"23\" onchange=\"setQ(23,this.value)\"><span>the large number that quickly break down.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">24</strong> <span>What do Jack and Annie agree regarding domestic fridges?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q24\" value=\"A\" data-q=\"24\" onchange=\"setQ(24,this.value)\"><span>They are generally good value for money.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q24\" value=\"B\" data-q=\"24\" onchange=\"setQ(24,this.value)\"><span>There are plenty of useful variations.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q24\" value=\"C\" data-q=\"24\" onchange=\"setQ(24,this.value)\"><span>They are more useful than other domestic appliances.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 25-30</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Who is going to do research into each topic?</p>\n<p>Write the correct letter,&nbsp;<strong>A</strong>,&nbsp;<strong>B</strong>&nbsp;or&nbsp;<strong>C</strong>, next to Questions.</p>\n<p><strong>People</strong></p>\n<p><strong>Topics</strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                                <div class=\"matching-dnd-questions\"><div class=\"question-item\"> • <span>the goods that are refrigerated</span><span class=\"inline-choice\"><strong class=\"q-number\">25</strong><select data-q=\"25\" onchange=\"setQ(25,this.value)\" aria-label=\"Question 25\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>the effects on health</span><span class=\"inline-choice\"><strong class=\"q-number\">26</strong><select data-q=\"26\" onchange=\"setQ(26,this.value)\" aria-label=\"Question 26\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>the impact on food producers</span><span class=\"inline-choice\"><strong class=\"q-number\">27</strong><select data-q=\"27\" onchange=\"setQ(27,this.value)\" aria-label=\"Question 27\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>the impact on cities</span><span class=\"inline-choice\"><strong class=\"q-number\">28</strong><select data-q=\"28\" onchange=\"setQ(28,this.value)\" aria-label=\"Question 28\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>refrigerated transport</span><span class=\"inline-choice\"><strong class=\"q-number\">29</strong><select data-q=\"29\" onchange=\"setQ(29,this.value)\" aria-label=\"Question 29\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>domestic fridges</span><span class=\"inline-choice\"><strong class=\"q-number\">30</strong><select data-q=\"30\" onchange=\"setQ(30,this.value)\" aria-label=\"Question 30\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div></div>                                                                        <div class=\"option-bank\"><div><b>A</b> Annie</div><div><b>B</b> Jack</div><div><b>C</b> both Annie and Jack</div></div>\n                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>\n                                        </div>","audio":"./audio/test-28/section-3.mp3"},{"number":4,"transcript":["Hi everyone, in this session I’ll be presenting my research about the social history of Britain during the Industrial Revolution. I particularly looked at how ordinary lives were affected by changes that happened at that time. This was a time that saw the beginning of a new phenomenon: consumerism – where buying and selling goods became a major part of ordinary people’s lives.","In fact, it was in the 19th century that the quantity and quality of people’s possessions was used as an indication of the wealth of the country. Before this, the vast majority of people had very few possessions, but all that was changed by the Industrial Revolution. This was the era from the mid-18th to the late 19th century, when improvements in how goods were made as well as in technology triggered massive social changes that transformed life for just about everybody in several key areas.","First let’s look at manufacturing. When it comes to manufacturing, we tend to think of the Industrial Revolution in images of steam engines and coal. And it’s true that the Industrial Revolution couldn’t have taken place at all if it weren’t for these new sources of power. They marked an important shift away from the traditional watermills and windmills that had dominated before this. The most advanced industry for much of the 19th century was textiles. This meant that fashionable fabrics, and lace and ribbons were made available to everyone.","Before the Industrial Revolution, most people made goods to sell in small workshops, often in their own homes. But enormous new machines were now being created that could produce the goods faster and on a larger scale, and these required a lot more space. So large factories were built, replacing the workshops, and forcing workers to travel to work. In fact, large numbers of people migrated from villages into towns as a result.","———————","As well as manufacturing, there were new technologies in transport, contributing to the growth of consumerism. The horse-drawn stagecoaches and carts of the 18th century, which carried very few people and goods, and travelled slowly along poorly surfaced roads, were gradually replaced by the numerous canals that were constructed. These were particularly important for the transportation of goods. The canals gradually fell out of use, though, as railways were developed, becoming the main way of moving goods and people from one end of the country to the other. And the goods they moved weren’t just coal, iron, clothes, and so on – significantly, they included newspapers, which meant that thousands of people were not only more knowledgeable about what was going on in the country, but could also read about what was available in the shops. And that encouraged them to buy more. so faster forms of transport resulted in distribution becoming far more efficient – goods could now be sold all over the country, instead of just in the local market.","The third main area that saw changes that contributed to consumerism was retailing. The number and quality of shops grew rapidly, and in particular, small shops suffered as customers flocked to the growing number of department stores – a form of retailing that was new in the 19th century. The entrepreneurs who opened these found new ways to stock them with goods, and to attract customers: for instance, improved lighting inside greatly increased the visibility of the goods for sale. Another development that made goods more visible from outside resulted from the use of plate glass, which made it possible for windows to be much larger than previously. New ways of promoting goods were introduced, too. Previously, the focus had been on informing potential customers about the availability of goods; now there was an explosion in advertising trying to persuade people to go shopping.","Flanders claims that one of the great effects of the Industrial Revolution was that it created choice. All sorts of things that had previously been luxuries – from sugar to cutlery – became conveniences, and before long they’d turned into necessities: life without sugar or cutlery was unimaginable. Rather like mobile phones these days!"],"cloze":"<p>Hi everyone, in this session I’ll be presenting my research about the social history of <span class=\"
