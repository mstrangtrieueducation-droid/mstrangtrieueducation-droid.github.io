</style></head><body><section id="entryGate" class="entry-screen"><div class="entry-card"><header class="entry-head"><small>IELTS - NGHE · TUẦN 29</small><h1>Listening Test 19</h1><p>Điền thông tin học sinh trước khi vào bài.</p></header><div class="entry-body"><p class="entry-note">Họ tên và lớp sẽ được giữ lại để gửi điểm sau khi hoàn thành bài.</p><label for="entryName">Họ và tên học sinh</label><input id="entryName" type="text" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"><label for="entryClass">Lớp IELTS</label><select id="entryClass"><option value="">Chọn lớp IELTS</option><option>IELTS 40</option><option>IELTS 41</option><option>IELTS 42</option><option>IELTS 43</option><option>IELTS 44</option><option>IELTS 45</option><option>IELTS 46</option><option>IELTS 47</option><option>IELTS 48</option><option>IELTS 49</option><option>IELTS 50</option><option>IELTS 51</option><option>IELTS 52</option><option>IELTS 53</option></select><button id="enterTest" disabled>Nhập họ tên và chọn lớp để vào bài</button></div></div></section><div id="testApp" hidden><header class="hero"><small>IELTS - NGHE · TUẦN 29</small><h1>Listening Test 19</h1><p>Full Test · Sections 1–4 · 40 questions</p></header><main class="shell"><nav id="sectionTabs" class="section-tabs"></nav><nav class="stage-tabs"><button data-stage="vocab">A · Từ vựng cần lưu ý</button><button data-stage="dictation">B · Điền chính tả</button><button data-stage="ielts">C · Câu hỏi IELTS</button><button data-stage="score">D · Kết quả</button></nav><section id="content" class="lesson"></section></main></div><script>const DATA={"week":29,"test":19,"answers":{"1":["300","three hundred"],"2":["Sunshade"],"3":["balcony"],"4":["forest","forests"],"5":["319","three hundred and nineteen","three hundred nineteen"],"6":["10,000","10000","ten thousand"],"7":["relative"],"8":["missed"],"9":["item"],"10":["Ludlow"],"11":["C"],"12":["A"],"13":["C"],"14":["E"],"15":["H"],"16":["F"],"17":["C"],"18":["G"],"19":["120"],"20":["5 to 12","5-12","5–12"],"21":["fishing industry"],"22":["statistics"],"23":["note-taking","note taking"],"24":["confidence"],"25":["ideas"],"26":["Student Support"],"27":["places"],"28":["general"],"29":["3 times","three times"],"30":["25","25 January","25th January"],"31":["B"],"32":["A"],"33":["glass"],"34":["insulation"],"35":["windows"],"36":["electricity"],"37":["floor","floors"],"38":["waste"],"39":["concrete"],"40":["15 years","fifteen years"]},"sections":[{"number":1,"transcript":["MAN: Greek Island Holidays, can I help you?","WOMAN: Yes, I hope so. I have a friend who's just come back from Corfu and she's recommended some apartments in Arilas. She thought they might be on your list.","MAN: Arilas, Arilas, let me see. Can you give me the names?","WOMAN: Yes, the first's Rose Garden Apartments. I'd like to go with another friend in the last week of October.","MAN: Well, we've got a lovely studio flat available at that time. I'm sure you'd enjoy the entertainment programme there too, with Greek dancing in the restaurant.","WOMAN: And the cost for each of us?","MAN: £219.","WOMAN: That sounds very reasonable! I'm just jotting down some notes. Now the second one she mentioned was called Blue Bay.","MAN: Blue Bay? Yes, in fact that's very popular and it has some special features.","WOMAN: Really?","MAN: The main attraction is the large swimming pool with salt water.","WOMAN: Much healthier, I understand.","MAN: That's right. And it isn't far from the beach, either – only 300 metres, and only around half a kilometre to some shops, so you don't have to be too energetic.","WOMAN: Is it much more expensive than the first one?","MAN: Let me just check. I think at the time you want to go it's around £260 – no £275 to be exact.","WOMAN: Right, I've got that. Now there are just two more apartments to ask you about. Um, I can't read my own writing! Something to do with sun ... Sunshine, is it?","MAN: I think you meant the Sunshade Apartments. They're on a mountainside.","WOMAN: Any special features?","MAN: Yes, each room has its own sun terrace and there are shared barbecue facilities.","WOMAN: Sounds lovely!","MAN: Yes, it is rather well-equipped. It also provides water sports – it has its own beach. There are facilities for water-skiing.","WOMAN: Any kite-surfing? My friend's quite keen.","MAN: Not at the hotel but I'm sure you'll find some in Arilas. There's also satellite TV in the apartments.","WOMAN: And how much is that one?","MAN: £490 with two sharing.","WOMAN: You mean £245 each?","MAN: I'm afraid not! Each person has to pay that amount and there must be at least two in an apartment.","WOMAN: I don't think that would be within our budget, unfortunately. And the last one sounds a bit expensive too – the Grand!","MAN: Actually it's quite reasonable. It's an older style house with Greek paintings in every room, and a balcony outside.","WOMAN: Sounds nice. What are the views like?","MAN: Well, there are forests all round and they hide a supermarket just down the road, so that's very useful for all your shopping needs. There's a disco in the area too.","WOMAN: And the price?","MAN: £319 at that time, but if you leave it till November it goes down by 40%.","WOMAN: Too late, I'm afraid.","MAN: Well, why don't I send you a brochure with full details, Ms ... ?","WOMAN: Nash. But don't worry about that. I'm coming to Upminster soon and I'll call and get one. I just wanted to get an idea first.","MAN: Well, that's fine. We've got plenty here when you come.","WOMAN: If you've got a minute, could I just check a couple of points about insurance? I got one policy through the post but I'd like to see if yours is better.","MAN: Fine. What would you like to know?","WOMAN: Well, the one I've got has benefits and then the maximum amount you can claim. Is that like yours?","MAN: Yes, that's how most of them are.","WOMAN: Well, the first thing is cancellation. If the holiday's cancelled on the policy I've got, you can claim £8,000.","MAN: We ca  Grand</b></td>\n<td>- Greek paintings<p></p>\n<p>- <span class=\"question-item\"><strong class=\"q-number\">3</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"3\" oninput=\"setQ(3,this.value)\"></span></p></td>\n<td>- overlooking <span class=\"question-item\"><strong class=\"q-number\">4</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"4\" oninput=\"setQ(4,this.value)\"></span><p></p>\n<p>- near a supermarket and a disco</p></td>\n<td>£ <span class=\"question-item\"><strong class=\"q-number\">5</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"5\" oninput=\"setQ(5,this.value)\"></span></td>\n</tr>\n</tbody></table>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n mber\">10</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"10\" oninput=\"setQ(10,this.value)\"></span></td>\n</tr>\n<tr>\n<td colspan=\"2\">Direct phone line: 081260 543216</td>\n</tr>\n</tbody>\n</table>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-19/section-1.mp3"},{"number":2,"transcript":["WOMAN: For the second in our series about locally-run businesses, we meet Simon Winridge, co-founder of the hugely-successful Winridge Forest Railway Park. Welcome, Simon. Now, perhaps you can begin by telling us a little bit about how it all started.","MAN: Well, during the 1970s, my wife, Liz and I had just acquired 80 acres of sheep-farming land, and we decided to settle down and have children. Pretty soon we had a daughter, Sarah, and a son, Duncan. The place was wonderful for the kids: they particularly loved trains and gradually built up an enormous network of miniature railway track. I began to develop larger-scale models of locomotives but we didn't think anything more of it until I went on a trip to a theme park near Birmingham and decided we could do a much better job! So we set up a small one ourselves based on the miniature railway and we opened to the public for just a month that year, 1984 – in July – our driest month – because our children said they didn't want our guests to have a miserable, wet visit. I dealt with Park business and Liz carried on with the farm work.","It soon became clear that we were onto a winner. We began to extend the railway track and lay it among more interesting landscape by planting trees, which in turn attracted more wildlife, and by making cuttings through the rock.","Nowadays, we're open all year round and we're pleased to say that Winridge is one of the most popular visitor attractions in the area – with 50,000 visitors a year – a million and a half people have been through our doors since we opened.","All these visitors mean we have had to expand our operation and it's now a truly family concern. I'm near to retirement age so I only concern myself with looking after the mechanical side of things – keeping the trains going. Liz now devotes all her energies to recruiting and supporting the large squadron of workers, which keep the place running smoothly. We're really pleased that after some years away teaching, Sarah has now returned to the park and makes sure the visitors are kept fed and watered, which keeps her pretty busy as you can imagine. Our son, Duncan, has been a stalwart of the park for the last ten years, taking over from me in the area of construction – and I'll say a little bit more about that in a moment – and his new wife, Judith, has also joined the team in charge of retail. That's becoming a tremendous growth area for us – a lot of people want to buy souvenirs.","WOMAN: So have you finished your development of the site for the moment?","MAN: Not at all! We're constantly looking for ways to offer more to our visitors. The railway remains the central feature and there's now 1.2 kilometres of the line laid but we'd like to lay more. Because of the geology of the area, our greatest problem is digging tunnels. But we're gradually overcoming that. We're also very pleased with a new installation of the Go-Kart arena which is 120 square metres in area. Again the problem is the geology; we had to level the mounds on the track for safety reasons. We wanted to enable 5–12 year olds to use the go-karts. And the main attraction here is the Formula 1 Kart. We've known flights to break out over who gets it! And then finally to our most recent development which is the landscaped ..."],"cloze":"<p>WOMAN: For the second in our series about <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>, we meet Simon Winridge, co-founder of the hugely-successful Winridge Forest Railway Park. Welcome, Simon. Now, perhaps you can begin by telling us a little bit about how it all started.</p><p>MAN: Well, during the 1970s, my wife, Liz and I had just <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>, and we decided to settle down and have children. Pretty soon we had a daughter, Sarah, and a son, Duncan. The place was wonderful for the kids: they particularly loved trains and gradually built up an <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>. I began to develop larger-scale models of locomotives but we didn't think anything more of it until I went on a <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> and decided we could do a much better job! So we set up a small one ourselves based on the miniature railway and we <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> that year, 1984 – in July – <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span> – because our children said they didn't want our guests to have a miserable, wet visit. I dealt with Park business and Liz carried on with the farm work.</p><p>It soon became clear that we were onto a winner. We began to <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span> and lay it among more interesting landscape by <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>, which in turn attracted more wildlife, and by <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span>.</p><p>Nowadays, we're <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span> and we're pleased to say that Winridge is one of the most popular visitor attractions in the area – with <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span> – a million and a half people have been through our doors since we opened.</p><p>All these visitors mean we have had to expand our operation and it's now a truly family concern. I'm near to retirement age so I on Danh từ (n)","meaning":"đoạn đường đào xuyên qua đất hoặc đá","example":"The railway includes cuttings through the rock.","exampleVi":"Tuyến đường sắt có các đoạn đào xuyên qua đá."},{"word":"retail","ipa":"/ˈriːteɪl/","pos":"Danh từ (n)","meaning":"hoạt động bán lẻ","example":"Judith manages the park's growing retail area.","exampleVi":"Judith quản lý mảng bán lẻ đang phát triển của công viên."},{"word":"geology","ipa":"/dʒiˈɒlədʒi/","pos":"Danh từ (n)","meaning":"địa chất","example":"Local geology makes tunnel construction difficult.","exampleVi":"Địa chất địa phương khiến việc đào hầm trở nên khó khăn."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 11-13</h2>\n                                                                                <div class=\"task-copy\">\n                                            <p>Choose the correct letter, A, B or C.</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">11</strong> Simon's idea for a theme park came from</span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q11\" value=\"A\" data-q=\"11\" onchange=\"setQ(11,this.value)\"><span>his childhood hobby.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q11\" valu </b> engine maintenance</div><div><b>F</b> food and drink</div><div><b>G</b> sales</div><div><b>H</b> staffing</div></div>\n                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 19-20</h2>\n                                                                                <div class=\"task-copy\">\n                                            <p>Complete the table below.</p>\n<p>Write ONE WORD AND/OR NUMBERS for each answer.</p>\n<table>\n<tbody>\n<tr>\n<th>Feature</th>\n<th>Size</th>\n<th>Biggest challenge</th>\n<th>Target age group</th>\n</tr>\n<tr>\n<td>Railway</td>\n<td>1.2 km</td>\n<td>Making tunnels</td>\n<td></td>\n</tr>\n<tr>\n<td>Go-Kart arena</td>\n<td><span class=\"question-item\"><strong class=\"q-number\">19</stron ","CAROLINE: Well, I found computer modelling fascinating – I have no problem following what's being taught, whereas quite a few of my classmates find it difficult.","TUTOR: Well, that's very good. Do you think these might be areas you could bring into your dissertation?","CAROLINE: Oh yes, if possible. It's just that I'm having difficulty thinking how I can do that. You see I feel I don't have sufficient background information.","TUTOR: I see. Well, do you take notes?","CAROLINE: I'm very weak at note-taking. My teachers always used to say that.","TUTOR: Well, I think you really need to work on these weaknesses before you go any further.","CAROLINE: What do you suggest?","TUTOR: Well, I can go through the possible strategies with you and let you decide where to go from there.","CAROLINE: Okay, thanks.","TUTOR: Well, some people find it helpful to organise peer-group discussions – you know, each week a different person studies a different topic and shares it with the group.","CAROLINE: Oh right.","TUTOR: It really helps build confidence, you know, having to present something to others.","CAROLINE: I can see that.","TUTOR: The drawback is that everyone in the group seems to share the same ideas ... they keep being repeated in all the dissertations.","CAROLINE: Okay.","TUTOR: You could also try a service called 'Student Support'. It's designed to give you a structured programme over a number of weeks to develop your skills.","CAROLINE: Sounds good.","TUTOR: Yes, unfortunately there are only a few places. But it's worth looking into.","CAROLINE: Yes, of course. I know I've got to work on my study skills.","TUTOR: And then there are several study skills books you can consult.","CAROLINE: Right.","TUTOR: They'll be a good source of reference but the problem is they are sometimes too general.","CAROLINE: Yes, that's what I've found.","TUTOR: Other than that I would strongly advise quite simple ideas like using a card index.","CAROLINE: Well, yes, I've never done that befo                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 33-40</h2>\n                                                                                <div class=\"task-copy\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the notes below.</p>\n<p>Write ONE WORD AND/OR A NUMBER for each answer.</p>\n<p class=\"ielts-listening-transcript-subhead\"><strong>The Underground House</strong></p>\n<p><b>Design</b></p>\n<ul>\n<li>Built in the earth, with two floors</li>\n<li>The south-facing side was constructed of two layers of <span class=\"question-item\"><strong class=\"q-number\">33</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"33\" oninput=\"setQ(33,this.value)\"></span></li>\n<li>Photovoltaic tiles were attached</li>\n<li>A layer of foam was used to improve the <span class=\"question-item\"><strong class=\"q-number\">34</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"34\" oninput=\"setQ(34,this.value)\"></span> of the building</li>\n</ul>\n<p><b>Special features</b></p>\n<ul>\n<li>To increase the light, the building has many internal mirrors and <span class=\"question-item\"><strong class=\"q-number\">35</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"35\" oninput=\"setQ(35,this.value)\"></span></li>\n<li>In future, the house may produce more <span class=\"question-item\"><strong class=\"q-number\">36</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"36\" oninput=\"setQ(36,this.value)\"></span> than it needs</li>\n<li>Recycled wood was used for the <span class=\"question-item\"><strong class=\"q-number\">37</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"37\" oninput=\"setQ(37,this.value)\"></span> of the house</li>\n<li>The system for processing domestic <span class=\"question-item\"><strong class=\"q-number\">38</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"38\" oninput=\"setQ(38,this.value)\"></span> is organic</li>\n</ul>\n<p><b>Environmental issues</b></p>\n<ul>\n<li>The use of large quantities of <span class=\"question-item\"><strong class=\"q-number\">39</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"39\" oninput=\"setQ(39,this.value)\"></span> in construction was environmentally harmful</li>\n<li>But the house will have paid its 'environmental debt' within <span class=\"question-item\"><strong class=\"q-number\">40</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"40\" oninput=\"setQ(40,this.value)\"></span></li>\n</ul>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-19/section-4.mp3"}],"form":{"url":"https://docs.google.com/forms/d/e/1FAIpQLSfi_gKYiTBEuV8CW68pfTJjf7MVPpMDVNMkjZWy1AjlBfigfQ/formResponse","week":"entry.1893665426","name":"entry.442430322","studentClass":"entry.55126249","d1":"entry.1101074174","i1":"entry.1320743073","d2":"entry.838708618","i2":"entry.950878529","total":"entry.219410480"}};</script><script>let si=0,stage="vocab",scoreSendPromise=null,scoreRetryTimer=null,scoreRetryAttempt=0;

function setGroup(key,v,box,max){let a=state.q[key]||[];if(box.checked&&!a.includes(v)&&a.length>=max){box.checked=false;return}a=box.checked?[...new Set([...a,v])]:a.filter(x=>x!==v);state.q[key]=a;invalidateScore(`i${si+1}`);save();gate();scorePanel()}

function gate(){const b=$("#partSubmit");if(!b)return;const done=complete(),submitted=partConfirmed(currentScoreKey());if(submitted)document.querySelectorAll("#content input,#content select").forEach(control=>control.disabled=true);b.disabled=submitted||!done;b.textContent=submitted?"✓ ĐÃ XÁC NHẬN NỘP PHẦN NÀY":done?"Xác nhận & nộp bài":stage==="dictation"?"Điền đủ 20/20 chỗ để nộp":"Làm đủ 10/10 câu để nộp"}
function vocab(){return `<div class="vocab-grid">${section().vocab.map(v=>`<article class="vocab-card"><button class="sound" onclick='speak(${JSON.stringify(v.word)})'>◖))</button><h3>${v.word}</h3><div class="ipa">${v.ipa}</div><div class="pos">${v.pos}</div><div class="meaning">${v.meaning}</div><p class="example">${v.example}</p><div class="translation">${v.exampleVi}</div></article>`).join("")}</div>`}

function scoreView(){return `<div class="score-view"><h2>Kết quả Tuần ${DATA.week}</h2><div class="student-summary"><span>${state.studentName.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span><span>${state.studentClass}</span></div><div id="scoreGrid" class="score-grid"></div><div id="scoreStatus">${submissionMessage()}</div></div>`}
function restoreInputs(){

function confirmPart(total,label){return window.confirm(`Em đã làm đủ ${total} ${label}. Xác nhận nộp phần này để chấm điểm và khóa kết quả?`)}

function gradeDict(){

  section().clozeAnswers.forEach((a,i)=>{const input=document.querySelector(`[data-gap="${i}"]`),good=norm(state.g[`${si+1}-${i}`])===norm(a);input.classList.toggle("good",good);input.classList.toggle("bad",!good);if(good)ok++});

function gradeIelts(){

  for(const [key,nums] of questionGroups()){

    const points=chosen.filter(x=>valid.has(norm(x))).length;ok+=points;nums.forEach(q=>grouped.add(q));

  }

function scorePayload(label,a,b){
  const p=new URLSearchParams();p.set(DATA.form.week,label);p.set(DATA.form.name,state.studentName.trim());p.set(DATA.form.studentClass,state.studentClass);

function scheduleScoreRetry(){

async function ensureScoresSubmitted(){

        state.submission.parts[part.key]="sending";save();scorePanel();

function openTest(){

  const previousKey=state.studentKey||identityKey(state.studentName,state.studentClass),nextKey=identityKey(name,studentClass);
  if(previousKey&&previousKey!==nextKey){state.q={};state.g={};state.scores={};state.confirmations={};resetSubmission()}
  state.studentName=name;state.studentClass=studentClass;state.studentKey=nextKey;save();$("#entryGate").hidden=true;$("#testApp").hidden=false;render();if(scoresReady())void ensureScoresSubmitted();
}
entryName.oninput=updateEntryGate;entryClass.onchange=updateEntryGate;enterTest.onclick=openTest;entryName.onkeydown=e=>{if(e.key==="Enter"&&!enterTest.disabled)openTest()};
window.addEventListener("online",()=>{clearScoreRetry();if(scoresReady())void ensureScoresSubmitted()});updateEntryGate();render();
</script></body></html>
