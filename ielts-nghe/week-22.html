s=\"question-item\"><strong class=\"q-number\">3</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"3\" oninput=\"setQ(3,this.value)\"></span></li>\n<li>A <span class=\"question-item\"><strong class=\"q-number\">4</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"4\" oninput=\"setQ(4,this.value)\"></span> is provided in the hotel</li>\n<li>Total weekly pay: £231</li>\n<li>Dress: a white shirt and <span class=\"question-item\"><strong class=\"q-number\">5</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"5\" oninput=\"setQ(5,this.value)\"></span> trousers (not supplied)<p></p>\n<p>a <span class=\"question-item\"><strong class=\"q-number\">6</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"6\" oninput=\"setQ(6,this.value)\"></span> (supplied)</p></li>\n<li>Starting date: <span class=\"question-item\"><strong class=\"q-number\">7</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"7\" oninput=\"setQ(7,this.value)\"></span></li>\n<li>Call Jane <span class=\"question-item\"><strong class=\"q-number\">8</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"8\" oninput=\"setQ(8,this.value)\"></span> (Service Manager) before <span class=\"question-item\"><strong class=\"q-number\">9</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"9\" oninput=\"setQ(9,this.value)\"></span> tomorrow (Tel: 832009)</li>\n<li>She'll require a <span class=\"question-item\"><strong class=\"q-number\">10</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"10\" oninput=\"setQ(10,this.value)\"></span></li>\n</ul>\n</div>                                        </div>\n o\" name=\"q20\" value=\"C\" data-q=\"20\" onchange=\"setQ(20,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q20\" value=\"D\" data-q=\"20\" onchange=\"setQ(20,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q20\" value=\"E\" data-q=\"20\" onchange=\"setQ(20,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q20\" value=\"F\" data-q=\"20\" onchange=\"setQ(20,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q20\" value=\"G\" data-q=\"20\" onchange=\"setQ(20,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q20\" value=\"H\" data-q=\"20\" onchange=\"setQ(20,this.value)\"></td></tr></tbody></table>                                                                                                                                                                                        </div>\n                                        </div>","audio":"https://engnovate.com/wp-content/uploads/2026/06/cambridge-ielts-08-academic-listening-test-4-2.mp3"},{"number":3,"transcript":["DAN: Hi Jeannie. How's it going?","JEANNIE: Oh, hello Dan. Pretty well, thanks. Have you managed to get the money for the course yet?","DAN: Yes, that's all sorted out now, thanks. It took long enough, though. It was practically a year ago that I applied to my local council for a grant, and it took them six months to turn me down.","JEANNIE: That's really slow.","DAN: And I thought I was eligible for government funding, but it seems I was mistaken. So then I asked the boss of the company I used to work for if they would sponsor me, and much to my surprise, he said they'd make a contribution.","JEANNIE: But what about college grants and scholarships? There must be some you could apply for.","DAN: Yes, there are, but they're all so small that I decided to leave them until I was desperate.","JEANNIE: Uhuh.","DAN: And in fact I didn't need to apply. My parents had been saying that as I already had a job, I ought to support myself through college. But in the end they took pity on me, so now I've just about got enough.","JEANNIE: That's good.","DAN: So now I can put a bit of effort into meeting people – I haven't had time so far. Any suggestions?","JEANNIE: What about joining some college clubs?","DAN: Oh right. You joined several didn't you?","JEANNIE: Yes, I'm in the drama club. It's our first performance next week, so we're rehearsing frantically, and I've got behind with my work, but it's worth it. I'm hoping to be in the spring production, too.","DAN: I've never liked acting. Are you doing anything else?","JEANNIE: I enjoyed singing when I was at school, so I joined a group when I came to college. I don't think the conductor stretches us enough, though so I'll give up after the next concert. And I also joined the debating society. It's fun, but with all the rehearsing I'm doing, something has to go, and I'm afraid that's the one.","DAN: Do you do any sports?","JEANNIE: Yes, I'm in one of the hockey teams. I'm not very good, but I'd really miss it if I stopped. I decided to try tennis when I came to college, and I'm finding it pretty tough going. I'm simply not fit enough.","DAN: Nor me. I think I'll give that a miss!","JEANNIE: I'm hoping it'll help me to build up my stamina, but it'll probably be a long haul.","DAN: Good luck.","JEANNIE: Thanks.","DAN: How are you finding the course?","JEANNIE: I wish we had more seminars.","DAN: What? I'd have thought we had more than enough already. All those people saying clever things that I could never think of – it's quite interesting, but I wonder if I'm clever enough to be doing this course.","JEANNIE: I find it helpful to listen to the other people. I like the way we're exploring the subject, and working towards getting insight into it.","DAN: How do you get on with your tutor? I don't think I'm on the same wavelength as mine, so I feel I'm not getting anything out of the tutorials. It would be more productive to read a book instead.","JEANNIE: Oh, mine's very demanding. She gives me lots of feedback and advice, so I've got much better at writing essays. And she's helping me plan my revision for the end-of-year exams.","DAN: Do tell me, I always struggle with revision.","JEANNIE: Well, the first thing is to find out exactly what's required in the exams.","DAN: Mm. Would it help to get hold of some past papers?","JEANNIE: Yes. They'll help to make it clear.","DAN: Right, I'll do that. Then what?","JEANNIE: Then you can sort out your revision priorities, based on what's most likely to come up. I put these on a card, and read them through regularly.","DAN: Uhuh.","JEANNIE: But that isn't enough in itself. You also need a timetable, to see how you can fit everything in, in the time available. Then keep it in front of you while you're studying.","DAN: I've done that before, but it hasn't helped me!","JEANNIE: Maybe you need to do something different every day, so if you break down your revision into small tasks, and allocate them to specific days, there's more incentive to tackle them. With big topics you're more likely to put off starting.","DAN: Good idea.","JEANNIE: And as I revise each topic I write a single paragraph about it – then later I can read it through quickly, and it helps fix things in my mind.","DAN: That's brilliant.","JEANNIE: I also write answers to questions for the exam practice. It's hard to make myself do it, though!","DAN: Well, I'll try. Thanks a lot, Jeannie. That's a great help.","JEANNIE: No problem.","DAN: See you around.","JEANNIE: Bye."],"cloze":"<p>DAN: Hi Jeannie. How's it going?</p><p>JEANNIE: Oh, hello Dan. Pretty well, thanks. Have you managed to get the money for the course yet?</p><p>DAN: Yes, that's all sorted out now, thanks. It took long enough, though. It was practically a year ago that I applied to my <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>, and it took them six months to turn me down.</p><p>JEANNIE: That's really slow.</p><p>DAN: And I thought I was eligible for <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>, but it seems I was mistaken. So then I asked the boss of the company I used to work for if they would sponsor me, and much to my surprise, he said they'd <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>.</p><p>JEANNIE: But what about <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>? There must be some you could apply for.</p><p>DAN: Yes, there are, but they're all so small that I decided to leave them until I was desperate.</p><p>JEANNIE: Uhuh.</p><p>DAN: And in fact I didn't need to apply. My parents had been saying that as I already had a job, I ought to <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span>. But in the end they took pity on me, so now I've just about got enough.</p><p>JEANNIE: That's good.</p><p>DAN: So now I can <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span> into meeting people – I haven't had time so far. Any suggestions?</p><p>JEANNIE: What about joining some college clubs?</p><p>DAN: Oh right. You joined several didn't you?</p><p>JEANNIE: Yes, I'm in the drama club. It's our first performance next week, so we're <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span>, and I've <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>, but it's worth it. I'm hoping to be in the spring production, too.</p><p>DAN: I've never liked acting. Are you doing anything else?</p><p>JEANNIE: I enjoyed singing when I was at school, so I joined a group when I came to college. I don't think the <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span>, though so I'll give up after the next concert. And I also joined the <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>. It's fun, but with all the rehearsing I'm doing, something has to go, and I'm afraid that's the one.</p><p>DAN: Do you do any sports?</p><p>JEANNIE: Yes, I'm in one of the <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span>. I'm not very good, but I'd really miss it if I stopped. I decided to try tennis when I came to college, and I'm finding it <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span>. I'm simply not fit enough.</p><p>DAN: Nor me. I think I'll give that a miss!</p><p>JEANNIE: I'm hoping it'll help me to <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span>, but it'll probably be a long haul.</p><p>DAN: Good luck.</p><p>JEANNIE: Thanks.</p><p>DAN: How are you finding the course?</p><p>JEANNIE: I wish we had <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span>.</p><p>DAN: What? I'd have thought we had more than enough already. All those people saying clever things that I could never think of – it's quite interesting, but I wonder if I'm clever enough to be doing this course.</p><p>JEANNIE: I find it helpful to listen to the other people. I like the way we're exploring the subject, and working towards <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span>.</p><p>DAN: How do you get on with your tutor? I don't think I'm on the <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span> as mine, so I feel I'm not getting anything out of the tutorials. It would be more productive to read a book instead.</p><p>JEANNIE: Oh, mine's very demanding. She gives me <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span>, so I've got much better at writing essays. And she's helping me plan my revision for the end-of-year exams.</p><p>DAN: Do tell me, I always struggle with revision.</p><p>JEANNIE: Well, the first thing is to find out exactly what's required in the exams.</p><p>DAN: Mm. Would it help to get hold of some past papers?</p><p>JEANNIE: Yes. They'll help to make it clear.</p><p>DAN: Right, I'll do that. Then what?</p><p>JEANNIE: Then you can sort out your <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>, based on what's most likely to come up. I put these on a card, and read them through regularly.</p><p>DAN: Uhuh.</p><p>JEANNIE: But that isn't enough in itself. You also need a timetable, to see how you can fit everything in, in the time available. Then keep it in front of you while you're studying.</p><p>DAN: I've done that before, but it hasn't helped me!</p><p>JEANNIE: Maybe you need to do something different every day, so if you break down your revision into <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span>, and allocate them to specific days, there's more incentive to tackle them. With big topics you're more likely to put off starting.</p><p>DAN: Good idea.</p><p>JEANNIE: And as I revise each topic I write a <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span> about it – then later I can read it through quickly, and it helps fix things in my mind.</p><p>DAN: That's brilliant.</p><p>JEANNIE: I also write answers to questions for the exam practice. It's hard to make myself do it, though!</p><p>DAN: Well, I'll try. Thanks a lot, Jeannie. That's a great help.</p><p>JEANNIE: No problem.</p><p>DAN: See you around.</p><p>JEANNIE: Bye.</p>","clozeAnswers":["local council for a grant","government funding","make a contribution","college grants and scholarships","support myself through college","put a bit of effort","rehearsing frantically","got behind with my work","conductor stretches us enough","debating society","hockey teams","pretty tough going","build up my stamina","more seminars","getting insight into it","same wavelength","lots of feedback and advice","revision priorities","small tasks","single paragraph"],"vocab":[{"word":"eligible","ipa":"/ˈelɪdʒəbl/","meaning":"đủ điều kiện","example":"Dan thought he was eligible for government funding.","exampleVi":"Dan nghĩ mình đủ điều kiện nhận tài trợ chính phủ.","pos":"Tính từ (adj)"},{"word":"sponsor","ipa":"/ˈspɒnsə/","meaning":"tài trợ","example":"A former employer agreed to sponsor part of the course.","exampleVi":"Chủ cũ đồng ý tài trợ một phần khóa học.","pos":"Động từ (v)"},{"word":"frantically","ipa":"/ˈfræntɪkli/","meaning":"một cách hối hả","example":"The drama club is rehearsing frantically this week.","exampleVi":"Câu lạc bộ kịch đang tập luyện hối hả tuần này.","pos":"Trạng từ (adv)"},{"word":"stamina","ipa":"/ˈstæmɪnə/","meaning":"sức bền","example":"Regular tennis practice can build up stamina.","exampleVi":"Luyện tennis đều đặn có thể tăng sức bền.","pos":"Danh từ (n)"},{"word":"on the same wavelength","ipa":"/ɒn ðə seɪm ˈweɪvleŋθ/","meaning":"cùng cách nghĩ, hiểu ý nhau","example":"Dan is not on the same wavelength as his tutor.","exampleVi":"Dan không thực sự hiểu ý với gia sư của mình.","pos":"Cụm tính từ (adj phr.)"},{"word":"revision priorities","ipa":"/rɪˈvɪʒən praɪˈɒrətiz/","meaning":"các ưu tiên ôn tập","example":"Past papers help students set revision priorities.","exampleVi":"Đề cũ giúp học sinh xác định ưu tiên ôn tập.","pos":"Cụm danh từ (n phr.)"}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 21-22</h2>\n                                                                                <div class=\"task-copy\">\n                                            <p>Choose TWO letters, A-E.</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">21</strong> <strong class=\"q-number\">22</strong> In which TWO ways is Dan financing his course?</span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input data-limit=\"2\" type=\"checkbox\" value=\"A\" data-group=\"21-22\" onchange=\"setGroup('21-22',this.value,this,2)\"><span>He is receiving money from the government.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input data-limit=\"2\" type=\"checkbox\" value=\"B\" data-group=\"21-22\" onchange=\"setGroup('21-22',this.value,this,2)\"><span>His family are willing to help him.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input data-limit=\"2\" type=\"checkbox\" value=\"C\" data-group=\"21-22\" onchange=\"setGroup('21-22',this.value,this,2)\"><span>The college is giving him a small grant.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">D</label><input data-limit=\"2\" type=\"checkbox\" value=\"D\" data-group=\"21-22\" onchange=\"setGroup('21-22',this.value,this,2)\"><span>His local council is supporting him for a limited period.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">E</label><input data-limit=\"2\" type=\"checkbox\" value=\"E\" data-group=\"21-22\" onchange=\"setGroup('21-22',this.value,this,2)\"><span>A former employer is providing partial funding.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 23-24</h2>\n                                                                                <div class=\"task-copy\">\n                                            <p>Choose TWO letters, A-E.</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">23</strong> <strong class=\"q-number\">24</strong> Which TWO reasons does Jeannie give for deciding to leave some college clubs?</span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input data-limit=\"2\" type=\"checkbox\" value=\"A\" data-group=\"23-24\" onchange=\"setGroup('23-24',this.value,this,2)\"><span>She is not sufficiently challenged.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input data-limit=\"2\" type=\"checkbox\" value=\"B\" data-group=\"23-24\" onchange=\"setGroup('23-24',this.value,this,2)\"><span>The activity interferes with her studies.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input data-limit=\"2\" type=\"checkbox\" value=\"C\" data-group=\"23-24\" onchange=\"setGroup('23-24',this.value,this,2)\"><span>She does not have enough time.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">D</label><input data-limit=\"2\" type=\"checkbox\" value=\"D\" data-group=\"23-24\" onchange=\"setGroup('23-24',this.value,this,2)\"><span>The activity is too demanding physically.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">E</label><input data-limit=\"2\" type=\"checkbox\" value=\"E\" data-group=\"23-24\" onchange=\"setGroup('23-24',this.value,this,2)\"><span>She does not think she is any good at the activity.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 25-26</h2>\n                                                                                <div class=\"task-copy\">\n                                            <p>Choose the correct letter, A, B or C.</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">25</strong> What does Dan say about the seminars on the course?</span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q25\" value=\"A\" data-q=\"25\" onchange=\"setQ(25,this.value)\"><span>The other students do not give him a chance to speak.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q25\" value=\"B\" data-q=\"25\" onchange=\"setQ(25,this.value)\"><span>The seminars make him feel inferior to the other students.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q25\" value=\"C\" data-q=\"25\" onchange=\"setQ(25,this.value)\"><span>The preparation for seminars takes too much time.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">26</strong> What does Jeannie say about the tutorials on the course?</span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q26\" value=\"A\" data-q=\"26\" onchange=\"setQ(26,this.value)\"><span>They are an inefficient way of providing guidance.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q26\" value=\"B\" data-q=\"26\" onchange=\"setQ(26,this.value)\"><span>They are more challenging than she had expected.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q26\" value=\"C\" data-q=\"26\" onchange=\"setQ(26,this.value)\"><span>They are helping her to develop her study skills.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 27-30</h2>\n                                                                                <div class=\"task-copy\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the flow-chart below.</p>\n<p>Choose NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.</p>\n<p><strong>Advice on exam preparation</strong></p>\n<p>Make sure you know the exam requirements</p>\n<p>↓</p>\n<p>Find some past papers</p>\n<p>↓</p>\n<p>Work out your <span class=\"question-item\"><strong class=\"q-number\">27</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"27\" oninput=\"setQ(27,this.value)\"></span> for revision and write them on a card</p>\n<p>↓</p>\n<p>Make a <span class=\"question-item\"><strong class=\"q-number\">28</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"28\" oninput=\"setQ(28,this.value)\"></span> and keep it in view</p>\n<p>↓</p>\n<p>Divide revision into <span class=\"question-item\"><strong class=\"q-number\">29</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"29\" oninput=\"setQ(29,this.value)\"></span> for each day</p>\n<p>↓</p>\n<p>Write one <span class=\"question-item\"><strong class=\"q-number\">30</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"30\" oninput=\"setQ(30,this.value)\"></span> about each topic</p>\n<p>↓</p>\n<p>Practise writing some exam answers</p>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"https://engnovate.com/wp-content/uploads/2026/06/cambridge-ielts-08-academic-listening-test-4-3.mp3"},{"number":4,"transcript":["Good morning, everyone. I've been invited to talk about my research project into Australian Aboriginal rock paintings. The Australian Aborigines have recorded both real and symbolic images of their time on rock walls for many thousands of years. Throughout the long history of this tradition, new images have appeared and new painting styles have developed. And these characteristics can be used to categorise the different artistic styles. Among these are what we call the Dynamic, Yam and Modern styles of painting.","One of the most significant characteristics of the different styles is the way that humans are depicted in the paintings. The more recent paintings show people in static poses. But the first human images to dominate rock art paintings, over 8,000 years ago, were full of movement. These paintings showed people hunting and cooking food and so they were given the name 'Dynamic' to reflect this energy. It's quite amazing considering they were painted in such a simple stick-like form. In the Yam period, there was a movement away from stick figures to a more naturalistic shape. However, they didn't go as far as the Modern style, which is known as 'x-ray' because it actually makes a feature of the internal skeleton as well as the organs of animals and humans. The Yam style of painting got its name from the fact that it featured much curvier figures that actually resemble the vegetable called a yam, which is similar to a sweet potato. The Modern paintings are interesting because they include paintings at the time of the first contact with European settlers. Aborigines managed to convey the idea of the settlers' clothing by simply painting the Europeans without any hands, indicating the habit of standing with their hands in their pockets! Size is another characteristic. The more recent images tend to be life size or even larger, but the Dynamic figures are painted in miniature.","Aboriginal rock art also records the environmental changes that occurred over thousands of years. For example, we know from the Dynamic paintings that over 8,000 years ago, Aborigines would have rarely eaten fish and sea levels were much lower at this time. In fact, fish didn't start to appear in paintings until the Yam period along with shells and other marine images. The paintings of the Yam tradition also suggest that, during this time, the Aborigines moved away from animals as their main food source and began including vegetables in their diet, as these feature prominently. Freshwater creatures didn't appear in the paintings until the Modern period from 4,000 years ago.","So, these paintings have already taught us a lot. But one image that has always intrigued us is known as the 'Rainbow Serpent'. The Rainbow Serpent, which is the focus of my most recent project, gets its name from its snake or serpent-like body and it first appeared in the Yam period 4 to 6,000 years ago. Many believe it is a curious mixture of kangaroo, snake and crocodile. But we decided to study the Rainbow Serpent paintings to see if we could locate the animal that the very first painters based their image on.","The Yam period coincided with the end of the last ice age. This brought about tremendous change in the environment, with the sea levels rising and creeping steadily inland. This flooded many familiar land features and also caused a great deal of disruption to traditional patterns of life, hunting in particular. New shores were formed and totally different creatures would have washed up onto the shores. We studied 107 paintings of the Rainbow Serpent and found that the one creature that matches it most closely was the Ribboned Pipefish, which is a type of sea horse. This sea creature would have been a totally unfamiliar sight in the inland regions where the image is found and may have been the inspiration behind the early paintings.","So, at the end of the ice age there would have been enormous changes in animal and plant life. It's not surprising then, that the Aborigines linked this abundance to the new creatures they witnessed. Even today, Aborigines see the Rainbow Serpent as a symbol of creation, which is understandable given the increase in vegetation and the new life forms that featured when the image first appeared."],"cloze":"<p>Good morning, everyone. I've been invited to talk about my research project into Australian Aboriginal rock paintings. The Australian Aborigines have recorded both real and <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> of their time on rock walls for many thousands of years. Throughout the long history of this tradition, new images have appeared and new painting styles have developed. And these characteristics can be used to <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>. Among these are what we call the Dynamic, Yam and Modern styles of painting.</p><p>One of the most significant characteristics of the different styles is the way that humans are depicted in the paintings. The more recent paintings show people in <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.valu (9,this.value)\" aria-label=\"Chỗ trống 10\"></span>.</p><p>Aboriginal rock art also records the <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span> that occurred over thousands of years. For example, we know from the Dynamic paintings that over 8,000 years ago, Aborigines would have rarely eaten fish and <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span> at this time. In fact, fish didn't start to appear in paintings until the Yam period along with shells and other <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span>. The paintings of the Yam tradition also suggest that, during this time, the Aborigines moved away from animals as their <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span> and began including vegetables in their diet, as these feature prominently. <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span> didn't appear in the paintings until the Modern period from 4,000 years ago.</p><p>So, these paintings have already taught us a lot. But one image that has always intrigued us is known as the 'Rainbow Serpent'. The Rainbow Serpent, which is the <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>, gets its name from its snake or serpent-like body and it first appeared in the Yam period 4 to 6,000 years ago. Many believe it is a curious mixture of kangaroo, snake and crocodile. But we decided to study the Rainbow Serpent paintings to see if we could locate the animal that the very first painters based their image on.</p><p>The Yam period coincided with the <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span>. This brought about tremendous change in the environment, with the sea levels rising and creeping steadily inland. This flooded many familiar land features and also caused a great deal of disruption to <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>, hunting in particular. New shores were formed and totally different creatures would have washed up onto the shores. We studied 107 paintings of the Rainbow Serpent and found that the one creature that matches it most closely was the <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span>, which is a type of sea horse. This sea creature would have been a totally unfamiliar sight in the inland regions where the image is found and may have been the inspiration behind the early paintings.</p><p>So, at the end of the ice age there would have been enormous changes in animal and plant life. It's not surprising then, that the Aborigines linked this abundance to the new creatures they witnessed. Even today, Aborigines see the Rainbow Serpent as a <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>, which is understandable given the increase in vegetation and the new life forms that featured when the image first appeared.</p>","clozeAnswers":["symbolic images","categorise the different artistic styles","static poses","full of movement","simple stick-like form","more naturalistic shape","internal skeleton","resemble the vegetable","first contact with European settlers","painted in miniature","environmental changes","sea levels were much lower","marine images","main food source","Freshwater creatures","focus o function gradeIelts(){
  if(!complete()||!confirmPart(10,"câu IELTS"))return;const [a,b]=range();let ok=0,grouped=new Set();

  for(let q=a;q<=b;q++){
    if(grouped.has(q))continue;const valid=DATA.answers[q].map(norm),good=valid.includes(norm(state.q[q]));if(good)ok++;
    document.querySelectorAll(`[data-q="${q}"]`).forEach(el=>el.closest("td,.question-item,.paper-option")?.classList.add(good?"good":"bad"));
  }
  const scoreKey=`i${si+1}`;resetSubmission();state.scores[scoreKey]=ok;state.confirmations[scoreKey]=new Date().toISOString();
  $("#result").innerHTML=`<div class="result"><b>${ok}/10</b> · Em làm sai ${10-ok} câu. Hãy nghe lại Section ${si+1} và đối chiếu phần vừa làm.</div>`;finishPart();
}
function scorePanel(){
  const grid=$("#scoreGrid");if(grid)grid.innerHTML=scoreKeys().map(k=>`<div class="score"><small>${k[0]==="d"?"Chính tả":"IELTS"} · Section ${k.slice(1)}</small><br><b>${partConfirmed(k)?state.scores[k]:"—"}/${k[0]==="d"?20:10}</b></div>`).join("");
  updateStageTabs();const status=$("#scoreStatus");if(status)status.innerHTML=submissionMessage();
}
function scorePayload(label,a,b){
  const p=new URLSearchParams();p.set(DATA.form.week,label);p.set(DATA.form.name,state.studentName.trim());p.set(DATA.form.studentClass,state.studentClass);
  p.set(DATA.form.d1,String(state.scores[`d${a}`]));p.set(DATA.form.i1,String(state.scores[`i${a}`]));p.set(DATA.form.d2,String(state.scores[`d${b}`]));p.set(DATA.form.i2,String(state.scores[`i${b}`]));
  p.set(DATA.form.total,String(state.scores[`d${a}`]+state.scores[`i${a}`]+state.scores[`d${b}`]+state.scores[`i${b}`]));return p;
}
function scheduleScoreRetry(){
  if(scoreRetryTimer||state.submission.status==="sent")return;
  const delays=[5000,15000,30000,60000],delay=delays[Math.min(scoreRetryAttempt,delays.length-1)];scoreRetryAttempt++;
  scoreRetryTimer=setTimeout(()=>{scoreRetryTimer=null;if(scoresReady())void ensureScoresSubmitted()},delay);
}
async function ensureScoresSubmitted(){
  if(!scoresReady()||!state.studentName.trim()||!state.studentClass)return false;
  const fingerprint=scoreFingerprint();
  if(state.submission.fingerprint!==fingerprint)state.submission=freshSubmission(fingerprint);
  if(scoreParts.every(part=>state.submission.parts[part.key]==="sent")){state.submission.status="sent";return true}
  if(scoreSendPromise)return scoreSendPromise;
  clearScoreRetry();state.submission.status="sending";state.submission.sentAt="";save();scorePanel();
  scoreSendPromise=(async()=>{
    try{
      for(const part of scoreParts){
        if(state.submission.parts[part.key]==="sent")continue;
        state.submission.parts[part.key]="sending";save();scorePanel();
        await fetch(DATA.form.url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:scorePayload(part.label(),part.a,part.b).toString()});
        state.submission.parts[part.key]="sent";save();scorePanel();
      }
      state.submission.status="sent";state.submission.sentAt=new Date().toISOString();scoreRetryAttempt=0;save();scorePanel();return true;
    }catch{
      scoreParts.forEach(part=>{if(state.submission.parts[part.key]==="sending")state.submission.parts[part.key]="error"});
      state.submission.status="error";state.submission.sentAt="";save();scorePanel();scheduleScoreRetry();return false;
    }
    finally{scoreSendPromise=null}
  })();return scoreSendPromise;
}
$("#sectionTabs").innerHTML=DATA.sections.map((s,i)=>`<button onclick="si=${i};stage='vocab';render()">SECTION ${s.number}<br><small>Questions ${(s.number-1)*10+1}–${s.number*10}</small></button>`).join("");
document.querySelectorAll(".stage-tabs button").forEach(b=>b.onclick=()=>{if(b.dataset.stage==="score"&&!scoresReady())return;stage=b.dataset.stage;render()});
const entryName=$("#entryName"),entryClass=$("#entryClass"),enterTest=$("#enterTest");entryName.value=state.studentName;entryClass.value=state.studentClass;
function updateEntryGate(){const ready=entryName.value.trim()&&entryClass.value;enterTest.disabled=!ready;enterTest.textContent=ready?"Vào Listening Test":"Nhập họ tên và chọn lớp để vào bài"}
function openTest(){
  const name=entryName.value.trim(),studentClass=entryClass.value;if(!name||!studentClass)return;
  const previousKey=state.studentKey||identityKey(state.studentName,state.studentClass),nextKey=identityKey(name,studentClass);
  if(previousKey&&previousKey!==nextKey){state.q={};state.g={};state.scores={};state.confirmations={};resetSubmission()}
  state.studentName=name;state.studentClass=studentClass;state.studentKey=nextKey;save();$("#entryGate").hidden=true;$("#testApp").hidden=false;render();if(scoresReady())void ensureScoresSubmitted();
}
entryName.oninput=updateEntryGate;entryClass.onchange=updateEntryGate;enterTest.onclick=openTest;entryName.onkeydown=e=>{if(e.key==="Enter"&&!enterTest.disabled)openTest()};
window.addEventListener("online",()=>{clearScoreRetry();if(scoresReady())void ensureScoresSubmitted()});updateEntryGate();render();
</script></body></html>
