</style></head><body><section id="entryGate" class="entry-screen"><div class="entry-card"><header class="entry-head"><small>IELTS - NGHE · TUẦN 25</small><h1>Listening Test 15</h1><p>Điền thông tin học sinh trước khi vào bài.</p></header><div class="entry-body"><p class="entry-note">Họ tên và lớp sẽ được giữ lại để gửi điểm sau khi hoàn thành bài.</p><label for="entryName">Họ và tên học sinh</label><input id="entryName" type="text" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"><label for="entryClass">Lớp IELTS</label><select id="entryClass"><option value="">Chọn lớp IELTS</option><option>IELTS 40</option><option>IELTS 41</option><option>IELTS 42</option><option>IELTS 43</option><option>IELTS 44</option><option>IELTS 45</option><option>IELTS 46</option><option>IELTS 47</option><option>IELTS 48</option><option>IELTS 49</option><option>IELTS 50</option><option>IELTS 51</option><option>IELTS 52</option><option>IELTS 53</option></select><button id="enterTest" type="button" disabled>Nhập họ tên và chọn lớp để vào bài</button></div></div></section><div id="testApp" hidden><header class="hero"><small>IELTS - NGHE · TUẦN 25</small><h1>Listening Test 15</h1><p>Full Test · Sections 1–4 · 40 questions</p></header><main class="shell"><nav id="sectionTabs" class="section-tabs"></nav><nav class="stage-tabs"><button type="button" data-stage="vocab">A · Từ vựng cần lưu ý</button><button type="button" data-stage="dictation">B · Điền chính tả</button><button type="button" data-stage="ielts">C · Câu hỏi IELTS</button><button type="button" data-stage="score">D · Nộp bài</button></nav><section id="content" class="lesson"></section></main></div><script>const DATA={"week":25,"test":15,"answers":{"1":["travel","travelling","traveling"],"2":["history"],"3":["study"],"4":["teenagers"],"5":["kitchen"],"6":["crime"],"7":["appointment","booking"],"8":["sugar"],"9":["stamps"],"10":["parking"],"11":["D"],"12":["E"],"13":["A"],"14":["C"],"15":["C"],"16":["B"],"17":["A"],"18":["stress"],"19":["weight"],"20":["families"],"21":["C"],"22":["E"],"23":["H"],"24":["B"],"25":["A"],"26":["F"],"27":["A"],"28":["C"],"29":["B"],"30":["B"],"31":["insects"],"32":["behaviour","behavior"],"33":["father"],"34":["complex"],"35":["reproduction","breeding"],"36":["control"],"37":["ducks"],"38":["language"],"39":["food"],"40":["cost","price","bills"]},"sections":[{"number":1,"transcript":["SUSIE: Hello?","PAUL: Hi, Susie, it’s Paul here. How are you? Enjoying your new job? You’re working at the library, aren’t you?","SUSIE: Yes. I started when the library re-opened a month ago. It’s great.","PAUL: Actually Carol and I have been meaning to join for a while.","SUSIE: Oh, you should. It doesn’t cost anything, and the new library has all sorts of facilities. It’s not just a place where you borrow books. For instance, there’s an area with comfortable seats where you can sit and read the magazines they have there. Some people spend the whole morning there.","PAUL: Mmm. Wish I had that amount of time to spend!","SUSIE: Yes, you must be pretty busy at present, with the children and everything?","PAUL: We are, yes. But we’re hoping to get away this summer. We’re thinking of going to Greece.","SUSIE: Well, we’ve got a much larger section of the library devoted to travel books now, so you should come and have a look. I can’t remember if there’s anything specifically on Greece, but I should think so.","PAUL: OK. Now Carol’s organising a project for the history class she teaches at school – it’s about life in the town a hundred years ago. Do you have anything that might be useful?","SUSIE: Yes, actually we’ve now got a new section with materials on the history of the town and surrounding region.","PAUL: Right. I’ll tell her. You can’t always find that sort of thing on the internet. Now in the old library there used to be a separate room with reference books. It was a really nice quiet room.","SUSIE: Yes. We’ve put those books in the main part of the library now, but we do have a room called the community room. It can be hired out for meetings, but at other times people can use it to study.","PAUL: I might use that. It’s hard to find anywhere quiet at home sometimes.","SUSIE: I can’t remember how old your son and daughter are … we’ve introduced a special section of fiction written specially for teenagers, but they might be a bit young for that?","PAUL: Yes, they would be.","—————","SUSIE: Well, we do have lots of activities for younger children.","PAUL: Yes?","SUSIE: For example we have a Science Club. At the next meeting, they’re going to be doing experiments with stuff that everyone has in the kitchen – sugar and flour and so on.","PAUL: They might be interested, yes.","SUSIE: And we have a competition for children called Reading Challenge. That doesn’t begin until after the end of term. They have to read six books, and they get a certificate if they manage it.","PAUL: So that gives them something to do while they’re on holiday, instead of getting bored.","SUSIE: That’s the idea. And there’s special activities for adults too. On Friday we have a local author called Tanya Streep who’s going to be talking about her new novel. It’s called ‘Catch the Mouse’ and she based the story on a crime that actually took place here years ago.","PAUL: Right. We’re not free on Friday, but I’ll took out for the book.","SUSIE: Now this probably isn’t for you, but we do have IT support available for members. We get quite a few older people coming along who are wanting to get up to speed with computer technology. It’s on Tuesday mornings – they don’t need to make an appointment or anything, they just turn up.","PAUL: Well, my mother might be interested, I’ll let her know.","SUSIE: OK. And there’s another service which you wouldn’t expect from a library, which is a free medical check-up. The hospital arranges for someone to come along and measure the level of sugar in your blood, and they check cholesterol levels at the same time.","PAUL: Really?","SUSIE: Yes, but that’s only for the over-60s, so you wouldn’t qualify.","PAUL: OK. Well, I’ll tell my mother, she might be interested.","SUSIE: What other information … well, we do have a little shop with things like wallcharts and greetings cards, and also stamps so you can post the cards straightaway, which is really useful.","PAUL: Yeah. Well, I’ll bring the children round at the weekend and we’ll join. Oh, one more thing – I’ll be bringing the car, is there parking available?","SUSIE: Yes, and it’s free in the evening and at weekends.","PAUL: Perfect. Well, thanks, Susie see you …"],"cloze":"<p>SUSIE: Hello?</p><p>PAUL: Hi, Susie, it’s Paul here. How are you? Enjoying your new job? You’re <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>, aren’t you?</p><p>SUSIE: Yes. I started when the library <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>. It’s great.</p><p>PAUL: Actually Carol and I have been meaning to join for a while.</p><p>SUSIE: Oh, you should. It doesn’t cost anything, and the <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>. It’s not just a place where you borrow books. For instance, there’s an <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> where you can sit and read the magazines they have there. Some people spend the whole morning there.</p><p>PAUL: Mmm. Wish I had that amount of time to spend!</p><p>SUSIE: Yes, you must be pretty busy at present, with the children and everything?</p><p>PAUL: We are, yes. But we’re hoping to get away this summer. We’re <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span>.</p><p>SUSIE: Well, we’ve got along and <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>, and they check cholesterol levels at the same time.</p><p>PAUL: Really?</p><p>SUSIE: Yes, but that’s only for the over-60s, so you wouldn’t qualify.</p><p>PAUL: OK. Well, I’ll tell my mother, she might be interested.</p><p>SUSIE: What other information … well, we do have a little shop with things like <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span>, and also stamps so you can post the cards straightaway, which is really useful.</p><p>PAUL: Yeah. Well, I’ll bring the children round at the weekend and we’ll join. Oh, one more thing – I’ll be bringing the car, is there parking available?</p><p>SUSIE: Yes, and it’s <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>.</p><p>PAUL: Perfect. Well, thanks, Susie see you …</p>","clozeAnswers":["working at the library","re-opened a month ago","new library has all sorts of facilities","area with comfortable seats","thinking of going to Greece","section of the library devoted to travel books","history of the town and surrounding region","separate room with reference books","community room","use it to study","fiction written specially for teenagers","doing experiments with stuff that everyone has in the kitchen","read six books","certificate if they manage it","based the story on a crime","IT support available for members","need to make an appointment","measure the level of sugar in your blood","wallcharts and greetings cards","free in the evening and at weekends"],"vocab":[{"word":"devote to","ipa":"/dɪˈvəʊt tuː/","pos":"Cụm động từ (phr.v)","meaning":"dành riêng cho","example":"The library devotes a larger section to travel books.","exampleVi":"Thư viện dành một khu lớn hơn cho sách du lịch."},{"word":"surrounding region","ipa":"/səˈraʊndɪŋ ˈriːdʒən/","pos":"Cụm danh từ (n phr.)","meaning":"khu vực xung quanh","example":"The collection covers the town and surrounding region.","exampleVi":"Bộ sưu tập bao quát thị trấn và khu vực xung quanh."},{"word":"reference book","ipa":"/ˈrefrəns bʊk/","pos":"Cụm danh từ (n phr.)","meaning":"sách tham khảo","example":"Reference books are now in the main library.","exampleVi":"Sách tham khảo hiện nằm trong khu chính của thư viện."},{"word":"community room","ipa":"/kəˈmjuːnəti ruːm/","pos":"Cụm danh từ (n phr.)","meaning":"phòng sinh hoạt cộng đồng","example":"Members can study quietly in the community room.","exampleVi":"Thành viên có thể học yên tĩnh trong phòng cộng đồng."},{"word":"qualify","ipa":"/ˈkwɒlɪfaɪ/","pos":"Động từ (v)","meaning":"đủ điều kiện","example":"Only people over sixty qualify for the check-up.","exampleVi":"Chỉ người trên sáu mươi tuổi đủ điều kiện khám."},{"word":"turn up","ipa":"/tɜːn ʌp/","pos":"Cụm động từ (phr.v)","meaning":"đến, xuất hiện","example":"Members can simply turn up without an appointment.","exampleVi":"Thành viên chỉ cần đến mà không cần hẹn trước."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 1-10</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Complete the notes below.</p>\n<p><em>Write&nbsp;<strong>ONE WORD ONLY</strong>&nbsp;for each answer.</em></p>\n<table>\n<tbody>\n<tr>\n<td width=\"623\">\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>PUBLIC LIBRARY</strong></strong></p>\n</td>\n</tr>\n<tr>\n<td width=\"623\"><em>Example</em><p></p>\n<p>The library re-opened last ……<em>month</em>…….</p></td>\n</tr>\n<tr>\n<td width=\"623\"><strong>The library now has</strong><p></p>\n<ul>\n<li>a seating area with magazines</li>\n<li>an expanded section for books on <span class=\"question-item\"><strong class=\"q-number\">1</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"1\" oninput=\"setQ(1,this.value)\"></span></li>\n<li>a new section on local <span class=\"question-item\"><strong class=\"q-number\">2</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"2\" oninput=\"setQ(2,this.value)\"></span></li>\n<li>a community room for meetings (also possible to <span class=\"question-item\"><strong class=\"q-number\">3</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"3\" oninput=\"setQ(3,this.value)\"></span> there)</li>\n<li>a new section of books for <span class=\"question-item\"><strong class=\"q-number\">4</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"4\" oninput=\"setQ(4,this.value)\"></span></li>\n</ul>\n<p><strong>For younger children</strong></p>\n<ul>\n<li>the next Science Club meeting: experiments using things from your <span class=\"question-item\"><strong class=\"q-number\">5</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"5\" oninput=\"setQ(5,this.value)\"></span></li>\n<li>Reading Challenge: read six books during the holidays</li>\n</ul>\n<p><strong>For adults</strong></p>\n<ul>\n<li>this Friday: a local author talks about a novel based on a real <span class=\"question-item\"><strong class=\"q-number\">6</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"6\" oninput=\"setQ(6,this.value)\"></span></li>\n<li>IT support is available on Tuesday – no <span class=\"question-item\"><strong class=\"q-number\">7</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"7\" oninput=\"setQ(7,this.value)\"></span> is necessary</li>\n<li>free check of blood <span class=\"question-item\"><strong class=\"q-number\">8</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"8\" oninput=\"setQ(8,this.value)\"></span> and cholesterol levels (over 60s only)</li>\n</ul>\n<p><strong>Other information</strong></p>\n<ul>\n<li>the library shop sells wall-charts, cards and <span class=\"question-item\"><strong class=\"q-number\">9</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"9\" oninput=\"setQ(9,this.value)\"></span></li>\n<li>evenings and weekends: free <span class=\"question-item\"><strong class=\"q-number\">10</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"10\" oninput=\"setQ(10,this.value)\"></span>&nbsp;is available</li>\n</ul>\n</td>\n</tr>\n</tbody>\n</table>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-15/section-1.mp3"},{"number":2,"transcript":["In this session in your training day we’re going to look at home of the more specialised holidays we offer at BC Travel. Now, the travel business is very competitive and it’s important to be aware of how the market’s changing and developing. In terms of age groups, the over-65s are an important market, and one that’s increasing steadily year on year. The fewest holidays are taken by the 31 to 42-year-olds, and that figure shows no sign of rising. The biggest market at present is still the youngest group, the 16 to 30s, but this group’s also seen the biggest drop over the last few years, whereas there’s a noticeable growth in the number of holidays taken by the 55 to 64-year-olds. As far as the 43 to 54-year-olds are concerned, bookings there are steady, but I have to say we haven’t seen the increase we expected.","One trend we’re noticing with nearly all age groups is the growing popularity of holidays in which clients do some kind of specialised activity. I’m not talking here about adventure holidays, where clients take part in high-risk activities like white water rafting just for the thrill of it. Activity holidays usually involve rather less high-risk sports, or things like art and music. They’re not necessarily cheaper than ordinary holidays, often the opposite, in fact. But they do often take place outside the main tourist centres, which gives an opportunity for clients to find out more about the local people and customs, and many say this is one of the most positive features of these holidays. Of course, they offer the chance to develop a new skill or talent, but clients often say that more than this, it’s the chance to create lasting relationships with other like-minded people that’s the main draw.","Let me give you some examples of BC Travel activity holidays. Our painting holidays take place in four different centres in France and Italy and they’re very popular with clients of all abilities from beginners onwards. We’ve got an excellent team of artists to lead the classes – some of them have been with us from the start, and five additional ones will be joining us this year so that we can offer a greater number of classes in each centre.","As far as cooking holidays are concerned, I know a lot of agents offer holidays where clients cook recipes related to one particular country, usually the one they’re staying in, but we focus on dishes from a great many different ones. Apart from that you’ll find the usual emphasis on good quality, organic ingredients – that’s more or less a given nowadays – and there are generally some meat-free recipes included.","Our photography holidays take place in a wide range of countries from Iceland to Vietnam, and clients have the opportunity to see some stunning scenery. Groups are small, no more than eight, so clients can have one-on-one tuition during the holiday, and excursions are arranged with fully-trained guides. At the end of each holiday an exhibition is held of the photographs taken so that clients can see one another’s work and receive valuable feedback from the tutor.","——————","Finally, let me tell you about our fitness holidays. In Ireland and Italy we run one-week general fitness classes for all ages and levels of fitness. Clients start the course with a consultation with a trainer, and together they draw up an individual programme. As well as improving general fitness, clients find that they end up losing much of the stress they’ve built up in their daily lives.","In Greece, we have a two-week holiday for clients who want to do something about their weight. This has all the features you’d expect, like a personalised diet programme, but one of its most popular features is that the exercise classes are all held on the beach. People say it’s far preferable to being in a gym.","Finally, we offer several holidays in Morocco. One very popular one is the mountain biking holiday. Bikes are provided and there are different routes according to people’s ability. We offer one which is tailored to the needs of families, which is particularly popular.","OK, so that’s about all the time I have today, so thank you very much …"],"cloze":"<p>In this session in your training day we’re going to look at home of the <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> we offer at BC Travel. Now, the <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> and it’s important to be aware of how the market’s changing and developing. In terms of age groups, the <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>, and one that’s <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>. The fewest holidays are taken by the <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span>, and that figure shows no sign of rising. The biggest market at present is still the youngest group, the 16 to 30s, but this group’s also seen the <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span>, whereas there’s a <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span> taken by the 55 to 64-year-olds. As far as the 43 to 54-year-olds are concerned, bookings there are steady, but I have to say we haven’t seen the increase we expected.</p><p>One trend we’re noticing with nearly all age groups is the <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span> in which clients do some kind of specialised activity. I’m not talking here about adventure holidays, where clients take part in <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span> just for the thrill of it. Activity holidays usually involve rather less high-risk sports, or things like art and music. They’re not necessarily cheaper than ordinary holidays, often the opposite, in fact. But they do often take place outside the main tourist centres, which gives an opportunity for clients to <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>, and many say this is one of the most positive features of these holidays. Of course, they offer the chance to develop a new skill or talent, but clients often say that more than this, it’s the chance to <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span> that’s the main draw.</p><p>Let me give you some examples of BC Travel activity holidays. Our painting holidays take place in <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span> and they’re very popular with clients of all abilities from beginners onwards. We’ve got an <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span> to lead the classes – some of them have been with us from the start, and five additional ones will be joining us this year so that we can offer a greater number of classes in each centre.</p><p>As far as cooking holidays are concerned, I know a lot of agents offer holidays where clients cook recipes related to one particular country, usually the one they’re staying in, but we <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span>. Apart from that you’ll find the usual emphasis on good quality, <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span> – that’s more or less a given nowadays – and there are generally some meat-free recipes included.</p><p>Our photography holidays take place in a wide range of countries from Iceland to Vietnam, and clients have the opportunity to see some stunning scenery. Groups are small, <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>, so clients can have <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> during the holiday, and excursions are arranged with fully-trained guides. At the end of each holiday an exhibition is held of the photographs taken so that clients can see one another’s work and receive valuable feedback from the tutor.</p><p>——————</p><p>Finally, let me tell you about our fitness holidays. In Ireland and Italy we run one-week general fitness classes for all ages and levels of fitness. Clients start the course with a <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>, and together they draw up an individual programme. As well as improving general fitness, clients find that they end up losing much of the stress they’ve built up in their daily lives.</p><p>In Greece, we have a two-week holiday for clients who want to do something about their weight. This has all the features you’d expect, like a <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span>, but one of its most popular features is that the exercise classes are all held on the beach. People say it’s far preferable to being in a gym.</p><p>Finally, we offer several holidays in Morocco. One very popular one is the mountain biking holiday. Bikes are provided and there are different routes according to people’s ability. We offer one which is <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>, which is particularly popular.</p><p>OK, so that’s about all the time I have today, so thank you very much …</p>","clozeAnswers":["more specialised holidays","travel business is very competitive","over-65s are an important market","increasing steadily year on year","31 to 42-year-olds","biggest drop over the last few years","noticeable growth in the number of holidays","growing popularity of holidays","high-risk activities like white water rafting","find out more about the local people and customs","create lasting relationships with other like-minded people","four different centres in France and Italy","excellent team of artists","focus on dishes from a great many different ones","organic ingredients","no more than eight","one-on-one tuition","consultation with a trainer","personalised diet programme","tailored to the needs of families"],"vocab":[{"word":"steadily","ipa":"/ˈstedɪli/","pos":"Trạng từ (adv)","meaning":"đều đặn, ổn định","example":"Bookings from older travellers are rising steadily.","exampleVi":"Lượng đặt chỗ của du khách lớn tuổi tăng đều."},{"word":"noticeable growth","ipa":"/ˈnəʊtɪsəbəl ɡrəʊθ/","pos":"Cụm danh từ (n phr.)","meaning":"sự tăng trưởng rõ rệt","example":"The company reports noticeable growth in one age group.","exampleVi":"Công ty ghi nhận mức tăng rõ rệt ở một nhóm tuổi."},{"word":"like-minded","ipa":"/ˌlaɪk ˈmaɪndɪd/","pos":"Tính từ (adj)","meaning":"cùng chí hướng","example":"Activity holidays connect like-minded people.","exampleVi":"Kỳ nghỉ hoạt động kết nối những người cùng chí hướng."},{"word":"organic ingredient","ipa":"/ɔːˈɡænɪk ɪnˈɡriːdiənt/","pos":"Cụm danh từ (n phr.)","meaning":"nguyên liệu hữu cơ","example":"The cooking classes use organic ingredients.","exampleVi":"Các lớp nấu ăn sử dụng nguyên liệu hữu cơ."},{"word":"one-on-one tuition","ipa":"/ˌwʌn ən ˈwʌn tjuˈɪʃən/","pos":"Cụm danh từ (n phr.)","meaning":"hướng dẫn một kèm một","example":"Small groups allow one-on-one tuition.","exampleVi":"Nhóm nhỏ cho phép hướng dẫn một kèm một."},{"word":"tailored to","ipa":"/ˈteɪləd tuː/","pos":"Cụm tính từ (adj phr.)","meaning":"được điều chỉnh phù hợp với","example":"The cycling route is tailored to families.","exampleVi":"Tuyến đạp xe được điều chỉnh phù hợp với gia đình."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 11-12</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p><em>Choose&nbsp;<strong>TWO</strong>&nbsp;letters,&nbsp;<strong>A-E</strong>.</em></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">11</strong> <strong class=\"q-number\">12</strong> <span>Which&nbsp;<strong>TWO</strong>&nbsp;age groups are taking increasing numbers of holidays with BC Travel?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input data-limit=\"2\" type=\"checkbox\" value=\"A\" data-group=\"11-12\" onchange=\"setGroup('11-12',this.value,this,2)\"><span>16-30 years</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input data-limit=\"2\" type=\"checkbox\" value=\"B\" data-group=\"11-12\" onchange=\"setGroup('11-12',this.value,this,2)\"><span>31-42 years</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input data-limit=\"2\" type=\"checkbox\" value=\"C\" data-group=\"11-12\" onchange=\"setGroup('11-12',this.value,this,2)\"><span>43-54 years</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">D</label><input data-limit=\"2\" type=\"checkbox\" value=\"D\" data-group=\"11-12\" onchange=\"setGroup('11-12',this.value,this,2)\"><span>55-64 years</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">E</label><input data-limit=\"2\" type=\"checkbox\" value=\"E\" data-group=\"11-12\" onchange=\"setGroup('11-12',this.value,this,2)\"><span>over 65 years</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 13-14</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p><em>Choose&nbsp;<strong>TWO</strong>&nbsp;letters,&nbsp;<strong>A-E</strong>.</em></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">13</strong> <strong class=\"q-number\">14</strong> <span>Which&nbsp;<strong>TWO</strong>&nbsp;are the main reasons given for the popularity of activity holidays?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input data-limit=\"2\" type=\"checkbox\" value=\"A\" data-group=\"13-14\" onchange=\"setGroup('13-14',this.value,this,2)\"><span>Clients make new friends.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input data-limit=\"2\" type=\"checkbox\" value=\"B\" data-group=\"13-14\" onchange=\"setGroup('13-14',this.value,this,2)\"><span>Clients learn a useful skill.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input data-limit=\"2\" type=\"checkbox\" value=\"C\" data-group=\"13-14\" onchange=\"setGroup('13-14',this.value,this,2)\"><span>Clients learn about a different culture.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">D</label><input data-limit=\"2\" type=\"checkbox\" value=\"D\" data-group=\"13-14\" onchange=\"setGroup('13-14',this.value,this,2)\"><span>Clients are excited by the risk involved.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">E</label><input data-limit=\"2\" type=\"checkbox\" value=\"E\" data-group=\"13-14\" onchange=\"setGroup('13-14',this.value,this,2)\"><span>Clients find them good value for money.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 15-17</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose the correct letter,&nbsp;<strong>A</strong>,&nbsp;<strong>B</strong>&nbsp;or&nbsp;<strong>C</strong>.</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">15</strong> <span>How does BC Travel plan to expand the painting holidays?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q15\" value=\"A\" data-q=\"15\" onchange=\"setQ(15,this.value)\"><span>by adding to the number of locations</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q15\" value=\"B\" data-q=\"15\" onchange=\"setQ(15,this.value)\"><span>by increasing the range of levels</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q15\" value=\"C\" data-q=\"15\" onchange=\"setQ(15,this.value)\"><span>by employing more teachers</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">16</strong> <span>Why are BC Travel’s cooking holidays unusual?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q16\" value=\"A\" data-q=\"16\" onchange=\"setQ(16,this.value)\"><span>They only use organic foods.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q16\" value=\"B\" data-q=\"16\" onchange=\"setQ(16,this.value)\"><span>They have an international focus.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q16\" value=\"C\" data-q=\"16\" onchange=\"setQ(16,this.value)\"><span>They mainly involve vegetarian dishes.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">17</strong> <span>What does the speaker say about the photography holidays?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q17\" value=\"A\" data-q=\"17\" onchange=\"setQ(17,this.value)\"><span>Clients receive individual tuition.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q17\" value=\"B\" data-q=\"17\" onchange=\"setQ(17,this.value)\"><span>The tutors are also trained guides.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q17\" value=\"C\" data-q=\"17\" onchange=\"setQ(17,this.value)\"><span>Advice is given on selling photographs.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 18-20</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Complete the table below.</p>\n<p><em>Write&nbsp;<strong>ONE WORD ONLY</strong>&nbsp;for each answer.</em></p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Fitness Holidays</strong></strong></p>\n<table>\n<tbody>\n<tr>\n<td width=\"162\"><strong>Location</strong></td>\n<td width=\"180\"><strong>Main focus</strong></td>\n<td width=\"258\"><strong>Other comments</strong></td>\n</tr>\n<tr>\n<td width=\"162\">Ireland and Italy</td>\n<td width=\"180\">general fitness</td>\n<td width=\"258\">\n<ul>\n<li>personally designed programme</li>\n<li>also reduces <span class=\"question-item\"><strong class=\"q-number\">18</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"18\" oninput=\"setQ(18,this.value)\"></span></li>\n</ul>\n</td>\n</tr>\n<tr>\n<td width=\"162\">Greece</td>\n<td width=\"180\"><span class=\"question-item\"><strong class=\"q-number\">19</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"19\" oninput=\"setQ(19,this.value)\"></span> control</td>\n<td width=\"258\">\n<ul>\n<li>includes exercise on the beach</li>\n</ul>\n</td>\n</tr>\n<tr>\n<td width=\"162\">Morocco</td>\n<td width=\"180\">Mountain biking</td>\n<td width=\"258\">\n<ul>\n<li>wide variety of levels</li>\n<li>one holiday that is specially designed for <span class=\"question-item\"><strong class=\"q-number\">20</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"20\" oninput=\"setQ(20,this.value)\"></span></li>\n</ul>\n</td>\n</tr>\n</tbody>\n</table>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-15/section-2.mp3"},{"number":3,"transcript":["NATALIE: Dave, I’m worried about our case study. I’ve done a bit of reading, but I’m not sure what’s involved in actually writing a case study – I missed the lecture where Dr Baker talked us through it.","DAVE: OK, well it’s quite straightforward. We’ve got our focus – that’s tourism at the Horton Castle site. And you said you’d done some reading about it.","NATALIE: Yes, I found some articles and made notes of the main points.","DAVE: Did you remember to keep a record of where you got the information from?","NATALIE: Sure. I know what a pain it is when you forget that.","DAVE: OK, so we can compare what we’ve read. Then we have to decide on a particular problem or need at our site. And then think about who we’re going to interview to get more information.","NATALIE: OK. So who’d that be? The people who work there? And presumable some of the tourists too?","DAVE: Yes, both those groups. So we’ll have to go to the site to do that, I suppose. But we might also do some of our interviewing away from the site – we could even contact some people here in the city, like administrators involved in overseeing tourism.","NATALIE: OK. So we’ll need to think about our interview questions and fix times and places for the meetings. It’s all going to take a lot of time.","DAVE: Mmm. And if we can, we should ask our interviewees if they can bring along some numerical data that we can add to support our findings.","NATALIE: And photographs?","DAVE: I think we have plenty of those already. But Dr Baker also said we have to establish with our interviewees whether we can identify them in our case study, or whether they want to be anonymous.","NATALIE: Oh, I wouldn’t have thought of that. OK, once we’ve got all this information, I suppose we have to analyse it.","DAVE: Yes, put it all together and choose what’s relevant to the problem we’re focusing on, and analyse that carefully to find out if we can identify any trends or regularities there. That’s the main thing at this stage, rather can concentrating on details or lots of facts.","NATALIE: OK. And then once we’ve analysed that, what next?","DAVE: Well, then we need to think about what we do with the data we’ve selected to make it as clear as possible to our readers. Things like graphs, or tables, or charts.","NATALIE: Right.","DAVE: Then the case study itself is mostly quite standard; we begin by presenting the problem, and giving some background, then go through the main sections, but the thing that surprised me is that in a normal report we’d end with some suggestions to deal with the problem or need we identified, but in a case study we end up with a question or a series of questions to our readers, and they decide what ought to be done.","NATALIE: Oh, I hadn’t realised that.","————————","NATALIE: So basically, the problem we’re addressing in our case study of the Horton Castle site is why so few tourists are visiting it. And we’ll find out more from our interviews, but I did find one report on the internet that suggested that one reason might be because as far as transport goes, access is difficult.","DAVE: I read that too, but that report was actually written ten years ago, when the road there was really bad, but that’s been improved now. And I think there’s plenty of fascinating stuff there for a really good day out, but you’d never realise it from the castle website – maybe that’s the problem.","NATALIE: Yes, it’s really dry and boring.","DAVE: I read somewhere a suggestion that what the castle needs is a visitor centre. So we could have a look for some information about that on the internet. What would we need to know?","NATALIE: Well, who’d use it for a start. It’s be good to know what categories the visitors fell into too, like school parties or retired people, but I think we’d have to talk to staff to get that information.","DAVE: OK. And as we’re thinking of suggesting a visitor centre we’d also have to look at potential problems. I mean, obviously it wouldn’t be cheap to set up.","NATALIE: No, but it could be a really good investment. And as it’s on a historical site it’d need to get special planning permission, I expect. That might be hard.","DAVE: Right, especially as the only possible place for it would be at the entrance, and that’s right in front of the castle.","NATALIE: Mmm.","DAVE: But it could be a good thing for the town of Horton. At present it’s a bit of a ghost town. Once they’ve left school and got any skills or qualifications, the young people all get out as fast as they can to get jobs in the city, and the only people left are children and those who’ve retired.","NATALIE: Right. Something else we could investigate would be the potential damage that tourists might cause to the castle site, I mean their environmental impact. At present the tourists can just wander round wherever they want, but if numbers increase, there might have to be some restrictions, like sticking to marked ways. And there’d need to be guides and wardens around to make sure these were enforced.","DAVE: Yes, we could look at that too. OK, well …"],"cloze":"<p>NATALIE: Dave, I’m worried about our <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>. I’ve done a bit of reading, but I’m not sure what’s involved in actually writing a case study – I missed the lecture where Dr Baker talked us through it.</p><p>DAVE: OK, well it’s quite straightforward. We’ve got our focus – that’s <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>. And you said you’d done some reading about it.</p><p>NATALIE: Yes, I found some articles and made notes of the main points.</p><p>DAVE: Did you remember to <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>?</p><p>NATALIE: Sure. I know what a pain it is when you forget that.</p><p>DAVE: OK, so we can compare what we’ve read. Then we have to decide on a <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> at our site. And then think about who we’re going to interview to get more information.</p><p>NATALIE: OK. So who’d that be? The <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span>? And presumable <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span>?</p><p>DAVE: Yes, both those groups. So we’ll have to go to the site to do that, I suppose. But we might also do some of our interviewing away from the site – we could even contact some people here in the city, like <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span>.</p><p>NATALIE: OK. So we’ll need to think about our interview questions and fix times and places for the meetings. It’s all going to take a lot of time.</p><p>DAVE: Mmm. And if we can, we should ask our interviewees if they can bring along some <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span> that we can add to support our findings.</p><p>NATALIE: And <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span>?</p><p>DAVE: I think we have plenty of those already. But Dr Baker also said we have to establish with our interviewees whether we can identify them in our case study, or whether they <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>.</p><p>NATALIE: Oh, I wouldn’t have thought of that. OK, once we’ve got all this information, I suppose we have to analyse it.</p><p>DAVE: Yes, put it all together and choose what’s relevant to the problem we’re focusing on, and analyse that carefully to find out if we can <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span> there. That’s the main thing at this stage, rather can concentrating on details or lots of facts.</p><p>NATALIE: OK. And then once we’ve analysed that, what next?</p><p>DAVE: Well, then we need to think about what we do with the data we’ve selected to make it as clear as possible to our readers. Things like <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span>.</p><p>NATALIE: Right.</p><p>DAVE: Then the case study itself is mostly quite standard; we begin by <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span>, and giving some background, then go through the main sections, but the thing that surprised me is that in a normal report we’d end with some suggestions to deal with the problem or need we identified, but in a case study we end up with a <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span> to our readers, and they decide what ought to be done.</p><p>NATALIE: Oh, I hadn’t realised that.</p><p>————————</p><p>NATALIE: So basically, the problem we’re addressing in our case study of the Horton Castle site is why so few tourists are visiting it. And we’ll find out more from our interviews, but I did find one report on the internet that suggested that one reason might be because as far as <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span>.</p><p>DAVE: I read that too, but that report was actually written ten years ago, when the road there was really bad, but that’s been improved now. And I think there’s plenty of fascinating stuff there for a really good day out, but you’d never realise it from the <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span> – maybe that’s the problem.</p><p>NATALIE: Yes, it’s really dry and boring.</p><p>DAVE: I read somewhere a suggestion that what the castle needs is a <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span>. So we could have a look for some information about that on the internet. What would we need to know?</p><p>NATALIE: Well, who’d use it for a start. It’s be good to know what categories the visitors fell into too, like school parties or retired people, but I think we’d have to talk to staff to get that information.</p><p>DAVE: OK. And as we’re thinking of suggesting a visitor centre we’d also have to look at potential problems. I mean, obviously it wouldn’t be cheap to set up.</p><p>NATALIE: No, but it could be a really good investment. And as it’s on a historical site it’d need to get <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>, I expect. That might be hard.</p><p>DAVE: Right, especially as the only possible place for it would be at the entrance, and that’s right in front of the castle.</p><p>NATALIE: Mmm.</p><p>DAVE: But it could be a good thing for the town of Horton. At present it’s a bit of a <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span>. Once they’ve left school and got any skills or qualifications, the young people all get out as fast as they can to get jobs in the city, and the only people left are children and those who’ve retired.</p><p>NATALIE: Right. Something else we could investigate would be the potential damage that tourists might cause to the castle site, I mean their environmental impact. At present the tourists can just wander round wherever they want, but if numbers increase, there might have to be some restrictions, like <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>. And there’d need to be guides and wardens around to make sure these were enforced.</p><p>DAVE: Yes, we could look at that too. OK, well …</p>","clozeAnswers":["case study","tourism at the Horton Castle site","keep a record of where you got the information from","particular problem or need","people who work there","some of the tourists too","administrators involved in overseeing tourism","numerical data","photographs","want to be anonymous","identify any trends or regularities","graphs, or tables, or charts","presenting the problem","question or a series of questions","transport goes, access is difficult","castle website","visitor centre","special planning permission","ghost town","sticking to marked ways"],"vocab":[{"word":"case study","ipa":"/ˈkeɪs ˌstʌdi/","pos":"Cụm danh từ (n phr.)","meaning":"nghiên cứu tình huống","example":"The students are preparing a tourism case study.","exampleVi":"Các sinh viên đang chuẩn bị một nghiên cứu tình huống du lịch."},{"word":"interviewee","ipa":"/ˌɪntəvjuˈiː/","pos":"Danh từ (n)","meaning":"người được phỏng vấn","example":"Each interviewee may choose to remain anonymous.","exampleVi":"Mỗi người được phỏng vấn có thể chọn ẩn danh."},{"word":"numerical data","ipa":"/njuːˈmerɪkəl ˈdeɪtə/","pos":"Cụm danh từ (n phr.)","meaning":"dữ liệu số","example":"Numerical data can support the students’ findings.","exampleVi":"Dữ liệu số có thể hỗ trợ các phát hiện của sinh viên."},{"word":"regularity","ipa":"/ˌreɡjəˈlærəti/","pos":"Danh từ (n)","meaning":"quy luật, tính lặp lại","example":"They analyse the data for trends and regularities.","exampleVi":"Họ phân tích dữ liệu để tìm xu hướng và quy luật."},{"word":"planning permission","ipa":"/ˈplænɪŋ pəˌmɪʃən/","pos":"Cụm danh từ (n phr.)","meaning":"giấy phép quy hoạch, xây dựng","example":"A visitor centre needs special planning permission.","exampleVi":"Trung tâm du khách cần giấy phép quy hoạ                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    \n                                                                      </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 27-30</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose the correct letter,&nbsp;<strong>A</strong>,&nbsp;<strong>B</strong>&nbsp;or&nbsp;<strong>C</strong>.</p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>The Horton Castle site</strong></strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">27</strong> <span>Natalie and Dave agree one reason why so few people visit Horton Castle is that</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q27\" value=\"A\" data-q=\"27\" onchange=\"setQ(27,this.value)\"><span>the publicity is poor.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q27\" value=\"B\" data-q=\"27\" onchange=\"setQ(27,this.value)\"><span>it is difficult to get to.</span></div>                                                                 </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">29</strong> <span>What does Dave say about conditions in the town of Horton?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q29\" value=\"A\" data-q=\"29\" onchange=\"setQ(29,this.value)\"><span>There is a lot of unemployment.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q29\" value=\"B\" data-q=\"29\" onchange=\"setQ(29,this.value)\"><span>There are few people of working age.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q29\" value=\"C\" data-q=\"29\" onchange=\"setQ(29,this.value)\"><span>There are opportunities for skilled workers.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">30</strong> <span>According to Natalie, one way to prevent damage to the castle site would be to</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q30\" value=\"A\" data-q=\"30\" onchange=\"setQ(30,this.value)\"><span>insist visitors have a guide.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q30\" value=\"B\" data-q=\"30\" onchange=\"setQ(30,this.value)\"><span>make visitors keep to the paths.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q30\" value=\"C\" data-q=\"30\" onchange=\"setQ(30,this.value)\"><span>limit visitor numbers.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-15/section-3.mp3"},{"number":4,"transcript":["OK, so we’ve been looking at how man-made changes in our environment can affect wildlife. Now I’ll discuss a particular example. Let’s take a look at mercury. Mercury’s one of the 120 or so elements that make up all matter, and it has the symbol Hg. It’s a shiny, silvery substance. You may have seen it in old-fashioned thermometers, but it’s not used much for domestic purposes now because it’s highly toxic.","But the problem is that the amount of mercury in the environment’s increasing. The main reason for this is the power plants used to produce electricity. The main source of energy that most of them use is still coal, and when it’s burned it releases mercury into the atmosphere. Some of this gets deposited into lakes and rivers, and if it’s ingested by a fish it’s not excreted, it stays in the fish’s body and it enters the food chain. So it’s been known for some time that birds which eat fish may be affected, but what wasn’t known until quite recently is that those that eat insects can also be affected.","So a woman called Claire Varian-Ramos is doing some research on how this is affecting birds.","And rather than looking at how many birds are actually killed by mercury poisoning, she’s looking for more subtle sub-effects. And these may be to do with the behaviour of the birds, or with the effect of mercury on the way their brain works, so whether it leads to problems with memory, for example. And she’s particularly focusing on the effects of mercury on bird song. Now, the process of song learning happens at a particular stage in the birds’ development, and what you may not know is that a young bird seems to acquire this skill by listening to the songs produced by its father, rather than by any other bird.","And Varian-Ramos has already found in her research that if young male birds are exposed to mercury, if they eat food contaminated with mercury, then the songs they produce aren’t as complex as those produced by other birds. So quite low-level exposure to mercury is likely to have an impact on male birds in a natural situation, because it can mean that they’re less attractive to female birds, and so it can affect their chances of reproduction.","Now the way she’s carrying out this research is worth thinking about. She’s using a mixture of studies using birds kept in laboratories, and studies carried out outdoors in the wild. The lab-based studies have the advantage that you don’t get all the variables you would in a natural setting, so the experimenter has a much higher level of control, and that means they can be more confident about their results in some ways. And of course they don’t have to worry about going out and finding the birds in order to observe them.","So what are the implications here for humans? Well, because many birds are migratory, they may be transporting mercury far from contaminated sites. For example, it’s been found that ducks who’d been feeding at a contaminated site were later shot by hunters over a thousand kilometres away, and presumably eaten. But these birds likely had mercury levels high enough to warrant concern for human consumption.","In addition, going back to song learning by birds, we saw that this may be affected by mercury contamination. Well, we also know that in humans, mercury causes developmental delays in the acquisition of language, and in fact this process is very similar in the brain regions it involves and even the genes that are involved. But mercury contamination has other important implication for humans as well. It’s now known that an unborn child can be affected if the food eaten by its mother contains high levels of mercury, and these effects can be quite substantial.","In the end, it comes down to whether more value is placed on human economic wellbeing or environmental wellbeing. It’s true there are new regulations for mercury emissions from power plants, but these will need billions of dollars to implement, and increase costs for everyone. Some argue that’s too much to pay to protect wildlife. But as we’ve seen, the issues go beyond that, and I think it’s an issue we need to consider very carefully."],"cloze":"<p>OK, so we’ve been looking at how <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> can affect wildlife. Now I’ll discuss a particular example. Let’s take a look at mercury. Mercury’s one of
