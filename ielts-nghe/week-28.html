</style></head><body><section id="entryGate" class="entry-screen"><div class="entry-card"><header class="entry-head"><small>IELTS - NGHE · TUẦN 28</small><h1>Listening Test 18</h1><p>Điền thông tin học sinh trước khi vào bài.</p></header><div class="entry-body"><p class="entry-note">Họ tên và lớp sẽ được giữ lại để gửi điểm sau khi hoàn thành bài.</p><label for="entryName">Họ và tên học sinh</label><input id="entryName" type="text" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"><label for="entryClass">Lớp IELTS</label><select id="entryClass"><option value="">Chọn lớp IELTS</option><option>IELTS 40</option><option>IELTS 41</option><option>IELTS 42</option><option>IELTS 43</option><option>IELTS 44</option><option>IELTS 45</option><option>IELTS 46</option><option>IELTS 47</option><option>IELTS 48</option><option>IELTS 49</option><option>IELTS 50</option><option>IELTS 51</option><option>IELTS 52</option><option>IELTS 53</option></select><button id="enterTest" disabled>Nhập họ tên và chọn lớp để vào bài</button></div></div></section><div id="testApp" hidden><header class="hero"><small>IELTS - NGHE · TUẦN 28</small><h1>Listening Test 18</h1><p>Full Test · Sections 1–4 · 40 questions</p></header><main class="shell"><nav id="sectionTabs" class="section-tabs"></nav><nav class="stage-tabs"><button data-stage="vocab">A · Từ vựng cần lưu ý</button><button data-stage="dictation">B · Điền chính tả</button><button data-stage="ielts">C · Câu hỏi IELTS</button><button data-stage="score">D · Gửi điểm</button></nav><section id="content" class="lesson"></section></main></div><script>const DATA={"week":28,"test":18,"answers":{"1":["Bhatt"],"2":["31 March","31st March"],"3":["nursing"],"4":["2","two"],"5":["meat"],"6":["bedsit"],"7":["theatre","theater"],"8":["mature","older"],"9":["town"],"10":["shared"],"11":["trees"],"12":["Friday","Sunday","Friday to Sunday","Friday-Sunday"],"13":["farm"],"14":["C"],"15":["B"],"16":["A"],"17":["A"],"18":["I"],"19":["F"],"20":["E"],"21":["C"],"22":["B"],"23":["B"],"24":["C"],"25":["reading"],"26":["CD","CDs"],"27":["workbooks","workbook"],"28":["timetable","schedule"],"29":["alarm"],"30":["email","emails"],"31":["central"],"32":["conversation","conversations"],"33":["effectively"],"34":["risk","risks"],"35":["levels"],"36":["description","descriptions"],"37":["technical"],"38":["change"],"39":["responsibility"],"40":["flexible"]},"sections":[{"number":1,"transcript":["MAN: Good morning. Can I help you?","WOMAN: Yes. I've just been accepted on a course at the university and I'd like to try and arrange accommodation in the hall of residence.","MAN: Yes, certainly. Please sit down. What I'll do is fill in a form with you to find out a little more about your preferences and so forth.","WOMAN: Thank you.","MAN: So first of all, can I take your name?","WOMAN: It's Anu Bhatt.","MAN: Could you spell your name please?","WOMAN: Yes. A-N-U ... B-H-A double T.","MAN: Thanks, and could I ask your date of birth?","WOMAN: 31st March 1972.","MAN: Thank you. And where are you from?","WOMAN: India.","MAN: Oh right. And what will you be studying?","WOMAN: I'm doing a course in nursing.","MAN: Right, thank you. And how long would you want to stay in hall, do you think?","WOMAN: Well, it'll take three years but I'd only like to stay in hall for two. I'd like to think about living outside for the third year.","MAN: Fine. And what did you have in mind for catering? Do you want to cook for yourself or have all your meals provided, that's full board?","WOMAN: Is there something in between?","MAN: Yes. You can just have evening meal provided, which is half board.","WOMAN: That's what I'd prefer.","MAN: Yes, a lot of students opt for that. Now, with that in mind, do you have any special diet, anything we should know about?","WOMAN: Yes, I don't take red meat.","MAN: No red meat.","MAN: Now, thinking about the room itself, we have a number of options. You can have a single study bedroom or you can have a shared one. These are both what we call simple rooms. The other alternative is to opt for a single bedsit which actually has more space and better facilities. There's about £20 a week difference between them.","WOMAN: Well, actually my grant is quite generous and I think the bedsit sounds the best option.","MAN: Lovely. I'll put you down for that and we'll see what availability is like. Now can I ask some other personal details which we like to have on record?","WOMAN: Yes, of course.","MAN: I wonder if you could let us know what your interests are. This might help us get a closer match for placing you in a particular hall.","WOMAN: Ummm. Well, I love the theatre.","MAN: Right.","WOMAN: And I enjoy sports, particularly badminton.","MAN: That's worth knowing. Now, what we finish with on the form is really a list from you of what your priorities are in choosing a hall and we'll do our best to take these into account.","WOMAN: Well, the first thing is I'd prefer a hall where there are other mature students, if possible.","MAN: Yes, we do have halls which tend to cater for slightly older students.","WOMAN: Ummm and I'd prefer to be out of town.","MAN: That's actually very good for you because we tend to have more vacancies in out-of-town halls.","WOMAN: Lucky!","MAN: Yes. Anything else?","WOMAN: Well, I would like somewhere with a shared area, a TV room for example, or something like that. It's a good way to socialise.","MAN: It certainly is.","WOMAN: That's it.","MAN: Now, we just need a contact telephone number for you.","WOMAN: Sure, I'll just find it. It's double 67549.","MAN: Great, so we'll be in contact with you as soon as possible ..."],"cloze":"<p>MAN: Good morning. Can I help you?</p><p>WOMAN: Yes. I've just been <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> and I'd like to try and <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"C            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"https://engnovate.com/wp-content/uploads/2026/06/cambridge-ielts-09-academic-listening-test-2-1.mp3"},{"number":2,"transcript":["Hello, I'm delighted to welcome you to our Wildlife Club, and very pleased that you're interested in the countryside and the plants and creatures of this area. I think you'll be surprised at the variety we have here, even though we're not far from London. I'll start by telling you about some of the parks and open spaces nearby.","One very pleasant place is Halland Common. This has been public land for hundreds of years, and what you'll find interesting is that the River Ouse, which flows into the sea eighty kilometres away, has its source in the common. There's an information board about the plants and animals you can see here, and by the way, the common is accessible 24 hours a day.","Then there's Holt Island, which is noted for its great range of trees. In the past willows were grown here commercially for basket-making, and this ancient craft has recently been reintroduced. The island is only open to the public from Friday to Sunday, because it's quite small, and if there were people around every day, much of the wildlife would keep away.","From there it's just a short walk across the bridge to Longfield Country Park. Longfield has a modern replica of a farm from over two thousand years ago. Children's activities are often arranged there, like bread-making and face-painting. The park is only open during daylight hours, so bear that in mind if you decide to go there.","Longfield Park has a programme of activities throughout the year, and to give you a sample, this is what's happening in the next few days. On Monday you can learn about herbs, and how they've been used over the centuries. You'll start with a tour of our herb garden, practise the technique of using them as colour dyes for cloth, and listen to an illustrated talk about their use in cooking and medicine.","Then on Wednesday you can join local experts to discover the variety of insects and birds that appear in the evening. We keep to a small number of people in the group, so if you want to go you'll need to phone the park ranger a few days ahead. There's a small charge, which you should pay when you turn up.","I'm sure you're all keen to help with the practical task of looking after the park, so on Saturday you can join a working party. You'll have a choice of all sorts of activities, from planting hedges to picking up litter, so you'll be able to change from one to another when you feel like it. The rangers will be hard at work all day, but do come and join in, even for just a short while. One thing, though, is to make sure you're wearing something that you don't mind getting dirty or torn.","And finally I'd like to tell you about our new wildlife area, Hinchingbrooke Park, which will be opened to the public next month. This slide doesn't really indicate how big it is, but anyway, you can see the two gates into the park, and the main paths. As you can see, there's a lake in the north west of the park, with a bird hide to the west of it, at the end of a path. So it'll be a nice quiet place for watching the birds on the lake.","Fairly close to where refreshments are available, there's a dog-walking area in the southern part of the park, leading off from the path. And if you just want to sit and relax, you can go to the flower garden; that's the circular area on the map surrounded by paths.","And finally, there's a wooded area in the western section of the park, between two paths.","Okay, that's enough from me, so let's go on to …"],"cloze":"<p>Hello, I'm delighted to welcome you to our Wildlife Club, and very pleased that you're <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> and the plants and creatures of this area. I think you'll be <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>, even though we're not far from London. I'll start by telling you about some of the <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>.</p><p>One very pleasant place is Halland Common. This has been <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>, and what you'll find interesting is that the River Ouse, which flows into the sea eighty kilometres away, <span class=\"gap-wrap\"><b>5</b><input class=\"gap\ it provides a variation on the classroom routine and they see it as a pretty major component of their course, but we would like to see some improvements to the equipment, particularly the computers; there aren't enough for one each at the moment and we always have to share.","PAM: Well yes, the teachers agree that it is a very valuable resource but one thing we have noticed is that a lot of the students are using it to check their personal emails. We don't want to stop you students using it, but we think the computers should be used as a learning resource, not for emails. Some of us also think that we could benefit a lot more by relocating the Self-Access Centre to the main University library building. How do you think the students would feel about that, Jun?","JUN: Well, the library is big enough to incorporate the Self-Access Centre, but it wouldn't be like a class activity anymore. Our main worry would be not being able to go to a teacher for advice. I'm sure there would be plenty of things to do but we really need teachers to help us choose the best activities.","PAM: Well, there would still be a teacher present and he or she would guide the activities of the students, we wouldn't just leave them to get on with it.","JUN: Yes, but I think the students would be much happier keeping the existing set-up; they really like going to the Self-Access Centre with their teacher and staying together as a group to do activities. If we could just improve the resources and facilities, I think it would be fine. Is the cost going to be a problem?","PAM: It's not so much the expense that I'm worried about, and we've certainly got room to do it, but it's the problem of timetabling a teacher to be in there outside class hours. If we're going to spend a lot of money on equipment and resources, we really need to make sure that everything is looked after properly. Anyway, let's make some notes to see just what needs doing to improve the Centre.","PAM: Now, what about the computers? I                       <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the notes below.</p>\n<p>Write NO MORE THAN TWO WORDS for each answer.</p>\n<p class=\"ielts-listening-transcript-subhead\"><strong>Necessary improvements to the existing Self-Access Centre</strong></p>\n<p><b>Equipment</b></p>\n<p>Replace computers to create more space.</p>\n<p><b>Resources</b></p>\n<p>The level of the <span class=\"question-item\"><strong class=\"q-number\">25</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"25\" oninput=\"setQ(25,this.value)\"></span> materials, in particular, should be more clearly shown.</p>\n<p>Update the <span class=\"question-item\"><strong class=\"q-number\">26</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"26\" oninput=\"setQ(26,this.value)\"></span> collection.</p>\n<p>Buy some <span class=\"question-item\"><strong class=\"q-number\">27</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"27\" oninput=\"setQ(27,this.value)\"></span> and divide them up.</p>\n<p><b>Use of the room</b></p>\n<p>Speak to the teachers and organise a <span class=\"question-item\"><strong class=\"q-number\">28</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"28\" oninput=\"setQ(28,this.value)\"></span> for supervising the centre.</p>\n<p>Install an <span class=\"question-item\"><strong class=\"q-number\">29</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"29\" oninput=\"setQ(29,this.value)\"></span> .</p>\n<p>Restrict personal use of <span class=\"question-item\"><strong class=\"q-number\">30</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"30\" oninput=\"setQ(30,this.value)\"></span> on computers.</p>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"https://engnovate.com/wp-content/uploads/2026/06/cambridge-ielts-09-academic-listening-test-2-3.mp3"},{"number":4,"transcript":["Good morning everyone. Now whether you're going to university to study business or some other subject, many of you will eventually end up working for a company of some kind.","Now, when you first start working somewhere you will realise that the organisation you've joined has certain characteristics. And we often refer to these social characteristics as the culture of the organisation – this includes its unwritten ideas, beliefs, values and things like that. One well known writer has classified company cultures by identifying four major types.","The first type is called the Power Culture, and it's usually found in small organisations.","It's the type of culture that needs a central source of power to be effective, and because control is in the hands of just one or two people there aren't many rules or procedures. Another characteristic is that communication usually takes the form of conversations rather than, say, formal meetings or written memos. Now one of the benefits of this culture is that the organisation has the ability to act quickly, so it responds well to threat, or danger on the one hand, and opportunity on the other.","But on the negative side, this type of organisation doesn't always act effectively, because it depends too much on one or two people at the top, and when these people make poor decisions there's no-one else who can influence them.","And the kind of person who does well in this type of business culture is one who is happy to take risks, and for whom job security is a low priority.","The next type is known as Role Culture – that's R-O-L-E, not R-O-double L, by the way, and this type is usually found in large companies, which have lots of different levels in them. These organisations usually have separate departments that specialise in things like finance, or sales, or maintenance, or whatever. Each one is co-ordinated at the top by a small group of senior managers, and typically everyone's job is controlled by sets of rules and procedures – for example, there are specific job descriptions, rules for discipline, and so on.","What are the benefits of this kind of culture? Well firstly, because it's found in large organisations, its fixed costs, or overheads as they're known, are low in relation to its output, or what it produces. In other words it can achieve economies of scale. And secondly, it is particularly successful in business markets where technical expertise is important. On the other hand, this culture is often very slow to recognise the need for change, and even slower to react. What kind of person does this type of culture suit? Well it suits employees who value security, and who don't particularly want to have responsibility.","Moving on now to Task Cultures – this type is found in organisations that are project-oriented. You usually find it where the market for the company's product is extremely competitive, or where the products themselves have a short life-span. Usually top management delegates the projects, the people and other resources. And once these have been allocated, little day-to-day control is exercised from the top, because this would seem like 'breaking the rules'.","Now one of the major benefits of this culture is that it's flexible. But it does have some major disadvantages too. For instance, it can't produce economies of scale or great depth of expertise. People who like working in groups or teams prefer this type of culture.","And finally, the fourth category is called the Person Culture …"],"cloze":"<p>Good morning everyone. Now whether you're going to university to study business or some other subject, many of you will eventually end up working for a company of some kind.</p><p>Now, when you first start working somewhere you will realise that the organisation you've joined has certain characteristics. And we often refer to these <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> of the organisation – this includes its <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> and things like that. One well known wr ,"ipa":"/prəˈsiːdʒə/","pos":"Danh từ (n)","meaning":"quy trình","example":"Power cultures usually have few formal procedures.","exampleVi":"Văn hóa quyền lực thường có ít quy trình chính thức."},{"word":"economies of scale","ipa":"/ɪˌkɒnəmiz əv ˈskeɪl/","pos":"Cụm danh từ (n phr.)","meaning":"lợi thế kinh tế theo quy mô","example":"Large organisations can achieve economies of scale.","exampleVi":"Các tổ chức lớn có thể đạt lợi thế kinh tế theo quy mô."},{"word":"technical expertise","ipa":"/ˈteknɪkəl ˌekspɜːˈtiːz/","pos":"Cụm danh từ (n phr.)","meaning":"chuyên môn kỹ thuật","example":"Role culture succeeds when technical expertise matters.","exampleVi":"Văn hóa vai trò thành công khi chuyên môn kỹ thuật quan trọng."},{"word":"delegate","ipa":"/ˈdelɪɡeɪt/","pos":"Động từ (v)","meaning":"ủy quyền, giao việc","example":"Managers delegate projects and resources to teams.","exampleVi":"Quản lý giao dự án và nguồn lực cho các nhóm."},{"word":"flexible","ipa":"/ˈfleksəbəl/","pos":"Tính từ (adj)","meaning":"linh hoạt","example":"Task culture is flexible in competitive markets.","exampleVi":"Văn hóa nhiệm vụ linh hoạt trong thị trường cạnh tranh."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 31-40</h2>\n                                                                                <div class=\"task-copy\">\n                                            <p>Complete the notes below.</p>\n<p>Write ONE WORD ONLY for each answer.</p>\n<p class=\"ielts-listening-transcript-subhead\"><strong>Business Cultures</strong></p>\n<p><b>Power culture</b></p>\n<table>\n<tbody>\n<tr>\n<td>Characteristics of organisation</td>\n<td>\n<ul>\n<li>small</li>\n<li><span class=\"question-item\"><strong class=\"q-number\">31</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"31\" oninput=\"setQ(31,this.value)\"></span> power source</li>\n<li>few rules and procedures</li>\n<li>communication by <span class=\"question-item\"><strong class=\"q-number\">32</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"32\" oninput=\"setQ(32,this.value)\"></span></li>\n</ul>\n</td>\n</tr>\n<tr>\n<td>Advantage:</td>\n<td>\n<ul>\n<li>can act quickly</li>\n</ul>\n</td>\n</tr>\n<tr>\n<td>Disadvantage:</td>\n<td>\n<ul>\n<li>might not act <span class=\"question-item\"><strong class=\"q-number\">33</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"33\" oninput=\"setQ(33,this.value)\"></span></li>\n</ul>\n</td>\n</tr>\n<tr>\n<td>Suitable employee:</td>\n<td>\n<ul>\n<li>not afraid of <span class=\"question-item\"><strong class=\"q-number\">34</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"34\" oninput=\"setQ(34,this.value)\"></span></li>\n<li>doesn't need job security</li>\n</ul>\n</td>\n</tr>\n</tbody>\n</table>\n<p><b>Role culture</b></p>\n<table>\n<tbody>\n<tr>\n<td>Characteristics of organisation:</td>\n<td>\n<ul>\n<li>large, many <span class=\"question-item\"><strong class=\"q-number\">35</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"35\" oninput=\"setQ(35,this.value)\"></span></li>\n<li>specialised departments</li>\n<li>rules and procedure, e.g. job <span class=\"question-item\"><strong class=\"q-number\">36</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"36\" oninput=\"setQ(36,this.value)\"></span> and rules for discipline</li>\n</ul>\n</td>\n</tr>\n<tr>\n<td>Advantages:</td>\n<td>\n<ul>\n<li>economies of scale</li>\n<li>successful when <span class=\"question-item\"><strong class=\"q-number\">37</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"37\" oninput=\"setQ(37,this.value)\"></span> ability is important</li>\n</ul>\n</td>\n</tr>\n<tr>\n<td>Disadvantages:</td>\n<td>\n<ul>\n<li>slow to see when <span class=\"question-item\"><strong class=\"q-number\">38</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"38\" oninput=\"setQ(38,this.value)\"></span> is needed</li>\n<li>slow to react</li>\n</ul>\n</td>\n</tr>\n<tr>\n<td>Suitable employee:</td>\n<td>\n<ul>\n<li>values security</li>\n<li>doesn't want <span class=\"question-item\"><strong class=\"q-number\">39</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"39\" oninput=\"setQ(39,this.value)\"></span></li>\n</ul>\n</td>\n</tr>\n</tbody>\n</table>\n<p><b>Task culture</b></p>\n<table>\n<tbody>\n<tr>\n<td>Characteristics of organisation:</td>\n<td>\n<ul>\n<li>project orientated</li>\n<li>in competitive market or making product with short life</li>\n<li>a lot of delegation</li>\n</ul>\n</td>\n</tr>\n<tr>\n<td>Advantage:</td>\n<td>\n<ul>\n<li><span class=\"question-item\"><strong class=\"q-number\">40</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"40\" oninput=\"setQ(40,this.value)\"></span></li>\n</ul>\n</td>\n</tr>\n<tr>\n<td>Disadvantages:</td>\n<td>\n<ul>\n<li>no economies of scale or special expertise</li>\n</ul>\n</td>\n</tr>\n<tr>\n<td>Suitable employee:</td>\n<td>\n<ul>\n<li>likes to work in groups</li>\n</ul>\n</td>\n</tr>\n</tbody>\n</table>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"https://engnovate.com/wp-content/uploads/2026/06/cambridge-ielts-09-academic-listening-test-2-4.mp3"}],"form":{"url":"https://docs.google.com/forms/d/e/1FAIpQLSfi_gKYiTBEuV8CW68pfTJjf7MVPpMDVNMkjZWy1AjlBfigfQ/formResponse","week":"entry.1893665426","name":"entry.442430322","studentClass":"entry.55126249","d1":"entry.1101074174","i1":"entry.1320743073","d2":"entry.838708618","i2":"entry.950878529","total":"entry.219410480"}};</script><script>let si=0,stage="vocab",scoreSendPromise=null;
const storageKey=`ielts-nghe-w${DATA.week}`;
function loadState(){try{const value=JSON.parse(localStorage.getItem(storageKey)||"{}");return value&&typeof value==="object"?value:{}}catch{return {}}}
const state=loadState();
state.q||={};state.g||={};state.scores||={};state.studentName||="";state.studentClass||="";
state.submission||={status:"idle",fingerprint:"",sentAt:""};
const $=s=>document.querySelector(s);
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"").replace(/[^a-z0-9]+/g," ").trim();
const identityPart=s=>String(s??"").normalize("NFKC").trim().toLowerCase().replace(/\s+/g," ");
const identityKey=(name,studentClass)=>`${identityPart(name)}|${identityPart(studentClass)}`;
const save=()=>localStorage.setItem(storageKey,JSON.stringify(state));
const scoreKeys=()=>Array.from({length:4},(_,i)=>[`d${i+1}`,`i${i+1}`]).flat();
const scoresReady=()=>scoreKeys().every(k=>Number.isInteger(state.scores[k]));
const scoreFingerprint=()=>JSON.stringify({week:DATA.week,student:identityKey(state.studentName,state.studentClass),scores:scoreKeys().map(k=>state.scores[k])});
function resetSubmission(){state.submission={status:"idle",fingerprint:"",sentAt:""}}
function invalidateScore(key){if(Object.prototype.hasOwnProperty.call(state.scores,key))delete state.scores[key];resetSubmission()}
function setQ(q,v){state.q[q]=v;invalidateScore(`i${si+1}`);save();gate();scorePanel()}
function setGap(i,v){state.g[`${si+1}-${i}`]=v;invalidateScore(`d${si+1}`);save();gate();scorePanel()}
function setGroup(key,v,box,max){let a=state.q[key]||[];if(box.checked&&!a.includes(v)&&a.length>=max){box.checked=false;return}a=box.checked?[...new Set([...a,v])]:a.filter(x=>x!==v);state.q[key]=a;invalidateScore(`i${si+1}`);save();gate();scorePanel()}
function speak(w){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang="en-GB";speechSynthesis.speak(u)}
function section(){return DATA.sections[si]}
function range(){return [si*10+1,si*10+10]}
function questionGroups(){
  const groups=new Map();
  for(const match of section().questions.matchAll(/data-group="([\d-]+)"/g)){
    const key=match[1];if(!groups.has(key))groups.set(key,key.split("-").map(Number));
  }
  return groups;
}
function audioBox(){return `<b>● AUDIO GỐC · SECTION ${si+1}</b><audio controls preload="metadata" src="${section().audio}"></audio>`}
function complete(){
  if(stage==="dictation")return section().clozeAnswers.every((_,i)=>norm(state.g[`${si+1}-${i}`]));
  const [a,b]=range(),grouped=new Set();
  for(const [key,nums] of questionGroups()){if((state.q[key]||[]).length!==nums.length)return false;nums.forEach(q=>grouped.add(q))}
  for(let q=a;q<=b;q++){if(grouped.has(q))continue;if(!norm(state.q[q]))return false}
  return true;
}
function gate(){const b=$("#partSubmit");if(!b)return;b.disabled=!complete();b.textContent=complete()?"Nộp bài & xem kết quả":stage==="dictation"?"Điền đủ 20/20 chỗ để nộp":"Làm đủ 10/10 câu để nộp"}
function vocab(){return `<div class="vocab-grid">${section().vocab.map(v=>`<article class="vocab-card"><button class="sound" onclick='speak(${JSON.stringify(v.word)})'>◖))</button><h3>${v.word}</h3><div class="ipa">${v.ipa}</div><div class="pos">${v.pos}</div><div class="meaning">${v.meaning}</div><p class="example">${v.example}</p><div class="translation">${v.exampleVi}</div></article>`).join("")}</div>`}
function submissionMessage(){
  const fingerprint=scoreFingerprint();
  if(state.submission.status==="sent"&&state.submission.fingerprint===fingerprint)return '<div class="result">✓ Đã tự động gửi đủ điểm Sections 1–4 vào sổ lớp.</div>';
  if(state.submission.status==="sending"&&state.submission.fingerprint===fingerprint)return '<div class="result">Đang tự động ghi đủ 8 điểm thành phần…</div>';
  if(state.submission.status==="error"&&state.submission.fingerprint===fingerprint)return '<div class="result bad">Mạng đang gián đoạn. Hệ thống sẽ tự gửi lại khi kết nối ổn định.</div>';
  return '<div class="result">Đủ 8 phần. Hệ thống đang chuẩn bị tự gửi điểm…</div>';
}
function scoreView(){return `<div class="score-view"><h2>Kết quả Tuần ${DATA.week}</h2><div class="student-summary"><span>${state.studentName.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span><span>${state.studentClass}</span></div><div id="scoreGrid" class="score-grid"></div><div id="scoreStatus">${submissionMessage()}</div></div>`}
function restoreInputs(){
  document.querySelectorAll("[data-q]").forEach(el=>{const q=el.dataset.q;if(el.type==="radio")el.checked=state.q[q]===el.value;else el.value=state.q[q]||""});
  document.querySelectorAll("[data-group]").forEach(el=>el.checked=(state.q[el.dataset.group]||[]).includes(el.value));
  document.querySelectorAll("[data-gap]").forEach(el=>el.value=state.g[`${si+1}-${el.dataset.gap}`]||"");
}
function updateStageTabs(){
  document.querySelectorAll(".stage-tabs button").forEach(b=>{
    b.classList.toggle("on",b.dataset.stage===stage);
    if(b.dataset.stage==="score"){
      b.textContent="D · Kết quả";
      b.disabled=!scoresReady();b.setAttribute("aria-disabled",String(!scoresReady()));
      b.title=scoresReady()?"Xem kết quả":"Hoàn thành và chấm đủ 8 phần để xem kết quả";
    }
  });
}
function render(){
  if(stage==="score"&&!scoresReady())stage="vocab";
  document.querySelectorAll(".section-tabs button").forEach((b,i)=>b.classList.toggle("on",i===si));updateStageTabs();
  if(stage==="vocab")$("#content").innerHTML=vocab();
  if(stage==="dictation")$("#content").innerHTML=`<div class="workspace"><aside class="audio-side">${audioBox()}</aside><div class="scroll-panel transcript">${section().cloze}</div></div><button id="partSubmit" class="submit" onclick="gradeDict()"></button><div id="result"></div>`;
  if(stage==="ielts")$("#content").innerHTML=`<div class="workspace"><aside class="audio-side">${audioBox()}</aside><div class="scroll-panel">${section().questions}</div></div><button id="partSubmit" class="submit" onclick="gradeIelts()"></button><div id="result"></div>`;
  if(stage==="score")$("#content").innerHTML=scoreView();
  restoreInputs();gate();scorePanel();if(stage==="score"&&scoresReady())void ensureScoresSubmitted();
}
function finishPart(){save();scorePanel();updateStageTabs();if(scoresReady()){stage="score";render()}}
function gradeDict(){
  if(!complete())return;let ok=0;
  section().clozeAnswers.forEach((a,i)=>{const input=document.querySelector(`[data-gap="${i}"]`),good=norm(state.g[`${si+1}-${i}`])===norm(a);input.classList.toggle("good",good);input.classList.toggle("bad",!good);if(good)ok++});
  state.scores[`d${si+1}`]=ok;
  $("#result").innerHTML=`<div class="result"><b>${ok}/20</b> · Sai ${20-ok} chỗ. Đáp án đã hiện trực tiếp trên phần sai sau khi nộp.</div>`;
  section().clozeAnswers.forEach((a,i)=>{const input=document.querySelector(`[data-gap="${i}"]`);if(input.classList.contains("bad"))input.value=a});finishPart();
}
function gradeIelts(){
  if(!complete())return;const [a,b]=range();let ok=0,grouped=new Set();
  for(const [key,nums] of questionGroups()){
    const chosen=state.q[key]||[],valid=new Set(nums.flatMap(q=>DATA.answers[q]).map(norm));
    ok+=chosen.filter(x=>valid.has(norm(x))).length;nums.forEach(q=>grouped.add(q));
    document.querySelectorAll(`[data-group="${key}"]`).forEach(el=>el.closest("td,.question-item,.paper-option")?.classList.add(valid.has(norm(el.value))?"good":"bad"));
  }
  for(let q=a;q<=b;q++){
    if(grouped.has(q))continue;const valid=DATA.answers[q].map(norm),good=valid.includes(norm(state.q[q]));if(good)ok++;
    document.querySelectorAll(`[data-q="${q}"]`).forEach(el=>el.closest("td,.question-item,.paper-option")?.classList.add(good?"good":"bad"));
  }
  state.scores[`i${si+1}`]=ok;
  $("#result").innerHTML=`<div class="result"><b>${ok}/10</b> · Em làm sai ${10-ok} câu. Hãy nghe lại Section ${si+1} và đối chiếu phần vừa làm.</div>`;finishPart();
}
function scorePanel(){
  const grid=$("#scoreGrid");if(grid)grid.innerHTML=scoreKeys().map(k=>`<div class="score"><small>${k[0]==="d"?"Chính tả":"IELTS"} · Section ${k.slice(1)}</small><br><b>${Number.isInteger(state.scores[k])?state.scores[k]:"—"}/${k[0]==="d"?20:10}</b></div>`).join("");
  updateStageTabs();const status=$("#scoreStatus");if(status)status.innerHTML=submissionMessage();
}
function scorePayload(label,a,b){
  const p=new URLSearchParams();p.set(DATA.form.week,label);p.set(DATA.form.name,state.studentName.trim());p.set(DATA.form.studentClass,state.studentClass);
  p.set(DATA.form.d1,String(state.scores[`d${a}`]));p.set(DATA.form.i1,String(state.scores[`i${a}`]));p.set(DATA.form.d2,String(state.scores[`d${b}`]));p.set(DATA.form.i2,String(state.scores[`i${b}`]));
  p.set(DATA.form.total,String(state.scores[`d${a}`]+state.scores[`i${a}`]+state.scores[`d${b}`]+state.scores[`i${b}`]));return p;
}
async function ensureScoresSubmitted(){
  if(!scoresReady()||!state.studentName.trim()||!state.studentClass)return false;
  const fingerprint=scoreFingerprint();if(state.submission.status==="sent"&&state.submission.fingerprint===fingerprint)return true;if(scoreSendPromise)return scoreSendPromise;
  state.submission={status:"sending",fingerprint,sentAt:""};save();scorePanel();
  scoreSendPromise=(async()=>{
    try{
      await Promise.all([[`Tuần ${DATA.week} · Sections 1–2`,1,2],[`Tuần ${DATA.week} · Sections 3–4`,3,4]].map(([label,a,b])=>fetch(DATA.form.url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:scorePayload(label,a,b).toString()})));
      state.submission={status:"sent",fingerprint,sentAt:new Date().toISOString()};save();scorePanel();return true;
    }catch{state.submission={status:"error",fingerprint,sentAt:""};save();scorePanel();return false}
    finally{scoreSendPromise=null}
  })();return scoreSendPromise;
}
$("#sectionTabs").innerHTML=DATA.sections.map((s,i)=>`<button onclick="si=${i};stage='vocab';render()">SECTION ${s.number}<br><small>Questions ${(s.number-1)*10+1}–${s.number*10}</small></button>`).join("");
document.querySelectorAll(".stage-tabs button").forEach(b=>b.onclick=()=>{if(b.dataset.stage==="score"&&!scoresReady())return;stage=b.dataset.stage;render()});
const entryName=$("#entryName"),entryClass=$("#entryClass"),enterTest=$("#enterTest");entryName.value=state.studentName;entryClass.value=state.studentClass;
function updateEntryGate(){const ready=entryName.value.trim()&&entryClass.value;enterTest.disabled=!ready;enterTest.textContent=ready?"Vào Listening Test":"Nhập họ tên và chọn lớp để vào bài"}
function openTest(){
  const name=entryName.value.trim(),studentClass=entryClass.value;if(!name||!studentClass)return;
  const previousKey=state.studentKey||identityKey(state.studentName,state.studentClass),nextKey=identityKey(name,studentClass);
  if(previousKey&&previousKey!==nextKey){state.q={};state.g={};state.scores={};resetSubmission()}
  state.studentName=name;state.studentClass=studentClass;state.studentKey=nextKey;save();$("#entryGate").hidden=true;$("#testApp").hidden=false;render();if(scoresReady())void ensureScoresSubmitted();
}
entryName.oninput=updateEntryGate;entryClass.onchange=updateEntryGate;enterTest.onclick=openTest;entryName.onkeydown=e=>{if(e.key==="Enter"&&!enterTest.disabled)openTest()};
window.addEventListener("online",()=>{if(scoresReady())void ensureScoresSubmitted()});updateEntryGate();render();
</script></body></html>
