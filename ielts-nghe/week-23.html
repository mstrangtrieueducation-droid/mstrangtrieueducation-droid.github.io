</style></head><body><section id="entryGate" class="entry-screen"><div class="entry-card"><header class="entry-head"><small>IELTS - NGHE · TUẦN 23</small><h1>Listening Test 13</h1><p>Điền thông tin học sinh trước khi vào bài.</p></header><div class="entry-body"><p class="entry-note">Họ tên và lớp sẽ được giữ lại để gửi điểm sau khi hoàn thành bài.</p><label for="entryName">Họ và tên học sinh</label><input id="entryName" type="text" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"><label for="entryClass">Lớp IELTS</label><select id="entryClass"><option value="">Chọn lớp IELTS</option><option>IELTS 40</option><option>IELTS 41</option><option>IELTS 42</option><option>IELTS 43</option><option>IELTS 44</option><option>IELTS 45</option><option>IELTS 46</option><option>IELTS 47</option><option>IELTS 48</option><option>IELTS 49</option><option>IELTS 50</option><option>IELTS 51</option><option>IELTS 52</option><option>IELTS 53</option></select><button id="enterTest" disabled>Nhập họ tên và chọn lớp để vào bài</button></div></div></section><div id="testApp" hidden><header class="hero"><small>IELTS - NGHE · TUẦN 23</small><h1>Listening Test 13</h1><p>Full Test · Sections 1–4 · 40 questions</p></header><main class="shell"><nav id="sectionTabs" class="section-tabs"></nav><nav class="stage-tabs"><button data-stage="vocab">A · Từ vựng cần lưu ý</button><button data-stage="dictation">B · Điền chính tả</button><button data-stage="ielts">C · Câu hỏi IELTS</button><button data-stage="score">D · Kết quả</button></nav><section id="content" class="lesson"></section></main></div><script>const DATA={"week":23,"test":13,"answers":{"1":["mountains"],"2":["horse"],"3":["garden","gardens"],"4":["lunch"],"5":["map"],"6":["experience"],"7":["ratchesons","ratcheson's","ratche(t)sons"],"8":["helmet"],"9":["shops"],"10":["267"],"11":["A"],"12":["A"],"13":["C"],"14":["C"],"15":["A","E"],"16":["A","E"],"17":["F"],"18":["C"],"19":["D"],"20":["B"],"21":["B"],"22":["C"],"23":["C"],"24":["budget"],"25":["employment"],"26":["safety"],"27":["insurance"],"28":["diary"],"29":["database","data base"],"30":["museum"],"31":["damage"],"32":["side effects","side-effects"],"33":["bridge"],"34":["confusion"],"35":["smartphone","smart phone"],"36":["resources"],"37":["unnecessary","not necessary"],"38":["chocolate bar"],"39":["problem"],"40":["market share"]},"sections":[{"number":1,"transcript":["TC EMPLOYEE:   Hi. Can I help you?","VISITOR:              I’d like to find out if you have any excursions suitable for families.","TC EMPLOYEE:   Sure. How about taking your family for a cruise? We have a steamship that takes passengers out several times a day – it’s over 100 years old.","VISITOR:              That sounds interesting. How long is the trip?","TC EMPLOYEE:   About an hour and a half. And don’t forget to take pictures of the mountains. They’re all around you when you’re on the boat and they look fantastic.","VISITOR:              OK. And I assume there’s a café or something on board?","TC EMPLOYEE:   Sure. How old are your children?","VISITOR:              Er, my daughter’s fifteen and my son’s seven.","TC EMPLOYEE:   Right. Well there are various things you can do once you’ve crossed the lake, to make a day of it. One thing that’s very popular is a visit to the Country Farm. You’re met off the boat by the farmer and he’ll take you to the holding pens, where the sheep are kept. Children love feeling them!","VISITOR:              My son would love that. He really likes animals.","TC EMPLOYEE:   Well, there’s also a 40-minute trek round the farm on a house, if he wants.","VISITOR:              Do you think he’d manage it? He hasn’t done that before.","TC EMPLOYEE:   Sure. It’s suitable for complete beginners.","VISITOR:              Ah, good.","TC EMPLOYEE:   And again, visitors are welcome to explore the farm on their own, as long as they take care to close gates and so on. There are some very beautiful gardens along the side of the lake which also belong to the farm – they’ll be just at their best now. You could easily spend an hour or two there.","VISITOR:              OK. Well that all sounds good. And can we get lunch there?","TC EMPLOYEE:   You can, and it’s very good, though it’s not included in the basic cost. You pay when you get there.","VISITOR:              Right.","————————","VISITOR:              So is there anything else to do over on that side of the lake?","TC EMPLOYEE:   Well, what you can do is take a bike over on the ship and then go on a cycling trip. There’s a trail there called the Back Road – you could easily spend three or four hours exploring it, and the scenery’s wonderful. They’ll give you a map when you get your ticket for the cruise – there’s no extra charge.","VISITOR:              What’s the trail like in terms of difficulty?","TC EMPLOYEE:   Quite challenging in places. It wouldn’t be suitable for your seven-year-old. It needs someone who’s got a bit more experience.","VISITOR:              Hmm. Well, my daughter loves cycling and so do I, so maybe the two of us could go, and my wife and son could stay on the farm. That might work out quite well. But we don’t have bikes here… is there somewhere we could rent them?","TC EMPLOYEE:   Yes, there’s a place here in the city. It’s called Ratchesons.","VISITOR:              I’ll just make a note of that – er, how do you spell it?","TC EMPLOYEE:   R-A-T-C-H-E-S-O-N-S. It’s just be the cruise ship terminal.","VISITOR:              OK.","TC EMPLOYEE:   You’d also need to pick up a repair kit for the bike from there to take along with you, and you’d need to take along a snack and some water – it’d be best to get those in the city.","VISITOR:              Fine. That shouldn’t be a problem. And I assume I can rent a helmet from the bike place?","TC EMPLOYEE:   Sure, you should definitely get that. It’s a great ride, but you want to be well prepared because it’s very remote – you won’t see any shops round there, or anywhere to stay, so you need to get back ass=\"question-item\"><strong class=\"q-number\">1</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"1\" oninput=\"setQ(1,this.value)\"></span>&nbsp;that surround the lake</li>\n</ul>\n<p><strong>Farm</strong>&nbsp;<strong>visit</strong></p>\n<ul>\n<li>Children can help feed the sheep</li>\n<li>Visit can include a 40-minute ride on a <span class=\"question-item\"><strong class=\"q-number\">2</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"2\" oninput=\"setQ(2,this.value)\"></span></li>\n<li>Visitors can walk in the farm’s <span class=\"question-item\"><strong class=\"q-number\">3</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"3\" oninput=\"setQ(3,this.value)\"></span> by the lake</li>\n<li><span class=\"question-item\"><strong class=\"q-number\">4</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"4\" oninput=\"setQ(4,this.value)\"></span>&nbsp;is available at extra cost</li>\n</ul>\n<p><strong>Cycling</strong>&nbsp;<strong>trips</strong></p>\n<ul>\n<li>Cyclists explore the Back Road</li>\n<li>A <span class=\"question-item\"><strong class=\"q-number\">5</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"5\" oninput=\"setQ(5,this.value)\"></span>&nbsp;is provided</li>\n<li>Only suitable for cyclists who have some <span class=\"question-item\"><strong class=\"q-number\">6</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"6\" oninput=\"setQ(6,this.value)\"></span></li>\n</ul>\n<p>–&nbsp; Bikes can be hired from <span class=\"question-item\"><strong class=\"q-number\">7</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"7\" oninput=\"setQ(7,this.value)\"></span>&nbsp;(near the Cruise Ship Terminal)</p>\n<ul>\n<li>Cyclists need:</li>\n</ul>\n<p>–&nbsp; a repair kit</p>\n<p>–&nbsp; food and drink</p>\n<p>–&nbsp; a <span class=\"question-item\"><strong class=\"q-number\">8</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"8\" oninput=\"setQ(8,this.value)\"></span>&nbsp;(can be hired)</p>\n<ul>\n<li>There are no <span class=\"question-item\"><strong class=\"q-number\">9</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"9\" oninput=\"setQ(9,this.value)\"></span>&nbsp;or accommodation in the area</li>\n</ul>\n<p><strong>Cost</strong></p>\n<ul>\n<li>Total cost for whole family of cruise and farm visit: $<span class=\"question-item\"><strong class=\"q-number\">10</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"10\" oninput=\"setQ(10,this.value)\"></span></li>\n</ul>\n</td>\n</tr>\n</tbody>\n</table>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"https://engnovate.com/wp-content/uploads/2023/07/cambridge-ielts-12-academic-listening-1-audio-1.mp3"},{"number":2,"transcript":["Good morning everyone. My name’s Joy Parkins and I’m the restaurant manager. And I understand that none of you’ve had any previous experience as kitchen assistants? Well, you might be feeling a bit nervous now, but most of our kitchen assistants say they enjoy the work. OK, they might get shouted at sometimes, but it’s nothing personal, and they’re pleased that they have so many different things to do, which means they never get bored. And I’ll tell you straightaway that if you do well, we might think about moving you up and giving you some more responsibility.","Right, well, you’ve all shown up on time, which is an excellent start. Now I’m glad to see none of you have unsuitable footwear, so that’s good – you need to be careful as the floors can get very wet and slippery. Those of you with long hair have got it well out of the way, but some of you’ll need to remove your rings and bracelets – just put them somewhere safe for today, and remember to leave them at home tomorrow, as they can be a safety hazard.","Now it’s going to be a busy day for you all today – we don’t have any tables free for this evening, and only a few for lunch. Fortunately we’ve got our Head Chef back – he was away on holiday all last week which meant the other chefs had extra work. Now, I’ll tell you a bit more about the job in a minute but first, some general regulations. For all of you, whatever your age, there’s some equipment you mustn’t use until you’ve been properly trained, like the waste disposal system for example, for health and safety reasons. Then I think there are two of you here who are under 18 – that’s Emma and Jake, isn’t it? Right, so for you two, the meat slicer is out of bounds. And of course none of you are allowed to use the electric mixer until you’ve been shown how it works.","Now you may have heard that this can be a stressful job, and I have to say that can be true. You’ll be working an eight-hour day for the first week, though you’ll have the chance to do overtime after that as well if you want to. But however long the hours are, you’ll get a break in the middle. What you will find is that you’re on your feet all day long, lifting and carrying, so if you’re not fit now you soon will be! You’ll find you don’t have much chance to take it easy – when someone tells you to do something you need to do it straightaway – but at least we do have a very efficient air conditioning system compared with some kitchens.","——————","Now let me tell you about some of the people you need to know. So as I said, I’m Joy Parkins and I decide who does what during the day and how long they work for. I’ll be trying to get you to work with as many different people in the kitchen as possible, so that you learn while you’re on the job. One person whose name you must remember is David Field. If you injure yourself at all, even if it’s really minor, you must report to him and he’ll make sure the incident is recorded and you get the appropriate treatment. He’s trained to give basic treatment to staff himself, or he’ll send you off somewhere else if necessary. Then there’s Dexter Wills – he’s the person you need to see if you smash a plate or something like that. Don’t just leave it and hope no one will notice – it’s really important to get things noted and replaced or there could be problems late. And finally, there’s Mike Smith. He’s the member of staff who takes care of all the stores of perishables, so if you notice we’re getting low in flour or sugar or something, make sure you let him know so he can put in an order.","OK, now the next thing …"],"cloze":"<p>Good morning everyone. My name’s Joy Parkins and I’m the restaurant manager. And I understand that none of you’ve had any <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> as kitchen assistants? Well, you might be feeling a bit nervous now, but most of our kitchen assistants say they enjoy the work. OK, they might get shouted at sometimes, but it’s nothing personal, and they’re pleased that they have so many <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>, which means they never get bored. And I’ll tell you straightaway that if you do well, we might think about moving you up and giving you some more responsibility.</p><p>Right, well, you’ve all <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>, which is an excellent start. Now I’m glad to see none of you have unsuitable footwear, so that’s good – you need to be careful as the floors can get very <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>. Those of you with long hair have got it well out of the way, but some of you’ll need to remove your <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> – just put them somewhere safe for today, and remember to leave them at home tomorrow, as they can be <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span>.</p><p>Now it’s going to be a busy day for you all today – we don’t have any tables free for this evening, and <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span>. Fortunately we’ve got our Head Chef back – he was away on holiday all last week which meant the other chefs had extra work. Now, I’ll tell you a bit more about the job in a minute but first, some <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>. For all of you, whatever your age, there’s some equipment you mustn’t use until you’ve been properly trained, like the <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span> for example, for <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>. Then I think there are two of you here who are under 18 – that’s Emma and Jake, isn’t it? Right, so for you two, the <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span> is out of bounds. And of course none of you are allowed to use the <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span> until you’ve been shown how it works.</p><p>Now you may have heard that this can be a stressful job, and I have to say that can be true. You’ll be working <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span> for the first week, though you’ll have the <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span> after that as well if you want to. But however long the hours are, you’ll get a break in the middle. What you will find is that you’re <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span>, lifting and carrying, so if you’re not fit now you soon will be! You’ll find you don’t have much chance to take it easy – when someone tells you to do something you need to <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span> – but at least we do have a very efficient air conditioning system compared with some kitchens.</p><p>——————</p><p>Now let me tell you about some of the people you need to know. So as I said, I’m Joy Parkins and I decide who does what during the day and how long they work for. I’ll be trying to get you to work with as many different people in the kitchen as possible, so that you learn while you’re on the job. One person whose name you must remember is David Field. If you injure yourself at all, even if it’s really minor, you must report to him and he’ll make sure the <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span> and you get the appropriate treatment. He’s trained to give <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> to staff himself, or he’ll send you off somewhere else if necessary. Then there’s Dexter Wills – he’s the person you need to see if you <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> or something like that. Don’t just leave it and hope no one will notice – it’s really important to get things noted and replaced or there could be problems late. And finally, there’s Mike Smith. He’s the member of staff who takes care of all the <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>, so if you notice we’re getting low in flour or sugar or something, make sure you let him know so he can put in an order.</p><p>OK, now the next thing …</p>","clozeAnswers":["previous experience","different things to do","shown up on time","wet and slippery","rings and bracelets","a safety hazard","only a few for lunch","general regulations","waste disposal system","health and safety reasons","meat slicer","electric mixer","an eight-hour day","chance to do overtime","on your feet all day long","do it straightaway","basic treatment","incident is recorded","smash a plate","stores of perishables"],"vocab":[{"word":"kitchen assistant","ipa":"/ˈkɪtʃɪn əˌsɪstənt/","meaning":"phụ bếp","example":"New kitchen assistants receive safety training.","exampleVi":"Các phụ bếp mới được đào tạo an toàn.","pos":"Cụm danh từ (n phr.)"},{"word":"slippery","ipa":"/ˈslɪpəri/","meaning":"trơn trượt","example":"Wet kitchen floors can become slippery.","exampleVi":"Sàn bếp ướt có thể trở nên trơn trượt.","pos":"Tính từ (adj)"},{"word":"safety hazard","ipa":"/ˈseɪfti ˌhæzəd/","meaning":"mối nguy an toàn","example":"Loose jewellery can be a safety hazard.","exampleVi":"Trang sức lỏng có thể là một mối nguy an toàn.","pos":"Cụm danh từ (n phr.)"},{"word":"out of bounds","ipa":"/ˌaʊt əv ˈbaʊndz/","meaning":"không được phép sử dụng hoặc đi vào","example":"The meat slicer is out of bounds for minors.","exampleVi":"Máy thái thịt không được phép dùng đối với người chưa thành niên.","pos":"Cụm tính từ (adj phr.)"},{"word":"first aid","ipa":"/ˌfɜːst ˈeɪd/","meaning":"sơ cứu","example":"Report injuries to the trained first-aid officer.","exampleVi":"Hãy báo thương tích cho nhân viên sơ cứu đã qua đào tạo.","pos":"Cụm danh từ (n phr.)"},{"word":"perishable","ipa":"/ˈperɪʃəbəl/","meaning":"hàng dễ hỏng","example":"The storekeeper monitors all perishable supplies.","exampleVi":"Thủ kho theo dõi toàn bộ nguồn cung dễ hỏng.","pos":"Tính từ (adj)"}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 11-14</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose the correct letter,&nbsp;<strong>A</strong>,&nbsp;<strong>B</strong>&nbsp;or&nbsp;<strong>C</strong>.</p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Talk to new kitchen assistants</strong></strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                  <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q12\" value=\"A\" data-q=\"12\" onchange=\"setQ(12,this.value)\"><span>jewellery.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q12\" value=\"B\" data-q=\"12\" onchange=\"setQ(12,this.value)\"><span>hair styles.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q12\" value=\"C\" data-q=\"12\" onchange=\"setQ(12,this.value)\"><span>shoes.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">13</strong> <span>The manager says that the day is likely to be busy for kitchen staff because</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q13\" value=\"A\" data-q=\"13\" onchange=\"setQ(13,this.value)\"><span>it is a public holiday.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q13\" value=\"B\" data-q=\"13\" onchange=\"setQ(13,this.value)\"><span>the head chef is absent.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q13\" value=\"C\" data-q=\"13\" onchange=\"setQ(13,this.value)\"><span>the restaurant is almost fully booked.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">14</strong> <span>Only kitchen staff who are 18 or older are allowed to use</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q14\" value=\"A\" data-q=\"14\" onchange=\"setQ(14,this.value)\"><span>the waste disposal unit.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q14\" value=\"B\" data-q=\"14\" onchange=\"setQ(14,this.value)\"><span>the electric mixer.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q14\" value=\"C\" data-q=\"14\" onchange=\"setQ(14,this.value)\"><span>the meat slicer.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 15-16</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p><em>Choose&nbsp;<strong>TWO</strong>&nbsp;letters,&nbsp;<strong>A-E</strong>.</em></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">15</strong> <strong class=\"q-number\">16</strong> <span>According to the manager, which&nbsp;<strong>TWO</strong>&nbsp;things can make the job of kitchen assistant stressful?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input data-limit=\"2\" type=\"checkbox\" value=\"A\" data-group=\"15-16\" onchange=\"setGroup('15-16',this.value,this,2)\"><span>They have to follow orders immediately.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input data-limit=\"2\" type=\"checkbox\" value=\"B\" data-group=\"15-16\" onchange=\"setGroup('15-16',this.value,this,2)\"><span>The kitchen gets very hot.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input data-limit=\"2\" type=\"checkbox\" value=\"C\" data-group=\"15-16\" onchange=\"setGroup('15-16',this.value,this,2)\"><span>They may not be able to take a break.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">D</label><input data-limit=\"2\" type=\"checkbox\" value=\"D\" data-group=\"15-16\" onchange=\"setGroup('15-16',this.value,this,2)\"><span>They have to do overtime.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">E</label><input data-limit=\"2\" type=\"checkbox\" value=\"E\" data-group=\"15-16\" onchange=\"setGroup('15-16',this.value,this,2)\"><span>The work is physically demanding.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 17-20</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>What is the responsibility of each of the following restaurant staff?</p>\n<p><em>Choose&nbsp;<strong>FOUR</strong>&nbsp;answers from the box and write the correct letter,&nbsp;<strong>A-F</strong>, next to Questions</em></p>\n<p><strong>Responsibilities</strong></p>\n<p><strong>Restaurant staff</strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                                <div class=\"matching-dnd-questions\"><div class=\"question-item\"> • <span>Joy Parkins</span><span class=\"inline-choice\"><strong class=\"q-number\">17</strong><select data-q=\"17\" onchange=\"setQ(17,this.value)\" aria-label=\"Question 17\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class=\"question-item\"> • <span>David Field</span><span class=\"inline-choice\"><strong class=\"q-number\">18</strong><select data-q=\"18\" onchange=\"setQ(18,this.value)\" aria-label=\"Question 18\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class=\"question-item\"> • <span>Dexter Wills</span><span class=\"inline-choice\"><strong class=\"q-number\">19</strong><select data-q=\"19\" onchange=\"setQ(19,this.value)\" aria-label=\"Question 19\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class=\"question-item\"> • <span>Mike Smith</span><span class=\"inline-choice\"><strong class=\"q-number\">20</strong><select data-q=\"20\" onchange=\"setQ(20,this.value)\" aria-label=\"Question 20\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option></select></span></div></div>                                                                        <div class=\"option-bank\"><div><b>A</b> training courses</div><div><b>B</b> food stocks</div><div><b>C</b> first aid</div><div><b>D</b> breakages</div><div><b>E</b> staff discounts</div><div><b>F</b> timetables</div></div>\n                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>\n                                        </div>","audio":"https://engnovate.com/wp-content/uploads/2023/07/cambridge-ielts-12-academic-listening-1-audio-2.mp3"},{"number":3,"transcript":["TRUDIE:               OK, Stewart. We need to start planning our paper on public libraries. Have you thought of an angle yet?","STEWART:           Well, there’s so much we could look into. How libraries have changed over the centuries, for instance, or how different countries organise them. What do you think, Trudie?","TRUDIE:               Maybe we should concentrate on this country, and try relate the changes in libraries to external developments, like the fact that far more people can read than a century ago, and that the local population may speak lots of different languages.","STEWART:           We could include something about changes in the source of funding, too.","TRUDIE:               Yes, but remember we’re only supposed to write a short paper, so it’s probably best if we don’t go into funding in any detail.","STEWART:           Right. Well, shall we just brainstorm a few ideas, to get started?","TRUDIE:               OK. We obviously need to look at the impact of new technology, particularly the internet. Now that lots of books have been digitalised, people can access them from their own computers at home.","STEWART:           And if everyone did that, libraries would be obsolete.","TRUDIE:               Yes.","STEWART:           But the digitalised books that are available online for free are mostly out of copyright, aren’t they? And copyright in this country lasts for 70 years after the author dies. So you won’t find the latest best-seller or up-to-date information.","TRUDIE:               That’s an important point. Anyway, I find it hard to concentrate when I’m reading a long text on a green. I’d much rather read a physical book. And it takes longer to read on a screen.","STEWART:           Oh, I prefer it. I suppose it’s just a personal preference.","TRUDIE:               Mm. I expect that libraries will go on evolving in the next few years. Some have already become centres where community activities take place, like local clubs meeting there. I think that’ll become even more common.","STEWART:           I’d like to think so, and that they’ll still be serving their traditional function, but I’m not so sure. There are financial implications, after all. What I’m afraid will happen is that books and magazines will all disappear, and there’ll just be rows and rows of computers. They won’t look anything like the libraries we’re used to.","TRUDIE:               Well, we’ll see.","———————","TRUDIE:               I’ve just had an idea. Why don’t we make an in-depth study of our local public library as background to our paper?","STEWART:           Yes, that’d be interesting, and raise all sorts of issues. Let’s make a list of possible things we could ask about, then work out some sort of structure. For instance, um, we could interview some of the staff, and find out whether the library has its own budget, or if that’s controlled by the local council.","TRUDIE:               And what their policies are. I know they don’t allow food, but I’d love to find out what types of noise they ban – there always seems to be a lot of talking, but never music. I don’t know if that’s a policy or it just happens.","STEWART:           Ah, I’ve often wondered. Then there are things like how the library is affected by employment laws. I suppose there are rules about working hours, facilities for staff, and so on.","TRUDIE:               Right. Then there are other issues relating to the design of the building and how customers use it. Like what measures does the library take to ensure their safety? They’d need floor coverings that aren’t slippery, and emergency exits, for instance. Oh, and another thing – there’s the question of the kind of insurance the library needs to have, in case anyone gets injured.","STEWART:           Yes, that’s something else to find out. You know something I’ve often wondered?","TRUDIE:               What’s that?","STEWART:           Well, you know they’ve got an archive of local newspapers going back years? Well, next to it they’ve got the diary of a well-known politician from the late 19th century. I wonder why it’s there. Do you know what his connection was with this area?","TRUDIE:               No idea. Let’s add it to our list of things to find out. Oh, I’ve just thought – you know people might ask in the library about local organisations, like sports clubs? Well, I wonder if they keep a database, or whether they just look online.","STEWART:           Right. I quite fancy finding out what the differences are between a library that’s open to the public and one that’s part of a museum, for example – they must be very different.","TRUDIE:               Mmm. Then something else I’d like to know is …"],"cloze":"<p>TRUDIE:               OK, Stewart. We need to start planning our <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>. Have you thought of an angle yet?</p><p>STEWART:           Well, there’s so much we could look into. How libraries have changed over the centuries, for instance, or how different countries organise them. What do you think, Trudie?</p><p>TRUDIE:               Maybe we should concentrate on this country, and try relate the changes in libraries to <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>, like the fact that far more people can read than a century ago, and that the local population may speak lots of different languages.</p><p>STEWART:           We could include something about changes in the <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>, too.</p><p>TRUDIE:               Yes, but remember we’re only supposed to write a <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>, so it’s probably best if we don’t go into funding in any detail.</p><p>STEWART:           Right. Well, shall we just brainstorm a few ideas, to get started?</p><p>TRUDIE:               OK. We obviously need to look at the <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span>, particularly the internet. Now that lots of books have been digitalised, people can <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span> at home.</p><p>STEWART:           And if everyone did that, libraries would be obsolete.</p><p>TRUDIE:               Yes.</p><p>STEWART:           But the digitalised books that are available online for free are mostly <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span>, aren’t they? And copyright in this country lasts for 70 years after the author dies. So you won’t find the latest best-seller or up-to-date information.</p><p>TRUDIE:               That’s an important point. Anyway, I find it hard to concentrate when I’m reading a long text on a green. I’d much rather read a physical book. And it takes longer to read on a screen.</p><p>STEWART:           Oh, I prefer it. I suppose it’s just a <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>.</p><p>TRUDIE:               Mm. I expect that libraries will go on evolving in the next few years. Some have already become centres where <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span> take place, like local clubs meeting there. I think that’ll become even more common.</p><p>STEWART:           I’d like to think so, and that they’ll still be serving their traditional function, but I’m not so sure. There are <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>, after all. What I’m afraid will happen is that books and magazines will all disappear, and there’ll just be <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span>. They won’t look anything like the libraries we’re used to.</p><p>TRUDIE:               Well, we’ll see.</p><p>———————</p><p>TRUDIE:               I’ve just had an idea. Why don’t we make an <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span> of our local public library as background to our paper?</p><p>STEWART:           Yes, that’d be interesting, and raise all sorts of issues. Let’s make a list of possible things we could ask about, then work out some sort of structure. For instance, um, we could interview some of the staff, and find out whether the library has <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span>, or if that’s controlled by the local council.</p><p>TRUDIE:               And what their policies are. I know they don’t allow food, but I’d love to find out <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span> – there always seems to be a lot of talking, but never music. I don’t know if that’s a policy or it just happens.</p><p>STEWART:           Ah, I’ve often wondered. Then there are things like how the library is affected by <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span>. I suppose there are rules about working hours, <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>, and so on.</p><p>TRUDIE:               Right. Then there are other issues relating to the design of the building and how customers use it. Like what measures does the library take to <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span>? They’d need floor coverings that aren’t slippery, and emergency exits, for instance. Oh, and another thing – there’s the question of the <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span> the library needs to have, in case anyone gets injured.</p><p>STEWART:           Yes, that’s something else to find out. You know something I’ve often wondered?</p><p>TRUDIE:               What’s that?</p><p>STEWART:           Well, you know they’ve got an <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> going back years? Well, next to it they’ve got the diary of a well-known politician from the late 19th century. I wonder why it’s there. Do you know what his connection was with this area?</p><p>TRUDIE:               No idea. Let’s add it to our list of things to find out. Oh, I’ve just thought – you know people might ask in the library about local organisations, like sports clubs? Well, I wonder if they <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>, or whether they just look online.</p><p>STEWART:           Right. I quite fancy finding out what the differences are between a library that’s open to the public and one that’s part of a museum, for example – they must be very different.</p><p>TRUDIE:               Mmm. Then something else I’d like to know is …</p>","clozeAnswers":["paper on public libraries","external developments","source of funding","short paper","impact of new technology","access them from their own computers","out of copyright","personal preference","community activities","financial implications","rows and rows of computers","in-depth study","its own budget","what types of noise they ban","employment laws","facilities for staff","ensure their safety","kind of insurance","archive of local newspapers","keep a database"],"vocab":[{"word":"angle","ipa":"/ˈæŋɡəl/","meaning":"góc tiếp cận một chủ đề","example":"The students need an angle for their paper.","exampleVi":"Các sinh viên cần một góc tiếp cận cho bài viết.","pos":"Danh từ (n)"},{"word":"external development","ipa":"/ɪkˌstɜːnəl dɪˈveləpmənt/","meaning":"biến đổi bên ngoài","example":"Libraries respond to external developments in society.","exampleVi":"Thư viện phản ứng với các biến đổi bên ngoài xã hội.","pos":"Cụm danh từ (n phr.)"},{"word":"obsolete","ipa":"/ˈɒbsəliːt/","meaning":"lỗi thời","example":"Digital access does not make libraries obsolete.","exampleVi":"Truy cập số không khiến thư viện trở nên lỗi thời.","pos":"Tính từ (adj)"},{"word":"financial implication","ipa":"/faɪˌnænʃəl ˌɪmplɪˈkeɪʃən/","meaning":"hệ quả s.value)\"><span>how public library services are organised in different countries</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q21\" value=\"B\" data-q=\"21\" onchange=\"setQ(21,this.value)\"><span>how changes in society are reflected in public libraries</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q21\" value=\"C\" data-q=\"21\" onchange=\"setQ(21,this.value)\"><span>how the funding of public libraries has changed</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">22</strong> <span>They agree that one disadvantage of free digitalised books is that</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q22\" value=\"A\" data-q=\"22\" onchange=\"setQ(22,this.value)\"><span>they may take a long time to read.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q22\" value=\"B\" data-q=\"22\" onchange=\"setQ(22,this.value)\"><span>they can be difficult to read.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q22\" value=\"C\" data-q=\"22\" onchange=\"setQ(22,this.value)\"><span>they are generally old.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">23</strong> <span>Stewart expect that in the future libraries will</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q23\" value=\"A\" data-q=\"23\" onchange=\"setQ(23,this.value)\"><span>maintain their traditional function.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q23\" value=\"B\" data-q=\"23\" onchange=\"setQ(23,this.value)\"><span>become centres for local communities.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q23\" value=\"C\" data-q=\"23\" onchange=\"setQ(23,this.value)\"><span>no longer contain any books.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 24-30</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the notes below.</p>\n<p>Write&nbsp;<strong>ONE WORD ONLY</strong>&nbsp;for each answer.</p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Study of local library: possible questions</strong></strong></p>\n<ul>\n<li>whether it has a <span class=\"question-item\"><strong class=\"q-number\">24</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"24\" oninput=\"setQ(24,this.value)\"></span>&nbsp;of its own</li>\n<li>its policy regarding noise of various kinds</li>\n<li>how it’s affected by laws regarding all aspects of <span class=\"question-item\"><strong class=\"q-number\">25</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"25\" oninput=\"setQ(25,this.value)\"></span></li>\n<li>how the design needs to take the <span class=\"question-item\"><strong class=\"q-number\">26</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"26\" oninput=\"setQ(26,this.value)\"></span>&nbsp;of customers into account</li>\n<li>what <span class=\"question-item\"><strong class=\"q-number\">27</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"27\" oninput=\"setQ(27,this.value)\"></span>&nbsp;is required in case of accidents</li>\n<li>why a famous person’s <span class=\"question-item\"><strong class=\"q-number\">28</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"28\" oninput=\"setQ(28,this.value)\"></span>&nbsp;is located in the library</li>\n<li>whether it has a <span class=\"question-item\"><strong class=\"q-number\">29</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"29\" oninput=\"setQ(29,this.value)\"></span>&nbsp;of local organisations</li>\n<li>how it’s different from a library in a <span class=\"question-item\"><strong class=\"q-number\">30</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"30\" oninput=\"setQ(30,this.value)\"></span></li>\n</ul>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"https://engnovate.com/wp-content/uploads/2023/07/cambridge-ielts-12-academic-listening-1-audio-3.mp3"},{"number":4,"transcript":["In public discussion of business, we take certain values for granted. Today I’m going to talk about four of them: collaboration, hard work, creativity and excellence. Most people would say they’re all ‘good things’. I’m going to suggest that’s an over-simple view.","The trouble with these values is that they’re theoretical concepts, removed from the reality of day-to-day business. Pursue values by all means, but be prepared for what may happen as a result. They can actually cause damage, which is not at all the intention.","Business leaders generally try to do the right thing. But all too often the right thing backfires, if those leaders adopt values without understanding and managing the side effects that arise. The values can easily get in the way of what’s actually intended.","OK. So the first value I’m going to discuss is collaboration. Er, let me give you an example. On a management training course I once attended, we were put into groups and had to construct a bridge across a stream, using building blocks that we were given. The rule was that everyone in the team had to move at least one building block during the construction. This was intended to encourage teamwork.","But it was really a job best done by one person. The other teams tried to collaborate on building the structure, and descended into confusion, with everyone getting in each other’s way. Our team leader solved the challenge brilliantly. She simply asked everyone in the team to move a piece a few centimetres, to comply with the rule, and then let the person in the team with an aptitude for puzzles like this build it alone. We finished before any other team. My point is that the task wasn’t really suited to teamworking, so why make it one?","Teamwork can also lead to inconsistency – a common cause of poor sales. In the case of a smartphone that a certain company launched, one director wanted to target the business market, and another demanded it was aimed at consumers. The company wanted both directors to be involved, so gave the product a consumer-friendly name, but marketed it to companies. The result was that it met the needs of neither group. It would have been better to let one director or the other have his way, not both.","Now industriousness, or hard work. It’s easy to mock people who say they work hard: after all, a hamster running around in a wheel is working hard – and getting nowhere. Of course hard work is valuable, but only when properly targeted. Otherwise it wastes the resources that companies value most – time and energy. And that’s bad for the organisation.","There’s a management model that groups people according to four criteria: clever, hard-working, stupid and lazy. Here ‘lazy’ means having a rational determination not to carry out unnecessary tasks. It doesn’t mean trying to avoid work altogether. Most people display two of these characteristics, and the most valuable people are those who are both clever and lazy: they possess intellectual clarity, and they don’t rush into making decisions. They come up with solutions to save the time and energy spent by the stupid and hard-working group. Instead of throwing more man-hours at a problem, the clever and lazy group looks for a more effective solution.","Next we come to creativity. This often works well – creating an attention-grabbing TV commercial, for example, might lead to increased sales. But it isn’t always a good thing. Some advertising campaigns are remembered for their creativity, without having any effect on sales. This happened a few years ago with the launch of a chocolate bar: subsequent research showed that plenty of consumers remembered the adverts, but had no idea what was being advertised. The trouble is that the creator derives pleasure from coming up with the idea, and wrongly assumes the audience for the campaign will share that feeling.","A company that brings out thousands of new products may seem more creative than a company that only has a few, but it may be too creative, and make smaller profits. Creativity needs to be targeted, to solve a problem that the company has identified. Just coming up with more and more novel products isn’t necessarily a good thing.","And finally, excellence. We all know companies that claim they ‘strive for excellence’, but it takes a long time to achieve excellence. In business, being first with a product is more profitable than having the best product. A major study of company performance compared pioneers – that is, companies bringing out the first version of a particular product – with followers, the companies that copied and improved on that product. The study found that the pioneers commanded an average market share of 29 percent, while the followers achieved less than half that, only 13 percent – even though their product might have been better.","Insisting on excellence in everything we do is time-consuming, wastes energy and leads to losing out on opportunities. Sometimes, second-rate work is more worthwhile than excellence. ‘Make sure it’s excellent’ sounds like a good approach to business, but the ‘just-get-started’ approach is likely to be more successful."],"cloze":"<p>In public discussion of business, we take certain values for granted. Today I’m going to talk about four of them: <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>. Most people would say they’re all ‘good things’. I’m going to suggest that’s an <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>.</p><p>The trouble with these values is that they’re <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>, removed from the reality of day-to-day business. Pursue values by all means, but be prepared for what may happen as a result. They can actually <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>, which is not at all the intention.</p><p>Business leaders generally try to do the right thing. But all too often the right thing backfires, if those leaders adopt values without understanding and managing the <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> that arise. The values can easily get in the way of what’s actually intended.</p><p>OK. So the first value I’m going to discuss is collaboration. Er, let me give you an example. On a management training course I once attended, we were put into groups and had to <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span> across a stream, using building blocks that we were given. The rule was that everyone in the team had to move at least one building b const storageKey=`ielts-nghe-w${DATA.week}`;
function loadState(){try{const value=JSON.parse(localStorage.getItem(storageKey)||"{}");return value&&typeof value==="object"?value:{}}catch{return {}}}
const state=loadState();
const loadedSchemaVersion=state.schemaVersion;
state.q||={};state.g||={};state.scores||={};state.studentName||="";state.studentClass||="";

}
state.submission=normalizeSubmission(state.submission);

const save=()=>localStorage.setItem(storageKey,JSON.stringify(state));

function setGroup(key,v,box,max){let a=state.q[key]||[];if(box.checked&&!a.includes(v)&&a.length>=max){box.checked=false;return}a=box.checked?[...new Set([...a,v])]:a.filter(x=>x!==v);state.q[key]=a;invalidateScore(`i${si+1}`);save();gate();scorePanel()}
function speak(w){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang="en-GB";speechSynthesis.speak(u)}

function gate(){const b=$("#partSubmit");if(!b)return;const done=complete(),submitted=partConfirmed(currentScoreKey());if(submitted)document.querySelectorAll("#content input,#content select").forEach(control=>control.disabled=true);b.disabled=submitted||!done;b.textContent=submitted?"✓ ĐÃ XÁC NHẬN NỘP PHẦN NÀY":done?"Xác nhận & nộp bài":stage==="dictation"?"Điền đủ 20/20 chỗ để nộp":"Làm đủ 10/10 câu để nộp"}
function vocab(){return `<div class="vocab-grid">${section().vocab.map(v=>`<article class="vocab-card"><button class="sound" onclick='speak(${JSON.stringify(v.word)})'>◖))</button><h3>${v.word}</h3><div class="ipa">${v.ipa}</div><div class="pos">${v.pos}</div><div class="meaning">${v.meaning}</div><p class="example">${v.example}</p><div class="translation">${v.exampleVi}</div></article>`).join("")}</div>`}
function submissionMessage(){

  if(current&&done===scoreParts.length)return '<div class="result">✓ Đã tự động gửi đủ điểm Sections 1–4 vào sổ lớp.</div>';
  if(current&&state.submission.status==="sending")return `<div class="result">Đang tự động ghi điểm vào sổ lớp${done?` · đã ghi ${done}/2 nhóm`:""}…</div>`;

function scoreView(){return `<div class="score-view"><h2>Kết quả Tuần ${DATA.week}</h2><div class="student-summary"><span>${state.studentName.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span><span>${state.studentClass}</span></div><div id="scoreGrid" class="score-grid"></div><div id="scoreStatus">${submissionMessage()}</div></div>`}
function restoreInputs(){
  document.querySelectorAll("[data-q]").forEach(el=>{const q=el.dataset.q;if(el.type==="radio")el.checked=state.q[q]===el.value;else el.value=state.q[q]||""});
  document.querySelectorAll("[data-group]").forEach(el=>el.checked=(state.q[el.dataset.group]||[]).includes(el.value));
  document.querySelectorAll("[data-gap]").forEach(el=>el.value=state.g[`${si+1}-${el.dataset.gap}`]||"");

function updateStageTabs(){
  document.querySelectorAll(".stage-tabs button").forEach(b=>{

    if(b.dataset.stage==="score"){
      b.textContent="D · Kết quả";

function render(){
  if(stage==="score"&&!scoresReady())stage="vocab";

  if(stage==="vocab")$("#content").innerHTML=vocab();
  if(stage==="dictation")$("#content").innerHTML=`<div class="workspace"><aside class="audio-side">${audioBox()}</aside><div class="scroll-panel transcript">${section().cloze}</div></div><button id="partSubmit" class="submit" onclick="gradeDict()"></button><div id="result"></div>`;
  if(stage==="ielts")$("#content").innerHTML=`<div class="workspace"><aside class="audio-side">${audioBox()}</aside><div class="scroll-panel">${section().questions}</div></div><button id="partSubmit" class="submit" onclick="gradeIelts()"></button><div id="result"></div>`;
  if(stage==="score")$("#content").innerHTML=scoreView();
  restoreInputs();gate();scorePanel();if(stage==="score"&&scoresReady())void ensureScoresSubmitted();
}
function confirmPart(total,label){return window.confirm(`Em đã làm đủ ${total} ${label}. Xác nhận nộp phần này để chấm điểm và khóa kết quả?`)}
function finishPart(){save();gate();scorePanel();updateStageTabs();void ensureScoresSubmitted();if(scoresReady()){stage="score";render()}}
function gradeDict(){
  if(!complete()||!confirmPart(20,"chỗ chính tả"))return;let ok=0;
  section().clozeAnswers.forEach((a,i)=>{const input=document.querySelector(`[data-gap="${i}"]`),good=norm(state.g[`${si+1}-${i}`])===norm(a);input.classList.toggle("good",good);input.classList.toggle("bad",!good);if(good)ok++});
  const scoreKey=`d${si+1}`;resetSubmission();state.scores[scoreKey]=ok;state.confirmations[scoreKey]=new Date().toISOString();
  $("#result").innerHTML=`<div class="result"><b>${ok}/20</b> · Sai ${20-ok} chỗ. Đáp án đã hiện trực tiếp trên phần sai sau khi nộp.</div>`;
  section().clozeAnswers.forEach((a,i)=>{const input=document.querySelector(`[data-gap="${i}"]`);if(input.classList.contains("bad"))input.value=a});finishPart();
}
function gradeIelts(){
  if(!complete()||!confirmPart(10,"câu IELTS"))return;const [a,b]=range();let ok=0,grouped=new Set();
  for(const [key,nums] of questionGroups()){
    const chosen=state.q[key]||[],valid=new Set(nums.flatMap(q=>DATA.answers[q]).map(norm));
    ok+=chosen.filter(x=>valid.has(norm(x))).length;nums.forEach(q=>grouped.add(q));
    document.querySelectorAll(`[data-group="${key}"]`).forEach(el=>el.closest("td,.question-item,.paper-option")?.classList.add(valid.has(norm(el.value))?"good":"bad"));
  }
  for(let q=a;q<=b;q++){
    if(grouped.has(q))continue;const valid=DATA.answers[q].map(norm),good=valid.includes(norm(state.q[q]));if(good)ok++;
    document.querySelectorAll(`[data-q="${q}"]`).forEach(el=>el.closest("td,.question-item,.paper-option")?.classList.add(good?"good":"bad"));
  }
  const scoreKey=`i${si+1}`;resetSubmission();state.scores[scoreKey]=ok;state.confirmations[scoreKey]=new Date().toISOString();
  $("#result").innerHTML=`<div class="result"><b>${ok}/10</b> · Em làm sai ${10-ok} câu. Hãy nghe lại Section ${si+1} và đối chiếu phần vừa làm.</div>`;finishPart();
}
function scorePanel(){
  const grid=$("#scoreGrid");if(grid)grid.innerHTML=scoreKeys().map(k=>`<div class="score"><small>${k[0]==="d"?"Chính tả":"IELTS"} · Section ${k.slice(1)}</small><br><b>${partConfirmed(k)?state.scores[k]:"—"}/${k[0]==="d"?20:10}</b></div>`).join("");
  updateStageTabs();const status=$("#scoreStatus");if(status)status.innerHTML=submissionMessage();
}
function scorePayload(label,a,b){
  const p=new URLSearchParams();p.set(DATA.form.week,label);p.set(DATA.form.name,state.studentName.trim());p.set(DATA.form.studentClass,state.studentClass);
  p.set(DATA.form.d1,String(state.scores[`d${a}`]));p.set(DATA.form.i1,String(state.scores[`i${a}`]));p.set(DATA.form.d2,String(state.scores[`d${b}`]));p.set(DATA.form.i2,String(state.scores[`i${b}`]));
  p.set(DATA.form.total,String(state.scores[`d${a}`]+state.scores[`i${a}`]+state.scores[`d${b}`]+state.scores[`i${b}`]));return p;
}
function scheduleScoreRetry(){
  if(scoreRetryTimer||state.submission.status==="sent")return;
  const delays=[5000,15000,30000,60000],delay=delays[Math.min(scoreRetryAttempt,delays.length-1)];scoreRetryAttempt++;
  scoreRetryTimer=setTimeout(()=>{scoreRetryTimer=null;if(scoresReady())void ensureScoresSubmitted()},delay);
}
async function ensureScoresSubmitted(){
  if(!scoresReady()||!state.studentName.trim()||!state.studentClass)return false;
  const fingerprint=scoreFingerprint();
  if(state.submission.fingerprint!==fingerprint)state.submission=freshSubmission(fingerprint);
  if(scoreParts.every(part=>state.submission.parts[part.key]==="sent")){state.submission.status="sent";return true}
  if(scoreSendPromise)return scoreSendPromise;
  clearScoreRetry();state.submission.status="sending";state.submission.sentAt="";save();scorePanel();
  scoreSendPromise=(async()=>{
    try{
      for(const part of scoreParts){
        if(state.submission.parts[part.key]==="sent")continue;
        state.submission.parts[part.key]="sending";save();scorePanel();
        await fetch(DATA.form.url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:scorePayload(part.label(),part.a,part.b).toString()});
        state.submission.parts[part.key]="sent";save();scorePanel();
      }
      state.submission.status="sent";state.submission.sentAt=new Date().toISOString();scoreRetryAttempt=0;save();scorePanel();return true;
    }catch{
      scoreParts.forEach(part=>{if(state.submission.parts[part.key]==="sending")state.submission.parts[part.key]="error"});
      state.submission.status="error";state.submission.sentAt="";save();scorePanel();scheduleScoreRetry();return false;
    }
    finally{scoreSendPromise=null}
  })();return scoreSendPromise;
}
$("#sectionTabs").innerHTML=DATA.sections.map((s,i)=>`<button onclick="si=${i};stage='vocab';render()">SECTION ${s.number}<br><small>Questions ${(s.number-1)*10+1}–${s.number*10}</small></button>`).join("");
document.querySelectorAll(".stage-tabs button").forEach(b=>b.onclick=()=>{if(b.dataset.stage==="score"&&!scoresReady())return;stage=b.dataset.stage;render()});
const entryName=$("#entryName"),entryClass=$("#entryClass"),enterTest=$("#enterTest");entryName.value=state.studentName;entryClass.value=state.studentClass;
function updateEntryGate(){const ready=entryName.value.trim()&&entryClass.value;enterTest.disabled=!ready;enterTest.textContent=ready?"Vào Listening Test":"Nhập họ tên và chọn lớp để vào bài"}
function openTest(){
  const name=entryName.value.trim(),studentClass=entryClass.value;if(!name||!studentClass)return;
  const previousKey=state.studentKey||identityKey(state.studentName,state.studentClass),nextKey=identityKey(name,studentClass);
  if(previousKey&&previousKey!==nextKey){state.q={};state.g={};state.scores={};state.confirmations={};resetSubmission()}
  state.studentName=name;state.studentClass=studentClass;state.studentKey=nextKey;save();$("#entryGate").hidden=true;$("#testApp").hidden=false;render();if(scoresReady())void ensureScoresSubmitted();
}
entryName.oninput=updateEntryGate;entryClass.onchange=updateEntryGate;enterTest.onclick=openTest;entryName.onkeydown=e=>{if(e.key==="Enter"&&!enterTest.disabled)openTest()};
window.addEventListener("online",()=>{clearScoreRetry();if(scoresReady())void ensureScoresSubmitted()});updateEntryGate();render();
</script></body></html>
