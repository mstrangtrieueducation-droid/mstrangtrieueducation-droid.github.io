</style></head><body><section id="entryGate" class="entry-screen"><div class="entry-card"><header class="entry-head"><small>IELTS - NGHE · TUẦN 30</small><h1>Listening Test 20</h1><p>Điền thông tin học sinh trước khi vào bài.</p></header><div class="entry-body"><p class="entry-note">Họ tên và lớp sẽ được giữ lại để gửi điểm sau khi hoàn thành bài.</p><label for="entryName">Họ và tên học sinh</label><input id="entryName" type="text" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"><label for="entryClass">Lớp IELTS</label><select id="entryClass"><option value="">Chọn lớp IELTS</option><option>IELTS 40</option><option>IELTS 41</option><option>IELTS 42</option><option>IELTS 43</option><option>IELTS 44</option><option>IELTS 45</option><option>IELTS 46</option><option>IELTS 47</option><option>IELTS 48</option><option>IELTS 49</option><option>IELTS 50</option><option>IELTS 51</option><option>IELTS 52</option><option>IELTS 53</option></select><button id="enterTest" disabled>Nhập họ tên và chọn lớp để vào bài</button></div></div></section><div id="testApp" hidden><header class="hero"><small>IELTS - NGHE · TUẦN 30</small><h1>Listening Test 20</h1><p>Full Test · Sections 1–4 · 40 questions</p></header><main class="shell"><nav id="sectionTabs" class="section-tabs"></nav><nav class="stage-tabs"><button data-stage="vocab">A · Từ vựng cần lưu ý</button><button data-stage="dictation">B · Điền chính tả</button><button data-stage="ielts">C · Câu hỏi IELTS</button><button data-stage="score">D · Kết quả</button></nav><section id="content" class="lesson"></section></main></div><script>const DATA={"week":30,"test":20,"answers":{"1":["babies","baby"],"2":["Eshcol"],"3":["evening"],"4":["Gormley"],"5":["B"],"6":["E"],"7":["heart"],"8":["primary school"],"9":["4.30","4:30","4 30"],"10":["ages","age"],"11":["B"],"12":["C"],"13":["E"],"14":["B"],"15":["E"],"16":["D"],"17":["A"],"18":["C"],"19":["732281","732 281","7 3 2 2 8 1"],"20":["Thursday","Thursdays"],"21":["A"],"22":["C"],"23":["approach"],"24":["mature"],"25":["interest"],"26":["groups","small groups","in small groups"],"27":["every 2 days","every two days"],"28":["2 weeks","two weeks"],"29":["confident","more confident"],"30":["education system","the education system"],"31":["C"],"32":["A"],"33":["B"],"34":["B"],"35":["A"],"36":["C"],"37":["frog","frogs"],"38":["predators","predator"],"39":["count"],"40":["seed","seeds"]},"sections":[{"number":1,"transcript":["WOMAN: Can I help you?","MAN: Yes, I've just moved to this area with my wife and children and I'd like to know where we can all register with a doctor at a Health Centre.","WOMAN: Okay. Well, there's Doctor Green at The Harvey Clinic. We always recommend her for babies, because she's very good with them and she runs a special clinic.","MAN: Oh ... actually my youngest child is five, so that wouldn't be any good for us.","WOMAN: Right.","MAN: Is there anywhere else I could try?","WOMAN: Yes, the Eshcol Health Practice is the next one on my list.","MAN: How do you spell that?","WOMAN: E-S-H-C-O-L. And it's Doctor Fuller, who has space on his list. The clinic only opened a year ago, so the facilities are all very modern.","MAN: That sounds good.","WOMAN: And it's particularly good if you're busy during the day, because they also do appointments in the evening. They're closed on Saturday, though. The only other place on the list is the Health Centre on Shore Lane. You can register with Doctor Gormley, that's G-O-R-M-L-E-Y. He's new there, but the centre has a very good reputation.","MAN: Oh yes, I think I know the road. That would be the best one. Thanks. Could you tell me, will all their services be free?","WOMAN: There are usually some small charges that doctors make. Let me see what it says about the Shore Lane Centre. If you need to be vaccinated before any trips abroad, you won't have to pay for this. The sports injury treatment service operates on a paying basis, as does the nutritional therapy service. Some health centres do offer alternative therapies like homeopathy as part of their pay-to-use service. Shore Lane are hoping to do this soon - I think they may start with acupuncture. And finally, if you need to prove you're healthy or haven't had any serious injuries before a new employer will accept you, you can get a free fitness check-up there, but you'd most likely have to pay for insurance medicals though.","MAN: Okay, thanks.","WOMAN: You might also be interested to know the Centre is running a pilot scheme of talks for patients. I've got the list here. Actually, they look very interesting.","MAN: What sort of things?","WOMAN: Well, the first one's about giving up smoking. It's next week, the twenty-fifth of February, at 7 pm, and that's in Room 4. It says, the talk will stress the health benefits particularly for people with asthma or heart disease.","MAN: That sounds very interesting.","WOMAN: There's also a talk for families with children. It's on Healthy Eating, and takes place on the first of March at five o'clock.","MAN: Will that be at the Health Centre?","WOMAN: Actually it's at the primary school on Shore Lane. I imagine they're inviting the parents of pupils there - it says here 'all welcome'.","MAN: I might go to that if I have time.","WOMAN: There's a couple of other talks - one giving advice about how to avoid injuries while doing exercise. It's on the ninth of March. Oh, it's a late afternoon talk, at four thirty, and it'll be in Room 6. It also says the talk is suitable for all ages. And finally, there's a talk called 'Stress Management' which is ..."],"cloze":"<p>WOMAN: Can I help you?</p><p>MAN: Yes, I've just <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> with my wife and children and I'd like to know where we can all <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> at a Health Centre.</p><p =\"question-item\"><strong class=\"q-number\">3</strong><input type=\"text\" class=\"paper-input\" data-q=\"3\" autocomplete=\"off\" spellcheck=\"false\" oninput=\"setQ(3,this.value)\"></span> appointments</td></tr>\n<tr><td>The Shore Lane Health Centre</td><td>Dr <span class=\"question-item\"><strong class=\"q-number\">4</strong><input type=\"text\" class=\"paper-input\" data-q=\"4\" autocomplete=\"off\" spellcheck=\"false\" oninput=\"setQ(4,this.value)\"></span></td><td></td></tr></tbody></table></div>\n<h2 class=\"question-range\">Questions 5-6</h2><div class=\"task-copy\"><p><b>Choose TWO letters, A-E.</b></p><p>Which TWO of the following are offered free of charge at Shore Lane Health Centre?</p>\n<div class=\"question-item\"><strong class=\"q-number\">5</strong><strong class=\"q-number\">6</strong>\n<label class=\"paper-option\"><input type=\"checkbox\" value=\"A\" data-group=\"5-6\" onchange=\"setGroup('5-6',this.value,this,2)\"><b class=\"option-letter\">A</b> acupuncture</label>\n<label class=\"paper-option\"><input type=\"checkbox\" value=\"B\" data-group=\"5-6\" onchange=\"setGroup('5-6',this.value,this,2)\"><b class=\"option-letter\">B</b> employment medicals</label>\n<label class=\"paper-option\"><input type=\"checkbox\" value=\"C\" data-group=\"5-6\" onchange=\"setGroup('5-6',this.value,this,2)\"><b class=\"option-letter\">C</b> sports injury therapy</label>\n<label class=\"paper-option\"><input type=\"checkbox\" value=\"D\" data-group=\"5-6\" onchange=\"setGroup('5-6',this.value,this,2)\"><b class=\"option-letter\">D</b> travel advice</label>\n<label class=\"paper-option\"><input type=\"checkbox\" value=\"E\" data-group=\"5-6\" onchange=\"setGroup('5-6',this.value,this,2)\"><b class=\"option-letter\">E</b> vaccinations</label></div></div>\n<h2 class=\"question-range\">Questions 7-10</h2><div class=\"task-copy\"><p>Complete the table below.</p><p><b>Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.</b></p>\n<table><tbody><tr><th>Subject of s happened - it's got switched off by mistake.","The middle one of these three controls - you'll see it's slightly larger than the first one - controls the radiators. If you feel cold while you're there and need the radiators on, this needs to be turned to maximum. The last of the three controls - the one on the right - is usually on about a number four setting which for the water in the taps is usually quite hot enough.","Below the heating controls in the middle is a small round plastic button. If there isn't enough water in the pipes, sometimes the heater goes out. If this happens you'll need to press this button to reset the heater. Hold it in for about five seconds and the heater should come on again. Then there's a little square indicator under the third knob that's a kind of alarm light. It'll flash if you need to reset the heater.","WOMAN: It sounds complicated ...","MAN: I'm sure you won't have any problems with it. There should be some more instructions on the side of the heater. Call me back if you can't make it work.","WOMAN: Okay. While you're on the phone, we haven't managed to find a few things we need, like extra pillows for the beds and some washing powder. Is there any here?","MAN: Pillows ... yes. If you look in the cupboard, the large white one upstairs - to the left of the bathroom door - there should be four or five on the top shelf. And if you want to do some washing, there's some powder for that ... probably by the back door. There's a kind of shelf there above the sink. In fact, I'm sure there's some there, in a large blue box. You need about half a cup full for each wash.","And that reminds me, the spare key to the back door is hanging on a hook on the wall by the sitting room window. Please make sure to put it back when you've used it. The previous guests lost it in the garden and I had to get another one made! And if you have any trouble with the lamps, you'll find some spare bulbs in a large cardboard box. It's on top of the washing machine with all kinds of useful things in it.","Oh, and another thing I forgot to mention when we last spoke ...","WOMAN: Yes?","MAN: I've left you a local map, so you'll be able to find your way around easily. It shows the whole area. I put it in the top drawer of the chest under the TV in your bedroom. There's a whole file of local information in there too.","WOMAN: Thanks. What about visiting the town? Can you give us any advice?","MAN: Yes. You'll need to take the car. It's too far to walk from the flat really. You have to pay to leave your car in all the car parks now I'm afraid. I like the one that's by the station best and you can walk to the town centre from there in five minutes. That's where all the best restaurants are. But if you want a takeaway, the Italian one does really good pasta and pizzas. Call 7-3 double 2, 8-1 for that one, or 7 double 6, double 1, 9 for the Chinese. They're both good and they'll both deliver to the flat.","As for places to visit, yes, do go and see the railway museum. The exhibition is small but really good. It gets very crowded on Sundays, so I suggest you visit it on a quieter day, later in the week, but not on Thursdays which is market day - you won't find anywhere to park and it's also the only day of the week when they're not open!"],"cloze":"<p>MAN: Hello?</p><p>WOMAN: Hi. It's Laura Carlton here. We've just arrived at the holiday flat, but I can't get the <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> to work.</p><p>MAN: Oh right! That's easy. Don't worry. In the <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>, you'll find the water heater. You'll see <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span> on the left at the bottom of the heater. The first one - the rou \"heater-screen\">HOT WATER &amp; HEATING</div><div class=\"heater-knob k1\"><i></i><small>Main control</small></div><div class=\"heater-knob k2\"><i></i><small>Radiators</small></div><div class=\"heater-knob k3\"><i></i><small>Water temperature</small></div><div class=\"heater-square s1\"></div><div class=\"heater-reset\"></div><div class=\"heater-square s3\"></div><span class=\"heater-answer q11\"><strong class=\"q-number\">11</strong><select data-q=\"11\" onchange=\"setQ(11,this.value)\" aria-label=\"Question 11\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option></select></span><span class=\"heater-answer q12\"><strong class=\"q-number\">12</strong><select data-q=\"12\" onchange=\"setQ(12,this.value)\" aria-label=\"Question 12\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option></select></span><span class=\"heater-answer q13\"><strong class=\"q-number\">13</strong><select data-q=\"13\" onchange=\"setQ(13,this.value)\" aria-label=\"Question 13\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option></select></span></div></div></div>\n<h2 class=\"question-range\">Questions 14-18</h2><div class=\"task-copy\"><p>Where can each of the following items be found?</p><p><b>Choose FIVE answers from the box and write the correct letter, A-G.</b></p>\n<div class=\"option-bank\"><div><b>A</b> in box on washing machine</div><div><b>B</b> in cupboard on landing</div><div><b>C</b> in chest of drawers</div><div><b>D</b> next to window in living room</div><div><b>E</b> on shelf by back door</div><div><b>F</b> on top of television</div><div><b>G</b> under kitchen sink</div></div>\n<table><tbody><tr><td>pillows</td><td><select data-q=\"14\" onchange=\"setQ(14,this.value)\"><option value=\"\">—</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option><option>G</option></select></td></tr>\n<tr><td>washing powder</td><td><select data-q=\"15\" onchange=\"setQ(15,this.value)\"><option value=\"\">—</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option><option>G</option></select></td></tr>\n<tr><td>key</td><td><select data-q=\"16\" onchange=\"setQ(16,this.value)\"><option value=\"\">—</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option><option>G</option></select></td></tr>\n<tr><td>light bulbs</td><td><select data-q=\"17\" onchange=\"setQ(17,this.value)\"><option value=\"\">—</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option><option>G</option></select></td></tr>\n<tr><td>map</td><td><select data-q=\"18\" onchange=\"setQ(18,this.value)\"><option value=\"\">—</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option><option>G</option></select></td></tr></tbody></table></div>\n<h2 class=\"question-range\">Questions 19-20</h2><div class=\"task-copy\"><p>Complete the notes below.</p><p><b>Write ONE WORD AND/OR A NUMBER for each answer.</b></p>\n<p>The best place to park in town – next to the station</p><p>Phone number for takeaway pizzas – <span class=\"question-item\"><strong class=\"q-number\">19</strong><input type=\"text\" class=\"paper-input\" data-q=\"19\" autocomplete=\"off\" spellcheck=\"false\" oninput=\"setQ(19,this.value)\"></span></p><p>Railway museum closed on <span class=\"question-item\"><strong class=\"q-number\">20</strong><input type=\"text\" class=\"paper-input\" data-q=\"20\" autocomplete=\"off\" spellcheck=\"false\" oninput=\"setQ(20,this.value)\"></span></p></div></div>","audio":"https://engnovate.com/wp-content/uploads/2026/06/cambridge-ielts-09-academic-listening-test-4-2.mp3"},{"number":3,"transcript":["PAUL: Hello, Kira, how are you?","KIRA: Fine thanks, Paul, how are you?","PAUL: Well, thanks. It's good to see you. It must be twelve months since you did our course?","KIRA: That's right. It's nice to come back and say hello.","PAUL: What course did you enrol in?","KIRA: Actually, I went straight into third year Pharmacy. They credited me with two years, which probably made it more difficult for me.","PAUL: On the other hand, you were lucky to be granted credits. Is that why you chose the course?","KIRA: Yes. And, as I'd already finished a course in it in my country, I thought it would be easier if I studied something I already knew.","PAUL: I didn't realise you went into third year. I thought you started in first year. No wonder it was so hard! And what do you think is one of the big differences between studying at a university here and studying in your country?","KIRA: Well, I've found it very difficult to write assignments, because I wasn't familiar with that aspect of the system here. The main problem is that the lecturers expect you to be critical. That made me feel really terrible. I thought, how can I comment on someone else's research when they probably spent five years doing it? I think a lot of people who come from overseas countries have similar problems. But after a while it became easier for me. People expect you to have problems with the process of reading and writing but, in fact, it is more a question of altering your viewpoint towards academic study.","PAUL: How was the content of the lectures? Was it easy for you?","KIRA: I didn't really have many problems understanding lectures. The content was very similar to what I'd studied before.","PAUL: And what about the lecturers themselves? Are they essentially the same as lecturers in your country?","KIRA: Well actually, no. Here, they're much easier to approach. After every lecture you can go and ask them something you didn't understand. Or you can make an appointment and talk to them about anything in the course.","PAUL: Maybe you found them different because you're a more mature student now, whereas when you were studying in your country you were younger and not so assertive.","KIRA: No, I don't think that's the difference. Most of the students here do it. In my faculty, they all seem to make appointments - usually to talk about something in the course that's worrying them, but sometimes just about something that might really interest them, something they might want to specialise in. The lecturers must set aside certain times every week when they're available for students.","PAUL: That's good to hear. And how was your timetable? Was it a very busy year?","KIRA: Very, very busy. They make you work very hard. Apart from lectures, we had practical sessions in a lot of subjects. We did these in small groups. I had to go and work four hours every week in a community pharmacy. Actually, I enjoyed this very much - meeting new people all the time. Then in second semester, we had to get experience in hospital dispensaries, so every second day we went to one of the big hospitals and worked there. And on top of all that we had our assignments, which took me a lot of time. Oh, I nearly forgot, between first and second semesters, we had to work full-time for two weeks in a hospital.","PAUL: That does sound a very heavy year. So are you pleased now that you did it? Do you feel some sense of achievement?","KIRA: Yeah, I do feel much more confident, which I suppose is the most important thing.","PAUL: And have you got any recommendations for people who are studying from overseas?","KIRA: Well, I suppose they need very good English. It would be much better if they spent more time learning English before they enter the university, because you can be in big trouble if you don't understand what people are saying and you haven't got time to translate.","PAUL: Anything else?","KIRA: Well, as I said before, the biggest problem for me was a lack of familiarity with the education system here.","PAUL: It sounds as if it was a real challenge. Congratulations, Kira.","KIRA: Thanks, Paul."],"cloze":"<p>PAUL: Hello, Kira, how are you?</p><p>KIRA: Fine thanks, Paul, how are you?</p><p>PAUL: Well, thanks. It's good to see you. It must be twelve months since you did our course?</p><p>KIRA: That's right. It's nice to come back and say hello.</p><p>PAUL: What course did you enrol in?</p><p>KIRA: Actually, I went straight into <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>. They credited me with two years, which probably made it more difficult for me.</p><p>PAUL: On the other hand, you were lucky to be <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>. Is that why you chose the course?</p><p>KIRA: Yes. And, as I'd already <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span> in it in my country, I thought it would be easier if I studied something I already knew.</p><p>PAUL: I didn't realise you went into third year. I thought you started in first year. No wonder it was so hard! And what do you think is one of the big differences between studying at a university here and studying in your country?</p><p>KIRA: Well, I've found it very difficult to <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>, because I wasn't familiar with that aspect of the system here. The main problem is that the <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span>. That made me feel really terrible. I thought p>KIRA: Yeah, I do feel much more confident, which I suppose is the most important thing.</p><p>PAUL: And have you got any recommendations for people who are studying from overseas?</p><p>KIRA: Well, I suppose they need very good English. It would be much better if they spent more time learning English before they enter the university, because you can be in big trouble if you don't understand what people are saying and you haven't got time to translate.</p><p>PAUL: Anything else?</p><p>KIRA: Well, as I said before, the biggest problem for me was a lack of familiarity with the <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span> here.</p><p>PAUL: It sounds as if it was a real challenge. Congratulations, Kira.</p><p>KIRA: Thanks, Paul.</p>","clozeAnswers":["third year Pharmacy","granted credits","finished a course","write assignments","lecturers expect you to be critical","overseas countries","altering your viewpoint","understanding lectures","easier to approach","make an appointment","more mature student","not so assertive","something that might really interest them","available for students","practical sessions","small groups","community pharmacy","every second day","full-time for two weeks","education system"],"vocab":[{"word":"credit","ipa":"/ˈkredɪt/","pos":"Danh từ (n)","meaning":"tín chỉ được công nhận","example":"The university granted her two years of credit.","exampleVi":"Trường đại học công nhận cho cô ấy hai năm tín chỉ."},{"word":"critical","ipa":"/ˈkrɪtɪkəl/","pos":"Tính từ (adj)","meaning":"có tư duy phản biện","example":"Lecturers expect students to be critical in assignments.","exampleVi":"Giảng viên yêu cầu sinh viên thể hiện tư duy phản biện trong bài tập."},{"word":"viewpoint","ipa":"/ˈvjuːpɔɪnt/","pos":"Danh từ (n)","meaning":"quan điểm, cách nhìn","example":"Kira had to alter her academic viewpoint.","exampleVi":"Kira phải thay đổi cách nhìn của mình về học thu er.</label><label class=\"paper-option\"><input type=\"radio\" value=\"C\" name=\"q22\" data-q=\"22\" onchange=\"setQ(22,this.value)\"><b class=\"option-letter\">C</b> change her way of thinking.</label></div></div>\n<h2 class=\"question-range\">Questions 23-25</h2><div class=\"task-copy\"><p>Complete the sentences below.</p><p><b>Write ONE WORD ONLY for each answer.</b></p>\n<p>Kira says that lecturers are easier to <span class=\"question-item\"><strong class=\"q-number\">23</strong><input type=\"text\" class=\"paper-input\" data-q=\"23\" autocomplete=\"off\" spellcheck=\"false\" oninput=\"setQ(23,this.value)\"></span> than those in her home country.</p>\n<p>Paul suggests that Kira may be more <span class=\"question-item\"><strong class=\"q-number\">24</strong><input type=\"text\" class=\"paper-input\" data-q=\"24\" autocomplete=\"off\" spellcheck=\"false\" oninput=\"setQ(24,this.value)\"></span> than when she was studying before.</p>\n<p>Kira says that students want to discuss things that worry them or that <span class=\"question-item\"><strong class=\"q-number\">25</strong><input type=\"text\" class=\"paper-input\" data-q=\"25\" autocomplete=\"off\" spellcheck=\"false\" oninput=\"setQ(25,this.value)\"></span> them very much.</p></div>\n<h2 class=\"question-range\">Questions 26-30</h2><div class=\"task-copy\"><p>Answer the questions below.</p><p><b>Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.</b></p>\n<p>How did the students do their practical sessions? <span class=\"question-item\"><strong class=\"q-number\">26</strong><input type=\"text\" class=\"paper-input\" data-q=\"26\" autocomplete=\"off\" spellcheck=\"false\" oninput=\"setQ(26,this.value)\"></span></p>\n<p>In the second semester how often did Kira work in a hospital? <span class=\"question-item\"><strong class=\"q-number\">27</strong><input type=\"text\" class=\"paper-input\" data-q=\"27\" autocomplete=\"off\" spellcheck=\"false\" oninput=\"setQ(27,this.value)\"></span></p>\n<p>How much full-time work did Kira do during the year? <span class=\"question-item\"><strong class=\"q-number\">28</strong><input type=\"text\" class=\"paper-input\" data-q=\"28\" autocomplete=\"off\" spellcheck=\"false\" oninput=\"setQ(28,this.value)\"></span></p>\n<p>Having completed the year, how does Kira feel? <span class=\"question-item\"><strong class=\"q-number\">29</strong><input type=\"text\" class=\"paper-input\" data-q=\"29\" autocomplete=\"off\" spellcheck=\"false\" oninput=\"setQ(29,this.value)\"></span></p>\n<p>In addition to the language, what do overseas students need to become familiar with? <span class=\"question-item\"><strong class=\"q-number\">30</strong><input type=\"text\" class=\"paper-input\" data-q=\"30\" autocomplete=\"off\" spellcheck=\"false\" oninput=\"setQ(30,this.value)\"></span></p></div></div>","audio":"https://engnovate.com/wp-content/uploads/2026/06/cambridge-ielts-09-academic-listening-test-4-3.mp3"},{"number":4,"transcript":["Good morning. Today I'd like to present the findings of our Year 2 project on wildlife found in gardens throughout our city. I'll start by saying something about the background to the project, then talk a little bit about our research techniques, and then indicate some of our interim findings.","First of all, how did we choose our topic? Well, there are four of us in the group and one day while we were discussing a possible focus, two of the group mentioned that they had seen yet more sparrow-hawks - one of Britain's most interesting birds of prey - in their own city centre gardens and wondered why they were turning up in these gardens in great numbers. We were all very engaged by the idea of why wild animals would choose to inhabit a city garden. Why is it so popular with wildlife when the countryside itself is becoming less so?","The first thing we did was to establish what proportion of the urban land is taken up by private gardens. We estimated that it was about one fifth, and this was endorsed by looking at large-scale usage maps in the town land survey office - 24% to be precise. Our own informal discussions with neighbours and friends led us to believe that many garden owners had interesting experiences to relate regarding wild animal sightings so we decided to survey garden owners from different areas of the city.","Just over 100 of them completed a survey once every two weeks for twelve months - ticking off species they had seen from a pro forma list - and adding the names of any rarer ones. Meanwhile, we were doing our own observations in selected gardens throughout the city. We deliberately chose smaller ones because they were by far the most typical in the city. The whole point of the project was to look at the norm not the exception.","Alongside this primary research on urban gardens, we were studying a lot of books about the decline of wild animals in the countryside and thinking of possible causes for this.","So what did we find? Well, so much that I just won't have time to tell you about here. If you're interested in reading our more comprehensive findings, we've produced detailed graphic representations on the college web-site and of course any of the group would be happy to talk to you about them. Just email us.","What we've decided to present today is information about just three species - because we felt these gave a good indication of the processes at work in rural and urban settings as a whole.","The first species to generate a lot of interesting information was frogs. And there was a clear pattern here - they proliferate where there is suitable water. Garden ponds are on the increase, rural ponds are disappearing, leading to massive migration to the towns.","Hedgehogs are also finding it easier to live in urban areas - this time because their predators are not finding it quite so attractive to leave their rural environment, so hedgehogs have a better survival rate in cities. We had lots of sightings, so all in all we had no difficulties with our efforts to count their numbers precisely.","Our final species is the finest of bird singers, the song thrush. On the decline in the countryside, they are experiencing a resurgence in urban gardens because these days gardeners are buying lots of different plants which means there's an extensive range of seeds around, which is what they feed on. Another factor is the provision of nesting places - which is actually better in gardens than the countryside. Hard to believe it, but it's true.","Incidentally, we discovered that a massive new survey on song thrushes is about to be launched, so you should keep an eye open for that. Now, I'd be happy to answer any questions you may have."],"cloze":"<p>Good morning. Today I'd like to present the findings of our Year 2 project on <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> throughout our city. I'll start by saying something about the <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>, then talk a little bit about our <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>, and then indicate some of our interim findings.</p><p>First of all, how did we choose our topic? Well, there are four of us in the group and one day while we were discussing a possible focus, two of the group mentioned that they had seen yet more <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> - one of Britain's most interesting <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> - in their own <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span> and wondered why they were turning up in these gardens in great numbers. We were all very engaged by the idea of why wild animals would choose to inhabit a city garden. Why is it so popular with wildlife when the countryside itself is becoming less so?</p><p>The first thing we did was to establish what proportion of the urban land is taken up by <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span>. We estimated that it was about <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>, and this was endorsed by looking at large-scale usage maps in the town land survey office - <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span>. Our own informal discussions with neighbours and friends led us to believe that many garden owners had interesting experiences to relate regarding wild animal sightings so we decided to <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span> from different areas of the city.</p><p>Just over 100 of them completed a survey <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span> for twelve months - ticking off species they had seen from a pro forma list - and adding the names of any rarer ones. Meanwhile, we were doing our own observations in <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span> throughout the city. We deliberately chose smaller ones because they were by far the <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span> in the city. The whole point of the project was to look at the norm not the exception.</p><p>Alongside this primary research on urban gardens, we were studying a lot of books about the <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span> in the countryside and thinking of possible causes for this.</p><p>So what did we find? Well, so much that I just won't have time to tell you about here. If you're interested in reading our more comprehensive findings, we've produced detailed <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span> on the college web-site and of course any of the group would be happy to talk to you about them. Just email us.</p><p>What we've decided to present today is information about just <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span> - because we felt these gave a good indication of the processes at work in rural and urban settings as a whole.</p><p>The first species to generate a lot of interesting information was frogs. And there was a clear pattern here - they proliferate where there is <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span>. Garden ponds are on the increase, rural ponds are disappearing, leading to <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span> to the towns.</p><p>Hedgehogs are also finding it easier to live in urban areas - this time because their predators are not finding it quite so attractive to leave their rural environment, so hedgehogs have a <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> in cities. We had lots of sightings, so all in all we had no difficulties with our efforts to count their numbers precisely.</p><p>Our final species is the finest of bird singers, the song thrush. On the decline in the countryside, they are experiencing a resurgence in urban gardens because these days gardeners are buying lots of different plants which means there's an extensive range of seeds around, which is what they feed on. Another factor is the provision of <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span> - which is actually better in gardens than the countryside. Hard to believe it, but it's true.</p><p>Incidentally, we discovered that a massive new survey on song thrushes is about to be launched, so you should keep an eye open for that. Now, I'd be happy to answer any questions you may have.</p>","clozeAnswers":["wildlife found in gardens","background to the project","research techniques","sparrow-hawks","birds of prey","city centre gardens","private gardens","one fifth","24% to be precise","survey garden owners","once every two weeks","selected gardens","most typical","decline of wild animals","graphic representations","three species","suitable water","massive migration","better survival rate","nesting places"],"vocab":[{"word":"interim finding","ipa":"/ˈɪntərɪm ˌfaɪndɪŋ/","pos":"Cụm danh từ (n phr.)","meaning":"kết quả nghiên cứu tạm thời","example":"The speaker presents several interim findings.","exampleVi":"Người nói trình bày một số kết quả nghiên cứu tạm thời."},{"word":"bird of prey","ipa":"/ˌbɜːd əv ˈpreɪ/","pos":"Cụm danh từ (n phr.)","meaning":"chim săn mồi","example":"The sparrow-hawk is a bird of prey.","exampleVi":"Chim cắt là một loài chim săn mồi."},{"word":"proportion","ipa":"/prəˈpɔːʃən/","pos":"Danh từ (n)","meaning":"tỷ lệ","example":"The survey confirmed the exact proportion of garden land.","exampleVi":"Khảo sát xác nhận tỷ lệ chính xác của diện tích vườn."},{"word":"representative","ipa":"/ˌreprɪˈzentətɪv/","pos":"Tính từ (adj)","meaning":"có tính đại diện","example":"Researchers selected gardens that were representative.","exampleVi":"Các nhà nghiên cứu chọn những khu vườn có tính đại diện."},{"word":"proliferate","ipa":"/prəˈlɪfəreɪt/","pos":"Động từ (v)","meaning":"sinh sôi, tăng nhanh","example":"Frogs proliferate where suitable water is available.","exampleVi":"Ếch sinh sôi ở nơi có nguồn nước phù hợp."},{"word":"resurgence","ipa":"/rɪˈsɜːdʒəns/","pos":"Danh từ (n)","meaning":"sự gia tăng trở lại","example":"Song thrushes are experiencing an urban resurgence.","exampleVi":"Chim hoét đang gia tăng trở lại tại khu vực đô thị."}],"questions":"<div class=\"exam-section\">\n<h2 class=\"question-range\">Questions 31-36</h2><div class=\"task-copy\"><p><b>Choose the correct letter, A, B or C.</b></p>\n<div class=\"question-item\"><strong class=\"q-number\">31</strong> What led the group to choose their topic?<label class=\"paper-option\"><input type=\"radio\" value=\"A\" name=\"q31\" data-q=\"31\" onchange=\"setQ(31,this.value)\"><b class=\"option-letter\">A</b> They were concerned about the decline of one species.</label><label class=\"paper-option\"><input type=\"radio\" value=\"B\" name=\"q31\" data-q=\"31\" onchange=\"setQ(31,this.value)\"><b class=\"option-letter\">B</b> They were interested in the effects of city growth.</label><label class=\"paper-option\"><input type=\"radio\" value=\"C\" name=\"q31\" data-q=\"31\" onchange=\"setQ(31,this.value)\"><b class=\"option-letter\">C</b> They wanted to investigate a recent phenomenon.</label></div>\n<div class=\"question-item\"><strong class=\"q-number\">32</strong> The exact proportion of land devoted to private gardens was confirmed by<label class=\"paper-option\"><input type=\"radio\" value=\"A\" name=\"q32\" data-q=\"32\" onchange=\"setQ(32,this.value)\"><b class=\"option-letter\">A</b> consulting some official documents.</label><label class=\"paper-option\"><input type=\"radio\" value=\"B\" name=\"q32\" data-q=\"32\" onchange=\"setQ(32,this.value)\"><b class=\"option-letter\">B</b> taking large-scale photos.</label><label class=\"paper-option\"><input type=\"radio\" value=\"C\" name=\"q32\" data-q=\"32\" onchange=\"setQ(32,this.value)\"><b class=\"option-letter\">C</b> discussions with town surveyors.</label></div>\n<div class=\"question-item\"><strong class=\"q-number\">33</strong> The group asked garden owners to<label class=\"paper-option\"><input type=\"radio\" value=\"A\" name=\"q33\" data-q=\"33\" onchange=\"setQ(33,this.value)\"><b class=\"option-letter\">A</b> take part in formal interviews.</label><label class=\"paper-option\"><input type=\"radio\" value=\"B\" name=\"q33\" data-q=\"33\" onchange=\"setQ(33,this.value)\"><b class=\"option-letter\">B</b> keep a record of animals they saw.</label><label class=\"paper-option\"><input type=\"radio\" value=\"C\" name=\"q33\" data-q=\"33\" onchange=\"setQ(33,this.value)\"><b class=\"option-letter\">C</b> get in contact when they saw a rare species.</label></div>\n<div class=\"question-item\"><strong class=\"q-number\">34</strong> The group made their observations in gardens<label class=\"paper-option\"><input type=\"radio\" value=\"A\" name=\"q34\" data-q=\"34\" onchange=\"setQ(34,this.value)\"><b class=\"option-letter\">A</b> which had a large number of animal species.</label><label class=\"paper-option\"><input type=\"radio\" value=\"B\" name=\"q34\" data-q=\"34\" onchange=\"setQ(34,this.value)\"><b class=\"option-letter\">B</b> which they considered to be representative.</label><label class=\"paper-option\"><input type=\"radio\" value=\"C\" name=\"q34\" data-q=\"34\" onchange=\"setQ(34,this.value)\"><b class=\"option-letter\">C</b> which had stable populations of rare animals.</label></div>\n<div class=\"question-item\"><strong class=\"q-number\">35</strong> The group did extensive reading on<label class=\"paper-option\"><input type=\"radio\" value=\"A\" name=\"q35\" data-q=\"35\" onchange=\"setQ(35,this.value)\"><b class=\"option-letter\">A</b> wildlife problems in rural areas.</label><label class=\"paper-option\"><input type=\"radio\" value=\"B\" name=\"q35\" data-q=\"35\" onchange=\"setQ(35,this.value)\"><b class=\"option-letter\">B</b> urban animal populations.</label><label class=\"paper-option\"><input type=\"radio\" value=\"C\" name=\"q35\" data-q=\"35\" onchange=\"setQ(35,this.value)\"><b class=\"option-letter\">C</b> current gardening practices.</label></div>\n<div class=\"question-item\"><strong class=\"q-number\">36</strong> The speaker focuses on three animal species because<label class=\"paper-option\"><input type=\"radio\" value=\"A\" name=\"q36\" data-q=\"36\" onchange=\"setQ(36,this.value)\"><b class=\"option-letter\">A</b> a lot of data has been obtained about them.</label><label class=\"paper-option\"><input type=\"radio\" value=\"B\" name=\"q36\" data-q=\"36\" onchange=\"setQ(36,this.value)\"><b class=\"option-letter\">B</b> the group were most interested in them.</label><label class=\"paper-option\"><input type=\"radio\" value=\"C\" name=\"q36\" data-q=\"36\" onchange=\"setQ(36,this.value)\"><b class=\"option-letter\">C</b> they best indicated general trends.</label></div></div>\n<h2 class=\"question-range\">Questions 37-40</h2><div class=\"task-copy\"><p>Complete the table below.</p><p><b>Write ONE WORD ONLY for each answer.</b></p>\n<table><tbody><tr><th>Animals</th><th>Reason for population increase in gardens</th><th>Comments</th></tr>\n<tr><td><span class=\"question-item\"><strong class=\"q-number\">37</strong><input type=\"text\" class=\"paper-input\" data-q=\"37\" autocomplete=\"off\" spellcheck=\"false\" oninput=\"setQ(37,this.value)\"></span></td><td>suitable stretches of water</td><td>massive increase in urban population</td></tr>\n<tr><td>Hedgehogs</td><td>safer from <span class=\"question-item\"><strong class=\"q-number\">38</strong><input type=\"text\" class=\"paper-input\" data-q=\"38\" autocomplete=\"off\" spellcheck=\"false\" oninput state.submission=normalizeSubmission(state.submission);
const $=s=>document.querySelector(s);
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"").replace(/[^a-z0-9]+/g," ").trim();
const identityPart=s=>String(s??"").normalize("NFKC").trim().toLowerCase().replace(/\s+/g," ");
const identityKey=(name,studentClass)=>`${identityPart(name)}|${identityPart(studentClass)}`;
const save=()=>localStorage.setItem(storageKey,JSON.stringify(state));
const scoreKeys=()=>Array.from({length:4},(_,i)=>[`d${i+1}`,`i${i+1}`]).flat();
const partConfirmed=k=>Number.isInteger(state.scores[k])&&typeof state.confirmations[k]==="string"&&!!state.confirmations[k];
const scoresReady=()=>scoreKeys().every(partConfirmed);
const scoreFingerprint=()=>JSON.stringify({week:DATA.week,student:identityKey(state.studentName,state.studentClass),scores:scoreKeys().map(k=>[state.scores[k],state.confirmations[k]])});
function clearScoreRetry(){if(scoreRetryTimer){clearTimeout(scoreRetryTimer);scoreRetryTimer=null}}
function resetSubmission(){clearScoreRetry();scoreRetryAttempt=0;state.submission=freshSubmission()}
function currentScoreKey(){return(stage==="dictation"?"d":stage==="ielts"?"i":"")+(si+1)}
function invalidateScore(key){if(Object.prototype.hasOwnProperty.call(state.scores,key))delete state.scores[key];if(Object.prototype.hasOwnProperty.call(state.confirmations,key))delete state.confirmations[key];resetSubmission()}
function setQ(q,v){state.q[q]=v;invalidateScore(`i${si+1}`);save();gate();scorePanel()}
function setGap(i,v){state.g[`${si+1}-${i}`]=v;invalidateScore(`d${si+1}`);save();gate();scorePanel()}
function setGroup(key,v,box,max){let a=state.q[key]||[];if(box.checked&&!a.includes(v)&&a.length>=max){box.checked=false;return}a=box.checked?[...new Set([...a,v])]:a.filter(x=>x!==v);state.q[key]=a;invalidateScore(`i${si+1}`);save();gate();scorePanel()}
function speak(w){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang="en-GB";speechSynthesis.speak(u)}
function section(){return DATA.sections[si]}
function range(){return [si*10+1,si*10+10]}
function questionGroups(){
  const groups=new Map();
  for(const match of section().questions.matchAll(/data-group="([\d-]+)"/g)){
    const key=match[1];if(!groups.has(key))groups.set(key,key.split("-").map(Number));
  }
  return groups;
}
function audioBox(){return `<b>● AUDIO GỐC · SECTION ${si+1}</b><audio controls preload="metadata" src="${section().audio}"></audio>`}
function complete(){
  if(stage==="dictation")return section().clozeAnswers.every((_,i)=>norm(state.g[`${si+1}-${i}`]));
  const [a,b]=range(),grouped=new Set();
  for(const [key,nums] of questionGroups()){if((state.q[key]||[]).length!==nums.length)return false;nums.forEach(q=>grouped.add(q))}
  for(let q=a;q<=b;q++){if(grouped.has(q))continue;if(!norm(state.q[q]))return false}
  return true;
}
function gate(){const b=$("#partSubmit");if(!b)return;const done=complete(),submitted=partConfirmed(currentScoreKey());if(submitted)document.querySelectorAll("#content input,#content select").forEach(control=>control.disabled=true);b.disabled=submitted||!done;b.textContent=submitted?"✓ ĐÃ XÁC NHẬN NỘP PHẦN NÀY":done?"Xác nhận & nộp bài":stage==="dictation"?"Điền đủ 20/20 chỗ để nộp":"Làm đủ 10/10 câu để nộp"}
function vocab(){return `<div class="vocab-grid">${section().vocab.map(v=>`<article class="vocab-card"><button class="sound" onclick='speak(${JSON.stringify(v.word)})'>◖))</button><h3>${v.word}</h3><div class="ipa">${v.ipa}</div><div class="pos">${v.pos}</div><div class="meaning">${v.meaning}</div><p class="example">${v.example}</p><div class="translation">${v.exampleVi}</div></article>`).join("")}</div>`}
function submissionMessage(){
  const fingerprint=scoreFingerprint();
  const current=state.submission.fingerprint===fingerprint,done=current?scoreParts.filter(part=>state.submission.parts?.[part.key]==="sent").length:0;
  if(current&&done===scoreParts.length)return '<div class="result">✓ Đã tự động gửi đủ điểm Sections 1–4 vào sổ lớp.</div>';
  if(current&&state.submission.status==="sending")return `<div class="result">Đang tự động ghi điểm vào sổ lớp${done?` · đã ghi ${done}/2 nhóm`:""}…</div>`;
  if(current&&state.submission.status==="error")return `<div class="result bad">Mạng đang gián đoạn${done?` · đã giữ an toàn ${done}/2 nhóm điểm`:""}. Hệ thống sẽ chỉ tự gửi lại phần còn thiếu.</div>`;
  return '<div class="result">Đủ 8 phần. Hệ thống đang chuẩn bị tự gửi điểm…</div>';
}
function scoreView(){return `<div class="score-view"><h2>Kết quả Tuần ${DATA.week}</h2><div class="student-summary"><span>${state.studentName.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span><span>${state.studentClass}</span></div><div id="scoreGrid" class="score-grid"></div><div id="scoreStatus">${submissionMessage()}</div></div>`}
function restoreInputs(){
  document.querySelectorAll("[data-q]").forEach(el=>{const q=el.dataset.q;if(el.type==="radio")el.checked=state.q[q]===el.value;else el.value=state.q[q]||""});
  document.querySelectorAll("[data-group]").forEach(el=>el.checked=(state.q[el.dataset.group]||[]).includes(el.value));
  document.querySelectorAll("[data-gap]").forEach(el=>el.value=state.g[`${si+1}-${el.dataset.gap}`]||"");
}
function updateStageTabs(){
  document.querySelectorAll(".stage-tabs button").forEach(b=>{
    b.classList.toggle("on",b.dataset.stage===stage);
    if(b.dataset.stage==="score"){
      b.textContent="D · Kết quả";
      b.disabled=!scoresReady();b.setAttribute("aria-disabled",String(!scoresReady()));
      b.title=scoresReady()?"Xem kết quả":"Hoàn thành và chấm đủ 8 phần để xem kết quả";
    }
  });
}
function render(){
  if(stage==="score"&&!scoresReady())stage="vocab";
  document.querySelectorAll(".section-tabs button").forEach((b,i)=>b.classList.toggle("on",i===si));updateStageTabs();
  if(stage==="vocab")$("#content").innerHTML=vocab();
  if(stage==="dictation")$("#content").innerHTML=`<div class="workspace"><aside class="audio-side">${audioBox()}</aside><div class="scroll-panel transcript">${section().cloze}</div></div><button id="partSubmit" class="submit" onclick="gradeDict()"></button><div id="result"></div>`;
  if(stage==="ielts")$("#content").innerHTML=`<div class="workspace"><aside class="audio-side">${audioBox()}</aside><div class="scroll-panel">${section().questions}</div></div><button id="partSubmit" class="submit" onclick="gradeIelts()"></button><div id="result"></div>`;
  if(stage==="score")$("#content").innerHTML=scoreView();
  restoreInputs();gate();scorePanel();if(stage==="score"&&scoresReady())void ensureScoresSubmitted();
}
function confirmPart(total,label){return window.confirm(`Em đã làm đủ ${total} ${label}. Xác nhận nộp phần này để chấm điểm và khóa kết quả?`)}
function finishPart(){save();gate();scorePanel();updateStageTabs();void ensureScoresSubmitted();if(scoresReady()){stage="score";render()}}
function gradeDict(){
  if(!complete()||!confirmPart(20,"chỗ chính tả"))return;let ok=0;
  section().clozeAnswers.forEach((a,i)=>{const input=document.querySelector(`[data-gap="${i}"]`),good=norm(state.g[`${si+1}-${i}`])===norm(a);input.classList.toggle("good",good);input.classList.toggle("bad",!good);if(good)ok++});
  const scoreKey=`d${si+1}`;resetSubmission();state.scores[scoreKey]=ok;state.confirmations[scoreKey]=new Date().toISOString();
  $("#result").innerHTML=`<div class="result"><b>${ok}/20</b> · Sai ${20-ok} chỗ. Đáp án đã hiện trực tiếp trên phần sai sau khi nộp.</div>`;
  section().clozeAnswers.forEach((a,i)=>{const input=document.querySelector(`[data-gap="${i}"]`);if(input.classList.contains("bad"))input.value=a});finishPart();
}
function gradeIelts(){
  if(!complete()||!confirmPart(10,"câu IELTS"))return;const [a,b]=range();let ok=0,grouped=new Set();
  for(const [key,nums] of questionGroups()){
    const chosen=state.q[key]||[],valid=new Set(nums.flatMap(q=>DATA.answers[q]).map(norm));
    ok+=chosen.filter(x=>valid.has(norm(x))).length;nums.forEach(q=>grouped.add(q));
    document.querySelectorAll(`[data-group="${key}"]`).forEach(el=>el.closest("td,.question-item,.paper-option")?.classList.add(valid.has(norm(el.value))?"good":"bad"));
  }
  for(let q=a;q<=b;q++){
    if(grouped.has(q))continue;const valid=DATA.answers[q].map(norm),good=valid.includes(norm(state.q[q]));if(good)ok++;
    document.querySelectorAll(`[data-q="${q}"]`).forEach(el=>el.closest("td,.question-item,.paper-option")?.classList.add(good?"good":"bad"));
  }
  const scoreKey=`i${si+1}`;resetSubmission();state.scores[scoreKey]=ok;state.confirmations[scoreKey]=new Date().toISOString();
  $("#result").innerHTML=`<div class="result"><b>${ok}/10</b> · Em làm sai ${10-ok} câu. Hãy nghe lại Section ${si+1} và đối chiếu phần vừa làm.</div>`;finishPart();
}
function scorePanel(){
  const grid=$("#scoreGrid");if(grid)grid.innerHTML=scoreKeys().map(k=>`<div class="score"><small>${k[0]==="d"?"Chính tả":"IELTS"} · Section ${k.slice(1)}</small><br><b>${partConfirmed(k)?state.scores[k]:"—"}/${k[0]==="d"?20:10}</b></div>`).join("");
  updateStageTabs();const status=$("#scoreStatus");if(status)status.innerHTML=submissionMessage();
}
function scorePayload(label,a,b){
  const p=new URLSearchParams();p.set(DATA.form.week,label);p.set(DATA.form.name,state.studentName.trim());p.set(DATA.form.studentClass,state.studentClass);
  p.set(DATA.form.d1,String(state.scores[`d${a}`]));p.set(DATA.form.i1,String(state.scores[`i${a}`]));p.set(DATA.form.d2,String(state.scores[`d${b}`]));p.set(DATA.form.i2,String(state.scores[`i${b}`]));
  p.set(DATA.form.total,String(state.scores[`d${a}`]+state.scores[`i${a}`]+state.scores[`d${b}`]+state.scores[`i${b}`]));return p;
}
function scheduleScoreRetry(){
  if(scoreRetryTimer||state.submission.status==="sent")return;
  const delays=[5000,15000,30000,60000],delay=delays[Math.min(scoreRetryAttempt,delays.length-1)];scoreRetryAttempt++;
  scoreRetryTimer=setTimeout(()=>{scoreRetryTimer=null;if(scoresReady())void ensureScoresSubmitted()},delay);
}
async function ensureScoresSubmitted(){
  if(!scoresReady()||!state.studentName.trim()||!state.studentClass)return false;
  const fingerprint=scoreFingerprint();
  if(state.submission.fingerprint!==fingerprint)state.submission=freshSubmission(fingerprint);
  if(scoreParts.every(part=>state.submission.parts[part.key]==="sent")){state.submission.status="sent";return true}
  if(scoreSendPromise)return scoreSendPromise;
  clearScoreRetry();state.submission.status="sending";state.submission.sentAt="";save();scorePanel();
  scoreSendPromise=(async()=>{
    try{
      for(const part of scoreParts){
        if(state.submission.parts[part.key]==="sent")continue;
        state.submission.parts[part.key]="sending";save();scorePanel();
        await fetch(DATA.form.url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:scorePayload(part.label(),part.a,part.b).toString()});
        state.submission.parts[part.key]="sent";save();scorePanel();
      }
      state.submission.status="sent";state.submission.sentAt=new Date().toISOString();scoreRetryAttempt=0;save();scorePanel();return true;
    }catch{
      scoreParts.forEach(part=>{if(state.submission.parts[part.key]==="sending")state.submission.parts[part.key]="error"});
      state.submission.status="error";state.submission.sentAt="";save();scorePanel();scheduleScoreRetry();return false;
    }
    finally{scoreSendPromise=null}
  })();return scoreSendPromise;
}
$("#sectionTabs").innerHTML=DATA.sections.map((s,i)=>`<button onclick="si=${i};stage='vocab';render()">SECTION ${s.number}<br><small>Questions ${(s.number-1)*10+1}–${s.number*10}</small></button>`).join("");
document.querySelectorAll(".stage-tabs button").forEach(b=>b.onclick=()=>{if(b.dataset.stage==="score"&&!scoresReady())return;stage=b.dataset.stage;render()});
const entryName=$("#entryName"),entryClass=$("#entryClass"),enterTest=$("#enterTest");entryName.value=state.studentName;entryClass.value=state.studentClass;
function updateEntryGate(){const ready=entryName.value.trim()&&entryClass.value;enterTest.disabled=!ready;enterTest.textContent=ready?"Vào Listening Test":"Nhập họ tên và chọn lớp để vào bài"}
function openTest(){
  const name=entryName.value.trim(),studentClass=entryClass.value;if(!name||!studentClass)return;
  const previousKey=state.studentKey||identityKey(state.studentName,state.studentClass),nextKey=identityKey(name,studentClass);
  if(previousKey&&previousKey!==nextKey){state.q={};state.g={};state.scores={};state.confirmations={};resetSubmission()}
  state.studentName=name;state.studentClass=studentClass;state.studentKey=nextKey;save();$("#entryGate").hidden=true;$("#testApp").hidden=false;render();if(scoresReady())void ensureScoresSubmitted();
}
entryName.oninput=updateEntryGate;entryClass.onchange=updateEntryGate;enterTest.onclick=openTest;entryName.onkeydown=e=>{if(e.key==="Enter"&&!enterTest.disabled)openTest()};
window.addEventListener("online",()=>{clearScoreRetry();if(scoresReady())void ensureScoresSubmitted()});updateEntryGate();render();
</script></body></html>
