</style></head><body><section id="entryGate" class="entry-screen"><div class="entry-card"><header class="entry-head"><small>IELTS - NGHE · TUẦN 35</small><h1>Listening Test 25</h1><p>Điền thông tin học sinh trước khi vào bài.</p></header><div class="entry-body"><p class="entry-note">Họ tên và lớp sẽ được giữ lại để gửi điểm sau khi hoàn thành bài.</p><label for="entryName">Họ và tên học sinh</label><input id="entryName" type="text" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"><label for="entryClass">Lớp IELTS</label><select id="entryClass"><option value="">Chọn lớp IELTS</option><option>IELTS 40</option><option>IELTS 41</option><option>IELTS 42</option><option>IELTS 43</option><option>IELTS 44</option><option>IELTS 45</option><option>IELTS 46</option><option>IELTS 47</option><option>IELTS 48</option><option>IELTS 49</option><option>IELTS 50</option><option>IELTS 51</option><option>IELTS 52</option><option>IELTS 53</option></select><button id="enterTest" type="button" disabled>Nhập họ tên và chọn lớp để vào bài</button></div></div></section><div id="testApp" hidden><header class="hero"><small>IELTS - NGHE · TUẦN 35</small><h1>Listening Test 25</h1><p>Full Test · Sections 1–4 · 40 questions</p></header><main class="shell"><nav id="sectionTabs" class="section-tabs"></nav><nav class="stage-tabs"><button type="button" data-stage="vocab">A · Từ vựng cần lưu ý</button><button type="button" data-stage="dictation">B · Điền chính tả</button><button type="button" data-stage="ielts">C · Câu hỏi IELTS</button><button type="button" data-stage="score">D · Nộp bài</button></nav><section id="content" class="lesson"></section></main></div><script>const DATA={"week":35,"test":25,"sourceRef":"Cambridge IELTS 15 Academic Listening Test 1","answers":{"1":["Jamieson"],"2":["afternoon"],"3":["communication"],"4":["week"],"5":["10","ten"],"6":["suit"],"7":["passport"],"8":["personality"],"9":["feedback"],"10":["time"],"11":["A"],"12":["B"],"13":["A"],"14":["C"],"15":["river"],"16":["1422"],"17":["top"],"18":["pass"],"19":["steam"],"20":["capital"],"21":["G"],"22":["F"],"23":["A"],"24":["E"],"25":["B"],"26":["C"],"27":["C"],"28":["A"],"29":["B","D"],"30":["B","D"],"31":["shelter"],"32":["oil"],"33":["roads"],"34":["insects"],"35":["grass","grasses"],"36":["water"],"37":["soil"],"38":["dry"],"39":["simple"],"40":["nest","nests"]},"sections":[{"number":1,"transcript":["AMBER: Hello William. This is Amber – you said to phone if I wanted to get more information about the job agency you mentioned. Is now a good time?","WILLIAM: Oh, hi Amber. Yes. Fine. So the agency I was talking about is called Bankside – they’re based in Docklands – I can tell you the address now – 497 Eastside.","AMBER: OK, thanks. So is there anyone in particular I should speak to there?","WILLIAM: The agent I always deal with is called Becky Jamieson.","AMBER: Let me write that down – Becky …","WILLIAM: Jamieson J-A-M-I-E-S-O-N.","AMBER: Do you have her direct line?","WILLIAM: Yes, it’s in my contacts somewhere – right, here we are: 078 double 6, 510 triple 3. I wouldn’t call her until the afternoon if I were you – she’s always really busy in the morning trying to fill last-minute vacancies. She’s really helpful and friendly so I’m sure it would be worth getting in touch with her for an informal chat.","AMBER: It’s mainly clerical and admin jobs they deal with, isn’t it?","WILLIAM: That’s right. I know you’re hoping to find a full-time job in the media eventually – but Becky mostly recruits temporary staff for the finance sector – which will look good on your CV – and generally pays better too.","AMBER: Yeah – I’m just a bit worried because I don’t have much office experience.","WILLIAM: I wouldn’t worry. They’ll probably start you as a receptionist, or something like that. So what’s important for that kind of job isn’t so much having business skills or knowing lots of different computer systems – it’s communication that really matters – so you’d be fine there. And you’ll pick up office skills really quickly on the job. It’s not that complicated.","AMBER: OK good. So how long do people generally need temporary staff for? It would be great if I could get something lasting at least a month.","WILLIAM: That shouldn’t be too difficult. But you’re more likely to be offered something for a week at first, which might get extended. It’s unusual to be sent somewhere for just a day or two.","AMBER: Right, I’ve heard the pay isn’t too bad – better than working in a shop or a restaurant.","WILLIAM: Oh yes – definitely. The hourly rate is about £10, 11 if you’re lucky.","AMBER: That’s pretty good. I was only expecting to get eight or nine pounds an hour.","————————————————","WILLIAM: Do you want me to tell you anything about the registration process?","AMBER: Yes, please. I know you have to have an interview.","WILLIAM: The interview usually takes about an hour and you should arrange that about a week in advance.","AMBER: I suppose I should dress smartly if it’s for office work – I can probably borrow a suit from Mum.","WILLIAM: Good idea. It’s better to look too smart than too casual.","AMBER: Will I need to bring copies of my exam certificates or anything like that?","WILLIAM: No – they don’t need to see those, I don’t think.","AMBER: What about my passport?","WILLIAM: Oh yes – they will ask to see that.","AMBER: OK.","WILLIAM: I wouldn’t get stressed about the interview though. It’s just a chance for them to build a relationship with you – so they can try and match you to a job which you’ll like. So there are questions about personality that they always ask candidates – fairly basic ones. And they probably won’t ask anything too difficult like what your plans are for the future.","AMBER: Hope not.","WILLIAM: Anyway, there are lots of benefits to using an agency – for example, the interview will be useful because they’ll give you feedback on your performance so you can improve next time.","AMBER: And they’ll have access to jobs which aren’t advertised.","WILLIAM: Exactly – most temporary jobs aren’t advertised.","AMBER: And I expect finding a temporary job this way takes a lot less time – it’s much easier than ringing up individual companies.","WILLIAM: Yes indeed. Well I think …"],"cloze":"<p>AMBER: Hello William. This is Amber – you said to phone if I <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> about the job agency you mentioned. Is now a good time?</p><p>WILLIAM: Oh, hi Amber. Yes. Fine. So the agency I was talking about is called <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> – I can tell you the address now – 497 Eastside.</p><p>AMBER: OK, thanks. So is there anyone in particular I should speak to there?</p><p>WILLIAM: The agent I always deal with is <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>.</p><p>AMBER: Let me write that down – Becky …</p><p>WILLIAM: Jamieson J-A-M-I-E-S-O-N.</p><p>AMBER: Do you have her direct line?</p><p>WILLIAM: Yes, it’s in my contacts somewhere – right, here we are: 078 double 6, 510 triple 3. I wouldn’t call her until the afternoon if I were you – she’s always really busy in the morning trying <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>. She’s really helpful and friendly so I’m sure it would be worth getting in touch with her for an informal chat.</p><p>AMBER: It’s <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> they deal with, isn’t it?</p><p>WILLIAM: That’s right. I know you’re hoping to find a full-time job in the media eventually – but <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span> for the finance sector – which will look good on your CV – and <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span> too.</p><p>AMBER: Yeah – I’m just a bit worried because I don’t have much office experience.</p><p>WILLIAM: I wouldn’t worry. They’ll probably start you as a receptionist, or something like that. So what’s important for that kind of job isn’t so much having business skills or knowing lots of different computer systems – it’s <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span> – so you’d be fine there. And you’ll pick up office skills really quickly on the job. It’s not that complicated.</p><p>AMBER: OK good. So how long do <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span> for? It would be great if I could get <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>.</p><p>WILLIAM: That shouldn’t be too difficult. But you’re more likely to be offered something for a week at first, which might get extended. It’s unusual to be <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span>.</p><p>AMBER: Right, I’ve heard the pay isn’t too bad – better than working in a shop or a restaurant.</p><p>WILLIAM: <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span>. The hourly rate is about £10, 11 if you’re lucky.</p><p>AMBER: That’s pretty good. I was only expecting to get eight or nine pounds an hour.</p><p>————————————————</p><p>WILLIAM: Do you want me to tell you <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span>?</p><p>AMBER: Yes, please. I know you have to have an interview.</p><p>WILLIAM: The interview usually takes about an hour and you should arrange that about a week in advance.</p><p>AMBER: I suppose I should dress smartly if it’s for office work – I can <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span> from Mum.</p><p>WILLIAM: Good idea. It’s better to look too smart than too casual.</p><p>AMBER: Will I need to bring copies of my <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span> like that?</p><p>WILLIAM: No – they don’t need to see those, I don’t think.</p><p>AMBER: What about my passport?</p><p>WILLIAM: Oh yes – they will ask to see that.</p><p>AMBER: OK.</p><p>WILLIAM: <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span> though. It’s just a chance for them to build a relationship with you – so they can try and match you to a job which you’ll like. So there are <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> – fairly basic ones. And they probably won’t ask anything too difficult like what your plans are for the future.</p><p>AMBER: Hope not.</p><p>WILLIAM: Anyway, there are lots of benefits to using an agency – for example, <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span> because they’ll give you feedback on your performance so you can improve next time.</p><p>AMBER: And they’ll have access to jobs which aren’t advertised.</p><p>WILLIAM: Exactly – most <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span>.</p><p>AMBER: And I expect finding a temporary job this way takes a lot less time – it’s much easier than <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>.</p><p>WILLIAM: Yes indeed. Well I think …</p>","clozeAnswers":["wanted to get more information","Bankside – they’re based in Docklands","called Becky Jamieson","to fill last-minute vacancies","mainly clerical and admin jobs","Becky mostly recruits temporary staff","generally pays better","communication that really matters","people generally need temporary staff","something lasting at least a month","sent somewhere for just a day or two","Oh yes – definitely","anything about the registration process","probably borrow a suit","exam certificates or anything","I wouldn’t get stressed about the interview","questions about personality that they always ask candidates","the interview will be useful","temporary jobs aren’t advertised","ringing up individual companies"],"vocab":[{"word":"relationship","ipa":"/ɹɪˈleɪʃ(ə)nʃɪp/","pos":"Danh từ (n)","meaning":"quan hệ","example":"It’s just a chance for them to build a relationship with you – so they can try and match you to a job which you’ll like.","exampleVi":"Trong câu trên, “relationship” mang nghĩa “quan hệ”."},{"word":"advertise","ipa":"/ˈadvə(ɹ)taɪz/","pos":"Động từ (v)","meaning":"quảng cáo","example":"And they’ll have access to jobs which aren’t advertised.","exampleVi":"Trong câu trên, “advertise” mang nghĩa “quảng cáo”."},{"word":"definitely","ipa":"/ˈdɛf.nɪt.li/","pos":"Trạng từ (adv)","meaning":"chắc chắn là","example":"Oh yes – definitely.","exampleVi":"Trong câu trên, “definitely” mang nghĩa “chắc chắn là”."},{"word":"eventually","ipa":"/ɪˈventʃuəli/","pos":"Trạng từ (adv)","meaning":"cuối cùng/rốt cuộc","example":"I know you’re hoping to find a full-time job in the media eventually – but Becky mostly recruits temporary staff for the finance sector – which will look good on your CV – and generally pays better too.","exampleVi":"Trong câu trên, “eventually” mang nghĩa “cuối cùng/rốt cuộc”."},{"word":"company","ipa":"/ˈkʌmp(ə)ni/","pos":"Danh từ (n)","meaning":"công ty","example":"And I expect finding a temporary job this way takes a lot less time – it’s much easier than ringing up individual companies.","exampleVi":"Trong câu trên, “company” mang nghĩa “công ty”."},{"word":"difficult","ipa":"/ˈdɪfɪkəlt/","pos":"Tính từ (adj)","meaning":"khó","example":"That shouldn’t be too difficult.","exampleVi":"Trong câu trên, “difficult” mang nghĩa “khó”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 1-10</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the notes below.</p>\n<p>Write ONE WORD AND/OR A NUMBER for each answer.</p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Bankside Recruitment Agency</strong></strong></p>\n<ul>\n<li>Address of agency: 497 Eastside, Docklands</li>\n<li>Name of agent: Becky <span class=\"question-item\"><strong class=\"q-number\">1</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"1\" oninput=\"setQ(1,this.value)\"></span></li>\n<li>Phone number: 07866 510333</li>\n<li>Best to call her in the <span class=\"question-item\"><strong class=\"q-number\">2</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"2\" oninput=\"setQ(2,this.value)\"></span></li>\n</ul>\n<p><strong>Typical jobs</strong></p>\n<ul>\n<li>Clerical and admin roles, mainly in the finance industry</li>\n<li>Must have good <span class=\"question-item\"><strong class=\"q-number\">3</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"3\" oninput=\"setQ(3,this.value)\"></span>&nbsp;skills</li>\n<li>Jobs are usually for at least one <span class=\"question-item\"><strong class=\"q-number\">4</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"4\" oninput=\"setQ(4,this.value)\"></span></li>\n<li>Pay is usually £<span class=\"question-item\"><strong class=\"q-number\">5</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"5\" oninput=\"setQ(5,this.value)\"></span> per hour</li>\n</ul>\n<p><strong>Registration process</strong></p>\n<ul>\n<li>Wear a <span class=\"question-item\"><strong class=\"q-number\">6</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"6\" oninput=\"setQ(6,this.value)\"></span>&nbsp;to the interview</li>\n<li>Must bring your <span class=\"question-item\"><strong class=\"q-number\">7</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"7\" oninput=\"setQ(7,this.value)\"></span>&nbsp;to the interview</li>\n<li>They will ask questions about each applicant’s <span class=\"question-item\"><strong class=\"q-number\">8</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"8\" oninput=\"setQ(8,this.value)\"></span></li>\n</ul>\n<p><strong>Advantages of using an agency</strong></p>\n<ul>\n<li>The <span class=\"question-item\"><strong class=\"q-number\">9</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"9\" oninput=\"setQ(9,this.value)\"></span>&nbsp;you receive at interview will benefit you</li>\n<li>Will get access to vacancies which are not advertised</li>\n<li>Less <span class=\"question-item\"><strong class=\"q-number\">10</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"10\" oninput=\"setQ(10,this.value)\"></span>&nbsp;is involved in applying for jobs</li>\n</ul>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-25/section-1.mp3"},{"number":2,"transcript":["Good morning. My name’s Erica Matthews, and I’m the owner of Matthews Island Holidays, a company set up by my parents. Thank you for coming to this presentation, in which I hope to interest you in what we have to offer. We’re a small, family-run company, and we believe in the importance of the personal touch, so we don’t aim to compete with other companies on the number of customers. What we do is build on our many years’ experience – more than almost any other rail holiday company – to ensure we provide perfect holidays in a small number of destinations, which we’ve got to know extremely well.","I’ll start with our six-day Isle of Man holiday. This is a fascinating island in the Irish Sea, with Wales to the south, England to the east, Scotland to the north and Northern Ireland to the west. Our holiday starts in Heysham, where your tour manager will meet you, then you’ll travel by ferry to the Isle of Man. Some people prefer to fly from Luton instead, and another popular option is to go by train to Liverpool and take a ferry from there.","You have five nights in the hotel, and the price covers five breakfasts and dinners, and lunch on the three days when there are organised trips: day four is free, and most people have lunch in a café or restaurant in Douglas.","The price of the holiday includes the ferry to the Isle of Man, all travel on the island, the hotel, and the meals I’ve mentioned. Incidentally, we try to make booking our holidays as simple and fair as possible, so unlike with many companies, the price is the same whether you book six months in advance or at the last minute, and there’s no supplement for single rooms in hotels. If you make a booking then need to change the start date, for example because of illness, you’re welcome to change to an alternative date or a different tour, for a small administrative fee.","——————————","OK, so what does the holiday consist of? Well, on day one you’ll arrive in time for a short introduction by your tour manager, followed by dinner in the hotel. The dining room looks out at the river, close to where it flows into the harbour, and there’s usually plenty of activity going on.","On day two you’ll take the coach to the small town of Peel, on the way calling in at the Tynwald Exhibition. The Isle of Man isn’t part of the United Kingdom, and it has its own parliament, called Tynwald. It’s claimed that this is the world’s oldest parliament that’s still functioning, and that it dates back to 979. However, the earliest surviving reference to it is from 1422, so perhaps it isn’t quite as old as it claims!","Day three we have a trip to the mountain Snaefell. This begins with a leisurely ride along the promenade in Douglas in a horse-drawn tram. Then you board an electric train which takes you to the fishing village of Laxey. From there it’s an eight-kilometre ride in the Snaefell Mountain Railway to the top. Lunch will be in the café, giving you spectacular views of the island.","Day four is free for you to explore, using the pass which we’ll give you. So you won’t have to pay for travel on local transport, or for entrance to the island’s heritage sites. Or you might just want to take it easy in Douglas and perhaps do a little light shopping.","The last full day, day five, is for some people the highlight of the holiday, with a ride on the steam railway, from Douglas to Port Erin. After some time to explore, a coach will take you to the headland that overlooks the Calf of Man, a small island just off the coast. From there you continue to Castletown, which used to be the capital of the Isle of Man, and its mediaeval castle.","And on day six it’s back to the ferry – or the airport, if you flew to the island – and time to go home.","Now I’d like to tell you …"],"cloze":"<p>Good morning. My name’s Erica Matthews, and I’m the owner of <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> set up by my parents. Thank you for coming to this presentation, in which I hope to interest you in what we have to offer. We’re a small, family-run company, and we believe in the <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>, so we don’t aim to compete with other companies on the number of customers. What we do is build on our many years’ experience – more than almost any other rail holiday company – to <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span> in a small number of destinations, which we’ve got to know extremely well.</p><p>I’ll start with our six-day Isle of Man holiday. This is <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>, with Wales to the south, England to the east, <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span>. Our holiday starts in Heysham, where your tour manager will meet you, then you’ll travel by ferry to the Isle of Man. Some people prefer to fly from Luton instead, and <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span> to Liverpool and take a ferry from there.</p><p>You have five nights in the hotel, and the price covers five breakfasts and dinners, and lunch on the three days when there are organised trips: day four is free, and most people have lunch in a café or restaurant in Douglas.</p><p>The price of the <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span> to the Isle of Man, all travel on the island, the hotel, and the meals I’ve mentioned. Incidentally, we try to <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>, so unlike with many companies, the price is the same whether you book six months in advance or at the last minute, and there’s no <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span> in hotels. If you make a booking then need to change the start date, for example because of illness, you’re welcome to change to an alternative date or a different tour, for a <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>.</p><p>——————————</p><p>OK, so what does the holiday consist of? Well, on day one you’ll arrive in time for a short introduction by <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span> in the hotel. The dining room looks out at the river, close to where it flows into the harbour, and there’s usually <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span>.</p><p>On day two you’ll take the coach to the small town of Peel, on the way calling in at the Tynwald Exhibition. The Isle of Man isn’t part of the United Kingdom, and it has its own parliament, called Tynwald. It’s claimed that this is <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span>, and that it dates back to 979. However, the <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span> is from 1422, so perhaps it isn’t quite as old as it claims!</p><p>Day three we have a trip to the mountain Snaefell. This begins with a <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span> in Douglas in a horse-drawn tram. Then you board an electric train which takes you to the fishing village of Laxey. From there it’s an eight-kilometre ride in the <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span> to the top. Lunch will be in the café, giving you spectacular views of the island.</p><p>Day four is free for you to explore, using the pass which we’ll give you. So you won’t have to pay for travel on local transport, or for <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> sites. Or you might just want to take it easy in Douglas and perhaps do a <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>.</p><p>The last full day, day five, is for some people the highlight of the holiday, with a ride on the steam railway, from Douglas to Port Erin. After some time to explore, a coach will take you to the headland that overlooks the Calf of Man, a small island just off the coast. From there you continue to <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> of the Isle of Man, and <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>.</p><p>And on day six it’s back to the ferry – or the airport, if you flew to the island – and time to go home.</p><p>Now I’d like to tell you …</p>","clozeAnswers":["Matthews Island Holidays, a company","importance of the personal touch","ensure we provide perfect holidays","a fascinating island in the Irish Sea","Scotland to the north and Northern Ireland to the west","another popular option is to go by train","holiday includes the ferry","make booking our holidays as simple and fair as possible","supplement for single rooms","small administrative fee","your tour manager, followed by dinner","plenty of activity going on","the world’s oldest parliament that’s still functioning","earliest surviving reference to it","leisurely ride along the promenade","Snaefell Mountain Railway","entrance to the island’s heritage","little light shopping","Castletown, which used to be the capital","its mediaeval castle"],"vocab":[{"word":"administrative","ipa":"/ədˈmɪ.nɪs.tɹəˌtɪv/","pos":"Tính từ (adj)","meaning":"hành chính","example":"If you make a booking then need to change the start date, for example because of illness, you’re welcome to change to an alternative date or a different tour, for a small administrative fee.","exampleVi":"Trong câu trên, “administrative” mang nghĩa “hành chính”."},{"word":"alternative","ipa":"/ɒl.ˈtɜː(ɹ).nə.tɪv/","pos":"Tính từ (adj)","meaning":"thay thế","example":"If you make a booking then need to change the start date, for example because of illness, you’re welcome to change to an alternative date or a different tour, for a small administrative fee.", plete=\"off\" class=\"paper-input\" data-q=\"16\" oninput=\"setQ(16,this.value)\"></span>&nbsp;not 979.</td>\n</tr>\n<tr>\n<td width=\"60\">Day 3</td>\n<td width=\"204\">Trip to Snaefell</td>\n<td width=\"246\">Travel along promenade in a tram; train to Laxey; train to the <span class=\"question-item\"><strong class=\"q-number\">17</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"17\" oninput=\"setQ(17,this.value)\"></span>&nbsp;of Snaefell</td>\n</tr>\n<tr>\n<td width=\"60\">Day 4</td>\n<td width=\"204\">\n<p>Free day</p>\n</td>\n<td width=\"246\">Company provides a <span class=\"question-item\"><strong class=\"q-number\">18</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"18\" oninput=\"setQ(18,this.value)\"></span>&nbsp;for local transport and heritage sites.</td>\n</tr>\n<tr>\n<td width=\"60\">Day 5</td>\n<td width=\"204\">Take the <span class=\"question-item\"><strong class=\"q-number\">19</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"19\" oninput=\"setQ(19,this.value)\"></span>&nbsp;railway train from Douglas to Port Erin</td>\n<td width=\"246\">Free time, then coach to Castletown – former <span class=\"question-item\"><strong class=\"q-number\">20</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"20\" oninput=\"setQ(20,this.value)\"></span>&nbsp;has old castle.</td>\n</tr>\n<tr>\n<td width=\"60\">Day 6</td>\n<td width=\"204\">Leave</td>\n<td width=\"246\">Leave the island by ferry or plane</td>\n</tr>\n</tbody>\n</table>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-25/section-2.mp3"},{"number":3,"transcript":["RUTH: Ed, how are you getting on with the reading for our presentation next week?","ED: Well, OK, Ruth – but there’s so much of it.","RUTH: I know, I hadn’t realised birth order was such a popular area of research.","ED: But the stuff on birth order and personality is mostly unreliable. From what I’ve been reading a lot of claims about how your position in the family determines certain personality traits are just stereotypes, with no robust evidence to support them.","RUTH: OK, but that’s an interesting point – we could start by outlining what previous research has shown. There are studies going back over a hundred years.","ED: Yeah – so we could just run through some of the typical traits. Like the consensus seems to be that oldest children are generally less well-adjusted because they never get over the arrival of a younger sibling.","RUTH: Right, but on a positive note, some studies claimed that they were thought to be good a nurturing – certainly in the past when people had large families they would have been expected to look after the younger ones.","ED: There isn’t such a clear picture for middle children – but one trait that a lot of the studies mention is that they are easier to get on with than older or younger siblings.","RUTH: Generally eager to please and helpful – although that’s certainly not accurate as far as my family goes – my middle brother was a nightmare – always causing fights and envious of whatever I had.","ED: As I said – none of this seems to relate to my own experience. I’m the youngest in my family and I don’t recognise myself in any of the studies I’ve read about. I’m supposed to have been a sociable and confident child who made friends easily – but I was actually terribly shy.","RUTH: Really? That’s funny. There have been hundreds of studies on twins but mostly about nurture versus nature…","ED: There was one on personality, which said that a twin is likely to be quite shy in social situations because they always have their twin around to depend on for support.","RUTH: My cousins were like that when they were small – they were only interested in each other and found it hard to engage with other kids. They’re fine now though.","ED: Only children have had a really bad press – a lot of studies have branded them as loners who think the world revolves around them because they’ve never had to fight for their parents’ attention.","RUTH: That does seem a bit harsh. One category I hadn’t considered before was children with much older siblings – a couple of studies mentioned that these children grow up more quickly and are expected to do basic things for themselves – like getting dressed.","ED: I can see how that might be true – although I expect they’re sometimes the exact opposite – playing the baby role and clamouring for special treatment.","——————————","RUTH: What was the problem with most of these studies, do you think?","ED: I think it was because in a lot of cases data was collected from only one sibling per family, who rated him or herself and his or her siblings at the same time.","RUTH: Mmm. Some of the old research into the relationship between birth order and academic achievement has been proved to be accurate though. Performances in intelligence tests decline slightly from the eldest child to his or her younger siblings. This has been proved in lots of recent studies.","ED: Yes. Although what many of them didn’t take into consideration was family size. The more siblings there are, the likelier the family is to have a low socioeconomic status – which can also account for differences between siblings in academic performance.","RUTH: The oldest boy might be given more opportunities than his younger sisters, for example.","ED: Exactly.","RUTH: But the main reason for the marginally higher academic performance of oldest children is quite surprising, I think. It’s not only that they benefit intellectually from extra attention at a young age – which is what I would have expected. It’s that they benefit from being teachers for their younger siblings, by verbalising processes.","ED: Right, and this gives them status and confidence, which again contribute, in a small way, to better performance.","So would you say sibling rivalry has been a useful thing for you?","RUTH: I think so – my younger brother was incredibly annoying and we found a lot but I think this has made me a stronger person. I know how to defend myself. We had some terrible arguments and I would have died rather than apologise to him – but we had to put up with each other and most of the time we co-existed amicably enough.","ED: Yes, my situation was pretty similar. But I don’t think having two older brothers made me any less selfish – I was never prepared to let me brothers use any of my stuff …","RUTH: That’s perfectly normal, whereas …"],"cloze":"<p>RUTH: Ed, how are you getting on with the <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>?</p><p>ED: Well, OK, Ruth – but there’s so much of it.</p><p>RUTH: I know, I hadn’t realised birth order was such a popular area of research.</p><p>ED: But the stuff on birth order and personality is mostly unreliable. From what I’ve been reading a lot of claims about how your position in the <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> are just stereotypes, with no robust evidence to support them.</p><p>RUTH: OK, but that’s an interesting point – we could start by <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>. There are studies going back over a hundred years.</p><p>ED: Yeah – so we could just run through some of the typical traits. Like the consensus seems to be that <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> because they never get over the arrival of a younger sibling.</p><p>RUTH: Right, but on a positive note, some studies claimed that they were thought to be good a nurturing – certainly in the past when people had large families they would have been expected to look after the younger ones.</p><p>ED: There isn’t such a <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> – but one trait that a lot of the studies mention is that they are easier to get on with than older or younger d to put up with each other"],"vocab":[{"word":"consideration","ipa":"/kənˌsɪdəˈɹeɪʃən/","pos":"Danh từ (n)","meaning":"cân nhắc","example":"Although what many of them didn’t take into consideration was family size.","exampleVi":"Trong câu trên, “consideration” mang nghĩa “cân nhắc”."},{"word":"apologise","ipa":"/əˈpɒləˌdʒaɪz/","pos":"Động từ (v)","meaning":"xin lỗi","example":"We had some terrible arguments and I would have died rather than apologise to him – but we had to put up with each other and most of the time we co-existed amicably enough.","exampleVi":"Trong câu trên, “apologise” mang nghĩa “xin lỗi”."},{"word":"category","ipa":"/ˈkætəˌɡɔɹi/","pos":"Danh từ (n)","meaning":"nhóm/loại","example":"One category I hadn’t considered before was children with much older siblings – a couple of studies mentioned that these children grow up more quickly and are expected to do basic things for themselves – like getting dressed.","exampleVi":"Trong câu trên, “category” mang nghĩa “nhóm/loại”."},{"word":"evidence","ipa":"/ˈevɪdəns/","pos":"Danh từ (n)","meaning":"bằng chứng","example":"From what I’ve been reading a lot of claims about how your position in the family determines certain personality traits are just stereotypes, with no robust evidence to support them.","exampleVi":"Trong câu trên, “evidence” mang nghĩa “bằng chứng”."},{"word":"previous","ipa":"/ˈpɹiːvɪəs/","pos":"Tính từ (adj)","meaning":"trước","example":"OK, but that’s an interesting point – we could start by outlining what previous research has shown.","exampleVi":"Trong câu trên, “previous” mang nghĩa “trước”."},{"word":"terrible","ipa":"/ˈtɛ.ɹə.bl̩/","pos":"Tính từ (adj)","meaning":"khủng khiếp","example":"We had some terrible arguments and I would have died rather than apologise to him – but we had to put up with each other and most of the time we co-existed amicably enough.","exampleVi":"Trong câu trên, “terrible” mang nghĩa “khủng khiếp”."}],"questions":"<div class=\"exam-section\"> stion-list\">\n                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">27</strong> <span>What do the speakers say about the evidence relating to birth order and academic success?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q27\" value=\"A\" data-q=\"27\" onchange=\"setQ(27,this.value)\"><span>There is conflicting evidence about whether oldest children perform best in intelligence tests.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q27\" value=\"B\" data-q=\"27\" onchange=\"setQ(27,this.value)\"><span>There is little doubt that birth order has less influence on academic achievement than socio-economic status.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q27\" value=\"C\" data-q=\"27\" onchange=\"setQ(27,this.value)\"><span>Some studies have neglected to include important factors such as family size.</span></div>                                                                                                                                                    </div>\n
