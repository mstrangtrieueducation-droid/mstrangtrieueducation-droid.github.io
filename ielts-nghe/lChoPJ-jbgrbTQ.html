</style></head><body><section id="entryGate" class="entry-screen"><div class="entry-card"><header class="entry-head"><small>IELTS - NGHE · TUẦN 39</small><h1>Listening Test 29</h1><p>Điền thông tin học sinh trước khi vào bài.</p></header><div class="entry-body"><p class="entry-note">Họ tên và lớp sẽ được giữ lại để gửi điểm sau khi hoàn thành bài.</p><label for="entryName">Họ và tên học sinh</label><input id="entryName" type="text" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"><label for="entryClass">Lớp IELTS</label><select id="entryClass"><option value="">Chọn lớp IELTS</option><option>IELTS 40</option><option>IELTS 41</option><option>IELTS 42</option><option>IELTS 43</option><option>IELTS 44</option><option>IELTS 45</option><option>IELTS 46</option><option>IELTS 47</option><option>IELTS 48</option><option>IELTS 49</option><option>IELTS 50</option><option>IELTS 51</option><option>IELTS 52</option><option>IELTS 53</option></select><button id="enterTest" type="button" disabled>Nhập họ tên và chọn lớp để vào bài</button></div></div></section><div id="testApp" hidden><header class="hero"><small>IELTS - NGHE · TUẦN 39</small><h1>Listening Test 29</h1><p>Full Test · Sections 1–4 · 40 questions</p></header><main class="shell"><nav id="sectionTabs" class="section-tabs"></nav><nav class="stage-tabs"><button type="button" data-stage="vocab">A · Từ vựng cần lưu ý</button><button type="button" data-stage="dictation">B · Điền chính tả</button><button type="button" data-stage="ielts">C · Câu hỏi IELTS</button><button type="button" data-stage="score">D · Nộp bài</button></nav><section id="content" class="lesson"></section></main></div><script>const DATA={"week":39,"test":29,"sourceRef":"Cambridge IELTS 16 Academic Listening Test 1","answers":{"1":["egg"],"2":["tower"],"3":["car"],"4":["animals"],"5":["bridge"],"6":["movie","film"],"7":["decorate"],"8":["Wednesdays"],"9":["Fradstone"],"10":["parking"],"11":["C"],"12":["A"],"13":["B"],"14":["C"],"15":["H"],"16":["C"],"17":["G"],"18":["B"],"19":["I"],"20":["A"],"21":["C","E"],"22":["C","E"],"23":["B","E"],"24":["B","E"],"25":["D"],"26":["C"],"27":["A"],"28":["H"],"29":["F"],"30":["G"],"31":["practical"],"32":["publication"],"33":["choices"],"34":["negative"],"35":["play"],"36":["capitalism"],"37":["depression"],"38":["logic"],"39":["opportunity"],"40":["practice","practise"]},"sections":[{"number":1,"transcript":["SARAH: Hello. Children’s Engineering Workshops.","FATHER: Oh hello. I wanted some information about the workshops in the school holidays.","SARAH: Sure.","FATHER: I have two daughters who are interested. The younger one’s Lydia, she’s four – do you take children as young as that?","SARAH: Yes, our Tiny Engineers workshop is for four to five-year-olds.","FATHER: What sorts of activities do they do?","SARAH: All sorts. For example, they work together to design a special cover that goes round an egg, so that when it’s inside they can drop it from a height and it doesn’t break. Well, sometimes it does break but that’s part of the fun!","FATHER: Right. And Lydia loves building things. Is there any opportunity for her to do that?","SARAH: Well, they have a competition to see who can make the highest tower. You’d be amazed how high they can go.","FATHER: Right.","SARAH: But they’re learning all the time as well as having fun. For example, one thing they do is to design and build a car that’s attached to a balloon, and the force of the air in that actually powers the car and makes it move along. They go really fast too.","FATHER: OK, well, all this sounds perfect.","————————","FATHER: Now Carly, that’s my older daughter, has just had her seventh birthday, so presumably she’d be in a different group?","SARAH: Yes, she’d be in the Junior Engineers. That’s for children from six to eight.","FATHER: And do they do the same sorts of activities?","SARAH: Some are the same, but a bit more advanced. So they work out how to build model vehicles, things like cars and trucks, but also how to construct animals using the same sorts of material and technique, and then they learn how they can program them and make them move.","FATHER: So they learn a bit of coding?","SARAH: They do. They pick it up really quickly. We’re there to help if they need it, but they learn from one another too.","FATHER: Right. And do they have competition too?","SARAH: Yes, with the Junior Engineers, it’s to use recycled materials like card and wood to build a bridge, and the longest one gets a prize.","FATHER: That sounds fun. I wouldn’t mind doing that myself!","SARAH: Then they have something a bit different, which is to think up an idea for a five-minute movie and then film it, using special animation software. You’d be amazed what they come up with.","FATHER: And of course, that’s something they can put on their phone and take home to show all their friends.","SARAH: Exactly. And then they also build a robot in the shape of a human, and they decorate it and program it so that it can move its arms and legs.","FATHER: Perfect. So, is it the same price as the Tiny Engineers?","SARAH: It’s just a bit more: £50 for the five weeks.","FATHER: And are the classes on a Monday, too?","SARAH: They used to be, but we found it didn’t give our staff enough time to clear up after the first workshop, so we moved them to Wednesdays. The classes are held in the morning from ten to eleven.","FATHER: OK. That’s better for me actually. And what about the location? Where exactly are the workshops held?","SARAH: They’re in building 10A – there’s a big sign on the door, you can’t miss it, and that’s in Fradstone Industrial Estate.","FATHER: Sorry?","SARAH: Fradstone – that’s F-R-A-D-S-T-O-N-E.","FATHER: And that’s in Grasford, isn’t it?","SARAH: Yes, up past the station.","FATHER: And will I have any parking problems there?","SARAH: No, there’s always plenty available. So would you like to enrol Lydia and Carly now?","FATHER: OK.","SARAH: So can I have your full name …"],"cloze":"<p>SARAH: Hello. <s  and take home to show all their friends.</p><p>SARAH: Exactly. And then they also build a robot in the shape of a human, and they decorate it and program it so that it can move its arms and legs.</p><p>FATHER: Perfect. So, is it the same <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span>?</p><p>SARAH: It’s just a bit more: £50 for the five weeks.</p><p>FATHER: And are the classes on a Monday, too?</p><p>SARAH: They used to be, but we found it didn’t give our <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span> up after the <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> them to Wednesdays. The classes are held in the morning from ten to eleven.</p><p>FATHER: OK. That’s better for me actually. And what about the location? Where exactly are the workshops held?</p><p>SARAH: They’re in building 10A – there’s a big sign on the door, you can’t miss it, and that’s in <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>.</p><p>FATHER: Sorry?</p><p>SARAH: Fradstone – that’s F-R-A-D-S-T-O-N-E.</p><p>FATHER: And that’s in Grasford, isn’t it?</p><p>SARAH: Yes, up past the station.</p><p>FATHER: And will I have <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> there?</p><p>SARAH: No, there’s <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>. So would you like to enrol Lydia and Carly now?</p><p>FATHER: OK.</p><p>SARAH: So can I have your full name …</p>","clozeAnswers":["Children’s Engineering Workshops","Tiny Engineers workshop","design a special cover that goes round an egg","Lydia loves building things","competition to see who can make the highest tower","actually powers the car","seventh birthday, so presumably","sorts of activities","build model vehicles, things","sorts of material and technique","the Junior Engineers","use recycled materials like card","using special animation software","course, that’s something","price as the Tiny Engineers","staff enough time to clear","first workshop, so we moved","Fradstone Industrial Estate","any parking problems","always plenty available"],"vocab":[{"word":"engineering","ipa":"/ˌen.dʒɪˈnɪə.ɹɪŋ/","pos":"Danh từ (n)","meaning":"kỹ thuật","example":"Children’s Engineering Workshops.","exampleVi":"Trong câu trên, “engineering” mang nghĩa “kỹ thuật”."},{"word":"construct","ipa":"/kənˈstrʌkt/","pos":"Động từ (v)","meaning":"xây dựng/lắp ráp","example":"So they work out how to build model vehicles, things like cars and trucks, but also how to construct animals using the same sorts of material and technique, and then they learn how they can program them and make them move.","exampleVi":"Trong câu trên, “construct” mang nghĩa “xây dựng/lắp ráp”."},{"word":"engineers","ipa":"/ˌɛnd͡ʒɪˈnɪəz/","pos":"Danh từ (n)","meaning":"kỹ sư","example":"Yes, our Tiny Engineers workshop is for four to five-year-olds.","exampleVi":"Trong câu trên, “engineers” mang nghĩa “kỹ sư”."},{"word":"materials","ipa":"/məˈtɪəɹɪəlz/","pos":"Danh từ (n)","meaning":"vật liệu","example":"Yes, with the Junior Engineers, it’s to use recycled materials like card and wood to build a bridge, and the longest one gets a prize.","exampleVi":"Trong câu trên, “materials” mang nghĩa “vật liệu”."},{"word":"actually","ipa":"/ˈæktʃuəli/","pos":"Trạng từ (adv)","meaning":"thực sự/trên thực tế","example":"For example, one thing they do is to design and build a car that’s attached to a balloon, and the force of the air in that actually powers the car and makes it move along.","exampleVi":"Trong câu trên, “actually” mang nghĩa “thực sự/trên thực tế”."},{"word":"attached","ipa":"/əˈtætʃt/","pos":"Động từ (v)","meaning":"được gắn vào","example":"For example, one thing they do is to design and build a car that’s attached to a balloon, and the force of the air in that actually powers the car and makes it move along.","exampleVi":"Trong câu trên, “attached” mang nghĩa “được gắn vào”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 1-10</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the notes below.</p>\n<p>Write&nbsp;<strong>ONE WORD AND/OR A NUMBER</strong>&nbsp;for each answer.</p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Children’s Engineering Workshops</strong></strong></p>\n<p><strong>Tiny Engineers (ages 4-5)</strong></p>\n<p>Activities</p>\n<ul>\n<li>Create a cover for an <span class=\"question-item\"><strong class=\"q-number\">1</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"1\" oninput=\"setQ(1,this.value)\"></span>&nbsp;so they can drop it from a height without breaking it.</li>\n<li>Take part in a competition to build the tallest <span class=\"question-item\"><strong class=\"q-number\">2</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"2\" oninput=\"setQ(2,this.value)\"></span>.</li>\n<li>Make a <span class=\"question-item\"><strong class=\"q-number\">3</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"3\" oninput=\"setQ(3,this.value)\"></span>&nbsp;powered by a balloon.</li>\n</ul>\n<p><strong>Junior Engineers (ages 6-8)</strong></p>\n<p>Activities:</p>\n<ul>\n<li>Build model cars, trucks and <span class=\"question-item\"><strong class=\"q-number\">4</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"4\" oninput=\"setQ(4,this.value)\"></span>&nbsp;and learn how to program them so they can move.</li>\n<li>Take part in a competition to build the longest <span class=\"question-item\"><strong class=\"q-number\">5</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"5\" oninput=\"setQ(5,this.value)\"></span>&nbsp;using card and wood.</li>\n<li>Create a short <span class=\"question-item\"><strong class=\"q-number\">6</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"6\" oninput=\"setQ(6,this.value)\"></span>&nbsp;with special software.</li>\n<li>Build, <span class=\"question-item\"><strong class=\"q-number\">7</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"7\" oninput=\"setQ(7,this.value)\"></span>&nbsp;and program a humanoid robot.</li>\n</ul>\n<p>Cost for a five-week block: £50</p>\n<p>Held on <span class=\"question-item\"><strong class=\"q-number\">8</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"8\" oninput=\"setQ(8,this.value)\"></span>&nbsp;from 10 am to 11 am</p>\n<p><strong>Location</strong></p>\n<p>Building 10A, <span class=\"question-item\"><strong class=\"q-number\">9</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"9\" oninput=\"setQ(9,this.value)\"></span>&nbsp;Industrial Estate, Grasford</p>\n<p>Plenty of <span class=\"question-item\"><strong class=\"q-number\">10</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"10\" oninput=\"setQ(10,this.value)\"></span>&nbsp;is available.</p>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-29/section-1.mp3"},{"number":2,"transcript":["Good morning, everyone, and welcome to Stevenson’s, one of the country’s major manufacturers of metal goods. Thank you for choosing us for your two weeks of work experience. My name is Julia Simmons, and since the beginning of this year I’ve been the managing director.","Stevenson’s is quite an old company. Like me, the founder, Ronald Stevenson, went into the steel industry when he left school – that was in 1923. He set up this company when he finished his apprenticeship, in 1926, although he actually started making plans two years earlier, in 1924. He was a very determined young man!","Stevenson’s long-term plan was to manufacture components for the machine tools industry – although in fact that never came about – and for the automotive industry, that is, cars and lorries. However, there was a delay of five years before that happened, because shortly before the company went into production, Stevenson was given the opportunity to make goods for hospitals and other players in the healthcare industry, so that’s what we did for the first five years.","Over the years, we’ve expanded the premises considerably – we were lucky that the site is big enough, so moving to a new location has never been necessary. However, the layout is far from ideal for modern machinery and production methods, so we intend to carry out major refurbishment of this site over the next five years.","I’d better give you some idea of what you’ll be doing during your two weeks with us, so you know what to expect. Most mornings you’ll have a presentation from one of the managers, to learn about their department, starting this morning with research and development. And you’ll all spend some time in each department, observing what’s going on and talking to people – as long as you don’t stop them from doing their work altogether! In the past, a teacher from your school has come in at the end of each week to find out how the group were getting on, but your school isn’t able to arrange that this year.","————————","OK, now I’ll briefly help you to orientate yourselves around the site. As you can see, we’re in the reception area, which we try to make attractive and welcoming to visitors. There’s a corridor running left from here, and if you go along that, the door facing you at the end is the entrance to the coffee room. This looks out onto the main road on one side, and some trees on the other, and that’ll be where you meet each morning.","The factory is the very big room on the far side of the site. Next to it is the warehouse, which can be accessed by lorries going up the road to the turning area at the end. You can get to the warehouse by crossing to the far side of the courtyard, and then the door is on your right.","Somewhere you’ll be keen to find is the staff canteen. This is right next to reception. I can confidently say that the food’s very good, but the view isn’t. The windows on one side look onto a corridor and courtyard, which aren’t very attractive at all, and on the other onto the access road, which isn’t much better.","You’ll be using the meeting room quite often, and you’ll find it by walking along the corridor to the left of the courtyard, and continuing along it to the end. The meeting room is the last one on the right, and I’m afraid there’s no natural daylight in the room.","Then you’ll need to know where some of the offices are. The human resources department is at the front of this building, so you head to the left along the corridor from reception, and it’s the second room you come to. It looks out onto the main road.","And finally, the boardroom, where you’ll be meeting sometimes. That has quite a pleasant view, as it looks out on to the trees. Go along the corridor past the courtyard, right to the end. The boardroom is on the left, next to the factory.","OK, now are there any questions before we …"],"cloze":"<p>Good morning, everyone, and welcome to Stevenson’s, one of the <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> goods. Thank you for choosing us for your two weeks of work experience. My name is Julia Simmons, and since the beginning of this year I’ve been the managing director.</p><p>Stevenson’s is quite an old company. Like me, the <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> into the steel industry when he left school – that was in 1923. He set up this company when he finished his apprenticeship, in 1926, <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span> plans two years earlier, in 1924. He was a very determined young man!</p><p>Stevenson’s long-term plan was to manufacture components for the <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> in fact that never came about – and for the automotive industry, that is, cars and lorries. However, there was a delay of five years before that happened, because shortly before the <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> was given the opportunity to make goods for hospitals and other players in the healthcare industry, so that’s what we did for the first five years.</p><p>Over the years, we’ve <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span> – we were lucky that the site is big enough, so moving to a new location has never been necessary. However, the layout is far from ideal for <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span>, so we intend to carry out major refurbishment of this site over the next five years.</p><p>I’d better give you some idea of what you’ll be doing during your two weeks with us, so you know what to expect. Most <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span> from one of the managers, to learn about their <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span> with research and development. And you’ll all spend some time in each department, observing what’s going on and talking to people – as long as you don’t stop them from doing <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>! In the past, a teacher from your school has come in at the end of each week to find out how the group were getting on, but your school isn’t able to arrange that this year.</p><p>————————</p><p>OK, now I’ll <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span> yourselves around the site. As you can see, we’re in the reception area, which we try to make <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span>. There’s a corridor running left from here, and if you go along that, the door facing you at the end is the entrance to the coffee room. This looks out onto the main road on one side, and some trees on the other, and that’ll be where you <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span>.</p><p>The factory is the very big room on the far side of the site. Next to it is the warehouse, which can be <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span> up the road to the turning area at the end. You can get to the warehouse by crossing to the far side of the courtyard, and then the door is on your right.</p><p>Somewhere you’ll be keen to find is the staff canteen. This is right next to reception. I can confidently say that <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span>, but the view isn’t. The windows on one side look onto a corridor and courtyard, which aren’t very attractive at all, and on the other onto the access road, which isn’t much better.</p><p>You’ll be using the <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>, and you’ll find it by walking along the corridor to the left of the <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> it to the end. The meeting room is the last one on the right, and I’m afraid there’s no natural daylight in the room.</p><p>Then you’ll need to know where some of the offices are. The <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span> is at the front of this building, so you head to the left along the <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span>, and it’s the second room you come to. It looks out onto the main road.</p><p>And finally, the boardroom, where you’ll be meeting sometimes. That has quite a pleasant view, as it looks out on to the trees. Go along the <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>, right to the end. The boardroom is on the left, next to the factory.</p><p>OK, now are there any questions before we …</p>","clozeAnswers":["country’s major manufacturers of metal","founder, Ronald Stevenson, went","although he actually started making","machine tools industry – although","company went into production, Stevenson","expanded the premises considerably","modern machinery and production methods","mornings you’ll have a presentation","department, starting this morning","their work altogether","briefly help you to orientate","attractive and welcoming to visitors","meet each morning","accessed by lorries going","the food’s very good","meeting room quite often","courtyard, and continuing along","human resources department","corridor from reception","corridor past the courtyard"],"vocab":[{"word":"attractive","ipa":"/əˈtɹæktɪv/","pos":"Tính từ (adj)","meaning":"hấp dẫn","example":"As you can see, we’re in the reception area, which we try to make attractive and welcoming to visitors.","exampleVi":"Trong câu trên, “attractive” mang nghĩa “hấp dẫn”."},{"word":"determined","ipa":"/dɪˈtɜːmɪnd/","pos":"Tính từ (adj)","meaning":"quyết tâm/kiên định","example":"He was a very determined young man!","exampleVi":"Trong câu trên, “determined” mang nghĩa “quyết tâm/kiên định”."},{"word":"hospital","ipa":"/ˈhɒs.pɪ.tl̩/","pos":"Danh từ (n)","meaning":"bệnh viện","example":"However, there was a delay of five years before that happened, because shortly before the company went into production, Stevenson was given the opport y gave us all those handouts with details of books and websites to look at, I was really put off, but the more I read, the more interested I got.","TOM: Me too. I found I could research so many different aspects of birds in art – colour, movement, texture. So I was looking forward to the Bird Park visit.","JESS: What a letdown! It poured with rain and we hardly saw a single bird. Much less use than the trip to the Natural History Museum.","TOM: Yeah, I liked all the stuff about evolution there. The workshop sessions with Dr Fletcher were good too, especially the brainstorming sessions.","JESS: I missed those because I was ill. I wish we could’ve seen the projects last year’s students did.","TOM: Mm. I suppose they want us to do our own thing, not copy.","JESS: Have you drafted your proposal yet?","TOM: Yes, but I haven’t handed it in. I need to amend some parts. I’ve realised the notes from my research are almost all just descriptions, I haven’t actually evaluated anything. So I’ll have to fix that.","JESS: Oh, I didn’t know we had to do that. I’ll have to look at that too. Did you do a timeline for the project?","TOM: Yes, and a mind map.","JESS: Yeah, so did I. I quite enjoyed that. But it was hard having to explain the basis for my decisions in my action plan.","TOM: What?","JESS: You know, give a rationale.","TOM: I didn’t realise we had to do that. OK, I can add it now. And I’ve done the video diary presentation, and worked out what I want my outcome to be in the project.","JESS: Someone told me it’s best not to be too precise about your actual outcome at this stage, so you have more scope to explore your ideas later on. So I’m going to do back to my proposal to make it a bit more vague.","TOM: Really? OK, I’ll change that too then.","——————————","TOM: One part of the project, I’m unsure about is where we choose some paintings of birds and say what they mean to us. Like, I chose a painting of a falcon by Landseer. I like it because the bird’s standing there with his head turned to one side, but he seems to be staring straight at you. But I can’t just say it’s a bit scary, can I?","JESS: You could talk about the possible danger suggested by the bird’s look.","TOM: Oh, OK.","JESS: There’s a picture of a fish hawk by Audubon I like. It’s swooping over the water with a fish in its talons, and with great black wings which take up most of the picture.","TOM: So you could discuss it in relation to predators and food chains?","JESS: Well actually I think I’ll concentrate on the impression of rapid motion it gives.","TOM: Right.","JESS: Do you know that picture of a kingfisher by van Gosh – it’s perching on a reed growing near a stream.","TOM: Yes, it’s got these beautiful blue and red and black shades.","JESS: Mm hm. I’ve actually chosen it because I saw a real kingfisher once when I was litter, I was out walking with my grandfather, and I’ve never forgotten it.","TOM: So we can use a personal link?","JESS: Sure.","TOM: OK. There’s a portrait called William Wells. I can’t remember the artist but it’s a middle-aged man who’s just shot a bird. And his expression, and the way he’s holding the bird in his hand suggests he’s not sure about what he’s done. To me it’s about how ambiguous people are in the way they exploit the natural world.","JESS: Interesting. There’s Gauguin’s picture Vairumati. He did it in Tahiti. It’s a woman with a white bird behind her that is eating a lizard, and what I’m interested in is what idea this bird refers to. Apparently, it’s a reference to the never-ending cycle of existence.","TOM: Wow. I chose a portrait of a little boy, Giovanni de Medici. He’s holding a tiny bird in one fist. I like the way he’s holding it carefully so he doesn’t hurt it.","JESS: Ah right."],"cloze":"<p>JESS: How are you getting on with your art project, Tom?</p><p>TOM: OK. Like, they gave us the theme of birds to base our project on, and I’m not really all that <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" =\"task-copy\">\n                                            <p>Choose&nbsp;<strong>TWO</strong>&nbsp;letters,&nbsp;<strong>A-E</strong>.</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">23</strong> <strong class=\"q-number\">24</strong> <span>In which&nbsp;<strong>TWO</strong>&nbsp;ways do both Jess and Tom decide to change their proposals?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input data-limit=\"2\" type=\"checkbox\" value=\"A\" data-group=\"23-24\" onchange=\"setGroup('23-24',this.value,this,2)\"><span>by giving a rationale for their action plans</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input data-limit=\"2\" type=\"checkbox\" value=\"B\" data-group=\"23-24\" onchange=\"setGroup('23-24',this.value,this,2)\"><span>by being less specific about the outcome</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input data-limit=\"2\" type=\"checkbox\" value=\"C\" data-group=\"23-24\" onchange=\"setGroup('23-24',this.value,this,2)\"><span>by adding a video diary presentation</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">D</label><input data-limit=\"2\" type=\"checkbox\" value=\"D\" data-group=\"23-24\" onchange=\"setGroup('23-24',this.value,this,2)\"><span>by providing a timeline and a mind map</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">E</label><input data-limit=\"2\" type=\"checkbox\" value=\"E\" data-group=\"23-24\" onchange=\"setGroup('23-24',this.value,this,2)\"><span>by making their notes more evaluative</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 25-30</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Which personal meaning do the students decide to give to each of the following pictures?</p>\n<p>Choose&nbsp;<strong>SIX</strong>&nbsp;answers from the box and write the correct letter,&nbsp;<strong>A-H</strong>, next to Questions.</p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Personal meanings</strong></strong></p>\n<p><strong>Pictures</strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                                <div class=\"matching-dnd-questions\"><div class=\"question-item\"> • <span>Falcon (Landseer)</span><span class=\"inline-choice\"><strong class=\"q-number\">25</strong><select data-q=\"25\" onchange=\"setQ(25,this.value)\" aria-label=\"Question 25\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option><option value=\"H\">H</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class=\"question-item\"> • <span>Fish hawk (Audubon) ><option value=\"F\">F</option><option value=\"G\">G</option><option value=\"H\">H</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class=\"question-item\"> • <span>Portrait of William Wells</span><span class=\"inline-choice\"><strong class=\"q-number\">28</strong><select data-q=\"28\" onchange=\"setQ(28,this.value)\" aria-label=\"Question 28\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option><option value=\"H\">H</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class=\"question-item\"> • <span>Portrait of Giovanni de Medici</span><span class=\"inline-choice\"><strong class=\"q-number\">30</strong><select data-q=\"30\" onchange=\"setQ(30,this.value)\" aria-label=\"Question 30\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option><option value=\"H\">H</option></select></span></div></div>                                                                        <div class=\"option-bank\"><div><b>A</b> a childhood memory</div><div><b>B</b> hope for the future</div><div><b>C</b> fast movement</div><div><b>D</b> a potential threat</div><div><b>E</b> the power of colour</div><div><b>F</b> the continuity of life</div><div><b>G</b> protection of nature</div><div><b>H</b> a confused attitude to nature</div></div>\n                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>\n                                        </div>","audio":"./audio/test-29/section-3.mp3"},{"number":4,"transcript":["Ancient philosophy is not just about talking or lecturing, or even reading long, dense books. In fact, it is something people have used throughout history – to solve their problems and to achieve their greatest triumphs.","Specifically, I am referring to Stoicism, which, in my opinion, is the most practical of all philosophies and therefore the most appealing. Stoicism was founded in Ancient Greece by Zeno of Citium in the early 3rd century BC, but was practised by the likes of Epictetus, Cato.","Seneca and Marcus Aurelius. Amazingly, we still have access to these ideas, despite the fact that the most famous Stoics never wrote anything down for publication. Cato definitely didn’t. Marcus Aurelius never intended his Meditations to be anything but personal. Seneca’s letters were, well, letters and Epictetus’ thoughts come to us by way of a note-taking student.","Stoic principles were based on the idea that its followers could have an unshakable happiness in this life and the key to achieving this was virtue. The road to virtue, in turn, lay in understanding that destructive emotions, like anger and jealousy, are under our conscious control – they don’t have to control us, because we can learn to control them. In the words of Epictetus: “external events I cannot control, but the choices I make with regard to them, I do control”.","The modern day philosopher and writer Nassim Nicholas Taleb defines a Stoic as someone who has a different perspective on experience which most of us would see as wholly negative; a Stoic “transforms fear into caution, pain into transformation, mistakes into initiation and desire into undertaking”. Using this definition as a model, we can see that throughout the centuries Stoicism has been practised in more recent history by kings, presidents, artists, writers and entrepreneurs.","———————","The founding fathers of the United States were inspired by the philosophy. George Washington was introduced to Stoicism by his neighbours at age seventeen, and later, put on a play based on the life of Cato to inspire his men. Thomas Jefferson kept a copy of Seneca beside his bed.","Writers and artists have also been inspired by the stoics. Eugène Delacroix, the renowned French Romantic artist (known best for his painting Liberty Leading the People) was an ardent Stoic, referring to it as his “consoling religion”.","The economist Adam Smith’s theories on capitalism were significantly influenced by the Stoicism that he studied as a schoolboy, under a teacher who had translated Marcus Aurelius’ works.","Today’s political leaders are no different, with many finding their inspiration from the ancient texts. Former US president Bill Clinton rereads Marcus Aurelius every single year, and many have compared former President Obama’s calm leadership style to that of Cato. Wen Jiabao, the former prime minister of China, claims that Meditations is one of two books he travels with and that he has read it more than one hundred times over the course of his life.","Stoicism had a profound influence on Albert Ellis, who invented Cognitive Behaviour Therapy, which is used to help people manage their problems by changing the way that they think and behave. It’s most commonly used to treat depression. The idea is that we can take control of our lives by challenging the irrational belief that create our faulty thinking, symptoms and behaviours by using logic instead.","Stoicism has also become popular in the world of business. Stoic principles can build the resilience and state of mind required to overcome setbacks because Stoics teach turning obstacles into opportunity. A lesson every business entrepreneur needs to learn.","I would argue that studying Stoicism is as relevant today as it was 2,000 years ago, thanks to its brilliant insights into how to lead a good life. At the very root of the thinking, there is a very simple way of living – control what you can and accept what you can’t. This is not as easy as it sounds and will require considerable practice – it can take a lifetime to master. The Stoics also believed the most important foundation for a good and happy life is not money, fame, power or pleasure, but having a disciplined and principled character – something which seems to resonate with many people today."],"cloze":"<p>Ancient philosophy is not just about talking or lecturing, or even reading long, dense books. In fact, it is <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> history – to solve their problems and to achieve their greatest triumphs.</p><p>Specifically, I am referring to Stoicism, which, in my opinion, is the most practical of all <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> the most appealing. Stoicism was founded in Ancient Greece by Zeno of Citium in the early 3rd century BC, but was practised by the likes of Epictetus, Cato.</p><p>Seneca and Marcus Aurelius. Amazingly, we still have access to these ideas, despite the fact that the most <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\
