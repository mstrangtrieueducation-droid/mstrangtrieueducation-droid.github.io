</style></head><body><section id="entryGate" class="entry-screen"><div class="entry-card"><header class="entry-head"><small>IELTS - NGHE · TUẦN 24</small><h1>Listening Test 14</h1><p>Điền thông tin học sinh trước khi vào bài.</p></header><div class="entry-body"><p class="entry-note">Họ tên và lớp sẽ được giữ lại để gửi điểm sau khi hoàn thành bài.</p><label for="entryName">Họ và tên học sinh</label><input id="entryName" type="text" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"><label for="entryClass">Lớp IELTS</label><select id="entryClass"><option value="">Chọn lớp IELTS</option><option>IELTS 40</option><option>IELTS 41</option><option>IELTS 42</option><option>IELTS 43</option><option>IELTS 44</option><option>IELTS 45</option><option>IELTS 46</option><option>IELTS 47</option><option>IELTS 48</option><option>IELTS 49</option><option>IELTS 50</option><option>IELTS 51</option><option>IELTS 52</option><option>IELTS 53</option></select><button id="enterTest" type="button" disabled>Nhập họ tên và chọn lớp để vào bài</button></div></div></section><div id="testApp" hidden><header class="hero"><small>IELTS - NGHE · TUẦN 24</small><h1>Listening Test 14</h1><p>Full Test · Sections 1–4 · 40 questions</p></header><main class="shell"><nav id="sectionTabs" class="section-tabs"></nav><nav class="stage-tabs"><button type="button" data-stage="vocab">A · Từ vựng cần lưu ý</button><button type="button" data-stage="dictation">B · Điền chính tả</button><button type="button" data-stage="ielts">C · Câu hỏi IELTS</button><button type="button" data-stage="score">D · Nộp bài</button></nav><section id="content" class="lesson"></section></main></div><script>const DATA={"week":24,"test":14,"answers":{"1":["2.45","2:45"],"2":["band"],"3":["play"],"4":["scientist"],"5":["river"],"6":["grandparents"],"7":["handsworth"],"8":["traditional"],"9":["outdoor"],"10":["logo"],"11":["B"],"12":["C"],"13":["A"],"14":["B"],"15":["C"],"16":["F"],"17":["B"],"18":["E"],"19":["G"],"20":["C"],"21":["C"],"22":["B"],"23":["C"],"24":["A"],"25":["C"],"26":["E"],"27":["G"],"28":["D"],"29":["C"],"30":["A"],"31":["bullying"],"32":["superiority"],"33":["personality"],"34":["structural"],"35":["absence"],"36":["confidence"],"37":["visions"],"38":["democratic"],"39":["respect"],"40":["mediator"]},"sections":[{"number":1,"transcript":["MAN: Good morning, Kenton Festival box office. How can I help you?","WOMAN: Oh, good morning. I’m coming to Kenton for a few days’ holiday next month, and a friend told me there’s a festival. She gave me this number to find out about it.","MAN: That’s right, the festival begins on the 16th of May and goes on till the 19th.","WOMAN: Oh, that’s great. I’ll be there from the 15th till the 19th. So could you tell me the programme, please?","MAN: Well, on the first day, there’s the opening ceremony, in the town centre. People start gathering around 2 o’clock, to get a good place to see from, and the events will start at 2.45, and finish about 5.30.","WOMAN: OK, thanks. I’ll make sure I get there early to get a good spot.","MAN: The festival will be officially opened by the mayor. He’ll just speak for a few minutes, welcoming everyone to the festival. All the town councillors will be there, and of course lots of other people.","WOMAN: Right.","MAN: Then there’ll be a performance by a band. Most years we have a children’s choir, but this year the local army cadets offered to perform, and they’re very good.","WOMAN: Uhuh.","MAN: After that, a community group from the town will perform a play they’ve written themselves, just a short one. It’s about Helen Tungate. I don’t know if you’ve heard of her?","WOMAN: I certainly have. She was a scientist years ago.","MAN: That’s right. She was born in Kenton exactly 100 years ago, so we’re celebrating her centenary.","WOMAN: I’m a biologist, so I’ve always been interested in her, I didn’t realise she came from Kenton.","MAN: Yes. Well, all that will take place in the afternoon, and later, as the sun sets, there’ll be a firework display. You should go to the park to watch, as you’ll get the best view from there, and the display takes place on the opposite side of the river. It’s always one of the most popular events in the festival.","WOMAN: Sounds great.","————————","WOMAN: And what’s happening on the other days?","MAN: There are several events that go on the whole time. For example, the students of the art college have produced a number of videos, all connected with relationships between children and their grandparents.","WOMAN: That sounds interesting. It makes a change from children and parents, doesn’t it!","MAN: Exactly. Because the art college is in use for classes, throughout the festival, the videos are being shown in Handsworth House.","WOMAN: How do you spell the name?","MAN: H-A-N-D-S-W-O-R-T-H. Handsworth House. It’s close to the Town Hall.","WOMAN: Right.","MAN: Now let me see, what else can I tell you about?","WOMAN: Are there any displays of ballet dancing? I’m particularly interested in that as I do it as a hobby.","MAN: There isn’t any ballet, I’m afraid, but there’ll be a demonstration of traditional dances from all round the country.","WOMAN: Oh, that’d be nice. Where’s that being held?","MAN: It’s in the market in the town centre – the outdoor one, not the covered market. And it’s on at 2 and 5 every afternoon of the festival, apart from the first day.","WOMAN: Lovely. I’m interested in all kinds of dancing, so I’m sure I’ll enjoy that!","MAN: Mmm. I’m sure you will.","WOMAN: And I’d really like to go to some concerts, if there are any.","MAN: Yes, there are several. Three performed by professionals, and one by local children.","WOMAN: And where is it being held?","MAN: It’s in the library, which is in Part Street. On the 18th, at 6.30 in the evening.","WOMAN: I presume I’ll need tickets for that.","MAN: Yes, you can book online, or you can buy them when you arrive in Kenton, either at the festival box office, or from any shops displaying our logo in the windows.","WOMAN: Well, I think that’ll keep me busy for the whole of my stay in Kenton. Thank you so much for all your help.","MAN: You’re welcome. I hope you enjoy your stay.","WOMAN: Thank you. Goodbye."],"cloze":"<p>MAN: Good morning, <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>. How can I help you?</p><p>WOMAN: Oh, good morning. I’m coming to Kenton for <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>, and a friend told me there’s a festival. She gave me this number to find out about it.</p><p>MAN: That’s right, the <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span> and goes on till the 19th.</p><p>WOMAN: Oh, that’s great. I’ll be there from the 15th till the 19th. So could you tell me the programme, please?</p><p>MAN: Well, on the first day, there’s the <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>, in the town centre. People start gathering around 2 o’clock, to get a good place to see from, and the events will <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span>, and finish about 5.30.</p><p>WOMAN: OK, thanks. I’ll make sure I get there early to get a good spot.</p><p>MAN: The festival will be <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span>. He’ll just speak for a few minutes, welcoming everyone to the festival. All the town councillors will be there, and of course lots of other people.</p><p>WOMAN: Right.</p><p>MAN: Then there’ll be <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" ari \" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span>.</p><p>WOMAN: That sounds interesting. It makes a change from children and parents, doesn’t it!</p><p>MAN: Exactly. Because the art college is in use for classes, throughout the festival, the videos are <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span>.</p><p>WOMAN: How do you spell the name?</p><p>MAN: H-A-N-D-S-W-O-R-T-H. Handsworth House. It’s close to the Town Hall.</p><p>WOMAN: Right.</p><p>MAN: Now let me see, what else can I tell you about?</p><p>WOMAN: Are there any displays of ballet dancing? I’m particularly interested in that as I do it as a hobby.</p><p>MAN: There isn’t any ballet, I’m afraid, but there’ll be a <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span> from all round the country.</p><p>WOMAN: Oh, that’d be nice. Where’s that being held?</p><p>MAN: It’s in the market in the town centre – <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span>, not the covered market. And it’s on at 2 and 5 every afternoon of the festival, apart from the first day.</p><p>WOMAN: Lovely. I’m interested in all kinds of dancing, so I’m sure I’ll enjoy that!</p><p>MAN: Mmm. I’m sure you will.</p><p>WOMAN: And I’d really like to go to some concerts, if there are any.</p><p>MAN: Yes, there are several. Three <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>, and one by local children.</p><p>WOMAN: And where is it being held?</p><p>MAN: It’s in the <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span>. On the 18th, at 6.30 in the evening.</p><p>WOMAN: I presume I’ll need tickets for that.</p><p>MAN: Yes, you can book online, or you can buy them when you arrive in Kenton, either at the festival box office, or from any shops <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>.</p><p>WOMAN: Well, I think that’ll keep me busy for the whole of my stay in Kenton. Thank you so much for all your help.</p><p>MAN: You’re welcome. I hope you enjoy your stay.</p><p>WOMAN: Thank you. Goodbye.</p>","clozeAnswers":["Kenton Festival box office","a few days’ holiday next month","festival begins on the 16th of May","opening ceremony","start at 2.45","officially opened by the mayor","a performance by a band","local army cadets","perform a play","celebrating her centenary","firework display","opposite side of the river","art college","relationships between children and their grandparents","being shown in Handsworth House","demonstration of traditional dances","the outdoor one","performed by professionals","library, which is in Part Street","displaying our logo in the windows"],"vocab":[{"word":"opening ceremony","ipa":"/ˈəʊpənɪŋ ˈserəməni/","pos":"Cụm danh từ (n phr.)","meaning":"lễ khai mạc","example":"The opening ceremony begins in the town centre.","exampleVi":"Lễ khai mạc bắt đầu tại trung tâm thị trấn."},{"word":"mayor","ipa":"/meə/","pos":"Danh từ (n)","meaning":"thị trưởng","example":"The mayor officially opens the festival.","exampleVi":"Thị trưởng chính thức khai mạc lễ hội."},{"word":"cadet","ipa":"/kəˈdet/","pos":"Danh từ (n)","meaning":"học viên quân sự","example":"The local army cadets perform at the festival.","exampleVi":"Các học viên quân sự địa phương biểu diễn tại lễ hội."},{"word":"centenary","ipa":"/senˈtiːnəri/","pos":"Danh từ (n)","meaning":"lễ kỷ niệm 100 năm","example":"The town celebrates the scientist’s centenary.","exampleVi":"Thị trấn kỷ niệm 100 năm ngày sinh của nhà khoa học."},{"word":"firework display","ipa":"/ˈfaɪəwɜːk dɪˌspleɪ/","pos":"Cụm danh từ (n phr.)","meaning":"màn trình diễn pháo hoa","example":"The firework display takes place across the river.","exampleVi":"Màn trình diễn pháo hoa diễn ra bên kia sông."},{"word":"traditional","ipa":"/trəˈdɪʃənəl/","pos":"Tính từ (adj)","meaning":"truyền thống","example":"Visitors can watch traditional dances outdoors.","exampleVi":"Du khách có thể xem các điệu múa truyền thống ngoài trời."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 1-10</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Complete the notes below.</p>\n<p><em>Write&nbsp;<strong>ONE WORD AND/OR A NUMBER</strong>&nbsp;for each answer.</em></p>\n<table>\n<tbody>\n<tr>\n<td width=\"623\">\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Events during Kenton Festival</strong></strong></p>\n</td>\n</tr>\n<tr>\n<td width=\"623\"><em>Example</em><p></p>\n<p>Start date:&nbsp; ……….<em>16th</em>………. May</p></td>\n</tr>\n<tr>\n<td width=\"623\"><strong>Opening ceremony (first day)</strong><p></p>\n<ul>\n<li>In town centre, starting at <span class=\"question-item\"><strong class=\"q-number\">1</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"1\" oninput=\"setQ(1,this.value)\"></span></li>\n</ul>\n<p>The mayor will make a speech</p>\n<p>A <span class=\"question-item\"><strong class=\"q-number\">2</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"2\" oninput=\"setQ(2,this.value)\"></span>&nbsp;will perform</p>\n<p>Performance of a <span class=\"question-item\"><strong class=\"q-number\">3</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"3\" oninput=\"setQ(3,this.value)\"></span> About Helen Tungate (a <span class=\"question-item\"><strong class=\"q-number\">4</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"4\" oninput=\"setQ(4,this.value)\"></span>)</p>\n<p>Evening fireworks display situated across the <span class=\"question-item\"><strong class=\"q-number\">5</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"5\" oninput=\"setQ(5,this.value)\"></span></p>\n<p><strong>Other events</strong></p>\n<ul>\n<li>Video about relationships that children have with their <span class=\"question-item\"><strong class=\"q-number\">6</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"6\" oninput=\"setQ(6,this.value)\"></span></li>\n</ul>\n<p>Venue: <span class=\"question-item\"><strong class=\"q-number\">7</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"7\" oninput=\"setQ(7,this.value)\"></span> House</p>\n<ul>\n<li>Performance of <span class=\"question-item\"><strong class=\"q-number\">8</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"8\" oninput=\"setQ(8,this.value)\"></span>&nbsp;Dances</li>\n</ul>\n<p>Venue: the <span class=\"question-item\"><strong class=\"q-number\">9</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"9\" oninput=\"setQ(9,this.value)\"></span>&nbsp;market in the town centre</p>\n<p>Time: 2 and 5 pm every day except 1st day of festival</p>\n<ul>\n<li>Several professional concerts and one by children</li>\n</ul>\n<p>Venue: library</p>\n<p>Time: 6.30 pm on the 18th</p>\n<p>Tickets available online from festival box office and from shops which have the festival <span class=\"question-item\"><strong class=\"q-number\">10</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"10\" oninput=\"setQ(10,this.value)\"></span>&nbsp;in their windows</p></td>\n</tr>\n</tbody>\n</table>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-14/section-1.mp3"},{"number":2,"transcript":["Right. I’ve now almost succeeded in finalising plans for our tour, so I’ll bring you up to date with what I know.","As you know, we’re flying first to Munich, on Monday the 4th.","The flight is at 11.30, so it’s too early to have lunch at the airport. I suggest we meet there for coffee at 10, which should give us plenty of time for breakfast before we leave home.","When we arrive in Munich, we’ll be met at the airport by Claus Bauer. Claus works for a tour operator, and he’ll look after us for the time we’ll be in Germany. He’s already liaised with the managers of the theatres we’re going to visit, and he’s also arranged for an officer of the National Theatre in Munich to show us round the theatre one afternoon during our stay.","Now last time we discussed this trip, I didn’t have the precise cost for hotel rooms, but now I have. The normal rate at the hotel where we’re staying is 150 euros a night for a double room. I’d hoped to get that down to 120 euros, but in fact I’ve been able to negotiate a rate of 110. That’ll be reflected in the final payment which you’ll need to make by the end of this week.","On Tuesday, the day after our arrival, I had hoped we could sit in on a rehearsal at one of the theatres, but unfortunately that’s proved very difficult to arrange, so instead we’ll have a coach trip to one of the amazing castles in the mountains south of Munich.","On Tuesday evening, we’ll all have dinner together in a restaurant near our hotel. From talking to you all about your preferences, it was clear that a typical local restaurant would be too meat-oriented for some of you. Some of you suggested an Italian restaurant, but I must confess that I decided to book a Lebanese one, as we have plenty of opportunities to go to an Italian restaurant at home.","On Wednesday afternoon, the director of the play we’re going to see that evening will talk to us at the theatre. She’ll describe the whole process of producing a play, including how she chose the actors, and, as the play we’re going to see is a modern one, how she worked with the playwright.","——————","Right. Now I’d just like to make a few points about the plays we’re going to see, partly because it might influence your choice of clothes to take with you!","The play we’re seeing on Wednesday evening is a modern one, and we’re going to the premiere, so it’ll be quite a dressy occasion, though of course you don’t have to dress formally. I gather it’s rather a multimedia production, with amazing lighting effects and a soundtrack of electronic music, though unfortunately the playwright is ill and is unlikely to be able to attend.","On Thursday we’re seeing a play that was first performed last year, when it was commissioned to mark a hundred years since the birth in the town of a well-known scientist. We’re going to see a revival of that production, which aroused a lot of interest.","Friday’s play will really make you think hard about what clothes to pack, as it’ll be in the garden of a palace. It’s a beautiful setting, but I’d better warn you, there won’t be much protection from the wind.","On Saturday, we’re going by coach to a theatre in another town, not far from Munich. This will be the opening of a drama festival, and the mayor and all the other dignitaries of the town will be attending. After the performance, the mayor is hosting a reception for all the audience, and there’ll be a band playing traditional music of the region.","And after having a day off on Sunday, our final play is on Monday, and it’s in the stunning setting of the old Town Hall, which dates back to the 14th century. The performance marks the fifty years that the lead actor has been on stage, and the play is the one where he made his first professional appearance, all those years ago.","And the day after that, we’ll be flying back home. Now have you got any questions before I …"],"cloze":"<p>Right. I’ve now almost succeeded in <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>, so I’ll bring you up to date with what I know.</p><p>As you know, we’re <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>, on Monday the 4th.</p><p>The flight is at 11.30, so it’s too early to have lunch at the airport. I suggest we <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>, which should give us plenty of time for breakfast before we leave home.</p><p>When we arrive in Munich, we’ll be met at the airport by Claus Bauer. Claus <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>, and he’ll look after us for the time we’ll be in Germany. He’s already liaised with the managers of the theatres we’re going to visit, and he’s also arranged for an officer of the National Theatre in Munich to <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> one afternoon during our stay.</p><p>Now last time we discussed this trip, I didn’t have the precise cost for hotel rooms, but now I have. The <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span> where we’re staying is 150 euros a night for a double room. I’d hoped to get that down to 120 euros, but in fact I’ve been able to <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span>. That’ll be reflected in the final payment which you’ll need to make by the end of this week.</p><p>On Tuesday, the day after our arrival, I had hoped we could sit in on a rehearsal at one of the theatres, but unfortunately that’s proved very difficult to arrange, so instead we’ll have a <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span> in the mountains south of Munich.</p><p>On Tuesday evening, we’ll all have dinner together in a restaurant near our hotel. From talking to you all about your preferences, it was clear that a <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span> would be too meat-oriented for some of you. Some of you suggested an Italian restaurant, but I must confess that I decided to <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>, as we have plenty of opportunities to go to an Italian restaurant at home.</p><p>On Wednesday afternoon, the <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span> we’re going to see that evening will talk to us at the theatre. She’ll describe the whole process of producing a play, including how she chose the actors, and, as the play we’re going to see is a modern one, how she <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span>.</p><p>——————</p><p>Right. Now I’d just like to make a few points about the plays we’re going to see, partly because it might influence your choice of clothes to take with you!</p><p>The play we’re seeing on Wednesday evening is a modern one, and we’re <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span>, so it’ll be quite a dressy occasion, though of course you don’t have to dress formally. I gather it’s rather a <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span>, with amazing lighting effects and a soundtrack of electronic music, though unfortunately the playwright is ill and is unlikely to be able to attend.</p><p>On Thursday we’re seeing a play that was first performed last year, when it was <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span> since the birth in the town of a well-known scientist. We’re going to see a revival of that production, which aroused a lot of interest.</p><p>Friday’s play will really make you think hard about what clothes to pack, as it’ll be in the <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>. It’s a beautiful setting, but I’d better warn you, there won’t be much <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span>.</p><p>On Saturday, we’re going by coach to a theatre in another town, not far from Munich. This will be the <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>, and the mayor and all the other dignitaries of the town will be attending. After the performance, the mayor is <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> for all the audience, and there’ll be a band playing traditional music of the region.</p><p>And after having a day off on Sunday, our final play is on Monday, and it’s in the stunning setting of the <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>, which dates back to the 14th century. The performance marks the fifty years that the lead actor has been on stage, and the play is the one where he made his first professional appearance, all those years ago.</p><p>And the day after that, we’ll be flying back home. Now have you got any questions before I …</p>","clozeAnswers":["finalising plans for our tour","flying first to Munich","meet there for coffee at 10","works for a tour operator","show us round the theatre","normal rate at the hotel","negotiate a rate of 110","coach trip to one of the amazing castles","typical local restaurant","book a Lebanese one","director of the play","worked with the playwright","going to the premiere","multimedia production","commissioned to mark a hundred years","garden of a palace","protection from the wind","opening of a drama festival","hosting a reception","old Town Hall"],"vocab":[{"word":"liaise with","ipa":"/liˈeɪz wɪð/","pos":"Cụm động từ (phr.v)","meaning":"liên hệ, phối hợp với","example":"The tour operator liaises with theatre managers.","exampleVi":"Nhà điều hành tour phối hợp với các quản lý nhà hát."},{"word":"negotiate","ipa":"/nɪˈɡəʊʃieɪt/","pos":"Động từ (v)","meaning":"thương lượng","example":"She negotiated a lower rate for the rooms.","exampleVi":"Cô ấy thương lượng mức giá phòng thấp hơn."},{"word":"rehearsal","ipa":"/rɪˈhɜːsəl/","pos":"Danh từ (n)","meaning":"buổi diễn tập","example":"The group cannot attend the theatre rehearsal.","exampleVi":"Đoàn không thể tham dự buổi diễn tập ở nhà hát."},{"word":"premiere","ipa":"/ˈpremieə/","pos":"Danh từ (n)","meaning":"buổi công diễn đầu tiên","example":"Wednesday’s performance is the play’s premiere.","exampleVi":"Buổi diễn thứ Tư là lần công diễn đầu tiên của vở kịch."},{"word":"multimedia","ipa":"/ˌmʌltiˈmiːdiə/","pos":"Tính từ (adj)","meaning":"đa phương tiện","example":"The production uses multimedia lighting and music.","exampleVi":"Vở diễn sử dụng ánh sáng và âm nhạc đa phương tiện."},{"word":"dignitary","ipa":"/ˈdɪɡnɪtəri/","pos":"Danh từ (n)","meaning":"quan chức cấp cao","example":"Town dignitaries will attend the drama festival.","exampleVi":"Các quan chức thị trấn sẽ dự lễ hội kịch."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 11-15</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose the correct letter,&nbsp;<strong>A</strong>,&nbsp;<strong>B</strong>&nbsp;or&nbsp;<strong>C</strong>.</p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Theatre trip to Munich</strong></strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">11</strong> <span>When the group meet at the airport they will have</span></span>\n radio\" name=\"q12\" value=\"B\" data-q=\"12\" onchange=\"setQ(12,this.value)\"><span>a theatre manager.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q12\" value=\"C\" data-q=\"12\" onchange=\"setQ(12,this.value)\"><span>a tour operator.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">13</strong> <span>How much will they pay per night for a double room at the hotel?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q13\" value=\"A\" data-q=\"13\" onchange=\"setQ(13,this.value)\"><span>110 euros</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q13\" value=\"B\" data-q=\"13\" onchange=\"setQ(13,this.value)\"><span>120 euros</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q13\" value=\"C\" data-q=\"13\" onchange=\"setQ(13,this.value)\"><span>150 euros</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">14</strong> <span>What type of restaurant will they go to on Tuesday evening?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q14\" value=\"A\" data-q=\"14\" onchange=\"setQ(14,this.value)\"><span>an Italian restaurant</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q14\" value=\"B\" data-q=\"14\" onchange=\"setQ(14,this.value)\"><span>a Lebanese restaurant</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q14\" value=\"C\" data-q=\"14\" onchange=\"setQ(14,this.value)\"><span>a typical restaurant of the region</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">15</strong> <span>Who will they meet on Wednesday afternoon?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q15\" value=\"A\" data-q=\"15\" onchange=\"setQ(15,this.value)\"><span>an actor</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q15\" value=\"B\" data-q=\"15\" onchange=\"setQ(15,this.value)\"><span>a playwright</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q15\" value=\"C\" data-q=\"15\" onchange=\"setQ(15,this.value)\"><span>a theatre director</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 16-20</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>What does the man say about the play on each of the following days?</p>\n<p><em>Choose&nbsp;<strong>FIVE</strong>&nbsp;answers from the box and write the correct letter,&nbsp;<strong>A-G</strong>, next to Questions</em></p>\n<p><strong>Comments</strong></p>\n<p><strong>Days</strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                                <div class=\"matching-dnd-questions\"><div class=\"question-item\"> • <span>Wednesday</span><span class=\"inline-choice\"><strong class=\"q-number\">16</strong><select data-q=\"16\" onchange=\"setQ(16,this.value)\" aria-label=\"Question 16\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>Thursday</span><span class=\"inline-choice\"><strong class=\"q-number\">17</strong><select data-q=\"17\" onchange=\"setQ(17,this.value)\" aria-label=\"Question 17\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>Friday</span><span class=\"inline-choice\"><strong class=\"q-number\">18</strong><select data-q=\"18\" onchange=\"setQ(18,this.value)\" aria-label=\"Question 18\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>Saturday</span><span class=\"inline-choice\"><strong class=\"q-number\">19</strong><select data-q=\"19\" onchange=\"setQ(19,this.value)\" aria-label=\"Question 19\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>Monday</span><span class=\"inline-choice\"><strong class=\"q-number\">20</strong><select data-q=\"20\" onchange=\"setQ(20,this.value)\" aria-label=\"Question 20\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div></div>                                                                        <div class=\"option-bank\"><div><b>A</b> The playwright will be present.</div><div><b>B</b> The play was written to celebrate an anniversary.</div><div><b>C</b> The play will be performed inside a historic building.</div><div><b>D</b> The play will be accompanied by live music.</div><div><b>E</b> The play will be performed outdoors.</div><div><b>F</b> The play will be performed for the first time.</div><div><b>G</b> The performance will be attended by officials from the town.</div></div>\n                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>\n                                        </div>","audio":"./audio/test-14/section-2.mp3"},{"number":3,"transcript":["BETH: Oh good morning. You must be James. I’m Beth Cartwright – please call be Beth.","JAMES: Thank you.","BETH: Now as this is your first tutorial since you started on the Scandinavian Studies course, I’d like to find out something about you. Why did you decide to take this course?","JAMES: Well, my mother is Danish, and although we always lived in England, she used to talk about her home a lot, and that made me want to visit Denmark. We hardly ever did, though – my mother usually went on her own. But whenever her relations or friends were in England they always came to see us.","BETH: I see. So I assume you already speak Danish, one of the languages you’ll be studying.","JAMES: I can get by when I talk to people, though I’m not terribly accurate.","BETH: Now you probably know that you’ll spend the third year of the course abroad. Have you had any thoughts about that?","JAMES: I’m really looking forward to it. And although Denmark seems the obvious place to go, because of my family connections, I’d love to spend the time in Iceland.","BETH: Oh, I’m sure it can be arranged. Do you have any plans for when you graduate? A lot of students go on to take a master’s degree.","JAMES: I think the four years of the undergraduate course will be enough for me. I’m interested in journalism, and I quite like the idea of moving to Scandinavia and writing for magazines. I’d find that more creative than translating, which I suppose most graduates do.","BETH: OK. Now how are you finding the courses you’re taking this term, James?","JAMES: Well, I’m really enjoying the one on Swedish cinema.","BETH: That’ll continue next term, but the one on Scandinavian literature that’s running at the moment will be replaced by more specialised courses. Oh, and by the way, if you’re interested in watching Danish television programmes – there’s going to be a course on that the term after next.","JAMES: That sounds good.","BETH: Have you started thinking about the literature paper that you have to write in the next few weeks?","JAMES: Yes, my first choice would be to do something on the Icelandic sagas.","BETH: Hmm. The trouble with that is that a lot of people choose that topic, and it can be difficult to get hold of the books you’ll need. Why not leave that for another time?","JAMES: Right.","BETH: You might find modern novels or 19th century playwrights interesting.","JAMES: I’ve read or seen several plays in translation, so that would be a good idea.","BETH: Fine. I’ll put you down for that topic.","JAMES: Right. So what would you advise me to aim at in the paper?","BETH: First I suggest you avoid taking one writer and going into a great deal of detail. That approach certainly has its place, but I think you first need to get an understanding of the literature in the context of the society in which it was produced – who it was written for, how it was published, and so on. I also think that’s more fruitful than placing it within the history of the genre.","JAMES: OK, that sounds reasonable.","————————","JAMES: Could I ask for some advice about writing the paper I’m working on about the Vikings? I have to do that this week, and I’m a bit stuck.","BETH: Of course. Have you decided yet what to write about?","JAMES: No, I haven’t. There’s so much that seems interesting – Viking settlement in other countries, trade, mythology …","BETH: Well, what I suggest is that you read an assignment a student wrote last year, which is kept in the library. It’s short and well focused, and I’m sure you’ll find it helpful. I’ll give you the details in a moment. Textbooks usually cover so many topics, it can be very difficult to choose just one.","JAMES: OK. I’ve got a DVD of the film about the Vikings that came out earlier this year. Should I watch that again?","BETH: If it’s the one I am thinking of, hmm, I’d ignore it – it’s more fantasy than reality. But I’ve got a recording of a documentary that you should watch. It makes some interesting and provocative points, which I think will help you to focus your topic.","JAMES: Right.","BETH: So then should I work out an outline?","JAMES: Yes. Just headings for different sections, at this stage. And then you should start looking for suitable articles and books to draw on, and take notes which you organise according to those headings.","BETH: I see.","JAMES: Then put short phrases and sentences as bullet points under each heading. Make sure that this skeleton makes sense and flows properly, before writing up the paper in full.","BETH: OK. Thanks, that’s very helpful."],"cloze":"<p>BETH: Oh good morning. You must be James. I’m Beth Cartwright – please call be Beth.</p><p>JAMES: Thank you.</p><p>BETH: Now as this is your first tutorial since you started on the <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>, I’d like to find out something about you. Why did you decide to take this course?</p><p>JAMES: Well, my <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>, and although we always lived in England, she used to talk about her home a lot, and that made me want to visit Denmark. We hardly ever did, though – my mother usually went on her own. But whenever her relations or friends were in England they always came to see us.</p><p>BETH: I see. So I assume you already speak Danish, one of the languages you’ll be studying.</p><p>JAMES: I can <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>, though I’m not terribly accurate.</p><p>BETH: Now you probably know that you’ll <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>. Have you had any thoughts about that?</p><p>JAMES: I’m really looking forward to it. And although Denmark seems the obvious place to go, because of my <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span>, I’d love to spend the time in Iceland.</p><p>BETH: Oh, I’m sure it can be arranged. Do you have any plans for when you graduate? A lot of students go on to <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span>.</p><p>JAMES: I think the four years of the undergraduate course will be enough for me. I’m <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span>, and I quite like the idea of moving to Scandinavia and writing for magazines. I’d find that more creative than translating, which I suppose most graduates do.</p><p>BETH: OK. Now how are you finding the courses you’re taking this term, James?</p><p>JAMES: Well, I’m really enjoying the one on <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>.</p><p>BETH: That’ll continue next term, but the one on Scandinavian literature that’s running at the moment will be replaced by <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" ce about writing the <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span>? I have to do that this week, and I’m a bit stuck.</p><p>BETH: Of course. Have you decided yet what to write about?</p><p>JAMES: No, I haven’t. There’s so much that seems interesting – Viking settlement in other countries, trade, mythology …</p><p>BETH: Well, what I suggest is that you read an assignment a student wrote last year, which is kept in the library. It’s <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>, and I’m sure you’ll find it helpful. I’ll give you the details in a moment. Textbooks usually cover so many topics, it can be very difficult to choose just one.</p><p>JAMES: OK. I’ve got a DVD of the film about the Vikings that came out earlier this year. Should I watch that again?</p><p>BETH: If it’s the one I am thinking of, hmm, I’d ignore it – it’s <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span>. But I’ve got a recording of a documentary that you should watch. It makes some <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>, which I think will help you to focus your topic.</p><p>JAMES: Right.</p><p>BETH: So then should I work out an outline?</p><p>JAMES: Yes. Just headings for different sections, at this stage. And then you should start <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> to draw on, and take notes which you organise according to those headings.</p><p>BETH: I see.</p><p>JAMES: Then put short phrases and sentences as <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>. Make sure that this skeleton makes sense and flows properly, before writing up the paper in full.</p><p>BETH: OK. Thanks, that’s very helpful.</p>","clozeAnswers":["Scandinavian Studies course","mother is Danish","get by when I talk to people","spend the third year of the course abroad","family connections","take a master’s degree","interested in journalism","Swedish cinema","more specialised courses","Icelandic sagas","difficult to get hold of the books","19th century playwrights","understanding of the literature","context of the society","paper I’m working on about the Vikings","short and well focused","more fantasy than reality","interesting and provocative points","looking for suitable articles and books","bullet points under each heading"],"vocab":[{"word":"get by","ipa":"/ɡet baɪ/","pos":"Cụm động từ (phr.v)","meaning":"xoay xở giao tiếp ở mức đủ dùng","example":"James can get by when speaking Danish.","exampleVi":"James có thể giao tiếp tiếng Đan Mạch ở mức đủ dùng."},{"word":"undergraduate","ipa":"/ˌʌndəˈɡrædʒuət/","pos":"Tính từ (adj)","meaning":"thuộc bậc đại học","example":"The undergraduate course lasts four years.","exampleVi":"Khóa học bậc đại học kéo dài bốn năm."},{"word":"playwright","ipa":"/ˈpleɪraɪt/","pos":"Danh từ (n)","meaning":"nhà viết kịch","example":"He studies nineteenth-century playwrights.","exampleVi":"Anh ấy nghiên cứu các nhà viết kịch thế kỷ mười chín."},{"word":"fruitful","ipa":"/ˈfruːtfəl/","pos":"Tính từ (adj)","meaning":"hữu ích, cho kết quả tốt","example":"The tutor recommends a more fruitful approach.","exampleVi":"Gia sư đề xuất một cách tiếp cận hiệu quả hơn."},{"word":"provocative","ipa":"/prəˈvɒkətɪv/","pos":"Tính từ (adj)","meaning":"gợi suy nghĩ, gây tranh luận","example":"The documentary raises provocative questions.","exampleVi":"Bộ phim tài liệu nêu ra những câu hỏi gợi suy nghĩ."},{"word":"skeleton","ipa":"/ˈskelɪtən/","pos":"Danh từ (n)","meaning":"khung sườn bài viết","example":"Build a clear skeleton before writing the paper.","exampleVi":"Hãy dựng một khung bài rõ ràng trước khi viết."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 21-25</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose the correct letter,&nbsp;<strong>A</strong>,&nbsp;<strong>B</strong>&nbsp;or&nbsp;<strong>C</strong>.</p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Scandinavian Studies</strong></strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">21</strong> <span>James chose to take Scandinavian Studies because when he was a child</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q21\" value=\"A\" data-q=\"21\" onchange=\"setQ(21,this.value)\"><span>he was often taken to Denmark.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q21\" value=\"B\" data-q=\"21\" onchange=\"setQ(21,this.value)\"><span>his mother spoke to him in Danish.</span></div>
