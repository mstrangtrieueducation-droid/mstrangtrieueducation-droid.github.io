e on</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q24\" value=\"A\" data-q=\"24\" onchange=\"setQ(24,this.value)\"><span>19th century playwrights</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q24\" value=\"B\" data-q=\"24\" onchange=\"setQ(24,this.value)\"><span>the Icelandic sagas</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q24\" value=\"C\" data-q=\"24\" onchange=\"setQ(24,this.value)\"><span>modern Scandinavian novels.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">25</strong> <span>Beth recommends that James’s paper should be</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q25\" value=\"A\" data-q=\"25\" onchange=\"setQ(25,this.value)\"><span>a historical overview of the genre.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q25\" value=\"B\" data-q=\"25\" onchange=\"setQ(25,this.value)\"><span>an in-depth analysis of a single writer.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q25\" value=\"C\" data-q=\"25\" onchange=\"setQ(25,this.value)\"><span>a study of the social background to the literature.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 26-30</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the flow-chart below.</p>\n<p><em>Choose&nbsp;<strong>FIVE</strong>&nbsp;answers from the box and write the correct letter,&nbsp;<strong>A-G</strong>, next to Questions</em></p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>How James will write his paper on the Vikings</strong></strong></p>\n<p>\n</p><p>He’ll read a <span class=\"question-item\"><span class=\"inline-choice\"><strong class=\"q-number\">26</strong><select data-q=\"26\" onchange=\"setQ(26,this.value)\" aria-label=\"Question 26\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></span>&nbsp;and choose his topic.</p>\n<p>↓</p>\n<p>He’ll borrow a <span class=\"question-item\"><span class=\"inline-choice\"><strong class=\"q-number\">27</strong><select data-q=\"27\" onchange=\"setQ(27,this.value)\" aria-label=\"Question 27\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></span>&nbsp;from Beth.</p>\n<p>↓</p>\n<p>He’ll plan the <span class=\"question-item\"><span class=\"inline-choice\"><strong class=\"q-number\">28</strong><select data-q=\"28\" onchange=\"setQ(28,this.value)\" aria-label=\"Question 28\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></span>&nbsp;of the paper.</p>\n<p>↓</p>\n<p>He’ll read some source material and write <span class=\"question-item\"><span class=\"inline-choice\"><strong class=\"q-number\">29</strong><select data-q=\"29\" onchange=\"setQ(29,this.value)\" aria-label=\"Question 29\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></span>.</p>\n<p>↓</p>\n<p>He’ll write the paper using <span class=\"question-item\"><span class=\"inline-choice\"><strong class=\"q-number\">30</strong><select data-q=\"30\" onchange=\"setQ(30,this.value)\" aria-label=\"Question 30\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></span>.</p>\n<p>↓</p>\n<p>He’ll write the complete paper.</p>\n</div>                                                <div class=\"option-bank\"><div><b>A</b> bullet points</div><div><b>B</b> film</div><div><b>C</b> notes</div><div><b>D</b> structure</div><div><b>E</b> student paper</div><div><b>F</b> textbook</div><div><b>G</b> documentary</div></div>\n                                                                                    </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                                \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>\n                                        </div>","audio":"./audio/test-14/section-3.mp3"},{"number":4,"transcript":["Over the years, attitudes towards workers have changed considerably. After all, there was a time when workers had no rights at all, and laboured in appalling conditions. Conditions have improved a lot, but conflict in the workplace is still common. And human resources managers nowadays need to be able to deal with it when necessary.","What is conflict in the workplace? Definitions vary, but I’m taking it to refer to a whole range of behaviours that the victim finds unacceptable, from minor, harmless arguments to – at the opposite extreme – physical violence. Much of this is covered by the term bullying, by which I mean one or more people behaving abusively or aggressively against another who is in a weaker position. Although all behaviour like this is a form of conflict, not all conflict can be described in these terms.","As with all human behaviour, there are numerous reasons for it. But often it’s caused by someone who feels the need to show their superiority over someone else, in order to feel that they aren’t at the lowest level in a hierarchy or a group of people.","In some cases one person simply dislikes the other, on the basis that the personality of one is in some way incompatible with that of the other person. A general habit of optimism in one person could make them intolerant of a colleague who’s constantly pessimistic – not that that justifies treating them badly, of course.","Some conflicts arise when people are more interested in promoting themselves and their team than in the company as a whole. These conflicts are called ‘structural’, and could come about, for example, when a sales team believe they are the only people in the business who do any useful work, and look down on behind-the-scenes administrators.","Conflict obviously affects the individuals concerned – the situation is likely to be very stressful for victims, resulting in their absence from work, possibly for months. For the company, if no effort is made to deal with conflict, it can spiral out of control, and even lead to the breakdown of the business.","Some interesting work with chief executives – CEOs – has uncovered some of the reasons why they may treat colleagues badly. Many CEOs combine two opposing characteristics: confidence – that is, the belief that they’re capable of great achievements – with a high level of anxiety, a fear of missing targets, whether set by themselves or by the directors of the company. This combination can make them respond badly to anyone who questions their decisions.","In a high pressure work environment, such characteristics become problematic. And it’s particularly difficult to tackle the situation where colleagues, managers and board members are all trying to achieve their own visions. When they can’t agree on strategic issues and on where they see the business going, there are real problems.","For managers at lower levels within the organisation, it might seem that an autocratic form of management – where the chief executive gives orders and everyone else has to obey – would see more conflict than others. Interestingly, though, a company with a more democratic business model, can suffer more, when uncertainly about who to report to leads to conflicting demands.","Now I’ll say a little about dealing with the type of conflict that has harmful effects. Of course the ideal is to prevent it arising in the first place. A good manager, at any level, will make efforts to earn the respect of the people they work with, particularly those who report to them. That will involve politeness in all communications, and treating them as equals who happen to have a different role within the organisation.","Sometimes, of course, conflict does occur, and can get out of hand. In such cases the human resources department often gets involved. However, if one of the parties in a conflict sees human resources as simply a mouthpiece for the chief executive, then an external mediator might be able to help. By talking to both sides, and trying to find the truth of what’s been happening, they can build a clear picture of the situation, and give feedback that both sides will accept, precisely because they’re independent."],"cloze":"<p>Over the years, attitudes towards workers have changed considerably. After all, there was a time when workers had no rights at all, and <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>. Conditions have improved a lot, but <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> is still common. And human resources managers nowadays need to be able to deal with it when necessary.</p><p>What is conflict in the workplace? Definitions vary, but I’m taking it to refer to a whole <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span> that the victim finds unacceptable, from minor, harmless arguments to – at the opposite extreme – <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>. Much of this is covered by the term bullying, by which I mean one or more people <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> against another who is in a <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span>. Although all behaviour like this is a form of conflict, not all conflict can be described in these terms.</p><p>As with all human behaviour, there are numerous reasons for it. But often it’s caused by someone who feels the need to <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span> over someone else, in order to feel that they aren’t at the lowest level in a hierarchy or a group of people.</p><p>In some cases one person simply dislikes the other, on the basis that the <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span> is in some way incompatible with that of the other person. A general <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span> in one person could make them intolerant of a colleague who’s constantly pessimistic – not that that justifies treating them badly, of course.</p><p>Some conflicts arise when people are more interested in promoting themselves and their team than in the company as a whole. These <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>, and could come about, for example, when a sales team believe they are the only people in the business who do any useful work, and look down on <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span>.</p><p>Conflict obviously affects the individuals concerned – the situation is likely to be very stressful for victims, resulting in their absence from work, possibly for months. For the company, if no effort is made to deal with conflict, it can <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span>, and even lead to the breakdown of the business.</p><p>Some interesting work with chief executives – CEOs – has uncovered some of the reasons why they may treat colleagues badly. Many CEOs combine two <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span>: confidence – that is, the belief that they’re capable of great achievements – with <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span>, a fear of missing targets, whether set by themselves or by the directors of the company. This combination can make them respond badly to anyone who <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span>.</p><p>In a high pressure work environment, such characteristics become problematic. And it’s particularly difficult to tackle the situation where colleagues, managers and board members are all trying to <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>. When they can’t agree on strategic issues and on where they see the business going, there are real problems.</p><p>For managers at lower levels within the organisation, it might seem that an autocratic form of management – where the chief executive gives orders and everyone else has to obey – would see more conflict than others. Interestingly, though, a company with a more <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span>, can suffer more, when uncertainly about who to report to leads to conflicting demands.</p><p>Now I’ll say a little about dealing with the type of conflict that has harmful effects. Of course the ideal is to prevent it arising in the first place. A good manager, at any level, will make efforts to <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span> of the people they work with, particularly those who report to them. That will involve politeness in all communications, and treating them as equals who happen to have a different role within the organisation.</p><p>Sometimes, of course, conflict does occur, and can get out of hand. In such cases the human resources department often gets involved. However, if one of the parties in a conflict sees human resources as simply a mouthpiece for the chief executive, then an <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> might be able to help. By talking to both sides, and trying to find the truth of what’s been happening, they can build a clear picture of the situation, and <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>, precisely because they’re independent.</p>","clozeAnswers":["laboured in appalling conditions","conflict in the workplace","range of behaviours","physical violence","behaving abusively or aggressively","weaker position","show their superiority","personality of one","habit of optimism","conflicts are called ‘structural’","behind-the-scenes administrators","spiral out of control","opposing characteristics","a high level of anxiety","questions their decisions","achieve their own visions","democratic business model","earn the respect","external mediator","give feedback that both sides will accept"],"vocab":[{"word":"bullying","ipa":"/ˈbʊliɪŋ/","pos":"Danh từ (n)","meaning":"hành vi bắt nạt","example":"Workplace bullying is a serious form of conflict.","exampleVi":"Bắt nạt nơi làm việc là một dạng xung đột nghiêm trọng."},{"word":"superiority","ipa":"/suːˌpɪəriˈɒrəti/","pos":"Danh từ (n)","meaning":"sự vượt trội, ưu thế","example":"Some people need to show their superiority.","exampleVi":"Một số người cần thể hiện sự vượt trội của mình."},{"word":"incompatible","ipa":"/ˌɪnkəmˈpætəbəl/","pos":"Tính từ (adj)","meaning":"không tương hợp","example":"Their personalities may be incompatible.","exampleVi":"Tính cách của họ có thể không tương hợp."},{"word":"structural","ipa":"/ˈstrʌktʃərəl/","pos":"Tính từ (adj)","meaning":"thuộc cơ cấu, cấu trúc","example":"Structural conflict can divide company teams.","exampleVi":"Xung đột cơ cấu có thể chia rẽ các nhóm trong công ty."},{"word":"autocratic","ipa":"/ˌɔːtəˈkrætɪk/","pos":"Tính từ (adj)","meaning":"độc đoán, chuyên quyền","example":"An autocratic manager gives orders directly.","exampleVi":"Một quản lý độc đoán đưa ra mệnh lệnh trực tiếp."},{"word":"mediator","ipa":"/ˈmiːdieɪtə/","pos":"Danh từ (n)","meaning":"người hòa giải","example":"An external mediator can help both sides.","exampleVi":"Một người hòa giải bên ngoài có thể giúp cả hai phía."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 31-40</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the notes below.</p>\n<p>Write&nbsp;<strong>ONE WORD ONLY</strong>&nbsp;for each answer.</p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Conflict at work</strong></strong></p>\n<p>Conflict mostly consists of behaviour in the general category of <span class=\"question-item\"><strong class=\"q-number\">31</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"31\" oninput=\"setQ(31,this.value)\"></span></p>\n<p>Often a result of people wanting to prove their <span class=\"question-item\"><strong class=\"q-number\">32</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"32\" oninput=\"setQ(32,this.value)\"></span></p>\n<p>Also caused by differences in <span class=\"question-item\"><strong class=\"q-number\">33</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"33\" oninput=\"setQ(33,this.value)\"></span> between people ‘<span class=\"question-item\"><strong class=\"q-number\">34</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"34\" oninput=\"setQ(34,this.value)\"></span>’ conflicts: people more concerned about own team than about company</p>\n<p>Conflict-related stress can cause <span class=\"question-item\"><strong class=\"q-number\">35</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"35\" oninput=\"setQ(35,this.value)\"></span>&nbsp;that may last for months</p>\n<p><strong>Chief Executives (CEOs)</strong></p>\n<p>Many have both <span class=\"question-item\"><strong class=\"q-number\">36</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"36\" oninput=\"setQ(36,this.value)\"></span>&nbsp;and anxiety</p>\n<p>May not like to have their decisions questioned</p>\n<p>There may be conflict between people who have different <span class=\"question-item\"><strong class=\"q-number\">37</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"37\" oninput=\"setQ(37,this.value)\"></span></p>\n<p><strong>Other managers</strong></p>\n<p>A structure that is more <span class=\"question-item\"><strong class=\"q-number\">38</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"38\" oninput=\"setQ(38,this.value)\"></span>&nbsp;may create a feeling of uncertainly about who staff should report to.</p>\n<p><strong>Minimising conflict</strong></p>\n<p>Bosses need to try hard to gain <span class=\"question-item\"><strong class=\"q-number\">39</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"39\" oninput=\"setQ(39,this.value)\"></span></p>\n<p>Someone from outside the company may be given the role of <span class=\"question-item\"><strong class=\"q-number\">40</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"40\" oninput=\"setQ(40,this.value)\"></span>&nbsp;in order to resolve conflicts.</p>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-14/section-4.mp3"}],"form":{"url":"https://docs.google.com/forms/d/e/1FAIpQLSfi_gKYiTBEuV8CW68pfTJjf7MVPpMDVNMkjZWy1AjlBfigfQ/formResponse","week":"entry.1893665426","name":"entry.442430322","studentClass":"entry.55126249","d1":"entry.1101074174","i1":"entry.1320743073","d2":"entry.838708618","i2":"entry.950878529","total":"entry.219410480"}};</script><script>const SCHEMA_VERSION=3;
let si=0,stage="vocab",scoreSendPromise=null,scoreRetryTimer=null,scoreRetryAttempt=0;
const storageKey=`ielts-nghe-w${DATA.week}`;
const scoreParts=Object.freeze([
  {key:"1-2",label:()=>`Tuần ${DATA.week} · Sections 1–2`,a:1,b:2},
  {key:"3-4",label:()=>`Tuần ${DATA.week} · Sections 3–4`,a:3,b:4}
]);
function loadState(){try{const value=JSON.parse(localStorage.getItem(storageKey)||"{}");return value&&typeof value==="object"?value:{}}catch{return {}}}
function freshSubmission(fingerprint=""){return {status:"idle",fingerprint,sentAt:"",parts:{"1-2":"idle","3-4":"idle"}}}
function normalizeSubmission(value){
  const parts={};scoreParts.forEach(part=>{const saved=value?.parts?.[part.key];parts[part.key]=saved==="sent"?"sent":saved==="error"?"error":"idle"});
  const complete=scoreParts.every(part=>parts[part.key]==="sent");
  return {status:complete?"sent":value?.status==="error"?"error":"idle",fingerprint:String(value?.fingerprint||""),sentAt:complete?String(value?.sentAt||""):"",parts};
}
function freshFinal(){return {phase:"draft",requestedAt:"",answersFingerprint:"",submittedAt:""}}
const state=loadState(),loadedSchemaVersion=state.schemaVersion;
state.q=state.q&&typeof state.q==="object"?state.q:{};
state.g=state.g&&typeof state.g==="object"?state.g:{};
state.studentName=String(state.studentName||"");state.studentClass=String(state.studentClass||"");
if(loadedSchemaVersion!==SCHEMA_VERSION){
  state.scores={};state.confirmations={};state.review={};state.submission=freshSubmission();state.final=freshFinal();
}else{
  state.scores=state.scores&&typeof state.scores==="object"?state.scores:{};
  state.confirmations=state.confirmations&&typeof state.confirmations==="object"?state.confirmations:{};
  state.review=state.review&&typeof state.review==="object"?state.review:{};
  state.submission=normalizeSubmission(state.submission);
  state.final=state.final&&typeof state.final==="object"?{...freshFinal(),...state.final}:freshFinal();
  if(state.submission.status==="sending")state.submission.status="error";
  if(state.final.phase==="sending")state.final.phase="error";
}
state.schemaVersion=SCHEMA_VERSION;
const $=s=>document.querySelector(s);
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"").replace(/[^a-z0-9]+/g," ").trim();
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");
const identityPart=s=>String(s??"").normalize("NFKC").trim().toLowerCase().replace(/\s+/g," ");
const identityKey=(name,studentClass)=>`${identityPart(name)}|${identityPart(studentClass)}`;
const save=()=>localStorage.setItem(storageKey,JSON.stringify(state));
const scoreKeys=()=>Array.from({length:4},(_,i)=>[`d${i+1}`,`i${i+1}`]).flat();
function answersFingerprint(){return JSON.stringify({week:DATA.week,student:identityKey(state.studentName,state.studentClass),q:state.q,g:state.g})}
const finalRequested=()=>Boolean(state.final?.requestedAt&&state.final?.answersFingerprint&&state.final.answersFingerprint===answersFingerprint());
const finalSubmitted=()=>finalRequested()&&state.final.phase==="submitted"&&state.submission.status==="sent";
const scoresReady=()=>finalRequested()&&scoreKeys().every(key=>Number.isInteger(state.scores[key]));
const scoreFingerprint=()=>JSON.stringify({week:DATA.week,student:identityKey(state.studentName,state.studentClass),requestedAt:state.final.requestedAt,scores:scoreKeys().map(key=>state.scores[key])});
function clearScoreRetry(){if(scoreRetryTimer){clearTimeout(scoreRetryTimer);scoreRetryTimer=null}}
function section(index=si){return DATA.sections[index]}
function range(index=si){return [index*10+1,index*10+10]}
function questionGroupsFor(index=si){
  const groups=new Map();
  for(const match of section(index).questions.matchAll(/data-group="([\d-]+)"/g)){
    const key=match[1];if(!groups.has(key))groups.set(key,key.split("-").map(Number));
  }
  return groups;
}
function dictationComplete(index){return section(index).clozeAnswers.every((_,gap)=>norm(state.g[`${index+1}-${gap}`]))}
function ieltsComplete(index){
  const [first,last]=range(index),grouped=new Set();
  for(const [key,numbers] of questionGroupsFor(index)){if((state.q[key]||[]).length!==numbers.length)return false;numbers.forEach(number=>grouped.add(number))}
  for(let question=first;question<=last;question++){if(!grouped.has(question)&&!norm(state.q[question]))return false}
  return true;
}
function currentComplete(){return stage==="dictation"?dictationComplete(si):stage==="ielts"?ieltsComplete(si):true}
function allResponsesComplete(){return DATA.sections.every((_,index)=>dictationComplete(index)&&ieltsComplete(index))}
function completedPartCount(){return DATA.sections.reduce((count,_,index)=>count+Number(dictationComplete(index))+Number(ieltsComplete(index)),0)}
function draftProgressText(){return `Đã điền đủ ${completedPartCount()}/8 phần. Điểm và đáp án chỉ mở sau khi em bấm xác nhận nộp toàn bài.`}
function setQ(question,value){if(finalRequested())return;state.q[question]=value;save();refreshDraftUi()}
function setGap(gap,value){if(finalRequested())return;state.g[`${si+1}-${gap}`]=value;save();refreshDraftUi()}
function setGroup(key,value,box,max){
  if(finalRequested()){box.checked=!box.checked;return}
  let values=state.q[key]||[];
  if(box.checked&&!values.includes(value)&&values.length>=max){box.checked=false;return}
  values=box.checked?[...new Set([...values,value])]:values.filter(item=>item!==value);state.q[key]=values;save();refreshDraftUi();
}
function speak(word){speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(word);utterance.lang="en-GB";speechSynthesis.speak(utterance)}
function sectionAudioUrl(){
  const raw=String(section().audio||"").trim();if(!raw)return "";
  try{const url=new URL(raw,window.location.href);return url.origin===window.location.origin&&/\.mp3$/i.test(url.pathname)?url.href:""}catch{return ""}
}
function formatAudioDuration(seconds){
  if(!Number.isFinite(seconds)||seconds<=0)return "";
  const total=Math.round(seconds),hours=Math.floor(total/3600),minutes=Math.floor(total%3600/60),secs=String(total%60).padStart(2,"0");
  return hours?`${hours}:${String(minutes).padStart(2,"0")}:${secs}`:`${minutes}:${secs}`;
}
function setAudioStatus(message,{error=false,retry=false}={}){const status=$("#audioStatus"),button=$("#audioRetry");if(status){status.textContent=message;status.classList.toggle("bad",error)}if(button)button.hidden=!retry}
function retryAudio(){const audio=$("#sectionAudio"),url=audio?.dataset.audioUrl;if(!audio||!url)return;setAudioStatus("Đang tải lại audio…");audio.pause();audio.src=url;audio.load()}
function initAudioPlayer(){
  const audio=$("#sectionAudio"),url=audio?.dataset.audioUrl;if(!audio||!url){setAudioStatus("Audio chưa được cấu hình đúng. Vui lòng báo giáo viên.",{error:true});return}
  const ready=()=>setAudioStatus(`Audio sẵn sàng${formatAudioDuration(audio.duration)?` · ${formatAudioDuration(audio.duration)}`:""}`);
  const failed=()=>{console.error("[IELTS Listening] Không tải được audio",{week:DATA.week,section:si+1,url,errorCode:audio.error?.code||0});setAudioStatus("Không tải được audio. Kiểm tra kết nối rồi bấm “Thử lại”.",{error:true,retry:true})};
  audio.addEventListener("loadstart",()=>setAudioStatus("Đang tải audio…"));audio.addEventListener("loadedmetadata",ready);audio.addEventListener("canplay",ready);audio.addEventListener("stalled",()=>setAudioStatus("Audio đang tải chậm. Vui lòng chờ hoặc bấm “Thử lại”.",{retry:true}));audio.addEventListener("error",failed);$("#audioRetry").onclick=retryAudio;
  if(audio.error)failed();else if(audio.readyState>=1)ready();else setAudioStatus("Đang tải audio…");
}
function audioBox(){const url=sectionAudioUrl();return `<b>● AUDIO GỐC · SECTION ${si+1}</b><audio id="sectionAudio" controls preload="metadata" src="${esc(url)}" data-audio-url="${esc(url)}" aria-describedby="audioStatus"></audio><div id="audioStatus" class="audio-status" role="status" aria-live="polite">Đang tải audio…</div><button id="audioRetry" class="audio-retry" type="button" hidden>Thử lại audio</button>`}
function vocab(){return `<div class="vocab-grid">${section().vocab.map(item=>`<article class="vocab-card"><button class="sound" type="button" onclick='speak(${JSON.stringify(item.word)})'>◖))</button><h3>${item.word}</h3><div class="ipa">${item.ipa}</div><div class="pos">${item.pos}</div><div class="meaning">${item.meaning}</div><p class="example">${item.example}</p><div class="translation">${item.exampleVi}</div></article>`).join("")}</div>`}
function restoreInputs(){
  document.querySelectorAll("[data-q]").forEach(element=>{const question=element.dataset.q;if(element.type==="radio")element.checked=state.q[question]===element.value;else element.value=state.q[question]||""});
  document.querySelectorAll("[data-group]").forEach(element=>element.checked=(state.q[element.dataset.group]||[]).includes(element.value));
  document.querySelectorAll("[data-gap]").forEach(element=>element.value=state.g[`${si+1}-${element.dataset.gap}`]||"");
  if(finalRequested())document.querySelectorAll("#content input,#content select").forEach(control=>control.disabled=true);
}
function updateStageTabs(){
  document.querySelectorAll(".stage-tabs button").forEach(button=>{
    button.classList.toggle("on",button.dataset.stage===stage);
    if(button.dataset.stage==="score"){
      button.textContent=finalSubmitted()?"D · Kết quả":"D · Nộp bài";button.disabled=false;
      button.title=allResponsesComplete()||finalRequested()?"Xác nhận nộp bài hoặc xem trạng thái":"Xem tiến độ hoàn thành toàn bài";
    }
  });
}
function partProgressView(){
  const done=currentComplete();
  if(finalRequested())return `<div class="result">Bài đã khóa sau khi xác nhận nộp. Xem trạng thái và đáp án tại mục D.</div>`;
  return `<div id="partProgress" class="result ${done?"good":""}">${done?"✓ Phần này đã điền đủ. Hãy tiếp tục hoàn thành các phần còn lại.":stage==="dictation"?"Điền đủ 20/20 chỗ. Hệ thống chỉ lưu nháp, không tự nộp.":"Làm đủ 10/10 câu. Hệ thống chỉ lưu nháp, không tự nộp."}<br><small>${draftProgressText()}</small></div>`;
}
function answerKeyView(){
  return DATA.sections.map((item,index)=>{
    const dictation=section(index).clozeAnswers.map((answer,gap)=>`<div><b>${gap+1}.</b> ${esc(answer)}</div>`).join("");
    const [first,last]=range(index),ielts=[];for(let question=first;question<=last;question++)ielts.push(`<div><b>${question}.</b> ${esc(DATA.answers[question]?.[0]||"")}</div>`);
    return `<details><summary>Section ${index+1} · Chính tả ${state.scores[`d${index+1}`]}/20 · IELTS ${state.scores[`i${index+1}`]}/10</summary><div class="answer-review"><strong>Đáp án chính tả</strong>${dictation}<strong>Đáp án IELTS</strong>${ielts.join("")}</div></details>`;
  }).join("");
}
function scoreGridView(){return `<div class="score-grid">${scoreKeys().map(key=>`<div class="score"><small>${key[0]==="d"?"Chính tả":"IELTS"} · Section ${key.slice(1)}</small><br><b>${state.scores[key]}/${key[0]==="d"?20:10}</b></div>`).join("")}</div>`}
function submissionMessage(){
  if(!finalRequested())return "Bài vẫn đang ở trạng thái nháp.";
  const fingerprint=scoreFingerprint(),current=state.submission.fingerprint===fingerprint,done=current?scoreParts.filter(part=>state.submission.parts?.[part.key]==="sent").length:0;
  if(finalSubmitted())return "✓ Điểm đã được tự động ghi vào sổ lớp. Đáp án đã mở bên dưới.";
  if(current&&state.submission.status==="sending")return `Đang tự động ghi điểm vào sổ lớp${done?` · đã ghi ${done}/2 nhóm`:""}…`;
  if(current&&state.submission.status==="error")return `Mạng đang gián đoạn${done?` · đã giữ an toàn ${done}/2 nhóm điểm`:""}. Hệ thống sẽ tự gửi lại phần còn thiếu.`;
  return "Đang chuẩn bị ghi điểm vào sổ lớp…";
}
function finalView(){
  const completed=completedPartCount(),ready=allResponsesComplete();
  if(!finalRequested())return `<div class="score-view"><h2>Xác nhận nộp toàn bài</h2><div class="student-summary"><span>${esc(state.studentName)}</span><span>${esc(state.studentClass)}</span></div><div class="result">${draftProgressText()}</div><button id="finalSubmit" class="submit" type="button" ${ready?"":"disabled"} onclick="finalizeSubmission(event)">${ready?"XÁC NHẬN ĐÃ LÀM XONG & GHI ĐIỂM":`HOÀN THÀNH ĐỦ 8/8 PHẦN (${completed}/8)`}</button><p>Chỉ nút này mới chấm bài và gửi điểm. Nhập câu cuối không tự nộp.</p></div>`;
  if(!finalSubmitted())return `<div class="score-view"><h2>Đang ghi điểm</h2><div class="student-summary"><span>${esc(state.studentName)}</span><span>${esc(state.studentClass)}</span></div><div id="scoreStatus" class="result">${submissionMessage()}</div>${state.submission.status==="error"?'<button class="submit" type="button" onclick="resumeFinalSubmission()">THỬ GỬI LẠI ĐIỂM</button>':""}<p>Bài đã khóa. Đáp án sẽ mở ngay sau khi hệ thống ghi điểm xong.</p></div>`;
  const total=scoreKeys().reduce((sum,key)=>sum+state.scores[key],0);
  return `<div class="score-view"><h2>Kết quả Tuần ${DATA.week}</h2><div class="student-summary"><span>${esc(state.studentName)}</span><span>${esc(state.studentClass)}</span></div><div id="scoreStatus" class="result">${submissionMessage()}<br><b>Tổng điểm: ${total}/120</b></div>${scoreGridView()}<h3>Đáp án toàn bài</h3>${answerKeyView()}</div>`;
}
function refreshDraftUi(){
  updateStageTabs();const progress=$("#partProgress");if(progress&&!finalRequested())progress.outerHTML=partProgressView();
  if(stage==="score"&&!finalRequested()){const content=$("#content");if(content)content.innerHTML=finalView()}
}
function render(){
  document.querySelectorAll(".section-tabs button").forEach((button,index)=>button.classList.toggle("on",index===si));updateStageTabs();
  if(stage==="vocab")$("#content").innerHTML=vocab();
  if(stage==="dictation")$("#content").innerHTML=`<div class="workspace"><aside class="audio-side">${audioBox()}</aside><div class="scroll-panel transcript">${section().cloze}</div></div>${partProgressView()}`;
  if(stage==="ielts")$("#content").innerHTML=`<div class="workspace"><aside class="audio-side">${audioBox()}</aside><div class="scroll-panel">${section().questions}</div></div>${partProgressView()}`;
  if(stage==="score")$("#content").innerHTML=finalView();
  restoreInputs();if(stage==="dictation"||stage==="ielts")initAudioPlayer();
}
function gradeAllResponses(){
  const scores={},review={};
  DATA.sections.forEach((item,index)=>{
    let dictationScore=0;item.clozeAnswers.forEach((answer,gap)=>{if(norm(state.g[`${index+1}-${gap}`])===norm(answer))dictationScore++});scores[`d${index+1}`]=dictationScore;
    const [first,last]=range(index),grouped=new Set();let ieltsScore=0;
    for(const [key,numbers] of questionGroupsFor(index)){
      const chosen=state.q[key]||[],valid=new Set(numbers.flatMap(question=>DATA.answers[question]||[]).map(norm));ieltsScore+=chosen.filter(value=>valid.has(norm(value))).length;numbers.forEach(question=>grouped.add(question));
    }
    for(let question=first;question<=last;question++){if(grouped.has(question))continue;if((DATA.answers[question]||[]).map(norm).includes(norm(state.q[question])))ieltsScore++}
    scores[`i${index+1}`]=ieltsScore;review[`s${index+1}`]={dictationScore,ieltsScore};
  });
  return {scores,review};
}
async function finalizeSubmission(event){
  event?.preventDefault();event?.stopPropagation();
  if(!event?.isTrusted||finalRequested()||!allResponsesComplete())return false;
  if(!window.confirm("Em xác nhận đã làm xong toàn bộ bài. Hệ thống sẽ khóa câu trả lời, ghi điểm vào sổ lớp rồi mới mở đáp án. Em có chắc chắn nộp bài?"))return false;
  const requestedAt=new Date().toISOString(),fingerprint=answersFingerprint(),graded=gradeAllResponses();
  state.scores=graded.scores;state.review=graded.review;state.confirmations=Object.fromEntries(scoreKeys().map(key=>[key,requestedAt]));state.final={phase:"sending",requestedAt,answersFingerprint:fingerprint,submittedAt:""};state.submission=freshSubmission();save();stage="score";render();
  await resumeFinalSubmission();return true;
}
function scorePayload(label,a,b){
  const payload=new URLSearchParams();payload.set(DATA.form.week,label);payload.set(DATA.form.name,state.studentName.trim());payload.set(DATA.form.studentClass,state.studentClass);
  payload.set(DATA.form.d1,String(state.scores[`d${a}`]));payload.set(DATA.form.i1,String(state.scores[`i${a}`]));payload.set(DATA.form.d2,String(state.scores[`d${b}`]));payload.set(DATA.form.i2,String(state.scores[`i${b}`]));payload.set(DATA.form.total,String(state.scores[`d${a}`]+state.scores[`i${a}`]+state.scores[`d${b}`]+state.scores[`i${b}`]));return payload;
}
function scheduleScoreRetry(){
  if(scoreRetryTimer||finalSubmitted()||!finalRequested())return;
  const delays=[5000,15000,30000,60000],delay=delays[Math.min(scoreRetryAttempt,delays.length-1)];scoreRetryAttempt++;
  scoreRetryTimer=setTimeout(()=>{scoreRetryTimer=null;if(finalRequested()&&!finalSubmitted())void resumeFinalSubmission()},delay);
}
async function ensureScoresSubmitted(){
  if(!finalRequested()||!scoresReady()||!state.studentName.trim()||!state.studentClass)return false;
  const fingerprint=scoreFingerprint();if(state.submission.fingerprint!==fingerprint)state.submission=freshSubmission(fingerprint);
  if(scoreParts.every(part=>state.submission.parts[part.key]==="sent")){state.submission.status="sent";state.final.phase="submitted";state.final.submittedAt=state.submission.sentAt||new Date().toISOString();save();return true}
  if(scoreSendPromise)return scoreSendPromise;
  clearScoreRetry();state.submission.status="sending";state.final.phase="sending";save();
  scoreSendPromise=(async()=>{
    try{
      for(const part of scoreParts){
        if(state.submission.parts[part.key]==="sent")continue;state.submission.parts[part.key]="sending";save();
        await fetch(DATA.form.url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:scorePayload(part.label(),part.a,part.b).toString()});
        state.submission.parts[part.key]="sent";save();
      }
      state.submission.status="sent";state.submission.sentAt=new Date().toISOString();state.final.phase="submitted";state.final.submittedAt=state.submission.sentAt;scoreRetryAttempt=0;save();return true;
    }catch{
      scoreParts.forEach(part=>{if(state.submission.parts[part.key]==="sending")state.submission.parts[part.key]="error"});state.submission.status="error";state.final.phase="error";save();scheduleScoreRetry();return false;
    }finally{scoreSendPromise=null}
  })();return scoreSendPromise;
}
async function resumeFinalSubmission(){
  if(!finalRequested()||finalSubmitted())return finalSubmitted();const sent=await ensureScoresSubmitted();if(stage==="score")render();return sent;
}
function selectSection(index){si=index;stage="vocab";render()}
$("#sectionTabs").innerHTML=DATA.sections.map((item,index)=>`<button type="button" onclick="selectSection(${index})">SECTION ${item.number}<br><small>Questions ${(item.number-1)*10+1}–${item.number*10}</small></button>`).join("");
document.querySelectorAll(".stage-tabs button").forEach(button=>{button.type="button";button.onclick=()=>{stage=button.dataset.stage;render()}});
const entryName=$("#entryName"),entryClass=$("#entryClass"),enterTest=$("#enterTest");entryName.value=state.studentName;entryClass.value=state.studentClass;enterTest.type="button";
function updateEntryGate(){const ready=entryName.value.trim()&&entryClass.value;enterTest.disabled=!ready;enterTest.textContent=ready?"Vào Listening Test":"Nhập họ tên và chọn lớp để vào bài"}
function resetForStudent(name,studentClass){state.q={};state.g={};state.scores={};state.confirmations={};state.review={};state.submission=freshSubmission();state.final=freshFinal();state.studentName=name;state.studentClass=studentClass;state.studentKey=identityKey(name,studentClass);state.schemaVersion=SCHEMA_VERSION}
function openTest(){
  const name=entryName.value.trim(),studentClass=entryClass.value;if(!name||!studentClass)return;
  const nextKey=identityKey(name,studentClass),previousKey=state.studentKey||identityKey(state.studentName,state.studentClass);if(previousKey&&previousKey!==nextKey)resetForStudent(name,studentClass);else{state.studentName=name;state.studentClass=studentClass;state.studentKey=nextKey}
  save();$("#entryGate").hidden=true;$("#testApp").hidden=false;render();if(finalRequested()&&!finalSubmitted())void resumeFinalSubmission();
}
entryName.oninput=updateEntryGate;entryClass.onchange=updateEntryGate;enterTest.onclick=openTest;entryName.onkeydown=event=>{if(event.key==="Enter"&&!enterTest.disabled)openTest()};
document.addEventListener("keydown",event=>{if(event.key==="Enter"&&event.target.matches("#content input"))event.preventDefault()});
window.addEventListener("online",()=>{clearScoreRetry();if(finalRequested()&&!finalSubmitted())void resumeFinalSubmission()});updateEntryGate();save();render();
</script></body></html>
