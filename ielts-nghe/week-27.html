</style></head><body><section id="entryGate" class="entry-screen"><div class="entry-card"><header class="entry-head"><small>IELTS - NGHE · TUẦN 27</small><h1>Listening Test 17</h1><p>Điền thông tin học sinh trước khi vào bài.</p></header><div class="entry-body"><p class="entry-note">Họ tên và lớp sẽ được giữ lại để gửi điểm sau khi hoàn thành bài.</p><label for="entryName">Họ và tên học sinh</label><input id="entryName" type="text" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"><label for="entryClass">Lớp IELTS</label><select id="entryClass"><option value="">Chọn lớp IELTS</option><option>IELTS 40</option><option>IELTS 41</option><option>IELTS 42</option><option>IELTS 43</option><option>IELTS 44</option><option>IELTS 45</option><option>IELTS 46</option><option>IELTS 47</option><option>IELTS 48</option><option>IELTS 49</option><option>IELTS 50</option><option>IELTS 51</option><option>IELTS 52</option><option>IELTS 53</option></select><button id="enterTest" disabled>Nhập họ tên và chọn lớp để vào bài</button></div></div></section><div id="testApp" hidden><header class="hero"><small>IELTS - NGHE · TUẦN 27</small><h1>Listening Test 17</h1><p>Full Test · Sections 1–4 · 40 questions</p></header><main class="shell"><nav id="sectionTabs" class="section-tabs"></nav><nav class="stage-tabs"><button data-stage="vocab">A · Từ vựng cần lưu ý</button><button data-stage="dictation">B · Điền chính tả</button><button data-stage="ielts">C · Câu hỏi IELTS</button><button data-stage="score">D · Kết quả</button></nav><section id="content" class="lesson"></section></main></div><script>const DATA={"week":27,"test":17,"answers":{"1":["choose"],"2":["private"],"3":["20 percent","20%","twenty percent"],"4":["healthy"],"5":["bones"],"6":["lecture"],"7":["Arretsa"],"8":["vegetarian"],"9":["market"],"10":["knife"],"11":["B"],"12":["C"],"13":["B"],"14":["E"],"15":["D"],"16":["B"],"17":["G"],"18":["C"],"19":["H"],"20":["I"],"21":["A"],"22":["C"],"23":["B"],"24":["C"],"25":["B"],"26":["G"]  build up your bones and make them stronger, that sort of thing.","WOMAN: I see. Well, I might be interested, I’m not sure. Do they have a website I could check?","OFFICIAL: Yes, just key in the name of the school – it’ll come up. And if you want to know more about them, every Thursday evening they have a lecture at the school. It’s free and you don’t need to book or anything, just turn up at 7.30. And that might give you an idea of whether you want to go to an actual class.","—————————","OFFICIAL: OK, there’s one more place you might be interested in. That’s got a rather strange name, it’s called The Arretsa Centre – that’s spelled A-R-R-E-T-S-A.","WOMAN: OK.","OFFICIAL: They’ve got a very good reputation. They do a bit of meat and fish cookery but they mostly specialise in vegetarian dishes.","WOMAN: Right. That’s certainly an area I’d like to learn more about. I’ve got lots of friends who don’t eat meat. In fact, I think I might have seen that school today. Is it just by the market?","OFFICIAL: That’s right. So they don’t have any problem getting their ingredients. They’re right next door. And they also offer a special two-hour course in how to use a knife. They cover all the different skills – buying them, sharpening, chopping techniques. It gets booked up quickly though so you’d need to check it was available.","WOMAN: Right, well thank you very much. I’ll go and …"],"cloze":"<p>OFFICIAL: Hello, Tourist Information Centre, Mike speaking, how can I help you?</p><p>WOMAN: Oh, hi. I wanted to <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>. I believe there are <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>?</p><p>OFFICIAL: Well, they’re open to everyone, but tourists are always welcome. OK, let me give you some details of what’s available. There are several classes. One very popular one i nput\" data-q=\"9\" oninput=\"setQ(9,this.value)\"></span></li>\n<li>a special course in skills with a <span class=\"question-item\"><strong class=\"q-number\">10</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"10\" oninput=\"setQ(10,this.value)\"></span>&nbsp;is sometimes available</li>\n</ul>\n</td>\n</tr>\n</tbody>\n</table>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"https://engnovate.com/wp-content/uploads/2023/07/cambridge-ielts-13-academic-listening-1-audio-1.mp3"},{"number":2,"transcript":["Good evening everyone. My name’s Phil Sutton, and I’m chairman of the Highways Committee. We’ve called this meeting to inform members of the public about the new regulations for traffic and parking we’re proposing for Granford. I’ll start by summarising these changes before we open the meeting to questions.","So, why do we need to make these changes to traffic systems in Granford? Well, we’re very aware that traffic is becoming an increasing problem. It’s been especially noticeable with the increase in heavy traffic while they’ve been building the new hospital. But it’s the overall rise in the volume of traffic of all kinds that’s concerning us. To date there’s not been any increase in traffic accidents, but that’s not something we want to see happen, obviously.","We recently carried out a survey of local residents, and their responses were interesting. People were very concerned about the lack of visibility on some roads due to cars parked along the sides of the roads. We’d expected complaints about the congestion near the school when parents are dropping off their children or picking them up, but this wasn’t top of the list, and nor were noise and fumes from trucks and lorries, though they were mentioned by some people.","We think these new traffic regulations would make a lot of difference. But we still have a long way to go. We’ve managed to keep our proposals within budget, just, so they can be covered by the Council. But, of course, it’s no good introducing new regulations if we don’t have a way of making sure that everyone obeys them, and that’s an area we’re still working on with the help of representatives from the police force.","—————","OK, so this slide shows a map of the central area of Granford, with the High Street in the middle and School Road on the right. Now, we already have a set of traffic lights in the High Street at the junction with Station Road, but we’re planning to have another set at the other end, at the School Road junction, to regulate the flow or traffic along the High Street.","We’re decided we definitely need a pedestrian crossing. We considered putting this on School Road, just outside the school, but in the end we decided that could lead to a lot of traffic congestion so we decided to locate it on the High Street, crossing the road in front of the supermarket. That’s a very busy area, so it should help things there.","We’re proposing some changes to parking. At present, parking isn’t allowed on the High Street outside the library, but we’re going to change that, and allow parking there, but not at the other end of the High Street near School Road.","There’ll be a new ‘No Parking’ sign on School Road, just by the entrance to the school, forbidding parking for 25 metres. This should improve visibility for drivers and pedestrians, especially on the bend just to the north of the school.","As far as disabled drivers are concerned, at present they have parking outside the supermarket, but lorries also use those spaces, so we’ve got two new disabled parking spaces on the side road up towards the bank. It’s not ideal, but probably better than the present arrangement.","We also plan to widen the pavement on School Road. We think we can manage to get an extra half-metre on the bend just before you get to the school, on the same side of the road.","Finally, we’ve introduced new restrictions on loading and unloading for the supermarket, so lorries will only be allowed to stop there before 8 am. That’s the supermarket on School Road – we kept to the existing arrangements with the High Street supermarket.","OK. So that’s about it. Now, would anyone …"],"cloze":"<p>Good evening everyone. My name’s Phil Sutton, and I’m chairman of the Highways Committee. We’ve called this meeting to inform members of the public about the <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> we’re proposing for Granford. I’ll start by <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> before we open the meeting to questions.</p><p>So, why do we need to make these changes to traffic systems in Granford? Well, we’re very aware that <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>. It’s been especially noticeable with the <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> while they’ve been building the new hospital. But it’s the <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> of all kinds that’s concerning us. To date ther ass=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span>.</p><p>We’re decided we definitely need <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span>. We considered putting this on School Road, just outside the school, but in the end we decided that could lead to a lot of traffic congestion so we decided to locate it on the High Street, crossing the road <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span>. That’s a very busy area, so it should help things there.</p><p>We’re proposing some changes to parking. At present, <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span> on the High Street outside the library, but we’re going to change that, and allow parking there, but not at the other end of the High Street near School Road.</p><p>There’ll be a <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span> on School Road, just by the entrance to the school, <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span>. This should improve visibility for drivers and pedestrians, especially on the bend just to the north of the school.</p><p>As far as disabled drivers are concerned, at present they have parking outside the supermarket, but lorries also use those spaces, so we’ve got <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span> on the side road up towards the bank. It’s not ideal, but probably better than the present arrangement.</p><p>We also plan to <span class=\"gap-wrap\"><b>19</b      </div>","audio":"https://engnovate.com/wp-content/uploads/2023/07/cambridge-ielts-13-academic-listening-1-audio-2.mp3"},{"number":3,"transcript":["EMMA: We’ve got to choose a topic for our experiment, haven’t we, Jack? Were you thinking of something to do with seeds?","JACK: That’s right. I thought we could look at seed germination – how a seed begins to grow.","EMMA: OK. Any particular reason? I know you’re hoping to work in plant science eventually …","JACK: Yeah, but practically everything we do is going to feed into that. No, there’s an optional module on seed structure and function in the third year that I might do, so I thought it might be useful for that. If I choose that option, I don’t have to do a dissertation module.","EMMA: Good idea.","JACK: Well, I thought for this experiment we could look at the relationship between seed size and the way the seeds are planted. So, we could plant different sized seeds in different ways, and see which grow best.","EMMA: OK. We’d need to allow time for the seeds to come up.","JACK: That should be fine if we start now. A lot of the other possible experiments need quite a bit longer.","EMMA: So that’d make it a good one to choose. And I don’t suppose it’d need much equipment; we’re not doing chemical analysis or anything. Though that’s not really an issue, we’ve got plenty of equipment in the laboratory.","JACK: Yeah. We need to have a word with the tutor if we’re going to go ahead with it though. I’m sure our aim’s OK. It’s not very ambitious but the assignment’s only ten percent of our final mark, isn’t it? But we need to be sure we’re the only ones doing it.","EMMA: Yeah, it’s only five percent actually, but it’d be a bit boring if everyone was doing it.","JACK: Did you read that book on seed germination on our reading list?","EMMA: The one by Graves? I looked through it for my last experiment, though it wasn’t all that relevant there. It would be for this experiment, though. I found it quite hard to follow – lots about the theory, which I hadn’t expected","JACK: Yes, I’d been hoping for something more practical. It does include references to the recent findings on genetically-modified seeds, though.","EMMA: Yes, that was interesting.","JACK: I read an article about seed germination by Lee Hall.","EMMA: About seeds that lie in the ground for ages and only germinate after a fire?","JACK: That’s the one. I knew a bit about it already, but not about this research. His analysis of figures comparing the times of the fires and the proportion of seeds that germinated was done in a lot of detail – very impressive.","EMMA: Was that the article with the illustrations of early stages of plant development? They were very clear.","JACK: I think those diagrams were in another article.","———————","EMMA: Anyway, shall we have a look at the procedure for our experiment? We’ll need to get going with it quite soon.","JACK: Right. So the first thing we have to do is find our seeds. I think vegetable seeds would be best. And obviously they mustn’t all be the same size. So, how many sorts do we need? About four different ones?","EMMA: I think that would be enough. There’ll be quite a large number of seeds for each one.","JACK: Then, for each seed we need to find out how much it weighs, and also measure its dimensions, and we need to keep a careful record of all that.","EMMA: That’ll be quite time-consuming. And we also need to decide how deep we’re going to plant the seeds – right on the surface, a few millimetres down, or several centimetres.","JACK: OK. So then we get planting. Do you think we can plant several seeds together in the same plant pot?","EMMA: No, I think we need a different one for each seed.","JACK: Right. And we’ll need to label them – we can use different coloured labels. Then we wait for the seeds to germinate – I reckon that’ll be about three weeks, depending on what the weather’s like. Then we see if our plants have come up, and write down how tall they’ve grown.","EMMA: Then all we have to do is look at our numbers, and see if there’s any relation between them.","JACK: That’s right. So …"],"cloze":"<p>EMMA: We’ve got to choose a topic for our experiment, haven’t we, Jack? Were you thinking of something to do with seeds?</p><p>JACK: That’s right. I thought we could <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> – <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>.</p><p>EMMA: OK. Any particular reason? I know you’re hoping to work in plant science eventually …</p><p>JACK: Yeah, but practically everything we do is going to feed into that. No, there’s an <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span> in the third year that I might do, so I thought it might be useful for that. If I choose that option, I don’t have to do a dissertation module.</p><p>EMMA: Good idea.</p><p>JACK: Well, I thought for this experiment we could look at the <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> and the way the seeds are planted. So, we could <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span>, and see which grow best.</p><p>EMMA: OK. We’d need to <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span>.</p><p>JACK: That should be fine if we start now. A lot of the other possible experiments <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span>.</p><p>EMMA: So that’d make it a good one to choose. And I don’t suppose it’d need much equipment; we’re not doing chemic f our plants have come up, and <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>.</p><p>EMMA: Then all we have to do is look at our numbers, and see if there’s any relation between them.</p><p>JACK: That’s right. So …</p>","clozeAnswers":["look at seed germination","how a seed begins to grow","optional module on seed structure and function","relationship between seed size","plant different sized seeds in different ways","allow time for the seeds to come up","need quite a bit longer","plenty of equipment in the laboratory","have a word with the tutor","assignment’s only ten percent of our final mark","a bit boring if everyone was doing it","quite hard to follow","references to the recent findings","analysis of figures comparing the times of the fires","illustrations of early stages of plant development","vegetable seeds would be best","mustn’t all be the same size","measure its dimensions","different coloured labels","write down how tall they’ve grown"],"vocab":[{"word":"germination","ipa":"/ˌdʒɜːmɪˈneɪʃən/","pos":"Danh từ (n)","meaning":"sự nảy mầm","example":"Their experiment examines seed germination in different conditions.","exampleVi":"Thí nghiệm của họ xem xét sự nảy mầm trong các điều kiện khác nhau."},{"word":"optional module","ipa":"/ˈɒpʃənəl ˈmɒdjuːl/","pos":"Cụm danh từ (n phr.)","meaning":"học phần tự chọn","example":"Jack may take an optional module next year.","exampleVi":"Jack có thể học một học phần tự chọn vào năm sau."},{"word":"dissertation","ipa":"/ˌdɪsəˈteɪʃən/","pos":"Danh từ (n)","meaning":"luận văn","example":"He may not need to complete a dissertation module.","exampleVi":"Cậu ấy có thể không cần hoàn thành học phần luận văn."},{"word":"procedure","ipa":"/prəˈsiːdʒə/","pos":"Danh từ (n)","meaning":"quy trình","example":"The students review the procedure before starting.","exampleVi":"Các sinh viên xem lại quy trình trước khi bắt đầu."},{"word":"dimension","ipa":"/daɪˈmenʃən/","pos":"Danh từ (n)","meaning":"kích thước","example":"They measure each seed's weight and dimensions.","exampleVi":"Họ đo trọng lượng và kích thước của từng hạt."},{"word":"time-consuming","ipa":"/ˈtaɪm kənsjuːmɪŋ/","pos":"Tính từ (adj)","meaning":"tốn thời gian","example":"Recording every seed measurement will be time-consuming.","exampleVi":"Ghi lại từng phép đo hạt giống sẽ tốn thời gian."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 21-25</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose the correct letter,&nbsp;<strong>A</strong>,&nbsp;<strong>B</strong>&nbsp;or&nbsp;<strong>C</strong>.</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">21</strong> <span>Why is Jack interested in investigating seed germination?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q21\" value=\"A\" data-q=\"21\" onchange=\"setQ(21,this.value)\"><span>He may do a module on a related topic later on.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q21\" value=\"B\" data-q=\"21\" onchange=\"setQ(21,this.value)\"><span>He wants to have a career in plant science.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q21\" value=\"C\" data-q=\"21\" onchange=\"setQ(21,this.value)\"><span>He is thinking of choosing this topic for his dissertation.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">22</strong> <span>Jack and Emma agree the main advantage of their present experiment is that it can be</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q22\" value=\"A\" data-q=\"22\" onchange=\"setQ(22,this.value)\"><span>described very easily.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q22\" value=\"B\" data-q=\"22\" onchange=\"setQ(22,this.value)\"><span>carried out inside the laboratory.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q22\" value=\"C\" data-q=\"22\" onchange=\"setQ(22,this.value)\"><span>completed in the time available.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">23</strong> <span>What do they decide to check with their tutor?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q23\" value=\"A\" data-q=\"23\" onchange=\"setQ(23,this.value)\"><span>whether their aim is appropriate</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q23\" value=\"B\" data-q=\"23\" onchange=\"setQ(23,this.value)\"><span>whether anyone else has chosen this topic</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q23\" value=\"C\" data-q=\"23\" onchange=\"setQ(23,this.value)\"><span>whether the assignment contributes to their final grade</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">24</strong> <span>They agree that Graves’ book on seed germination is disappointing because</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q24\" value=\"A\" data-q=\"24\" onchange=\"setQ(24,this.value)\"><span>it fails to cover recent advances in seed science.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q24\" value=\"B\" data-q=\"24\" onchange=\"setQ(24,this.value)\"><span>the content is irrelevant for them.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q24\" value=\"C\" data-q=\"24\" onchange=\"setQ(24,this.value)\"><span>its focus is very theoretical.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">25</strong> <span>What does Jack say about the article on seed germination by Lee Hall?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q25\" value=\"A\" data-q=\"25\" onchange=\"setQ(25,this.value)\"><span>The diagrams of plant development are useful.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q25\" value=\"B\" data-q=\"25\" onchange=\"setQ(25,this.value)\"><span>The analysis of seed germination statistics is thorough.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q25\" value=\"C\" data-q=\"25\" onchange=\"setQ(25,this.value)\"><span>The findings on seed germination after fires are surprising.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 26-30</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the flow-chart below.</p>\n<p><em>Choose&nbsp;<strong>FIVE</strong>&nbsp;answers from the box and write the correct letter,&nbsp;<strong>A-H</strong>, next to Questions</em></p>\n<p>&nbsp;<strong>Stage in the experiment</strong></p>\n<p>Select seeds of different <span class=\"question-item\"><span class=\"inline-choice\"><strong class=\"q-number\">26</strong><select data-q=\"26\" onchange=\"setQ(26,this.value)\" aria-label=\"Question 26\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option><option value=\"H\">H</option></select></span></span>&nbsp;and sizes.</p>\n<p>↓</p>\n<p>Measure and record the <span class=\"question-item\"><span class=\"inline-choice\"><strong class=\"q-number\">27</strong><select data-q=\"27\" onchange=\"setQ(27,this.value)\" aria-label=\"Question 27\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option><option value=\"H\">H</option></select></span></span>&nbsp;and size of each one.</p>\n<p>↓</p>\n<p>Decide on the <span class=\"question-item\"><span class=\"inline-choice\"><strong class=\"q-number\">28</strong><select data-q=\"28\" onchange=\"setQ(28,this.value)\" aria-label=\"Question 28\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option><option value=\"H\">H</option></select></span></span>&nbsp;to be used.</p>\n<p>↓</p>\n<p>Use a different <span class=\"question-item\"><span class=\"inline-choice\"><strong class=\"q-number\">29</strong><select data-q=\"29\" onchange=\"setQ(29,this.value)\" aria-label=\"Question 29\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option><option value=\"H\">H</option></select></span></span>&nbsp;for each seed and label it.</p>\n<p>↓</p>\n<p>After about 3 weeks, record the plant’s <span class=\"question-item\"><span class=\"inline-choice\"><strong class=\"q-number\">30</strong><select data-q=\"30\" onchange=\"setQ(30,this.value)\" aria-label=\"Question 30\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option><option value=\"H\">H</option></select></span></span>.</p>\n<p>↓</p>\n<p>Investigate the findings.</p>\n</div>                                                <div class=\"option-bank\"><div><b>A</b> container</div><div><b>B</b> soil</div><div><b>C</b> weight</div><div><b>D</b> condition</div><div><b>E</b> height</div><div><b>F</b> colour</div><div><b>G</b> types</div><div><b>H</b> depths</div></div>\n                                                                                    </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                                \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>\n                                        </div>","audio":"https://engnovate.com/wp-content/uploads/2023/07/cambridge-ielts-13-academic-listening-1-audio-3.mp3"},{"number":4,"transcript":["Hi. Today we’re going to be looking at animals in urban environments and I’m going to be telling you about some research on how they’re affected by these environments.","Now, in evolutionary terms, urban environments represent huge upheavals, the sorts of massive changes that usually happen over millions of years. And we used to think that only a few species could adapt to this new environment. One species which is well known as being highly adaptable is the crow, and there’ve been various studies about how they manage to learn new skills. Another successful species is the pigeon, because they’re able to perch on ledges on the walls of city buildings, just like they once perched on cliffs by the sea.","But in fact, we’re now finding that these early immigrants were just the start of a more general movement of animals into cities, and of adaptation by these animals to city life. And one thing that researchers are finding especially interesting is the speed with which they’re doing this – we’re not talking about gradual evolution here – these animals are changing fast.","Let me tell you about some of the studies that have been carried out in this area. So, in the University of Minnesota, a biologist called Emilie Snell-Rood and her colleagues looked at specimens of urbanised small mammals such as mice and gophers that had been collected in Minnesota, and that are now kept in museums there. And she looked at specimens that had been collected over the last hundred years, which is a very short time in evolutionary terms. And she found that during that time, these small mammals had experienced a jump in brain size when compared to rural mammals. Now, we can’t be sure this means they’re more intelligent, but since the sizes of other parts of the body didn’t change, it does suggest that something cognitive was going on. And Snell-Rood thinks that this change might reflect the cognitive demands of adjusting to city life – having to look in different places to find food, for example, and coping with a whole new set of dangers.","Then over in Germany at the Max Planck Institute, there’s another biologist called Catarina Miranda who’s done some experiments with blackbirds living in urban and rural areas. And she’s been looking not at their anatomy but at their behaviour. So as you might expect, she’s found that the urban blackbirds tend to be quite bold – they’re prepared to face up to a lot of threats that would frighten away their country counterparts. But there’s one type of situation that does seem to frighten the urban blackbirds, and that’s anything new – anything they haven’t experienced before. And if you think about it, that’s quite sensible for a bird living in the city.","——————","Jonathan Atwell, in Indiana University, is looking at how a range of animals respond to urban environments. He’s found that when they’re under stress, their endocrine systems react by reducing the amount of hormones such as corticosterone into their blood. It’s a sensible-seeming adaptation. A rat that gets scared every time a subway train rolls past won’t be very successful.","There’s just one more study I’d like to mention which is by Sarah Partan and her team, and they’ve been looking at how squirrels communicate in an urban environment, and they’ve found that a routine part of their communication is carried out by waving their tails. You do also see this in the country, but it’s much more prevalent in cities, possibly because it’s effective in a noisy environment.","So what are the long-term implications of this? One possibility is that we may see completely new species developing in cities. But on the other hand, it’s possible that not all of these adaptations will be permanent. Once the animal’s got accustomed to its new environment, it may no longer need the features it’s developed.","So, now we’ve had a look…"],"cloze":"<p>Hi. Today we’re going to be looking at <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> and I’m going to be telling you about some research on how they’re affected by these environments.</p><p>Now, in evolutionary terms, urban environments represent huge upheavals, the sorts of <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>. And we used to think that only a few species could adapt to this new environment. One species which is well known as being <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span> is al","ipa":"/ʌpˈhiːvəl/","pos":"Danh từ (n)","meaning":"sự biến đổi lớn","example":"Urban growth creates major environmental upheavals.","exampleVi":"Sự phát triển đô thị tạo ra những biến đổi môi trường lớn."},{"word":"adaptable","ipa":"/əˈdæptəbəl/","pos":"Tính từ (adj)","meaning":"có khả năng thích nghi","example":"The crow is a highly adaptable urban species.","exampleVi":"Quạ là một loài đô thị có khả năng thích nghi cao."},{"word":"cognitive","ipa":"/ˈkɒɡnətɪv/","pos":"Tính từ (adj)","meaning":"thuộc nhận thức","example":"City life may place new cognitive demands on animals.","exampleVi":"Đời sống thành phố có thể đặt ra yêu cầu nhận thức mới cho động vật."},{"word":"counterpart","ipa":"/ˈkaʊntəpɑːt/","pos":"Danh từ (n)","meaning":"đối tượng tương ứng","example":"Urban birds are bolder than their rural counterparts.","exampleVi":"Chim đô thị gan dạ hơn những cá thể tương ứng ở nông thôn."},{"word":"prevalent","ipa":"/ˈprevələnt/","pos":"Tính từ (adj)","meaning":"phổ biến","example":"Tail waving is more prevalent among city squirrels.","exampleVi":"Việc vẫy đuôi phổ biến hơn ở sóc thành phố."},{"word":"implication","ipa":"/ˌɪmplɪˈkeɪʃən/","pos":"Danh từ (n)","meaning":"hệ quả, ảnh hưởng có thể xảy ra","example":"Researchers consider the long-term implications of adaptation.","exampleVi":"Các nhà nghiên cứu xem xét hệ quả lâu dài của sự thích nghi."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 31-40</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the notes below.</p>\n<p><em>Write&nbsp;<strong>ONE WORD ONLY</strong>&nbsp;for each answer.</em></p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Effects of urban environments on animals</strong></strong></p>\n<p><strong>Introduction</strong></p>\n<p>Recent urban developments represent massive environmental changes. It was previously thought that only a few animals were suitable for city life, e.g.</p>\n<ul>\n<li>the <span class=\"question-item\"><strong class=\"q-number\">31</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"31\" oninput=\"setQ(31,this.value)\"></span>&nbsp;– because of its general adaptability</li>\n<li>the pigeon – because walls of city buildings are similar to <span class=\"question-item\"><strong class=\"q-number\">32</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"32\" oninput=\"setQ(32,this.value)\"></span></li>\n</ul>\n<p>In fact, many urban animals are adapting with unusual <span class=\"question-item\"><strong class=\"q-number\">33</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"33\" oninput=\"setQ(33,this.value)\"></span></p>\n<p><strong>Recent research</strong></p>\n<ul>\n<li>Emilie Snell-Rood studied small urbanised mammal specimens from museums in Minnesota.</li>\n</ul>\n<p>–&nbsp; She found the size of their <span class=\"question-item\"><strong class=\"q-number\">34</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"34\" oninput=\"setQ(34,this.value)\"></span>&nbsp;had increased.</p>\n<p>–&nbsp; She suggests this may be due to the need to locate new sources of <span class=\"question-item\"><strong class=\"q-number\">35</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"35\" oninput=\"setQ(35,this.value)\"></span>&nbsp;and to deal with new dangers.</p>\n<ul>\n<li>Catarina Miranda focused on the <span class=\"question-item\"><strong class=\"q-number\">36</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"36\" oninput=\"setQ(36,this.value)\"></span>&nbsp;of urban and rural blackbirds.</li>\n</ul>\n<p>–&nbsp; She found urban birds were often braver, but were afraid of situations that were <span class=\"question-item\"><strong class=\"q-number\">37</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"37\" oninput=\"setQ(37,this.value)\"></span></p>\n<ul>\n<li>Jonathan Atwell studies how animals respond to urban environments.</li>\n</ul>\n<p>–&nbsp; He found that some animals respond to <span class=\"question-item\"><strong class=\"q-number\">38</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"38\" oninput=\"setQ(38,this.value)\"></span>&nbsp;by producing lower levels of hormones.</p>\n<ul>\n<li>Sarah Partan’s team found urban squirrels use their <span class=\"question-item\"><strong class=\"q-number\">39</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"39\" oninput=\"setQ(39,this.value)\"></span>&nbsp;to help them communicate.</li>\n</ul>\n<p><strong>Long-term possibilities</strong></p>\n<p>Species of animals may develop which are unique to cities. However, some changes may not be <span class=\"question-item\"><strong class=\"q-number\">40</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"40\" oninput=\"setQ(40,this.value)\"></span>.</p>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"https://engnovate.com/wp-content/uploads/2023/07/cambridge-ielts-13-academic-listening-1-audio-4.mp3"}],"form":{"url":"https://docs.google.com/forms/d/e/1FAIpQLSfi_gKYiTBEuV8CW68pfTJjf7MVPpMDVNMkjZWy1AjlBfigfQ/formResponse","week":"entry.1893665426","name":"entry.442430322","studentClass":"entry.55126249","d1":"entry.1101074174","i1":"entry.1320743073","d2":"entry.838708618","i2":"entry.950878529","total":"entry.219410480"}};</script><script>let si=0,stage="vocab",scoreSendPromise=null,scoreRetryTimer=null,scoreRetryAttempt=0;
const storageKey=`ielts-nghe-w${DATA.week}`;
function loadState(){try{const value=JSON.parse(localStorage.getItem(storageKey)||"{}");return value&&typeof value==="object"?value:{}}catch{return {}}}
const state=loadState();
state.q||={};state.g||={};state.scores||={};state.studentName||="";state.studentClass||="";
const scoreParts=Object.freeze([
  {key:"1-2",label:()=>`Tuần ${DATA.week} · Sections 1–2`,a:1,b:2},
  {key:"3-4",label:()=>`Tuần ${DATA.week} · Sections 3–4`,a:3,b:4}
]);
function freshSubmission(fingerprint=""){return {status:"idle",fingerprint,sentAt:"",parts:{"1-2":"idle","3-4":"idle"}}}
function normalizeSubmission(value){
  const legacySent=value?.status==="sent",parts={};
  scoreParts.forEach(part=>{const saved=value?.parts?.[part.key];parts[part.key]=legacySent||saved==="sent"?"sent":saved==="error"?"error":"idle"});
  const complete=scoreParts.every(part=>parts[part.key]==="sent");
  return {status:complete?"sent":value?.status==="error"?"error":"idle",fingerprint:String(value?.fingerprint||""),sentAt:complete?String(value?.sentAt||""):"",parts};
}
state.submission=normalizeSubmission(state.submission);
const $=s=>document.querySelector(s);
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"").replace(/[^a-z0-9]+/g," ").trim();

const identityKey=(name,studentClass)=>`${identityPart(name)}|${identityPart(studentClass)}`;

const scoreKeys=()=>Array.from({length:4},(_,i)=>[`d${i+1}`,`i${i+1}`]).flat();

function clearScoreRetry(){if(scoreRetryTimer){clearTimeout(scoreRetryTimer);scoreRetryTimer=null}}
function resetSubmission(){clearScoreRetry();scoreRetryAttempt=0;state.submission=freshSubmission()}
function invalidateScore(key){if(Object.prototype.hasOwnProperty.call(state.scores,key))delete state.scores[key];resetSubmission()}
function setQ(q,v){state.q[q]=v;invalidateScore(`i${si+1}`);save();gate();scorePanel()}
function setGap(i,v){state.g[`${si+1}-${i}`]=v;invalidateScore(`d${si+1}`);save();gate();scorePanel()}
function setGroup(key,v,box,max){let a=state.q[key]||[];if(box.checked&&!a.includes(v)&&a.length>=max){box.checked=false;return}a=box.checked?[...new Set([...a,v])]:a.filter(x=>x!==v);state.q[key]=a;invalidateScore(`i${si+1}`);save();gate();scorePanel()}
function speak(w){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang="en-GB";speechSynthesis.speak(u)}
function section(){return DATA.sections[si]}
function range(){return [si*10+1,si*10+10]}
function questionGroups(){
  const groups=new Map();
  for(const match of section().questions.matchAll(/data-group="([\d-]+)"/g)){
    const key=match[1];if(!groups.has(key))groups.set(key,key.split("-").map(Number));
  }
  return groups;
}
function audioBox(){return `<b>● AUDIO GỐC · SECTION ${si+1}</b><audio controls preload="metadata" src="${section().audio}"></audio>`}

  const [a,b]=range(),grouped=new Set();

  for(let q=a;q<=b;q++){if(grouped.has(q))continue;if(!norm(state.q[q]))return false}
  return true;
}
function gate(){const b=$("#partSubmit");if(!b)return;b.disabled=!complete();b.textContent=complete()?"Nộp bài & xem kết quả":stage==="dictation"?"Điền đủ 20/20 chỗ để nộp":"Làm đủ 10/10 câu để nộp"}
function vocab(){return `<div class="vocab-grid">${section().vocab.map(v=>`<article class="vocab-card"><button class="sound" onclick='speak(${JSON.stringify(v.word)})'>◖))</button><h3>${v.word}</h3><div class="ipa">${v.ipa}</div><div class="pos">${v.pos}</div><div class="meaning">${v.meaning}</div><p class="example">${v.example}</p><div class="translation">${v.exampleVi}</div></article>`).join("")}</div>`}
function submissionMessage(){
  const fingerprint=scoreFingerprint();
  const current=state.submission.fingerprint===fingerprint,done=current?scoreParts.filter(part=>state.submission.parts?.[part.key]==="sent").length:0;
  if(current&&done===scoreParts.length)return '<div class="result">✓ Đã tự động gửi đủ điểm Sections 1–4 vào sổ lớp.</div>';
  if(current&&state.submission.status==="sending")return `<div class="result">Đang tự động ghi điểm vào sổ lớp${done?` · đã ghi ${done}/2 nhóm`:""}…</div>`;
  if(current&&state.submission.status==="error")return `<div class="result bad">Mạng đang gián đoạn${done?` · đã giữ an toàn ${done}/2 nhóm điểm`:""}. Hệ thống sẽ chỉ tự gửi lại phần còn thiếu.</div>`;
  return '<div class="result">Đủ 8 phần. Hệ thống đang chuẩn bị tự gửi điểm…</div>';
}
function scoreView(){return `<div class="score-view"><h2>Kết quả Tuần ${DATA.week}</h2><div class="student-summary"><span>${state.studentName.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span><span>${state.studentClass}</span></div><div id="scoreGrid" class="score-grid"></div><div id="scoreStatus">${submissionMessage()}</div></div>`}
function restoreInputs(){
  document.querySelectorAll("[data-q]").forEach(el=>{const q=el.dataset.q;if(el.type==="radio")el.checked=state.q[q]===el.value;else el.value=state.q[q]||""});
  document.querySelectorAll("[data-group]").forEach(el=>el.checked=(state.q[el.dataset.group]||[]).includes(el.value));

      b.textContent="D · Kết quả";
      b.disabled=!scoresReady();b.setAttribute("aria-disabled",String(!scoresReady()));

    }

function gradeIelts(){
  if(!complete())return;const [a,b]=range();let ok=0,grouped=new Set();
  for(const [key,nums] of questionGroups()){
    const chosen=state.q[key]||[],valid=new Set(nums.flatMap(q=>DATA.answers[q]).map(norm));
    ok+=chosen.filter(x=>valid.has(norm(x))).length;nums.forEach(q=>grouped.add(q));
    document.querySelectorAll(`[data-group="${key}"]`).forEach(el=>el.closest("td,.question-item,.paper-option")?.classList.add(valid.has(norm(el.value))?"good":"bad"));
  }
  for(let q=a;q<=b;q++){
    if(grouped.has(q))continue;const valid=DATA.answers[q].map(norm),good=valid.includes(norm(state.q[q]));if(good)ok++;
    document.querySelectorAll(`[data-q="${q}"]`).forEach(el=>el.closest("td,.question-item,.paper-option")?.classList.add(good?"good":"bad"));
  }
  state.scores[`i${si+1}`]=ok;
  $("#result").innerHTML=`<div class="result"><b>${ok}/10</b> · Em làm sai ${10-ok} câu. Hãy nghe lại Section ${si+1} và đối chiếu phần vừa làm.</div>`;finishPart();
}
function scorePanel(){
  const grid=$("#scoreGrid");if(grid)grid.innerHTML=scoreKeys().map(k=>`<div class="score"><small>${k[0]==="d"?"Chính tả":"IELTS"} · Section ${k.slice(1)}</small><br><b>${Number.isInteger(state.scores[k])?state.scores[k]:"—"}/${k[0]==="d"?20:10}</b></div>`).join("");
  updateStageTabs();const status=$("#scoreStatus");if(status)status.innerHTML=submissionMessage();
}
function scorePayload(label,a,b){
  const p=new URLSearchParams();p.set(DATA.form.week,label);p.set(DATA.form.name,state.studentName.trim());p.set(DATA.form.studentClass,state.studentClass);
  p.set(DATA.form.d1,String(state.scores[`d${a}`]));p.set(DATA.form.i1,String(state.scores[`i${a}`]));p.set(DATA.form.d2,String(state.scores[`d${b}`]));p.set(DATA.form.i2,String(state.scores[`i${b}`]));
  p.set(DATA.form.total,String(state.scores[`d${a}`]+state.scores[`i${a}`]+state.scores[`d${b}`]+state.scores[`i${b}`]));return p;
}
function scheduleScoreRetry(){
  if(scoreRetryTimer||state.submission.status==="sent")return;
  const delays=[5000,15000,30000,60000],delay=delays[Math.min(scoreRetryAttempt,delays.length-1)];scoreRetryAttempt++;
  scoreRetryTimer=setTimeout(()=>{scoreRetryTimer=null;if(scoresReady())void ensureScoresSubmitted()},delay);
}
async function ensureScoresSubmitted(){
  if(!scoresReady()||!state.studentName.trim()||!state.studentClass)return false;
  const fingerprint=scoreFingerprint();
  if(state.submission.fingerprint!==fingerprint)state.submission=freshSubmission(fingerprint);
  if(scoreParts.every(part=>state.submission.parts[part.key]==="sent")){state.submission.status="sent";return true}
  if(scoreSendPromise)return scoreSendPromise;
  clearScoreRetry();state.submission.status="sending";state.submission.sentAt="";save();scorePanel();
  scoreSendPromise=(async()=>{
    try{
      for(const part of scoreParts){
        if(state.submission.parts[part.key]==="sent")continue;
        state.submission.parts[part.key]="sending";save();scorePanel();
        await fetch(DATA.form.url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:scorePayload(part.label(),part.a,part.b).toString()});
        state.submission.parts[part.key]="sent";save();scorePanel();
      }
      state.submission.status="sent";state.submission.sentAt=new Date().toISOString();scoreRetryAttempt=0;save();scorePanel();return true;
    }catch{
      scoreParts.forEach(part=>{if(state.submission.parts[part.key]==="sending")state.submission.parts[part.key]="error"});
      state.submission.status="error";state.submission.sentAt="";save();scorePanel();scheduleScoreRetry();return false;
    }
    finally{scoreSendPromise=null}
  })();return scoreSendPromise;
}
$("#sectionTabs").innerHTML=DATA.sections.map((s,i)=>`<button onclick="si=${i};stage='vocab';render()">SECTION ${s.number}<br><small>Questions ${(s.number-1)*10+1}–${s.number*10}</small></button>`).join("");
document.querySelectorAll(".stage-tabs button").forEach(b=>b.onclick=()=>{if(b.dataset.stage==="score"&&!scoresReady())return;stage=b.dataset.stage;render()});
const entryName=$("#entryName"),entryClass=$("#entryClass"),enterTest=$("#enterTest");entryName.value=state.studentName;entryClass.value=state.studentClass;
function updateEntryGate(){const ready=entryName.value.trim()&&entryClass.value;enterTest.disabled=!ready;enterTest.textContent=ready?"Vào Listening Test":"Nhập họ tên và chọn lớp để vào bài"}
function openTest(){
  const name=entryName.value.trim(),studentClass=entryClass.value;if(!name||!studentClass)return;
  const previousKey=state.studentKey||identityKey(state.studentName,state.studentClass),nextKey=identityKey(name,studentClass);
  if(previousKey&&previousKey!==nextKey){state.q={};state.g={};state.scores={};resetSubmission()}
  state.studentName=name;state.studentClass=studentClass;state.studentKey=nextKey;save();$("#entryGate").hidden=true;$("#testApp").hidden=false;render();if(scoresReady())void ensureScoresSubmitted();
}
entryName.oninput=updateEntryGate;entryClass.onchange=updateEntryGate;enterTest.onclick=openTest;entryName.onkeydown=e=>{if(e.key==="Enter"&&!enterTest.disabled)openTest()};
window.addEventListener("online",()=>{clearScoreRetry();if(scoresReady())void ensureScoresSubmitted()});updateEntryGate();render();
</script></body></html>
