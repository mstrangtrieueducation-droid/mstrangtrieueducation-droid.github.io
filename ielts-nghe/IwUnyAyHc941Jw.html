</style></head><body><section id="entryGate" class="entry-screen"><div class="entry-card"><header class="entry-head"><small>IELTS - NGHE · TUẦN 36</small><h1>Listening Test 26</h1><p>Điền thông tin học sinh trước khi vào bài.</p></header><div class="entry-body"><p class="entry-note">Họ tên và lớp sẽ được giữ lại để gửi điểm sau khi hoàn thành bài.</p><label for="entryName">Họ và tên học sinh</label><input id="entryName" type="text" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"><label for="entryClass">Lớp IELTS</label><select id="entryClass"><option value="">Chọn lớp IELTS</option><option>IELTS 40</option><option>IELTS 41</option><option>IELTS 42</option><option>IELTS 43</option><option>IELTS 44</option><option>IELTS 45</option><option>IELTS 46</option><option>IELTS 47</option><option>IELTS 48</option><option>IELTS 49</option><option>IELTS 50</option><option>IELTS 51</option><option>IELTS 52</option><option>IELTS 53</option></select><button id="enterTest" type="button" disabled>Nhập họ tên và chọn lớp để vào bài</button></div></div></section><div id="testApp" hidden><header class="hero"><small>IELTS - NGHE · TUẦN 36</small><h1>Listening Test 26</h1><p>Full Test · Sections 1–4 · 40 questions</p></header><main class="shell"><nav id="sectionTabs" class="section-tabs"></nav><nav class="stage-tabs"><button type="button" data-stage="vocab">A · Từ vựng cần lưu ý</button><button type="button" data-stage="dictation">B · Điền chính tả</button><button type="button" data-stage="ielts">C · Câu hỏi IELTS</button><button type="button" data-stage="score">D · Nộp bài</button></nav><section id="content" class="lesson"></section></main></div><script>const DATA={"week":36,"test":26,"sourceRef":"Cambridge IELTS 15 Academic Listening Test 2","answers":{"1":["Eustatis"],"2":["review"],"3":["dance"],"4":["Chat"],"5":["healthy"],"6":["posters"],"7":["wood"],"8":["lake"],"9":["insects"],"10":["blog"],"11":["C"],"12":["A"],"13":["B"],"14":["C"],"15":["E"],"16":["C"],"17":["B"],"18":["A"],"19":["G"],"20":["D"],"21":["B","D"],"22":["B","D"],"23":["B","C"],"24":["B","C"],"25":["G"],"26":["B"],"27":["D"],"28":["C"],"29":["H"],"30":["F"],"31":["Irrigation"],"32":["women"],"33":["wire","wires"],"34":["seed","seeds"],"35":["posts"],"36":["transport"],"37":["preservation"],"38":["fish","fishes"],"39":["bees"],"40":["design"]},"sections":[{"number":1,"transcript":["TIM: Good morning. You’re through to the tourist information office, Tim speaking. How can I help you?","JEAN: Oh hello. Could you give me some information about next month’s festival, please? My family and I will be staying in the town that week.","TIM: Of course. Well it starts with a concert on the afternoon of the 17th.","JEAN: Oh I heard about that. The orchestra and singers come from the USA, don’t they?","TIM: They’re from Canada. They’re very popular over there. They’re going to perform a number of well-known pieces that will appeal to children as well as adults.","JEAN: That sounds good. My whole family are interested in music.","TIM: The next day, the 18th, there’s a performance by a ballet company called Eustatis.","JEAN: Sorry?","TIM: The name is spelt E-U-S-T-A-T-I-S. They appeared in last year’s festival, and went down very well. Again, their programme is designed for all ages.","JEAN: Good. I expect we’ll go to that. I hope there’s going to be a play during the festival, a comedy, ideally.","TIM: You’re in luck! On the 19th and 20th a local amateur group are performing one written by a member of group. It’s called Jemima. That’ll be on in the town hall. They’ve already performed it two or three times. I haven’t seen it myself, but the review in the local paper was very good.","JEAN: And is it suitable for children?","TIM: Yes, in fact it’s aimed more at children than at adults, so both performances are in the afternoon.","JEAN: And what about dance? Will there by any performances?","TIM: Yes, also on the 20th, but in the evening. A professional company is putting on a show of modern pieces, with electronic music by young composers.","JEAN: Uh-huh.","TIM: The show is about how people communicate, or fail to communicate, with each other, so it’s got the rather strange name, Chat.","JEAN: I suppose that’s because that’s something we do both face to face and online.","TIM: That’s right.","———————","TIM: Now there are also some workshops and other activities. They’ll all take place at least once every day, so everyone who wants to take part will have a chance.","JEAN: Good. We’re particularly interested in cookery – you don’t happen to have a cookery workshop, do you?","TIM: We certainly do. It’s going to focus on how to make food part of a healthy lifestyle, and it’ll show that even sweet things like cakes can contain much less sugar than they usually do.","JEAN: That might be worth going to. We’re trying to encourage our children to cook.","TIM: Another workshop is just for children, and that’s on creating posters to reflect the history of the town. The aim is to make children aware of how both the town and people’s lives have changed over the centuries. The results will be exhibited in the community centre. Then the other workshop is in toy-making, and that’s for adults only.","JEAN: Oh, why’s that?","TIM: Because it involves carpentry – participants will be making toys out of wood, so there’ll be a lot of sharp chisels and other tools around.","JEAN: It makes sense to keep children away from it.","TIM: Exactly. Now let me tell you about some of the outdoor activities. There’ll be supervised wild swimming …","JEAN: Wild swimming? What’s that?","TIM: It just means swimming in natural waters, rather than a swimming pool.","JEAN: Oh OK. In a lake, for instance.","TIM: Yes, there’s a beautiful one just outside the town, and that’ll be the venue for the swimming. There’ll be lifeguards on duty, so it’s suitable for all ages. And finally, there’ll be a walk in some nearby woods every day. The leader is an expert on insects. He’ll show some that live in the woods, and how important they are for the environment. So there are going to be all sorts of different things to do during the festival.","JEAN: There certainly are.","TIM: If you’d like to read about how the preparations for the festival are going, the festival organizer is keeping a blog. Just search online for the festival website, and you’ll find it.","JEAN: Well, thank you very much for all the information.","TIM: You’re welcome. Goodbye.","JEAN: Goodbye."],"cloze":"<p>TIM: Good morning. You’re through to the <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>. How can I help you?</p><p>JEAN: Oh hello. Could you give me some information about next month’s festival, please? My family and I will be staying in the town that week.</p><p>TIM: Of course. Well it starts with a concert on the afternoon of the 17th.</p><p>JEAN: Oh I heard about that. The <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> from the USA, don’t they?</p><p>TIM: They’re from Canada. They’re very popular over there. They’re going to perform a number of well-known pieces that will appeal to children as well as adults.</p><p>JEAN: That sounds good. My <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span> in music.</p><p>TIM: The next day, the 18th, there’s a performance by a <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>.</p><p>JEAN: Sorry?</p><p>TIM: The name is spelt E-U-S-T-A-T-I-S. They appeared in last year’s festival, and went down very well. Again, their programme is designed for all ages.</p><p>JEAN: Good. I expect we’ll go to that. I hope there’s going to be <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"s  make food part of a <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span> that even sweet things like cakes can contain much less sugar than they usually do.</p><p>JEAN: That might be worth going to. We’re trying to encourage our children to cook.</p><p>TIM: Another workshop is just for children, and that’s on <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span> of the town. The aim is to make children aware of how both the town and people’s lives have changed over the centuries. The results will be exhibited in the community centre. Then the other workshop is in toy-making, and that’s for adults only.</p><p>JEAN: Oh, why’s that?</p><p>TIM: Because it involves carpentry – <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span> out of wood, so there’ll be a lot of sharp chisels and other tools around.</p><p>JEAN: It <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span> away from it.</p><p>TIM: Exactly. Now let me tell you about some of the outdoor activities. <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span> …</p><p>JEAN: Wild swimming? What’s that?</p><p>TIM: It just means swimming in natural waters, rather than a swimming pool.</p><p>JEAN: Oh OK. In a lake, for instance.</p><p>TIM: Yes, there’s a beautiful one just outside the town, and that’ll be the venue for the swimming. <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span>, so it’s suitable for all ages. And finally, there’ll be a walk in some <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>. The leader is an expert on insects. He’ll show some that live in the woods, and how important they are for the environment. So there are going to be all sorts of different things to do during the festival.</p><p>JEAN: There certainly are.</p><p>TIM: If you’d like to read about how the preparations for the festival are going, the <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span>. Just search <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>, and you’ll find it.</p><p>JEAN: Well, thank you very much for all the information.</p><p>TIM: You’re welcome. Goodbye.</p><p>JEAN: Goodbye.</p>","clozeAnswers":["tourist information office, Tim speaking","orchestra and singers come","whole family are interested","ballet company called Eustatis","a play during the festival","local amateur group are performing","performances are in the afternoon","electronic music by young composers","communicate, or fail to communicate","workshops and other activities","particularly interested in cookery","healthy lifestyle, and it’ll show","creating posters to reflect the history","participants will be making toys","makes sense to keep children","There’ll be supervised wild swimming","There’ll be lifeguards on duty","nearby woods every day","festival organizer is keeping a blog","online for the festival website"],"vocab":[{"word":"preparations","ipa":"/pɹɛpəˈɹeɪʃənz/","pos":"Danh từ (n)","meaning":"chuẩn bị","example":"If you’d like to read about how the preparations for the festival are going, the festival organizer is keeping a blog.","exampleVi":"Trong câu trên, “preparations” mang nghĩa “chuẩn bị”."},{"word":"activities","ipa":"/ækˈtɪ.vɪ.tiz/","pos":"Danh từ (n)","meaning":"hoạt động","example":"Now there are also some workshops and other activities.","exampleVi":"Trong câu trên, “activities” mang nghĩa “hoạt động”."},{"word":"electronic","ipa":"/ɪˌlɛkˈtɹɒn.ɪk/","pos":"Tính từ (adj)","meaning":"điện tử","example":"A professional company is putting on a show of modern pieces, with electronic music by young composers.","exampleVi":"Trong câu trên, “electronic” mang nghĩa “điện tử”."},{"word":"interested","ipa":"/ˈɪntəɹɛstəd/","pos":"Tính từ (adj)","meaning":"quan tâm","example":"My whole family are interested in music.","exampleVi":"Trong câu trên, “interested” mang nghĩa “quan tâm”."},{"word":"centuries","ipa":"/ˈsɛn.tʃə.ɹiz/","pos":"Danh từ (n)","meaning":"thế kỷ","example":"The aim is to make children aware of how both the town and people’s lives have changed over the centuries.","exampleVi":"Trong câu trên, “centuries” mang nghĩa “thế kỷ”."},{"word":"encourage","ipa":"/ɪnˈkʌɹɪdʒ/","pos":"Động từ (v)","meaning":"khuyến khích","example":"We’re trying to encourage our children to cook.","exampleVi":"Trong câu trên, “encourage” mang nghĩa “khuyến khích”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 1-4</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Complete the table below.</p>\n<p>Write ONE WORD ONLY for each answer.</p>\n<table>\n<tbody>\n<tr>\n<td colspan=\"3\" width=\"522\">\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Festival information</strong></strong></p>\n</td>\n</tr>\n<tr>\n<td width=\"114\"><strong>Date</strong></td>\n<td width=\"168\"><strong>Type of event</strong></td>\n<td width=\"240\"><strong>Details</strong></td>\n</tr>\n<tr>\n<td width=\"114\">17th</td>\n<td width=\"168\">a concert</td>\n<td width=\"240\">performers from Canada</td>\n</tr>\n<tr>\n<td width=\"114\">18th</td>\n<td width=\"168\">a ballet</td>\n<td width=\"240\">company called <span class=\"question-item\"><strong class=\"q-number\">1</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"1\" oninput=\"setQ(1,this.value)\"></span></td>\n</tr>\n<tr>\n<td width=\"114\">19th-20th (afternoon)</td>\n<td width=\"168\">a play</td>\n<td width=\"240\">type of play: a comedy called&nbsp;<em>Jemima</em> has had a good <span class=\"question-item\"><strong class=\"q-number\">2</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"2\" oninput=\"setQ(2,this.value)\"></span></td>\n</tr>\n<tr>\n<td width=\"114\">20th (evening)</td>\n<td width=\"168\">a <span class=\"question-item\"><strong class=\"q-number\">3</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"3\" oninput=\"setQ(3,this.value)\"></span>&nbsp;show</td>\n<td width=\"240\">show is called <span class=\"question-item\"><strong class=\"q-number\">4</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"4\" oninput=\"setQ(4,this.value)\"></span></td>\n</tr>\n</tbody>\n</table>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 5-10</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the notes below.</p>\n<p><em>Write&nbsp;<strong>ONE WORD ONLY</strong>&nbsp;for each answer.</em></p>\n<p><strong>Workshops</strong></p>\n<ul>\n<li>Making <span class=\"question-item\"><strong class=\"q-number\">5</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"5\" oninput=\"setQ(5,this.value)\"></span>&nbsp;food</li>\n<li>(children only) Making <span class=\"question-item\"><strong class=\"q-number\">6</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"6\" oninput=\"setQ(6,this.value)\"></span></li>\n<li>(adults only) Making toys from <span class=\"question-item\"><strong class=\"q-number\">7</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"7\" oninput=\"setQ(7,this.value)\"></span>&nbsp;using various tools</li>\n</ul>\n<p><strong>Outdoor activities</strong></p>\n<ul>\n<li>Swimming in the <span class=\"question-item\"><strong class=\"q-number\">8</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"8\" oninput=\"setQ(8,this.value)\"></span></li>\n<li>Walking in the woods, led by an expert on <span class=\"question-item\"><strong class=\"q-number\">9</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"9\" oninput=\"setQ(9,this.value)\"></span></li>\n</ul>\n<p>See the festival organiser’s <span class=\"question-item\"><strong class=\"q-number\">10</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"10\" oninput=\"setQ(10,this.value)\"></span>&nbsp;for more information</p>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-26/section-1.mp3"},{"number":2,"transcript":["WOMAN:","I’m very pleased to welcome this evening’s guest speaker, Mark Logan, who’s going to tell us about the recent transformation of Minster Park. Over to you, Mark.","MARK:","Thank you. I’m sure you’re all familiar with Minster Park. It’s been a feature of the city for well over a century, and has been the responsibility of the city council for most of that time. What perhaps isn’t so well known is the origin of the park: unlike many public parks that started in private ownership, as the garden of a large house, for instance, Minster was some waste land, which people living nearby started planting with flowers in 1892. It was unclear who actually owned the land, and this wasn’t settled until 20 years later, when the council took possession of it.","You may have noticed the statue near one of the entrances. It’s of Diane Gosforth, who played a key role in the history of the park. Once the council had become the legal owner, it planned to sell the land for housing. Many local people wanted it to remain a place that everyone could go to, to enjoy the fresh air and natural environment – remember the park is in a densely populated residential area. Diane Gosforth was one of those people, and she organised petitions and demonstrations, which eventually made the council change its mind about the future of the land.","Soon after this the First World War broke out, in 1914, and most of the park was dug up and planted with vegetables, which were sold locally. At one stage the army considered taking it over for troop exercises and got as far as contacting the city council, then decided the park was too small to be of use. There were occasional public meetings during the war, in an area that had been retained as grass.","After the war, the park was turned back more or less to how it had been before 1914, and continued almost unchanged until recently. Plans for transforming it were drawn up at various times, most recently in 2013, though they were revised in 2015, before any work had started. The changes finally got going in 2016, and were finished on schedule last year.","————————","OK, let me tell you about some of the changes that have been made – and some things that have been retained. If you look at this map, you’ll see the familiar outline of the park, with the river forming the northern boundary, and a gate in each of the other three walls. The statue of Diane Gosforth has been moved: it used to be close to the south gate, but it’s now immediately to the north of the lily pond, almost in the centre of the park, which makes it much more visible.","There’s a new area of wooden sculptures, which are on the river bank, where the path from the east gate makes a sharp bend.","There are two areas that are particularly intended for children. The playground has been enlarged and improved, and that’s between the river and the path that leads from the pond to the river.","Then there’s a new maze, a circular series of paths, separated by low hedges. That’s near the west gate – you go north from there towards the river and then turn left to reach it.","There have been tennis courts in the park for many years, and they’ve been doubled, from four to eight. They’re still in the south-west corner of the park, where there’s a right-angle bend in the path.","Something else I’d like to mention is the new fitness area. This is right next to the lily pond on the same side as the west gate.","Now, as you’re all gardeners, I’m sure you’ll like to hear about the plants that have been chosen for the park."],"cloze":"<p>WOMAN:</p><p>I’m very pleased to welcome this evening’s guest speaker, Mark Logan, who’s going to tell us about the <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>. Over to you, Mark.</p><p>MARK:</p><p>Thank you. I’m sure you’re all familiar with Minster Park. It’s been a feature of the city for well over a century, and has been the <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> for most of that time. What perhaps isn’t so well known is the origin of the park: unlike many public parks that <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>, as the garden of a large house, for instance, Minster was some waste land, which <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> with flowers in 1892. It was unclear who actually owned the land, and this wasn’t settled until 20 years later, when the <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> of it.</p><p>You may have noticed the statue near one of the entrances. It’s of Diane Gosforth, who played a key role in the history of the park. Once the council had become the legal owner, it planned to sell the land for housing. Many <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span> it to remain a place that everyone could go to, to enjoy the fresh air and natural environment – remember the park is in a densely populated residential area. Diane Gosforth was one of those people, and she <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span>, which <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span> its mind about the future of the land.</p><p>Soon after this the First World War broke out, in 1914, and most of the park was dug up and planted with vegetables, which were sold locally. <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span> for troop exercises and got as far as contacting the city council, then decided the park was too small to be of use. There were <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span> during the war, in an area that had been retained as grass.</p><p>After the war, the park was turned back more or less to how it had been before 1914, and <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span>. Plans for transforming it were drawn up at various times, most recently in 2013, though they were revised in 2015, before any work had started. The changes finally got going in 2016, and were <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span>.</p><p>————————</p><p>OK, let me tell you about some of the changes that have been made – and some things that have been retained. If you look at this map, you’ll see the familiar outline of the park, with the <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span>, and a gate in each of the other three walls. The <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span> has been moved: it used to be close to the south gate, but it’s now immediately to the north of the lily pond, almost in the centre of the park, which makes it much more visible.</p><p>There’s a <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span>, which are on the river bank, where the path from the east gate makes a sharp bend.</p><p>There are two areas that are <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>. The playground has been enlarged and improved, and that’s between the river and the path that leads from the pond to the river.</p><p>Then there’s a new maze, a circular series of paths, <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span>. That’s near the west gate – you go north from there towards the river and then turn left to reach it.</p><p>There have been <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span> for many years, and they’ve been doubled, from four to eight. They’re still in the <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> of the park, where there’s a right-angle bend in the path.</p><p>Something else I’d like to mention is the new fitness area. This is right next to the lily pond on the same side as the west gate.</p><p>Now, as you’re all <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span> you’ll like to hear about the plants that have been chosen for the park.</p>","clozeAnswers":["recent transformation of Minster Park","responsibility of the city council","started in private ownership","people living nearby started planting","council took possession","local people wanted","organised petitions and demonstrations","eventually made the council change","At one stage th le, so this year it’s going to be part of an open day, to raise the university’s profile. It’ll be publicised in the city, to encourage people to come and find out something of what goes on here. And it’s included in the information that’s sent to people who are considering applying to study here next year.","CATHY: Presumably some current students and lecturers will come?","GRAHAM: I would imagine so, but we’ve been told to concentrate on the other categories of people.","CATHY: Right. We don’t have to cover the whole range of 19th-century literature, do we?","GRAHAM: No, it’s entirely up to us. I suggest just using Charles Dickens.","CATHY: That’s a good idea. Most people have heard of him, and have probably read some of his novels, or seen films based on them, so that’s a good lead-in to life in his time.","GRAHAM: Exactly. And his novels show the awful conditions that most people had to live in, don’t they: he wanted to shock people into doing something about it.","CATHY: Did he do any campaigning, other than writing?","GRAHAM: Yes, he campaigned for education and other social reforms, and gave talks, but I’m inclined to ignore that and focus on the novels.","CATHY: Yes, I agree.","————————","CATHY: OK, so now shall we think about a topic linked to each novel?","GRAHAM: Yes. I’ve printed out a list of Dickens’s novels in the order they were published, in the hope you’d agree to focus on him!","CATHY: You’re lucky I did agree! Let’s have a look. OK, the first was The Pickwick Papers, published in 1836. It was very successful when it came out, wasn’t it, and was adapted for the theatre straight away.","GRAHAM: There’s an interesting point, though, that there’s a character who keeps falling asleep, and that medical condition was named after the book – Pickwickian Syndrome.","CATHY: Oh, so why don’t we use that as the topic, and include some quotations from the novel?","GRAHAM: Right, Next is Oliver Twist. There’s a lot in the novel about poverty. But maybe something less obvious …","CATHY: Well Oliver is taught how to steal, isn’t he? We could use that to illustrate the fact that very few children went to school, particularly not poor children, so they learnt in other ways.","GRAHAM: Good idea. What’s next?","CATHY: Maybe Nicholas Nickleby. Actually he taught in a really cruel school, didn’t he?","GRAHAM: That’s right. But there’s also the company of touring actors that Nicholas joins. We could do something on theatres and other amusements of the time. We don’t want only the bad things, do we?","CATHY: OK.","GRAHAM: What about Martin Chuzzlewit? He goes to the USA, doesn’t he?","CATHY: Yes, and Dickens himself had been there a year before, and drew on his experience there in the novel.","GRAHAM: I wonder, though … The main theme is selfishness, so we could do something on social justice? No, too general, let’s keep to your idea – I think it would work well.","CATHY: He wrote Bleak House next – that’s my favourite of his novels.","GRAHAM: Yes, mine too. His satire of the legal system is pretty powerful.","CATHY: That’s true, but think about Esther, the heroine. As a child she lives with someone she doesn’t know is her aunt, who treats her very badly. Then she’s very happy living with her guardian, and he puts her in charge of the household. And at the end she gets married and her guardian gives her and her husband a house, where of course they’re very happy.","GRAHAM: Yes, I like that.","CATHY: What shall we take next? Little Dorrit? Old Mr Dorrit has been in a debtors’ prison for years …","GRAHAM: So was Dicken’s father, wasn’t he?","CATHY: That’s right.","GRAHAM: What about focusing on the part when Mr Dorrit inherits a fortune, and he starts pretending he’s always been rich?","CATHY: Good idea.","GRAHAM: OK, so next we need to think about what materials we want to illustrate each issue. That’s going to be quite hard."],"cloze":"<p>CATHY: OK, Graham, so let’s check we both know what we’re supposed to be doing.</p><p>GRAHAM: class=\"option-letter\">A</label><input data-limit=\"2\" type=\"checkbox\" value=\"A\" data-group=\"23-24\" onchange=\"setGroup('23-24',this.value,this,2)\"><span>His speeches inspired others to try to improve society.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input data-limit=\"2\" type=\"checkbox\" value=\"B\" data-group=\"23-24\" onchange=\"setGroup('23-24',this.value,this,2)\"><span>He used his publications to draw attention to social problems.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input data-limit=\"2\" type=\"checkbox\" value=\"C\" data-group=\"23-24\" onchange=\"setGroup('23-24',this.value,this,2)\"><span>His novels are well-known now.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">D</label><input data-limit=\"2\" type=\"checkbox\" value=\"D\" data-group=\"23-24\" onchange=\"setGroup('23-24',this.value,this,2)\"><span>He was consulted on a number of social issues.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">E</label><input data-limit=\"2\" type=\"checkbox\" value=\"E\" data-group=\"23-24\" onchange=\"setGroup('23-24',this.value,this,2)\"><span>His reputation has changed in recent times.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n n><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option><option value=\"H\">H</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class=\"question-item\"> • <span><em>Little Dorrit</em></span><span class=\"inline-choice\"><strong class=\"q-number\">30</strong><select data-q=\"30\" onchange=\"setQ(30,this.value)\" aria-label=\"Question 30\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option><option value=\"H\">H</option></select></span></div></div>                                                                        <div class=\"option-bank\"><div><b>A</b> poverty</div><div><b>B</b> education</div><div><b>C</b> Dickens’s travels</div><div><b>D</b> entertainment</div><div><b>E</b> crime and the law</div><div><b>F</b> wealth</div><div><b>G</b> medicine</div><div><b>H</b> a woman’s life</div></div>\n                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>\n                                        </div>","audio":"./audio/test-26/section-3.mp3"},{"number":4,"transcript":["I’m going to report on a case study of a programme which has been set up to help rural populations in Mozambique, a largely agricultural country in South-East Africa.","The programme worked with three communities in Chicualacuala district, near the Limpopo River. This is a dry and arid region, with unpredictable rainfall. Because of this, people in the area were unable to support themselves through agriculture and instead they used the forest as a means of providing themselves with an income, mainly by selling charcoal. However, this was not a sustainable way of living in the long term, as they were rapidly using up this resource.","To support agriculture in this dry region, the programme focused primarily on making use of existing water resources from the Limpopo River by setting up systems of irrigation, which would provide a dependable water supply for crops and animals. The programme worked closely with the district government in order to find the best way of implementing this. The region already had one farmers’ association, and it was decided to set up two more of these. These associations planned and carried out activities including water management, livestock breeding and agriculture, and it was notable that in general, women formed the majority of the workforce.","It was decided that in order to keep the crops safe from animals, both wild and domestic, special areas should be fenced off where the crops could be grown. The community was responsible for creating these fences, but the programme provided the necessary wire for making them.","Once the area had been fenced off, it could be cultivated. The land was dug, so that vegetables and cereals appropriate to the climate could be grown, and the programme provided the necessary seeds for this. The programme also provided pumps so that water could be brought from the river in pipes to the fields. However, the labour was all provided by local people, and they also provided and put up the posts that supported the fences around the fields.","———————","Once the programme had been set up, its development was monitored carefully. The farmers were able to grow enough produce not just for their own needs, but also to sell. However, getting the produce to places where it could be marketed was sometimes a problem, as the farmers did not have access to transport, and this resulted in large amounts of produce, especially vegetables, being spoiled. This problem was discussed with the farmers’ associations and it was decided that in order to prevent food from being spoiled, the farmers needed to learn techniques for its preservation.","There was also an additional initiative that had not been originally planned, but which became a central feature of the programme. This was when farmers started to dig holes for tanks in the fenced-off areas and to fill these with water and use them for breeding fish – an important source of protein. After a time, another suggestion was made by local people which hadn’t been part of the programme’s original proposal, but which was also adopted later on. They decided to try setting up colonies of bees, which would provide honey both for their own consumption and to sell.","So what lessons can be learned from this programme? First of all, it tells us that in dry, arid regions, if there is access to a reliable source of water, there is great potential for the development of agriculture. In Chicualacuala, there was a marked improvement in agricultural production, which improved food security and benefited local people by providing them with both food and income. However, it’s important to set realistic timelines for each phase of the programme, especially for its design, as mistakes made at this stage may be hard to correct later on.","The programme demonstrates that sustainable development is possible in areas where …"],"cloze":"<p>I’m going to report on a case study of a programme which has been set up to help rural populations in <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> in South-East Africa.</p><p>The programme worked with <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>. This is a dry and arid region, with unpredictable rainfall. Because of this, people in the area were unable to support themselves through agriculture and inste lass=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>, but which was also adopted later on. They decided to <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> of bees, which would provide honey both for their own consumption and to sell.</p><p>So what lessons can be learned from this programme? First of all, it tells us that in dry, arid regions, if there is access to a reliable source of water, there is great potential for the development of agriculture. In Chicualacuala, there was a <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>, which improved food security and benefited local people by providing them with both food and income. However, it’s <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> for each phase of the programme, especially for its design, as mistakes made at this stage may be hard to correct later on.</p><p>The programme demonstrates that <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span> in areas where …</p>","clozeAnswers":["Mozambique, a largely agricultural country","three communities in Chicualacuala district, near the Limpopo River","income, mainly by selling charcoal","making use of existing water resources","provide a dependable water supply","livestock breeding and agriculture","general, women formed the majority","programme provided the necessary wire","appropriate to the climate","provided the necessary seeds","development was monitored carefully","marketed was sometimes a problem","produce, especially vegetables, being spoiled","learn techniques for its preservation","breeding fish – an important source","programme’s original proposal","try setting up colonies","marked improvement in agricultural production","important to set realistic timelines","sustainable development is possible"],"vocab":[{"word":"responsible","ipa":"/ɹɪˈspɒnsəbl̩/","pos":"Tính từ (adj)","meaning":"có trách nhiệm","example":"The community was responsible for creating these fences, but the programme provided the necessary wire for making them.","exampleVi":"Trong câu trên, “responsible” mang nghĩa “có trách nhiệm”."},{"word":"initiative","ipa":"/ɪˈnɪʃətɪv/","pos":"Danh từ (n)","meaning":"sáng kiến","example":"There was also an additional initiative that had not been originally planned, but which became a central feature of the programme.","exampleVi":"Trong câu trên, “initiative” mang nghĩa “sáng kiến”."},{"word":"management","ipa":"/ˈmænədʒmənt/","pos":"Danh từ (n)","meaning":"quản lý","example":"These associations planned and carried out activities including water management, livestock breeding and agriculture, and it was notable that in general, women formed the majority of the workforce.","exampleVi":"Trong câu trên, “management” mang nghĩa “quản lý”."},{"word":"production","ipa":"/pɹəˈdʌkʃən/","pos":"Danh từ (n)","meaning":"sản xuất","example":"In Chicualacuala, there was a marked improvement in agricultural production, which improved food security and benefited local people by providing them with both food and income.","exampleVi":"Trong câu trên, “production” mang nghĩa “sản xuất”."},{"word":"notable","ipa":"/ˈnəʊtəbl̩/","pos":"Tính từ (adj)","meaning":"đáng chú ý","example":"These associations planned and carried out activities including water management, livestock breeding and agriculture, and it was notable that in general, women formed the majority of the workforce.","exampleVi":"Trong câu trên, “notable” mang nghĩa “đáng chú ý”."},{"word":"agricultural","ipa":"/ˌæɡɹɪˈkʌltjʊəɹəl/","pos":"Tính từ (adj)","meaning":"nông nghiệp","example":"I’m going to report on a case study of a programme which has been set up to help rural populations in Mozambique, a largely agricultural country in South-East Africa.","exampleVi":"Trong câu trên, “agricultural” mang nghĩa “nông nghiệp”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 31-40</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the notes below.</p>\n<p><em>Write&nbsp;<strong>ONE WORD ONLY</strong>&nbsp;for each answer.</em></p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>Agricultural programme in Mozambique</strong></strong></p>\n<p><strong>How the programme was organised</strong></p>\n<ul>\n<li>It focused on a dry and arid region in Chicualacuala district, near the Limpopo River.</li>\n<li>People depended on the forest to provide charcoal as a source of income.</li>\n<li><span class=\"question-item\"><strong class=\"q-number\">31</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"31\" oninput=\"setQ(31,this.value)\"></span> was seen as the main priority to ensure the supply of water.</li>\n<li>Most of the work organised by farmers’ associations was done by <span class=\"question-item\"><strong class=\"q-number\">32</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"32\" oninput=\"setQ(32,this.value)\"></span></li>\n<li>Fenced areas created to keep animals away from crops.</li>\n<li>The programme provided</li>\n</ul>\n<p>–&nbsp; <span class=\"question-item\"><strong class=\"q-number\">33</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"33\" oninput=\"setQ(33,this.value)\"></span>&nbsp;for the fences</p>\n<p>–&nbsp; <span class=\"question-item\"><strong class=\"q-number\">34</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"34\" oninput=\"setQ(34,this.value)\"></span>&nbsp;for suitable crops</p>\n<p>–&nbsp; water pumps.</p>\n<ul>\n<li>The farmers provided</li>\n</ul>\n<p>–&nbsp; labour</p>\n<p>–&nbsp; <span class=\"question-item\"><strong class=\"q-number\">35</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"35\" oninput=\"setQ(35,this.value)\"></span>&nbsp;for the fences on their land.</p>\n<p><strong>Further developments</strong></p>\n<ul>\n<li>The marketing of produce was sometimes difficult due to lack of <span class=\"question-item\"><strong class=\"q-number\">36</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"36\" oninput=\"setQ(36,this.value)\"></span>.</li>\n<li>Training was therefore provided in methods of food <span class=\"question-item\"><strong class=\"q-number\">37</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"37\" oninput=\"setQ(37,this.value)\"></span>.</li>\n<li>Farmers made special places where <span class=\"question-item\"><strong class=\"q-number\">38</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"38\" oninput=\"setQ(38,this.value)\"></span>&nbsp;could be kept.</li>\n<li>Local people later suggested keeping <span class=\"question-item\"><strong class=\"q-number\">39</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"39\" oninput=\"setQ(39,this.value)\"></span>.</li>\n</ul>\n<p><strong>Evaluation and lessons learned</strong></p>\n<ul>\n<li>Agricultural production increased, improving incomes and food security.</li>\n<li>Enough time must be allowed, particularly for the <span class=\"question-item\"><strong class=\"q-number\">40</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"40\" oninput=\"setQ(40,this.value)\"></span>&nbsp;phase of the programme.</li>\n</ul>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-26/section-4.mp3"}],"form":{"url":"https://docs.google.com/forms/d/e/1FAIpQLSfi_gKYiTBEuV8CW68pfTJjf7MVPpMDVNMkjZWy1AjlBfigfQ/formResponse","week":"entry.1893665426","name":"entry.442430322","studentClass":"entry.55126249","d1":"entry.1101074174","i1":"entry.1320743073","d2":"entry.838708618","i2":"entry.950878529","total":"entry.219410480"}};</script><script>const SCHEMA_VERSION=3;
let si=0,stage="vocab",scoreSendPromise=null,scoreRetryTimer=null,scoreRetryAttempt=0;
const storageKey=`ielts-nghe-w${DATA.week}`;
const scoreParts=Object.freeze([
  {key:"1-2",label:()=>`Tuần ${DATA.week} · Sections 1–2`,a:1,b:2},
  {key:"3-4",label:()=>`Tuần ${DATA.week} · Sections 3–4`,a:3,b:4}
]);
function loadState(){try{const value=JSON.parse(localStorage.getItem(storageKey)||"{}");return value&&typeof value==="object"?value:{}}catch{return {}}}
function freshSubmission(fingerprint=""){return {status:"idle",fingerprint,sentAt:"",parts:{"1-2":"idle","3-4":"idle"}}}
function normalizeSubmission(value){
  const parts={};scoreParts.forEach(part=>{const saved=value?.parts?.[part.key];parts[part.key]=saved==="sent"?"sent":saved==="error"?"error":"idle"});
  const complete=scoreParts.every(part=>parts[part.key]==="sent");
  return {status:complete?"sent":value?.status==="error"?"error":"idle",fingerprint:String(value?.fingerprint||""),sentAt:complete?String(value?.sentAt||""):"",parts};
}
function freshFinal(){return {phase:"draft",requestedAt:"",answersFingerprint:"",submittedAt:""}}
const state=loadState(),loadedSchemaVersion=state.schemaVersion;
state.q=state.q&&typeof state.q==="object"?state.q:{};
state.g=state.g&&typeof state.g==="object"?state.g:{};
state.studentName=String(state.studentName||"");state.studentClass=String(state.studentClass||"");
if(loadedSchemaVersion!==SCHEMA_VERSION){
  state.scores={};state.confirmations={};state.review={};state.submission=freshSubmission();state.final=freshFinal();
}else{
  state.scores=state.scores&&typeof state.scores==="object"?state.scores:{};
  state.confirmations=state.confirmations&&typeof state.confirmations==="object"?state.confirmations:{};
  state.review=state.review&&typeof state.review==="object"?state.review:{};
  state.submission=normalizeSubmission(state.submission);
  state.final=state.final&&typeof state.final==="object"?{...freshFinal(),...state.final}:freshFinal();
  if(state.submission.status==="sending")state.submission.status="error";
  if(state.final.phase==="sending")state.final.phase="error";
}
state.schemaVersion=SCHEMA_VERSION;
const $=s=>document.querySelector(s);
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"").replace(/[^a-z0-9]+/g," ").trim();
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");
const identityPart=s=>String(s??"").normalize("NFKC").trim().toLowerCase().replace(/\s+/g," ");
const identityKey=(name,studentClass)=>`${identityPart(name)}|${identityPart(studentClass)}`;
const save=()=>localStorage.setItem(storageKey,JSON.stringify(state));
const scoreKeys=()=>Array.from({length:4},(_,i)=>[`d${i+1}`,`i${i+1}`]).flat();
function answersFingerprint(){return JSON.stringify({week:DATA.week,student:identityKey(state.studentName,state.studentClass),q:state.q,g:state.g})}
const finalRequested=()=>Boolean(state.final?.requestedAt&&state.final?.answersFingerprint&&state.final.answersFingerprint===answersFingerprint());
const finalSubmitted=()=>finalRequested()&&state.final.phase==="submitted"&&state.submission.status==="sent";
const scoresReady=()=>finalRequested()&&scoreKeys().every(key=>Number.isInteger(state.scores[key]));
const scoreFingerprint=()=>JSON.stringify({week:DATA.week,student:identityKey(state.studentName,state.studentClass),requestedAt:state.final.requestedAt,scores:scoreKeys().map(key=>state.scores[key])});
function clearScoreRetry(){if(scoreRetryTimer){clearTimeout(scoreRetryTimer);scoreRetryTimer=null}}
function section(index=si){return DATA.sections[index]}
function range(index=si){return [index*10+1,index*10+10]}
function questionGroupsFor(index=si){
  const groups=new Map();
  for(const match of section(index).questions.matchAll(/data-group="([\d-]+)"/g)){
    const key=match[1];if(!groups.has(key))groups.set(key,key.split("-").map(Number));
  }
  return groups;
}
function dictationComplete(index){return section(index).clozeAnswers.every((_,gap)=>norm(state.g[`${index+1}-${gap}`]))}
function ieltsComplete(index){
  const [first,last]=range(index),grouped=new Set();
  for(const [key,numbers] of questionGroupsFor(index)){if((state.q[key]||[]).length!==numbers.length)return false;numbers.forEach(number=>grouped.add(number))}
  for(let question=first;question<=last;question++){if(!grouped.has(question)&&!norm(state.q[question]))return false}
  return true;
}
function currentComplete(){return stage==="dictation"?dictationComplete(si):stage==="ielts"?ieltsComplete(si):true}
function allResponsesComplete(){return DATA.sections.every((_,index)=>dictationComplete(index)&&ieltsComplete(index))}
function completedPartCount(){return DATA.sections.reduce((count,_,index)=>count+Number(dictationComplete(index))+Number(ieltsComplete(index)),0)}
function draftProgressText(){return `Đã điền đủ ${completedPartCount()}/8 phần. Điểm và đáp án chỉ mở sau khi em bấm xác nhận nộp toàn bài.`}
function setQ(question,value){if(finalRequested())return;state.q[question]=value;save();refreshDraftUi()}
function setGap(gap,value){if(finalRequested())return;state.g[`${si+1}-${gap}`]=value;save();refreshDraftUi()}
function setGroup(key,value,box,max){
  if(finalRequested()){box.checked=!box.checked;return}
  let values=state.q[key]||[];
  if(box.checked&&!values.includes(value)&&values.length>=max){box.checked=false;return}
  values=box.checked?[...new Set([...values,value])]:values.filter(item=>item!==value);state.q[key]=values;save();refreshDraftUi();
}
function speak(word){speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(word);utterance.lang="en-GB";speechSynthesis.speak(utterance)}
function sectionAudioUrl(){
  const raw=String(section().audio||"").trim();if(!raw)return "";
  try{const url=new URL(raw,window.location.href);return url.origin===window.location.origin&&/\.(?:mp3|m4a)$/i.test(url.pathname)?url.href:""}catch{return ""}
}
function formatAudioDuration(seconds){
  if(!Number.isFinite(seconds)||seconds<=0)return "";
  const total=Math.round(seconds),hours=Math.floor(total/3600),minutes=Math.floor(total%3600/60),secs=String(total%60).padStart(2,"0");
  return hours?`${hours}:${String(minutes).padStart(2,"0")}:${secs}`:`${minutes}:${secs}`;
}
function setAudioStatus(message,{error=false,retry=false}={}){const status=$("#audioStatus"),button=$("#audioRetry");if(status){status.textContent=message;status.classList.toggle("bad",error)}if(button)button.hidden=!retry}
function retryAudio(){const audio=$("#sectionAudio"),url=audio?.dataset.audioUrl;if(!audio||!url)return;setAudioStatus("Đang tải lại audio…");audio.pause();audio.src=url;audio.load()}
function initAudioPlayer(){
  const audio=$("#sectionAudio"),url=audio?.dataset.audioUrl;if(!audio||!url){setAudioStatus("Audio chưa được cấu hình đúng. Vui lòng báo giáo viên.",{error:true});return}
  const ready=()=>setAudioStatus(`Audio sẵn sàng${formatAudioDuration(audio.duration)?` · ${formatAudioDuration(audio.duration)}`:""}`);
  const failed=()=>{console.error("[IELTS Listening] Không tải được audio",{week:DATA.week,section:si+1,url,errorCode:audio.error?.code||0});setAudioStatus("Không tải được audio. Kiểm tra kết nối rồi bấm “Thử lại”.",{error:true,retry:true})};
  audio.addEventListener("loadstart",()=>setAudioStatus("Đang tải audio…"));audio.addEventListener("loadedmetadata",ready);audio.addEventListener("canplay",ready);audio.addEventListener("stalled",()=>setAudioStatus("Audio đang tải chậm. Vui lòng chờ hoặc bấm “Thử lại”.",{retry:true}));audio.addEventListener("error",failed);$("#audioRetry").onclick=retryAudio;
  if(audio.error)failed();else if(audio.readyState>=1)ready();else setAudioStatus("Đang tải audio…");
}
function audioBox(){const url=sectionAudioUrl();return `<b>● AUDIO GỐC · SECTION ${si+1}</b><audio id="sectionAudio" controls preload="metadata" src="${esc(url)}" data-audio-url="${esc(url)}" aria-describedby="audioStatus"></audio><div id="audioStatus" class="audio-status" role="status" aria-live="polite">Đang tải audio…</div><button id="audioRetry" class="audio-retry" type="button" hidden>Thử lại audio</button>`}
function vocab(){return `<div class="vocab-grid">${section().vocab.map(item=>`<article class="vocab-card"><button class="sound" type="button" onclick='speak(${JSON.stringify(item.word)})'>◖))</button><h3>${item.word}</h3><div class="ipa">${item.ipa}</div><div class="pos">${item.pos}</div><div class="meaning">${item.meaning}</div><p class="example">${item.example}</p><div class="translation">${item.exampleVi}</div></article>`).join("")}</div>`}
function restoreInputs(){
  document.querySelectorAll("[data-q]").forEach(element=>{const question=element.dataset.q;if(element.type==="radio")element.checked=state.q[question]===element.value;else element.value=state.q[question]||""});
  document.querySelectorAll("[data-group]").forEach(element=>element.checked=(state.q[element.dataset.group]||[]).includes(element.value));
  document.querySelectorAll("[data-gap]").forEach(element=>element.value=state.g[`${si+1}-${element.dataset.gap}`]||"");
  if(finalRequested())document.querySelectorAll("#content input,#content select").forEach(control=>control.disabled=true);
}
function updateStageTabs(){
  document.querySelectorAll(".stage-tabs button").forEach(button=>{
    button.classList.toggle("on",button.dataset.stage===stage);
    if(button.dataset.stage==="score"){
      button.textContent=finalSubmitted()?"D · Kết quả":"D · Nộp bài";button.disabled=false;
      button.title=allResponsesComplete()||finalRequested()?"Xác nhận nộp bài hoặc xem trạng thái":"Xem tiến độ hoàn thành toàn bài";
    }
  });
}
function partProgressView(){
  const done=currentComplete();
  if(finalRequested())return `<div class="result">Bài đã khóa sau khi xác nhận nộp. Xem trạng thái và đáp án tại mục D.</div>`;
  return `<div id="partProgress" class="result ${done?"good":""}">${done?"✓ Phần này đã điền đủ. Hãy tiếp tục hoàn thành các phần còn lại.":stage==="dictation"?"Điền đủ 20/20 chỗ. Hệ thống chỉ lưu nháp, không tự nộp.":"Làm đủ 10/10 câu. Hệ thống chỉ lưu nháp, không tự nộp."}<br><small>${draftProgressText()}</small></div>`;
}
function answerKeyView(){
  return DATA.sections.map((item,index)=>{
    const dictation=section(index).clozeAnswers.map((answer,gap)=>`<div><b>${gap+1}.</b> ${esc(answer)}</div>`).join("");
    const [first,last]=range(index),ielts=[],grouped=new Set();
    for(const [,numbers] of questionGroupsFor(index)){
      const valid=[...new Set(numbers.flatMap(question=>DATA.answers[question]||[]))];
      ielts.push(`<div><b>${numbers.join("–")}.</b> ${valid.map(esc).join(", ")}</div>`);numbers.forEach(question=>grouped.add(question));
    }
    for(let question=first;question<=last;question++)if(!grouped.has(question))ielts.push(`<div><b>${question}.</b> ${(DATA.answers[question]||[]).map(esc).join(" / ")}</div>`);
    return `<details><summary>Section ${index+1} · Chính tả ${state.scores[`d${index+1}`]}/20 · IELTS ${state.scores[`i${index+1}`]}/10</summary><div class="answer-review"><strong>Đáp án chính tả</strong>${dictation}<strong>Đáp án IELTS</strong>${ielts.join("")}</div></details>`;
  }).join("");
}
function scoreGridView(){return `<div class="score-grid">${scoreKeys().map(key=>`<div class="score"><small>${key[0]==="d"?"Chính tả":"IELTS"} · Section ${key.slice(1)}</small><br><b>${state.scores[key]}/${key[0]==="d"?20:10}</b></div>`).join("")}</div>`}
function submissionMessage(){
  if(!finalRequested())return "Bài vẫn đang ở trạng thái nháp.";
  const fingerprint=scoreFingerprint(),current=state.submission.fingerprint===fingerprint,done=current?scoreParts.filter(part=>state.submission.parts?.[part.key]==="sent").length:0;
  if(finalSubmitted())return "✓ Điểm đã được tự động ghi vào sổ lớp. Đáp án đã mở bên dưới.";
  if(current&&state.submission.status==="sending")return `Đang tự động ghi điểm vào sổ lớp${done?` · đã ghi ${done}/2 nhóm`:""}…`;
  if(current&&state.submission.status==="error")return `Mạng đang gián đoạn${done?` · đã giữ an toàn ${done}/2 nhóm điểm`:""}. Hệ thống sẽ tự gửi lại phần còn thiếu.`;
  return "Đang chuẩn bị ghi điểm vào sổ lớp…";
}
function finalView(){
  const completed=completedPartCount(),ready=allResponsesComplete();
  if(!finalRequested())return `<div class="score-view"><h2>Xác nhận nộp toàn bài</h2><div class="student-summary"><span>${esc(state.studentName)}</span><span>${esc(state.studentClass)}</span></div><div class="result">${draftProgressText()}</div><button id="finalSubmit" class="submit" type="button" ${ready?"":"disabled"} onclick="finalizeSubmission(event)">${ready?"XÁC NHẬN ĐÃ LÀM XONG & GHI ĐIỂM":`HOÀN THÀNH ĐỦ 8/8 PHẦN (${completed}/8)`}</button><p>Chỉ nút này mới chấm bài và gửi điểm. Nhập câu cuối không tự nộp.</p></div>`;
  if(!finalSubmitted())return `<div class="score-view"><h2>Đang ghi điểm</h2><div class="student-summary"><span>${esc(state.studentName)}</span><span>${esc(state.studentClass)}</span></div><div id="scoreStatus" class="result">${submissionMessage()}</div>${state.submission.status==="error"?'<button class="submit" type="button" onclick="resumeFinalSubmission()">THỬ GỬI LẠI ĐIỂM</button>':""}<p>Bài đã khóa. Đáp án sẽ mở ngay sau khi hệ thống ghi điểm xong.</p></div>`;
  const total=scoreKeys().reduce((sum,key)=>sum+state.scores[key],0);
  return `<div class="score-view"><h2>Kết quả Tuần ${DATA.week}</h2><div class="student-summary"><span>${esc(state.studentName)}</span><span>${esc(state.studentClass)}</span></div><div id="scoreStatus" class="result">${submissionMessage()}<br><b>Tổng điểm: ${total}/120</b></div>${scoreGridView()}<h3>Đáp án toàn bài</h3>${answerKeyView()}</div>`;
}
function refreshDraftUi(){
  updateStageTabs();const progress=$("#partProgress");if(progress&&!finalRequested())progress.outerHTML=partProgressView();
  if(stage==="score"&&!finalRequested()){const content=$("#content");if(content)content.innerHTML=finalView()}
}
function render(){
  document.querySelectorAll(".section-tabs button").forEach((button,index)=>button.classList.toggle("on",index===si));updateStageTabs();
  if(stage==="vocab")$("#content").innerHTML=vocab();
  if(stage==="dictation")$("#content").innerHTML=`<div class="workspace"><aside class="audio-side">${audioBox()}</aside><div class="scroll-panel transcript">${section().cloze}</div></div>${partProgressView()}`;
  if(stage==="ielts")$("#content").innerHTML=`<div class="workspace"><aside class="audio-side">${audioBox()}</aside><div class="scroll-panel">${section().questions}</div></div>${partProgressView()}`;
  if(stage==="score")$("#content").innerHTML=finalView();
  restoreInputs();if(stage==="dictation"||stage==="ielts")initAudioPlayer();
}
function gradeAllResponses(){
  const scores={},review={};
  DATA.sections.forEach((item,index)=>{
    let dictationScore=0;item.clozeAnswers.forEach((answer,gap)=>{if(norm(state.g[`${index+1}-${gap}`])===norm(answer))dictationScore++});scores[`d${index+1}`]=dictationScore;
    const [first,last]=range(index),grouped=new Set();let ieltsScore=0;
    for(const [key,numbers] of questionGroupsFor(index)){
      const chosen=state.q[key]||[],valid=new Set(numbers.flatMap(question=>DATA.answers[question]||[]).map(norm));ieltsScore+=chosen.filter(value=>valid.has(norm(value))).length;numbers.forEach(question=>grouped.add(question));
    }
    for(let question=first;question<=last;question++){if(grouped.has(question))continue;if((DATA.answers[question]||[]).map(norm).includes(norm(state.q[question])))ieltsScore++}
    scores[`i${index+1}`]=ieltsScore;review[`s${index+1}`]={dictationScore,ieltsScore};
  });
  return {scores,review};
}
async function finalizeSubmission(event){
  event?.preventDefault();event?.stopPropagation();
  if(!event?.isTrusted||finalRequested()||!allResponsesComplete())return false;
  if(!window.confirm("Em xác nhận đã làm xong toàn bộ bài. Hệ thống sẽ khóa câu trả lời, ghi điểm vào sổ lớp rồi mới mở đáp án. Em có chắc chắn nộp bài?"))return false;
  const requestedAt=new Date().toISOString(),fingerprint=answersFingerprint(),graded=gradeAllResponses();
  state.scores=graded.scores;state.review=graded.review;state.confirmations=Object.fromEntries(scoreKeys().map(key=>[key,requestedAt]));state.final={phase:"sending",requestedAt,answersFingerprint:fingerprint,submittedAt:""};state.submission=freshSubmission();save();stage="score";render();
  await resumeFinalSubmission();return true;
}
function scorePayload(label,a,b){
  const payload=new URLSearchParams();payload.set(DATA.form.week,label);payload.set(DATA.form.name,state.studentName.trim());payload.set(DATA.form.studentClass,state.studentClass);
  payload.set(DATA.form.d1,String(state.scores[`d${a}`]));payload.set(DATA.form.i1,String(state.scores[`i${a}`]));payload.set(DATA.form.d2,String(state.scores[`d${b}`]));payload.set(DATA.form.i2,String(state.scores[`i${b}`]));payload.set(DATA.form.total,String(state.scores[`d${a}`]+state.scores[`i${a}`]+state.scores[`d${b}`]+state.scores[`i${b}`]));return payload;
}
function scheduleScoreRetry(){
  if(scoreRetryTimer||finalSubmitted()||!finalRequested())return;
  const delays=[5000,15000,30000,60000],delay=delays[Math.min(scoreRetryAttempt,delays.length-1)];scoreRetryAttempt++;
  scoreRetryTimer=setTimeout(()=>{scoreRetryTimer=null;if(finalRequested()&&!finalSubmitted())void resumeFinalSubmission()},delay);
}
async function ensureScoresSubmitted(){
  if(!finalRequested()||!scoresReady()||!state.studentName.trim()||!state.studentClass)return false;
  const fingerprint=scoreFingerprint();if(state.submission.fingerprint!==fingerprint)state.submission=freshSubmission(fingerprint);
  if(scoreParts.every(part=>state.submission.parts[part.key]==="sent")){state.submission.status="sent";state.final.phase="submitted";state.final.submittedAt=state.submission.sentAt||new Date().toISOString();save();return true}
  if(scoreSendPromise)return scoreSendPromise;
  clearScoreRetry();state.submission.status="sending";state.final.phase="sending";save();
  scoreSendPromise=(async()=>{
    try{
      for(const part of scoreParts){
        if(state.submission.parts[part.key]==="sent")continue;state.submission.parts[part.key]="sending";save();
        await fetch(DATA.form.url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:scorePayload(part.label(),part.a,part.b).toString()});
        state.submission.parts[part.key]="sent";save();
      }
      state.submission.status="sent";state.submission.sentAt=new Date().toISOString();state.final.phase="submitted";state.final.submittedAt=state.submission.sentAt;scoreRetryAttempt=0;save();return true;
    }catch{
      scoreParts.forEach(part=>{if(state.submission.parts[part.key]==="sending")state.submission.parts[part.key]="error"});state.submission.status="error";state.final.phase="error";save();scheduleScoreRetry();return false;
    }finally{scoreSendPromise=null}
  })();return scoreSendPromise;
}
async function resumeFinalSubmission(){
  if(!finalRequested()||finalSubmitted())return finalSubmitted();const sent=await ensureScoresSubmitted();if(stage==="score")render();return sent;
}
function selectSection(index){si=index;stage="vocab";render()}
$("#sectionTabs").innerHTML=DATA.sections.map((item,index)=>`<button type="button" onclick="selectSection(${index})">SECTION ${item.number}<br><small>Questions ${(item.number-1)*10+1}–${item.number*10}</small></button>`).join("");
document.querySelectorAll(".stage-tabs button").forEach(button=>{button.type="button";button.onclick=()=>{stage=button.dataset.stage;render()}});
const entryName=$("#entryName"),entryClass=$("#entryClass"),enterTest=$("#enterTest");entryName.value=state.studentName;entryClass.value=state.studentClass;enterTest.type="button";
function updateEntryGate(){const ready=entryName.value.trim()&&entryClass.value;enterTest.disabled=!ready;enterTest.textContent=ready?"Vào Listening Test":"Nhập họ tên và chọn lớp để vào bài"}
function resetForStudent(name,studentClass){state.q={};state.g={};state.scores={};state.confirmations={};state.review={};state.submission=freshSubmission();state.final=freshFinal();state.studentName=name;state.studentClass=studentClass;state.studentKey=identityKey(name,studentClass);state.schemaVersion=SCHEMA_VERSION}
function openTest(){
  const name=entryName.value.trim(),studentClass=entryClass.value;if(!name||!studentClass)return;
  const nextKey=identityKey(name,studentClass),previousKey=state.studentKey||identityKey(state.studentName,state.studentClass);if(previousKey&&previousKey!==nextKey)resetForStudent(name,studentClass);else{state.studentName=name;state.studentClass=studentClass;state.studentKey=nextKey}
  save();$("#entryGate").hidden=true;$("#testApp").hidden=false;render();if(finalRequested()&&!finalSubmitted())void resumeFinalSubmission();
}
entryName.oninput=updateEntryGate;entryClass.onchange=updateEntryGate;enterTest.onclick=openTest;entryName.onkeydown=event=>{if(event.key==="Enter"&&!enterTest.disabled)openTest()};
document.addEventListener("keydown",event=>{if(event.key==="Enter"&&event.target.matches("#content input"))event.preventDefault()});
window.addEventListener("online",()=>{clearScoreRetry();if(finalRequested()&&!finalSubmitted())void resumeFinalSubmission()});updateEntryGate();save();render();
</script></body></html>
