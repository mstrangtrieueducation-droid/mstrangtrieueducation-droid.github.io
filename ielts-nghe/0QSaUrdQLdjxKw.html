</style></head><body><section id="entryGate" class="entry-screen"><div class="entry-card"><header class="entry-head"><small>IELTS - NGHE · TUẦN 32</small><h1>Listening Test 22</h1><p>Điền thông tin học sinh trước khi vào bài.</p></header><div class="entry-body"><p class="entry-note">Họ tên và lớp sẽ được giữ lại để gửi điểm sau khi hoàn thành bài.</p><label for="entryName">Họ và tên học sinh</label><input id="entryName" type="text" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"><label for="entryClass">Lớp IELTS</label><select id="entryClass"><option value="">Chọn lớp IELTS</option><option>IELTS 40</option><option>IELTS 41</option><option>IELTS 42</option><option>IELTS 43</option><option>IELTS 44</option><option>IELTS 45</option><option>IELTS 46</option><option>IELTS 47</option><option>IELTS 48</option><option>IELTS 49</option><option>IELTS 50</option><option>IELTS 51</option><option>IELTS 52</option><option>IELTS 53</option></select><button id="enterTest" type="button" disabled>Nhập họ tên và chọn lớp để vào bài</button></div></div></section><div id="testApp" hidden><header class="hero"><small>IELTS - NGHE · TUẦN 32</small><h1>Listening Test 22</h1><p>Full Test · Sections 1–4 · 40 questions</p></header><main class="shell"><nav id="sectionTabs" class="section-tabs"></nav><nav class="stage-tabs"><button type="button" data-stage="vocab">A · Từ vựng cần lưu ý</button><button type="button" data-stage="dictation">B · Điền chính tả</button><button type="button" data-stage="ielts">C · Câu hỏi IELTS</button><button type="button" data-stage="score">D · Nộp bài</button></nav><section id="content" class="lesson"></section></main></div><script>const DATA={"week":32,"test":22,"sourceRef":"Cambridge IELTS 14 Academic Listening Test 2","answers":{"1":["219 442 9785","2194429785"],"2":["10 October","10th October","October 10","October 10th"],"3":["manager"],"4":["Cawley"],"5":["knee"],"6":["3 weeks"],"7":["tennis"],"8":["running"],"9":["shoulder"],"10":["vitamins"],"11":["B"],"12":["C"],"13":["C"],"14":["B"],"15":["A"],"16":["H"],"17":["D"],"18":["F"],"19":["A"],"20":["E"],"21":["B"],"22":["C"],"23":["A"],"24":["A"],"25":["E"],"26":["D"],"27":["A"],"28":["H"],"29":["G"],"30":["C"],"31":["dances"],"32":["survival"],"33":["clouds"],"34":["festivals"],"35":["comets"],"36":["sky"],"37":["instruments"],"38":["thermometer"],"39":["storms"],"40":["telegraph"]},"sections":[{"number":1,"transcript":["CARL:               Hi, come and take a seat.","JULIE:               Thank you.","CARL:               My name’s Carl Rogers and I’m one of the doctors here at the Total Health Clinic. So I understand this is your first visit to the clinic?","JULIE:               Yes, it is.","CARL:               OK, well I hope you’ll be very happy with the service you receive here. So if it’s alright with you I’ll take a few details to help me give you the best possible service.","JULIE:               Sure.","CARL:               So can I check first of all that we have the correct personal details for you? So your full name is Julie Anne Garcia?","JULIE:               That’s correct.","CARL:               Perfect. And can I have a contact phone number?","JULIE:               It’s 219 442 9785.","CARL:               OK, and then can I just check that we have the correct date of birth?","JULIE:               October tenth, 1992.","CARL:               Oh, I actually have 1991, I’ll just correct that now. Right, so that’s all good. Now I just need just a few more personal details … do you have an occupation, either full-time or part-time?","JULIE:               Yes, I work full-time in Esterhazy’s – you know, the restaurant chain. I started off as a waitress there a few years ago and I’m a manager now.","CARL:               Oh I know them, yeah, they’re down on 114th Street, aren’t they?","JULIE:               That’s right.","CARL:               Yeah, I’ve been there a few times. I just love their salads.","JULIE:               That’s good to hear.","CARL:               Right, so one more thing I need to know before we talk about why you’re here, Julie, and that’s the name of your insurance company.","JULIE:               It’s Cawley Life Insurance, that’s C-A-W-L-E-Y.","CARL:               Excellent, thank you so much.","——————————","JULIE:               Now Julie, let’s look at how we can help you. So tell me a little about what brought you here today.","CARL:               Well, I’ve been getting a pain in my knee, the left one. Not very serious at first, but it’s gotten worse, so I thought I ought to see someone about it.","JULIE:               That’s certainly the right decision. So how long have you been aware of this pain? Is it just a few days, or is it longer than that?","CARL:               Longer. It’s been worse for the last couple of days, but it’s three weeks since I first noticed it. It came on quite gradually though, so I kind of ignored it at first.","JULIE:               And have you taken any medication yourself, or treated it in anyway?","CARL:               Yeah, I’ve been taking medication to deal with the pain. Tylenol, and that works OK for a few hours. But I don’t like to keep taking it.","JULIE:               OK. And what about heat treatment? Have you tried applying heat at all?","CARL:               No, but I have been using ice on it for the last few days.","JULIE:               And does that seem to help the pain at all?","CARL:               A little, yes.","JULIE:               Good. Now you look as if you’re quite fit normally?","CARL:               I am, yes.","JULIE:               So do you do any sport on a regular basis?","CARL:               Yes, I play a lot of tennis. I belong to a club so I go there a lot. I’m quite competitive so I enjoy that side of it as well as the exercise. But I haven’t gone since this started.","JULIE:               Sure. And do you do any other types of exercise?","CARL:               Yeah, I sometimes do a little swimming, but usually just when I’m on vacation. >&nbsp;for each answer.</p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>TOTAL HEALTH CLINIC</strong></strong></p>\n<p class=\"ielts-listening-transcript-subhead\"><strong><strong>PATIENT DETAILS</strong></strong></p>\n<p><strong>Personal information</strong></p>\n<p><em>Example</em></p>\n<p>Name&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Julie Anne ……<em>Garcia</em>…..</p>\n<p>Contact phone&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<span class=\"question-item\"><strong class=\"q-number\">1</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"1\" oninput=\"setQ(1,this.value)\"></span></p>\n<p>Date of birth&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span class=\"question-item\"><strong class=\"q-number\">2</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"2\" oninput=\"setQ(2,this.value)\"></span>, 1992</p>\n<p>Occupation&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; works as a <span class=\"question-item\"><strong class=\"q-number\">3</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"3\" oninput=\"setQ(3,this.value)\"></span></p>\n<p>Insurance company&nbsp;&nbsp; <span class=\"question-item\"><strong class=\"q-number\">4</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"4\" oninput=\"setQ(4,this.value)\"></span>&nbsp;Life Insurance</p>\n<p><strong>Details of the problem</strong></p>\n<p>Type of problem&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; pain in her left <span class=\"question-item\"><strong class=\"q-number\">5</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"5\" oninput=\"setQ(5,this.value)\"></span></p>\n<p>When it began&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span class=\"question-item\"><strong class=\"q-number\">6</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"6\" oninput=\"setQ(6,this.value)\"></span>&nbsp;ago</p>\n<p>Action already taken &nbsp; has taken painkillers and applied ice</p>\n<p><strong>Other information</strong></p>\n<p>Sports played&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; belongs to a <span class=\"question-item\"><strong class=\"q-number\">7</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"7\" oninput=\"setQ(7,this.value)\"></span>&nbsp;club</p>\n<p>goes <span class=\"question-item\"><strong class=\"q-number\">8</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"8\" oninput=\"setQ(8,this.value)\"></span>&nbsp;Regularly</p>\n<p>Medical history&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; injured her <span class=\"question-item\"><strong class=\"q-number\">9</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"9\" oninput=\"setQ(9,this.value)\"></span>&nbsp;last year</p>\n<p>no allergies</p>\n<p>no regular medication apart from <span class=\"question-item\"><strong class=\"q-number\">10</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"10\" oninput=\"setQ(10,this.value)\"></span></p>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-22/section-1.mp3"},{"number":2,"transcript":["We’ll be arriving at Branley Castle in about five minutes, but before we get there I’ll give you a little information about the castle and what our visit will include.","So in fact there’s been a castle on this site for over eleven hundred years. The first building was a fort constructed in 914 AD for defence against Danish invaders by King Alfred the Great’s daughter, who ruled England at the time. In the following century, after the Normans conquered England, the land was given to a nobleman called Richard de Vere, and he built a castle there that stayed in the de Vere family for over four hundred years.","However, when Queen Elizabeth I announced that she was going to visit the castle in 1576 it was beginning to look a bit run down, and it was decided that rather than repair the guest rooms, they’d make a new house for her out of wood next to the main hall. She stayed there for four nights and apparently it was very luxurious, but unfortunately it was destroyed a few years later by fire.","In the seventeenth century the castle belonged to the wealthy Fenys family, who enlarged it and made it more comfortable. However, by 1982 the Fenys family could no longer afford to maintain the castle, even though they received government support, and they put it on the market. It was eventually taken over by a company who owned a number of amusement parks, but when we get there I think you’ll see that they’ve managed to retain the original atmosphere of the castle.","When you go inside, you’ll find that in the state rooms there are life-like moving wax models dressed in costumes of different periods in the past, which even carry on conversations together. As well as that, in every room there are booklets giving information about what the room was used for and the history of the objects and furniture it contains.","The castle park’s quite extensive. At one time sheep were kept there, and in the nineteenth century the owners had a little zoo with animals like rabbits and even a baby elephant. Nowadays the old zoo buildings are used for public displays of painting and sculpture. The park also has some beautiful trees, though the oldest of all, which dated back 800 years, was sadly blown down in 1987.","Now, you’re free to wander around on your own until 4.30, but then at the end of our visit we’ll all meet together at the bottom of the Great Staircase. We’ll then go on to the long gallery, where there’s a wonderful collection of photographs showing the family who owned the castle a hundred years ago having tea and cakes in the conservatory – and we’ll then take you to the same place, where afternoon tea will be served to you.","——————————","Now if you can take a look at your plans you’ll see Branley Castle has four towers, joined together by a high wall, with the river on two sides.","Don’t miss seeing the Great Hall. That’s near the river in the main tower, the biggest one, which was extended and redesigned in the eighteenth century.","If you want to get a good view of the whole castle, you can walk around the walls. The starting point’s quite near the main entrance – walk straight down the path until you get to the south gate, and it’s just there. Don’t go on to the north gate – there’s no way up from there.","There’ll shortly be a show in which you can see archers displaying their skill with a bow and arrow. The quickest way to get there is to take the first left after the main entrance and follow the path past the bridge, then you’ll see it in front of you at the end.","If you like animals there’s also a display of hunting birds – falcons and eagles and so on. If you go from the main entrance in the direction of the south gate, but turn right before you get there instead of going through it, you’ll see it on your right past the first tower.","At 3 pm there’s a short performance of traditional dancing on the outdoor stage. That’s right at the other side of the castle from the entrance, and over the bridge. It’s about ten minutes’ walk or so.","And finally the shop. It’s actually inside one of the towers, but the way in is from the outside. Just take the first left after the main entrance, go down the path and take the first right. It’s got some lovely gifts and souvenirs.","Right, so we’re just arriving …"],"cloze":"<p>We’ll be arriving at Branley Castle in about five minutes, but before we get there I’ll give you a <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> and what our visit will include.</p><p>So in fact there’s been a castle on this site for over eleven hundred years. The first building was a fort constructed in 914 AD for defence against Danish invaders by King Alfred the <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> at the time. In the following century, after the Normans conquered England, <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span> called Richard de Vere, and he built a castle there that stayed in the de Vere family for over four hundred years.</p><p>However, when Queen Elizabeth I announced that she was going to visit the castle in 1576 it was beginning to look a bit run down, and it was decided that <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>, they’d make a new house for her out of wood next to the main hall. She stayed there for four nights and apparently it was very luxurious, but unfortunately it was destroyed a few years later by fire.</p><p>In the seventeenth century the <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span>, who enlarged it and made it more comfortable. However, by 1982 the Fenys family could no longer afford to maintain the castle, even though they <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span>, and they put it on the market. It was eventually taken over by a company who owned a number of amusement parks, but when we get there I think you’ll see that they’ve managed to <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span> of the castle.</p><p>When you go inside, you’ll find that in the state rooms there are life-like moving wax models dressed in costumes of different periods in the past, which <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>. As well as that, in every room there are <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span> about what the room was used for and the history of the objects and furniture it contains.</p><p>The castle park’s quite extensive. At one time sheep were kept there, and in the nineteenth century the owners had a little zoo with animals like rabbits and even a baby elephant. Nowadays the old zoo buildings are used for public <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>. The park also has some beautiful trees, though the oldest of all, which dated back 800 years, <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span>.</p><p>Now, you’re free to wander around on your own until 4.30, but then at the end of our visit we’ll all meet together at the bottom of the Great Staircase. We’ll then go on to the long gallery, where there’s a <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span> the family who owned the castle a hundred years ago having tea and cakes in the conservatory – and we’ll then take you to the same place, where afternoon tea will be served to you.</p><p>——————————</p><p>Now if you can take a look at your plans you’ll see Branley Castle has four <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span> by a high wall, with the river on two sides.</p><p>Don’t miss seeing the Great Hall. That’s near the river in the main tower, the biggest one, which was extended and <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span>.</p><p>If you want to get a good view of the whole castle, you can walk around the walls. The starting point’s quite near the <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span> down the path until you get to the south gate, and it’s just there. Don’t go on to the north gate – there’s no way up from there.</p><p>There’ll shortly be a show in which you can <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span> with a bow and arrow. The quickest way to get there is to take the first left after the main entrance and follow the path past the bridge, then you’ll see it in front of you at the end.</p><p>If you like animals there’s also a <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> and eagles and so on. If you go from the main entrance in the direction of the south gate, but turn right before you get there instead of going through it, you’ll see it on your right past the first tower.</p><p>At 3 pm there’s a <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span> on the outdoor stage. That’s right at the other side of the castle from the entrance, and over the bridge. It’s about ten minutes’ walk or so.</p><p>And finally the shop. <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> one of the towers, but the way in is from the outside. Just take the first left after the main entrance, go down the path and take the first right. It’s got some <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>.</p><p>Right, so we’re just arriving …</p>","clozeAnswers":["little information about the castle","Great’s daughter, who ruled England","the land was given to a nobleman","rather than repair the guest rooms","castle belonged to the wealthy Fenys family","received government support","retain the original atmosphere","even carry on conversations together","booklets giving information","displays of painting and sculpture","was sadly blown down in 1987","wonderful collection of photographs showing","towers, joined together","redesigned in the eighteenth century","main entrance – walk straight","see archers displaying their skill","display of hunting birds – falcons","short performance of traditional dancing","It’s actually inside","lovely gifts and souvenirs"],"vocab":[{"word":"collection","ipa":"/kəˈlɛkʃən/","pos":"Danh từ (n)","meaning":"bộ sưu tập","example":"We’ll then go on to the long gallery, where there’s a wonderful collection of photographs showing the family who owned the castle a hundred years ago having tea and cakes in the conservatory – and we’ll then take you to the same place, where afternoon tea will be served to you.","exampleVi":"Trong câu trên, “collection” mang nghĩa “bộ sưu tập”."},{"word":"government","ipa":"/ˈɡʌvə(n)mənt/","pos":"Danh từ (n)","meaning":"chính phủ","example":"However, by 1982 the Fenys family could no longer afford to maintain the castle, even though they received government support, and they put it on the market.","exampleVi":"Trong câu trên, “government” mang nghĩa “chính phủ”."},{"word":"extensive","ipa":"/ɛksˈtɛn.sɪv/","pos":"Tính từ (adj)","meaning":"rộng lớn/rộng rãi","example":"The castle park’s quite extensive.","exampleVi":"Trong câu trên, “extensive” mang nghĩa “rộng lớn/rộng rãi”."},{"word":"luxurious","ipa":"/lʌkˈsjʊɹ.i.əs/","pos":"Tính từ (adj)","meaning":"sang trọng","example":"She stayed there for four nights and apparently it was very luxurious, but unfortunately it was destroyed a few years later by fire.","exampleVi":"Trong câu trên, “luxurious” mang nghĩa “sang trọng”."},{"word":"entrance","ipa":"/ˈɛn.tɹəns/","pos":"Danh từ (n)","meaning":"lối vào","example":"The starting point’s quite near the main entrance – walk straight down the path until you get to the south gate, and it’s just there.","exampleVi":"Trong câu trên, “entrance” mang nghĩa “lối vào”."},{"word":"defence","ipa":"/dɪˈfɛns/","pos":"Danh từ (n)","meaning":"sự phòng thủ","example":"The first building was a fort constructed in 914 AD for defence against Danish invaders by King Alfred the Great’s daughter, who ruled England at the time.","exampleVi":"Trong câu trên, “defence” mang nghĩa “sự phòng thủ”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 11-15</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose the correct letter,&nbsp;<strong>A</strong>,&nbsp;<strong>B</strong>&nbsp;or&nbsp;<strong>C</strong>.</p>\n<p><strong>Visit to Branley Castle</strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">11</strong> <span>Before Queen Elizabeth I visited the castle in 1576,</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q11\" value=\"A\" data-q=\"11\" onchange=\"setQ(11,this.value)\"><span>repairs were carried out to the guest rooms.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q11\" value=\"B\" data-q=\"11\" onchange=\"setQ(11,this.value)\"><span>a new building was constructed for her.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q11\" value=\"C\" data-q=\"11\" onchange=\"setQ(11,this.value)\"><span>a fire damaged part of the main hall.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">12</strong> <span>In 1982, the castle was sold to</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q12\" value=\"A\" data-q=\"12\" onchange=\"setQ(12,this.value)\"><span>the government</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q12\" value=\"B\" data-q=\"12\" onchange=\"setQ(12,this.value)\"><span>the Fenys family.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q12\" value=\"C\" data-q=\"12\" onchange=\"setQ(12,this.value)\"><span>an entertainment company.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">13</strong> <span>In some of the rooms, visitors can</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q13\" value=\"A\" data-q=\"13\" onchange=\"setQ(13,this.value)\"><span>speak to experts on the history of the castle.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q13\" value=\"B\" data-q=\"13\" onchange=\"setQ(13,this.value)\"><span>interact with actors dressed as famous characters.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q13\" value=\"C\" data-q=\"13\" onchange=\"setQ(13,this.value)\"><span>see models of historical figures moving and talking.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">14</strong> <span>In the castle park, visitors can</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q14\" value=\"A\" data-q=\"14\" onchange=\"setQ(14,this.value)\"><span>see an 800-year-old tree.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q14\" value=\"B\" data-q=\"14\" onchange=\"setQ(14,this.value)\"><span>go to an art exhibition.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q14\" value=\"C\" data-q=\"14\" onchange=\"setQ(14,this.value)\"><span>visit a small zoo.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">15</strong> <span>At the end of the visit, the group will have</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q15\" value=\"A\" data-q=\"15\" onchange=\"setQ(15,this.value)\"><span>afternoon tea in the conservatory.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q15\" value=\"B\" data-q=\"15\" onchange=\"setQ(15,this.value)\"><span>the chance to meet the castle’s owners.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q15\" value=\"C\" data-q=\"15\" onchange=\"setQ(15,this.value)\"><span>a photograph together on the Great Staircase.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 16-20</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Label the plan below.</p>\n<p>Write the correct letter,&nbsp;<strong>A-H</strong>, next to Questions</p>\n<p><strong>Branley Castle</strong></p>\n<p><img class=\"question-visual\" src=\"./question-assets/test-22/section-2-visual-1.jpg\" alt=\"Sơ đồ Cambridge IELTS 14 Test 2, Section 2\" loading=\"lazy\" decoding=\"async\"></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                                <table class=\"ielts-listening-matching-table\"><thead><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th><th>G</th><th>H</th></tr></thead><tbody><tr class=\"question-item\"><td class=\"ielts-listening-matching-question-cell\"><strong class=\"q-number\">16</strong> <span>Starting point for walking the walls</span></td>\n                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q16\" value=\"A\" data-q=\"16\" onchange=\"se ut type=\"radio\" name=\"q17\" value=\"G\" data-q=\"17\" onchange=\"setQ(17,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q17\" value=\"H\" data-q=\"17\" onchange=\"setQ(17,this.value)\"></td></tr>                                                                                                                                                                                                                                                                                                    <tr class=\"question-item\"><td class=\"ielts-listening-matching-question-cell\"><strong class=\"q-number\">18</strong> <span>Hunting birds display</span></td>\n                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q18\" value=\"A\" data-q=\"18\" onchange=\"setQ(18,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q18\" value=\"B\" data-q=\"18\" onchange=\"setQ(18,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q18\" value=\"C\" data-q=\"18\" onchange=\"setQ(18,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q18\" value=\"D\" data-q=\"18\" onchange=\"setQ(18,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q18\" value=\"E\" data-q=\"18\" onchange=\"setQ(18,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q18\" value=\"F\" data-q=\"18\" onchange=\"setQ(18,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q18\" value=\"G\" data-q=\"18\" onchange=\"setQ(18,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q18\" value=\"H\" data-q=\"18\" onchange=\"setQ(18,this.value)\"></td></tr>                                                                                                                                                                                                                                                                                                    <tr class=\"question-item\"><td class=\"ielts-listening-matching-question-cell\"><strong class=\"q-number\">19</strong> <span>Traditional dancing</span></td>\n                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q19\" value=\"A\" data-q=\"19\" onchange=\"setQ(19,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q19\" value=\"B\" data-q=\"19\" onchange=\"setQ(19,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q19\" value=\"C\" data-q=\"19\" onchange=\"setQ(19,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q19\" value=\"D\" data-q=\"19\" onchange=\"setQ(19,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q19\" value=\"E\" data-q=\"19\" onchange=\"setQ(19,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q19\" value=\"F\" data-q=\"19\" onchange=\"setQ(19,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q19\" value=\"G\" data-q=\"19\" onchange=\"setQ(19,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q19\" value=\"H\" data-q=\"19\" onchange=\"setQ(19,this.value)\"></td></tr>                                                                                                                                                                                                                                                                                                    <tr class=\"question-item\"><td class=\"ielts-listening-matching-question-cell\"><strong class=\"q-number\">20</strong> <span>Shop</span></td>\n                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q20\" value=\"A\" data-q=\"20\" onchange=\"setQ(20,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q20\" value=\"B\" data-q=\"20\" onchange=\"setQ(20,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q20\" value=\"C\" data-q=\"20\" onchange=\"setQ(20,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q20\" value=\"D\" data-q=\"20\" onchange=\"setQ(20,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q20\" value=\"E\" data-q=\"20\" onchange=\"setQ(20,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q20\" value=\"F\" data-q=\"20\" onchange=\"setQ(20,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q20\" value=\"G\" data-q=\"20\" onchange=\"setQ(20,this.value)\"></td>                                                                                                            <td class=\"ielts-listening-matching-option-cell\"><input type=\"radio\" name=\"q20\" value=\"H\" data-q=\"20\" onchange=\"setQ(20,this.value)\"></td></tr></tbody></table>                                                                                                                                                                                        </div>\n                                        </div>","audio":"./audio/test-22/section-2.m4a"},{"number":3,"transcript":["TUTOR:            So, Rosie and Martin, let’s look at what you’ve got for your presentation on woolly mammoths.","ROSIE:             OK, we’ve got a short outline here.","TUTOR:            Thanks. So it’s about a research project in North America?","MARTIN:         Yes. But we thought we needed something general about woolly mammoths in our introduction, to establish that they were related to our modern elephant, and they lived thousands of years ago in the last ice age.","ROSIE:             Maybe we could show a video clip of a cartoon about mammoths. But that’d be a bit childish. Or we could have a diagram, it could be a timeline to show when they lived, with illustrations?","MARTIN:         Or we could just show a drawing of them walking in the ice? No, let’s go with your last suggestion.","TUTOR:            Good. Then you’re describing the discovery of the mammoth tooth on St Paul’s Island in Alaska, and why it was significant.","ROSIE:             Yes. The tooth was found by a man called Russell Graham. He picked it up from under a rock in a cave. He knew it was special – for a start it was in really good condition, as if it had been just extracted from the animal’s jawbone. Anyway, they found it was 6,500 years old.","TUTOR:            So why was that significant?","ROSIE:             Well the mammoth bones previously found on the North American mainland were much less recent than that. So this was really amazing.","MARTIN:         Then we’re making an animated diagram to show the geography of the area in prehistoric times. So originally, St Paul’s Island wasn’t an island, it was connected to the mainland, and mammoths and other animals like bears were able to roam around the whole area.","ROSIE:             Then the climate warmed up and the sea level began to rise, and the island got cut off from the mainland. So those mammoths on the island couldn’t escape; they had to stay on the island.","MARTIN:         And in fact the species survived there for thousands of years after they’d become extinct on the mainland.","TUTOR:            So why do you think they died out on the mainland?","ROSIE:             No one’s sure.","MARTIN:         Anyway, next we’ll explain how Graham and his team identified the date when the mammoths became extinct on the island. They concluded that the extinction happened 5,600 years ago, which is a very precise time for a prehistoric extinction. It’s based on samples they took from mud at the bottom of a lake on the island. They analysed it to find out what had fallen in over time – bits of plants, volcanic ash and even DNA from the mammoths themselves. It’s standard procedure, but it took nearly two years to do.","————————","TUTOR:            So why don’t you quickly go through the main sections of your presentation and discuss what action’s needed for each part?","MARTIN:         OK. So for the introduction, we’re using a visual, so once we’ve prepared that we’re done.","ROSIE:             I’m not sure. I think we need to write down all the ideas we want to include here, not just rely on memory. How we begin the presentation is so important …","MARTIN:         You’re right.","ROSIE:             The discovery of the mammoth tooth is probably the most dramatic part, but we don’t have that much information, only what we got from the online article. I thought maybe we could get in touch with the researcher who led the team and ask him to tell us a bit more.","MARTIN:          Great idea. What about the section with the initial questions asked by the researchers? We’ve got a lot on that but we need to make it interesting.","ROSIE:             We could ask the audience to suggest some questions about it and then see how many of them we can answer. I don’t think it would take                                                           </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">24</strong> <span>According to Martin, what is unusual about the date of the mammoths’ extinction on the island?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q24\" value=\"A\" data-q=\"24\" onchange=\"setQ(24,this.value)\"><span>how exact it is</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q24\" value=\"B\" data-q=\"24\" onchange=\"setQ(24,this.value)\"><span>how early it is</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q24\" value=\"C\" data-q=\"24\" onchange=\"setQ(24,this.value)\"><span>how it was established</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questi input</div><div><b>C</b> add personal opinions</div><div><b>D</b> contact one of the researchers</div><div><b>E</b> make detailed notes</div><div><b>F</b> find information online</div><div><b>G</b> check timing</div><div><b>H</b> organise the content more clearly</div></div>\n                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>\n                                        </div>","audio":"./audio/test-22/section-3.m4a"},{"number":4,"transcript":["In this series of lectures about the history of weather forecasting, I’ll start by examining its early history – that’ll be the subject of today’s talk.","Ok, so we’ll start by going back thousands of years. Most ancient cultures had weather gods, and weather catastrophes, such as floods, played an important role in many creation myths. Generally, weather was attributed to the whims of the gods, as the wide range of weather gods in various cultures shows. For instance, there’s the Egyptian sun god Ra, and Thor, the Norse god of thunder and lightning. Many ancient civilisations developed rites such as dances in order to make the weather gods look kindly on them.","But the weather was of daily importance: observing the skies and drawing the correct conclusions from these observations was really important, in fact their survival depended on it. It isn’t known when people first started to observe the skies, but at around 650 BC, the Babylonians produced the first short-range weather forecasts, based on their observations of clouds and other phenomena. The Chinese also recognised weather patterns, and by 300 BC, astronomers had developed a calendar which divided the year into 24 festivals, each associated with a different weather phenomenon.","The ancient Greeks were the first to develop a more scientific approach to explaining the weather. The work of the philosopher and scientist Aristotle, in the fourth century BC, is especially noteworthy, as his ideas held sway for nearly 2,000 years. In 340 BC, he wrote a book in which he attempted to account for the formation of rain, clouds, wind and storms. He also described celestial phenomena such as haloes – that is, bright circles of light around the sun, the moon and bright stars – and comets. Many of his observations were surprisingly accurate. For example, he believed that heat could cause water to evaporate. But he also jumped to quite a few wrong conclusions, such as that winds are breathed out by the Earth. Errors like this were rectified from the Renaissance onwards.","———————","For nearly 2,000 years, Aristotle’s work was accepted as the chief authority on weather theory. Alongside this, though, in the Middle Ages weather observations were passed on in the form of proverbs, such as ‘Red sky at night, shepherd’s delight; red sky in the morning, shepherd’s warning’. Many of these are based on very good observations and are accurate, as contemporary meteorologists have discovered.","For centuries, any attempt to forecast the weather could only be based on personal observation, but in the fifteenth century scientists began to see the need for instruments. Until then, the only ones available were weather vanes – to determine the wind direction – and early versions of rain gauges. One of the first, invented in the fifteenth century, was a hygrometer, which measured humidity. This was one of many inventions that contributed to the development of weather forecasting.","In 1592, the Italian scientist and inventor Galileo developed the world’s first thermometer. His student Torricelli later invented the barometer, which allowed people to measure atmospheric pressure. In 1648, the French philosopher Pascal proved that pressure decreases with altitude. This discovery was verified by English astronomer Halley in 1686, and Halley was also the first person to map trade winds.","This increasing ability to measure factors related to weather helped scientists to understand the atmosphere and its processes better, and they started collecting weather observation data systematically. In the eighteenth century, the scientist and politician Benjamin Franklin carried out work on electricity and lightning in particular, but he was also very interested in weather and studied it throughout most of his life. It was Franklin who discovered that storms generally travel from west to east.","In addition to new meteorological instruments, other developments contributed to our understanding of the atmosphere. People in different locations began to keep records, and in the mid-nineteenth century, the invention of the telegraph made it possible for these records to be collated. This led, by the end of the nineteenth century, to the first weather services.","It was not until the early twentieth century that mathematics and physics became part of meteorology, and we’ll continue from that point next week.1"],"cloze":"<p>In this series of lectures about the history of weather forecasting,
