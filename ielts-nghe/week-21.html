</style></head><body><section id="entryGate" class="entry-screen"><div class="entry-card"><header class="entry-head"><small>IELTS - NGHE · TUẦN 21</small><h1>Listening Test 11</h1><p>Điền thông tin học sinh trước khi vào bài.</p></header><div class="entry-body"><p class="entry-note">Họ tên và lớp sẽ được giữ lại để gửi điểm sau khi hoàn thành bài.</p><label for="entryName">Họ và tên học sinh</label><input id="entryName" type="text" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"><label for="entryClass">Lớp IELTS</label><select id="entryClass"><option value="">Chọn lớp IELTS</option><option>IELTS 40</option><option>IELTS 41</option><option>IELTS 42</option><option>IELTS 43</option><option>IELTS 44</option><option>IELTS 45</option><option>IELTS 46</option><option>IELTS 47</option><option>IELTS 48</option><option>IELTS 49</option><option>IELTS 50</option><option>IELTS 51</option><option>IELTS 52</option><option>IELTS 53</option></select><button id="enterTest" disabled>Nhập họ tên và chọn lớp để vào bài</button></div></div></section><div id="testApp" hidden><header class="hero"><small>IELTS - NGHE · TUẦN 21</small><h1>Listening Test 11</h1><p>Full Test · Sections 1–4 · 40 questions</p></header><main class="shell"><nav id="sectionTabs" class="section-tabs"></nav><nav class="stage-tabs"><button data-stage="vocab">A · Từ vựng cần lưu ý</button><button data-stage="dictation">B · Điền chính tả</button><button data-stage="ielts">C · Câu hỏi IELTS</button><button data-stage="score">D · Kết quả</button></nav><section id="content" class="lesson"></section></main></div><script>const DATA={"week":21,"test":11,"answers":{"1":["central"],"2":["600","£600"],"3":["2 years","2 year"],"4":["garage"],"5":["garden"],"6":["study"],"7":["noisy"],"8":["595","£595"],"9":["B","E"],"10":["B","E"],"11":["classical music","classical concerts"],"12":["bookshop","bookstore"],"13":["planned"],"14":["1983","the 1980s","1980s"],"15":["City Council"],"16":["363"],"17":["Garden Hall","the Garden Hall"],"18":["Three Lives"],"19":["4.50","£4.50"],"20":["Faces of China"],"21":["C"],"22":["C"],"23":["A"],"24":["B"],"25":["C"],"26":["A"],"27":["C"],"28":["A"],"29":["B"],"30":["C"],"31":["B"],"32":["B"],"33":["B"],"34":["A"],"35":["combination","system"],"36":["safety"],"37":["attitudes","attitude"],"38":["controls","control"],"39":["factory","factories"],"40":["skills"]},"sections":[{"number":1,"transcript":["WOMAN: Good morning. How can I help you?","MAN: Hello. I'm interested in renting a house somewhere in the town.","WOMAN: Right. Could I have your name please?","MAN: Yes, it's Steven Godfrey.","WOMAN: And tell me how many bedrooms you're looking for.","MAN: Well, we'd need four, because I'm going to share the house with three friends.","WOMAN: Okay, there are several of that size on our books. They mostly belong to families who are working abroad at the moment. What about the location?","MAN: It'd be nice to be central.","WOMAN: That might be difficult, as most houses of that size are in the suburbs. Still, there are a few. What's your upper limit for the rent?","MAN: We'd like something around £500 a month, but we could go up to £600 if we have to. But we can't go beyond that.","WOMAN: Do you know how long you want to rent the house for? The minimum let is six months, as you probably realise.","MAN: We're at college here for two years, and we don't want to have to move during that time if we can avoid it.","WOMAN: Right. And how soon do you want to move in? All our lets start on the first of the month.","MAN: Well, as soon as possible, really, so that means September 1st.","WOMAN: Okay, let me have a look at what we've got . . . We have photographs of all the houses on our books, so you can get an idea of what they're like. There's this one in Oakington Avenue, at £550 a month. Combined living room and dining room, with a separate kitchen. It doesn't have a garage, though you can park in the road.","MAN: Ah, we'd prefer to have one, if possible.","WOMAN: Right. Then have a look at this house, in Mead Street. It's got a very large living room and kitchen, bathroom, cloakroom . . .","MAN: How much is it?","WOMAN: That one's 580. It's very well furnished and equipped. It also has plenty of space for parking, and it's available for a minimum of a year. Oh, and there's a big garden.","MAN: I don't think we could cope with that, to be honest. We'll be too busy to look after it.","WOMAN: Okay. Then there's this older house in Hamilton Road: living room, kitchen-diner, and it has a study. 550 a month.","MAN: That looks rather nice. But whereabouts in Hamilton Road?","WOMAN: Towards the western end.","MAN: Oh, that'll be very noisy. I know the area.","WOMAN: Yes, it's pretty lively. Some people like it, though. Well, what about this house in Devon Close?","MAN: That looks lovely.","WOMAN: There's a big demand for houses in that area, so prices tend to be quite high. But this one hasn't been decorated for a few years, which has kept the rent down a bit. It's got a living room, dining room and small kitchen, and it's 595 a month. I think it would suit you, from what you've said.","MAN: It sounds fine.","MAN: Why's that part of town so popular?","WOMAN: Well, there's a big scheme to improve the district, and it'll soon have the best facilities for miles around.","MAN: What sort of thing?","WOMAN: There's a big sports centre under construction, which will be very impressive when it's finished. In fact the swimming pool's already opened, ahead of schedule, and it's attracting a lot of people.","MAN: What about cinemas: are there any in the area?","WOMAN: The only one closed down last year, and it's now in the process of being converted into a film museum. The local people are trying to get a new cinema added to the scheme.","MAN: I think I heard something about a plan to replace the existing concert hall with a larger one.","WOMAN: Ah, that's due to start next year.","MAN: Well it sounds an interesting area to live in. Could I go                                </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 9-10</h2>\n                                                                                <div class=\"task-copy\">\n                                            <p>Choose TWO letters, A-E.</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">9</strong> <strong class=\"q-number\">10</strong> Which TWO facilities in the district of Devon Close are open to the public at the moment?</span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input data-limit=\"2\" type=\"checkbox\" value=\"A\" data-group=\"9-10\" onchange=\"setGroup('9-10',this.value,this,2)\"><span>museum</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input data-limit=\"2\" type=\"checkbox\" value=\"B\" data-group=\"9-10\" onchange=\"setGroup('9-10',this.value,this,2)\"><span>concert hall</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input data-limit=\"2\" type=\"checkbox\" value=\"C\" data-group=\"9-10\" onchange=\"setGroup('9-10',this.value,this,2)\"><span>cinema</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">D</label><input data-limit=\"2\" type=\"checkbox\" value=\"D\" data-group=\"9-10\" onchange=\"setGroup('9-10',this.value,this,2)\"><span>sports centre</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">E</label><input data-limit=\"2\" type=\"checkbox\" value=\"E\" data-group=\"9-10\" onchange=\"setGroup('9-10',this.value,this,2)\"><span>swimming pool</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                        </div>","audio":"https://engnovate.com/wp-content/uploads/2026/06/cambridge-ielts-08-academic-listening-test-3-1.mp3"},{"number":2,"transcript":["Hello, and welcome to Focus on the Arts. I'm your host – Dave Green – and this is your very own local radio programme. Every Friday evening we put the spotlight on different arts and culture facilities, and look at the shows and events that are on offer in the coming week.","And today the focus is on The National Arts Centre. Now, if you don't already know it yourself, I'm sure you've all heard of it. It's famous throughout the world as one of the major venues for classical music.","But did you know that it is actually much more than just a place to hear concerts? The Centre itself is a huge complex that caters for a great range of arts. Under a single roof it houses concert rooms, theatres, cinemas, art galleries and a wonderful public library, as well as service facilities including three restaurants and a bookshop. So at any one time, the choice of entertainment there is simply enormous.","So, how did they manage to build such a big arts complex right in the heart of the city? Well, the area was completely destroyed by bombs during the war in 1940. So the opportunity was taken to create a cultural centre that would be, what they called: 'the City's gift to the Nation'. Of course it took a while for such a big project to get started, but it was planned in the 60s, built in the 70s and eventually opened to the public in 1983. Ever since then it has proved to be a great success. It is not privately owned, like many arts centres, but is still in public hands – it's run by the City Council. Both our National Symphony Orchestra and National Theatre Company were involved in the planning of the project, and they are now based there – giving regular performances every week – and as the Centre is open 363 days of the year, there are plenty of performances to choose from.","So, to give you some idea of what's on, and to help you choose from the many possibilities, we've made a selection of the star attractions.","If you're interested in classical music, then we recommend you go along to the National on either Monday or Tuesday evening at 7.30 for a spectacular production of 'The Magic Flute' – probably the most popular of all Mozart's operas. It's in the Garden Hall and tickets start at only £8.00, but you'll have to be early if you want to get them that cheap! And remember, it's only on for those two evenings.","For those more interested in the cinema, you might like to see the new Canadian film which is showing on Wednesday evening at 8pm in Cinema 2. And that's called 'Three Lives.' It's had fantastic reviews and tickets cost just £4.50, which is a reduction on the usual price of £5.50. So, it's really good value, especially for such a great movie.","But you can see the centre's main attraction at the weekend, because on Saturday and Sunday, 11 am to 10 pm, they're showing a wonderful new exhibition that hasn't been seen anywhere else in Europe yet. It's a collection of Chinese Art called 'Faces of China' – that's in Gallery 1 – and it has some really fascinating paintings and sculptures by leading artists from all over China – and the good news is that it is completely free, so don't miss it!","So why not go along to the National Arts Centre next week for one – or all – of these great events – and you can always pick up a programme and check out all the other performances and exhibitions on offer, or coming soon, on almost every day of the year.","Next week we'll be looking at the new Museum of Science . . ."],"cloze":"<p>Hello, and welcome to Focus on the Arts. I'm your host – Dave Green – and this is your very own local radio programme. Every Friday evening we put the spotlight on different <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span> facilities, and look at the shows and events that are on offer in the coming week.</p><p>And today the focus is on The National Arts Centre. Now, if you don't already know it yourself, I'm sure you've all heard of it. It's famous throughout the world as one of the <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> for <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>.</p><p>But did you know that it is actually much more than just a place to hear concerts? The Centre itself is a huge complex that <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> a great range of arts. <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> it houses concert rooms, theatres, cinemas, art galleries and a wonderful <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span>, as well as service facilities including three restaurants and a <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span>. So at any one time, the choice of entertainment there is simply enormous.</p><p>So, how did they manage to build such a big arts complex right in the heart of the city? Well, the area was completely <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span> during the war in 1940. So the opportunity was taken to create a <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span> that would be, what they called: 'the City's gift to the Nation'. Of course it took a while for such a big project to get started, but it was <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span> in the 60s, built in the 70s and <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span> to the public in 1983. Ever since then it has proved to be a great success. It is not privately owned, like many arts centres, but is still in <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span> – it's run by the <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span>. Both our National Symphony Orchestra and National Theatre Company were involved in the planning of the project, and they are now <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span> – giving regular performances every week – and as the Centre is open <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span> of the year, there are plenty of performances to choose from.</p><p>So, to give you some idea of what's on, and to help you choose from the many possibilities, we've made a selection of the star attractions.</p><p>If you're interested in classical music, then we recommend you go along to the National on either Monday or Tuesday evening at 7.30 for a <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span> of 'The Magic Flute' – probably the most popular of all Mozart's operas. It's in the <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> and tickets start at only £8.00, but you'll have to be early if you want to get them that cheap! And remember, it's only on for those two evenings.</p><p>For those more interested in the cinema, you might like to see the new Canadian film which is showing on Wednesday evening at 8pm in Cinema 2. And that's called 'Three Lives.' It's had fantastic reviews and tickets cost just £4.50, which is a <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span> on the usual price of £5.50. So, it's really good value, especially for such a great movie.</p><p>But you can see the centre's main attraction at the weekend, because on Saturday and Sunday, 11 am to 10 pm, they're showing a wonderful new exhibition that hasn't been seen anywhere else in Europe yet. It's a collection of Chinese Art called 'Faces of China' – that's in Gallery 1 – and it has some really <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> and sculptures by leading artists from all over China – and the good news is that it is <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>, so don't miss it!</p><p>So why not go along to the National Arts Centre next week for one – or all – of these great events – and you can always pick up a programme and check out all the other performances and exhibitions on offer, or coming soon, on almost every day of the year.</p><p>Next week we'll be looking at the new Museum of Science . . .</p>","clozeAnswers":["arts and culture","major venues","classical music","caters for","under a single roof","public library","bookshop","destroyed by bombs","cultural centre","planned","eventually opened","public hands","City Council","based there","363 days","spectacular production","Garden Hall","reduction","fascinating paintings","completely free"],"vocab":[{"word":"venue","ipa":"/ˈvenjuː/","meaning":"địa điểm tổ chức","example":"The centre is a major venue for classical music.","exampleVi":"Trung tâm là địa điểm lớn tổ chức nhạc cổ điển.","pos":"Danh từ (n)"},{"word":"cater for","ipa":"/ˈkeɪtə fɔː/","meaning":"phục vụ, đáp ứng","example":"The complex caters for many different art forms.","exampleVi":"Khu phức hợp phục vụ nhiều loại hình nghệ thuật.","pos":"Cụm động từ (phr.v)"},{"word":"under one roof","ipa":"/ˌʌndə wʌn ˈruːf/","meaning":"cùng trong một tòa nhà","example":"Several arts facilities are housed under one roof.","exampleVi":"Nhiều cơ sở nghệ thuật nằm chung trong một tòa nhà.","pos":"Cụm giới từ (prep. phr.)"},{"word":"in public hands","ipa":"/ɪn ˌpʌblɪk ˈhændz/","meaning":"thuộc quản lý poken Spanish was already pretty good in fact.","WOMAN: So you weren't too worried about language barriers?","PAUL: No. In fact, I ended up teaching English there, although that wasn't my original choice of work.","WOMAN: I see. How did you find out about all this?","PAUL: I found an agency that runs all kinds of voluntary projects in South America.","WOMAN: What kind of work?","PAUL: Well, there were several possibilities.","WOMAN: You mean construction? Engineering work?","PAUL: Yes, getting involved in building projects was an option. Then there was tourism – taking tourists for walks around the volcanoes – which I actually chose to do, and then there was work with local farmers.","WOMAN: But you didn't continue with that project. Why not?","PAUL: Because I never really knew whether I'd be needed or not. I'd thought it might be difficult physically, but I was certainly fit enough . . . no, I wanted to do something that had more of a proper structure to it, I suppose. I get de-motivated otherwise.","WOMAN: What do you think you learned from your experience? It must have been a great opportunity to examine community life.","PAUL: Yes, but it was difficult at first to be accepted by the locals. It was a very remote village and some of them were reluctant to speak to me – although they were always interested in my clothes and how much I'd had to pay for them.","WOMAN: Well, that's understandable.","PAUL: Yes, but things soon improved. What struck me was that when people became more comfortable with me and less suspicious, we really connected with each other in a meaningful way.","WOMAN: You made good friends?","PAUL: Yes, with two of the families in particular.","WOMAN: Good. What about management. Did you have a project manager?","PAUL: Yes and he gave me lots of advice and guidance.","WOMAN: And was he good at managing too?","PAUL: That wasn't his strong point! I think he was often more interested in the academic side of things than filing reports. He was a bit of                                                                                                    <span><strong class=\"q-number\">25</strong> What does Paul say about his project manager?</span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q25\" value=\"A\" data-q=\"25\" onchange=\"setQ(25,this.value)\"><span>He let Paul do most of the work.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q25\" value=\"B\" data-q=\"25\" onchange=\"setQ(25,this.value)\"><span>His plans were too ambitious.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q25\" value=\"C\" data-q=\"25\" onchange=\"setQ(25,this.value)\"><span>He was very supportive of Paul.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">26</strong> Paul was surprised to be given</span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q26\" value=\"A\" data-q=\"26\" onchange=\"setQ(26,this.value)\"><span>a computer to use.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q26\" value=\"B\" data-q=\"26\" onchange=\"setQ(26,this.value)\"><span>so little money to live on.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q26\" value=\"C\" data-q=\"26\" onchange=\"setQ(26,this.value)\"><span>an extension to his contract.</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 27-30</h2>\n                                                                                <div class=\"task-copy\">\n                                            <p>What does Paul decide about each of the following modules?</p>\n<p>Write the correct letter, A, B or C, next to questions 27-30.</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                                <div class=\"matching-dnd-questions\"><div class=\"question-item\"> • Gender Studies in Latin America<span class=\"inline-choice\"><strong class=\"q-number\">27</strong><select data-q=\"27\" onchange=\"setQ(27,this.value)\" aria-label=\"Question 27\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • Second Language Acquisition<span class=\"inline-choice\"><strong class=\"q-number\">28</strong><select data-q=\"28\" onchange=\"setQ(28,this.value)\" aria-label=\"Question 28\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • Indigenous Women's Lives<span class=\"inline-choice\"><strong class=\"q-number\">29</strong><select data-q=\"29\" onchange=\"setQ(29,this.value)\" aria-label=\"Question 29\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • Portuguese Language Studies<span class=\"inline-choice\"><strong class=\"q-number\">30</strong><select data-q=\"30\" onchange=\"setQ(30,this.value)\" aria-label=\"Question 30\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div></div>                                                                        <div class=\"option-bank\"><div><b>A</b> He will do this.</div><div><b>B</b> He might do this.</div><div><b>C</b> He won't do this.</div></div>\n                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>\n                                        </div>","audio":"https://engnovate.com/wp-content/uploads/2026/06/cambridge-ielts-08-academic-listening-test-3-3.mp3"},{"number":4,"transcript":["Good morning, everyone. In the last few lectures I've been dealing with business finance, but now I'm going to move on to business systems. And in today's lecture I'm going to talk about what can go wrong when businesses try to copy their own best practices.","Once a business has successfully introduced a new process – managing a branch bank, say, or selling a new product – the parent organisation naturally wants to repeat that success, and capture it if possible on a bigger scale. The goal, then, is to utilise existing knowledge and not to generate new knowledge. It's a less glamorous activity than pure innovation, but it actually happens more often, as a matter of fact. However, surprisingly, getting things right the second time is not necessarily any simpler than it was the first time.","Now, there's been a lot of research into how companies can repeat their previous successes, and it certainly hasn't been confined to the United States. It seems that most large industries are trying to repeat their own successes, and manage the knowledge they've acquired – but even so it has been shown that the overwhelming majority of attempts fail. A host of studies confirm this, covering a wide range of business settings: branch banks, retail stores, real estate agencies, factories, call centres . . . to name but a few.","So why do so few managers get things right the second or third time? Let's consider one reason for failure – placing too much trust in the people who are running the successful operation, the 'experts' shall we say. Managers who want to apply existing knowledge typically start off by going to an expert – such as the person who designed and is running a successful department store – and picking their brains. Now, this approach can be used if you want to gain a rough understanding of a particular system, or understand smaller, isolated problems. The trouble is, even the expert doesn't fully grasp the whole thing because when it comes to complex systems, the individual components of the process are interwoven with one another. The expert never has complete access to the necessary information. And the situation's complicated even further by the fact that experts are usually not aware of their own ignorance. The ignorance can take various forms. For instance, a lot of details of the system are invisible to managers. Some may be difficult to describe – learned on the job and well known by workers perhaps, but impossible to describe in a way that's helpful. And there are some things that people know or do that they're not even aware of.","Now, let's consider two types of mistake that can occur when a manager actually starts to set up a duplicate system to replicate a successful process. Firstly, perhaps he forgets that he was just trying to copy another process, and starts trying to improve on it. Another mistake is trying to use the best parts of various different systems, in the hope of creating the perfect combination.","Unfortunately, attempts like these usually turn out to be misguided and lead to problems. Why? Well, for various reasons. Perhaps there weren't really any advantages after all, because the information wasn't accurate. Or perhaps the business settings weren't really comparable. More typically, the advantages are real enough, but there are also disadvantages that have been overlooked. For example, the modifications might compromise safety in some way.","So, what's the solution? Well, I don't intend to suggest that it's easy to get things right the second time . . . it's not. But the underlying problem has more to do with attitudes than the actual difficulty of the task, and there are ways of getting it right. These involve adjusting attitudes, first of all . . . being more realistic and cautious really. Secondly, they involve exerting strict controls on the organisational and operational systems. And this in turn means copying the original as closely as possible. Not merely duplicating the physical characteristics of the factory, but also duplicating the skills that the original employees had. Reliance on a template like this offers the huge advantage of built-in consistency."],"cloze":"<p>Good morning, everyone. In the last few lectures I've been dealing with business finance, but now I'm going to move on to business systems. And in today's lecture I'm going to talk about what can go wrong when businesses try to copy their own <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>.</p><p>Once a business has successfully introduced a new process – managing a branch bank, say, or selling a new product – the parent organisation naturally wants to <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>, and capture it if possible on a bigger scale. The goal, then, is to utilise <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span> and not to generate new knowledge. It's a <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> activity than <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span>, but it actually happens <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span>, as a matter of fact. However, surprisingly, getting things right the second time is not necessarily <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span> than it was the first time.</p><p>Now, there's been a lot of research into how companies can \"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q32\" value=\"C\" data-q=\"32\" onchange=\"setQ(32,this.value)\"><span>related to only a few contexts.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">33</strong> <span>What does the speaker say about consulting experts?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q33\" value=\"A\" data-q=\"33\" onchange=\"setQ(33,this.value)\"><span>Too few managers ever do it.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q33\" value=\"B\" data-q=\"33\" onchange=\"setQ(33,this.value)\"><span>It can be useful in certain circumstances.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q33\" value=\"C\" data-q=\"33\" onchange=\"setQ(33,this.value)\"><span>Experts are sometimes unwilling to give advice.</span></div>                                                                                                                                                    </div>\n " spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"40\" oninput=\"setQ(40,this.value)\"></span> of original employees</li>\n</ul>\n</li>\n</ul>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"https://engnovate.com/wp-content/uploads/2026/06/cambridge-ielts-08-academic-listening-test-3-4.mp3"}],"form":{"url":"https://docs.google.com/forms/d/e/1FAIpQLSfi_gKYiTBEuV8CW68pfTJjf7MVPpMDVNMkjZWy1AjlBfigfQ/formResponse","week":"entry.1893665426","name":"entry.442430322","studentClass":"entry.55126249","d1":"entry.1101074174","i1":"entry.1320743073","d2":"entry.838708618","i2":"entry.950878529","total":"entry.219410480"}};</script><script>let si=0,stage="vocab",scoreSendPromise=null,scoreRetryTimer=null,scoreRetryAttempt=0;
const storageKey=`ielts-nghe-w${DATA.week}`;
function loadState(){try{const value=JSON.parse(localStorage.getItem(storageKey)||"{}");return value&&typeof value==="object"?value:{}}catch{return {}}}
const state=loadState();
const loadedSchemaVersion=state.schemaVersion;
state.q||={};state.g||={};state.scores||={};state.studentName||="";state.studentClass||="";
state.confirmations=loadedSchemaVersion===2&&state.confirmations&&typeof state.confirmations==="object"?state.confirmations:{};

  {key:"1-2",label:()=>`Tuần ${DATA.week} · Sections 1–2`,a:1,b:2},
  {key:"3-4",label:()=>`Tuần ${DATA.week} · Sections 3–4`,a:3,b:4}

function freshSubmission(fingerprint=""){return {status:"idle",fingerprint,sentAt:"",parts:{"1-2":"idle","3-4":"idle"}}}

  const legacySent=value?.status==="sent",parts={};

  return {status:complete?"sent":value?.status==="error"?"error":"idle",fingerprint:String(value?.fingerprint||""),sentAt:complete?String(value?.sentAt||""):"",parts};
}
state.submission=normalizeSubmission(state.submission);
const $=s=>document.querySelector(s);
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"").replace(/[^a-z0-9]+/g," ").trim();

const save=()=>localStorage.setItem(storageKey,JSON.stringify(state));
const scoreKeys=()=>Array.from({length:4},(_,i)=>[`d${i+1}`,`i${i+1}`]).flat();

function clearScoreRetry(){if(scoreRetryTimer){clearTimeout(scoreRetryTimer);scoreRetryTimer=null}}

function currentScoreKey(){return(stage==="dictation"?"d":stage==="ielts"?"i":"")+(si+1)}

function setQ(q,v){state.q[q]=v;invalidateScore(`i${si+1}`);save();gate();scorePanel()}

function setGroup(key,v,box,max){let a=state.q[key]||[];if(box.checked&&!a.includes(v)&&a.length>=max){box.checked=false;return}a=box.checked?[...new Set([...a,v])]:a.filter(x=>x!==v);state.q[key]=a;invalidateScore(`i${si+1}`);save();gate();scorePanel()}
function speak(w){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang="en-GB";speechSynthesis.speak(u)}
function section(){return DATA.sections[si]}

}
function gate(){const b=$("#partSubmit");if(!b)return;const done=complete(),submitted=partConfirmed(currentScoreKey());b.disabled=submitted||!done;b.textContent=submitted?"✓ ĐÃ XÁC NHẬN NỘP PHẦN NÀY":done?"Xác nhận & nộp bài":stage==="dictation"?"Điền đủ 20/20 chỗ để nộp":"Làm đủ 10/10 câu để nộp"}
function vocab(){return `<div class="vocab-grid">${section().vocab.map(v=>`<article class="vocab-card"><button class="sound" onclick='speak(${JSON.stringify(v.word)})'>◖))</button><h3>${v.word}</h3><div class="ipa">${v.ipa}</div><div class="pos">${v.pos}</div><div class="meaning">${v.meaning}</div><p class="example">${v.example}</p><div class="translation">${v.exampleVi}</div></article>`).join("")}</div>`}
function submissionMessage(){
  const fingerprint=scoreFingerprint();
  const current=state.submission.fingerprint===fingerprint,done=current?scoreParts.filter(part=>state.submission.parts?.[part.key]==="sent").length:0;
  if(current&&done===scoreParts.length)return '<div class="result">✓ Đã tự động gửi đủ điểm Sections 1–4 vào sổ lớp.</div>';
  if(current&&state.submission.status==="sending")return `<div class="result">Đang tự động ghi điểm vào sổ lớp${done?` · đã ghi ${done}/2 nhóm`:""}…</div>`;
  if(current&&state.submission.status==="error")return `<div class="result bad">Mạng đang gián đoạn${done?` · đã giữ an toàn ${done}/2 nhóm điểm`:""}. Hệ thống sẽ chỉ tự gửi lại phần còn thiếu.</div>`;
  return '<div class="result">Đủ 8 phần. Hệ thống đang chuẩn bị tự gửi điểm…</div>';
}
function scoreView(){return `<div class="score-view"><h2>Kết quả Tuần ${DATA.week}</h2><div class="student-summary"><span>${state.studentName.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span><span>${state.studentClass}</span></div><div id="scoreGrid" class="score-grid"></div><div id="scoreStatus">${submissionMessage()}</div></div>`}
function restoreInputs(){
  document.querySelectorAll("[data-q]").forEach(el=>{const q=el.dataset.q;if(el.type==="radio")el.checked=state.q[q]===el.value;else el.value=state.q[q]||""});
  document.querySelectorAll("[data-group]").forEach(el=>el.checked=(state.q[el.dataset.group]||[]).includes(el.value));
  document.querySelectorAll("[data-gap]").forEach(el=>el.value=state.g[`${si+1}-${el.dataset.gap}`]||"");

function updateStageTabs(){
  document.querySelectorAll(".stage-tabs button").forEach(b=>{
    b.classList.toggle("on",b.dataset.stage===stage);
    if(b.dataset.stage==="score"){
      b.textContent="D · Kết quả";
      b.disabled=!scoresReady();b.setAttribute("aria-disabled",String(!scoresReady()));
      b.title=scoresReady()?"Xem kết quả":"Hoàn thành và chấm đủ 8 phần để xem kết quả";
    }
  });

function render(){
  if(stage==="score"&&!scoresReady())stage="vocab";
  document.querySelectorAll(".section-tabs button").forEach((b,i)=>b.classList.toggle("on",i===si));updateStageTabs();
  if(stage==="vocab")$("#content").innerHTML=vocab();
  if(stage==="dictation")$("#content").innerHTML=`<div class="workspace"><aside class="audio-side">${audioBox()}</aside><div class="scroll-panel transcript">${section().cloze}</div></div><button id="partSubmit" class="submit" onclick="gradeDict()"></button><div id="result"></div>`;
  if(stage==="ielts")$("#content").innerHTML=`<div class="workspace"><aside class="audio-side">${audioBox()}</aside><div class="scroll-panel">${section().questions}</div></div><button id="partSubmit" class="submit" onclick="gradeIelts()"></button><div id="result"></div>`;
  if(stage==="score")$("#content").innerHTML=scoreView();
  restoreInputs();gate();scorePanel();if(stage==="score"&&scoresReady())void ensureScoresSubmitted();
}
function confirmPart(total,label){return window.confirm(`Em đã làm đủ ${total} ${label}. Xác nhận nộp phần này để chấm điểm và khóa kết quả?`)}
function finishPart(){save();gate();scorePanel();updateStageTabs();void ensureScoresSubmitted();if(scoresReady()){stage="score";render()}}
function gradeDict(){
  if(!complete()||!confirmPart(20,"chỗ chính tả"))return;let ok=0;
  section().clozeAnswers.forEach((a,i)=>{const input=document.querySelector(`[data-gap="${i}"]`),good=norm(state.g[`${si+1}-${i}`])===norm(a);input.classList.toggle("good",good);input.classList.toggle("bad",!good);if(good)ok++});
  const scoreKey=`d${si+1}`;resetSubmission();state.scores[scoreKey]=ok;state.confirmations[scoreKey]=new Date().toISOString();
  $("#result").innerHTML=`<div class="result"><b>${ok}/20</b> · Sai ${20-ok} chỗ. Đáp án đã hiện trực tiếp trên phần sai sau khi nộp.</div>`;
  section().clozeAnswers.forEach((a,i)=>{const input=document.querySelector(`[data-gap="${i}"]`);if(input.classList.contains("bad"))input.value=a});finishPart();
}
function gradeIelts(){
  if(!complete()||!confirmPart(10,"câu IELTS"))return;const [a,b]=range();let ok=0,grouped=new Set();
  for(const [key,nums] of questionGroups()){
    const chosen=state.q[key]||[],valid=new Set(nums.flatMap(q=>DATA.answers[q]).map(norm));
    ok+=chosen.filter(x=>valid.has(norm(x))).length;nums.forEach(q=>grouped.add(q));
    document.querySelectorAll(`[data-group="${key}"]`).forEach(el=>el.closest("td,.question-item,.paper-option")?.classList.add(valid.has(norm(el.value))?"good":"bad"));
  }
  for(let q=a;q<=b;q++){
    if(grouped.has(q))continue;const valid=DATA.answers[q].map(norm),good=valid.includes(norm(state.q[q]));if(good)ok++;
    document.querySelectorAll(`[data-q="${q}"]`).forEach(el=>el.closest("td,.question-item,.paper-option")?.classList.add(good?"good":"bad"));
  }
  const scoreKey=`i${si+1}`;resetSubmission();state.scores[scoreKey]=ok;state.confirmations[scoreKey]=new Date().toISOString();
  $("#result").innerHTML=`<div class="result"><b>${ok}/10</b> · Em làm sai ${10-ok} câu. Hãy nghe lại Section ${si+1} và đối chiếu phần vừa làm.</div>`;finishPart();
}
function scorePanel(){
  const grid=$("#scoreGrid");if(grid)grid.innerHTML=scoreKeys().map(k=>`<div class="score"><small>${k[0]==="d"?"Chính tả":"IELTS"} · Section ${k.slice(1)}</small><br><b>${partConfirmed(k)?state.scores[k]:"—"}/${k[0]==="d"?20:10}</b></div>`).join("");
  updateStageTabs();const status=$("#scoreStatus");if(status)status.innerHTML=submissionMessage();

function scorePayload(label,a,b){
  const p=new URLSearchParams();p.set(DATA.form.week,label);p.set(DATA.form.name,state.studentName.trim());p.set(DATA.form.studentClass,state.studentClass);
  p.set(DATA.form.d1,String(state.scores[`d${a}`]));p.set(DATA.form.i1,String(state.scores[`i${a}`]));p.set(DATA.form.d2,String(state.scores[`d${b}`]));p.set(DATA.form.i2,String(state.scores[`i${b}`]));
  p.set(DATA.form.total,String(state.scores[`d${a}`]+state.scores[`i${a}`]+state.scores[`d${b}`]+state.scores[`i${b}`]));return p;
}
function scheduleScoreRetry(){
  if(scoreRetryTimer||state.submission.status==="sent")return;
  const delays=[5000,15000,30000,60000],delay=delays[Math.min(scoreRetryAttempt,delays.length-1)];scoreRetryAttempt++;
  scoreRetryTimer=setTimeout(()=>{scoreRetryTimer=null;if(scoresReady())void ensureScoresSubmitted()},delay);
}
async function ensureScoresSubmitted(){
  if(!scoresReady()||!state.studentName.trim()||!state.studentClass)return false;
  const fingerprint=scoreFingerprint();
  if(state.submission.fingerprint!==fingerprint)state.submission=freshSubmission(fingerprint);
  if(scoreParts.every(part=>state.submission.parts[part.key]==="sent")){state.submission.status="sent";return true}
  if(scoreSendPromise)return scoreSendPromise;
  clearScoreRetry();state.submission.status="sending";state.submission.sentAt="";save();scorePanel();
  scoreSendPromise=(async()=>{
    try{
      for(const part of scoreParts){
        if(state.submission.parts[part.key]==="sent")continue;
        state.submission.parts[part.key]="sending";save();scorePanel();
        await fetch(DATA.form.url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:scorePayload(part.label(),part.a,part.b).toString()});
        state.submission.parts[part.key]="sent";save();scorePanel();

    }catch{

      state.submission.status="error";state.submission.sentAt="";save();scorePanel();scheduleScoreRetry();return false;
    }
    finally{scoreSendPromise=null}
  })();return scoreSendPromise;
}
$("#sectionTabs").innerHTML=DATA.sections.map((s,i)=>`<button onclick="si=${i};stage='vocab';render()">SECTION ${s.number}<br><small>Questions ${(s.number-1)*10+1}–${s.number*10}</small></button>`).join("");

const entryName=$("#entryName"),entryClass=$("#entryClass"),enterTest=$("#enterTest");entryName.value=state.studentName;entryClass.value=state.studentClass;
function updateEntryGate(){const ready=entryName.value.trim()&&entryClass.value;enterTest.disabled=!ready;enterTest.textContent=ready?"Vào Listening Test":"Nhập họ tên và chọn lớp để vào bài"}
function openTest(){
  const name=entryName.value.trim(),studentClass=entryClass.value;if(!name||!studentClass)return;
  const previousKey=state.studentKey||identityKey(state.studentName,state.studentClass),nextKey=identityKey(name,studentClass);
  if(previousKey&&previousKey!==nextKey){state.q={};state.g={};state.scores={};state.confirmations={};resetSubmission()}
  state.studentName=name;state.studentClass=studentClass;state.studentKey=nextKey;save();$("#entryGate").hidden=true;$("#testApp").hidden=false;render();if(scoresReady())void ensureScoresSubmitted();
}
entryName.oninput=updateEntryGate;entryClass.onchange=updateEntryGate;enterTest.onclick=openTest;entryName.onkeydown=e=>{if(e.key==="Enter"&&!enterTest.disabled)openTest()};
window.addEventListener("online",()=>{clearScoreRetry();if(scoresReady())void ensureScoresSubmitted()});updateEntryGate();render();
</script></body></html>
