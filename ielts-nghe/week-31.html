ong.</p><p>CARLA: OK. And I think we should end by <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>. Maybe we could ask people in the audience. We’ve got people from quite a lot of different places.</p><p>ROB: That’d be interesting, if we have time, yes. So now shall we …</p>","clozeAnswers":["presentations on urban planning","easier to find relevant information","world’s population lives in cities","agriculture and industry tend to spread further inland","more pollutants are discharged into the rivers","brought downstream to the cities","built the drainage channels","whole design was faulty","help with flood prevention","replace the drainage channels","environmentalists have a pretty good idea","principles they’re prepared to abide by","general historical background","wetlands and river estuaries","coastal erosion and so on","New Orleans with flooding","probably enough background","if populations continue to grow","I haven’t got much information","talking about international implications"],"vocab":[{"word":"presentation","ipa":"/ˌprezənˈteɪʃən/","pos":"Danh từ (n)","meaning":"thuyết trình","example":"You should have done most of the reading now, so I’d like you to share your ideas, and talk about the structure of your presentation and what you need to do next.","exampleVi":"Trong câu trên, “presentation” mang nghĩa “thuyết trình”."},{"word":"prevention","ipa":"/pɹɪˈvɛnʃən/","pos":"Danh từ (n)","meaning":"phòng ngừa","example":"But that won’t help with flood prevention now, will it?","exampleVi":"Trong câu trên, “prevention” mang nghĩa “phòng ngừa”."},{"word":"communications","ipa":"/kəˌmjuːnɪˈkeɪʃənz/","pos":"Danh từ (n)","meaning":"hệ thống thông tin liên lạc/truyền thông","example":"It’s all to do with communications and so on.","exampleVi":"Trong câu trên, “communications” mang nghĩa “hệ thống thông tin liên lạc/truyền thông”."},{"word":"decision","ipa":"/dɪˈsɪʒən/","pos":"Danh từ (n)","meaning":"quyết định","example":"But it’s going to be a long time before countries come to a decision on what principles they’re prepared to abide by.","exampleVi":"Trong câu trên, “decision” mang nghĩa “quyết định”."},{"word":"sensible","ipa":"/ˈsen.sə.bl̩/","pos":"Tính từ (adj)","meaning":"hợp lý","example":"Sounds sensible.","exampleVi":"Trong câu trên, “sensible” mang nghĩa “hợp lý”."},{"word":"international","ipa":"/ˌɪntəˈnæʃ(ə)n(ə)l/","pos":"Tính từ (adj)","meaning":"quốc tế","example":"I mean, they’ve got to start acting together at an international level instead of just doing their own thing.","exampleVi":"Trong câu trên, “international” mang nghĩa “quốc tế”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 21-25</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose the correct letter,&nbsp;<strong>A</strong>,&nbsp;<strong>B</strong>&nbsp;or&nbsp;<strong>C</strong>.</p>\n<p>Cities built by the sea</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">21</strong> <span>Carla and Rob were surprised to learn that coastal cities</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q21\" value=\"A\" data-q=\"21\" onchange=\"setQ(21,this.value)\"><span>contain nearly half the world’s population.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q21\" value=\"B\" data-q=\"21\" onchange=\"setQ(21,this.value)\"><span>include most of the world’s largest cities.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q21\" value=\"C\" data-q=\"21\" onchange=\"setQ(21,this.value)\"><span>are growing twice as fast as other cities.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">22</strong> <span>According to Rob, building coastal cities near to rivers</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q22\" value=\"A\" data-q=\"22\" onchange=\"setQ(22,this.value)\"><span>may bring pollution to the cities.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q22\" value=\"B\" data-q=\"22\" onchange=\"setQ(22,this.value)\"><span>may reduce the land available for agriculture.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q22\" value=\"C\" data-q=\"22\" onchange=\"setQ(22,this.value)\"><span>may mean the countryside is spoiled by industry.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">23</strong> <span>What mistake was made when building water drainage channels in Miami in the 1950s?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q23\" value=\"A\" data-q=\"23\" onchange=\"setQ(23,this.value)\"><span>There were not enough for them.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q23\" value=\"B\" data-q=\"23\" onchange=\"setQ(23,this.value)\"><span>They were made of unsuitable materials.</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q23\" value=\"C\" data-q=\"23\" onchange=\"setQ(23,this.value)\"><span>They did not allow for the effects of climate change.</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">24</strong> <span>What do Rob and Carla think that the authorities in Miami should do immediately?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q24\" value=\"A\" data-q=\"24\" onchange=\"setQ(24,this.value)\"><span>take measures to restore ecosystems</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q24\" value=\"B\" data-q=\"24\" onchange=\"setQ(24,this.value)\"><span>pay for a new flood prevention system</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q24\" value=\"C\" data-q=\"24\" onchange=\"setQ(24,this.value)\"><span>stop disposing of waste materials into the ocean</span></div>                                                                                                                                                    </div>\n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">25</strong> <span>What do they agree should be the priority for international action?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input type=\"radio\" name=\"q25\" value=\"A\" data-q=\"25\" onchange=\"setQ(25,this.value)\"><span>greater coordination of activities</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input type=\"radio\" name=\"q25\" value=\"B\" data-q=\"25\" onchange=\"setQ(25,this.value)\"><span>more sharing of information</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input type=\"radio\" name=\"q25\" value=\"C\" data-q=\"25\" onchange=\"setQ(25,this.value)\"><span>agreement on shared policies</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 26-30</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>What decision do the students make about each of the following parts of their presentation?</p>\n<p>Choose&nbsp;<strong>FIVE</strong> answers from the box and write the correct letter, A-G, next to Questions.</p>\n<p><strong>Decisions</strong></p>\n<p><strong>Parts of the presentation</strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                                <div class=\"matching-dnd-questions\"><div class=\"question-item\"> • <span>Historical background</span><span class=\"inline-choice\"><strong class=\"q-number\">26</strong><select data-q=\"26\" onchange=\"setQ(26,this.value)\" aria-label=\"Question 26\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>Geographical factors</span><span class=\"inline-choice\"><strong class=\"q-number\">27</strong><select data-q=\"27\" onchange=\"setQ(27,this.value)\" aria-label=\"Question 27\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>Past mistakes</span><span class=\"inline-choice\"><strong class=\"q-number\">28</strong><select data-q=\"28\" onchange=\"setQ(28,this.value)\" aria-label=\"Question 28\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>Future risks</span><span class=\"inline-choice\"><strong class=\"q-number\">29</strong><select data-q=\"29\" onchange=\"setQ(29,this.value)\" aria-label=\"Question 29\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>International implications</span><span class=\"inline-choice\"><strong class=\"q-number\">30</strong><select data-q=\"30\" onchange=\"setQ(30,this.value)\" aria-label=\"Question 30\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option><option value=\"G\">G</option></select></span></div></div>                                                                        <div class=\"option-bank\"><div><b>A</b> use visuals</div><div><b>B</b> keep it short</div><div><b>C</b> involve other students</div><div><b>D</b> check the information is accurate</div><div><b>E</b> provide a handout</div><div><b>F</b> focus on one example</div><div><b>G</b> do online research</div></div>\n                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>\n                                        </div>","audio":"./audio/test-21/section-3.m4a"},{"number":4,"transcript":["Producing enough energy to meet our needs has become a serious problem. Demand is rising rapidly, because of the world’s increasing population and expanding industry. Burning fossil fuels, like gas, coal and oil, seriously damages the environment and they’ll eventually run out. For a number of years now, scientists have been working out how we can derive energy from renewable sources, such as the sun and wind, without causing pollution. Today I’ll outline marine renewable energy – also called ocean energy – which harnesses the movement of the oceans.","Marine renewable energy can be divided into three main categories: wave energy, tidal energy and ocean thermal energy conversion, and I’ll say a few words about each one.","First, wave energy. Numerous devices have been invented to harvest wave energy, with names such as Wave Dragon, the Penguin and Mighty Whale, and research is going on to try and come up with a really efficient method. This form of energy has plenty of potential, as the source is constant, and there’s no danger of waves coming to a standstill. Electricity can be generated using onshore systems, using a reservoir, or offshore systems. But the problem with ocean waves is that they’re erratic, with the wind making them travel in every direction. This adds to the difficulty of creating efficient technology: ideally all the waves would travel smoothly and regularly along the same straight line. Another drawback is that sand and other sediment on the ocean floor might be stopped from flowing normally, which can lead to environmental problems.","——————————","The second category of marine energy that I’ll mention is tidal energy. One major advantage of using the tide, rather than waves, as a source of energy is that it’s predictable: we know the exact time of high and low tides for years to come.","For tidal energy to be effective, the difference between high and low tides needs to be at least five metres, and this occurs naturally in only about forty places on Earth. But the right conditions can be created by constructing a tidal lagoon, an area of sea water separated from the sea.","One current plan is to create a tidal lagoon on the coast of Wales. This will be an area of water within a bay at Swansea, sheltered by a U-shaped breakwater, or dam, built out from the coast. The breakwater will contain sixteen hydro turbines, and as the tide rises, water rushes through the breakwater, activating the turbines, which turn a generator to produce electricity. Then, for three hours as the tide goes out, the water is held back within the breakwater, increasing the difference in water level, until it’s several metres higher within the lagoon than in the open sea. Then, in order to release the stored water, gates in the breakwater are opened. It pours powerfully out of the lagoon, driving the turbines in the breakwater in the opposite direction and again generating thousands of megawatts of electricity. As there are two high tides a day, this lagoon scheme would generate electricity four times a day, every day, for a total of around 14 hours in every 24 – and enough electricity for over 150,000 homes.","This system has quite a lot in its favour: unlike solar and wind energy it doesn’t depend on the weather; the turbines are operated without the need for fuel, so it doesn’t create any greenhouse gas emissions; and very little maintenance is needed. It’s estimated that electricity generated in this way will be relatively cheap, and that manufacturing the components would create than 2,000 jobs, a big boost to the local economy.","On the other hand, there are fears that lagoons might harm both fish and birds, for example by disturbing migration patterns, and causing a build-up of silt, affecting local ecosystems.","There are other forms of tidal energy, but I’ll go on to the third category of marine energy: ocean thermal energy conversion. This depends on there being a big difference in temperature between surface water and the water a couple of kilometres below the surface, and this occurs in tropical coastal areas. The idea is to bring cold water up to the surface using a submerged pipe. The concept dates back to 1881, when …"],"cloze":"<p>Producing enough energy to meet our needs has become a serious problem. Demand is rising rapidly, because of the world’s <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>. Burning fossil fuels, like gas, coal and oil, <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> and they’ll eventually run out. For a number of years now, scientists have been working out how we can derive energy from renewable sources, such as the sun and wind, without causing pollution. Today I’ll outline marine renewable energy – also called ocean energy – which harnesses the movement of the oceans.</p><p>Marine renewable energy can be divided into three main <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span> and <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span>, and I’ll say a few words about each one.</p><p>First, wave energy. Numerous devices have been invented to harvest wave energy, with names such as Wave Dragon, the Penguin and Mighty Whale, and research is going on to try and come up with a really efficient method. This form of energy has plenty of potential, as the source is constant, and there’s no danger of <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span>. Electricity can be <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span>, using a reservoir, or offshore systems. But the problem with ocean waves is that they’re erratic, with the wind making them travel in every direction. This adds to the <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span>: ideally all the waves would travel smoothly and regularly along the same straight line. Another drawback is that sand and other sediment on the ocean floor might be stopped from flowing normally, which can <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>.</p><p>——————————</p><p>The second category of marine energy that I’ll mention is tidal energy. One major advantage of using the tide, rather than waves, as a source of energy is that it’s predictable: we know the exact time of high and low tides for years to come.</p><p>For tidal energy to be effective, the <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span> needs to be at least five metres, and this occurs naturally in only about forty places on Earth. But the right conditions can be created by <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>, an area of sea water separated from the sea.</p><p>One current plan is to create a tidal lagoon on the coast of Wales. This will be an area of water within a bay at Swansea, sheltered by <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span>. The breakwater will contain <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span>, and as the tide rises, water rushes through the breakwater, activating the turbines, which turn a generator to produce electricity. Then, for three hours as the tide goes out, the water is held back within the breakwater, <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span>, until it’s several metres higher within the lagoon than in the open sea. Then, in order to release the stored water, gates in the breakwater are opened. It pours powerfully out of the lagoon, driving the turbines in the breakwater in the opposite direction and again <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span> of electricity. As there are two high tides a day, this <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span> four times a day, every day, for a total of around 14 hours in every 24 – and enough electricity for over 150,000 homes.</p><p>This system has quite a lot in its favour: unlike solar and wind energy it doesn’t depend on the weather; the turbines are operated without the need for fuel, so it doesn’t <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>; and very little maintenance is needed. It’s estimated that <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> will be relatively cheap, and that manufacturing the components would create than 2,000 jobs, a big boost to the local economy.</p><p>On the other hand, there are fears that lagoons might harm both fish and birds, for example by <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span>, and causing a build-up of silt, affecting local ecosystems.</p><p>There are other forms of tidal energy, but I’ll go on to the third category of marine <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span>. This depends on there being a big difference in temperature between surface water and the water a couple of kilometres below the surface, and this <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>. The idea is to bring cold water up to the surface using a submerged pipe. The concept dates back to 1881, when …</p>","clozeAnswers":["increasing population and expanding industry","seriously damages the environment","categories: wave energy, tidal energy","ocean thermal energy conversion","waves coming to a standstill","generated using onshore systems","difficulty of creating efficient technology","lead to environmental problems","difference between high and low tides","constructing a tidal lagoon","a U-shaped breakwater, or dam, built out from the coast","sixteen hydro turbines","increasing the difference in water level","generating thousands of megawatts","lagoon scheme would generate electricity","create any greenhouse gas emissions","electricity generated in this way","disturbing migration patterns","energy: ocean thermal energy conversion","occurs in tropical coastal areas"],"vocab":[{"word":"electricity","ipa":"/ɪˌlɛkˈtɹɪsɪti/","pos":"Danh từ (n)","meaning":"điện","example":"Electricity can be generated using onshore systems, using a reservoir, or offshore systems.","exampleVi":"Trong câu trên, “electricity” mang nghĩa “điện”."},{"word":"maintenance","ipa":"/ˈmeɪnt(ə)nəns/","pos":"Danh từ (n)","meaning":"bảo trì","example":"This system has quite a lot in its favour: unlike solar and wind energy it doesn’t depend on the weather; the turbines are operated without the need for fuel, so it doesn’t create any greenhouse gas emissions; and very little maintenance is needed.","exampleVi":"Trong câu trên, “maintenance” mang nghĩa “bảo trì”."},{"word":"predictable","ipa":"/pɹɪˈdɪktəbl̩/","pos":"Tính từ (adj)","meaning":"có thể dự đoán được","example":"One major advantage of using the tide, rather than waves, as a source of energy is that it’s predictable: we know the exact time of high and low tides for years to come.","exampleVi":"Trong câu trên, “predictable” mang nghĩa “có thể dự đoán được”."},{"word":"technology","ipa":"/tɛkˈnɒlədʒi/","pos":"Danh từ (n)","meaning":"công nghệ","example":"This adds to the difficulty of creating efficient technology: ideally all the waves would travel smoothly and regularly along the same straight line.","exampleVi":"Trong câu trên, “technology” mang nghĩa “công nghệ”."},{"word":"direction","ipa":"/d(a)ɪˈɹɛk.ʃən/","pos":"Danh từ (n)","meaning":"hướng/phương hướng","example":"But the problem with ocean waves is that they’re erratic, with the wind making them travel in every direction.","exampleVi":"Trong câu trên, “direction” mang nghĩa “hướng/phương hướng”."},{"word":"effective","ipa":"/əˈfɛktɪv/","pos":"Tính từ (adj)","meaning":"hiệu quả","example":"For tidal energy to be effective, the difference between high and low tides needs to be at least five metres, and this occurs naturally in only about forty places on Earth.","exampleVi":"Trong câu trên, “effective” mang nghĩa “hiệu quả”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 31-40</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the notes below.</p>\n<p>Write&nbsp;<strong>ONE WORD ONLY</strong>&nbsp;for each answer.</p>\n<p><strong>Marine renewable energy (ocean energy)</strong></p>\n<p><strong>Introduction</strong></p>\n<p>More energy required because of growth in population and <span class=\"question-item\"><strong class=\"q-number\">31</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"31\" oninput=\"setQ(31,this.value)\"></span></p>\n<p>What’s needed:</p>\n<ul>\n<li>renewable energy sources</li>\n<li>methods that won’t create pollution</li>\n</ul>\n<p><strong>Wave energy</strong></p>\n<p>Advantage: waves provide a <span class=\"question-item\"><strong class=\"q-number\">32</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"32\" oninput=\"setQ(32,this.value)\"></span>&nbsp;source of renewable energy</p>\n<p>Electricity can be generated using offshore or onshore systems</p>\n<p>Onshore systems may use a reservoir</p>\n<p><strong>Problems:</strong></p>\n<ul>\n<li>waves can move in any <span class=\"question-item\"><strong class=\"q-number\">33</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"33\" oninput=\"setQ(33,this.value)\"></span></li>\n<li>movement of sand, etc. on the <span class=\"question-item\"><strong class=\"q-number\">34</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"34\" oninput=\"setQ(34,this.value)\"></span>&nbsp;of the ocean may be affected</li>\n</ul>\n<p><strong>Tidal energy</strong></p>\n<p>Tides are more <span class=\"question-item\"><strong class=\"q-number\">35</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"35\" oninput=\"setQ(35,this.value)\"></span>&nbsp;than waves</p>\n<p>Planned tidal lagoon in Wales:</p>\n<ul>\n<li>will be created in a <span class=\"question-item\"><strong class=\"q-number\">36</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"36\" oninput=\"setQ(36,this.value)\"></span>&nbsp;at Swansea</li>\n<li>breakwater (dam) containing 16 turbines</li>\n<li>rising tide forces water through turbines, generating electricity</li>\n<li>stored water is released through <span class=\"question-item\"><strong class=\"q-number\">37</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"37\" oninput=\"setQ(37,this.value)\"></span>, driving the turbines in the reverse direction</li>\n</ul>\n<p><strong>Advantages:</strong></p>\n<ul>\n<li>not dependent on weather</li>\n<li>no <span class=\"question-item\"><strong class=\"q-number\">38</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"38\" oninput=\"setQ(38,this.value)\"></span>&nbsp;is required to make it work</li>\n<li>likely to create a number of <span class=\"question-item\"><strong class=\"q-number\">39</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"39\" oninput=\"setQ(39,this.value)\"></span></li>\n</ul>\n<p><strong>Problem:</strong></p>\n<ul>\n<li>may harm fish and birds, e.g. by affecting <span class=\"question-item\"><strong class=\"q-number\">40</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"40\" oninput=\"setQ(40,this.value)\"></span>&nbsp;and building up silt</li>\n</ul>\n<p><strong>Ocean thermal energy conversion</strong></p>\n<p>Uses a difference in temperature between the surface and lower levels</p>\n<p>Water brought to the surface in a pipe</p>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-21/section-4.m4a"}],"form":{"url":"https://docs.google.com/forms/d/e/1FAIpQLSfi_gKYiTBEuV8CW68pfTJjf7MVPpMDVNMkjZWy1AjlBfigfQ/formResponse","week":"entry.1893665426","name":"entry.442430322","studentClass":"entry.55126249","d1":"entry.1101074174","i1":"entry.1320743073","d2":"entry.838708618","i2":"entry.950878529","total":"entry.219410480"}};</script><script>const SCHEMA_VERSION=3;
let si=0,stage="vocab",scoreSendPromise=null,scoreRetryTimer=null,scoreRetryAttempt=0;
const storageKey=`ielts-nghe-w${DATA.week}`;
const scoreParts=Object.freeze([
  {key:"1-2",label:()=>`Tuần ${DATA.week} · Sections 1–2`,a:1,b:2},
  {key:"3-4",label:()=>`Tuần ${DATA.week} · Sections 3–4`,a:3,b:4}
]);
function loadState(){try{const value=JSON.parse(localStorage.getItem(storageKey)||"{}");return value&&typeof value==="object"?value:{}}catch{return {}}}
function freshSubmission(fingerprint=""){return {status:"idle",fingerprint,sentAt:"",parts:{"1-2":"idle","3-4":"idle"}}}
function normalizeSubmission(value){
  const parts={};scoreParts.forEach(part=>{const saved=value?.parts?.[part.key];parts[part.key]=saved==="sent"?"sent":saved==="error"?"error":"idle"});
  const complete=scoreParts.every(part=>parts[part.key]==="sent");
  return {status:complete?"sent":value?.status==="error"?"error":"idle",fingerprint:String(value?.fingerprint||""),sentAt:complete?String(value?.sentAt||""):"",parts};
}
function freshFinal(){return {phase:"draft",requestedAt:"",answersFingerprint:"",submittedAt:""}}
const state=loadState(),loadedSchemaVersion=state.schemaVersion;
state.q=state.q&&typeof state.q==="object"?state.q:{};
state.g=state.g&&typeof state.g==="object"?state.g:{};
state.studentName=String(state.studentName||"");state.studentClass=String(state.studentClass||"");
if(loadedSchemaVersion!==SCHEMA_VERSION){
  state.scores={};state.confirmations={};state.review={};state.submission=freshSubmission();state.final=freshFinal();
}else{
  state.scores=state.scores&&typeof state.scores==="object"?state.scores:{};
  state.confirmations=state.confirmations&&typeof state.confirmations==="object"?state.confirmations:{};
  state.review=state.review&&typeof state.review==="object"?state.review:{};
  state.submission=normalizeSubmission(state.submission);
  state.final=state.final&&typeof state.final==="object"?{...freshFinal(),...state.final}:freshFinal();
  if(state.submission.status==="sending")state.submission.status="error";
  if(state.final.phase==="sending")state.final.phase="error";
}
state.schemaVersion=SCHEMA_VERSION;
const $=s=>document.querySelector(s);
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"").replace(/[^a-z0-9]+/g," ").trim();
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");
const identityPart=s=>String(s??"").normalize("NFKC").trim().toLowerCase().replace(/\s+/g," ");
const identityKey=(name,studentClass)=>`${identityPart(name)}|${identityPart(studentClass)}`;
const save=()=>localStorage.setItem(storageKey,JSON.stringify(state));
const scoreKeys=()=>Array.from({length:4},(_,i)=>[`d${i+1}`,`i${i+1}`]).flat();
function answersFingerprint(){return JSON.stringify({week:DATA.week,student:identityKey(state.studentName,state.studentClass),q:state.q,g:state.g})}
const finalRequested=()=>Boolean(state.final?.requestedAt&&state.final?.answersFingerprint&&state.final.answersFingerprint===answersFingerprint());
const finalSubmitted=()=>finalRequested()&&state.final.phase==="submitted"&&state.submission.status==="sent";
const scoresReady=()=>finalRequested()&&scoreKeys().every(key=>Number.isInteger(state.scores[key]));
const scoreFingerprint=()=>JSON.stringify({week:DATA.week,student:identityKey(state.studentName,state.studentClass),requestedAt:state.final.requestedAt,scores:scoreKeys().map(key=>state.scores[key])});
function clearScoreRetry(){if(scoreRetryTimer){clearTimeout(scoreRetryTimer);scoreRetryTimer=null}}
function section(index=si){return DATA.sections[index]}
function range(index=si){return [index*10+1,index*10+10]}
function questionGroupsFor(index=si){
  const groups=new Map();
  for(const match of section(index).questions.matchAll(/data-group="([\d-]+)"/g)){
    const key=match[1];if(!groups.has(key))groups.set(key,key.split("-").map(Number));
  }
  return groups;
}
function dictationComplete(index){return section(index).clozeAnswers.every((_,gap)=>norm(state.g[`${index+1}-${gap}`]))}
function ieltsComplete(index){
  const [first,last]=range(index),grouped=new Set();
  for(const [key,numbers] of questionGroupsFor(index)){if((state.q[key]||[]).length!==numbers.length)return false;numbers.forEach(number=>grouped.add(number))}
  for(let question=first;question<=last;question++){if(!grouped.has(question)&&!norm(state.q[question]))return false}
  return true;
}
function currentComplete(){return stage==="dictation"?dictationComplete(si):stage==="ielts"?ieltsComplete(si):true}
function allResponsesComplete(){return DATA.sections.every((_,index)=>dictationComplete(index)&&ieltsComplete(index))}
function completedPartCount(){return DATA.sections.reduce((count,_,index)=>count+Number(dictationComplete(index))+Number(ieltsComplete(index)),0)}
function draftProgressText(){return `Đã điền đủ ${completedPartCount()}/8 phần. Điểm và đáp án chỉ mở sau khi em bấm xác nhận nộp toàn bài.`}
function setQ(question,value){if(finalRequested())return;state.q[question]=value;save();refreshDraftUi()}
function setGap(gap,value){if(finalRequested())return;state.g[`${si+1}-${gap}`]=value;save();refreshDraftUi()}
function setGroup(key,value,box,max){
  if(finalRequested()){box.checked=!box.checked;return}
  let values=state.q[key]||[];
  if(box.checked&&!values.includes(value)&&values.length>=max){box.checked=false;return}
  values=box.checked?[...new Set([...values,value])]:values.filter(item=>item!==value);state.q[key]=values;save();refreshDraftUi();
}
function speak(word){speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(word);utterance.lang="en-GB";speechSynthesis.speak(utterance)}
function sectionAudioUrl(){
  const raw=String(section().audio||"").trim();if(!raw)return "";
  try{const url=new URL(raw,window.location.href);return url.origin===window.location.origin&&/\.(?:mp3|m4a)$/i.test(url.pathname)?url.href:""}catch{return ""}
}
function formatAudioDuration(seconds){
  if(!Number.isFinite(seconds)||seconds<=0)return "";
  const total=Math.round(seconds),hours=Math.floor(total/3600),minutes=Math.floor(total%3600/60),secs=String(total%60).padStart(2,"0");
  return hours?`${hours}:${String(minutes).padStart(2,"0")}:${secs}`:`${minutes}:${secs}`;
}
function setAudioStatus(message,{error=false,retry=false}={}){const status=$("#audioStatus"),button=$("#audioRetry");if(status){status.textContent=message;status.classList.toggle("bad",error)}if(button)button.hidden=!retry}
function retryAudio(){const audio=$("#sectionAudio"),url=audio?.dataset.audioUrl;if(!audio||!url)return;setAudioStatus("Đang tải lại audio…");audio.pause();audio.src=url;audio.load()}
function initAudioPlayer(){
  const audio=$("#sectionAudio"),url=audio?.dataset.audioUrl;if(!audio||!url){setAudioStatus("Audio chưa được cấu hình đúng. Vui lòng báo giáo viên.",{error:true});return}
  const ready=()=>setAudioStatus(`Audio sẵn sàng${formatAudioDuration(audio.duration)?` · ${formatAudioDuration(audio.duration)}`:""}`);
  const failed=()=>{console.error("[IELTS Listening] Không tải được audio",{week:DATA.week,section:si+1,url,errorCode:audio.error?.code||0});setAudioStatus("Không tải được audio. Kiểm tra kết nối rồi bấm “Thử lại”.",{error:true,retry:true})};
  audio.addEventListener("loadstart",()=>setAudioStatus("Đang tải audio…"));audio.addEventListener("loadedmetadata",ready);audio.addEventListener("canplay",ready);audio.addEventListener("stalled",()=>setAudioStatus("Audio đang tải chậm. Vui lòng chờ hoặc bấm “Thử lại”.",{retry:true}));audio.addEventListener("error",failed);$("#audioRetry").onclick=retryAudio;
  if(audio.error)failed();else if(audio.readyState>=1)ready();else setAudioStatus("Đang tải audio…");
}
function audioBox(){const url=sectionAudioUrl();return `<b>● AUDIO GỐC · SECTION ${si+1}</b><audio id="sectionAudio" controls preload="metadata" src="${esc(url)}" data-audio-url="${esc(url)}" aria-describedby="audioStatus"></audio><div id="audioStatus" class="audio-status" role="status" aria-live="polite">Đang tải audio…</div><button id="audioRetry" class="audio-retry" type="button" hidden>Thử lại audio</button>`}
function vocab(){return `<div class="vocab-grid">${section().vocab.map(item=>`<article class="vocab-card"><button class="sound" type="button" onclick='speak(${JSON.stringify(item.word)})'>◖))</button><h3>${item.word}</h3><div class="ipa">${item.ipa}</div><div class="pos">${item.pos}</div><div class="meaning">${item.meaning}</div><p class="example">${item.example}</p><div class="translation">${item.exampleVi}</div></article>`).join("")}</div>`}
function restoreInputs(){
  document.querySelectorAll("[data-q]").forEach(element=>{const question=element.dataset.q;if(element.type==="radio")element.checked=state.q[question]===element.value;else element.value=state.q[question]||""});
  document.querySelectorAll("[data-group]").forEach(element=>element.checked=(state.q[element.dataset.group]||[]).includes(element.value));
  document.querySelectorAll("[data-gap]").forEach(element=>element.value=state.g[`${si+1}-${element.dataset.gap}`]||"");
  if(finalRequested())document.querySelectorAll("#content input,#content select").forEach(control=>control.disabled=true);
}
function updateStageTabs(){
  document.querySelectorAll(".stage-tabs button").forEach(button=>{
    button.classList.toggle("on",button.dataset.stage===stage);
    if(button.dataset.stage==="score"){
      button.textContent=finalSubmitted()?"D · Kết quả":"D · Nộp bài";button.disabled=false;
      button.title=allResponsesComplete()||finalRequested()?"Xác nhận nộp bài hoặc xem trạng thái":"Xem tiến độ hoàn thành toàn bài";
    }
  });
}
function partProgressView(){
  const done=currentComplete();
  if(finalRequested())return `<div class="result">Bài đã khóa sau khi xác nhận nộp. Xem trạng thái và đáp án tại mục D.</div>`;
  return `<div id="partProgress" class="result ${done?"good":""}">${done?"✓ Phần này đã điền đủ. Hãy tiếp tục hoàn thành các phần còn lại.":stage==="dictation"?"Điền đủ 20/20 chỗ. Hệ thống chỉ lưu nháp, không tự nộp.":"Làm đủ 10/10 câu. Hệ thống chỉ lưu nháp, không tự nộp."}<br><small>${draftProgressText()}</small></div>`;
}
function answerKeyView(){
  return DATA.sections.map((item,index)=>{
    const dictation=section(index).clozeAnswers.map((answer,gap)=>`<div><b>${gap+1}.</b> ${esc(answer)}</div>`).join("");
    const [first,last]=range(index),ielts=[],grouped=new Set();
    for(const [,numbers] of questionGroupsFor(index)){
      const valid=[...new Set(numbers.flatMap(question=>DATA.answers[question]||[]))];
      ielts.push(`<div><b>${numbers.join("–")}.</b> ${valid.map(esc).join(", ")}</div>`);numbers.forEach(question=>grouped.add(question));
    }
    for(let question=first;question<=last;question++)if(!grouped.has(question))ielts.push(`<div><b>${question}.</b> ${(DATA.answers[question]||[]).map(esc).join(" / ")}</div>`);
    return `<details><summary>Section ${index+1} · Chính tả ${state.scores[`d${index+1}`]}/20 · IELTS ${state.scores[`i${index+1}`]}/10</summary><div class="answer-review"><strong>Đáp án chính tả</strong>${dictation}<strong>Đáp án IELTS</strong>${ielts.join("")}</div></details>`;
  }).join("");
}
function scoreGridView(){return `<div class="score-grid">${scoreKeys().map(key=>`<div class="score"><small>${key[0]==="d"?"Chính tả":"IELTS"} · Section ${key.slice(1)}</small><br><b>${state.scores[key]}/${key[0]==="d"?20:10}</b></div>`).join("")}</div>`}
function submissionMessage(){
  if(!finalRequested())return "Bài vẫn đang ở trạng thái nháp.";
  const fingerprint=scoreFingerprint(),current=state.submission.fingerprint===fingerprint,done=current?scoreParts.filter(part=>state.submission.parts?.[part.key]==="sent").length:0;
  if(finalSubmitted())return "✓ Điểm đã được tự động ghi vào sổ lớp. Đáp án đã mở bên dưới.";
  if(current&&state.submission.status==="sending")return `Đang tự động ghi điểm vào sổ lớp${done?` · đã ghi ${done}/2 nhóm`:""}…`;
  if(current&&state.submission.status==="error")return `Mạng đang gián đoạn${done?` · đã giữ an toàn ${done}/2 nhóm điểm`:""}. Hệ thống sẽ tự gửi lại phần còn thiếu.`;
  return "Đang chuẩn bị ghi điểm vào sổ lớp…";
}
function finalView(){
  const completed=completedPartCount(),ready=allResponsesComplete();
  if(!finalRequested())return `<div class="score-view"><h2>Xác nhận nộp toàn bài</h2><div class="student-summary"><span>${esc(state.studentName)}</span><span>${esc(state.studentClass)}</span></div><div class="result">${draftProgressText()}</div><button id="finalSubmit" class="submit" type="button" ${ready?"":"disabled"} onclick="finalizeSubmission(event)">${ready?"XÁC NHẬN ĐÃ LÀM XONG & GHI ĐIỂM":`HOÀN THÀNH ĐỦ 8/8 PHẦN (${completed}/8)`}</button><p>Chỉ nút này mới chấm bài và gửi điểm. Nhập câu cuối không tự nộp.</p></div>`;
  if(!finalSubmitted())return `<div class="score-view"><h2>Đang ghi điểm</h2><div class="student-summary"><span>${esc(state.studentName)}</span><span>${esc(state.studentClass)}</span></div><div id="scoreStatus" class="result">${submissionMessage()}</div>${state.submission.status==="error"?'<button class="submit" type="button" onclick="resumeFinalSubmission()">THỬ GỬI LẠI ĐIỂM</button>':""}<p>Bài đã khóa. Đáp án sẽ mở ngay sau khi hệ thống ghi điểm xong.</p></div>`;
  const total=scoreKeys().reduce((sum,key)=>sum+state.scores[key],0);
  return `<div class="score-view"><h2>Kết quả Tuần ${DATA.week}</h2><div class="student-summary"><span>${esc(state.studentName)}</span><span>${esc(state.studentClass)}</span></div><div id="scoreStatus" class="result">${submissionMessage()}<br><b>Tổng điểm: ${total}/120</b></div>${scoreGridView()}<h3>Đáp án toàn bài</h3>${answerKeyView()}</div>`;
}
function refreshDraftUi(){
  updateStageTabs();const progress=$("#partProgress");if(progress&&!finalRequested())progress.outerHTML=partProgressView();
  if(stage==="score"&&!finalRequested()){const content=$("#content");if(content)content.innerHTML=finalView()}
}
function render(){
  document.querySelectorAll(".section-tabs button").forEach((button,index)=>button.classList.toggle("on",index===si));updateStageTabs();
  if(stage==="vocab")$("#content").innerHTML=vocab();
  if(stage==="dictation")$("#content").innerHTML=`<div class="workspace"><aside class="audio-side">${audioBox()}</aside><div class="scroll-panel transcript">${section().cloze}</div></div>${partProgressView()}`;
  if(stage==="ielts")$("#content").innerHTML=`<div class="workspace"><aside class="audio-side">${audioBox()}</aside><div class="scroll-panel">${section().questions}</div></div>${partProgressView()}`;
  if(stage==="score")$("#content").innerHTML=finalView();
  restoreInputs();if(stage==="dictation"||stage==="ielts")initAudioPlayer();
}
function gradeAllResponses(){
  const scores={},review={};
  DATA.sections.forEach((item,index)=>{
    let dictationScore=0;item.clozeAnswers.forEach((answer,gap)=>{if(norm(state.g[`${index+1}-${gap}`])===norm(answer))dictationScore++});scores[`d${index+1}`]=dictationScore;
    const [first,last]=range(index),grouped=new Set();let ieltsScore=0;
    for(const [key,numbers] of questionGroupsFor(index)){
      const chosen=state.q[key]||[],valid=new Set(numbers.flatMap(question=>DATA.answers[question]||[]).map(norm));ieltsScore+=chosen.filter(value=>valid.has(norm(value))).length;numbers.forEach(question=>grouped.add(question));
    }
    for(let question=first;question<=last;question++){if(grouped.has(question))continue;if((DATA.answers[question]||[]).map(norm).includes(norm(state.q[question])))ieltsScore++}
    scores[`i${index+1}`]=ieltsScore;review[`s${index+1}`]={dictationScore,ieltsScore};
  });
  return {scores,review};
}
async function finalizeSubmission(event){
  event?.preventDefault();event?.stopPropagation();
  if(!event?.isTrusted||finalRequested()||!allResponsesComplete())return false;
  if(!window.confirm("Em xác nhận đã làm xong toàn bộ bài. Hệ thống sẽ khóa câu trả lời, ghi điểm vào sổ lớp rồi mới mở đáp án. Em có chắc chắn nộp bài?"))return false;
  const requestedAt=new Date().toISOString(),fingerprint=answersFingerprint(),graded=gradeAllResponses();
  state.scores=graded.scores;state.review=graded.review;state.confirmations=Object.fromEntries(scoreKeys().map(key=>[key,requestedAt]));state.final={phase:"sending",requestedAt,answersFingerprint:fingerprint,submittedAt:""};state.submission=freshSubmission();save();stage="score";render();
  await resumeFinalSubmission();return true;
}
function scorePayload(label,a,b){
  const payload=new URLSearchParams();payload.set(DATA.form.week,label);payload.set(DATA.form.name,state.studentName.trim());payload.set(DATA.form.studentClass,state.studentClass);
  payload.set(DATA.form.d1,String(state.scores[`d${a}`]));payload.set(DATA.form.i1,String(state.scores[`i${a}`]));payload.set(DATA.form.d2,String(state.scores[`d${b}`]));payload.set(DATA.form.i2,String(state.scores[`i${b}`]));payload.set(DATA.form.total,String(state.scores[`d${a}`]+state.scores[`i${a}`]+state.scores[`d${b}`]+state.scores[`i${b}`]));return payload;
}
function scheduleScoreRetry(){
  if(scoreRetryTimer||finalSubmitted()||!finalRequested())return;
  const delays=[5000,15000,30000,60000],delay=delays[Math.min(scoreRetryAttempt,delays.length-1)];scoreRetryAttempt++;
  scoreRetryTimer=setTimeout(()=>{scoreRetryTimer=null;if(finalRequested()&&!finalSubmitted())void resumeFinalSubmission()},delay);
}
async function ensureScoresSubmitted(){
  if(!finalRequested()||!scoresReady()||!state.studentName.trim()||!state.studentClass)return false;
  const fingerprint=scoreFingerprint();if(state.submission.fingerprint!==fingerprint)state.submission=freshSubmission(fingerprint);
  if(scoreParts.every(part=>state.submission.parts[part.key]==="sent")){state.submission.status="sent";state.final.phase="submitted";state.final.submittedAt=state.submission.sentAt||new Date().toISOString();save();return true}
  if(scoreSendPromise)return scoreSendPromise;
  clearScoreRetry();state.submission.status="sending";state.final.phase="sending";save();
  scoreSendPromise=(async()=>{
    try{
      for(const part of scoreParts){
        if(state.submission.parts[part.key]==="sent")continue;state.submission.parts[part.key]="sending";save();
        await fetch(DATA.form.url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:scorePayload(part.label(),part.a,part.b).toString()});
        state.submission.parts[part.key]="sent";save();
      }
      state.submission.status="sent";state.submission.sentAt=new Date().toISOString();state.final.phase="submitted";state.final.submittedAt=state.submission.sentAt;scoreRetryAttempt=0;save();return true;
    }catch{
      scoreParts.forEach(part=>{if(state.submission.parts[part.key]==="sending")state.submission.parts[part.key]="error"});state.submission.status="error";state.final.phase="error";save();scheduleScoreRetry();return false;
    }finally{scoreSendPromise=null}
  })();return scoreSendPromise;
}
async function resumeFinalSubmission(){
  if(!finalRequested()||finalSubmitted())return finalSubmitted();const sent=await ensureScoresSubmitted();if(stage==="score")render();return sent;
}
function selectSection(index){si=index;stage="vocab";render()}
$("#sectionTabs").innerHTML=DATA.sections.map((item,index)=>`<button type="button" onclick="selectSection(${index})">SECTION ${item.number}<br><small>Questions ${(item.number-1)*10+1}–${item.number*10}</small></button>`).join("");
document.querySelectorAll(".stage-tabs button").forEach(button=>{button.type="button";button.onclick=()=>{stage=button.dataset.stage;render()}});
const entryName=$("#entryName"),entryClass=$("#entryClass"),enterTest=$("#enterTest");entryName.value=state.studentName;entryClass.value=state.studentClass;enterTest.type="button";
function updateEntryGate(){const ready=entryName.value.trim()&&entryClass.value;enterTest.disabled=!ready;enterTest.textContent=ready?"Vào Listening Test":"Nhập họ tên và chọn lớp để vào bài"}
function resetForStudent(name,studentClass){state.q={};state.g={};state.scores={};state.confirmations={};state.review={};state.submission=freshSubmission();state.final=freshFinal();state.studentName=name;state.studentClass=studentClass;state.studentKey=identityKey(name,studentClass);state.schemaVersion=SCHEMA_VERSION}
function openTest(){
  const name=entryName.value.trim(),studentClass=entryClass.value;if(!name||!studentClass)return;
  const nextKey=identityKey(name,studentClass),previousKey=state.studentKey||identityKey(state.studentName,state.studentClass);if(previousKey&&previousKey!==nextKey)resetForStudent(name,studentClass);else{state.studentName=name;state.studentClass=studentClass;state.studentKey=nextKey}
  save();$("#entryGate").hidden=true;$("#testApp").hidden=false;render();if(finalRequested()&&!finalSubmitted())void resumeFinalSubmission();
}
entryName.oninput=updateEntryGate;entryClass.onchange=updateEntryGate;enterTest.onclick=openTest;entryName.onkeydown=event=>{if(event.key==="Enter"&&!enterTest.disabled)openTest()};
document.addEventListener("keydown",event=>{if(event.key==="Enter"&&event.target.matches("#content input"))event.preventDefault()});
window.addEventListener("online",()=>{clearScoreRetry();if(finalRequested()&&!finalSubmitted())void resumeFinalSubmission()});updateEntryGate();save();render();
</script></body></html>
