</style></head><body><section id="entryGate" class="entry-screen"><div class="entry-card"><header class="entry-head"><small>IELTS - NGHE · TUẦN 31</small><h1>Listening Test 21</h1><p>Điền thông tin học sinh trước khi vào bài.</p></header><div class="entry-body"><p class="entry-note">Họ tên và lớp sẽ được giữ lại để gửi điểm sau khi hoàn thành bài.</p><label for="entryName">Họ và tên học sinh</label><input id="entryName" type="text" autocomplete="name" placeholder="Nhập đầy đủ họ và tên"><label for="entryClass">Lớp IELTS</label><select id="entryClass"><option value="">Chọn lớp IELTS</option><option>IELTS 40</option><option>IELTS 41</option><option>IELTS 42</option><option>IELTS 43</option><option>IELTS 44</option><option>IELTS 45</option><option>IELTS 46</option><option>IELTS 47</option><option>IELTS 48</option><option>IELTS 49</option><option>IELTS 50</option><option>IELTS 51</option><option>IELTS 52</option><option>IELTS 53</option></select><button id="enterTest" type="button" disabled>Nhập họ tên và chọn lớp để vào bài</button></div></div></section><div id="testApp" hidden><header class="hero"><small>IELTS - NGHE · TUẦN 31</small><h1>Listening Test 21</h1><p>Full Test · Sections 1–4 · 40 questions</p></header><main class="shell"><nav id="sectionTabs" class="section-tabs"></nav><nav class="stage-tabs"><button type="button" data-stage="vocab">A · Từ vựng cần lưu ý</button><button type="button" data-stage="dictation">B · Điền chính tả</button><button type="button" data-stage="ielts">C · Câu hỏi IELTS</button><button type="button" data-stage="score">D · Nộp bài</button></nav><section id="content" class="lesson"></section></main></div><script>const DATA={"week":31,"test":21,"sourceRef":"Cambridge IELTS 14 Academic Listening Test 1","answers":{"1":["Canadian"],"2":["furniture"],"3":["Park"],"4":["250","250 sterling"],"5":["phone"],"6":["10 September","September 10","10th September","September 10th"],"7":["museum"],"8":["time"],"9":["blond","blonde"],"10":["87954 82361","8795482361"],"11":["A","C"],"12":["A","C"],"13":["B","E"],"14":["B","E"],"15":["B"],"16":["B"],"17":["C"],"18":["A"],"19":["A"],"20":["C"],"21":["B"],"22":["A"],"23":["C"],"24":["B"],"25":["A"],"26":["B"],"27":["A"],"28":["F"],"29":["G"],"30":["C"],"31":["industry"],"32":["constant"],"33":["direction"],"34":["floor"],"35":["predictable"],"36":["bay"],"37":["gates"],"38":["fuel"],"39":["jobs"],"40":["migration"]},"sections":[{"number":1,"transcript":["OFFICER: Good morning. What can I do for you?","LOUISE: I want to report a theft. I had some things stolen out of my bag yesterday.","OFFICER: I’m sorry to hear that. Right, so I’ll need to take a few details. Can I start with your name?","LOUISE: Louise Taylor.","OFFICER: OK, thank you. And are you resident in the UK?","LOUISE: No, I’m actually Canadian. Though my mother was British.","OFFICER: And your date of birth?","LOUISE: December 14th, 1977.","OFFICER: So you’re just visiting this country?","LOUISE: That’s right. I come over most summers on business. I’m an interior designer and I come over to buy old furniture, antiques you know. There are some really lovely things around here, but you need to get out to the small towns. I’ve had a really good trip this year, until this happened.","OFFICER: OK. So you’ve been here quite a while?","LOUISE: Yes, I’m here for two months. I go back next week.","OFFICER: So may I ask where you’re staying now?","LOUISE: Well at present I’ve got a place at Park Apartments, that’s on King Street. I was staying at the Riverside Apartments on the same street, but the apartment there was only available for six weeks so I had to find another one.","OFFICER: OK. And the apartment number?","LOUISE: Fifteen.","LOUISE: Right.","…………………………………………..","OFFICER: Now, I need to take some details of the theft. So you said you had some things stolen out of your bag?","LOUISE: That’s right.","OFFICER: And were you actually carrying the bag when the theft took place?","LOUISE: Yes, I really can’t understand it. I had my backpack on. And I went into a supermarket to buy a few things and when I opened it up my wallet wasn’t there.","OFFICER: And what did your wallet have in it?","LOUISE: Well, fortunately I don’t keep my credit cards in that wallet – I keep them with my passport in an inside compartment in my backpack. But there was quite a bit of cash there … about £250 sterling, I should think. I withdrew £300 from my account yesterday, but I did a bit of shopping, so I must have already spent about £50 of that.","OFFICER: OK.","LOUISE: At first I thought, oh I must have left the wallet back in the apartment, but then I realised my phone had gone as well. It was only a week old, and that’s when I realised I’d been robbed. Anyway at least they didn’t take the keys to my rental car.","OFFICER: Yes. So you say the theft occurred yesterday?","LOUISE: Yes.","OFFICER: So that was September the tenth. And do you have any idea at all of where or when the things might possibly have been stolen?","LOUISE: Well at first I couldn’t believe it because the bag had been on my back ever since I left the apartment after lunch. It’s just a small backpack, but I generally use it when I’m travelling because it seems safer than a handbag. Anyway, I met up with a friend, and we spent a couple of hours in the museum. But I do remember that as we were leaving there, at about 4 o’clock, a group of young boys ran up to us, and they were really crowding round us, and they were asking us that time it was, then all of a sudden they ran off.","OFFICER: Can you remember anything about them?","LOUISE: The one who did most of the talking was wearing a T-shirt with a picture of something … let’s see … a tiger.","OFFICER: Right. Any idea of how old he might have been?","LOUISE: Around twelve years old?","OFFICER: And can you remember anything else about his appearance?","LOUISE: Not much. He was quite thin …","OFFICER: Colour of hair?","LOUISE: I do remember that – he was blond. All the others were dark-haired.","OFFICER: And any details of the others?","LOUISE: Not really. They came and went so quickly.","OFFICER: Right. So what I’m going to do now is give you a crime reference number so you can contact your insurance company. So this is ten digits: 87954 82361.","LOUISE: Thank you. So should I …"],"cloze":"<p>OFFICER: Good morning. What can I do for you?</p><p>LOUISE: I want to report a theft. I had some things stolen out of <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>.</p><p>OFFICER: I’m sorry to hear that. Right, so I’ll need to take a few details. Can I start with your name?</p><p>LOUISE: Louise Taylor.</p><p>OFFICER: OK, thank you. And are you resident in the UK?</p><p>LOUISE: No, <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span>. Though my mother was British.</p><p>OFFICER: And your date of birth?</p><p>LOUISE: December 14th, 1977.</p><p>OFFICER: So you’re just visiting this country?</p><p>LOUISE: That’s right. I come over most summers on business. <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span> and I come over to <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> you know. There are some really lovely things around here, but you need to get out to the small towns. I’ve had a really good trip this year, until this happened.</p><p>OFFICER: OK. So you’ve been here quite a while?</p><p>LOUISE: Yes, I’m here for two months. I go back next week.</p><p>OFFICER: So may I <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> now?</p><p>LOUISE: Well at present I’ve got a place at Park Apartments, that’s on King Street. I was <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span> on the same street, but the apartment there was only available for six weeks so I had to find another one.</p><p>OFFICER: OK. And <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span>?</p><p>LOUISE: Fifteen.</p><p>LOUISE: Right.</p><p>…………………………………………..</p><p>OFFICER: Now, I need to take some details of the theft. So you said you had some things stolen out of your bag?</p><p>LOUISE: That’s right.</p><p>OFFICER: And were you <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span> when the theft took place?</p><p>LOUISE: Yes, I really can’t understand it. I had my backpack on. And I <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span> to buy a few things and when I opened it up my wallet wasn’t there.</p><p>OFFICER: And what did your wallet have in it?</p><p>LOUISE: Well, fortunately I don’t keep my credit cards in that wallet – I keep them with my passport in an <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span>. But there was quite a bit of cash there … about £250 sterling, I should think. I withdrew £300 from <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span>, but I did a bit of shopping, so I must have already spent about £50 of that.</p><p>OFFICER: OK.</p><p>LOUISE: At first I thought, oh I must have left the <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span>, but then I realised my phone had gone as well. It was only a week old, and that’s when I realised I’d been robbed. Anyway at least they didn’t take the keys to my rental car.</p><p>OFFICER: Yes. So you say the <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span>?</p><p>LOUISE: Yes.</p><p>OFFICER: So that was September the tenth. And do you have any idea at all of where or when the things might possibly have been stolen?</p><p>LOUISE: Well at first I couldn’t believe it because the bag had been on my back ever since I left the apartment after lunch. It’s just a small <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span> it when I’m <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span> than a handbag. Anyway, I met up with a friend, and we spent a couple of hours in the museum. But I do remember that as we were leaving there, at about 4 o’clock, a group of young boys ran up to us, and they were really <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>, and they were asking us that time it was, then all of a sudden they ran off.</p><p>OFFICER: Can you remember anything about them?</p><p>LOUISE: The one who did most of the talking was wearing a T-shirt with a <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span> … let’s see … a tiger.</p><p>OFFICER: Right. Any idea of how old he might have been?</p><p>LOUISE: Around twelve years old?</p><p>OFFICER: And can you <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span> about his appearance?</p><p>LOUISE: Not much. He was quite thin …</p><p>OFFICER: Colour of hair?</p><p>LOUISE: I do remember that – he was blond. All the <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span>.</p><p>OFFICER: And any details of the others?</p><p>LOUISE: Not really. They came and went so quickly.</p><p>OFFICER: Right. So what I’m going to do now is give you a crime reference number so you can <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span>. So this is ten digits: 87954 82361.</p><p>LOUISE: Thank you. So should I …</p>","clozeAnswers":["my bag yesterday","I’m actually Canadian","I’m an interior designer","buy old furniture, antiques","ask where you’re staying","staying at the Riverside Apartments","the apartment number","actually carrying the bag","went into a supermarket","inside compartment in my backpack","my account yesterday","wallet back in the apartment","theft occurred yesterday","backpack, but I generally use","travelling because it seems safer","crowding round us","picture of something","remember anything else","others were dark-haired","contact your insurance company"],"vocab":[{"word":"apartment","ipa":"/əˈpɑːt.mənt/","pos":"Danh từ (n)","meaning":"căn hộ","example":"I was staying at the Riverside Apartments on the same street, but the apartment there was only available for six weeks so I had to find another one.","exampleVi":"Trong câu trên, “apartment” mang nghĩa “căn hộ”."},{"word":"available","ipa":"/əˈveɪləb(ə)l/","pos":"Tính từ (adj)","meaning":"có sẵn","example":"I was staying at the Riverside Apartments on the same street, but the apartment there was only available for six weeks so I had to find another one.","exampleVi":"Trong câu trên, “available” mang nghĩa “có sẵn”."},{"word":"insurance","ipa":"/ɪn.ˈʃɔː.ɹəns/","pos":"Danh từ (n)","meaning":"bảo hiểm","example":"So what I’m going to do now is give you a crime reference number so you can contact your insurance company.","exampleVi":"Trong câu trên, “insurance” mang nghĩa “bảo hiểm”."},{"word":"reference","ipa":"/ˈɹɛf.(ə)ɹəns/","pos":"Danh từ (n)","meaning":"mã tham chiếu","example":"So what I’m going to do now is give you a crime reference number so you can contact your insurance company.","exampleVi":"Trong câu trên, “reference” mang nghĩa “mã tham chiếu”."},{"word":"fortunately","ipa":"/ˈfɔːt͡ʃənɪtli/","pos":"Trạng từ (adv)","meaning":"may mắn thay","example":"Well, fortunately I don’t keep my credit cards in that wallet – I keep them with my passport in an inside compartment in my backpack.","exampleVi":"Trong câu trên, “fortunately” mang nghĩa “may mắn thay”."},{"word":"generally","ipa":"/d͡ʒɛn.əɹ.ə.li/","pos":"Trạng từ (adv)","meaning":"thường là","example":"It’s just a small backpack, but I generally use it when I’m travelling because it seems safer than a handbag.","exampleVi":"Trong câu trên, “generally” mang nghĩa “thường là”."}],"questions":"<div class=\"exam-section\">                                        <h2 class=\"question-range\">Questions 1-10</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <div class=\"ielts-listening-section-content-wrapper\"><p>Complete the form below.</p>\n<p>Write&nbsp;<strong>ONE WORD AND/OR A NUMBER</strong>&nbsp;for each answer.</p>\n<p><strong>CRIME REPORT FORM</strong></p>\n<p><strong>Type of crime</strong>:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; theft</p>\n<p><strong>Personal information</strong></p>\n<p><em>Example</em></p>\n<p>Name&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; Louise …<em>Taylor</em>…</p>\n<p>Nationality&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<span class=\"question-item\"><strong class=\"q-number\">1</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"1\" oninput=\"setQ(1,this.value)\"></span></p>\n<p>Date of birth&nbsp; &nbsp; &nbsp; &nbsp; 14 December 1977</p>\n<p>Occupation&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;interior designer</p>\n<p>Reason for visit&nbsp; &nbsp; business (to buy antique <span class=\"question-item\"><strong class=\"q-number\">2</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"2\" oninput=\"setQ(2,this.value)\"></span>)</p>\n<p>Length of stay&nbsp; &nbsp; &nbsp; &nbsp;two months</p>\n<p>Current address&nbsp; &nbsp; <span class=\"question-item\"><strong class=\"q-number\">3</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"3\" oninput=\"setQ(3,this.value)\"></span>Apartments (No 15)</p>\n<p><strong>Details of theft</strong></p>\n<p>Items stolen&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;– a wallet containing approximately £<span class=\"question-item\"><strong class=\"q-number\">4</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"4\" oninput=\"setQ(4,this.value)\"></span></p>\n<p>– a <span class=\"question-item\"><strong class=\"q-number\">5</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"5\" oninput=\"setQ(5,this.value)\"></span></p>\n<p>Date of theft&nbsp; &nbsp; &nbsp; &nbsp; <span class=\"question-item\"><strong class=\"q-number\">6</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"6\" oninput=\"setQ(6,this.value)\"></span></p>\n<p><strong>Possible time and place of theft</strong></p>\n<p>Location&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; outside the <span class=\"question-item\"><strong class=\"q-number\">7</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"7\" oninput=\"setQ(7,this.value)\"></span>&nbsp;at about 4 pm</p>\n<p>Details of suspect&nbsp; &nbsp; &nbsp; – some boys asked for the <span class=\"question-item\"><strong class=\"q-number\">8</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"8\" oninput=\"setQ(8,this.value)\"></span>&nbsp;then ran off</p>\n<p>– one had a T-shirt with a picture of a tiger</p>\n<p>– he was about 12, slim build with <span class=\"question-item\"><strong class=\"q-number\">9</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"9\" oninput=\"setQ(9,this.value)\"></span>&nbsp;hair</p>\n<p><strong>Crime reference number allocated</strong></p>\n<p><span class=\"question-item\"><strong class=\"q-number\">10</strong> <input type=\"text\" spellcheck=\"false\" autocomplete=\"off\" class=\"paper-input\" data-q=\"10\" oninput=\"setQ(10,this.value)\"></span></p>\n</div>                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                                                                                                                            \n                                                                                                                                    </div>\n                                        </div>","audio":"./audio/test-21/section-1.mp3"},{"number":2,"transcript":["Good morning everyone. My name’s Janet Parker and I’m the human resources manager. We’re very happy to welcome you to your new apprenticeship. I hope that the next six months will be a positive and enjoyable experience for you.","I’d like to start with some general advice about being an apprentice. Most of you have very little or no experience of working for a big organisation and the first week or so may be quite challenging. There will be a lot of new information to take in but don’t worry too much about trying to remember everything. The important thing is to check with someone if you’re not sure what to do – you’ll find your supervisor is very approachable and won’t mind explaining things or helping you out. You’re here to learn so make the most of that opportunity. You’ll be spending time in different departments during your first week so make an effort to talk to as many people as possible about their work – you’ll make some new friends and find out lots of useful information.","As well as having a supervisor, you’ll each be assigned a mentor. This person will be someone who’s recently completed an apprenticeship and you’ll meet with them on a weekly basis. Their role is to provide help and support throughout your apprenticeship. Of course, this doesn’t mean they’ll actually do any of your work for you – instead they’ll be asking you about what goals you’ve achieved so far, as well as helping you to identify any areas for improvement. You can also discuss your more long-term ambitions with them as well.","————————","Now I just want to run through a few company policies for our apprenticeship scheme with you… Most importantly, the internet. As part of your job you’ll be doing some research online so obviously you’ll have unlimited access for that but please don’t use it for personal use – you’ll have your own phones for that.","Some of you have already asked me about flexible working. After your probationary three-month period – some of you will be eligible for this – but it will depend on which department you’re in and what your personal circumstances are. So please don’t assume you’ll automatically be permitted to do this.","I want to make sure there’s no confusion about our holiday policy. Apart from any statutory public holidays we ask that you don’t book any holidays until after your six-month apprenticeship has finished. Time off should only be taken if you are unwell. Please speak to your supervisor if this is going to be a problem.","You’ll be expected to work a 40-hour week but there may be opportunities to do overtime during busy periods. Although you’re not required to do this, it can be a valuable experience – so we advise you to take it up if possible. Obviously, we understand that people do have commitments outside work, so don’t worry if there are times when you are unavailable.","As you know, we don’t have a formal dress code here – you may wear casual clothes as long as they’re practical – and the only restriction for shoes we have is on high heels for health and safety reasons. Comfortable shoes like trainers are preferable.","There’s a heavily subsidised canteen on site where you can get hot meals or salads cheaply. Snacks and drinks are also provided – so we’ve decided to introduce a no packed lunch policy. This is partly to encourage healthy eating at work and partly to stop people from eating at their workstation, which is unhygienic.","OK moving on to …"],"cloze":"<p>Good morning everyone. My name’s Janet Parker and I’m the <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>. We’re very happy to welcome you to your new apprenticeship. I hope that the next six months will be a <span class=\"gap-wrap\"><b>2</b><input class=\"gap\" data-gap=\"1\" oninput=\"setGap(1,this.value)\" aria-label=\"Chỗ trống 2\"></span> for you.</p><p>I’d like to start with some general advice about being an apprentice. Most of you have very little or no experience of working for a big organisation and the first week or so may be quite challenging. There will be a lot of new information to take in but don’t worry too much about <span class=\"gap-wrap\"><b>3</b><input class=\"gap\" data-gap=\"2\" oninput=\"setGap(2,this.value)\" aria-label=\"Chỗ trống 3\"></span>. The important thing is to check with someone if you’re not sure what to do – you’ll find your supervisor is very <span class=\"gap-wrap\"><b>4</b><input class=\"gap\" data-gap=\"3\" oninput=\"setGap(3,this.value)\" aria-label=\"Chỗ trống 4\"></span> things or helping you out. You’re here to learn so make the most of that opportunity. You’ll be <span class=\"gap-wrap\"><b>5</b><input class=\"gap\" data-gap=\"4\" oninput=\"setGap(4,this.value)\" aria-label=\"Chỗ trống 5\"></span> during your first week so make an effort to talk to as many people as possible about their work – you’ll make some new friends and find out <span class=\"gap-wrap\"><b>6</b><input class=\"gap\" data-gap=\"5\" oninput=\"setGap(5,this.value)\" aria-label=\"Chỗ trống 6\"></span>.</p><p>As well as having a supervisor, you’ll each be assigned a mentor. This person will be someone who’s <span class=\"gap-wrap\"><b>7</b><input class=\"gap\" data-gap=\"6\" oninput=\"setGap(6,this.value)\" aria-label=\"Chỗ trống 7\"></span> and you’ll meet with them on a weekly basis. Their role is to provide help and <span class=\"gap-wrap\"><b>8</b><input class=\"gap\" data-gap=\"7\" oninput=\"setGap(7,this.value)\" aria-label=\"Chỗ trống 8\"></span>. Of course, this doesn’t mean they’ll actually do any of your work for you – instead they’ll be asking you about what goals you’ve achieved so far, as well as helping you to <span class=\"gap-wrap\"><b>9</b><input class=\"gap\" data-gap=\"8\" oninput=\"setGap(8,this.value)\" aria-label=\"Chỗ trống 9\"></span>. You can also discuss your more long-term ambitions with them as well.</p><p>————————</p><p>Now I just want to run through a few <span class=\"gap-wrap\"><b>10</b><input class=\"gap\" data-gap=\"9\" oninput=\"setGap(9,this.value)\" aria-label=\"Chỗ trống 10\"></span> scheme with you… Most importantly, the internet. As part of your job you’ll be doing some research online so <span class=\"gap-wrap\"><b>11</b><input class=\"gap\" data-gap=\"10\" oninput=\"setGap(10,this.value)\" aria-label=\"Chỗ trống 11\"></span> for that but please don’t use it for personal use – you’ll have your own phones for that.</p><p>Some of you have already asked me about flexible working. After your <span class=\"gap-wrap\"><b>12</b><input class=\"gap\" data-gap=\"11\" oninput=\"setGap(11,this.value)\" aria-label=\"Chỗ trống 12\"></span> – some of you will be eligible for this – but it will depend on which department you’re in and what your personal circumstances are. So please don’t assume you’ll <span class=\"gap-wrap\"><b>13</b><input class=\"gap\" data-gap=\"12\" oninput=\"setGap(12,this.value)\" aria-label=\"Chỗ trống 13\"></span>.</p><p>I want to make sure there’s no confusion about our holiday policy. Apart from any statutory public holidays we ask that you don’t book any holidays until after your <span class=\"gap-wrap\"><b>14</b><input class=\"gap\" data-gap=\"13\" oninput=\"setGap(13,this.value)\" aria-label=\"Chỗ trống 14\"></span>. Time off should only be taken if you are unwell. Please speak to your supervisor if this is going to be a problem.</p><p>You’ll be expected to work a 40-hour week but there may be <span class=\"gap-wrap\"><b>15</b><input class=\"gap\" data-gap=\"14\" oninput=\"setGap(14,this.value)\" aria-label=\"Chỗ trống 15\"></span> during busy periods. Although you’re not required to do this, it can be a valuable experience – so we advise you to take it up if possible. Obviously, we understand that <span class=\"gap-wrap\"><b>16</b><input class=\"gap\" data-gap=\"15\" oninput=\"setGap(15,this.value)\" aria-label=\"Chỗ trống 16\"></span>, so don’t worry if there are <span class=\"gap-wrap\"><b>17</b><input class=\"gap\" data-gap=\"16\" oninput=\"setGap(16,this.value)\" aria-label=\"Chỗ trống 17\"></span>.</p><p>As you know, we don’t have a formal dress code here – you may wear casual clothes as long as they’re practical – and the only restriction for shoes we have is on high heels for health and safety reasons. <span class=\"gap-wrap\"><b>18</b><input class=\"gap\" data-gap=\"17\" oninput=\"setGap(17,this.value)\" aria-label=\"Chỗ trống 18\"></span> are preferable.</p><p>There’s a <span class=\"gap-wrap\"><b>19</b><input class=\"gap\" data-gap=\"18\" oninput=\"setGap(18,this.value)\" aria-label=\"Chỗ trống 19\"></span> where you can get hot meals or salads cheaply. Snacks and drinks are also provided – so we’ve decided to introduce a no packed lunch policy. This is <span class=\"gap-wrap\"><b>20</b><input class=\"gap\" data-gap=\"19\" oninput=\"setGap(19,this.value)\" aria-label=\"Chỗ trống 20\"></span> at work and partly to stop people from eating at their workstation, which is unhygienic.</p><p>OK moving on to …</p>","clozeAnswers":["human resources manager","positive and enjoyable experience","trying to remember everything","approachable and won’t mind explaining","spending time in different departments","lots of useful information","recently completed an apprenticeship","support throughout your apprenticeship","identify any areas for improvement","company policies for our apprenticeship","obviously you’ll have unlimited access","probationary three-month period","automatically be permitted to do this","six-month apprenticeship has finished","opportunities to do overtime","people do have commitments outside work","times when you are unavailable","Comfortable shoes like trainers","heavily subsidised canteen on site","partly to encourage healthy eating"],"vocab":[{"word":"comfortable","ipa":"/ˈkʌm.fə.tə.bəl/","pos":"Tính từ (adj)","meaning":"thoải mái","example":"Comfortable shoes like trainers are preferable.","exampleVi":"Trong câu trên, “comfortable” mang nghĩa “thoải mái”."},{"word":"opportunity","ipa":"/ˌɒp.əˈtjuː.nɪ.tɪ/","pos":"Danh từ (n)","meaning":"cơ hội","example":"You’re here to learn so make the most of that opportunity.","exampleVi":"Trong câu trên, “opportunity” mang nghĩa “cơ hội”."},{"word":"department","ipa":"/dɪˈpɑːtm(ə)nt/","pos":"Danh từ (n)","meaning":"bộ phận/phòng ban","example":"After your probationary three-month period – some                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">11</strong> <strong class=\"q-number\">12</strong> <span>Which&nbsp;<strong>TWO</strong>&nbsp;pieces of advice for the first week of an apprenticeship does the manager give?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input data-limit=\"2\" type=\"checkbox\" value=\"A\" data-group=\"11-12\" onchange=\"setGroup('11-12',this.value,this,2)\"><span>get to know colleagues</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input data-limit=\"2\" type=\"checkbox\" value=\"B\" data-group=\"11-12\" onchange=\"setGroup('11-12',this.value,this,2)\"><span>learn from any mistakes</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input data-limit=\"2\" type=\"checkbox\" value=\"C\" data-group=\"11-12\" onchange=\"setGroup('11-12',this.value,this,2)\"><span>ask lots of questions</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">D</label><input data-limit=\"2\" type=\"checkbox\" value=\"D\" data-group=\"11-12\" onchange=\"setGroup('11-12',this.value,this,2)\"><span>react positively to feedback</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">E</label><input data-limit=\"2\" type=\"checkbox\" value=\"E\" data-group=\"11-12\" onchange=\"setGroup('11-12',this.value,this,2)\"><span>enjoy new challenges</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 13-14</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>Choose&nbsp;<strong>TWO</strong>&nbsp;letters,&nbsp;<strong>A-E</strong>.</p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                            \n                                                                                                                                                                                                                                            <div class=\"question-item\">\n                                                                                                    <span><strong class=\"q-number\">13</strong> <strong class=\"q-number\">14</strong> <span>Which&nbsp;<strong>TWO</strong>&nbsp;things does the manager say mentors can help with?</span></span>\n                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">A</label><input data-limit=\"2\" type=\"checkbox\" value=\"A\" data-group=\"13-14\" onchange=\"setGroup('13-14',this.value,this,2)\"><span>confidence-building</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">B</label><input data-limit=\"2\" type=\"checkbox\" value=\"B\" data-group=\"13-14\" onchange=\"setGroup('13-14',this.value,this,2)\"><span>making career plans</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">C</label><input data-limit=\"2\" type=\"checkbox\" value=\"C\" data-group=\"13-14\" onchange=\"setGroup('13-14',this.value,this,2)\"><span>completing difficult tasks</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">D</label><input data-limit=\"2\" type=\"checkbox\" value=\"D\" data-group=\"13-14\" onchange=\"setGroup('13-14',this.value,this,2)\"><span>making a weekly timetable</span></div>                                                                                                            <div class=\"paper-option\"><label class=\"option-letter\">E</label><input data-limit=\"2\" type=\"checkbox\" value=\"E\" data-group=\"13-14\" onchange=\"setGroup('13-14',this.value,this,2)\"><span>reviewing progress</span></div>                                                                                                                                                    </div>\n                                                                                                                                    </div>\n                                                                                                                                                            <h2 class=\"question-range\">Questions 15-20</h2>\n                                                                                    \n                                                                                <div class=\"task-copy\">\n                                            <p>What does the manager say about each of the following aspects of the company policy for apprentices?</p>\n<p>Write the correct letter,&nbsp;<strong>A</strong>,&nbsp;<strong>B</strong>&nbsp;or&nbsp;<strong>C</strong>, next to Questions.</p>\n<p><strong>Company policy for apprentices</strong></p>\n                                        </div>\n                                        <div class=\"question-list\">\n                                                                                                                                                                                                <div class=\"matching-dnd-questions\"><div class=\"question-item\"> • <span>Using the internet</span><span class=\"inline-choice\"><strong class=\"q-number\">15</strong><select data-q=\"15\" onchange=\"setQ(15,this.value)\" aria-label=\"Question 15\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>Flexible working</span><span class=\"inline-choice\"><strong class=\"q-number\">16</strong><select data-q=\"16\" onchange=\"setQ(16,this.value)\" aria-label=\"Question 16\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>Booking holidays</span><span class=\"inline-choice\"><strong class=\"q-number\">17</strong><select data-q=\"17\" onchange=\"setQ(17,this.value)\" aria-label=\"Question 17\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>Working overtime</span><span class=\"inline-choice\"><strong class=\"q-number\">18</strong><select data-q=\"18\" onchange=\"setQ(18,this.value)\" aria-label=\"Question 18\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>Wearing trainers</span><span class=\"inline-choice\"><strong class=\"q-number\">19</strong><select data-q=\"19\" onchange=\"setQ(19,this.value)\" aria-label=\"Question 19\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div>\n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class=\"question-item\"> • <span>Bringing food to work</span><span class=\"inline-choice\"><strong class=\"q-number\">20</strong><select data-q=\"20\" onchange=\"setQ(20,this.value)\" aria-label=\"Question 20\"><option value=\"\">—</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option></select></span></div></div>                                                                        <div class=\"option-bank\"><div><b>A</b> It is encouraged.</div><div><b>B</b> There are some restrictions.</div><div><b>C</b> It is against the rules.</div></div>\n                                                                    \n                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>\n                                        </div>","audio":"./audio/test-21/section-2.m4a"},{"number":3,"transcript":["TUTOR: OK, so what I’d like you to do now is to talk to your partner about your presentations on urban planning. You should have done most of the reading now, so I’d like you to share your ideas, and talk about the structure of your presentation and what you need to do next.","CARLA: OK Rob. I’m glad we chose quite a specific topic – cities built next to the sea. It made it much easier to find relevant information.","ROB: Yeah. And cities are growing so quickly – I mean, we know that more than half the world’s population lives in cities now.","CARLA: Yeah, though that’s all cities, not just ones on the coast. But most of the biggest cities are actually built by the sea. I’d not realised that before.","ROB: Nor me. And what’s more, a lot of them are built at places where rivers come out into the sea. But apparently this can be a problem.","CARLA: Why?","ROB: Well, as the city expands, agriculture and industry tend to spread further inland along the rivers, and so agriculture moves even further inland up the river. That’s not necessarily a problem, except it means more and more pollutants are discharged into the rivers.","CARLA: So these are brought downstream to the cities?","ROB: Right. Hmm. Did you read that article about Miami, on the east coast of the USA?","CARLA: No.","ROB: Well, apparently back in the 1950s they build channels to drain away the water in case of flooding.","CARLA: Sounds sensible.","ROB: Yeah, they spent quite a lot of money on them. But what they didn’t take into account was global warming. So they built the drainage channels too close to sea level, and now sea levels are rising, they’re more or less useless. If there’s a lot of rain, the water can’t run away, there’s nowhere for it to go. The whole design was faulty.","CARLA: So what are the authorities doing about it now?","ROB: I don’t know. I did read that they’re aiming to stop disposing of waste into the ocean over the next ten years.","CARLA: But that won’t help with flood prevention now, will it?","ROB: No. Really they just need to find the money for something to replace the drainage channels, in order to protect against flooding now. But in the long term they need to consider the whole ecosystem.","CARLA: Right. Really, though, coastal cities can’t deal with their problems on their own, can they? I mean, they’ve got to start acting together at an international level instead of just doing their own thing.","ROB: Absolutely. The thing is, everyone knows what the problems are and environmentalists have a pretty good idea of what we should be doing about them, so they should be able to work together to some extent. But it’s going to be a long time before countries come to a decision on what principles they’re prepared to abide by.","CARLA: Yes, if they ever do.","——————————","CARLA: So I think we’ve probably got enough for our presentation. It’s only fifteen minutes.","ROB: OK. So I suppose we’ll begin with some general historical background about why coastal cities were established. But we don’t want to spend too long on that, the other students will already know a bit about it. It’s all to do with communications and so on.","CARLA: Yes. We should mention some geographical factors, things like wetlands and river estuaries and coastal erosion and so on. We could have some maps of different cities with these features marked.","ROB: On a handout you mean? Or some slides everyone can see?","CARLA: Yeah, that’d be better.","ROB: It’d be good to go into past mistakes in a bit more detail. Did you read that case study of the problems there were in New Orleans with flooding a few years ago?","CARLA: Yes, We could use that as the basis for that part of the talk. I don’t think the other students will have read it, but they’ll remember hearing about the flooding at the time.","ROB: OK. So that’s probably enough background.","CARLA: So then we’ll go on to talk about what action’s being taken to deal with the problems of coastal cities.","ROB: OK. What else do we need to talk about? Maybe something on future risks, looking more at the long term, if populations continue to grow.","CARLA: Yeah. We’ll need to do a bit of work there, I haven’t got much information, have you?","ROB: No. We’ll need to look at some websites. Shouldn’t take too long.","CARLA: OK. And I think we should end by talking about international implications. Maybe we could ask people in the audience. We’ve got people from quite a lot of different places.","ROB: That’d be interesting, if we have time, yes. So now shall we …"],"cloze":"<p>TUTOR: OK, so what I’d like you to do now is to talk to your partner about your <span class=\"gap-wrap\"><b>1</b><input class=\"gap\" data-gap=\"0\" oninput=\"setGap(0,this.value)\" aria-label=\"Chỗ trống 1\"></span>. You should have done most of the reading now, so I’d like you to share your ideas, and talk about the structure of your presentation and what you need to do next.</p><p>CARLA: OK Rob. I’m glad we chose qu
