<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#244b40">
  <meta name="description" content="Dashboard lớp Kids 17 — MS. TRANG TRIEU EDUCATION.">
  <title>KIDS 17 | MS. TRANG TRIEU EDUCATION</title>
  <link rel="preconnect" href="https://script.google.com">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#f6f7f4;color:#243d34;font-family:Arial,sans-serif}
    body{display:flex;flex-direction:column;height:100vh;height:100dvh}
    header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:#fff;border-bottom:1px solid #dce4de}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .badge{background:#244b40;color:#fff;border-radius:10px;padding:9px 12px;font-size:16px;font-weight:700;white-space:nowrap}
    .name{font-size:14px;font-weight:700;line-height:1.4;letter-spacing:.03em}
    a{color:#244b40;font-size:14px;font-weight:700;text-underline-offset:3px}
    .open{flex:none;display:inline-flex;align-items:center;min-height:44px;padding:8px 10px;border:1px solid #cad9d0;border-radius:8px;text-decoration:none}
    a:focus-visible,button:focus-visible{outline:3px solid #bf6d00;outline-offset:3px}
    main{flex:1;min-height:0;position:relative}
    iframe{display:block;width:100%;height:100%;border:0;background:#f6f7f4}
    .help{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);padding:12px 16px;background:#fff;border:1px solid #cad9d0;border-radius:12px;box-shadow:0 4px 24px #183b2420;display:flex;align-items:center;gap:12px;font-size:14px;line-height:1.5}
    .help[hidden]{display:none}
    .help button{border:0;background:#edf2ee;border-radius:6px;color:#244b40;font-size:20px;width:44px;height:44px;flex:none;cursor:pointer}
    @media(max-width:520px){header{padding:6px 10px;gap:8px}.name{font-size:12px;max-width:140px}.badge{font-size:14px;padding:9px}.brand{gap:8px}.open{font-size:13px;padding:7px}.help{font-size:14px}}
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="badge">KIDS 17</span><span class="name">MS. TRANG TRIEU EDUCATION</span></div>
    <a class="open" href="https://script.google.com/macros/s/AKfycbzCzF_ApeWdqY8Z71-cWsC9qvsFAgSQQGtaaFfVDmLJ85w7F03kXCXqfwwb8GHeUyrH/exec?class=17" target="_blank" rel="noopener">Mở riêng ↗</a>
  </header>
  <main>
    <iframe title="Dashboard lớp Kids 17" src="https://script.google.com/macros/s/AKfycbzCzF_ApeWdqY8Z71-cWsC9qvsFAgSQQGtaaFfVDmLJ85w7F03kXCXqfwwb8GHeUyrH/exec?class=17" sandbox="allow-scripts allow-popups allow-forms allow-same-origin allow-popups-to-escape-sandbox allow-downloads allow-modals allow-storage-access-by-user-activation" allow="fullscreen" allowfullscreen></iframe>
    <aside class="help" id="help" hidden aria-label="Hỗ trợ mở dashboard">
      <span>Nếu dashboard chưa hiện, bố mẹ bấm <a href="https://script.google.com/macros/s/AKfycbzCzF_ApeWdqY8Z71-cWsC9qvsFAgSQQGtaaFfVDmLJ85w7F03kXCXqfwwb8GHeUyrH/exec?class=17" target="_blank" rel="noopener">Mở riêng</a> nhé.</span>
      <button type="button" aria-label="Đóng gợi ý">×</button>
    </aside>
  </main>
  <script>
    const help = document.getElementById('help');
    const hintTimer = setTimeout(() => { help.hidden = false; }, 18000);
    help.querySelector('button').addEventListener('click', () => { help.hidden = true; });
    // A cross-origin frame load does not prove that the app loaded successfully.
    // Keep a direct link available even when Google displays an error inside it.
    window.addEventListener('pagehide', () => clearTimeout(hintTimer), {once:true});
  </script>
</body>
</html>
