name: IELTS submission regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/ielts-submission/client.test.cjs
      - run: node tests/ielts-submission/cross-tab.test.cjs
      - run: DENY_LOCAL=1 node tests/ielts-submission/cross-tab.test.cjs
      - run: node tests/ielts-submission/runtime.test.cjs --only fullTest --full-runtime ielts-full-test/assets/full-durable.fc6ac12f64ec.js
      - run: node tests/ielts-submission/race.test.cjs --full-runtime ielts-full-test/assets/full-durable.fc6ac12f64ec.js
