name: IELTS 50 independent cache maintenance

on:
  schedule:
    - cron: '6,16,26,36,46,56 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ielts-50-cache-maintenance
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refresh IELTS 50 durable snapshots when due
        env:
          WARM_URL: "https://script.google.com/macros/s/AKfycbxwh2L2AesTRRIniypTInctBpqfH0KCFFk10_WGz5j-BZ9ZL7AiPNhYzCyboxTYuiu6KA/exec?api=1&class=IELTS%2050&action=warm&force=0"
        run: |
          response="$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 "$WARM_URL")"
          RESPONSE="$response" python - <<'PY'
          import json, os
          value = json.loads(os.environ["RESPONSE"])
          if value.get("ok") is not True or value.get("className") != "IELTS 50" or value.get("action") != "warm" or not isinstance(value.get("data"), dict):
              raise SystemExit("IELTS 50 maintenance response was not valid")
          PY

