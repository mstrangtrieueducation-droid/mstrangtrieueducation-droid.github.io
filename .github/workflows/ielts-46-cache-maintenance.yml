name: IELTS 46 independent cache maintenance

on:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ielts-46-cache-maintenance
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refresh IELTS 46 durable snapshots when due
        env:
          WARM_URL: "https://script.google.com/macros/s/AKfycbzLicsEIoBjZHSlMqRuGFoNman7ulwhGG3HVkWZZMfsziTJ8OGmkmTyVnrHFPdMf5Ep0g/exec?api=1&class=IELTS%2046&action=warm&force=0"
        run: |
          response="$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 "$WARM_URL")"
          RESPONSE="$response" python - <<'PY'
          import json, os
          value = json.loads(os.environ["RESPONSE"])
          if value.get("ok") is not True or value.get("className") != "IELTS 46" or value.get("action") != "warm" or not isinstance(value.get("data"), dict):
              raise SystemExit("IELTS 46 maintenance response was not valid")
          PY

