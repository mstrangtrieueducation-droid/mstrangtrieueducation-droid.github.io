name: IELTS 47 independent cache maintenance

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ielts-47-cache-maintenance
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refresh IELTS 47 durable snapshots when due
        env:
          WARM_URL: "https://script.google.com/macros/s/AKfycbwBk-QSr51nmU8GJb3JokdHgi-31u74BxzTgcyj6P78iNrGo3xkGY0F6MEoncf9sa2x/exec?api=1&class=IELTS%2047&action=warm&force=0"
        run: |
          response="$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 "$WARM_URL")"
          RESPONSE="$response" python - <<'PY'
          import json, os
          value = json.loads(os.environ["RESPONSE"])
          if value.get("ok") is not True or value.get("className") != "IELTS 47" or value.get("action") != "warm" or not isinstance(value.get("data"), dict):
              raise SystemExit("IELTS 47 maintenance response was not valid")
          PY

