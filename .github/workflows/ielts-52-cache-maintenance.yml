name: IELTS 52 independent cache maintenance

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ielts-52-cache-maintenance
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refresh IELTS 52 durable snapshots when due
        env:
          WARM_URL: "https://script.google.com/macros/s/AKfycbzLrVD3dmB401mp9guCgFCsPQRLwW4L-lpLNr2QN1KyrcGHGHewUgLSn5pniq_6Numl/exec?api=1&class=IELTS%2052&action=warm&force=0"
        run: |
          response="$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 "$WARM_URL")"
          RESPONSE="$response" python - <<'PY'
          import json, os
          value = json.loads(os.environ["RESPONSE"])
          if value.get("ok") is not True or value.get("className") != "IELTS 52" or value.get("action") != "warm" or not isinstance(value.get("data"), dict):
              raise SystemExit("IELTS 52 maintenance response was not valid")
          PY

