name: IELTS 48 academic summary
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ielts48-academic-summary
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh from prepared edge data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/ielts48/refresh-academic.mjs --publish
