name: KIDS encrypted fallback
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: kids-encrypted-fallback
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh encrypted fallback only
        env:
          KIDS_BACKUP_CLUSTERS: ${{ secrets.KIDS_BACKUP_CLUSTERS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/kids-backup.mjs
