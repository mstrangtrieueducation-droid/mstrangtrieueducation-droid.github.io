name: IELTS 48 independent cache maintenance

on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ielts-48-cache-maintenance
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh IELTS 48 durable snapshots when due
        env:
          WARM_URL: "https://script.google.com/macros/s/AKfycbxX87trZP1qwFIlsB5YUVnOls8GcUaNtqweoKnAS4tqmkKv7dhQvQFAdYl2kLnbCGD9RA/exec?api=1&class=IELTS%2048&action=warm&force=0"
        run: |
          for attempt in 1 2 3; do
            response="$(curl --fail --silent --show-error --location --retry 1 --retry-all-errors --connect-timeout 20 --max-time 120 "$WARM_URL")" || response=""
            if RESPONSE="$response" python - <<'PY'
          import json, os
          try:
              value = json.loads(os.environ["RESPONSE"])
          except Exception:
              raise SystemExit(1)
          data = value.get("data")
          if value.get("ok") is not True or value.get("className") != "IELTS 48" or value.get("action") != "warm" or not isinstance(data, dict):
              raise SystemExit(1)
          if data.get("warming") is not False or data.get("maintenanceHealthy") is not True:
              raise SystemExit(1)
          PY
            then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "IELTS 48 maintenance did not complete after retries" >&2
          exit 1
