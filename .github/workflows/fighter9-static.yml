name: Fighter 9 static profiles
on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: fighter9-static-profiles
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate Google source
        env:
          FIGHTER9_SOURCE_URL: ${{ secrets.FIGHTER9_SOURCE_URL }}
          FIGHTER9_EXPORT_SECRET: ${{ secrets.FIGHTER9_EXPORT_SECRET }}
        run: node .github/scripts/fighter9-static/sync.mjs
      - name: Publish verified files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- p8w8wz4f/data
          if git diff --cached --quiet; then exit 0; fi
          git commit --quiet -m 'Update verified Fighter 9 profiles'
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main
            if git push --quiet origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Build GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
