name: IELTS 45 independent cache maintenance

on:
  schedule:
    - cron: '1,11,21,31,41,51 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ielts-45-cache-maintenance
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refresh IELTS 45 durable snapshots when due
        env:
          WARM_URL: "https://script.google.com/macros/s/AKfycbyFyHtNZzNPH9xqk2XpsqUc6TjT2vI-QlpIbsWtW4c1pFQcet2LZGtecowj6jvCY8BTmw/exec?api=1&class=IELTS%2045&action=warm&force=0"
        run: |
          response="$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 "$WARM_URL")"
          RESPONSE="$response" python - <<'PY'
          import json, os
          value = json.loads(os.environ["RESPONSE"])
          if value.get("ok") is not True or value.get("className") != "IELTS 45" or value.get("action") != "warm" or not isinstance(value.get("data"), dict):
              raise SystemExit("IELTS 45 maintenance response was not valid")
          PY

