  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;color:#162a40;background:#f8fafc}
    body{display:flex;flex-direction:column}header{min-height:52px;padding:10px 18px;border-bottom:1px solid #dfe7ed;background:white;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .label{font-size:13px;color:#657784}#student{font-size:16px;font-weight:700}#className{font-size:13px;color:#435e75;background:#edf3f7;padding:5px 9px;border-radius:8px}
    main{position:relative;flex:1;min-height:0}iframe{border:0;width:100%;height:100%;display:block;background:white}iframe[aria-busy="true"]{visibility:hidden;pointer-events:none}
    #status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#f8fafc;text-align:center}#status[hidden]{display:none}
    .panel{max-width:460px;line-height:1.55}#message{font-size:17px}#help[hidden]{display:none}button,a{font:inherit}button{border:0;border-radius:8px;padding:10px 16px;background:#183b60;color:white;cursor:pointer}#original{display:block;margin-top:16px;color:#285879}
    @media(max-width:480px){header{padding:8px 12px;gap:6px}.label{font-size:12px}#student{font-size:15px}}
  </style>
  <script src="config.a69252c90690.js" defer></script>
  <script src="receiver.d566bb9ed4ce.js" defer></script>
  <script src="viewer.f4c6603203de.js" defer></script>
</head>
<body>
  <header><span class="label">Đang học với hồ sơ</span><strong id="student">…</strong><span id="className"></span></header>

    <iframe id="lesson" title="Bài học của con" aria-busy="true" referrerpolicy="no-referrer" allow="autoplay; fullscreen" allowfullscreen></iframe>
    <div id="status" role="status"><div class="panel"><p id="message">Đang mở bài học của con…</p><div id="help" hidden><button id="retry" type="button">Thử lại</button><a id="original" target="_blank" rel="noopener noreferrer">Mở bài gốc và tự điền tên, lớp</a></div></div></div>
  </main>
